services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kitapp
      POSTGRES_USER: kitapp
      POSTGRES_PASSWORD: kitapp
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kitapp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitapp -d kitapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kitapp
      MINIO_ROOT_PASSWORD: kitapp-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kitapp_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kitapp kitapp-local-secret;
      mc mb --ignore-existing local/kitapp-books;
      "

volumes:
  kitapp_postgres:
  kitapp_minio:
