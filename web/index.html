<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kitapp_reader2">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kitapp_reader2</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Readium's bundled demo CSS reserves 96px for controls that Kitapp
       renders in Flutter. Keep the embedded publication flush with its host. */
    html body #wrapper,
    html body #container,
    html body #container iframe {
      height: 100% !important;
      min-height: 100% !important;
      pointer-events: none;
    }
    flt-semantics:not([role]):not([flt-tappable]) {
      pointer-events: none !important;
    }
  </style>
  <script src="readiumReader.js" defer></script>
  <script>
    (() => {
      let pointerStart = null;

      window.addEventListener('pointerdown', (event) => {
        if (!document.querySelector('#container iframe')) return;
        pointerStart = { x: event.clientX, y: event.clientY };
      }, true);

      window.addEventListener('pointerup', (event) => {
        if (!pointerStart) return;
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        pointerStart = null;

        if (Math.abs(dx) <= 50 || Math.abs(dx) <= Math.abs(dy)) return;
        if (dx < 0) {
          window.kitappSwipeForward?.();
        } else {
          window.kitappSwipeBackward?.();
        }
      }, true);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
