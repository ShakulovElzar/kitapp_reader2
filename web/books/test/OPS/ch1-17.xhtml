<span id="id15"><div class="title2">
<p class="p">Кейтилин</p>
</div><p class="p1">Нед и девочки отсутствовали уже восемь дней, когда мейстер Лювин однажды ночью явился в комнату Брана с лампой для чтения и книгой отчетов.</p><p class="p1">— Мы давно уже не проверяли цифры, миледи, — сказал он. — Вы, конечно, хотите знать, во что обошелся нам визит короля.</p><p class="p1">Кейтилин поглядела на Брана, на его ложе и смахнула волосы с его лба. Она заметила, что они выросли, хорошо было бы подстричь.</p><p class="p1">— Нет необходимости изучать цифры, мейстер Лювин, — сказала она, не отрывая глаз от Брана. — Я знаю, чего нам стоил визит. Уберите отчетные книги.</p><p class="p1">— Миледи, войско короля не стесняло себя в еде. Нам нужно пополнить запасы, прежде…</p><p class="p1">Она прервала его:</p><p class="p1">— Я сказала — уберите книги. Пусть стюард займется нашими нуждами.</p><p class="p1">— У нас больше нет стюарда, — напомнил ей мейстер Лювин.</p><p class="p1">«Прямо серая крыса, — подумала она, — не хочет уходить».</p><p class="p1">— Пуль отправился на юг, чтобы устроить хозяйство лорда Эддарда в Королевской Гавани.</p><p class="p1">Кейтилин рассеянно кивнула:</p><p class="p1">— О да, помню. — Бран казался таким бледным. Она подумала, не переставить ли кровать под окно, чтобы утреннее солнце падало на него.</p><p class="p1">Мейстер Лювин оставил лампу в нише у двери и принялся возиться с фитилем.</p><p class="p1">— Есть несколько вопросов, которые нуждаются в вашем непосредственном внимании, миледи. Помимо стюарда, нам требуется капитан гвардии на место Джори, новый конюший…</p><p class="p1">Рассеянный взгляд ее глаз обратился к нему.</p><p class="p1">— Какой еще конюший? — Голос казался ударом кнута.</p><p class="p1">Мейстер был потрясен.</p><p class="p1">— Да, миледи. Халлен уехал на юг с лордом Эддардом, поэтому…</p><p class="p1">— Лювин, мой сын покалечен и умирает, а вы говорите о новом конюшем. Неужели вы думаете, что меня интересует, что будет с конюшней? Неужели вы думаете, что это вообще беспокоит меня? Я охотно зарежу каждую лошадь в Винтерфелле своими руками, если после этого Бран откроет глаза, вы понимаете это? Понимаете?</p><p class="p1">Он склонил голову.</p><p class="p1">— Да, миледи, но распоряжения…</p><p class="p1">— Я отдам нужные распоряжения, — сказал Робб.</p><p class="p1">Кейтилин не слышала, как он вошел, но сын стоял в дверях и глядел на нее. Она кричала, поняла Кейтилин с внезапным стыдом. Что творится с ней? Она так устала, и сердце все время болит.</p><p class="p1">Мейстер Лювин перевел взгляд от Кейтилин на ее сына.</p><p class="p1">— Я приготовил список тех, кто может заместить вакантные должности, — сказал он, предлагая Роббу бумагу, извлеченную из рукава.</p><p class="p1">Сын быстро просмотрел имена.</p><p class="p1">Он пришел снаружи, заметила Кейтилин, щеки его зарозовели от холода, волосы взлохматил ветер.</p><p class="p1">— Хорошие люди, — проговорил Робб. — Обсудим это завтра, — и вернул список мейстеру.</p><p class="p1">— Слушаюсь, милорд. — Бумага исчезла в рукаве.</p><p class="p1">— А теперь оставь нас, — попросил Робб. Мейстер Лювин поклонился и вышел. Робб закрыл за собой дверь и повернулся к матери. Она заметила, что он был с мечом. — Мать, что ты делаешь?</p><p class="p1">Кейтилин всегда думала, что Робб похож на нее и, как Бран, Рикон и Санса, пошел в породу Талли. Осенние волосы, синие глаза. Но теперь впервые она увидела в его лице нечто, унаследованное от Эддарда Старка, суровое и жесткое, словно сам север.</p><p class="p1">— Что я делаю? — отозвалась она удивленным голосом. — Как ты можешь спрашивать такое? Что, по-твоему, я могу здесь делать? Я забочусь о твоем брате. Я присматриваю за Браном.</p><p class="p1">— Значит, ты так называешь свое занятие? Ты не оставляла эту комнату с того мгновения, как Бран упал. Ты даже не вышла попрощаться к воротам, когда отец и девочки уезжали на юг.</p><p class="p1">— Я распрощалась с ними здесь. Из этого окна смотрела, как они уезжали. — Она молила Неда остаться и не уезжать сразу после того, как все произошло. Все переменилось, неужели он не понимает этого? Но уговоры остались безрезультатными. У него нет выбора, сказал Нед уезжая. — Но я не могу оставить сына даже на минуту, когда любое мгновение может оказаться последним в его жизни. Я должна быть с ним, если… если… — Она взяла вялую руку сына, переплела его пальцы своими собственными. Он стал таким хрупким и тонким, в руке не осталось силы, но она все еще могла ощущать под кожей живую теплоту.</p><p class="p1">Голос Робба смягчился:</p><p class="p1">— Бран не умрет, мать. Мейстер Лювин говорит, что самая большая опасность уже миновала.</p><p class="p1">— А что, если мейстер Лювин ошибается? Что, если я понадоблюсь Брану и меня не окажется рядом?</p><p class="p1">— Рикон тоже нуждается в тебе, — сурово проговорил Робб. — Ему только три года, и он не понимает, что происходит. Он думает, что все бросили его, и поэтому ходит за мной и цепляется за ноги. Я не знаю, что с ним делать. — Робб прикусил нижнюю губу, как делал, когда был маленьким. — Мать, и я тоже нуждаюсь в тебе. Я пытаюсь, но не могу… не могу сделать всего самостоятельно. — Голос его дрогнул от нахлынувших чувств, и Кейтилин вспомнила, что сыну только четырнадцать. Она хотела бы встать, подойти к Роббу, но Бран держал ее, и она не смела пошевелиться. Снаружи, у подножия башни, взвыл волк. И Кейтилин поежилась от этого звука.</p><p class="p1">— Это волк Брана. — Робб открыл окно и впустил ночной воздух в духоту комнаты. Вой сделался громче. Одинокий, полный отчаяния и скорби.</p><p class="p1">— Не надо, — сказала Кейтилин. — Брану нужно тепло.</p><p class="p1">— Ему нужна их песня, — сказал Робб. Где-то в Винтерфелле, вторя первому, завыл другой волк. Затем к ним присоединился третий голос, поближе. — Лохматый Песик и Серый Ветер, — проговорил Робб, слушая вздымающиеся и опадающие голоса. — Их можно различить, если хорошенько прислушаться.</p><p class="p1">Кейтилин дрожала от горя, от холода, от воя лютоволков. Ночь за ночью холодный ветер продувал огромный опустевший замок, и ничего не менялось; здесь лежал ее изувеченный мальчик, самый милый из ее детей, самый мягкий… Бран, любивший смеяться, лазать, мечтавший о рыцарстве. Все теперь пропало, она никогда не услышит его смеха. С рыданиями она высвободила свою руку и прикрыла уши, чтобы не слышать этого жуткого воя.</p><p class="p1">— Пусть они умолкнут, — всхлипнула она. — Я не могу терпеть этого, пусть они умолкнут, угомони их, убей их всех, если иначе нельзя, но пусть они умолкнут.</p><p class="p1">Она не помнила, как упала на пол, но, очнувшись, ощутила, как Робб поднимает ее своими сильными руками.</p><p class="p1">— Не бойся, мать. Они не причинят Брану вреда. — Он подвел ее к узкой постели в уголке комнаты и сказал: — Закрой глаза, отдохни. Мейстер Лювин говорил, что ты почти не спала после падения Брана.</p><p class="p1">— Я не могу заснуть, — пробормотала Кейтилин сквозь слезы. — Пусть простят меня боги, Робб, я не могу заснуть. Что будет, если он умрет, когда я засну, что будет, если он умрет, что будет, если он умрет… — Волки все еще выли. Вскрикнув, она вновь прикрыла уши. — О боги, закрой же окно!</p><p class="p1">— Если ты обещаешь мне выспаться. — Робб подошел к окну, но, отодвинув портьеру, услышал, что к скорбному вою лютоволков добавился еще один звук. — Собаки, — сказал он прислушиваясь. — Лают все собаки. Они никогда не делали этого прежде.</p><p class="p1">Кейтилин почувствовала, как дыхание застыло в ее горле. Поглядев вверх, увидела лицо, побледневшее разом в свете лампы.</p><p class="p1">— Пожар, — прошептал Робб.</p><p class="p1">— Пожар, — повторила она и сразу подумала о Бране. — Помоги мне, — сказала Кейтилин дрогнувшим голосом. — Помоги мне с Браном.</p><p class="p1">Робб как будто не слышал ее.</p><p class="p1">— Горит Библиотечная башня, — сказал он. Кейтилин заметила, как пляшет красный огонь за открытыми окнами. Она осела назад с облегчением: Брану ничто не грозило. Библиотека была на другой стороне двора, и огонь никак не мог перекинуться сюда.</p><p class="p1">— Слава богам, — прошептала Кейтилин.</p><p class="p1">Робб поглядел на нее, как на безумную.</p><p class="p1">— Мать, оставайся здесь, я вернусь, как только огонь погасят.</p><p class="p1">Он выбежал. Кейтилин сразу услышала голос сына за дверью, приказывающий стражам, караулившим комнату снаружи; потом все они вместе бросились вниз по лестнице, перепрыгивая разом через две или три ступеньки. Во дворе послышались крики «Огонь!», вопли, звук бегущих ног, ржание испуганных лошадей и отчаянный лай собак. Потом лютоволки умолкли, но она поняла, что все равно слушает эту какофонию.</p><p class="p1">Кейтилин мысленно произнесла благодарственную молитву семи ликам бога и подошла к сыну. За двором, из окон библиотеки, выбросило длинные языки пламени. Она поглядела на дым, поднимающийся в небо, и со скорбью подумала о книгах, которые Старки собирали не один век. А потом закрыла ставни.</p><p class="p1">Когда Кейтилин отвернулась от окна, рядом с ней в комнате оказался мужчина.</p><p class="p1">— Ты не должна была сейчас находиться в комнате, — проговорил он кислым голосом, — никого здесь не должно быть. — Невысокий грязный мужчина, в бурой одежде, пахнущей лошадьми. Кейтилин знала всех, кто работал на конюшне, но он был не из них. Худощавый блондин с длинными волосами и бледными глазами, утонувшими в костлявом лице. В кулаке его был кинжал.</p><p class="p1">Кейтилин посмотрела на нож, потом на Брана.</p><p class="p1">— Нет, — сказала она. Слово застряло в ее горле свистящим шепотом.</p><p class="p1">Должно быть, он все-таки услышал ее и пробормотал:</p><p class="p1">— Это милосердие; он уже мертв.</p><p class="p1">— Нет, — сказала Кейтилин теперь громче, голос вновь вернулся к ней. — Нет, ты не сделаешь этого!</p><p class="p1">Она бросилась к сыну, хотела позвать на помощь, но человек умел двигаться быстрее, чем она могла предполагать. Одна рука зажала ей горло и откинула назад голову, другая поднесла кинжал к ее шее. Воняло от него жутко.</p><p class="p1">Кейтилин подняла вверх обе руки и со всей силой надавила на лезвие, отводя его от своего горла. Она слышала, как убийца сопит возле ее уха. Пальцы сделались скользкими от крови, но она не могла выпустить кинжал. Рука плотнее зажимала рот Кейтилин, лишая воздуха. Она дернула головой в сторону и умудрилась впиться в ладонь зубами. Убийца охнул от боли. Она свела зубы вместе и рванула. Тогда он вдруг выпустил ее. Вкус чужой крови наполнил ее рот. Она вдохнула воздух и закричала. Тут он схватил ее за волосы и отбросил, она споткнулась и упала. И вот он уже стоял над ней, тяжело дыша и трясясь. Правая рука его, покрытая кровью, сжимала кинжал.</p><p class="p1">— Ты не должна была оказаться здесь, — тупо проговорил он.</p><p class="p1">Кейтилин заметила, как через открытую дверь позади него скользнула тень. Послышалось негромкое ворчание, совсем не грозное, даже непохожее на рычание. Он, должно быть, услышал, потому что начал поворачиваться, и тут волк прыгнул. Они упали вместе возле Кейтилин, не успевшей еще подняться. Волк впился прямо в горло мужчине. Крик его не прозвучал и секунды, зверь дернул головой и разодрал глотку.</p><p class="p1">Кровь хлынула на лицо Кейтилин теплым дождем.</p><p class="p1">Волк глядел на нее, челюсти его были обагрены, глаза светились золотом в темной комнате. Волк Брана, поняла Кейтилин. Как же иначе?</p><p class="p1">— Спасибо тебе, — прошептала она трепещущим голосом и подняла дрожащую руку. Волк подошел ближе, обнюхал пальцы, лизнул кровь мокрым и грубым языком. Облизав всю ее руку, он безмолвно повернулся назад, вскочил на постель Брана и лег рядом с ним. Кейтилин истерически захохотала.</p><p class="p1">Так и обнаружили их, когда Робб, мейстер Лювин и сир Родрик ворвались внутрь с половиной стражи Винтерфелла. Когда смех наконец оставил ее, Кейтилин завернули в теплое одеяло и отвели в ее собственные палаты. Старая Нэн раздела ее, уложила в обжигающе горячую ванну, смыла кровь мягкой тканью.</p><p class="p1">Потом пришел мейстер Лювин, чтобы перевязать ее раны. Глубокие порезы на пальцах дошли почти до самой кости, а с головы был выдран клок волос. Мейстер сказал, что боль только начинается, и дал ей макового молока, чтобы помочь уснуть. Наконец она закрыла глаза, а когда открыла их снова, ей сказали, что она проспала четыре дня. Кейтилин кивнула и села в постели. Все теперь казалось ей кошмаром, все, начиная с падения Брана, с ужасного сна, полного крови и горя, но боль в руках напоминала, что случившееся было реально. Голова ее кружилась, она ощущала слабость и странную решительность. Словно бы огромная тяжесть спала с ее плеч.</p><p class="p1">— Принесите мне немного хлеба и меда, — приказала она слугам. — И скажите мейстеру Лювину, что мои повязки надо переменить. — Они поглядели на нее с удивлением и бросились исполнять приказания. Кейтилин вспомнила, как вела себя до того, и устыдилась. Она бросила всех: детей, мужа, свой дом. Хватит! Она должна показать этим северянам, какими сильными бывают Талли из Риверрана.</p><p class="p1">Робб явился раньше, чем ей принесли еду. С ним вошли Родрик Кассель, воспитанник мужа Теон Грейджой, а завершал процессию Халлис Моллен, мускулистый стражник с квадратной каштановой бородой. Он назначен капитаном гвардии, сказал Робб. Сын был облачен в проваренную кожу и кольчугу, у пояса его висел меч.</p><p class="p1">— Кто это был? — спросила Кейтилин.</p><p class="p1">— Никто не знает его имени, — покачал головой Халлис Моллен. — Он родом не из Винтерфелла, миледи, но некоторые утверждают, что видели его здесь, около замка, в последние несколько дней.</p><p class="p1">— Значит, он из людей короля, — сказала она. — Или из Ланнистеров. Он мог остаться, когда остальные уехали.</p><p class="p1">— Возможно, — сказал Халлис. — При такой толпе, наполнявшей в эти дни Винтерфелл, трудно сказать, откуда он взялся.</p><p class="p1">— Он прятался в конюшне, — доложил Грейджой. — Это нетрудно было понять по запаху.</p><p class="p1">— И как он мог войти туда незамеченным? — спросила Кейтилин резким тоном.</p><p class="p1">Халлис Моллен казался пристыженным.</p><p class="p1">— Когда лорд Эддард увел часть коней на юг, а других мы отослали на север, в Ночной Дозор, стойла остались пустыми. Не так уж трудно спрятаться от конюшенных мальчишек. Возможно, его видел Ходор; поговаривали, что он ведет себя странно при всей его простоте. — Хал потряс головой.</p><p class="p1">— Мы обнаружили, где он спал, — вставил Роберт. — Под соломой нашлась кожаная мошна с девяноста семью оленями.</p><p class="p1">— Приятно знать, что жизнь моего сына оценили достаточно дорого, — с горечью проговорила Кейтилин.</p><p class="p1">Халлис Моллен в смятении поглядел на нее.</p><p class="p1">— Прошу прощения, миледи, вы говорите, что он намеревался убить вашего мальчика?</p><p class="p1">Грейджой посмотрел на нее с сомнением.</p><p class="p1">— Это безумие.</p><p class="p1">— Он явился за Браном, — ответила Кейтилин. — Он все бормотал, что я не должна была оказаться в опочивальне. Он поджег библиотеку, думая, что я брошусь туда спасать книги и возьму с собой стражу. Замысел сработал бы, если бы я наполовину не обезумела от горя.</p><p class="p1">— Но зачем кому-то убивать Брана? — сказал Робб. — Боги, он всего лишь маленький мальчик, беспомощный и находящийся в забытьи.</p><p class="p1">Кейтилин глянула на своего первенца вызывающе.</p><p class="p1">— Если ты собираешься править на Севере, значит, нужно уметь видеть смысл происходящего. Сам ответь на собственный вопрос. Зачем кому-то может понадобиться смерть спящего ребенка?</p><p class="p1">Прежде чем Робб успел ответить, вошли слуги с блюдом еды, присланной из кухни. Ее оказалось куда больше, чем просила Кейтилин: горячий хлеб, масло, мед, черная смородина с сахаром, кусок бекона, сваренное всмятку яйцо, ломоть сыра и кувшинчик мятного чая.</p><p class="p1">— Как там мой сын, мейстер? — Кейтилин поглядела на яства и обнаружила, что не ощущает аппетита.</p><p class="p1">Мейстер Лювин потупил глаза.</p><p class="p1">— Без перемен, миледи. — Именно этого ответа она и ожидала — не более и не менее. Руки Кейтилин пульсировали от боли, нож словно бы еще резал их. Она отослала слуг и поглядела на Робба.</p><p class="p1">— Ну, как насчет ответа?</p><p class="p1">— Кто-то боится, что Бран очнется, — предположил Робб. — Боится того, что он может сказать или сделать. Боится чего-то, что известно Брану.</p><p class="p1">Кейтилин ощутила гордость за сына.</p><p class="p1">— Очень хорошо. — Она повернулась к новому капитану гвардии. — Надо беречь Брана. Там, где побывал один убийца, может найтись и другой.</p><p class="p1">— Сколько стражи выделить ему? — спросил Хал.</p><p class="p1">— Пока лорд Эддард отсутствует, в Винтерфелле распоряжается мой сын, — ответила она.</p><p class="p1">Робб чуточку распрямился.</p><p class="p1">— Пусть один человек дежурит возле больного днем и ночью, один около двери и двое у подножия лестницы. Никто не должен входить к Брану без разрешения моей матери.</p><p class="p1">— Как вам угодно, милорд.</p><p class="p1">— Исполняйте немедленно, — приказала Кейтилин.</p><p class="p1">— И пусть его волк остается у него в комнате, — добавил Робб.</p><p class="p1">— Да, — сказала Кейтилин. И повторила еще раз: — Да.</p><p class="p1">Халлис Моллен поклонился и оставил покои.</p><p class="p1">— Леди Старк, — спросил сир Родрик, когда стражник ушел. — А вы, случайно, не заметили кинжал, которым воспользовался убийца?</p><p class="p1">— Обстоятельства не позволили мне разглядеть его, но за остроту поручусь, — проговорила Кейтилин с сухой улыбкой. — А почему вы спрашиваете?</p><p class="p1">— Мы обнаружили кинжал в его руке. Мне показалось, что кинжал этот слишком хорош для такого типа, поэтому я внимательно разглядел его. Клинок из валирийской стали, рукоять из кости дракона. Такой кинжал не мог оказаться в его руках просто так. Кто-то дал ему это оружие.</p><p class="p1">Кейтилин задумчиво кивнула:</p><p class="p1">— Робб, закрой дверь.</p><p class="p1">Сын с удивлением поглядел на нее, но выполнил распоряжение.</p><p class="p1">— То, что я скажу сейчас, не должно выйти за пределы комнаты, — сказала она. — Я хочу, чтобы вы дали мне клятву. Если справедлива даже часть моих подозрений, Нед и девочки едут навстречу смертельной опасности, и слово, попавшее в чужие уши, может стоить им жизни.</p><p class="p1">— Лорд Эддард для меня второй отец, — проговорил Теон Грейджой. — Клянусь.</p><p class="p1">— И я приношу клятву, — проговорил мейстер Лювин.</p><p class="p1">— Я тоже, — словно эхо, отозвался сир Родрик.</p><p class="p1">Она поглядела на своего сына.</p><p class="p1">— А ты, Робб?</p><p class="p1">Он согласно кивнул.</p><p class="p1">— Моя сестра Лиза полагает, что ее мужа лорда Аррена, десницу короля, убили Ланнистеры, — сказала Кейтилин. — Помнится, что Джейме Ланнистер не выехал на охоту в тот день, когда упал Бран. Он оставался в замке. — В комнате воцарилась смертельная тишина. — Итак, Бран едва ли сам упал с этой башни, — сказала она. — По-моему, его столкнули.</p><p class="p1">На лицах отразилось явное потрясение.</p><p class="p1">— Миледи, какое жуткое предположение, — проговорил Родрик Кассель. — Даже Цареубийца не пойдет на убийство невинного ребенка.</p><p class="p1">— В самом деле? — усмехнулся Теон Грейджой. — Сомневаюсь.</p><p class="p1">— Гордыне и честолюбию Ланнистеров нет предела, — проговорила Кейтилин.</p><p class="p1">— В прошлом мальчик всегда лазал уверенно, — задумчиво проговорил мейстер Лювин. — Он знал в Винтерфелле каждый камень.</p><p class="p1">— Боги! — ругнулся Робб, юное лицо его потемнело от гнева. — Если так, за это придется заплатить. — Он достал меч и взмахнул им в воздухе. — Я сам убью его.</p><p class="p1">Сир Родрик ощетинился:</p><p class="p1">— Убери оружие! Ланнистеры в сотне лиг<a href="ch2.xhtml#id4" class="a">[6]</a> отсюда. Никогда не извлекай свой меч, если не намереваешься немедленно воспользоваться им. Сколько раз мне повторять это, глупый мальчишка!</p><p class="p1">Пристыженный Робб вложил меч в ножны, вдруг вновь сделавшись ребенком. Кейтилин кивнула сиру Родрику:</p><p class="p1">— Я вижу на поясе моего сына сталь.</p><p class="p1">Старый мастер над оружием проговорил:</p><p class="p1">— Я решил, что настало время.</p><p class="p1">Робб тревожно поглядел на нее.</p><p class="p1">— Время настало уже давно, — сказала Кейтилин. — Скоро нам потребуются все мечи, и среди них не должно быть деревянных.</p><p class="p1">Теон Грейджой опустил ладонь на рукоять своего клинка и заверил:</p><p class="p1">— Миледи, если дойдет до оружия, мой дом в долгу перед вашим.</p><p class="p1">Мейстер Лювин потянул за цепочку, покоившуюся на шее.</p><p class="p1">— Пока мы располагаем лишь совпадением и хотим обвинить возлюбленного брата королевы. Она не станет слушать пустых разговоров. У нас должны быть доказательства, или же нам придется замолчать.</p><p class="p1">— Наши доказательства в кинжале, — проговорил сир Родрик. — Подобный клинок не может остаться неизвестным.</p><p class="p1">— Есть только одно место, где можно отыскать истину.</p><p class="p1">Кейтилин поняла.</p><p class="p1">— Кто-то должен направиться в Королевскую Гавань.</p><p class="p1">— Я поеду, — сказал Робб.</p><p class="p1">— Нет, — ответила она. — Твое место здесь. В Винтерфелле всегда должен сидеть Старк. — Она поглядела на сира Родрика, на его огромные белые бакенбарды, на мейстера Лювина в его сером одеянии, на молодого Грейджоя, смуглого и пылкого. Кого послать? Кому довериться? Тут она поняла и откинула назад одеяло. Перевязанные пальцы остались неподвижными, словно камень. Она выбралась из постели.</p><p class="p1">— Я должна ехать сама.</p><p class="p1">— Миледи, — проговорил мейстер Лювин, — разумно ли это? Безусловно, Ланнистеры отнесутся к вашему появлению с подозрением.</p><p class="p1">— А как насчет Брана? — спросил Робб. Бедный мальчишка совершенно смутился. — Неужели теперь ты оставишь его?</p><p class="p1">— Для Брана я уже сделала все, что могла, — ответила Кейтилин, положив перевязанную руку на плечо сына. — Его жизнь в руках богов и мейстера Лювина. Ты ведь сам напоминал мне, Робб, что нельзя забывать и о других детях.</p><p class="p1">— Вам потребуется сильная свита, миледи, — проговорил Теон.</p><p class="p1">— Я пошлю Хала с отрядом гвардейцев, — проговорил Робб.</p><p class="p1">— Нет, — решила Кейтилин. — Большой отряд привлечет нежелательное внимание. Я не хочу, чтобы Ланнистеры узнали о моем приезде.</p><p class="p1">Сир Родрик запротестовал:</p><p class="p1">— Позвольте по крайней мере мне сопровождать вас. Королевский тракт опасен для одиноких женщин.</p><p class="p1">— Я не поеду этим путем, — ответила Кейтилин. Потом подумала мгновение и согласно кивнула: — Да, двое всадников двигаются так же быстро, как и один, но много быстрее, чем длинная колонна, отягощенная фургонами и кибитками на колесах. Я рада вашему обществу, сир Родрик. Мы спустимся вдоль Белого Ножа до моря и найдем корабль в Белой гавани. Крепкие кони и свежий ветер доставят нас в Королевскую Гавань задолго до Неда и Ланнистеров. — А там, подумала она, мы увидим то, что должны увидеть.</p></span>
