<p class="p">Джон</p>
</div><p class="p1">Во дворе раздавался звон мечей. По груди наступавшего Джона под черной шерстью, вареной кожей и панцирем ледяными струйками сочился пот. Гренн споткнулся, шагнул вперед и неловко отразил удар. Когда он замахнулся мечом, Джон ударил под ним сбоку, угодив сзади в ногу юноши, и тот снова споткнулся. Отбив ответный выпад Гренна, он угодил в шлем. Когда тот попытался ударить сбоку, Джон отбросил его клинок и влепил бронированным кулаком в грудь. Гренн пошатнулся и уселся в снег. Джон выбил его меч ударом по пальцам, заставившим сидящего взвыть.</p><p class="p1">— Довольно! — Голос сира Аллисера Торне звенел валирийской сталью.</p><p class="p1">Гренн держался за руку.</p><p class="p1">— Бастард разбил мне кисть.</p><p class="p1">— Бастард подсек твои сухожилия, раскроил пустой череп и отрезал руку. Отрезал бы, будь у этих клинков лезвие. Впрочем, тебе повезло. Дозору, кроме разведчиков, нужны и конюхи. — Сир Аллисер махнул Джерену и Жабе. — Поставьте Зубра на ноги, он должен позаботиться о своих похоронах.</p><p class="p1">Джон отошел в сторону и снял шлем, пока другие юноши поднимали Гренна на ноги. Морозный утренний воздух прикоснулся к его лицу. Он оперся на меч, глубоко вздохнул и позволил себе короткое мгновение наслаждения победой.</p><p class="p1">— Это длинный меч, а не посох старца, — резко бросил сир Аллисер. — Или у вас ноги болят, лорд Сноу?</p><p class="p1">Джон ненавидел эту насмешливую кличку, которой сир Аллисер наградил его в первый же день упражнений. Мальчики подхватили ее, и теперь она раздавалась повсюду.</p><p class="p1">Опустив длинный меч в ножны, Джон ответил:</p><p class="p1">— Нет.</p><p class="p1">Торне шагнул к нему, скрипучая черная кожа сухо пришепетывала при ходьбе. Аккуратный мужчина пятидесяти лет, жесткий и сухощавый, седина в черных волосах, и глаза словно кусочки оникса.</p><p class="p1">— А теперь говори правду, — приказал он.</p><p class="p1">— Я устал, — признался Джон. Натруженная мечом рука его ныла, он уже начинал ощущать оставленные схваткой синяки.</p><p class="p1">— Это потому, что ты слабак.</p><p class="p1">— Я победил.</p><p class="p1">— Нет. Это Зубр проиграл.</p><p class="p1">Один из мальчишек фыркнул. Джон знал, что лучше не отвечать. Он побил всех, кого мог выставить против него сир Аллисер, но ничего не добился. Оружейных дел мастер выказывал лишь возмущение. Торне ненавидит его, решил Джон, впрочем, других мальчишек он ненавидит еще сильнее.</p><p class="p1">— Ну, на сегодня все, — сказал им Торне. — Новую порцию бестолковости нынче я уже не смогу переварить. Если за нами придут Иные, мне останется только молиться, чтобы у них нашлись и стрелки, поскольку вы годитесь только на мишени для стрел.</p><p class="p1">Следом за прочими Джон направился в арсенал. Он часто ходил здесь один. Группа, в которой он учился, состояла без малого из двадцати юношей, но ни одного из них он не смог бы назвать другом. В основном они были на два-три года старше его, однако таких, кто умел бы владеть оружием хотя бы вполовину хуже Робба в его четырнадцать, среди них не было. Быстрый Дарион опасался ударов. Пип пользовался мечом, как кинжалом. Джерен был слаб, как девица. Гренн нетороплив и неуклюж. Халдер рубил жестко, но постоянно открывался. И каждый новый день, проведенный среди них, заставлял Джона презирать этот сброд все больше и больше.</p><p class="p1">Оказавшись внутри, Джон, не обращая внимания на всех остальных, повесил меч и ножны на крюк, торчавший из каменной стены. А потом методично начал снимать кольчугу, кожу и пропитанное по́том шерстяное белье. В обоих концах длинной комнаты на железных жаровнях тлели угольки, но Джон обнаружил, что дрожит. Здесь холод никогда не оставлял его. Через несколько лет он вообще забудет, что такое тепло.</p><p class="p1">Усталость навалилась внезапно, когда он натянул грубую повседневную одежду из черной ткани. Джон сел на скамью, пальцы его возились с застежками плаща. Как холодно, подумал он, вспоминая теплые залы Винтерфелла, где горячая вода бежала в стенах, словно кровь в человеческом теле. В Черном замке тепла искать было негде. Стены его были холодны, а люди казались еще холоднее.</p><p class="p1">Никто не говорил ему, что в Ночном Дозоре придется так туго; никто, кроме Тириона Ланнистера. По дороге на север карлик открыл ему правду, но сделал это чересчур поздно. Джон подумал о том, знал ли его отец, как обстоят дела на Стене. Наверное, знал, решил он и ощутил новую боль.</p><p class="p1">Даже дядя забросил его в этом холодном месте на краю света. Здесь, наверху мира, знакомый ему остроумный Бенджен Старк сделался другой особой. Он был первым разведчиком и проводил свои дни и ночи с лордом-командующим Мормонтом, мейстером Эйемоном и другими высшими офицерами. Джон был предоставлен менее чем ласковому попечению сира Аллисера Торне.</p><p class="p1">Через три дня после их прибытия Джон услыхал, что Бенджен Старк собирается повести полдюжины человек на разведку в Зачарованный лес. Той же ночью он отыскал своего дядю в большом, обшитом деревом зале и попросил взять с собой. Бенджен коротко отказал.</p><p class="p1">— Это не Винтерфелл, — говорил он, разрезая мясо кинжалом и цепляя его вилкой. — На Стене человек получает лишь то, что заслуживает. Джон, ты пока не разведчик, ты — зеленый мальчишка, от которого еще пахнет летом.</p><p class="p1">Джон возразил глупым голосом:</p><p class="p1">— Но в именины мне будет уже пятнадцать, я почти взрослый!</p><p class="p1">Бенджен Старк нахмурился.</p><p class="p1">— Ты еще мальчишка и таковым останешься, пока сир Аллисер не скажет, что ты годен к службе в Ночном Дозоре. Если ты решил, что кровь Старков позволит тебе заслужить легкие почести, то ошибся. На Стене, принося присягу, мы отрекаемся от наших семей. Твой отец навсегда останется в моем сердце, но мои братья перед тобой. — Он показал кинжалом в сторону окружавших его людей, жестких холодных мужчин, облаченных в черное.</p><p class="p1">На следующий день Джон встал с рассветом, чтобы проводить дядю. Один из разведчиков, рослый и уродливый, пел непристойную песню, седлая своего коня, дыхание курилось парком в холодном утреннем воздухе. Бен Старк улыбался, но к племяннику обратился без улыбки:</p><p class="p1">— Сколько раз нужно мне говорить тебе нет, Джон? Переговорим, когда я вернусь.</p><p class="p1">А потом, провожая взглядом дядю, уводившего коня в тоннель, Джон вспомнил все, что говорил ему на Королевском тракте Тирион Ланнистер, и вдруг представил ярко, словно наяву, Бена Старка мертвым в алом пятне на снегу. От мысли этой ему сделалось нехорошо. Что за странные видения, в кого же он превращается? В своей одинокой каморке Джон отыскал волчонка и спрятал лицо в густой белый мех. Если он должен всегда быть один, значит, одиночество должно сделаться его броней. В Черном замке не было богорощи, в здешней небольшой септе служил пьяный септон, но Джон не мог найти в себе сил, чтобы помолиться старым или новым богам. Если эти боги существуют, подумал он, то они жестоки и безжалостны, словно зима.</p><p class="p1">Ему не хватало сводных братьев: крохи Рикона, с блестящими глазками выпрашивающего очередную конфету; Робба, соперника и лучшего друга, постоянно находящегося рядом; Брана, упрямого и любопытного, всегда желающего увязаться за Джоном и Роббом и присоединиться к ним в любых делах. Не хватало ему и девочек; даже Сансы, которая ни разу не назвала его по имени с той поры, когда она выросла настолько, чтобы понимать, что такое бастард. И Арья… ее ему не хватало еще больше, чем Робба, невысокой и бойкой, с расцарапанными коленками и перепутанными волосами, в порванном платье, отчаянной и своенравной. Арья всегда оказывалась не там, где надо — как и он сам, — и всегда умела заставить Джона улыбнуться. Он отдал бы все что угодно, чтобы оказаться сейчас с ней рядом, еще раз взлохматить ее волосы, увидеть ее гримасы, поддержать ее болтовню.</p><p class="p1">— Ты перебил мне руку, бастард.</p><p class="p1">Джон поднял глаза, услышав угрюмый голос. Над ним возвышался Гренн: толстая шея, красная рожа, рядом трое дружков. Джон знал Тоддера, невысокого уродливого парня с невнятной речью. Рекруты прозвали его Жабой. Другие двое оказались теми, кого Йорен прихватил с собой на север, — это были насильники, взятые в Перстах. Джон забыл их имена, он старался не разговаривать с ними. Грубые невежды, не знающие чести, они были противны ему.</p><p class="p1">Джон поднялся.</p><p class="p1">— Перебью и вторую, если ты вежливо попросишь. — Гренну уже исполнилось шестнадцать, ростом он на целую голову был выше Джона. Но это не испугало бастарда: каждого из них он победил во дворе.</p><p class="p1">— А может быть, это сделаем мы, — сказал один из насильников.</p><p class="p1">— Попробуй. — Джон потянулся за мечом, но кто-то перехватил его руку и заломил за спину.</p><p class="p1">— Из-за тебя нас считают плохими, — пожаловался Жаба.</p><p class="p1">— Ты был сквернавцем еще до того, как я встретил тебя, — ответил Джон. Парень, вцепившийся в его руку, надавил, боль пронзила плечо, но Джон молчал.</p><p class="p1">Жаба подступил ближе.</p><p class="p1">— У этого маленького лорденыша большой рот, — заявил он, блеснув крохотными свиными глазками. — А это мамочкин рот, бастард? И кем же она у нас будет, не шлюхой ли? Как ее звать? А то, может, я с ней переспал бы разок-другой. — Он расхохотался.</p><p class="p1">Джон вывернулся угрем и ударил пяткой между ног мальчишку, державшего его. Раздался громкий крик боли, и Джон освободился. Бросившись на Жабу, он повалил его спиной на скамью и, ухватив обеими руками за горло, ударил затылком об утоптанную землю.</p><p class="p1">Двое из Перстов перехватили Джона и грубо отбросили в сторону. Гренн начал бить его ногами. Джону оставалось только одно — откатываться от ударов. Их прервал грохочущий голос, прозвучавший в полутьме арсенала:</p><p class="p1">— ПРЕКРАТИТЬ! НЕМЕДЛЕННО!</p><p class="p1">Джон поднялся на ноги. Донал Нойе гневно смотрел на них.</p><p class="p1">— Для драк отведен двор, — проговорил оружейник. — Все ваши ссоры улаживайте снаружи, или я приму их на свой счет. Вам это не понравится.</p><p class="p1">Жаба сидел на полу, ощупывая затылок. На пальцах его оказалась кровь.</p><p class="p1">— Он пытался убить меня.</p><p class="p1">— Верно, я видел это, — вставил один из насильников.</p><p class="p1">— Он перебил мне руку, — вновь проговорил Гренн.</p><p class="p1">Оружейник уделил руке самый короткий взгляд.</p><p class="p1">— Синяк, быть может, ушиб. Мейстер Эйемон даст тебе мазь. Ступай с ним, Тоддер, покажи голову. А все остальные по своим местам. Кроме тебя, Сноу. Останься.</p><p class="p1">Когда все остальные вышли, Джон тяжело опустился на длинную деревянную скамью, забыв о взглядах, которые молчаливо сулили будущую компенсацию. Рука его пульсировала от боли.</p><p class="p1">— Дозор нуждается в каждом человеке, которого может получить, — проговорил Донал Нойе, когда они оказались вдвоем. — Даже таком, как Тоддер! Ты не заслужишь никаких почестей, если убьешь его.</p><p class="p1">Джон гневно вспыхнул.</p><p class="p1">— Он сказал, что моя мать…</p><p class="p1">— …шлюха. Я слыхал. Ну и что?</p><p class="p1">— Лорд Эддард Старк не из тех людей, кто спит со шлюхами, — едким голосом проговорил Джон. — Его честь…</p><p class="p1">— …не помешала ему родить бастарда. Так?!</p><p class="p1">Джон похолодел от ярости.</p><p class="p1">— Могу я уйти?</p><p class="p1">— Ты уйдешь, когда я прикажу тебе.</p><p class="p1">Джон угрюмо смотрел на дымок, курящийся над жаровней, наконец Нойе взял его за подбородок грубыми пальцами, повернул голову в сторону.</p><p class="p1">— Смотри на меня, когда я разговариваю с тобой, мальчишка.</p><p class="p1">Джон поглядел. Грудь и пузо оружейника напоминали два бочонка с элем. Плосконосый, он всегда казался небритым. Левый рукав его черной шерстяной туники был пристегнут к плечу серебряной застежкой в форме длинного меча.</p><p class="p1">— Слова не сделают твою мать шлюхой. Она останется собой, и все слова Жабы этого не изменят. А ты знаешь, что у нас на Стене есть люди, рожденные шлюхами?</p><p class="p1">Мать моя не из тех, подумал Джон. Он ничего не знал о матери, Старк не рассказывал сыну о ней. И все же она снилась ему по ночам так часто, что он почти помнил ее лицо. Во снах она приходила прекрасной, знатной и глядела на него добрыми глазами.</p><p class="p1">— Ты полагаешь, что тебе, бастарду знатного лорда, пришлось туго? — продолжал оружейник. — А вот мальчишка Джерен — сын септона, а Коттер Пайк — сын самой настоящей трактирной шлюхи. Теперь он командует Восточным Дозором у моря.</p><p class="p1">— Мне все равно, — отвечал Джон. — Они мне безразличны, как безразличны мне вы, Торне, Бенджен Старк и все остальные. Я ненавижу это место. Здесь… слишком холодно.</p><p class="p1">— Да, здесь холодно, сурово и скучно, это Стена, и такие люди ходят по ней. Ничуть непохожие на те сказки, которыми потчевала тебя нянька? Так что можешь насрать на эти сказки и на свою няню. Такая здесь жизнь, и тебе предстоит такая же судьба, как и всем остальным.</p><p class="p1">— Жизнь, — с горечью повторил Джон. Оружейник мог говорить о жизни. Он знал ее. Нойе надел черное после того, как потерял руку во время осады Штормового Предела. Перед тем он был кузнецом у брата короля Станниса Баратеона. Донал видел все Семь Королевств от края до края. Он пировал, знал девок и сражался в сотне битв. Говорили, что именно Донал Нойе выковал для короля боевой топор, тот самый, которым Роберт лишил жизни Рейегара Таргариена возле Трезубца. Донал пережил все, чего не суждено испытать Джону, и уже в зрелом возрасте, на четвертом десятке, получил скользящий удар топора. Рана загнила так, что пришлось отнять всю руку. Только тогда изуродованный Донал Нойе отправился на Стену, где его жизнь, можно считать, закончилась.</p><p class="p1">— Да, жизнь, — отвечал Нойе. — А длинная или короткая — это зависит от тебя, Сноу. Судя по пути, на который ты вступил, однажды ночью один из братьев перережет тебе горло.</p><p class="p1">— Это не мои братья, — отрезал Джон. — Они ненавидят меня, потому что я лучше их.</p><p class="p1">— Нет, они ненавидят тебя потому, что ты ведешь себя так, как будто считаешь себя лучше их. Они видят в тебе воспитанного в замке бастарда, который считает себя маленьким лордом. — Оружейник нагнулся ближе. — Ты не лорденыш, помни об этом. Ты Сноу, а не Старк. Ты — бастард и задира.</p><p class="p1">— Задира?! — Джон едва не поперхнулся. Обвинение оказалось столь несправедливым, что он буквально лишился дыхания. — Это они напали на меня. Их было четверо.</p><p class="p1">— Четверо, которых ты унизил во дворе. Четверо, которые боятся тебя. Я слежу за вашими боями. Ты не учишься в поединках. Дай тебе острый меч, и они будут мертвы; я знаю это, и они тоже. Ты не предоставляешь им даже шанса. Ты позоришь их. Неужели это тешит твою гордость?</p><p class="p1">Джон помедлил. Он радовался победам. Почему бы и нет? Но оружейник лишал его теперь и последнего утешения; получалось, что он делает что-то скверное.</p><p class="p1">— Они же старше меня, — сказал он оборонительным тоном.</p><p class="p1">— Они сильнее, старше и выше, это правда. Но, держу пари, мастер над оружием научил тебя в Винтерфелле сражаться и с теми, кто выше тебя. Кто это, какой-нибудь старый рыцарь?</p><p class="p1">— Сир Родрик Кассель, — с опаской отвечал Джон. Он чувствовал ловушку, она смыкалась вокруг него.</p><p class="p1">Донал Нойе склонился вперед к лицу Джона.</p><p class="p1">— А теперь подумай вот о чем, парень. Никто из них до сира Аллисера не имел дел с оружейных дел мастерами. Отцы их были фермерами, погонщиками фургонов, браконьерами, кузнецами, рудокопами, наемными гребцами на галеях. Всех своих знаний о боевом мастерстве они поднабрались между палубами, в переулках старой части Ланниспорта, в борделях и тавернах у Королевского тракта. Возможно, прежде чем попасть сюда, им удалось несколько раз постучать палками, но поверь мне, ни один из двадцати не имел денег, чтобы купить настоящий меч. — Взгляд его оставался мрачным. — Теперь вы ощущаете вкус своих побед, лорд Сноу?</p><p class="p1">— Не зови меня так! — резко сказал Джон, но гнев его поутих. Он вдруг почувствовал себя пристыженным и виноватым. — Я никогда… я не думал…</p><p class="p1">— Тогда подумай, — остерег его Нойе. — Иначе придется спать с кинжалом под подушкой. Теперь ступай.</p><p class="p1">Когда Джон оставил арсенал, был почти полдень. Лучи солнца пробивались сквозь облака. Джон повернулся к светилу спиной и возвел глаза к Стене, искрящейся синим хрусталем под солнечными лучами. Даже после всех этих недель вид ее невольно заставлял трепетать его сердце. Столетиями ветер нес пылинки, ранившие ее, шлифовавшие, покрывавшие пленкой… нередко она отливала серостью пасмурного неба. Но когда солнце освещало ее в ясный день, Стена горела собственным светом: колоссальный белый утес, выраставший до половины неба.</p><p class="p1">— Руки человека не возводили более великого сооружения, — сказал ему Бенджен Старк, когда они впервые заметили Стену с Королевского тракта.</p><p class="p1">— И вне сомнения, более бесполезного, — добавил Тирион Ланнистер с ухмылкой. Но даже Бес замолчал, когда они подъехали ближе.</p><p class="p1">До Стены еще было много миль… Бледно-синяя полоса на севере уходила на восток и запад; могучая и ровная, она как будто бы отмечала конец мира. Когда они наконец заметили Черный замок, его деревянные дома и каменные башни показались горсткой игрушек, брошенных на снег возле огромной ледяной горы. Древняя твердыня Черных Братьев была не похожа на Винтерфелл, она ничуть не напоминала замок. У нее не было стен, ее нельзя было защитить ни с юга, ни с запада; все внимание Ночного Дозора было направлено только на север, где и возвышалась Стена. Она поднималась почти на семьсот футов,<a href="ch2.xhtml#id3" class="a">[7]</a> и в три раза превышала высоту самой высокой башни Черного замка.</p><p class="p1">Отец говорил, что по верху Стены может разом проехать дюжина вооруженных рыцарей. Призрачные, если смотреть снизу, катапульты и чудовищные деревянные краны, подобные скелетам огромных птиц, караулили наверху; среди них ходили люди, крохотные, как муравьи.</p><p class="p1">Вот и сейчас, выйдя из арсенала, Джон ощутил тот же трепет, как и в тот день на Королевском тракте, когда он впервые увидел Стену. Такова уж она. Иногда он забывал о ней, как забывают о небе или земле под ногами, но бывали мгновения, когда, казалось, ничего, кроме Стены, на свете не существует. Она была старше Семи Королевств. И когда Джон поднимал голову к ее гребню, голова его шла кругом. Он буквально чувствовал всю тяжесть давящего на него льда, словно бы Стена готова была разрушиться, а с ее падением мог рухнуть весь мир.</p><p class="p1">— Гадаешь, что там за ней? — послышался знакомый голос.</p><p class="p1">Джон оглянулся.</p><p class="p1">— Ланнистер. Я не видел… то есть я думал, что я здесь один.</p><p class="p1">Закутанный в меха, Тирион Ланнистер казался настоящим медвежонком.</p><p class="p1">— Говорят, что полезно заставать людей врасплох. Никогда не знаешь, что можно тогда узнать.</p><p class="p1">— От меня ничего не узнаешь, — усмехнулся Джон. Он нечасто встречал карлика после окончания путешествия. Тириона Ланнистера, брата королевы, принимали в Ночном Дозоре, как почетного гостя. Лорд-командующий выделил ему комнаты в Королевской башне, носившей это имя, несмотря на то что ни один король не посещал ее целый век. Ланнистер обедал за собственным столом Мормонта, все свои дни проводил, разъезжая по Стене, а ночами играл в кости и карты и пил вместе с сиром Аллисером, Боуэном Маршем и другими высшими офицерами.</p><p class="p1">— О, я учусь всему, где бы ни оказался. — Человечек указал на Стену узловатой черной палкой. — Как там я говорил… интересно получается, когда один человек строит стену, другому немедленно нужно узнать, что находится на другой стороне. — Он наклонил голову набок и поглядел на Джона разноцветными глазами. — А ты хочешь узнать, что находится на другой стороне, так ведь?</p><p class="p1">— Ничего особенного, — проговорил Джон. Он мечтал уехать с Бендженом Старком на разведку, погрузиться в тайны Зачарованного леса, хотел сразиться с дикарями Манса-налетчика, охранять страну от Иных, но о том, чего он хотел, лучше было не говорить. — Разведчики рассказывают, что там только леса, горы и замерзшие озера, много снега и льда.</p><p class="p1">— А еще там водятся грамкины и снарки, — проговорил Тирион. — Не следует забывать про них, лорд Сноу, иначе зачем же выстроили такую большую штуковину.</p><p class="p1">— Не называй меня лордом Сноу.</p><p class="p1">Карлик приподнял бровь.</p><p class="p1">— Ты бы предпочел зваться Бесом? Дай людям только заметить, что слова ранят тебя, и тебе никогда не избавиться от насмешек. А если к тебе прилепили кличку, прими ее и сделай своим собственным именем. Тогда они не сумеют больше ранить тебя. — Он указал палкой в сторону. — Давай-ка пройдемся. Сейчас в столовой подают какой-то мерзкий отвар, а мне бы хотелось чего-то горячего.</p><p class="p1">Джон тоже был голоден, а поэтому направился вместе с Ланнистером, подгоняя свой шаг под раскачивающуюся походку карлика. Поднимался ветер, и было слышно, как кряхтят старые деревянные дома, как вновь и вновь хлопает вдали забытая тяжелая ставня. На повороте, глухо ухнув, с крыши перед ними съехал целый снежный пласт.</p><p class="p1">— Не вижу твоего волка, — сказал Ланнистер по дороге.</p><p class="p1">— Я посадил его на цепь в старой конюшне, там, где мы занимаемся. Сейчас всех лошадей держат в восточных конюшнях, поэтому он никому не мешает. Остальное время он проводит со мной. А сплю я в башне Хардина.</p><p class="p1">— Это та, с поломанными зубцами? Та, возле которой на груде щебня стоит камень, прислонившись к стене прямо как наш благородный король Роберт после долгой попойки? Я думал, она давно заброшена.</p><p class="p1">Джон пожал плечами:</p><p class="p1">— До того, где ты спишь, здесь никому нет дела. Дома в основном пусты, выбирай себе любую келью.</p><p class="p1">Когда-то Черный замок вмещал четыре тысячи воинов вместе с конями, слугами и оружием. Теперь в нем обитала едва ли десятая доля прежнего числа защитников Стены, и замок уже начинал разрушаться.</p><p class="p1">Смешок Тириона Ланнистера струйкой взвился в холодный воздух.</p><p class="p1">— Постараюсь напомнить твоему отцу, чтобы он арестовал несколько каменщиков и отправил сюда, прежде чем твоя башня рухнет.</p><p class="p1">Джон понимал насмешку, но не видел смысла в отрицании правды. Некогда Дозор соорудил девятнадцать больших крепостей вдоль Стены, но теперь мог пользоваться лишь тремя: Восточной крепостью, расположенной на сером, продутом ветрами берегу; Сумеречной башней у подножия гор, в которые упиралась своим концом Стена; и Черным замком между ними на Королевском тракте. Остальные крепости, давно заброшенные, превращались в унылые скорбные руины, где холодные ветры свистели в черных окнах и лишь духи усопших выходили на боевые парапеты.</p><p class="p1">— Лучше спать одному, — упрямо проговорил Джон. — Все боятся Призрака.</p><p class="p1">— Мудрые ребята, — усмехнулся Ланнистер, меняя тему. — Говорят, что твой дядя слишком долго отсутствует.</p><p class="p1">Джон вспомнил видение, представившееся ему при расставании, когда он разозлился на дядю — Бенджена Старка, распростертого в снегу, — и быстро отвернулся. Карлик умел ощущать чужие мысли, и Джон не хотел, чтобы спутник заметил вину в его глазах.</p><p class="p1">— Он обещал вернуться к моим именинам, — заметил Джон. Но именины пришли и ушли, никем не замеченные, две недели назад. — Они разыскивали сира Уэймара Ройса, отец его — знаменосец у лорда Аррена. Дядя Бенджен говорил, что собирается добраться до самой Сумеречной башни и даже подняться в горы.</p><p class="p1">— Я слышал, что в последнее время пропало довольно много разведчиков, — проговорил Ланнистер, поднимаясь на ступени зала. Он ухмыльнулся и распахнул дверь. — Должно быть, грамкины в этом году голодны.</p><p class="p1">В просторном зале было холодно, невзирая на огонь, ревущий в большом очаге. Вороны сидели на перекладинах потолка. Выслушивая крики над головой, Джон принял чашу похлебки и ломоть черного хлеба от дежурных поваров. Гренн, Жаба и кое-кто из остальных сидели за скамьями возле тепла, они смеялись и перебранивались грубыми голосами. Джон задумчиво посмотрел на них, а потом выбрал себе место в дальнем конце зала, подальше от остальных едоков.</p><p class="p1">Тирион Ланнистер сел напротив него, с подозрением принюхиваясь к похлебке.</p><p class="p1">— Ячмень, лук, морковка, — пробормотал он. — Нужно сказать поварам, что репка — это не мясо.</p><p class="p1">— Зато бульон бараний. — Джон стащил перчатки и принялся греть руки над паром, поднимающимся из чаши. Запах наполнил его рот слюной.</p><p class="p1">— Сноу.</p><p class="p1">Джон узнал голос Аллисера Торне, но теперь в нем слышалась еще незнакомая нотка. Он повернулся.</p><p class="p1">— Лорд-командующий желает немедленно видеть тебя.</p><p class="p1">На миг Джон слишком испугался, чтобы пошевельнуться. Зачем лорду-командующему видеть его? Наверное, что-то узнали о Бенджене, подумал он в отчаянии. Он погиб, видение оправдалось.</p><p class="p1">— Речь идет о моем дяде? — выпалил он. — Он вернулся?</p><p class="p1">— Лорд-командующий не привык ждать, — сказал сир Аллисер. — А я не привык, чтобы бастарды обсуждали мои приказы.</p><p class="p1">Тирион Ланнистер повернулся на скамье и поднялся.</p><p class="p1">— Прекратите, Торне. Вы только напрасно пугаете мальчишку.</p><p class="p1">— Не вмешивайтесь в дела, вас не касающиеся, Ланнистер. Ваше место не здесь.</p><p class="p1">— Конечно же, мое место при дворе, — улыбнулся карлик. — Но одно слово, сказанное в нужное ухо, и вы умрете кислым старцем, прежде чем получите другого мальчишку на воспитание. А теперь скажите Сноу, почему Старый Медведь хочет видеть его. Что-то случилось с его дядей?</p><p class="p1">— Нет, — проворчал сир Аллисер. — Дело совершенно в другом. Этим утром прилетела птица из Винтерфелла, весть касается его брата. Его сводного брата.</p><p class="p1">— Бран, — выдохнул Джон, вскакивая на ноги. — Что-то случилось с Браном!</p><p class="p1">Тирион Ланнистер положил руку на его плечо.</p><p class="p1">— Джон, — сказал он, — мне искренне жаль.</p><p class="p1">Джон едва слышал его. Смахнув руку Тириона, он выскочил из зала. Захлопнув дверь, он побежал прямо через сугробы старого снега. Когда стражники пропустили его внутрь башни, он бросился наверх, перескакивая через две ступеньки. Перед лордом-командующим он появился в мокрых сапогах и с отчаянием во взоре.</p><p class="p1">— Бран, — проговорил Джон. — Что там сказано о Бране?</p><p class="p1">Джиор Мормонт, лорд-командующий Ночного Дозора, ворчливый старик с огромной лысиной во всю голову и клокастой седой бородой, сидел, держа ворона на руке и скармливая ему зернышки.</p><p class="p1">— Мне говорили, что ты умеешь читать.</p><p class="p1">Он стряхнул птицу, отлетевшую к окну; хлопая крыльями, ворон опустился на подоконник, наблюдая за Мормонтом, извлекшим свиток бумаги и передавшим его Джону.</p><p class="p1">— Зерно, — пробормотала птица хриплым голосом. — Зерно, зерно.</p><p class="p1">Палец Джона ощутил очертания лютоволка на белом воске сломанной печати. Он узнал почерк Робба, но буквы сливались, пока он пытался их прочитать. Джон понял, что плачет. И сквозь слезы осознал смысл этих слов и поднял голову.</p><p class="p1">— Он проснулся, — сказал он. — Боги вернули его назад.</p><p class="p1">— Калеку, — отвечал Мормонт. — Мне очень жаль, мальчик, дочитай до конца.</p><p class="p1">Он поглядел на слова, но они ничего не значили. Ничего более не значили, раз Бран остается в живых.</p><p class="p1">— Мой брат будет жить, — сказал он Мормонту.</p><p class="p1">Лорд-командующий покачал головой, набрал целый кулек зерна и свистнул. Ворон перелетел на его плечо с криком:</p><p class="p1">— Жить, жить.</p><p class="p1">Джон побежал вниз по лестнице с улыбкой на губах и письмом Робба в руках.</p><p class="p1">— Мой брат будет жить, — сообщил он стражам. Они обменялись взглядами. Он вбежал в общий зал, где Тирион Ланнистер доканчивал трапезу. Он подхватил карлика под мышки, подбросил в воздух и закружил вокруг себя с возгласом: — Бран будет жить! — Ланнистер казался изумленным. Джон опустил его и сунул в руку бумагу. — Вот, читай.</p><p class="p1">Вокруг собирались, поглядывая на него с любопытством. Гренн оказался в нескольких шагах от Джона. Рука его была обмотана толстой шерстяной повязкой. Он казался встревоженным и несчастным, а вовсе не угрожающим. Джон подошел к нему. Гренн отодвинулся, выставив вперед обе руки.</p><p class="p1">— Теперь держись от меня подальше, бастард!</p><p class="p1">Джон улыбнулся:</p><p class="p1">— Прости меня за разбитую руку. Робб однажды ударил меня таким же точно образом, только деревянным мечом. Больно было, как в седьмом пекле. Но тебе сейчас еще больнее. Знаешь, если хочешь, давай я научу тебя контрприему.</p><p class="p1">Его услышал Аллисер Торне.</p><p class="p1">— Лорду Сноу угодно принять на себя мои обязанности. Да я скорей научу твоего волка жонглировать, чем ты этих зубров фехтовать.</p><p class="p1">— Принимаю пари, сир Аллисер, — отвечал Джон. — Мне бы хотелось видеть, как Призрак жонглирует. — Джон услыхал, как Гренн затаил дыхание. Все замолчали.</p><p class="p1">И тут Тирион Ланнистер заржал. К нему присоединились трое Черных Братьев, сидевших за соседним столом. Смех побежал по скамейкам, захихикали даже повара. На балках шевельнулись птицы, наконец даже Гренн улыбнулся.</p><p class="p1">Аллисер так и не отвел глаза от Джона. Когда смех обежал весь зал, лицо его потемнело и рука сжалась в кулак.</p><p class="p1">— А вот это была самая прискорбная ваша ошибка, лорд Сноу, — бросил он, словно врагу, самым едким голосом.</p></span>
