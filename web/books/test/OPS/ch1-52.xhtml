<p class="p">Эддард</p>
</div><p class="p1">Серый рассвет уже сочился в его окно, когда грохот копыт пробудил Эддарда Старка от короткого тревожного сна. Он оторвал голову от стола, чтобы поглядеть во двор. Внизу люди в панцирях, коже и алых плащах приступили к утренним упражнениям. Звенели мечи, падали набитые соломой чучела воинов. Сандор Клиган, проскакав по избитой копытами земле, пробил железным острием голову чучела. Холст распоролся, солома вывалилась наружу… Гвардейцы Ланнистеров перешучивались и ругались.</p><p class="p1">«Неужели этот доблестный спектакль предназначен для меня? — подумал он. — Если так, то Серсея бо́льшая дура, чем можно было подумать. Проклятая баба, почему она не бежала? Я ведь давал ей шанс за шансом!»</p><p class="p1">Утро выдалось мрачным и облачным. Нед позавтракал с дочерьми и септой Мордейн. Санса, все еще безутешная, мрачно глядела на пищу и отказывалась есть, однако Арья переправляла в живот все, что ставили перед ней.</p><p class="p1">— Сирио говорит, что у нас будет еще один последний урок, прежде чем мы сегодня вечером сядем на корабль, — сказала она. — Можно я пойду, папа? Все мои вещи собраны.</p><p class="p1">— Короткий урок: постарайся не забыть умыться и переодеться. Я хочу, чтобы вы отплыли днем, понятно?</p><p class="p1">— В середине дня, — повторила Арья.</p><p class="p1">Санса оторвалась от еды.</p><p class="p1">— Если ей можно заниматься танцами, почему мне нельзя проститься с принцем Джоффри?</p><p class="p1">— Я охотно пойду с ней, лорд Эддард, — предложила септа Мордейн. — Так она не опоздает на корабль.</p><p class="p1">— Будет неразумно, если ты посетишь Джоффри именно сейчас, Санса. Прости.</p><p class="p1">Глаза Сансы наполнились слезами.</p><p class="p1">— Но почему?</p><p class="p1">— Санса, твоему лорду-отцу причины известны куда лучше, чем тебе, — проговорила септа Мордейн. — Ты не должна оспаривать его решений.</p><p class="p1">— Но это несправедливо! — Санса выскочила из-за стола, уронила стул и в слезах выбежала из солярия.</p><p class="p1">Септа Мордейн поднялась, но Нед жестом велел ей оставаться на месте.</p><p class="p1">— Пусть идет, септа, я попытаюсь все объяснить ей, когда мы окажемся в безопасности в Винтерфелле. — Септа склонила голову и села, чтобы докончить свой завтрак.</p><p class="p1">Примерно через час великий мейстер Пицель посетил лорда Эддарда Старка в его солярии. Плечи старика согнулись, словно бы тяжесть великой мейстерской цепи вокруг шеи вдруг сделалась непосильной.</p><p class="p1">— Милорд, — проговорил он, — король Роберт скончался. Боги даровали ему покой.</p><p class="p1">— Нет, — отвечал лорд Эддард. — Король ненавидел покой, и боги послали ему любовь и смех, радость праведной битвы. — Странно, какая пустота вдруг обрушилась на него. Он ждал этого визита, но тем не менее с этими словами что-то скончалось внутри него. Нед отдал бы все свои титулы за возможность оплакать друга, но он оставался десницей Роберта, и час, которого он опасался, настал.</p><p class="p1">— Будьте добры, призовите членов совета в мой солярий, — сказал Нед Пицелю. Башню Десницы они с Томардом сделали по возможности безопасной, он не мог сказать того же самого о зале совета.</p><p class="p1">— Милорд? — заморгал Пицель. — Дела королевства, конечно же, подождут до завтрашнего утра, когда наше горе остынет.</p><p class="p1">Нед отвечал тихо, но твердо:</p><p class="p1">— Увы, мы должны собраться немедленно.</p><p class="p1">Пицель поклонился:</p><p class="p1">— Как приказывает десница, — и крикнув своим слугам, отослал их бегом, а потом с достоинством принял предложенное Недом кресло и чашу сладкого пива.</p><p class="p1">Первым на призыв откликнулся сир Барристан Селми, безупречный в белом плаще и эмалевом панцире.</p><p class="p1">— Милорды, — сказал он. — Мое место сейчас возле юного короля. Прошу вас, разрешите мне находиться возле него.</p><p class="p1">— Ваше место здесь, сир Барристан, — возразил ему Нед.</p><p class="p1">Следующим явился Мизинец, все еще облаченный в синий бархат и капюшон с серебряным пересмешником, которые были на нем предыдущей ночью, однако сапоги его запылились от верховой езды.</p><p class="p1">— Милорды, — сказал он, улыбнувшись всем и никому, а потом повернулся к Неду: — Ваше маленькое распоряжение исполнено, лорд Эддард.</p><p class="p1">Вошел Варис, окутанный запахом лаванды, зарозовевшийся после ванны, пухлое лицо его было вымыто и припудрено, мягкие шлепанцы ступали бесшумно.</p><p class="p1">— Мои пташки сегодня напели грустную песню, — сказал он усаживаясь. — Государство скорбит. Начнем?</p><p class="p1">— Когда прибудет лорд Ренли? — осведомился Нед.</p><p class="p1">Варис скорбно поглядел на него.</p><p class="p1">— Увы, лорд Ренли, похоже, оставил город.</p><p class="p1">— Оставил город? — Нед рассчитывал на поддержку Ренли.</p><p class="p1">— Он отбыл через задние ворота за час до рассвета в компании сира Лораса Тирелла и пятидесяти человек свиты, — доложил Варис. — Судя по всему, они направились галопом на юг, вне сомнения, в Штормовой Предел или в Вышесад.</p><p class="p1">Итак, нет ни Ренли, ни его сотни мечей. Неду это не понравилось, однако что-либо сделать было нельзя. Он извлек последнюю грамоту Роберта.</p><p class="p1">— Король вызвал меня к себе прошлой ночью и приказал записать его последние слова. Роберт запечатал грамоту в присутствии лорда Ренли и великого мейстера Пицеля, чтобы совет вскрыл завещание после смерти короля. Сир Барристан, не окажете ли любезность?</p><p class="p1">Лорд-командующий Королевской гвардии обследовал бумагу.</p><p class="p1">— Печать короля Роберта не взломана.</p><p class="p1">Развернув грамоту, он начал читать:</p><div class="cite">
<p class="p1"><em>— Лорд Эддард Старк назначается протектором государства и будет править как регент до тех пор, пока наследник престола не войдет в возраст.</em></p>
</div><p class="p1">А если придется, и когда наследник достигнет возраста, подумал Нед, не став, однако, ничего говорить вслух. Он не доверял ни Пицелю, ни Варису, а сира Барристана честь обязывает защищать и охранять мальчишку, которого он считал своим новым королем.</p><p class="p1">Старый рыцарь не оставит Джоффри. Горько было оттого, что придется солгать, однако Нед знал, что здесь ему придется ступать осторожно, он должен прибегать к их совету и играть в их игры, пока его положение как регента не укрепится. Потом найдется время заняться вопросами наследования престола — когда Арья и Санса окажутся в безопасности в Винтерфелле, а лорд Станнис возвратится в Королевскую Гавань со всей своей свитой.</p><p class="p1">— Я хотел бы попросить совет утвердить меня в качестве лорда-протектора, в соответствии с желанием покойного короля Роберта, — проговорил Нед, разглядывая их лица и пытаясь понять, какие мысли могут прятаться за полуприкрытыми глазами Пицеля, за ленивой полуулыбкой Мизинца и нервным трепетанием пальцев Вариса.</p><p class="p1">Дверь открылась. В солярий вступил Толстый Том.</p><p class="p1">— Простите, милорды, но стюард короля настаивает…</p><p class="p1">Королевский управляющий вошел и поклонился.</p><p class="p1">— Достопочтенные лорды, король требует, чтобы Малый совет немедленно собрался в тронном зале.</p><p class="p1">Нед ожидал, что Серсея не станет медлить с ударом, и вызов не явился неожиданным.</p><p class="p1">— Король умер, — проговорил он, — но тем не менее мы пойдем. Том, соберите свиту, будьте любезны.</p><p class="p1">Мизинец предоставил Неду руку и помог ему спуститься по ступеням. Варис, Пицель и сир Барристан следовали за ними. Два ряда людей в кольчугах и стальных шлемах ожидали Неда снаружи, северян было восьмеро. Серые плащи трепетали на ветру, пока гвардейцы провожали их через двор. Алых плащей Ланнистеров не было видно, и Нед несколько приободрился, заметив золотые плащи на бастионах и у ворот.</p><p class="p1">Янос Слинт встретил их у дверей в тронный зал — вооруженный, в причудливом черно-золотом панцире, он держал под рукой шлем с высоким султаном.</p><p class="p1">Командующий городской стражей чопорно поклонился, и люди его распахнули перед пришедшими окованные бронзой широкие дубовые двери в двадцать футов высотой.</p><p class="p1">Королевский стюард ввел их внутрь.</p><p class="p1">— Приветствуйте его величество Джоффри из дома Баратеонов и Ланнистеров, первого носителя этого имени, короля андалов, ройнаров и Первых Людей, лорда Семи Королевств и протектора государства, — пропел он.</p><p class="p1">До того конца зала, где Джоффри ожидал их, сидя на Железном троне, еще надо было дойти. Опираясь на Мизинца, Нед Старк медленно хромал, приближаясь к мальчишке, который назвал себя королем. Остальные последовали за ним. В первый раз этот путь он проделал верхом, с мечом в руке, и драконы Таргариенов следили за ним со стен… тогда он заставил Джейме Ланнистера оставить трон. Нед не знал, удастся ли ему столь же легко справиться с Джоффри.</p><p class="p1">Пятеро рыцарей королевской гвардии — все, кроме сира Джейме и сира Барристана, — полумесяцем охватили подножие трона. Они были в полном вооружении, и эмалированная сталь прикрывала их от шлема до пяток, с плеч свисали длинные белые плащи, ослепительно белые щиты прикрывали левые руки. Серсея Ланнистер и двое ее младших детей стояли позади сира Бороса и сира Меррина. На королеве было шелковое платье цвета морской волны, отороченное миришскими кружевами, бледными, словно пена. Палец ее украшало золотое кольцо с изумрудом величиной с голубиное яйцо, голову покрывала подобающая тиара.</p><p class="p1">Над ними среди колючек и шипов восседал принц Джоффри, в золотом дублете и красном атласном плаще. Сандор Клиган стоял у подножия узких ступеней, ведущих к трону. На нем была кольчуга, пепельно-серый панцирь и шлем в виде огрызавшейся собачьей морды.</p><p class="p1">Позади трона замерли двенадцать гвардейцев Ланнистеров, длинные мечи на поясе, алые плащи на плечах, стальные львы рычат со шлемов. Но Мизинец сдержал обещание: вдоль стен перед гобеленами Роберта со сценами охот и битв стояли золотые плащи городской стражи, каждый сжимал древко восьмифутового копья с наконечником из черного железа. Их было больше, чем Ланнистеров: пятеро на одного.</p><p class="p1">Нога Неда уже пылала от боли, когда он остановился. Опираясь на плечо Мизинца, он переложил на него свой вес.</p><p class="p1">Джоффри встал. Его алый атласный плащ был расшит золотой нитью, с одной стороны пятьдесят львов, с другой стороны пятьдесят оленей.</p><p class="p1">— Повелеваю совету предпринять все необходимые меры для моей коронации, — объявил мальчик. — Я хочу быть коронованным через две недели. Сегодня я принимаю присягу на верность от моих лояльных советников.</p><p class="p1">Нед достал письмо Роберта.</p><p class="p1">— Лорд Варис, будьте любезны, покажите эту бумагу моей госпоже Ланнистер.</p><p class="p1">Евнух поднес письмо Серсее. Королева поглядела на слова.</p><p class="p1">— Протектор государства, — прочитала она. — И вы надеетесь защитить себя бумажкой, милорд? — Она разорвала грамоту пополам, потом еще раз и бросила обрывки на пол.</p><p class="p1">— Но такова была воля короля, — проговорил потрясенный сир Барристан.</p><p class="p1">— Сейчас у нас новый король, — сказала Серсея Ланнистер. — Помните, лорд Эддард, во время нашего последнего разговора вы дали мне один совет, позвольте же мне ответить любезностью на любезность. Преклоните колено, милорд, преклоните колено и поклянитесь в верности моему сыну, и мы позволим вам сегодня уйти отсюда десницей, а потом окончить свои дни в той серой пустыне, которую вы зовете домом.</p><p class="p1">— Если бы я только мог, — мрачно ответил Нед. Раз она решила поднять этот вопрос сейчас, выхода не остается. — У вашего сына нет прав на престол, на котором он сидит. Истинный наследник Роберта — лорд Станнис.</p><p class="p1">— Лжец! — завопил Джоффри, побагровев лицом.</p><p class="p1">— Мама, а что он хочет сказать? — жалобно спросила у королевы принцесса Мирцелла. — Разве Джофф теперь не король?</p><p class="p1">— Вы сами осудили себя собственным ртом, лорд Старк, — сказала Серсея Ланнистер. — Сир Барристан, схватите предателя.</p><p class="p1">Лорд-командующий королевской гвардии медлил. В мгновение ока он был окружен гвардейцами Старка, сталь блестела в их кольчужных перчатках.</p><p class="p1">— Так, значит, изменник перешел от слов к делу, — сказала Серсея.</p><p class="p1">— Неужели вы считаете, что сир Барристан останется в одиночестве, милорд? — Зловеще скрежетнув сталью о металл, Пес извлек свой длинный меч. Рыцари Королевской гвардии и двенадцать ланнистерских гвардейцев в алых плащах шагнули навстречу.</p><p class="p1">— Убейте его! — завизжал мальчишка-король с Железного трона. — Убейте их всех, я приказываю!</p><p class="p1">— Вы не оставляете мне выхода, — сказал Нед Серсее Ланнистер. Он окликнул Яноса Слинта. — Командующий, возьмите королеву и ее детей, не делайте им дурного, просто проводите в королевские апартаменты и держите их там под охраной.</p><p class="p1">— Стража! — завопил Слинт, нахлобучив шлем. Сотня золотых плащей опустила копья и сомкнулась.</p><p class="p1">— Я не хочу кровопролития, — сказал Нед королеве. — Пусть ваши люди сложат мечи, и никто не…</p><p class="p1">Удар, нанесенный одним из золотых плащей, пронзил спину Томарда. Клинок Толстого Тома вывалился из ослабевших пальцев, а влажное кровавое острие выставилось между ребер, пробив кожу и панцирь. Он умер еще до того, как меч его ударился о пол.</p><p class="p1">Предупреждающий крик Неда опоздал. Янос Слинт сам раскроил открытое горло Варли. Кейн повернулся, замелькала сталь, поток ударов заставил отступить ближайших копейщиков. На мгновение казалось, что он сумеет вырваться на свободу. Но Пес достиг его, и первым же ударом Сандор Клиган отсек запястье Кейна. Второй удар бросил северянина на колени, раскроив от плеча до груди.</p><p class="p1">Люди его умирали вокруг, а Мизинец извлек кинжал Неда из его ножен и ткнул под подбородок. На лице его появилась извиняющаяся улыбка.</p><p class="p1">— Я же предупреждал, чтобы вы не доверяли мне.</p></span>
