<span id="id73"><div class="title2">
<p class="p">Дейенерис</p>
</div><p class="p1">В ржавом, мертвом и высохшем краю доброго дерева трудно было сыскать. Посланники ее приносили корявые ветви хлопкового куста, пурпуролиста, охапки бурой травы. Найдя два дерева попрямее, они отсекли сучья, ободрали кору и распилили, разложив бревна квадратом. Середину наполнили ветвями кустарников, корой, охапками сухой травы; Ракхаро выбрал жеребца из оставшегося у них небольшого косяка, коню было далеко до рыжего, что принадлежал кхалу Дрого, но равного тому вообще трудно было сыскать. Агго отвел жеребца внутрь квадрата, дал ему побуревшее яблоко и повалил на месте ударом топора между глаз.</p><p class="p1">Связанная по рукам и ногам Мирри Маз Дуур издали наблюдала за происходящим встревоженными глазами.</p><p class="p1">— Убить коня недостаточно, — сказала она Дени. — Сама по себе кровь бессильна. Ты не знаешь заклинаний и не владеешь мудростью, которая позволила бы тебе отыскать их. Вы считаете, что кровная магия — это детская игра. Ты зовешь меня мейегой, будто это ругательство. А это слово просто значит «мудрая». Ты еще дитя и невежественна, как младенец. Что бы ты ни задумала, у тебя ничего не получится. Освободи меня, и я помогу тебе.</p><p class="p1">— Я устала от лая мейеги, — обратилась Дени к Чхого. Тот приложил к лхазарянке кнут, после чего божья жена придерживала язык.</p><p class="p1">Над трупом коня они поставили помост из срубленных бревен, взяв стволы меньших деревьев и прямые сучья больших. Стволы клали от восхода к закату. На помост положили сокровища кхала Дрого: огромный шатер, расписанные жилеты, седла и упряжь, кнут, подаренный отцом, когда Дрого достиг зрелости. Аракх, которым муж ее сразил кхала Ого и его сына, могучий лук драконьей кости. Агго добавил бы и оружие, которое кровные Дрого подарили Дени на свадьбу, но она запретила.</p><p class="p1">— Оружие это мое, — сказала она. — И оно мне еще понадобится.</p><p class="p1">Сокровища кхала завалили новым слоем хвороста и забросали связками сухой травы.</p><p class="p1">Сир Джорах Мормонт отвел ее в сторону, когда солнце подползало к зениту.</p><p class="p1">— Принцесса… — начал он.</p><p class="p1">— Почему ты так зовешь меня? — бросила вызов Дени. — Мой брат Визерис был твоим королем, разве не так?</p><p class="p1">— Да, миледи.</p><p class="p1">— Визерис мертв, я его наследница, последняя от крови дома Таргариенов. Все, что принадлежало ему, теперь принадлежит мне.</p><p class="p1">— Да… моя королева, — проговорил сир Джорах, опускаясь на колено. — Меч мой, который прежде принадлежал ему, теперь ваш, Дейенерис. И сердце тоже, хотя оно никогда не принадлежало вашему брату. Я только рыцарь и, кроме своего изгнания, ничего не могу предложить вам, но молю, выслушайте. Пусть кхал Дрого уйдет. Вы не останетесь одна, я обещаю вам, никто не отвезет вас в Вейес Дотрак, если только вы не захотите этого. Вам незачем присоединяться к дош кхалину. Поедемте на восток вместе со мной. В Йи Ти, Каварт, к Яшмовому морю, Асшаю, что у Теней. Мы увидим невиданные чудеса и выпьем вина, которое боги предназначили для нас. Прошу, кхалиси. Я знаю, что вы задумали. Не надо, не надо этого делать!</p><p class="p1">— Я должна, — сказала ему Дени. Она прикоснулась к его лицу с тоской и печалью. — Вы не понимаете!</p><p class="p1">— Я понимаю, что вы любили его, — сказал сир Джорах голосом, полным отчаяния. — Некогда и я любил свою жену, но я не умер вместе с ней. Вы моя королева, мой меч в ваших руках, только не просите меня смотреть, когда вы взойдете на костер Дрого. Я не смогу увидеть вашу смерть!</p><p class="p1">— Неужели вы боитесь этого? — Дени легко прикоснулась губами к его широкому лбу. — Я не дитя, чтобы совершать подобные глупости, милый сир.</p><p class="p1">— Значит, вы не хотите умереть вместе с ним? Вы клянетесь в этом, моя королева?</p><p class="p1">— Клянусь, — проговорила она на общем языке Семи Королевств, по праву принадлежащих ей.</p><p class="p1">Третий уровень помоста сплели из ветвей толщиной в палец, его засыпали сухой листвой и хворостом. Их выстилали с севера на юг — от льда к огню, — а потом покрыли мягкими подушками и ночными шелками. Солнце уже начало клониться к западу, когда они покончили с делом. Дени созвала дотракийцев. Их осталось менее сотни. Со столькими же начинал Эйегон, подумала она. Впрочем, не важно.</p><p class="p1">— Вы будете моим кхаласаром, — сказала она. — Я вижу лица рабов. Я освобождаю вас! Снимите ошейники; кто хочет, может уйти; не бойтесь, никто не причинит вам вреда. Ну а те, кто останется, будут братьями и сестрами, мужьями и женами.</p><p class="p1">Черные глаза смотрели на нее внимательно, настороженные и бесстрастные.</p><p class="p1">— Я вижу детей, женщин, морщинистые лица стариков. Вчера я была девчонкой. Сегодня… я стала женщиной. Завтра я буду старухой. Каждому из вас я говорю: отдайте мне свое сердце и руки, и для них всегда найдется дело.</p><p class="p1">Она обернулась к трем молодым воинам своего кхаса.</p><p class="p1">— Чхого, тебе даю я кнут с серебряной рукоятью, который был моим свадебным даром, именую тебя ко и прошу: дай мне клятву, чтобы жить и умереть, как кровь от моей крови, странствуя рядом со мной, чтобы сохранять меня от беды.</p><p class="p1">Чхого взял кнут из ее рук, но на лице его было написано смятение.</p><p class="p1">— Кхалиси, — сказал он неуверенно, — это не дело. Мне стыдно быть кровным женщине.</p><p class="p1">— Агго, — проговорила Дени, не обращая внимания на слова Чхого. «Если я обернусь назад, я погибну». — Тебе я даю лук из драконьей кости, который был моим свадебным даром. — Блестящее чернотой древко с двойным изгибом было выше ее ростом. — Я именую тебя ко и прошу твоей клятвы жить и умереть, как кровь от моей крови, странствуя рядом со мной, чтобы охранить меня от беды.</p><p class="p1">Агго принял лук с опущенными глазами:</p><p class="p1">— Я не могу произнести эти слова, лишь муж может возглавить кхаласар и назвать меня ко!</p><p class="p1">— Ракхаро, — проговорила Дени, отворачиваясь, словно не слышав отказа. — Ты примешь великий аракх, который был моим свадебным даром, с рукоятью и клинком, украшенным золотом. И тебя я тоже именую ко и прошу, чтобы ты жил и умер, как кровь моей крови, странствуя рядом со мной, чтобы сохранить меня от беды.</p><p class="p1">— Ты кхалиси, — проговорил Ракхаро, принимая аракх. — Я доеду с тобой до Вейес Дотрак у подножия Матери гор и сохраню тебя от беды, пока ты не займешь свое место среди старух дош кхалина, — большего я не могу обещать.</p><p class="p1">Она кивнула — спокойно, словно бы не слыхала его ответа, и повернулась к последнему из ее защитников.</p><p class="p1">— Сир Джорах Мормонт, — сказала она, — первый из моих рыцарей. У меня нет для тебя свадебного дара, но клянусь, что настанет день, и ты получишь из моих рук такой длинный меч, которого еще не видел мир. Выплавленный драконом, выкованный из валирийской стали. И я прошу твоей клятвы.</p><p class="p1">— Клянусь тебе, моя королева. — Сир Джорах с поклоном опустил меч к ее ногам. — Даю обет служить тебе, повиноваться и умереть, если потребуется.</p><p class="p1">— Что бы ни случилось?</p><p class="p1">— Что бы ни случилось.</p><p class="p1">— Я связываю всех вас этой клятвой. И обещаю, что вы никогда не пожалеете о ней!</p><p class="p1">Дени подняла его за руку. Поднявшись на цыпочки, чтобы достать его губ, она поцеловала рыцаря и сказала:</p><p class="p1">— Ты стал первым рыцарем моей королевской гвардии.</p><p class="p1">Ощущая на себе глаза кхаласара, она вошла в шатер. Дотракийцы что-то бормотали и искоса поглядывали на нее уголками миндалевидных глаз. «Они решили, что я обезумела, — поняла Дени. — Наверное, они правы. Скоро я узнаю это. Но „если оглянусь, я погибла“».</p><p class="p1">Вода в ванне обжигала жаром, Дореа помогла ей забраться в ванну, но Дени не дернулась и не вскрикнула. Она любила тепло, возвращавшее ей ощущение чистоты. Чхику надушила воду маслами, которые отыскала на базаре в Вейес Дотрак. Поднялся благоуханный пар. Ирри вымыла ей волосы и расчесала спутавшиеся пряди. Потом потерла спину. Дени закрыла глаза, отдаваясь аромату.</p><p class="p1">Она ощутила, что тепло растворило боль между ее бедрами: она поежилась, когда жар воды вступил в нее, изгоняя боль и напряжение. Она поплыла.</p><p class="p1">Когда Дени очистилась, служанки помогли ей подняться из воды. Ирри и Чхику вытерли ее досуха, а Дореа расчесала волосы так, что они стали казаться рекой жидкого серебра, ниспадающей на ее спину. Ее надушили пряноцветом и киннамоном, прикоснувшись к обоим запястьям, за ушами и к тяжелым от молока грудям. Последнее прикосновение предназначалось для ее естества. Палец Ирри, легкий и прохладный, как поцелуй любовника, скользнул между ее губами.</p><p class="p1">Потом Дени отослала их всех, чтобы она могла подготовить кхала Дрого к отъезду в Ночные земли. Она омыла его тело, умастила волосы, последний раз перебрала их пальцами, ощущая тяжесть, вспоминая тот первый раз, когда делала это в ночь их брака. Волосы эти никогда не были острижены. Многие ли из мужей способны умереть с неостриженными волосами? Она уткнулась в них лицом, ощущая томное благоухание масел. От Дрого пахло травой и теплой землей, дымом, семенем и конями. Он пахнул собой.</p><p class="p1">«Прости меня, солнце моей жизни, — подумала она. — Прости меня за то, что я сделала, и за то, что должна сделать. Я заплатила цену, моя звезда, но она оказалась слишком высокой, слишком высокой…»</p><p class="p1">Дени расчесала волосы кхала, надела серебряные кольца на усы и по одному прицепила к косе колокольчики: их было много, золотых, серебряных и бронзовых. Колокольчики, которые слышали его враги, слабея от страха. Она надела на него штаны из конского волоса и высокие сапоги, застегнула тяжелый пояс из золотых и серебряных медальонов. Израненную грудь прикрыл расписной жилет, старый и выцветший, который Дрого любил больше прочих. Себе она выбрала свободные штаны из песочного шелка, сандалии, которые зашнуровывались до половины голени, и такой же жилет, как у Дрого.</p><p class="p1">Солнце уже садилось, когда она приказала отнести тело кхала к костру. Дотракийцы молча провожали взглядами Чхого и Агго, выносивших его из шатра. Дени шла позади них. Они положили Дрого на шелка подушек головой к Матери гор, оставшейся где-то между севером и востоком.</p><p class="p1">— Масла! — распорядилась она. Принесли кувшин и облили костер, пропитав шелка, хворост и охапки сухой травы; наконец масло закапало из-под бревен, и воздух пропитался благоуханием. — А теперь принесите драконьи яйца, — приказала Дени.</p><p class="p1">Нечто в ее голосе заставило их броситься бегом. Сир Джорах прикоснулся к ее руке.</p><p class="p1">— Моя королева, драконьи яйца не нужны Дрого в Ночных землях. Лучше продадим их в Асшае. Только за одно можно получить целый корабль, который доставит нас в Вольные Города. Если продать все три, ты будешь богатой до конца дней своих.</p><p class="p1">— Я получила их не для того, чтобы продавать, — сказала Дени.</p><p class="p1">Она поднялась на костер и собственной рукой положила яйца вокруг тела своего солнца и звезд; черное у сердца, зеленое у головы, обернув вокруг него косу, молочно-золотое легло между его ног. Целуя Дрого в последний раз, Дени ощутила губами сладость масла.</p><p class="p1">Спустившись с костра, она заметила на себе взгляд Мирри Маз Дуур.</p><p class="p1">— Ты обезумела, — хрипло проговорила божья жена.</p><p class="p1">— Далеко ли от безумия до мудрости?.. — спросила Дени. — Сир Джорах, возьми эту мейегу и привяжи ее к костру.</p><p class="p1">— К костру… моя королева, нет, выслушайте меня…</p><p class="p1">— Делайте, как я сказала, сир Джорах. — Но он колебался, и гнев ее вспыхнул. — Вы поклялись повиноваться мне, что бы ни случилось. Ракхаро, помоги ему.</p><p class="p1">Божья жена не вскрикнула, когда ее поволокли к костру кхала Дрого и бросили среди его сокровищ. Дени сама облила маслом голову женщины.</p><p class="p1">— Спасибо тебе, Мирри Маз Дуур, — сказала она, — за урок, который ты дала мне.</p><p class="p1">— Ты не услышишь моего крика, — отозвалась Мирри, когда масло потекло с ее волос, увлажняя одежду.</p><p class="p1">— Услышу, — сказала Дени, — но мне нужны не твои вопли, а твоя жизнь. Помнишь, что ты мне сказала когда-то: лишь смертью можно купить жизнь.</p><p class="p1">Мирри Маз Дуур открыла рот, но ничего не ответила. Шагнув в сторону, Дени заметила, что презрение оставило черные глаза мейеги, сменившись неким подобием страха. Больше делать было нечего, оставалось лишь следить за солнцем и ждать первой звезды.</p><p class="p1">Когда умирает повелитель табунщиков, с ним убивают его коня, чтобы он гордо ехал по Ночным землям. Тела их сжигают под открытым небом, и кхал взмывает на огненном скакуне, чтобы занять свое место среди звезд. И чем ярче горел человек в жизни, тем более яркая звезда вспыхнет в ночи.</p><p class="p1">Чхого заметил ее первым.</p><p class="p1">— Вон! — сказал он негромким голосом.</p><p class="p1">Дени поглядела и увидела звезду, невысоко поднявшуюся над востоком. Первая звезда в ту ночь оказалась кометой, с нее срывался пламенный луч, кровавый драконий хвост. Она не могла ждать более верного знамения.</p><p class="p1">Взяв факел из руки Агго, Дени ткнула им между поленьями. Масло немедленно вспыхнуло. Хворост и сухая трава занялись через мгновение. Крошечные языки пробежали по дереву как быстрые красные мыши, катясь по маслу, перепрыгивая с ветви на ветвь; поднявшийся жар внезапно дохнул на нее с лаской любовника и через секунду сделался непереносимым. Дени отступила на шаг. Дерево трещало все громче и громче. Мирри Маз Дуур запела пронзительным улюлюкающим голосом. Пламя крутилось, вилось, языки его догоняли друг друга. Мрак дрожал над костром, сам воздух будто плавился от жары. Дени услышала, как затрещали бревна. Огонь охватил Мирри Маз Дуур. Песня ее сделалась пронзительней и громче… мейега охнула, снова и снова, и слова ее вдруг слились в пронзительный вой, высокий и полный муки. Наконец пламя достигло и Дрого, языки охватили его. Вспыхнула одежда, и какое-то мгновение кхал казался облаченным в лоскутья воздушного оранжевого шелка и серого дыма. Губы Дени раздвинулись, и она затаила дыхание. Часть ее стремилась подняться на этот костер, чего опасался сир Джорах, броситься в пламя, чтобы попросить у Дрого прощения и в последний раз принять его в себя, а там пусть огонь отделит их плоть от костей, когда они сольются навеки.</p><p class="p1">Она ощутила запах горящей плоти — так конина жарится на костре. Костер ревел в сгущающейся ночи огромным зверем, заглушал слабые, последние визги Мирри Маз Дуур… долгие языки пламени лизали чрево ночи. Дым возносился все гуще, дотракийцы, кашляя, отступали. Полотнища огня разворачивались под адским ветром, бревна шипели и трещали, огненные искры новорожденными светляками возносились в дыму и исчезали во тьме. Жар плескал по воздуху огромными красными крыльями, отгоняя дотракийцев, отгоняя даже Мормонта, но Дени стояла на месте. Она от крови дракона, и огонь внутри ее.</p><p class="p1">Она давно догадывалась, как надо поступить, подумала про себя Дени, шагнув чуть поближе к кострищу. Но жаровни для этого мало. Пламя кружило перед ней, как женщины, плясавшие на ее свадьбе, кружило, пело, размахивая желтыми, оранжевыми и алыми вуалями, страшными с виду, но и прекрасными, прекрасными, живыми от жара. Дени открыла перед ними руки, плоть ее горела. «И это тоже брак», — сказала она себе. Мирри Маз Дуур умолкла. Божья жена сочла ее ребенком, но дети растут и учатся.</p><p class="p1">Еще шаг, и ступни Дени ощутили жар раскаленного песка даже сквозь сандалии. Пот бежал по ее бедрам, между грудями, ручейками тек по щекам — там, где недавно катились слезы. Сир Джорах кричал позади нее, но он теперь ничего не значил. Важен был только огонь. Пламя было таким прекрасным: ничего прекраснее она не видела, каждый язык казался ей чародеем, облаченным в желто-оранжево-алые одежды, кружившие под дымным плащом. Она видела алых пламенных львов, великих желтых змей и единорогов, сотканных из бледно-синего пламени; видела она рыб, лис и чудовищных волков, ярких птиц и цветущие деревья; каждое новое видение было прекраснее предыдущего… Она видела коня, огромного серого жеребца, сложившегося из дыма, с гривы его срывался поток синего пламени. Да, любимый, мое солнце и звезды, садись, время уезжать.</p><p class="p1">Жилет ее начал тлеть, Дени, дернув плечами, сбросила его на землю. Расписная кожа внезапно вспыхнула, а она шагнула поближе к костру, струйки молока текли из красных и раздувшихся сосков. Сейчас, сейчас, подумала она и на мгновение увидела перед собой кхала Дрого, поднимавшегося на своего дымного коня с пылающим кнутом в руке. Он улыбнулся, и хлыст с шипением ударил по костру.</p><p class="p1">Раздался треск, с которым лопается камень. Помост из дерева, хвороста и травы начал рушиться внутрь себя. Кусочки горящего дерева посыпались на нее градом пепла и угольков. И подпрыгивая, вращаясь, о землю возле ее ног ударился круглый камень, бледный, усеянный золотыми прожилками, разломанный и курящийся. Рев огня наполнял мир, но за ним Дени слышала женские крики и удивленные детские голоса.</p><p class="p1">Лишь смертью можно выкупить жизнь.</p><p class="p1">Второй громоподобный треск окружил ее тучей дыма, и костер зашевелился, бревна начали взрываться — огонь проникал в их потаенные сердца. Она слышала ржание коней и полные ужаса голоса дотракийцев. Сир Джорах выкрикивал ее имя и в страхе ругался.</p><p class="p1">«Нет, — хотела она крикнуть ему. — Нет, мой добрый рыцарь, не бойся за меня! Мое время пришло. Я Дейенерис Бурерожденная, дочь драконов, невеста драконов, мать драконов, разве ты не видишь? Разве ты не ВИДИШЬ?» Со вздохом выбросив к небу огромный султан пламени и дыма, костер рухнул вокруг нее. Ничего не боясь, Дени шагнула в огненную бурю, призывая к себе детей.</p><p class="p1">Третий удар был таким, словно треснул сам мир.</p><p class="p1">Когда костер наконец угас и почва остыла, так что на нее можно было ступать, сир Джорах Мормонт обнаружил ее посреди пепла, окруженную почерневшими бревнами и тлеющими угольками, среди обгорелых костей мужчины, женщины и коня. Дени была нага, тело ее покрывала лишь сажа, одежда ее превратилась в пепел, прекрасные волосы сгорели, но сама она была невредима…</p><p class="p1">Молочно-золотой дракон сосал ее левую грудь, золотой с бронзовыми прожилками правую. Она обнимала их. Черно-алый лежал на ее плечах, длинная шея свернулась под ее подбородком. Увидев сира Джораха, он поднял голову и поглядел на рыцаря глазами красными, как угольки.</p><p class="p1">Лишившись дара речи, рыцарь упал на колени. Люди ее кхаса собирались позади него. Чхого первым положил свой аракх у ног Дени.</p><p class="p1">— Кровь от моей крови, — прошептал он, прижимая лицо к дымящейся земле.</p><p class="p1">— Кровь от моей крови, — услышала она голос Агго.</p><p class="p1">— Кровь от моей крови, — выкрикнул Ракхаро.</p><p class="p1">Потом пришли ее служанки, затем все дотракийцы, мужчины, женщины и дети, и Дени было достаточно лишь поглядеть им в глаза, чтобы понять: они принадлежат ей сегодня, завтра и навсегда; они принадлежат ей, как никогда не принадлежали Дрого.</p><p class="p1">Когда Дейенерис Таргариен поднялась на ноги, ее черный дракон зашипел, бледный дым закурился из его рта и ноздрей. Двое остальных оторвались от ее грудей и отозвались на зов, прозрачные крылья, разворачиваясь, били воздух… и впервые за последние сотни лет ночь ожила музыкой драконов.</p></span>
