<span id="id57"><div class="title2">
<p class="p">Тирион</p>
</div><p class="p1">Чилла, дочь Чейка от Черноухих, направилась вперед на разведку и вернулась с вестью о войске, собравшемся на перекрестке дорог.</p><p class="p1">— Судя по кострам, думаю, что их там тысяч двадцать, — сказала она. — Красные знамена с золотым львом.</p><p class="p1">— Твой отец? — спросил Бронн.</p><p class="p1">— Или мой брат Джейме, — ответил Тирион. — Скоро мы узнаем это.</p><p class="p1">Он обозрел своих оборванцев: почти три сотни Каменных Ворон, Лунных Братьев, Черноухих и Обгорелых. Всего лишь семя того войска, которое он надеялся вырастить. Гунтер, сын Гурна, поднимал теперь остальные кланы. Тирион подумал о том, как воспользуется лорд-отец этими облаченными в шкуры людьми, с их краденой сталью. Откровенно говоря, он и сам не знал, что делать с ними. Кто же он здесь — предводитель или пленник? Скорее всего и то и другое.</p><p class="p1">— Быть может, лучше будет, если я один спущусь вниз? — предложил он.</p><p class="p1">— Лучше для Тириона, сына Тайвина, — заметил Улф, говоривший от Лунных Братьев.</p><p class="p1">Шагга бросил яростный взгляд, это было жуткое зрелище.</p><p class="p1">— Шагге, сыну Дольфа, это не нравится. Шагга пойдет со взрослым мальчишкой, и если взрослый мальчишка лжет, Шагга отрубит ему мужской признак…</p><p class="p1">— И скормит его козлу, — устало сказал Тирион. — Шагга, даю тебе слово Ланнистера, я вернусь.</p><p class="p1">— Почему я должен верить твоему слову? — Чиллу, невысокую и суровую, плоскую как мальчишка, нельзя было обмануть. — Лорды Нижних земель всегда обманывали горные кланы.</p><p class="p1">— Ты ранишь меня, Чилла, — ответил Тирион. — Я считал, что мы уже стали друзьями. Но как хотите. Ты поедешь со мной, и Шагга и Конн от Каменных Ворон, и Улф от Лунных Братьев, и Тиметт, сын Тиметта, от Обгорелых. — Горцы, когда он назвал их, обменялись настороженными взглядами. — Остальные будут ожидать здесь, пока я не пошлю за ними. Постарайтесь хотя бы не перерезать друг друга, пока меня нет.</p><p class="p1">Ударив пятками в бока коня, он отъехал, не оставив своим спутникам иного выхода, кроме как последовать за ним или же остаться на месте. Он был бы доволен и тем и другим — только бы горцы не задержали его, не уселись на землю и не занялись бесконечной — на целый день и ночь — говорильней. В этом и крылась главная трудность общения с кланами: они исповедовали абсурдное убеждение в том, что на совете следует выслушать мнение каждого мужчины. Позволялось высказываться даже женщинам. Нечего удивляться тому, что прошли века с тех пор, когда они серьезно угрожали Долине, если не считать случайных набегов. Тирион намеревался исправить положение.</p><p class="p1">Бронн ехал возле него. А позади пристроились после недолгого недовольства все пятеро горцев на невысоких мохнатых коньках, более похожих на пони и прыгающих по скалам, как козы.</p><p class="p1">Каменные Вороны ехали вместе, Чилла и Улф держались неподалеку друг от друга — Лунных Братьев и Черноухих связывают крепкие узы. Тиметт, сын Тиметта, ехал один. Все кланы, населявшие Лунные Горы, опасались Обгорелых, умерщвлявших плоть огнем, чтобы доказать свою храбрость, и — как утверждали другие — жаривших младенцев на своих пиршествах. Но даже сами Обгорелые боялись Тиметта, который, достигнув зрелости, лишил себя левого глаза добела раскаленным ножом. Тирион слыхал, что обычно мальчишка отжигал себе сосок, палец или же — будучи истинным храбрецом или безумцем — ухо. Поступок Тиметта произвел столь глубокое впечатление на Обгорелых, что они безотлагательно провозгласили его Красной Рукой — чем-то вроде походного вождя.</p><p class="p1">— Хотелось бы знать, что отжег себе их главарь, — обратился Тирион к Бронну, впервые услышав эту историю. Наемник, ухмыляясь, потянулся к собственному паху… однако даже Бронн уважительно держался с Тиметтом. Если у человека хватает безумия, чтобы лишить себя глаза, с врагом он церемониться не будет.</p><p class="p1">Далекие дозорные наблюдали со сложенных из битого камня башен за всадниками, спускавшимися из предгорий. Тирион успел заметить, как взлетел ворон. Там, где горная дорога изгибалась между двумя скалистыми выступами, располагалось первое укрепление. Дорогу перекрывал невысокий земляной вал высотой фута четыре, и дюжина арбалетчиков расположилась на высотке. Остановив своих спутников вдалеке, Тирион один подъехал к валу.</p><p class="p1">— Кто здесь главный? — крикнул он.</p><p class="p1">Капитан явился мгновенно и еще быстрее предоставил им свиту, узнав сына своего господина. Они отправились дальше — мимо сожженных полей и обгоревших острогов, к речным землям у Зеленого Зубца. Тирион еще не заметил трупов, однако в воздухе полно было воронов-падальщиков. Сражение состоялось здесь недавно.</p><p class="p1">В половине лиги от перекрестка поставили частокол из заостренных столбов, возле него караулили копейщики и лучники. Позади стены начинался лагерь. Дым тянул вверх тонкие пальцы от сотен костров, воины в кольчугах сидели под деревьями и точили клинки, знакомые Тириону знамена трепетали на древках, воткнутых в глинистую почву.</p><p class="p1">Заметив пришельцев, навстречу выехал конный отряд. Впереди скакал рыцарь в украшенном аметистами серебряном панцире и полосатом пурпурно-серебряном плаще. На щите его был изображен единорог, двухфутовый витой рог высился на его шлеме. Тирион повернул навстречу.</p><p class="p1">— Сир Флемент!</p><p class="p1">Сир Флемент Бракс поднял забрало.</p><p class="p1">— Тирион, — проговорил он с удивлением. — Милорд, все мы боялись, что вы погибли, или… — Он неуверенно поглядел на горцев. — Они… сопровождают вас?..</p><p class="p1">— Мои сердечные друзья и верные последователи, — отрекомендовал спутников Тирион. — Где я могу отыскать своего лорда-отца?</p><p class="p1">— Он занял гостиницу на перекрестке дорог.</p><p class="p1">Тирион расхохотался.</p><p class="p1">— Гостиница на перекрестке дорог? Наверное, боги в конце концов справедливы. Я немедленно отправлюсь к отцу.</p><p class="p1">— Как вам угодно, милорд. — Сир Флемент развернул коня и выкрикнул приказ. Три ряда жердей извлекли из земли, проделав дыру в частоколе. Тирион провел свой отряд внутрь.</p><p class="p1">Лагерь лорда Тайвина раскинулся на несколько лиг. Чилла сказала, что лорд Тайвин привел двадцать тысяч человек, и не слишком ошиблась. Простонародье устроилось под открытым небом, но рыцари разбили палатки, а некоторые из знатных лордов возвели шатры величиной с целый дом. Тирион заметил красного быка Престеров, взнузданного вепря лорда Кракехолла, горящее дерево Марбранда, барсука Лидденов. Рыцари приветствовали Тириона, когда он проезжал мимо. Латники глядели на горцев с удивлением.</p><p class="p1">Шагга озирался с открытым ртом; ему, конечно же, не приходилось за всю свою жизнь видеть столько людей, коней и оружия. Остальные горные разбойники лучше следили за собой, однако Тирион не сомневался в произведенном впечатлении. К лучшему: чем более глубокое впечатление произведет на них мощь Ланнистеров, тем охотнее они будут повиноваться.</p><p class="p1">Гостиница и конюшня с виду не переменились. Однако на месте деревеньки остались лишь груды обожженных камней. Во дворе устроили виселицу, и тело, покачивавшееся в петле, облепили вороны. Испугавшись Тириона, они взлетели, каркая и шумно хлопая черными крыльями. Спешившись, он поглядел на останки. Птицы уже выклевали губы, глаза и щеки; запятнанные краской зубы щерились в жутком оскале.</p><p class="p1">— Вот, а я просил только крова, еды и бутылку вина, — напомнил он с укоризненным вздохом.</p><p class="p1">Мальчишки-конюхи нерешительно вышли навстречу, чтобы позаботиться об их лошадях. Шагга не хотел расставаться с конем.</p><p class="p1">— Парень не украдет твою кобылу, — заверил его Тирион. — Он только накормит ее овсом, напоит и расчешет шкуру. — Шкура самого Шагги также нуждалась в хорошей щетке, но упоминать об этом было бы нетактично. — Даю тебе слово, коню не причинят вреда.</p><p class="p1">Опалив его яростным взором, Шагга выпустил поводья.</p><p class="p1">— Это конь Шагги, сына Дольфа, — рыкнул он на мальчишку.</p><p class="p1">— Если он не вернет кобылу, отруби ему мужской признак и скорми козлу, — предложил Тирион. — Если только найдешь его здесь.</p><p class="p1">Двое стражников в пурпурных плащах и увенчанных львами шлемах стояли под вывеской гостиницы по обе стороны двери. Тирион признал капитана гвардейцев.</p><p class="p1">— Мой отец?</p><p class="p1">— В гостиной, милорд.</p><p class="p1">— Мои люди хотят мяса и меда, — сказал ему Тирион. — Приглядите, чтобы они получили еду и питье. — Тирион вошел в гостиницу. Отец был там.</p><p class="p1">Тайвин Ланнистер, лорд Бобрового утеса и Хранитель Запада, давно разменял шестой десяток, не утратив тем не не менее юношеской крепости. Даже сидя он казался высоким — длинные ноги, широкие плечи, плоский живот. Его тонкие руки оплетали крепкие мышцы. Когда прежде густые волосы начали отступать ото лба, лорд Тайвин приказал своему цирюльнику брить ему голову наголо: глава дома Ланнистеров не верил в полумеры. Еще он выбривал верхнюю губу и подбородок, но бакенбарды, две огромные чащобы, заросшие жестким золотым волосом, покрывали его щеки от уха до уха. В бледно-зеленых глазах его играли золотые искры. Один из шутов, более глупый, чем все остальные, сказанул однажды, что даже дерьмо лорда Тайвина усеяно золотом. Некоторые утверждали, что он еще жив — где-то в подземельях Бобрового утеса.</p><p class="p1">Сир Киван Ланнистер, единственный выживший брат отца, делил бутыль эля с лордом Тайвином. Дядя, человек объемистый и лысеющий, с коротко подстриженной желтой бородой, прилипшей к массивным челюстям, первым увидел его.</p><p class="p1">— Тирион, — проговорил сир Киван с удивлением.</p><p class="p1">— Дядя. — Тирион поклонился. — Милорд-отец. Как я рад видеть вас здесь!</p><p class="p1">Лорд Тайвин даже не пошевельнулся в кресле, но поглядел на своего карлика-сына долгим оценивающим взглядом.</p><p class="p1">— Вижу, что слухи о твоем заточении были необоснованны.</p><p class="p1">— Мне жаль разочаровывать вас, отец, — сказал Тирион. — Только не надо вставать и обнимать меня! Я не хочу вас утруждать…</p><p class="p1">Тирион направился через всю комнату к их столу, четко осознавая, что кривые короткие ноги заставляют его раскачиваться на каждом шагу. Когда глаза отца обращались к нему, Тирион сразу же самым острым образом ощущал все свои недостатки и уродства.</p><p class="p1">— Очень любезно с вашей стороны начать войну ради меня, — проговорил он, залезая в кресло и наливая себе чашу отцовского эля.</p><p class="p1">— На мой взгляд, это ты начал ее, — ответил лорд Тайвин. — Твой брат Джейме никогда не позволил бы себе попасть в руки женщины.</p><p class="p1">— Мы с Джейме кое в чем отличаемся… Он много выше меня ростом, как вы могли заметить.</p><p class="p1">Отец игнорировал выпад.</p><p class="p1">— Речь идет о чести нашего дома. Мне просто пришлось выехать. Никто не может пролить кровь Ланнистеров безнаказанно!</p><p class="p1">— Услыши мой рев, — произнес Тирион, ухмыльнувшись девизу Ланнистеров. — Откровенно говоря, крови я не проливал, хотя это могло случиться раз или два. Моррек и Джик убиты.</p><p class="p1">— Значит, тебе нужны новые слуги.</p><p class="p1">— Не беспокойся, отец. Я обзавелся своими. — Тирион отпил глоток эля, бурого и пенистого, и такого густого, что его почти можно было жевать. Действительно, отличный напиток. Жаль, что отец повесил содержательницу постоялого двора. — И как идут боевые действия?</p><p class="p1">Ответил его дядя:</p><p class="p1">— Пока достаточно хорошо. Сир Эдмар раздробил свое войско на малые отряды, чтобы остановить наши набеги, и мы с твоим лордом-отцом получили возможность нанести им тяжелый урон, прежде чем они сумели соединиться.</p><p class="p1">— Твой брат увенчал себя славой, — сказал отец. — Он разгромил лордов Венса и Пайпера у Золотого Зуба и встретился с основными силами Талли у стен Риверрана. Лорды Трезубца были вынуждены отступить. Сир Эдмар Талли взят в плен со многими своими рыцарями и знаменосцами. Лорд Блэквуд увел немногих уцелевших в Риверран, и Джейме осадил замок. Остальные разбежались по собственным крепостям.</p><p class="p1">— И мы с твоим отцом по очереди выступали против них. Без лорда Блэквуда Древорон сдался сразу, а леди Уэнт сдала Харренхолл из-за недостатка людей. Сир Григор сжег владения Пайперов и Бракенов…</p><p class="p1">— Оставив вас без противника? — спросил Тирион.</p><p class="p1">— Не совсем, — ответил сир Киван. — Маллистеры до сих пор удерживают Сигард, а Уолдер Фрей собирает свои войска у Близнецов.</p><p class="p1">— Не серьезно, — заметил Тайвин. — Фрей выходит на поле брани, только почуяв запах победы, а сейчас пока пахнет смертью. А у Ясона Маллистера не хватит сил сопротивляться в одиночку. Как только Джейме возьмет Риверран, они оба быстро преклонят колена. Войну можно считать выигранной, если только Старки и Аррены не выйдут против нас.</p><p class="p1">— На вашем месте я бы не стал тревожиться из-за Арренов, — сказал Тирион. — Старки — дело другое. Лорд Эддард…</p><p class="p1">— У нас в заложниках, — прервал его отец. — Он не может командовать войском из подземелья Красного замка.</p><p class="p1">— Не может, — согласился сир Киван, — но сын его созвал знамена и стал у рва Кейлин с сильным войском.</p><p class="p1">— Ни один меч нельзя назвать сильным, пока он не закален, — объявил лорд Тайвин. — Этот Старк еще мальчишка. Конечно, ему нравятся звуки походных труб и собственное знамя, трепещущее на ветру. Но всякий поход оканчивается бойней. Боюсь, что у него не хватит отваги на сражение.</p><p class="p1">События приняли интересный поворот за время его отсутствия, решил Тирион.</p><p class="p1">— Ну а что делает наш бесстрашный монарх, как смотрит он на эту бойню? — спросил он. — Неужели моя очаровательная и красноречивая сестра сумела уговорить Роберта примириться с заточением своего милого друга Неда?</p><p class="p1">— Роберт Баратеон погиб, — ответил ему отец. — В Королевской Гавани правит твой племянник.</p><p class="p1">Слова эти заставили Тириона растеряться.</p><p class="p1">— Точнее говоря, моя сестра. — Он отпил эля. Королевство станет совсем иным, если Серсея будет править вместо своего мужа.</p><p class="p1">— Если ты хочешь принести какую-то пользу, я дам тебе приказ, — продолжил отец. — Марк Пайпер и Карил Венс болтаются в нашем тылу и совершают набеги на нашу землю из-за Красного Зубца.</p><p class="p1">Тирион прицокнул зубом.</p><p class="p1">— Прогнать их! Прежде я был бы рад наказать подобную невоспитанность, отец, но сейчас, поверьте, у меня есть настоятельные дела в другом месте.</p><p class="p1">— В самом деле? — Лорд Тайвин не был особенно удивлен. — Еще нам досаждает последняя идея Неда Старка, моим фуражирам мешает некий Берик Дондаррион, какой-то молодой лорденыш, наделенный ложным представлением о доблести. И с ним эта жирная пародия на священника — тот тип, который любит зажигать свой меч. Ну как, сумеешь расправиться с ними? Без особого шума?</p><p class="p1">Тирион вытер рот тыльной стороной ладони и улыбнулся.</p><p class="p1">— Отец, мое сердце греет мысль о том, что вы готовы доверить мне… двадцать человек? Или дадите мне даже пятьдесят? Неужели вы сумеете выделить мне такое огромное войско? Прекрасно! Если я натолкнусь на Тороса или лорда Берика, то сумею выпороть их обоих. — Он спустился с кресла и проковылял к буфету, на котором в окружении фруктов возлежал круг белого сыра с прожилками. — Сперва мне нужно уладить кое-какие дела, — сказал он, отхватив себе клин. — Мне необходимо три тысячи шлемов, столько же калберков и плюс мечи, пики, стальные наконечники копий, боевые булавы и топоры, стальные перчатки, воротники, поножи, нагрудники и фургоны, чтобы перевезти все это…</p><p class="p1">Дверь позади Тириона вдруг распахнулась с таким грохотом, что он едва не выронил сыр. Сир Киван вскочил, ругаясь, когда капитан гвардии пролетел через комнату и рухнул в очаг. Шлем его угодил прямо в холодный пепел, а Шагга, переломив меч гвардейца толщиной в древесный ствол о колено, отбросил обломки и вступил в гостиную, распространяя собственный запах, более крепкий, чем запах сыра.</p><p class="p1">— Маленькая красная шапочка, — рявкнул он. — Если ты еще раз посмеешь угрожать сталью Шагге, сыну Дольфа, я отрежу твое мужское естество и поджарю его на огне.</p><p class="p1">— Что? А как же козел? — спросил Тирион, откусывая сыр.</p><p class="p1">За Шаггой в комнату вошли другие горцы. Бронн сопутствовал им. Наемник, извиняясь, пожал плечами, глянув на Тириона.</p><p class="p1">— И кто же это у нас такой гордый? — спросил лорд Тайвин голосом холодным как снег.</p><p class="p1">— Эти люди проводили меня домой, отец, — пояснил Тирион. — Могу ли я сохранить их при себе? Много они не съедят…</p><p class="p1">Никто не улыбнулся.</p><p class="p1">— По какому праву вы, дикари, врываетесь в зал нашего совета? — потребовал ответа сир Киван.</p><p class="p1">— Дикари, говоришь? — Конн мог бы показаться симпатичным, если бы его отмыли. — Мы — люди свободные, а свободные люди имеют право сидеть на любом военном совете!</p><p class="p1">— Кто из вас львиный лорд? — спросила Чилла.</p><p class="p1">— Это же старики, — объявил Тиметт, сын Тиметта, которому еще предстояло встретить свой двадцатый год.</p><p class="p1">Рука сира Кивана опустилась на рукоять меча, но брат прикосновением пальцев остановил его. Лорд Тайвин казался спокойным.</p><p class="p1">— Тирион, ты забыл о вежливости? Будь добр, познакомь нас с… почетными гостями.</p><p class="p1">Тирион облизнул пальцы.</p><p class="p1">— С удовольствием, — объявил он. — Эта прекрасная дева — Чилла, дочь Чейка, от Черноухих.</p><p class="p1">— Я не дева, — возразила Чилла. — Мои сыновья уже срезали пятьдесят ушей.</p><p class="p1">— Да срежут они еще пятьдесят. — Тирион отошел от нее. — Это Конн, сын Коратта. А вот Шагга, сын Дольфа, тот, что похож на Бобровый утес, обросший волосами. Они — Каменные Вороны. Это Улф, сын Умара, из Лунных Братьев, вот Тиметт, сын Тиметта, из Обгорелых. А это наемник Бронн. Он сам по себе, не из чьих-то людей. За время нашего знакомства он успел дважды переменить стороны, и он должен получить награду, отец. — Обратившись к Бронну и горцам, он произнес: — Позвольте мне представить моего лорда-отца, Тайвина, сына Титоса, из дома Ланнистеров, лорда Бобрового утеса, Хранителя Запада, Щит Ланниспорта, бывшего и будущего десницу короля.</p><p class="p1">Лорд Тайвин поднялся, являя достоинство и корректность.</p><p class="p1">— Даже на западе слыхали про доблесть воинственных обитателей гор Луны. Что доставило вас вниз из ваших твердынь, милорды?</p><p class="p1">— Кони, — ответил Шагга.</p><p class="p1">— Обещанные сталь и шелка, — добавил Тиметт, сын Тиметта.</p><p class="p1">Тирион уже собрался рассказать своему лорду-отцу о том, что обещал кланам превратить Долину Арренов в дымящуюся пустошь, но возможности не представилось. Дверь снова хлопнула и распахнулась. Вестник коротко и удивленно глянул на горцев Тириона, опускаясь на одно колено перед лордом Тайвином.</p><p class="p1">— Милорд, — проговорил он, — сир Аддам велел передать вам, что войско Старков движется по гати.</p><p class="p1">Лорд Тайвин не улыбнулся. Отец никогда не улыбался, но Тирион тем не менее умел читать на его лице.</p><p class="p1">— Итак, волчонок решился оставить свое логово, чтобы поиграть со львами, — проговорил он голосом, полным спокойного удовлетворения. — Великолепно. Возвратитесь к сиру Аддаму и велите ему отступать. Он не должен вступать в сражение с северянами до нашего прибытия, но я хочу, чтобы он нападал на них с флангов и заманивал дальше на юг.</p><p class="p1">— Исполню все, как вы приказываете. — Всадник откланялся.</p><p class="p1">— Мы хорошо устроились здесь, — напомнил сир Киван. — Близко к переправе, вокруг ямы и частоколы. Пусть приходят, мы их остановим.</p><p class="p1">— Мальчишка может отступить или струсить, увидев такое войско, — заметил лорд Тайвин. — Чем быстрее мы сломаем Старков, тем скорее я освобожусь, чтобы расправиться со Станнисом Баратеоном. Вели барабанщикам бить сбор и пошли слово Джейме, что я выхожу против Робба Старка.</p><p class="p1">— Как хочешь, — проговорил сир Киван.</p><p class="p1">Тирион с мрачным восхищением поглядел на отца, повернувшегося к полудиким горцам.</p><p class="p1">— Говорят, что люди горных кланов не знают страха.</p><p class="p1">— Воистину так, — ответил Конн от Каменных Ворон.</p><p class="p1">— И женщины тоже, — добавила Чилла.</p><p class="p1">— Выступайте со мной против моего врага, и вы получите все, что обещал мой сын, и даже более того, — сказал лорд Тайвин.</p><p class="p1">— Но заплатишь ли ты нам нашей собственной монетой? — спросил Улф, сын Умара. — И нужны ли нам обещания отца, когда нам обещал сын?</p><p class="p1">— Я не сказал, что они нужны, — возразил лорд Тайвин. — В словах моих звучала чистая любезность и ничего более. Вы не обязаны присоединяться к нам. Люди Зимних земель выкованы из льда и железа; даже отважнейшие среди моих рыцарей страшатся встретиться с ними лицом.</p><p class="p1">Изящный ход, отметил Тирион, криво улыбнувшись.</p><p class="p1">— Обгорелые люди ничего не страшатся. Тиметт, сын Тиметта, поедет со львами.</p><p class="p1">— Если Обгорелые куда приедут, там уже сидят Каменные Вороны, — с пылом объявил Конн. — Мы едем тоже.</p><p class="p1">— Шагга, сын Дольфа, отрубит им мужское естество и скормит его воронам.</p><p class="p1">— Мы поедем с тобой, львиный лорд, — согласилась Чилла, дочь Чейка, — но только если коротышка будет с нами. Он выкупил свое дыхание обещанием. Жизнь его принадлежит нам, пока мы не получим ту сталь, которую он обещал нам.</p><p class="p1">Лорд Тайвин обратил искрящиеся золотом глаза к своему сыну.</p><p class="p1">— Веселый разговор, — заметил Тирион с отрешенной улыбкой.</p></span>
