<p class="p">Эддард</p>
</div><p class="p1">Он обнаружил Мизинца в гостиной комнате борделя, лорд Бейлиш дружелюбно беседовал с высокой элегантной женщиной в расшитом перьями одеянии, покрывавшем черную, словно чернила, кожу. У очага Хьюард играл в фанты с пышной девкой. Судя по всему, он уже проиграл пояс, кольчугу и правый сапог, девица же еще едва расстегнула свой наряд. Возле окна, по которому текли струи дождя, стоял Джори Кассель, с сухой улыбкой на лице он следил за Хьюардом и наслаждался зрелищем.</p><p class="p1">Нед остановился у подножия лестницы и натянул перчатки.</p><p class="p1">— Пора уходить. Мои дела здесь закончены.</p><p class="p1">Хьюард вскочил на ноги, поспешно собирая свои вещи.</p><p class="p1">— Как вам угодно, милорд, — сказал Джори. — Я помогу Уиллу привести коней. — Он направился к двери.</p><p class="p1">Мизинец прощался долго. Он поцеловал руку чернокожей женщине, шепнул ей на ухо какую-то шутку, от которой она расхохоталась, и только потом повернулся к Неду.</p><p class="p1">— Ваши дела, — спросил он непринужденным тоном, — или Роберта? Говорят, что десница видит сны короля, отдает приказы голосом короля и правит мечом короля. Значит ли это, что ваш член также можно приравнять к королевскому?..</p><p class="p1">— Лорд Бейлиш, — проговорил Нед. — Вы слишком далеко заходите. Конечно, я благодарен вам за помощь. Нам пришлось бы потратить не один год, чтобы самостоятельно обнаружить этот бордель. Но это не значит, что я намереваюсь терпеть ваши насмешки. Я более не десница короля.</p><p class="p1">— Лютоволк — зверь лютый, — заметил Мизинец, резко скривив рот.</p><p class="p1">Под теплым дождем, хлеставшим с черного неба, они направились к конюшне.</p><p class="p1">Нед набросил на голову капюшон плаща. Джори вывел его коня. Молодой Уил следовал за ним, одной рукой выводя кобылу Мизинца; другой он застегивал пояс и завязывал брюки. Из дверей конюшни выглянула, хихикая, босоногая шлюха.</p><p class="p1">— Возвращаемся в замок, милорд? — спросил Джори. Нед кивнул и вскочил в седло. Мизинец последовал его примеру. Джори и другие поскакали за ними.</p><p class="p1">— А у Катаи отличное заведение, — проговорил Мизинец. — Я почти решил купить его. Бордель — куда более надежное вложение денег, чем корабли, я давно понял это. Шлюхи тонут редко, а когда их берут на абордаж пираты, то, как и все прочие, они платят за это доброй монетой. — Лорд Петир усмехнулся собственному остроумию.</p><p class="p1">Нед позволил ему трещать. Спустя какое-то время спутник его успокоился, и они ехали дальше в молчании. Улицы Королевской Гавани казались пустыми и темными. Дождь прогнал всех горожан под крыши. Капли стучали по голове Неда — теплые, как кровь, и безжалостные, как старинный грех. Струйки воды бежали по его лицу.</p><p class="p1">— Роберт не ограничится только моей постелью, — говорила ему Лианна в ту далекую ночь, когда их отец обещал руку дочери молодому лорду Штормового Предела. — Я слыхала, что в Долине у него есть ребенок от какой-то девушки. — Нед держал младенца на своих руках и посему не мог отрицать этого, как не мог он солгать сестре, однако смог заверить ее в том, что поведение Роберта до брака ничего не значит; сказал, что человек он хороший и будет любить ее всем своим сердцем. Лианна лишь улыбнулась. — Любовь — милая штука, драгоценный мой Нед, но она не изменяет природу человека…</p><p class="p1">Девушка была так молода, что Нед не посмел спросить ее о возрасте. Наверняка она была девственницей — в лучших борделях всегда отыщут девственницу для толстосума. Легкие рыжие волосы и веснушки, припорошившие нос. Когда она извлекла грудь, чтобы дать сосок младенцу, Нед заметил веснушки на ее груди.</p><p class="p1">— Я назвала ее Баррой, — сказала она, пока ребенок сосал. — Она так похожа на него, милорд, правда. Его нос, его волосы…</p><p class="p1">Это было действительно так, Эддард Старк прикоснулся к тонким темным волосикам младенца. Черным шелком они казались его пальцам. Как он помнил, у первой дочери Роберта были столь же тонкие волосы.</p><p class="p1">— Когда увидите его, милорд, скажите… если это будет вам угодно, скажите ему, какая она прекрасная девочка!</p><p class="p1">— Я сделаю это, — пообещал Нед. Проклятие! Роберт поклянется в вечной любви и забудет про обеих еще до вечера, но Старк выполнит свои обещания. Он вспомнил обет, данный им Лианне на смертном одре, и цену, которую заплатил, чтобы выполнить его.</p><p class="p1">— И скажите ему, что я больше ни с кем не была, клянусь, милорд, и старыми богами, и новыми. Катая говорит, что у меня из-за ребенка есть еще полгода, и я надеюсь, что он вернется. Скажите ему, что я жду, правда! Я не хочу ни денег, ни камней, его одного. Он всегда был так добр ко мне…</p><p class="p1">Добр к тебе, подумал Нед.</p><p class="p1">— Я скажу ему, дитя, и обещаю тебе — Барра не будет знать нужды.</p><p class="p1">Она улыбнулась, столь трепетно и нежно, что сердце его раскололось. И сейчас ночью, под дождем, Нед видел перед собой лицо Джона Сноу — помолодевшее собственное лицо. Если боги настолько немилосердны к бастардам, подумал он, зачем же они наполняют мужчин похотью?</p><p class="p1">— Лорд Бейлиш, что вам известно о бастардах Роберта?</p><p class="p1">— Ну, для начала, у него их больше, чем у вас.</p><p class="p1">— Сколько же?</p><p class="p1">Мизинец пожал плечами. Ручейки влаги затекали под его плащ.</p><p class="p1">— Какая разница? Если не стеснять себя в количестве женщин, какая-нибудь да одарит тебя подарком, а светлейший никогда не страдал от застенчивости. Я знаю, что он признал парня, которого зачал в ночь свадьбы лорда Станниса в Штормовом Пределе. Едва ли он мог поступить иначе. Мать его, Флорент, племянница леди Селисы, одна из ее прислужниц. Ренли утверждает, что Роберт схватил девицу прямо в пиршественном зале и уволок ее наверх, где и взял в брачной постели, пока Станнис и его невеста танцевали. Лорд Станнис решил, что король запятнал честь дома его жены, и потому, когда мальчик родился, отправил его к Ренли. — Он искоса глянул на Неда. — Еще я слыхал, что у Роберта была пара близнецов от служанки на Бобровом утесе, этих он сделал три года назад, когда посетил Запад, чтобы принять участие в турнире в честь лорда Тайвина. Серсея приказала убить детей и продала мать мимоезжему торговцу. Слишком уж жестокий укол чести Ланнистеров, и к тому же возле их дома!</p><p class="p1">Нед скривился, подобные уродливые повести рассказывали о каждом великом лорде королевства. Он вполне мог поверить, что Серсея Ланнистер способна решиться на такой поступок… но неужели король позволил ему совершиться? Тот Роберт, которого знал Нед, не смирился бы с этим; прежний Роберт не умел еще закрывать глаза на то, чего не хотел видеть.</p><p class="p1">— Почему же Джон Аррен воспылал таким интересом к незаконным детям короля?</p><p class="p1">Невысокий спутник отвечал пожатием влажных плеч.</p><p class="p1">— Он был десницей короля. Наверняка Роберт попросил его приглядеть, чтобы дети его не испытывали нужды.</p><p class="p1">Нед уже промок до костей, застыла даже его душа.</p><p class="p1">— Наверное, все не столь просто, иначе зачем же его убили?</p><p class="p1">Мизинец стряхнул капли с волос и расхохотался.</p><p class="p1">— Ага! Должно быть, лорд Аррен узнал, что светлейший наполняет чревеса каких-то шлюх и рыбацких женок, и поэтому ему пришлось навеки замолчать… Нечего удивляться! Позвольте такому человеку жить, и он установит, что солнце поднимается на востоке.</p><p class="p1">Ответить было нечего, и лорд Старк нахмурился. Впервые за многие годы он подумал о Рейегаре Таргариене. Интересно, как часто он посещал бордели… должно быть, не слишком.</p><p class="p1">Дождь хлынул сильнее, вода щипала глаза и барабанила по земле. Ручейки черной воды бежали с холма.</p><p class="p1">— Милорд! — крикнул Джори, и в голосе его была тревога: буквально в мгновение ока улица наполнилась вооруженными людьми. Нед видел кольчуги на коже, поручни и поножи, стальные шлемы с золотыми львами на гребнях. Плащи прилипали к спинам. Он не считал, но их было по меньшей мере десяток, целая цепочка пеших перекрывала улицу длинными мечами и железными копьями.</p><p class="p1">— Сзади! — вскрикнул Уил, но когда Нед развернул коня, латников, перекрывавших путь к отступлению, оказалось еще больше. Меч Джори со звоном вылетел из ножен.</p><p class="p1">— Дорогу, или вы умрете!</p><p class="p1">— Волки завыли, — осклабился их предводитель. Нед видел струйки дождя, стекавшие по его лицу. — А стая-то невелика!</p><p class="p1">Мизинец направил коня вперед шаг за шагом.</p><p class="p1">— Что это значит? Этот человек — десница короля!</p><p class="p1">— Он был десницей короля. — Грязь хлюпнула под копытами кровного гнедого скакуна. Линия расступилась. На золотом нагруднике панциря гневно рычал лев Ланнистеров. — Теперь, откровенно говоря, я не знаю, что он собой представляет.</p><p class="p1">— Ланнистер, это безумие, — проговорил Мизинец. — Пропусти. Нас ждут в замке. Что ты делаешь?</p><p class="p1">— Он знает, что делает, — отвечал Нед невозмутимо.</p><p class="p1">Джейме Ланнистер улыбнулся.</p><p class="p1">— Совершенно верно. Я ищу моего брата. Вы помните моего брата, лорд Старк? Он был с нами в Винтерфелле, такой светловолосый, с разными глазами и острый на язык. Невысокий такой…</p><p class="p1">— Я прекрасно помню его, — отвечал Нед.</p><p class="p1">— Мне кажется, он нарвался на какие-то неприятности по дороге. Мой лорд-отец раздражен. Вы не представляете, кто мог пожелать зла моему брату?</p><p class="p1">— Ваш брат взят по моему приказу, он должен ответить за свои преступления, — ответил Нед Старк.</p><p class="p1">Мизинец застонал в отчаянии:</p><p class="p1">— Милорды…</p><p class="p1">Сир Джейме выхватил длинный меч из ножен и послал коня вперед.</p><p class="p1">— Обнажите сталь, лорд Эддард. Я зарублю вас, как Эйериса, но лучше, чтобы вы умерли с клинком в руках… — Джейме послал Мизинцу холодный презрительный взгляд. — Лорд Бейлиш, если бы я боялся запятнать кровью дорогую одежду, то поторопился бы отсюда!</p><p class="p1">Мизинца можно было и не понуждать.</p><p class="p1">— Я приведу городскую стражу, — пообещал он Неду. Строй Ланнистеров расступился, пропуская его, и сомкнулся позади. Мизинец ударил пятками в бока кобылы и исчез за углом.</p><p class="p1">Люди Неда обнажили мечи, но их было трое против двадцати. Из окон и дверей за ними следили глаза, но никто не собирался вмешиваться. Однако люди Старка были на конях, а все Ланнистеры — пешие, за исключением самого Джейме. Быстрый бросок мог принести им свободу, но лорду Неду Старку показалось, что у него есть более надежная тактика.</p><p class="p1">— Только убей меня, Цареубийца, — предупредил он, — и Кейтилин прикажет прирезать твоего Тириона.</p><p class="p1">Джейме Ланнистер ткнул в грудь Неда позолоченным мечом, отведавшим крови последнего из королей-драконов.</p><p class="p1">— Разве? Неужели благородная Кейтилин Талли из Риверрана способна убить заложника? Едва ли… — Он вздохнул. — Но я не хочу ставить жизнь моего брата в зависимость от женской прихоти. — Джейме убрал золоченый меч в ножны. — Поэтому я отпускаю вас к Роберту; рассказывайте, как я напугал вас; но сомневаюсь, чтобы король обратил на это внимание. — Джейме откинул мокрые волосы назад и развернул коня. Оказавшись за линией мечников, он оглянулся на капитана. — Трегар, приглядите, чтобы с лордом Старком ничего не случилось.</p><p class="p1">— Как вам угодно, милорд.</p><p class="p1">— И все же… мы не можем оставить его полностью безнаказанным. Поэтому, — сквозь ночь и дождь Нед увидел белозубую улыбку Джейме, — убейте его людей!</p><p class="p1">— Нет! — выкрикнул Нед Старк, выхватывая меч. Джейме уже отъехал по улице, когда услышал крик Уила. Люди Ланнистеров сходились навстречу. Нед затоптал одного, призраки в красных плащах расступились перед его мечом. Джори Кассель ударил коня пятками и бросился вперед. Подкованное сталью копыто с мерзким хрустом раздробило лицо гвардейцу Ланнистеров. Другой отступил, и на мгновение Джори очутился на свободе. Уил ругнулся, когда его стащили с умирающего коня, под дождем замелькали мечи. Нед подскакал к ним и обрушил свой меч на шлем Трегара. Сотрясение от удара заставило стиснуть зубы, Трегар упал на колени, львиный гребень был перерублен пополам, кровь хлынула на лицо. Хьюард рубил по рукам, хватавшим коня за уздечку, но копье поразило его в живот. Внезапно Джори оказался среди них, красный дождь тек с его меча.</p><p class="p1">— Нет! — закричал Старк. — Джори, назад! — И тут лошадь его поскользнулась под ним и рухнула в грязь. Вспыхнула ослепляющая боль, рот его наполнился кровью.</p><p class="p1">Нед видел, как они подрубили ноги коня Джори, стащили его на землю, как заметались мечи. Когда лошадь Неда поднялась на ноги, он попытался последовать ее примеру, но снова упал, задохнувшись криком, успев заметить перед этим разорвавшую кожу кость. Более он не видел ничего, а дождь шел, шел и шел.</p><p class="p1">Открыв снова глаза, лорд Эддард понял, что оказался со своими убитыми. Лошадь пододвинулась ближе, но, почуяв едкий запах крови, метнулась прочь. Нед пополз через грязь, стиснув зубы от мучительной боли. Он полз, наверное, годы. Из освещенных окон смотрели лица, люди начали выходить из дверей, но никто не шевельнулся, чтобы помочь. Мизинец и городская стража обнаружили его на улице, обнимающим тело Джори Касселя. Золотые плащи отыскали где-то носилки, но путешествие назад в замок слилось в сплошную муку, и Нед не один раз терял сознание. Он помнил только, как вырос перед ним Красный замок в первом свете зари. Дождь превратил бледно-розовые камни стен в кровавые.</p><p class="p1">А потом над ним с чашей в руках возник великий мейстер, он шептал:</p><p class="p1">— Пейте, милорд. Пейте, это маковое молочко, оно облегчит боль. — Нед помнил, как глотнул, а Пицель велел кому-то вскипятить вина и потребовал чистого шелка. Потом все исчезло.</p></span>
