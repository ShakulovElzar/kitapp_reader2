<span id="id16"><div class="title2">
<p class="p">Санса</p>
</div><p class="p1">Эддард Старк уехал с рассветом, септа Мордейн сообщила об этом Сансе, когда они приступили к завтраку.</p><p class="p1">— Король послал за ним. Должно быть, они охотятся. В этих краях, как говорят, до сих пор обитают дикие зубры.</p><p class="p1">— Я никогда не видела зубра, — вздохнула Санса, переправляя кусок бекона сидевшей под столом Леди. Волчица приняла кусок из руки элегантным движением королевы.</p><p class="p1">Септа Мордейн неодобрительно фыркнула.</p><p class="p1">— Благородная леди не кормит собак под столом, — сказала она, отламывая еще один кусок сотов и выпуская капли меда на хлеб.</p><p class="p1">— Это не собака, а лютоволчица, — заметила Санса, когда Леди лизнула ее пальцы шершавым языком. — Во всяком случае, отец разрешил нам держать их.</p><p class="p1">Септа не смягчилась.</p><p class="p1">— Ты хорошая девочка, Санса, но клянусь, когда речь заходит об этом звере, становишься столь же прихотливой, как твоя сестра Арья. — Она нахмурилась. — Кстати, где она сейчас?</p><p class="p1">— Она не голодна, — ответила Санса, прекрасно понимая, что сестра ее, по всей видимости, прокралась в кухню не один час назад и заставила какого-нибудь поваренка накормить ее.</p><p class="p1">— Напомни, чтобы она сегодня оделась получше. Наверное, в серый бархат. Мы приглашены прокатиться с королевой и принцессой Мирцеллой в их доме на колесах и должны выглядеть как положено.</p><p class="p1">Санса и без того выглядела прекрасно. Она до блеска расчесала длинные рыжеватые волосы и выбрала лучшие голубые шелка. Сегодняшнего дня она ждала почти целую неделю. Ехать с королевой — великая честь, к тому же там будет принц Джоффри, ее жених. Мысль эта вызвала в душе ее странный трепет, хотя до брака оставались еще годы и годы. Санса почти не знала Джоффри, но уже успела влюбиться в него. Именно таким она и видела своего принца: высоким и сильным, золотоволосым красавцем. Она ценила каждую возможность провести время с ним. Пугала ее сегодня лишь Арья. Сестра всегда умела все напортить. И что она выкинет, никогда нельзя было предсказать заранее.</p><p class="p1">— Я скажу ей, — проговорила Санса неуверенно, — но Арья оденется как всегда. — Оставалось только мечтать, что это не вызовет неловкости. — Могу ли я выйти из-за стола?</p><p class="p1">— Безусловно. — Септа Мордейн взяла новый кусок хлеба и сотов, а Санса соскользнула со скамьи. Леди последовала за ней к выходу из гостиницы.</p><p class="p1">Снаружи она немного постояла, прислушиваясь к крикам, ругательствам и скрипу деревянных колес; мужчины складывали шатры и палатки, грузили фургоны перед очередным переходом. Приземистая гостиница, сложенная из белого камня, оказалась самой большой из всех, которые уже видела Санса, но тем не менее смогла вместить менее трети отряда короля, уже распухшего до четырех сотен после того, как к нему добавились челядь ее отца и свободные всадники, присоединившиеся по дороге.</p><p class="p1">Они обнаружили Арью на берегах Трезубца, она вычесывала засохшую грязь из шерсти Нимерии, пытаясь удержать ее на месте. Лютоволчица не испытывала восторга от этого занятия. Арья была в том же самом костюме для верховой езды, что вчера и позавчера.</p><p class="p1">— Надень что-нибудь покрасивее, — предупредила сестру Санса, — септа Мордейн так сказала. Мы будем путешествовать в повозке королевы с принцессой Мирцеллой.</p><p class="p1">— Только не я! — воскликнула Арья, вычесывая репей из взлохмаченного серого меха Нимерии. — Мы с Микой отправляемся вверх по течению поискать рубины у брода.</p><p class="p1">— Рубины, — в недоумении проговорила Санса, — какие рубины?</p><p class="p1">Арья посмотрела на сестру, удивляясь подобной глупости.</p><p class="p1">— Рубины Рейегара. Это как раз то самое место, где король Роберт убил его и захватил корону.</p><p class="p1">Санса с недоверием посмотрела на свою младшую сестрицу.</p><p class="p1">— Ты не можешь отправляться за рубинами, принцесса ждет нас обеих.</p><p class="p1">— Мне там неинтересно, — взмахнула рукой Арья. — В повозке даже нет окон, оттуда ничего не увидишь.</p><p class="p1">— И что ты хочешь увидеть? — возмутилась Санса. Такое чудесное приглашение, а глупая сестра намеревается все погубить; как раз этого она и опасалась. — Вокруг только поля, хутора, фермы и крепости.</p><p class="p1">— Это не так, — упрямо сказала Арья. — Если бы ты иногда ездила с нами, то увидела бы…</p><p class="p1">— Ненавижу верховую езду, — раздраженно ответила Санса. — После нее ты чувствуешь себя грязной, пыльной, и тело болит.</p><p class="p1">Арья пожала плечами.</p><p class="p1">— Тише ты, — рявкнула она на Нимерию, — ничего с тобой не случится. — А потом сказала, обращаясь к Сансе: — Пока мы пересекали перешеек, я насчитала тридцать шесть видов цветов, которых никогда не видела, а Мика показал мне львоящера.</p><p class="p1">Санса поежилась. Перешеек они пересекали извилистой обходной дорогой, пролегшей по бесконечному черному болоту, двенадцать дней, и каждое мгновение пути казалось ей ненавистным. Воздух был сырым и липким. Сама дорога сузилась настолько, что вечером они не могли даже найти место для настоящего лагеря и устроились ночевать прямо на Королевском тракте. Густые чащобы наполовину утонувших в воде деревьев стискивали дорогу, с ветвей их свисали наросты грибов. Огромные цветы раскидывали в грязи свои лепестки, плавали в лужах стоялой воды, и всякого, у кого хватало глупости оставить насыпь, чтобы сорвать их, ожидали трясины, готовые поглотить человека. На деревьях караулили змеи, а львоящеры плавали, напоминая черные бревна с глазами и зубами.</p><p class="p1">Но ничто, конечно, не могло остановить Арью. Однажды она вернулась с улыбкой во всю свою физиономию, лохматая, вся в грязи, но с букетом пурпурных и зеленых цветов для отца. Санса надеялась, что он велит Арье вести себя, как подобает высокородной леди. Но отец не стал ругать ее, только обнял и поблагодарил за цветы. Это еще более расстроило Сансу.</p><p class="p1">А потом оказалось, что пурпурные венчики здесь называют жгучецветом, и руки Арьи сперва покраснели, а потом на них выступили волдыри. Санса надеялась, что случившееся наконец образумит сестру, но Арья только смеялась и на следующий день вымазала руки грязью, словно невежественная селянка, потому что ее приятель Мика сказал, что так можно остановить зуд. На плечах и руках сестры проступали синяки, темно-пурпурные, желто-зеленые с резкими границами и бледные, расплывшиеся. Санса заметила их, когда сестра раздевалась перед сном. Однако где и как Арья заработала их, знали только семь богов.</p><p class="p1">Арья все еще занималась своим делом и, расчесывая шерсть Нимерии, трещала о том, что видела на пути на юг.</p><p class="p1">— На прошлой неделе мы нашли сторожевую башню с призраками, а за день до того гоняли табун диких лошадей. Видела бы ты, как они полетели, когда уловили запах Нимерии. — Волчица дернулась под рукой, и Арья обругала зверя: — Прекрати, мне нужно расчесать еще другой бок, ты вся в грязи.</p><p class="p1">— Но ты не должна оставлять отряд, — напомнила ей Санса. — Отец запретил.</p><p class="p1">Арья пожала плечами:</p><p class="p1">— Я никогда не отъезжала далеко. И во всяком случае, рядом со мной всегда была Нимерия. И я не каждый раз съезжаю с дороги. Иногда просто интересно ехать среди фургонов, поговорить с людьми.</p><p class="p1">Сансу раздражали те люди, с которыми любила разговаривать Арья: сквайры, конюхи, служанки, старики и голые дети, не стесняющиеся в выражениях свободные всадники неизвестного происхождения. Арья умела подружиться со всеми. А этот Мика был еще хуже: сын мясника, тринадцатилетний дикарь, он спал в мясном фургоне, от него пахло бойней. Только от одного вида его Сансу тошнило, но Арья явно предпочитала его общество.</p><p class="p1">Терпение Сансы кончалось.</p><p class="p1">— Тебе придется пойти со мной, — жестко сказала она сестре. — Ты не можешь отказать королеве. Септа Мордейн будет ожидать тебя.</p><p class="p1">Арья словно не слышала сестру. Она налегла на щетку, Нимерия сердито заворчала и вырвалась.</p><p class="p1">— Ну-ка, сюда!</p><p class="p1">— Там будет лимонный пирог и чай, — продолжала Санса, подражая рассудительным взрослым. Леди припала к ее ноге. Санса почесала за ушами волчицы, и Леди села возле нее, поглядывая, как Арья ловит Нимерию. — Зачем нужно ездить на старой вонючей кобыле, зарабатывать себе синяки и потеть, когда можно отдыхать на перьевых подушках и есть вместе с королевой?</p><p class="p1">— Мне не нравится королева, — спокойно отвечала Арья. Санса задохнулась, потрясенная тем, что Арья запросто сказала подобную вещь, но сестра все трещала без умолку. — Она даже не позволит мне взять с собой Нимерию.</p><p class="p1">Арья заткнула гребень за пояс и направилась к своей волчице. Та с опаской следила за ее приближением.</p><p class="p1">— Королевская повозка для волков не место, — сказала Санса. — И принцесса Мирцелла боится их, ты знаешь это.</p><p class="p1">— Мирцелла еще совсем маленькая. — Арья ухватила Нимерию за шкуру на шее, но в тот самый миг, когда она извлекла щетку, волчица вновь вырвалась на свободу. Разочарованная Арья бросила щетку. — Ах ты, сквернавка! — выкрикнула она.</p><p class="p1">Санса не могла не улыбнуться. Некогда главный псарь говорил, что животные всегда похожи на хозяев. Она торопливо обняла Леди, та лизнула ее в щеку. Санса хихикнула. Арья услышала и повернулась, обдав сестру яростным взглядом.</p><p class="p1">— Мне безразлично, что ты там говоришь, я не поеду. Я уезжаю кататься верхом.</p><p class="p1">Длинная лошадиная физиономия свидетельствовала о готовности выкинуть очередную штуку.</p><p class="p1">— Видят боги, Арья, иногда ты поступаешь подобно ребенку, — сказала Санса. — Тогда я отправлюсь одна. Так день пройдет приятнее. Мы с Леди съедим все лимонные пироги и повеселимся без тебя.</p><p class="p1">Она отвернулась, но Арья крикнула вслед:</p><p class="p1">— Тебе-то они позволят взять с собой и Леди. — Погнавшаяся вдоль реки за Нимерией сестра исчезла из виду прежде, чем Санса успела придумать ответ. Униженная и одинокая, Санса постаралась вернуться в гостиницу долгим путем, чтобы отдалить встречу с ожидавшей ее септой Мордейн. Леди невозмутимо топала возле нее. Слезы подступали к глазам Сансы. Она хотела лишь одного: чтобы все было хорошо и мирно, как всегда бывает в песнях. Ну почему Арья не умеет быть ласковой, деликатной и доброй, подобно принцессе Мирцелле? Она предпочла бы такую сестрицу.</p><p class="p1">Санса никогда не могла понять, почему они так не похожи — две сестры, которых разделяли всего два года. Уж лучше бы Арья была незаконнорожденной, подобно их брату Джону. Она даже внешне напоминала Джона длинным лицом и каштановыми волосами Старков — ничего общего с их леди-матерью. Джона же родила женщина из простонародья, так шептали люди. Однажды, когда она была маленькой, Санса даже спросила у матери, не случилась ли какая-нибудь ошибка. Быть может, ее настоящую сестру утащили грамкины? Но мать расхохоталась и покачала головой. Арья действительно была законной дочерью лорда Старка и истинной сестрой Сансы. Санса не знала причин, которые могли бы заставить мать солгать, и поэтому решила, что все так и есть.</p><p class="p1">Когда она приблизилась к центру стана, то скоро забыла о расстройстве. Вокруг повозки королевы собралась толпа. Санса слышала голоса, жужжавшие пчелиным ульем. Двери были распахнуты настежь, и королева стояла на верхней деревянной ступени, улыбаясь кому-то внизу. Девушка услышала ее слова:</p><p class="p1">— Совет оказывает нам великую честь, мои добрые лорды.</p><p class="p1">— Что происходит? — спросила она у знакомого сквайра.</p><p class="p1">— Совет прислал всадников из Королевской Гавани, чтобы встретить нас и проводить до конца дороги, — ответил он. — Почетный караул для короля.</p><p class="p1">Стремясь увидеть все своими глазами, Санса позволила Леди расчистить дорогу в толпе. Люди торопливо расступались перед лютоволком. Подойдя ближе, Санса увидела двоих рыцарей, преклонявших колени перед королевой. Они были в доспехах столь прекрасных и пышных, что она даже заморгала.</p><p class="p1">На одном рыцаре был причудливый панцирь, набранный из покрытых эмалью белых чешуек, искрившихся свежевыпавшим снегом, серебряные перевязки и застежки блестели на солнце. Когда он снял шлем, Санса увидела седины под стать белизне доспехов, однако старый рыцарь сохранил изящество и силу. С плеч его свисал чисто-белый плащ Королевской гвардии.</p><p class="p1">Спутника его, мужчину лет двадцати, облегала стальная броня, отливавшая густой лесной зеленью. Санса еще не видела такого красавца: высокий, могучий, россыпь черных как смоль волос на плечах, на чисто выбритом лице смеющиеся глаза — зеленые, в тон доспехам. Под рукой он держал шлем, ветвистые рога горели золотом.</p><p class="p1">Сперва Санса не заметила третьего незнакомца. Он не преклонял колени вместе с остальными. Отступив в сторону, худой и мрачный, он молча следил за происходящим, оставаясь возле коней. Лишенное бороды лицо его избороздили рытвины. Глаза прятались в ямах над впалыми щеками. Он еще не был стар, но на голове его, над самыми ушами, осталось лишь несколько клоков волос, длинных, как у женщины. Простая железная кольчуга его, надетая на несколько слоев дубленой кожи, носила следы времени и частого употребления. Над его правым плечом поднималась кожаная рукоять закинутого за спину меча. Огромный двуручный клинок был слишком длинен, чтобы носить его сбоку.</p><p class="p1">— Король отправился на охоту, но я знаю, по возвращении он будет рад видеть вас, — говорила королева двоим рыцарям, преклонявшим перед ней колени, но Санса не могла отвести глаз от третьего человека. Тот, казалось, ощутил тяжесть ее взгляда. И медленно повернул голову. Леди заворчала. Ужас, еще незнакомый Сансе Старк, вдруг наполнил ее. Толкнув кого-то, она отступила назад.</p><p class="p1">Сильные руки ухватили ее за плечи, и на мгновение Санса решила, что это отец, но, обернувшись, увидела обгорелое лицо Сандора Клигана, глядевшего на нее сверху вниз; рот его кривила жуткая пародия на улыбку.</p><p class="p1">— Что же ты дрожишь, девочка? — спросил он скрежещущим голосом. — Неужели я так испугал тебя?</p><p class="p1">Это было правдой, она боялась его с первой же встречи… с первого взгляда на разрушения, причиненные огнем его лицу, хотя теперь казалось, что Клиган и наполовину не пугает ее так, как тот, другой. Но все же Санса отодвинулась от него: Пес расхохотался, и Леди встала между ними, грозно ворча. Санса упала на колени, обхватив руками волчицу. Все собрались вокруг с открытыми ртами. Санса чувствовала, что на нее смотрят, тут и там раздавались обидные комментарии и смешки.</p><p class="p1">— Волк, — сказал мужчина.</p><p class="p1">Другой добавил:</p><p class="p1">— Седьмое пекло, это лютоволк.</p><p class="p1">И первый голос промолвил:</p><p class="p1">— А что он делает в лагере?</p><p class="p1">Скрежещущий голос Пса ответил:</p><p class="p1">— У Старков они вместо нянек.</p><p class="p1">Тут Санса поняла, что двое незнакомых ей рыцарей с мечами в руках глядят на нее и Леди, и вновь ощутила испуг и стыд. Слезы наполнили ее глаза.</p><p class="p1">Она услышала, как королева сказала:</p><p class="p1">— Джоффри, подойди к ней.</p><p class="p1">И ее принц оказался рядом.</p><p class="p1">— Оставь ее в покое, — приказал Джоффри Псу. Принц остановился над ней, прекрасный в синей шерсти и черной коже, золотые локоны сверкали на солнце, словно корона. Подал ей руку и поднял с колен. — Что случилось, моя милая леди? Чего вы боитесь? Никто вас не ударит. А вы уберите мечи. Этот волк у нее вместо собаки. — Он поглядел на Сандора Клигана. — Вот что, Пес, убирайся, не надо пугать мою невесту.</p><p class="p1">Пес, как всегда верный, невозмутимо поклонился и растворился в толпе. Санса постаралась твердо стоять на ногах. Она ощущала себя такой дурой! Она — благородная леди родом из Старков Винтерфеллских, будущая королева.</p><p class="p1">— Это не он, мой милый принц, — попыталась она объяснить. — Я испугалась этого человека.</p><p class="p1">Двое незнакомых рыцарей обменялись взглядами.</p><p class="p1">— Пейна? — хихикнул молодой человек в зеленом панцире.</p><p class="p1">Старик снисходительно обратился к Сансе:</p><p class="p1">— Сир Илин нередко пугает и меня самого, милая леди. Жуткий человек.</p><p class="p1">— Так и должно быть. — Королева спустилась из повозки. Собравшиеся расступились, давая ей дорогу. — Ведь если злые не боятся королевского правосудия, значит, мы назначили на эту должность неподходящего человека.</p><p class="p1">Санса наконец нашла нужные слова.</p><p class="p1">— Тогда вы, бесспорно, назначили нужного человека, светлейшая государыня, — отвечала она, и смех ветерком охватил всех вокруг.</p><p class="p1">— Хорошо сказано, дитя, — заметил старик в белой броне. — Как и подобает дочери Эддарда Старка. Считаю за честь наше знакомство, невзирая на внезапность и обстоятельства. Я — сир Барристан Селми, из Королевской гвардии. — Он поклонился.</p><p class="p1">Когда Санса услыхала это имя, все любезные слова, которым ее год за годом учила септа Мордейн, вернулись назад.</p><p class="p1">— Лорд-начальник Королевской гвардии, — сказала она. — Советник Роберта, нашего короля, и Эйериса Таргариена, предшественника его. Наша встреча честь для меня, добрый рыцарь. Даже на далеком севере певцы воспевают Барристана Отважного.</p><p class="p1">Зеленый рыцарь вновь расхохотался.</p><p class="p1">— Ты хочешь сказать — Барристана Старого. Не льсти так ему, дитя, он и без того слишком себя превозносит. — Рыцарь улыбнулся. — Ну а теперь, девушка с волком, если ты сумеешь назвать и мое имя, значит, я действительно вижу дочь королевской десницы.</p><p class="p1">Джоффри напрягся возле нее.</p><p class="p1">— Обращайся почтительнее с моей невестой.</p><p class="p1">— Я могу ответить, — заторопилась Санса, чтобы успокоить гнев принца. Она улыбнулась зеленому рыцарю. — На шлеме твоем золотые рога, милорд. Олень — это герб королевского дома. У короля два брата. Судя по твоей крайней молодости, ты можешь быть только Ренли Баратеоном, лордом Штормового Предела и советником короля, и это имя я называю.</p><p class="p1">Сир Барристан усмехнулся:</p><p class="p1">— Судя по его крайней молодости, он может зваться просто Брыкучим Ослом, так именую его я.</p><p class="p1">Послышался общий смех, первым засмеялся сам лорд Ренли. Былая напряженность исчезла, Санса начала успокаиваться… но тут сир Илин Пейн, отодвинув плечами двоих мужчин, встал перед ней без тени улыбки на лице. Он не проронил ни слова. Леди обнажила зубы и заворчала, негромко, но грозно. Но на этот раз Санса успокоила волчицу, ласково положив ей на голову руку.</p><p class="p1">— Прошу прощения, если я оскорбила вас, сир Илин.</p><p class="p1">Она ожидала ответа, но его не последовало. Палач поглядел на нее бесцветными глазами, словно бы срывая с тела Сансы одежду, а затем и кожу, так что перед ним осталась лишь одна нагая душа. Так и не проронив ни слова, он повернулся и отошел в сторону.</p><p class="p1">Санса ничего не поняла. Она поглядела на принца.</p><p class="p1">— Неужели я сказала что-то не так, ваша светлость? Почему он не заговорил со мной?</p><p class="p1">— Сир Илин последние четырнадцать лет не ощущает склонности к разговору, — заметил лорд Ренли с лукавой улыбкой.</p><p class="p1">Джоффри одарил дядю полным ненависти взглядом, а потом взял руки Сансы в свои.</p><p class="p1">— Эйерис Таргариен велел вырвать его язык раскаленными щипцами.</p><p class="p1">— Теперь он проявляет свое красноречие мечом, — проговорила королева, — и в преданности сира Илина нашему государству нельзя усомниться. — Тут она улыбнулась и добавила: — Санса, мы должны переговорить с добрыми советниками, пока король не вернется с твоим отцом. Боюсь, что нам придется отложить твой визит к Мирцелле. Пожалуйста, передай своей милой сестре мои извинения. Джоффри, быть может, ты постараешься сегодня развлечь наших гостей?</p><p class="p1">— Это порадует меня, мать, — очень официально поклонился Джоффри. Он взял Сансу за руку и отвел от повозки, и сердце девушки затрепетало. Целый день с принцем! Она восторженно поглядела на Джоффри и подумала, что он такой галантный и что он уже спас ее — от Илина и Пса, прямо как в песне, — в той, где Сирвен Зеркальный Щит спас принцессу Дейерис от гигантов. Или в песне про принца Эйемона Рыцаря Дракона, который защитил честь королевы Нейерис от злой клеветы сира Моргила.</p><p class="p1">Прикосновение руки Джоффри к ее рукаву заставило сердце Сансы забиться сильнее.</p><p class="p1">— И чем тебе хочется сейчас заняться?</p><p class="p1">Быть с тобой, подумала Санса, но не сказала этого.</p><p class="p1">— А чем хочет заняться мой принц?</p><p class="p1">Джоффри подумал мгновение.</p><p class="p1">— Можно покататься верхом.</p><p class="p1">— О, я обожаю верховую езду, — сказала Санса.</p><p class="p1">Джоффри поглядел на Леди, следовавшую за ними по пятам:</p><p class="p1">— Твой волк способен напугать лошадей, а мой Пес пугает тебя. Пусть оба они останутся здесь и не мешают нам, как по-твоему?</p><p class="p1">Санса помедлила.</p><p class="p1">— Если тебе это понравится, я могу привязать Леди. — Она не совсем поняла его. — А я не знала, что у тебя есть собака…</p><p class="p1">Джоффри расхохотался:</p><p class="p1">— Этот пес принадлежит моей матери. Она приставила его охранять меня, что он и делает.</p><p class="p1">— Так ты имеешь в виду Пса, — проговорила она. Санса готова была ударить себя за непонятливость. Принц никогда не полюбит ее, если она будет такой глупой. — А не опасно ехать без него?</p><p class="p1">Принцу Джоффри ее слова показались досадными.</p><p class="p1">— Не опасайся, леди. Я почти взрослый и не умею фехтовать палками, подобно твоим братьям. Мне нужен только он.</p><p class="p1">Принц извлек свой меч, чтобы показать ей. Длинный клинок искусно укоротили, чтобы он подошел двенадцатилетнему мальчику, — выкованная в замке обоюдоострая блестящая синева, с кожаной рукоятью и львиной головой вместо яблока. Санса восхитилась мечом, и Джоффри выразил удовлетворение.</p><p class="p1">— Я зову его Львиным Зубом, — сказал он.</p><p class="p1">Так, оставив позади себя ее лютоволка и его телохранителя, они направились по северному берегу Трезубца, охраняемые лишь Львиным Зубом.</p><p class="p1">День выдался великолепный, даже волшебный. Воздух благоухал цветами, леса здесь были исполнены мягкой красы, которой Санса никогда не замечала на севере. Конь принца Джоффри, кровный гнедой скакун, был легок как ветер, и принц мчался вперед, забыв обо всем. Да так быстро, что Санса едва успевала держаться вровень на своей кобыле. День этот был создан для приключений. Они обследовали пещеры на берегу реки и загнали сумеречного кота в его логово, а когда проголодались и Джоффри отыскал по струйке дыма стоянку, он велел мужчинам доставить еду и вино для их собственного принца и его дамы.</p><p class="p1">Они перекусили форелью, только что выловленной в реке, и Санса выпила вина больше, чем когда-нибудь прежде.</p><p class="p1">— Отец позволяет нам одну чашу и то лишь на пиру, — пожаловалась она.</p><p class="p1">— Моя невеста может пить сколько ей хочется, — проговорил Джоффри, подливая еще.</p><p class="p1">Поев, они отправились дальше — уже медленнее. Джоффри пел голосом высоким, чистым и приятным. Голова Сансы чуть кружилась от выпитого вина.</p><p class="p1">— А не повернуть ли нам назад? — спросила она.</p><p class="p1">— Скоро повернем, — обещал Джоффри. — Поле битвы уже рядом, как раз у той излучины. Там мой отец убил Рейегара Таргариена, ты это знаешь. Он ударил его в грудь, трах, и он умер. — Джоффри размахнулся воображаемым боевым молотом, чтобы показать Сансе, как это было сделано. — Потом дядя Джейме убил старого Эйериса, и мой отец сделался королем. Правда, здорово? А это что за звук?</p><p class="p1">Санса тоже услыхала плывущее над лесом деревянное «тук-тук-тук».</p><p class="p1">— Не знаю, — отвечала она, внезапно заволновавшись. — Джоффри, лучше повернуть назад.</p><p class="p1">— Я хочу посмотреть, что там. — Джоффри повернул коня в сторону звука, и Сансе оставалось только последовать за ним. Шум становился громче и четче — стучало дерево о дерево, — подъехав поближе, они услышали пыхтение и какое-то бормотание.</p><p class="p1">— Там кто-то есть, — тревожно проговорила Санса и, вспомнив про Леди, пожалела, что оставила волчицу в лагере.</p><p class="p1">— Со мной ты в безопасности. — Джоффри извлек из ножен свой Львиный Зуб. Сталь скользнула по коже, и Санса поежилась. — Нам туда, — показал он на рощу.</p><p class="p1">Там на поляне возле реки мальчик и девочка играли в рыцарей. Мечи их — деревянные палки — нетрудно было принять за древки метлы; они бегали по траве и отчаянно размахивали своим оружием. Мальчик был постарше, на голову выше и много сильнее, и он побеждал. Девочка, неряха в грязном кожаном костюме, тем не менее умудрялась отражать большинство ударов мальчишки, хотя и не все. Но когда она попыталась ударить его, он отбросил ее палку своей и стукнул по пальцам. Девочка вскрикнула и выронила оружие.</p><p class="p1">Принц Джоффри расхохотался. Мальчик оглянулся недоуменными глазами, вздрогнул и выронил свою палку в траву. Девочка яростно посмотрела на них, посасывая костяшки, чтобы извлечь занозу, и Санса ужаснулась.</p><p class="p1">— Арья? — не веря своим глазам, позвала она.</p><p class="p1">— Убирайся, — крикнула ей сестра сквозь гневные слезы на глазах. — Что вы делаете здесь? Оставьте нас вдвоем.</p><p class="p1">Джоффри поглядел на Арью, Сансу, опять на Арью.</p><p class="p1">— Это твоя сестра? — Санса, покраснев, кивнула. Принц посмотрел на мальчика, нескладного, с грубым веснушчатым лицом и густыми красными волосами. — А ты кто такой? — спросил он командным тоном, не обращая внимания на то, что мальчик был на год его старше.</p><p class="p1">— Мика, — пробормотал парнишка. Он узнал принца и опустил глаза. — Милорд.</p><p class="p1">— Это сын мясника, — проговорила Санса.</p><p class="p1">— Мой друг, — резко сказала Арья. — Оставьте его в покое.</p><p class="p1">— Сын мясника, который хочет стать рыцарем, так? — Джоффри нагнулся с коня с мечом в руке. — Возьми-ка свой меч, сын мясника, — велел принц, и глаза его посветлели от удовольствия. — Посмотрим, насколько ты хорош в бою.</p><p class="p1">Мика стоял, замороженный страхом. Джоффри подошел к нему.</p><p class="p1">— Ну, бери же, или ты сражаешься только с маленькими девочками?</p><p class="p1">— Она сама просила меня, милорд, — проговорил Мика. — Сама просила.</p><p class="p1">Сансе оставалось только посмотреть на Арью — румянец на лице сестры показывал, что мальчик говорил правду, но Джоффри не был в настроении шутить. Вино ударило ему в голову.</p><p class="p1">— Ты намереваешься взять свой меч?</p><p class="p1">Мика качнул головой:</p><p class="p1">— Это только палка, милорд. Это не меч, это всего лишь палка.</p><p class="p1">— А ты всего лишь сын мясника, а не рыцарь. — Джоффри поднял Львиный Зуб, кольнул острием клинка щеку трепещущего сына мясника. — Но дерешься с сестрой миледи. Или ты этого не знаешь? — Яркая капля крови выступила под глазом Мики, где меч прорезал кожу, и медленно поползла по щеке.</p><p class="p1">— Остановись! — завопила Арья, хватаясь за палку.</p><p class="p1">Санса испугалась:</p><p class="p1">— Арья, немедленно прекрати!</p><p class="p1">— Я не стану причинять ему боли… большой, — отвечал Арье принц Джоффри, не отводя глаз от мальчика-мясника.</p><p class="p1">Арья приближалась к принцу. Санса соскочила с кобылы, но опоздала. Сестра уже ударила обеими руками. Деревянная палка с громким треском переломилась о затылок принца, потом все помутилось перед глазами потрясенной Сансы. Джоффри пошатнулся и оглянулся, выкрикивая угрозы. Мика бросился к деревьям со всей скоростью, на которую были способны его ноги. Арья вновь ударила Джоффри, но на этот раз он принял удар Львиным Зубом и выбил из ее рук переломанную палку. Затылок принца кровоточил, глаза полыхали огнем. Санса кричала:</p><p class="p1">— Нет, нет, прекратите, остановитесь оба, вы все испортили! — Но никто не слушал.</p><p class="p1">Арья подобрала камень и бросила в голову Джоффри. Но вместо этого угодила в коня, и кровный гнедой, поднявшись на дыбы, отправился галопом следом за Микой.</p><p class="p1">— Прекрати, не надо, прекрати! — визжала Санса. Джоффри замахнулся на Арью мечом, выкрикивая жуткие грязные слова. Испуганная девочка отскочила, Джоффри следовал за ней, гоня к лесу. Санса не знала, что делать. Она беспомощно наблюдала за происходящим, почти ослепнув от слез.</p><p class="p1">Тут мимо нее мелькнула серая молния, и внезапно появившаяся Нимерия сомкнула челюсти на руке Джоффри. Сталь выпала из его пальцев. Волчица сбила принца с ног, он покатился по траве и закричал от боли.</p><p class="p1">— Уберите ее! — завопил он. — Уберите!</p><p class="p1">Голос Арьи хлестнул ударом кнута:</p><p class="p1">— Нимерия!</p><p class="p1">Волчица выпустила Джоффри и подошла к Арье. Лежа в траве, Джоффри, застонав, взялся за поврежденную руку. На рубахе его выступила кровь.</p><p class="p1">Арья сказала:</p><p class="p1">— Она не причинила тебе боли… большой.</p><p class="p1">Подобрав Львиный Зуб, она встала над принцем, держа меч обеими руками.</p><p class="p1">Джоффри поглядел на нее с испугом и с присвистом вымолвил:</p><p class="p1">— Не бей меня, я скажу матери.</p><p class="p1">— Оставь его в покое! — завопила Санса. Арья повернулась и бросила меч в воздух, вложив всю силу в бросок. Синяя сталь мелькнула на солнце, и меч взмыл над водой. А потом, плеснув, исчез в ней. Джоффри застонал… Арья побежала к своей лошади. Нимерия прыгала за ней по пятам.</p><p class="p1">Когда они удалились, Санса бросилась к принцу Джоффри. Глаза его были закрыты от боли, дыхание казалось отрывистым. Санса встала на колени возле него.</p><p class="p1">— Джоффри, — сказала она сквозь рыдания, — что они наделали, только погляди, что они наделали! Мой бедный принц, не бойся, я съезжу в крепость и привезу помощь.</p><p class="p1">Глаза Джоффри открылись и поглядели на нее. В них не было ничего, кроме ненависти, смешанной со злобным пренебрежением.</p><p class="p1">— Тогда ступай! — Он плюнул. — И не прикасайся ко мне!</p></span>
