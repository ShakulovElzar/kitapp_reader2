<span id="id27"><div class="title2">
<p class="p">Джон</p>
</div><p class="p1">Когда новый рекрут вошел во двор для занятий, Джон как раз показывал Дариону боковой удар.</p><p class="p1">— Держи ноги порознь, — учил он, — если не хочешь поскользнуться. Хорошо. А теперь размахнись, как будто нанесешь удар, и вложи весь вес в клинок.</p><p class="p1">Дарион опустил меч и поднял забрало.</p><p class="p1">— Семеро богов, — пробормотал он. — Погляди на это создание, Джон.</p><p class="p1">Сноу повернулся и сквозь прорезь забрала увидел в дверях арсенала самого жирного мальчишку из всех, кого ему когда-либо приходилось встречать. Судя по всему, он должен был весить стоунов двадцать.<a href="ch2.xhtml#id1" class="a">[9]</a> Меховой воротник вышитой куртки прятался под многочисленными подбородками. Бледные глаза нервно шевелились на округлом лице, пухлые потные пальцы мяли бархат дублета.</p><p class="p1">— Мне сказали, что я должен прийти сюда на… занятия, — сказал он, ни к кому в особенности не обращаясь.</p><p class="p1">— Лорденыш, — заметил Пип, повернувшись к Джону. — Южанин, похоже, откуда-то из-под Вышесада.</p><p class="p1">Пип объездил Семь Королевств с труппой марионеток и хвастал, что может по говору определить, откуда кто родом. На груди отороченного мехом кафтана мальчика алой ниткой был вышит шагающий охотник. Джон не знал такого герба. Сир Аллисер Торне посмотрел на новичка и сказал:</p><p class="p1">— Похоже, на юге кончились и браконьеры, и воры и на Стену теперь посылают даже свиней. Неужели эти меха и бархат соответствуют вашему представлению о панцире, милорд Ветчинский?</p><p class="p1">Оказалось, что новый рекрут привез с собой собственную броню, простроченный дублет, вареную кожу, панцирь, кольчугу и шлем, даже огромный щит из кожи и дерева, украшенный тем же самым шагающим охотником, который был на его кафтане. Черного на нем ничего не было, и сир Аллисер настоял, чтобы новичок переоделся. На это ушло почти все утро. Объем новоприбывшего заставил Донала Нойе разобрать кольчугу и наставить на боках кожаные пластины. Чтобы нахлобучить шлем на голову парня, оружейнику пришлось снять забрало. Кожа настолько туго обтянула его ноги и руки, что он едва мог шевельнуться. В боевом наряде новичок казался готовой лопнуть переваренной сарделькой.</p><p class="p1">— Остается надеяться, что ты окажешься не настолько безнадежным, как это представляется, — сказал сир Аллисер. — Халдер, проверь, что умеет сир Поросенок.</p><p class="p1">Джон Сноу вздрогнул. Халдер и рожден был в каменоломне, и учился на мастера каменных дел. Ему было шестнадцать; высокий и мускулистый, он умел наносить самые жестокие удары. Джон знал это по себе.</p><p class="p1">— Зрелище будет отвратительнее, чем задница шлюхи, — пробормотал Пип и оказался прав.</p><p class="p1">Схватка продолжалась не более минуты. Толстяк скоро оказался на снегу; он сотрясался всем телом, из-под разбитого шлема и между пухлыми пальцами текла кровь.</p><p class="p1">— Сдаюсь! — завопил он. — Не надо, сдаюсь, не бей меня! — Раст и кое-кто из мальчишек уже смеялись, но сир Аллисер и не думал заканчивать поединок.</p><p class="p1">— На ноги, сир Поросенок, — приказал он. — Берите ваш меч. — Мальчишка жался к земле, и Торне махнул Халдеру. — Бей его плоской стороной клинка, пока он не найдет свои ноги.</p><p class="p1">Халдер смачно шлепнул по щеке своего противника.</p><p class="p1">— Можешь ударить покрепче, — поддразнил Торне.</p><p class="p1">Халдер взялся за длинный меч обеими руками и отвесил новый удар, раскроивший кожу даже плоской стороной. Новичок взвыл от боли.</p><p class="p1">Джон Сноу шагнул вперед. Пип положил руку в кольчужной рукавице ему на плечо.</p><p class="p1">— Не надо, Джон, — проговорил он, тревожно глянув на сира Аллисера Торне.</p><p class="p1">— На ноги, — повторил Торне. Жирный парень попытался подняться, поскользнулся и вновь упал. — Сир Поросенок начинает понимать идею, — отметил сир Аллисер. — Еще раз.</p><p class="p1">Халдер занес меч для другого удара.</p><p class="p1">— Нарежь нам ветчинки! — со смехом попросил Раст.</p><p class="p1">Джон стряхнул с плеча руку Пипа.</p><p class="p1">— Халдер, довольно.</p><p class="p1">Халдер поглядел на сира Аллисера.</p><p class="p1">— Бастард говорит, а крестьяне трепещут, — сказал оружейных дел мастер резким холодным голосом. — Напоминаю вам, лорд Сноу, что здесь распоряжаюсь я.</p><p class="p1">— Погляди на него, Халдер, — сказал Джон, стараясь не замечать Торне. — Нет чести в побоях, наносимых лежащему врагу; к тому же он сдался. — Сноу нагнулся над толстяком.</p><p class="p1">Халдер опустил меч и подтвердил:</p><p class="p1">— Он сдался.</p><p class="p1">Ониксовые глаза сира Аллисера были обращены к Джону Сноу.</p><p class="p1">— Наш бастард, похоже, влюбился, — сказал он, увидев, что Джон помогает жирному мальчишке подняться на ноги. — Покажите-ка мне вашу сталь, лорд Сноу.</p><p class="p1">Джон извлек свой длинный меч. Он осмеливался искушать сира Аллисера только до известного предела и сейчас уже опасался, что перешел его.</p><p class="p1">Торне улыбнулся.</p><p class="p1">— Бастард решил защитить свою возлюбленную! Что ж! Это будет для него хорошим упражнением. Крыса, Прыщ, помогите нашему Камнеголовому. — Раст и Албетт подошли к Халдеру. — Вас троих достаточно, чтобы наша хрюшка завизжала. Надо только пройти мимо бастарда.</p><p class="p1">— Держись позади меня, — сказал Джон толстяку. Сир Аллисер изредка выставлял против него двух противников, но трех еще никогда. Джон знал, что сегодня уснет в синяках, с порезами, и приготовился к натиску.</p><p class="p1">Внезапно Пип оказался возле него.</p><p class="p1">— Трое на двое, так будет интереснее! — весело сказал невысокий парень, опуская забрало и обнажая меч. Прежде чем Джон успел возразить, Гренн шагнул вперед и стал третьим.</p><p class="p1">Двор охватила смертельная тишина. Джон ощущал на себе взгляд сира Аллисера.</p><p class="p1">— Чего ты ждешь? — спросил он у Раста обманчиво мягким голосом.</p><p class="p1">Первым шевельнулся Джон. Халдер едва успел вовремя вытащить меч.</p><p class="p1">Джон погнал его назад, атакуя каждым ударом, заставляя старшего юношу отступать. Знай своего врага, учил его сир Родрик; и Джон знал Халдера: жесткого, сильного, но нетерпеливого, не умеющего обороняться. Ошеломи его, и он откроется, это столь же неотвратимо, как заход солнца.</p><p class="p1">Во дворе раздался звон стали, в битву вступили остальные. Джон отбил нацеленный в голову жестокий удар, столкновение мечей еще отдавалось в руке. Он ударил Халдера сбоку по ребрам и был награжден глухим болезненным бормотанием. Контрудар пришелся Джону в плечо. Кольчуга хрустнула, и в шее вспыхнула боль, но на мгновение Халдер утратил равновесие, и Джон подсек его ногу; тот шумно упал, разразившись ругательствами.</p><p class="p1">Гренн отбивался, стоя на месте, как учил его Джон, он отпускал Албетту больше, чем тот рассчитывал получить, но Пипу приходилось тяжело. Раст был на два года старше его и тяжелее фунтов на сорок. Шагнув из-за спины Пипа, Джон ударил по шлему насильника, как в колокол. Раст пошатнулся, и Пип скользнул под его защиту, сбил с ног и приставил клинок к горлу. Джон шагнул вперед. Оказавшись перед двумя мечами, Албетт отступил.</p><p class="p1">— Сдаюсь! — закричал он.</p><p class="p1">Сир Аллисер Торне с презрением наблюдал за схваткой.</p><p class="p1">— Сегодня этот марионеточный фарс чересчур затянулся, — проворчал он и направился прочь. Занятие было закончено.</p><p class="p1">Дарион помог Халдеру встать. Сын каменщика сорвал шлем и бросил его через двор.</p><p class="p1">— А мне на мгновение уже показалось, что я наконец достал тебя, Сноу.</p><p class="p1">— Одно мгновение и мне так казалось, — отвечал Джон. Плечо его пульсировало под броней и кожей от боли. Опустив меч в ножны, Джон попытался снять шлем, но едва он поднял руку, боль заставила его скрипнуть зубами.</p><p class="p1">— Позволь мне, — сказал чей-то голос. Толстые пальцы отвязали шлем от воротника и заботливо сняли его. — Он ранил тебя?</p><p class="p1">— Мне не впервой получать синяки. — Тронув плечо, Джон дернулся. Двор вокруг них опустел. Он заметил, что кровь пропитала волосы жирного мальчика под его шлемом, расколотым Халдером.</p><p class="p1">— Мое имя Сэмвел Тарли, я с Рогова… — Он смолк и облизнул губы. — То есть был с Рогова Холма, пока не приехал сюда. Я решил уйти в черные. Мой отец — лорд Рендилл, знаменосец Тиреллов из Хайгардена. Я был его наследником, только… — Голос его умолк.</p><p class="p1">— А я Джон Сноу, бастард Неда Старка из Винтерфелла.</p><p class="p1">Сэмвел Тарли кивнул.</p><p class="p1">— Я… если хочешь, можешь звать меня Сэмом. Моя мать звала меня так.</p><p class="p1">— А ты можешь звать его лордом Сноу, — произнес подошедший к ним Пип. — Тебе незачем знать, как мать звала его.</p><p class="p1">— Эти двое — Гренн и Пипар, — сказал Джон.</p><p class="p1">— Гренн — это уродливый, — сказал Пип.</p><p class="p1">Тот нахмурился.</p><p class="p1">— Твоя рожа уродливее моей! У меня хотя бы уши не как у летучей мыши…</p><p class="p1">— Благодарю вас всех, — серьезным голосом сказал Сэм.</p><p class="p1">— Почему ты не встал и не бился? — спросил Гренн.</p><p class="p1">— Я хотел, но… просто не мог… Я не хотел, чтобы он бил меня. — Сэм поглядел на землю. — Я… боюсь, что я трус. Мой лорд-отец всегда говорил так.</p><p class="p1">Гренна словно ударило громом. Даже Пипу нечего было сказать на это, а бывший актер находил нужное слово буквально для всего. Какой человек добровольно назовет себя трусом?</p><p class="p1">Сэмвел Тарли, должно быть, прочитал мысли по их лицам, глаза его встретили взгляд Джона и метнулись испуганными зверьками.</p><p class="p1">— Простите… я… — сказал он. — Простите, я не хотел… быть таким. — И тяжелым шагом направился к оружейной.</p><p class="p1">Джон окликнул его.</p><p class="p1">— Тебя ранили, — сказал он. — Завтра будет лучше.</p><p class="p1">Сэм печально оглянулся.</p><p class="p1">— Нет, лучше не будет, — сказал он, смахнув слезы. — Ничего из меня не получится.</p><p class="p1">Когда он ушел, Гренн нахмурился.</p><p class="p1">— Трусов никто не любит, — сказал он неуверенным голосом. — Жаль, что мы ему помогли. Что, если нас примут за трусов?</p><p class="p1">— Ты слишком глуп, чтобы быть трусом, — сказал ему Пип.</p><p class="p1">— Неправда! — возмутился Гренн.</p><p class="p1">— Да что ты? Если на тебя в лесу навалится медведь, у тебя не хватит ума убежать!</p><p class="p1">— Это я не побегу? — настаивал Гренн. — Да я бегаю быстрее, чем ты. — Он внезапно умолк и нахмурился, заметив ухмылку Пипа, и только тут понял свои слова. Толстая шея его побагровела. Джон предоставил им возможность ссориться, а сам вернулся в арсенал, повесил меч и стащил потрепанную броню.</p><p class="p1">Жизнь в Черном замке следовала определенному распорядку; утро уделялось игре с мячом, дни предназначались для работы. Черные Братья использовали новобранцев на многих делах, чтобы узнать, на что способны новички. Иногда Джон получал возможность вздохнуть свободно, когда их с Призраком посылали на охоту за дичью для стола лорда-командующего, но на каждый день, проведенный в лесу, приходилась дюжина в арсенале, где Джон крутил точило, пока однорукий кузнец затачивал топоры, затупившиеся после употребления, или качал мехи, пока Нойе ковал новый меч. Иногда он бегал с вестями, стоял на карауле, чистил конюшни, оперял стрелы, помогал мейстеру Эйемону ухаживать за птицами или Боуэну Маршу разбираться в счетах и бухгалтерских книгах.</p><p class="p1">В тот день командир стражи отправил его к подъемной клети с четырьмя бочонками битого камня. Приходилось разбрасывать гравий по ледяным тропам наверху Стены. Работа одинокая и скучная, даже если тебе сопутствует Призрак, но Джон обнаружил, что ему это безразлично. В ясный день с вершины Стены можно было увидеть полмира, а воздух всегда казался холодным и колким. Там он мог думать, и неожиданно для себя Джон обнаружил, что думает о Сэмвеле Тарли и — как ни странно — о Тирионе Ланнистере. Интересно, как обошелся бы Тирион с толстяком? Люди в основном склонны отрицать жестокую правду, они не хотят обращаться к ней лицом, говорил ему карлик ухмыляясь. Мир полон трусов, которые хотели бы выглядеть героями. Довольно странная разновидность отваги — признаваться в своей трусости, как это сделал Сэмвел Тарли.</p><p class="p1">Ушибленное плечо мешало делать работу. Джон закончил посыпать дорожки, когда уже завечерело. Он остался наверху, чтобы посмотреть, как солнце, садясь, окрашивает кровью западный небосклон. Наконец, когда сумерки уже сгустились на севере, Джон закатил пустые бочонки в клетку и махнул рукой, чтобы люди у ворота помогли ему спуститься вниз.</p><p class="p1">Когда они с Призраком появились в общем зале, вечерняя трапеза была уже почти закончена. Возле огня несколько черных братьев играли в кости за подогретым вином. Его друзья сидели на ближайшей к задней стене скамье и смеялись. История, которую рассказывал Пип, была в самом разгаре. Мальчишка-кукольник был прирожденным лжецом и умел говорить на сотню различных голосов: он не рассказывал свои истории, а переживал их; изображая всех героев, он был то королем, то становился свинопасом. Изображая девицу из пивной или принцессу, он говорил писклявым фальцетом, который повергал всех в безудержный смех, доводивший до слез и полного расслабления; евнухи в его исполнении всегда довольно явно напоминали сира Аллисера… Джон получал такое же удовольствие от россказней Пипа, как и все остальные… но все же в тот вечер он отвернулся от них и направился к концу стола, где сидел Сэмвел Тарли, стараясь держаться подальше от всех остальных.</p><p class="p1">Толстяк как раз доедал кусок пирога со свининой, которым сегодня ужинали все, когда Джон примостился напротив. Завидев Призрака, Сэм еще шире раскрыл глаза.</p><p class="p1">— Неужели это волк?</p><p class="p1">— Лютоволк, — ответил Джон. — Его зовут Призрак. Лютоволк начертан на гербе моего отца.</p><p class="p1">— А у нас шагающий охотник, — отвечал Сэмвел Тарли.</p><p class="p1">— Ты любишь охоту?</p><p class="p1">Толстяк пожал плечами.</p><p class="p1">— Ненавижу. — Казалось, что он вот-вот разрыдается.</p><p class="p1">— Ну, что еще произошло? — спросил его Джон. — Неужели ты всегда так испуган?</p><p class="p1">Сэмвел поглядел на остатки пирога на своей тарелке и тряхнул головой, боясь даже заговорить. Взрыв хохота наполнил зал — Пип запищал тоненьким голосом. Джон встал.</p><p class="p1">— Выйдем наружу.</p><p class="p1">Жирное лицо с подозрением уставилось на него.</p><p class="p1">— Зачем? Что мы будем там делать?</p><p class="p1">— Поговорим, — отвечал Джон. — Ты видел Стену?</p><p class="p1">— Я толстый, но не слепой, — отвечал Сэмвел Тарли. — Конечно, я видел ее, все семь сотен футов.</p><p class="p1">Но тем не менее он встал, накинул на плечи подбитый мехом кафтан и следом за Джоном вышел из общего зала — с опаской, словно бы ожидал столкнуться с какой-то жестокой шуткой. Призрак топал возле них.</p><p class="p1">— Никогда не думал, что все будет так, — говорил Сэм на ходу. Слова парком вились в холодном воздухе. Толстяк сопел и пыхтел, пытаясь держаться вровень с Джоном. — Вокруг руины… и этот…</p><p class="p1">— Холод? — На замок опускался мороз, и Джон слышал, как негромко хрустят посеревшие травы под его сапогами.</p><p class="p1">Сэм кивнул.</p><p class="p1">— Ненавижу холод, — сказал он. — Прошлой ночью я проснулся во тьме, очаг погас, и я был уверен, что к утру замерзну до смерти.</p><p class="p1">— Должно быть, там, откуда ты явился, много теплее.</p><p class="p1">— Впервые в жизни я увидел снег в этом месяце. Мы ехали через поля и курганы: я и люди, которых мой отец послал на север проводить меня, — и вдруг эта белая пыль посыпалась сверху, как тихий дождь. Вначале мне показалось, что это красиво, такие пушинки плывут по небу… Но снег шел и шел, и наконец я промерз до костей. Бороды моих людей покрылись снежной коркой, на плечах выросли целые сугробы, но снег все шел. Я боялся, что он никогда не кончится.</p><p class="p1">Джон улыбнулся.</p><p class="p1">Стена поднималась над ними, поблескивая в свете почти полной луны. В небе горели ясные звезды.</p><p class="p1">— И они собираются послать меня туда? — спросил Сэм. Тут он увидел огромную деревянную лестницу, и лицо его скривилось, как от кислого молока. — Я умру, если мне придется проделать этот путь.</p><p class="p1">— Там есть ворот, — сказал Джон. — Тебя могут поднять в клети.</p><p class="p1">Сэм Тарли хмыкнул носом.</p><p class="p1">— Я не люблю высоты.</p><p class="p1">Это было уж слишком. Джон нахмурился, не веря себе.</p><p class="p1">— Неужели ты боишься всего на свете? — спросил он. — Не понимаю. Если ты действительно такой трус, что тебе делать здесь? Зачем тебе вступать в Ночной Дозор?</p><p class="p1">Сэм Тарли поглядел на него, и круглое лицо его побледнело. Он опустился на покрытую снегом землю и зарыдал, сотрясаясь всем телом. Джону снова оставалось только стоять и ждать. Подобно снегопаду над курганами, слезы не хотели прекращаться.</p><p class="p1">Что нужно было делать, понял Призрак; безмолвный как тень, белый лютоволк подошел к мальчику и принялся слизывать теплые слезы с лица Сэмвела Тарли. Мальчишка вскрикнул, вздрогнул… и буквально за одно сердцебиение его рыдания превратились в смех.</p><p class="p1">Джон тоже расхохотался. А потом они сидели на мерзлой земле, укрывшись плащами; Призрак сидел между ними, а Джон рассказывал, как они с Роббом нашли щенков. Все это казалось происшедшим тысячу лет назад. Давно ему не случалось вспоминать о Винтерфелле.</p><p class="p1">— Иногда он мне снится, — признался Джон. — Я прохожу по длинным и пустым залам. Голос мой отдается вокруг, но никто не отвечает мне, и я иду все быстрее — открываю двери и выкрикиваю имена. Я не знаю даже, кого ищу. Чаще всего отца, но иногда Робба, или младшую сестру Арью, или своего дядю.</p><p class="p1">Воспоминание о Бенджене Старке вдруг опечалило его: дядя все не вернулся. Старый Медведь выслал разведчиков на поиски. Сир Джареми Риккер увел два отряда, а Куорен Полурукий вышел навстречу из Сумеречной башни, но они ничего не нашли, если не считать меток на деревьях, которыми дядя обычно помечал путь. На каменистых высотах северо-запада метки внезапно пропали, а с ними и следы Бена Старка.</p><p class="p1">— А ты кого-нибудь находишь в замке в этом своем сне? — спросил Сэм.</p><p class="p1">Джон покачал головой:</p><p class="p1">— Никого. Замок пуст. — Он никому не рассказывал об этом сне и не понимал, зачем теперь говорит о нем Сэму, но почему-то откровенность казалась уместной. — Даже вороны оставили свои гнезда, а в башне полно костей. Это всегда пугает меня. Тогда я бегу, распахиваю двери настежь, через три ступеньки взлетаю на башню, кричу, ищу хоть кого-нибудь, а потом оказываюсь перед дверью в крипту. Внутри темно, я вижу лишь спускающиеся вниз ступеньки. Иногда я знаю, что мне надо спуститься туда, но я не хочу этого делать. Я боюсь того, что может ожидать меня. Там, внизу, лежат старые Короли Зимы, они сидят на своих тронах, у ног их застыли каменные волки, а на коленях лежат железные мечи. Но не их я боюсь, я кричу им, что я не Старк и это не мое место, но ничего не помогает. Мне надо идти, и я спускаюсь, держась рукой за стену, и нет факела, чтобы осветить мне путь. Становится все темнее и темнее, наконец я начинаю кричать… — Он умолк и нахмурился в смущении. — И вот тут я всегда пробуждаюсь в холодном поту. Ты ведь знаешь, какой холод в этой темной келье! Призрак прыгает ко мне на постель, утешая теплом своего тела. И я вновь засыпаю, уткнувшись лицом в косматую шкуру лютоволка… А тебе снится Рогов Холм? — спросил Джон после недолгого молчания.</p><p class="p1">— Нет. — Губы Сэма сжались и напряглись. — Я ненавидел замок. — Он почесал за ухом и задумался.</p><p class="p1">Сэмвел Тарли заговорил не скоро. Джон Сноу внимательно слушал его и узнал, как случилось, что мальчик этот, признавшийся в собственной трусости, оказался на Стене.</p><p class="p1">Тарли принадлежали к древнему и честному роду знаменосцев Мейса Тирелла, лорда Вышесада, Хранителя Юга. Тарли Сэмвел, старший сын лорда Рендилла, был рожден наследником этих земель, сильной крепости и знаменитого двуручного великого меча, Губителя сердец, выкованного из валирийской стали и передававшегося от отца к сыну почти пять сотен лет.</p><p class="p1">Вся гордость, которую ощутил лорд-отец при рождении Сэмвела, улетучилась, когда оказалось, что мальчик растет неловким и тихим, полным. Сэм любил слушать музыку и сочинять песни, любил носить мягкий бархат, играть в кухне замка возле поваров, вдыхая аромат лимонного пирога или черничного торта. Он отдавал свое сердце книгам, котятам и даже танцам — при всей своей неловкости. Но от вида крови Сэма мутило, он плакал даже над убитым цыпленком. Дюжина оружейных дел мастеров посетила Рогов Холм и оставила его после безуспешных попыток превратить Сэмвела в рыцаря, каким хотел видеть его отец. Мальчишку ругали, шлепали, били, морили голодом. Один из учителей, чтобы укрепить в Сэме боевой дух, заставлял его спать в кольчуге. Другой одел его в платье матери и в таком виде провел через двор замка, чтобы позором направить к доблести. Но Сэм только толстел и становился еще более запуганным. Наконец разочарование лорда Рендилла обратилось в гнев и презрение.</p><p class="p1">— Однажды, — признался Сэм голосом, стихшим до шепота, — в замок пришли двое колдунов из Кварта, белокожие и синегубые. Они убили зубра и заставили меня выкупаться в горячей крови, но и после этого я не стал отважным, как они обещали. Мне стало дурно, а потом меня вырвало. Отец приказал их выгнать.</p><p class="p1">Наконец после трех дочерей леди Тарли родила своему лорду-мужу второго сына. Начиная с этого дня лорд Рендилл просто забыл про старшего сына, уделяя все свое внимание младшему, грубому и неприхотливому, больше отвечающему его нраву. Тут Сэмвел получил несколько лет сладкой жизни, которые он посвятил музыке и книгам.</p><p class="p1">И вот настал день его пятнадцатых именин. Проснувшись, Сэм обнаружил, что лошадь его оседлана. Трое латников отца отвезли его в лес возле Рогова Холма к месту, где отец свежевал оленя.</p><p class="p1">— Теперь ты почти взрослый человек и мой наследник, — сказал лорд Рендилл Тарли своему старшему сыну, пластая тушу длинным ножом. — Ты не предоставил мне повода отказаться от тебя, но я не позволю тебе унаследовать землю и титул, которые должны отойти к Дикону. Губитель сердец должен принадлежать человеку достаточно сильному, чтобы поднять его, а ты недостоин даже прикоснуться к рукояти этого меча. Поэтому я решил, что сегодня ты объявишь о своем желании облачиться в черную одежду. Ты откажешься от всего в пользу своего брата и отправишься на север прежде, чем завечереет.</p><p class="p1">Если ты не сделаешь этого, утром мы отправимся на охоту, и где-нибудь в этих лесах твоя лошадь споткнется, а ты вылетишь из седла и умрешь… так я скажу твоей матери. У нее женское сердце; в нем хватает доброты и для тебя, я не хочу причинять ей боль. Пожалуйста, не думай, что тебе удастся не покориться мне. Ничто не доставит мне большего удовольствия, чем заколоть такую свинью, каковой ты являешься. — Руки отца уже обагрились до локтя, и он отложил нож в сторону. — Итак, выбирай. Ночной Дозор… — Он запустил руку внутрь туши, вырвал сердце и сжал его в кулаке, выдавливая кровь. — Или это…</p><p class="p1">Сэм рассказал свою повесть спокойным и мертвым голосом, словно бы все это случилось не с ним, а с кем-то другим. Странно, отметил Джон, он даже ни разу не пустил слезу. Потом, когда Сэм договорил, они сидели рядом и какое-то время слушали ветер. И не было другого звука во всем мире.</p><p class="p1">Наконец Джон рассудил:</p><p class="p1">— Надо возвратиться в общий зал.</p><p class="p1">— Зачем? — спросил Сэм.</p><p class="p1">Джон пожал плечами:</p><p class="p1">— Там сейчас разливают горячий сидр или вино с пряностями, если ты предпочитаешь его. Иногда вечерами Дарион поет нам, если у него есть настроение. Раньше он был певцом… ну, не совсем, конечно, учеником певца.</p><p class="p1">— А как он попал сюда? — спросил Сэм.</p><p class="p1">— Лорд Рован из Золотой Рощи обнаружил его в постели собственной дочери. Девушка была на два года старше, и Дарион клянется, что она сама открыла ему окно, но перед отцом она назвала его поступок насилием… Так он и попал сюда. Когда мейстер Эйемон услышал его пение, он сказал, что голос Дариона напоминает ему гром, облитый медом, — улыбнулся Джон. — Жаба иногда тоже поет, если кваканье можно назвать таким словом. Застольным песням мейстер Эйемон научился в винном погребке своего отца. Пип утверждает, что голос его можно уподобить моче, пролитой на говенную кучу. — Они вместе захохотали.</p><p class="p1">— Мне бы хотелось услышать их обоих, — признался Сэм. — Но они выгоняют меня… — Сэм смутился. — Утром он вновь потребует, чтобы я сражался, так ведь?</p><p class="p1">— Так, — вынужден был ответить Джон.</p><p class="p1">Сэм неловко поднялся на ноги.</p><p class="p1">— Лучше попытаюсь уснуть. — Он сгорбился и направился в спальню.</p><p class="p1">Когда Джон возвратился в обществе одного только Призрака, все собрались в общей комнате.</p><p class="p1">— Где ты был? — спросил Пип.</p><p class="p1">— Я говорил с Сэмом, — ответил он.</p><p class="p1">— Вот уж истинно трус, — проговорил Гренн. — Когда он брал свой пирог, на скамье были места, но он побоялся даже сесть с нами.</p><p class="p1">— Лорд Беконский считает себя слишком важным и с такими, как мы, не знается, — предположил Джерен.</p><p class="p1">— Я видел, как он ест свиной пирог, — проговорил, блаженствуя, Жаба. — Как вы думаете, не из своего ли братца? — И он захрюкал.</p><p class="p1">— Прекрати! — отрезал Джон.</p><p class="p1">Все умолкли, поразившись его внезапной ярости.</p><p class="p1">— Послушайте, — произнес Джон в тишине и рассказал им о своем плане. Пип поддержал его, как и рассчитывал Джон. Потом заговорил Халдер, и слова его оказались приятной неожиданностью. Гренн сперва заторопился, встревожился, но Джон знал, чем тронуть его. По одному сдавались и все остальные. Одних Джон переубедил, других улестил, третьих устыдил, пригрозил тем, кому необходимо. Наконец все согласились… все, кроме Раста.</p><p class="p1">— Вы, девки, можете поступать как угодно, — заявил Раст. — Но если Торне выставит меня против леди Хрюшки, я намереваюсь отрезать себе добрый кусок свининки. — Он расхохотался прямо в лицо Джону и оставил их.</p><p class="p1">Несколько часов спустя, когда замок уснул, трое из них нанесли визит в его келью. Гренн держал руки, Пип сидел на ногах, и Джон услышал прерывистое дыхание Раста, когда Призрак вскочил ему на грудь. Глаза лютоволка светились красными угольками, и зубы его самую чуточку прикоснулись к мягкой коже на шее парня, выпустив только капельку крови.</p><p class="p1">— Помни, что мы знаем, где ты спишь, — негромко сказал Джон.</p><p class="p1">На следующее утро Джон слышал, как Раст уверял Албетта и Жабу в том, что случайно порезался за бритьем.</p><p class="p1">Начиная с этого дня ни Раст, ни другие не причиняли боли Сэмвелу Тарли. Когда сир Аллисер выставлял их против него, парни просто стояли на месте и отбивали неуклюжие удары толстяка. Если оружейных дел мастер требовал активных действий, они, приплясывая, легко ударяли Сэма по панцирю, шлему и ногам. Сир Аллисер ярился и угрожал, называл всех трусами, бабами и еще худшими словами, но Сэм оставался цел. Через несколько вечеров по настоянию Джона он присоединился к общей вечерней трапезе и занял место на скамье возле Халдера. Прошло еще две недели, и он нашел в себе силы включиться в общий разговор, смеялся рожицам Пипа и поддразнивал Гренна.</p><p class="p1">Жирный, неловкий и запуганный, Сэмвел Тарли не был дураком. Однажды вечером он зашел к Джону в его келью.</p><p class="p1">— Я не знаю, почему ты это сделал, — сказал Сэм, — но я понимаю, что это сделал ты… — Он застенчиво отвернулся. — У меня никогда еще не было друга.</p><p class="p1">— Мы не друзья, — улыбнулся Джон, опуская ладонь на широкое плечо Сэма. — Мы братья!</p><p class="p1">Так и есть на самом деле, подумал он, когда Сэм отправился к себе. Робб, Бран и Рикон были сыновьями его отца, он по-прежнему любил их, но все же Джон знал, что никогда не был одним из них. Об этом позаботилась Кейтилин Старк. Серые стены Винтерфелла до сих пор тревожили его сны, но Черный замок теперь сделался его жизнью, и братьями его стали Сэм, и Гренн, и Халдер, и Пип, и все остальные отверженные, облачившиеся в черные одежды Ночного Дозора.</p><p class="p1">— Дядя мой сказал правильно, — шепнул он Призраку. Удастся ли только ему еще раз повстречать Бенджена Старка и рассказать дяде о его правоте?</p></span>
