<span id="id49"><div class="title2">
<p class="p">Джон</p>
</div><p class="p1">Джон завтракал яблочным пирогом и кровяной сосиской, когда Сэмвел Тарли плюхнулся возле него на скамью.</p><p class="p1">— Меня вызвали в септу, — проговорил Сэм взволнованным шепотом. — Меня снимают с обучения. Я стану братом вместе со всеми вами. Можешь ли ты в это поверить?</p><p class="p1">— Неужели?</p><p class="p1">— В самом деле. Я буду помогать мейстеру Эйемону в библиотеке и с птицами. Ему нужен человек, умеющий писать и читать.</p><p class="p1">— Ты превосходно справишься с этим делом, — улыбнулся Джон.</p><p class="p1">Сэм тревожно огляделся вокруг.</p><p class="p1">— Не пора ли идти? Я не хочу опоздать, а то вдруг передумают… — Он чуть ли не подпрыгивал, когда они пересекали заросший травой двор. День выдался теплый и солнечный. Ручейки воды стекали вниз по стене, лед сверкал и искрился.</p><p class="p1">Внутри септы огромный кристалл ловил утренний свет, струившийся в обращенное на юг окно, и радугой разливал его над алтарем. Заметив Сэма, Пип невольно открыл рот, и Жаба ткнул Гренна в ребра, но никто не посмел сказать даже слова. Септон Селладар, размахивая кадильницей, наполнял воздух благоуханием, напоминавшим Джону о крошечной септе леди Старк в Винтерфелле. На этот раз септон, похоже, был трезв.</p><p class="p1">Вместе вошли высшие офицеры: мейстер Эйемон, опирающийся на Клидаса, сир Аллисер, мрачно блеснувший холодным взором, лорд-командующий Мормонт во всем великолепии черного шерстяного дублета с посеребренными застежками из медвежьих когтей. За ними следовали старшины трех орденов: краснолицый Боуэн Марш, лорд-стюард, первый строитель Отелл Ярвик и сир Джареми Риккер, командовавший разведчиками в отсутствие Бенджена Старка.</p><p class="p1">Мормонт стал перед алтарем, радуга сверкала над его широким лысым лбом.</p><p class="p1">— Вы пришли к нам, не зная закона, — начал он. — Браконьерами, насильниками, должниками, убийцами и ворами. Вы пришли к нам детьми. Каждый из вас пришел к нам в одиночестве и цепях, не имея ни друга, ни чести. Вы пришли к нам бедными и богатыми. Некоторые из вас носят гордые имена, у других имена бастардов или нет имени вообще. Теперь это безразлично. Все ушло в прошлое. Здесь, на Стене, мы одна семья.</p><p class="p1">Вечером, когда солнце опустится и мы обратимся лицом к собирающейся ночи, вы примете свой обет. И тогда навсегда станете братьями, присягнувшими на верность Ночному Дозору. Преступления ваши будут смыты, долги прощены. Поэтому вы должны отречься от прежних привязанностей, забыть про былую вражду, прошлые обиды и симпатии. И все для вас начинается заново.</p><p class="p1">Ночной Дозор живет ради своей страны… не ради короля, не ради лорда, не ради чести своего дома, не ради золота, не ради славы, не ради женской любви. Он служит всей земле и людям ее. Дозорный не берет жены и не родит сыновей. Наша жена — долг, наша любовница — честь, а вы — единственные сыновья, которые будут у нас.</p><p class="p1">Вы заучили слова обета. Подумайте же прежде, чем произнести их. Потому что тот, кто принял черное, не может снять его. Наказание за дезертирство — смерть. — Старый Медведь помедлил мгновение и добавил: — Есть ли среди вас такие, которые хотят оставить наше общество? Если так, уходите немедленно, и никто не подумает о вас худо.</p><p class="p1">Никто не шевельнулся.</p><p class="p1">— Отлично! — проговорил Мормонт. — Вы можете принять ваши обеты вечером, перед септом Селладаром и главой вашего ордена. Есть ли среди вас поклонники старых богов?</p><p class="p1">Джон встал:</p><p class="p1">— Я, милорд.</p><p class="p1">— Я рассчитываю, что ты принесешь свой обет перед сердце-деревом, как сделал твой дядя.</p><p class="p1">— Да, милорд, — ответил Джон. Боги септы не имели к нему отношения. Кровь Первых Людей текла в жилах Старков.</p><p class="p1">Он услыхал позади себя шепот Гренна:</p><p class="p1">— Но здесь же нет богорощи, или не так? Я никогда не видел ее…</p><p class="p1">— Ты не заметишь даже стада зубров, пока их копыта не втопчут тебя в снег, — шепнул Пип.</p><p class="p1">— Да ну, что ты, — возразил Гренн. — Зубров-то я бы увидел издалека.</p><p class="p1">Мормонт сам рассеял сомнения Гренна:</p><p class="p1">— Черный замок не нуждается в богороще. За Стеной стоит Зачарованный лес, как стоял он в Рассветные Века, задолго до того, как андалы принесли Семерых из-за Узкого моря. Ты найдешь рощу чардрев в половине лиги от этого места, а в ней, быть может, и своих богов.</p><p class="p1">— Милорд. — Голос заставил Джона с удивлением оглянуться. Сэмвел Тарли поднялся на ноги. Толстяк вытирал свои потные ладони о тунику. — А можно… можно я тоже пойду? Чтобы произнести свои слова перед этим сердце-деревом.</p><p class="p1">— Разве дом Тарли хранит верность старым богам? — спросил Мормонт.</p><p class="p1">— Нет, милорд, — ответил Сэм тонким взволнованным голосом. Старшие офицеры пугали его — Джон знал об этом, — и Старый Медведь больше всех. — Я получил имя в совете Семерых в септе на Роговом Холме, как и мой отец, и как его отец, и как все Тарли за последнюю тысячу лет.</p><p class="p1">— Зачем же тогда ты хочешь отречься от богов своего отца и своего дома? — удивился сир Джареми Риккер.</p><p class="p1">— Теперь мой дом — Ночной Дозор, — сказал Сэм. — Семеро не ответили на мои молитвы. Быть может, это сделают старые боги.</p><p class="p1">— Как хочешь, мальчик, — ответил Мормонт. Сэм опустился на свое место, Джон тоже. — Мы назначили каждого из вас в орден, как того требует наша нужда и как позволяют ваши сила и умение.</p><p class="p1">Боуэн Марш шагнул вперед и вручил ему листок. Лорд-командующий развернул его и начал читать.</p><p class="p1">— Халдер, к строителям, — начал он. Халдер коротко и одобрительно кивнул. — Гренн в разведчики. Албетт к строителям. Пипар в разведчики. — Пип поглядел на Джона и шевельнул ухом. — Сэмвел в стюарды. — Сэм вздохнул с облегчением и промокнул лоб шелковым платком. — Маттхар, в разведчики. Дарион, в стюарды. Тоддер, в разведчики. Джон в стюарды.</p><p class="p1">— В стюарды? — Мгновение Джон не мог поверить тому, что услышал. Должно быть, Мормонт ошибся. Он уже начал подниматься и приоткрыл свой рот, чтобы сказать, что произошла ошибка… но тут он увидел Аллисера, изучавшего его лицо глазами, блестящими, как два кусочка обсидиана, и все понял.</p><p class="p1">Старый Медведь свернул бумагу.</p><p class="p1">— Главы орденов наставят вас в ваших обязанностях. Да сохранят вас боги, братья. — Лорд-командующий почтил их полупоклоном и откланялся. Сир Аллисер направился к ним с тонкой улыбкой на лице. Джон никогда не видел еще мастера над оружием столь счастливым.</p><p class="p1">— Разведчики, ко мне, — сказал сир Джареми Риккер, когда они ушли. Поглядев на Джона, Пип медленно поднялся. Уши его побагровели. Гренн широко ухмыльнулся, он как будто не понимал, что все сложилось не так. Мэтт и Жаба подошли к нему и последовали за сиром Джареми из септы.</p><p class="p1">— Строители, — объявил Отелл Ярвик, человек с квадратной челюстью. Халдер и Албетт последовали за ним.</p><p class="p1">Джон оглянулся с болезненным недоверием. Слепые глаза мейстера Эйемона были обращены к свету, которого он не мог видеть. Септон поправлял кристаллы на алтаре. Лишь Сэм и Дарион оставались на скамье; толстяк, певец… и он сам.</p><p class="p1">Лорд-стюард Боуэн Марш потер свои пухлые руки.</p><p class="p1">— Сэмвел, ты будешь помогать мейстеру Эйемону с птицами и в библиотеке. Четт отправится на псарню заниматься собаками. Ты займешь его келью, чтобы не разлучаться с мейстером ни ночью, ни днем. Я рассчитываю, что ты как следует позаботишься о нем. Мейстер очень стар и весьма дорог нам.</p><p class="p1">Дарион, мне говорили, что ты много раз пел за столами высоких лордов и ел их мясо и мед. Мы посылаем тебя в Восточный Дозор. Там ты будешь помогать Коттеру Пайку, когда придут купеческие галеи. Дозор явно переплачивает за солонину и соленую рыбу, а качество оливкового масла, которое мы получаем оттуда, сделалось невозможным. Представься Боркасу, когда прибудешь. Он займет тебя между прибытием кораблей.</p><p class="p1">Марш обернулся с улыбкой к Джону:</p><p class="p1">— Лорд-командующий Мормонт потребовал, чтобы ты прислуживал ему лично, Джон. Ты будешь спать в келье под его палатами, в башне лорда-командующего.</p><p class="p1">— И какими же будут мои обязанности? — резко спросил Джон. — Буду ли я прислуживать лорду-командующему за трапезой, помогать ему застегивать одежду, приносить горячую воду для ванны?</p><p class="p1">— Безусловно. — Марш нахмурился, услышав тон Джона. — И ты будешь бегать с его приказами, поддерживать огонь в его палатах, ежедневно менять простыни и одеяла и делать все нужное, что потребует от тебя лорд-командующий.</p><p class="p1">— Вы принимаете меня за слугу?</p><p class="p1">— Нет, — возразил мейстер Эйемон, с помощью Клидаса поднявшийся на ноги за его спиной. — Мы принимаем тебя за Ночного Дозорного, но, быть может, ошибаемся в этом.</p><p class="p1">Джон сделал все возможное, чтобы сдержаться. Неужели он будет сбивать масло и чинить дублеты весь остаток своих дней, подобно какой-то служанке?</p><p class="p1">— Можно выйти? — спросил он напряженным голосом.</p><p class="p1">— Как угодно, — отвечал Боуэн Марш.</p><p class="p1">Дарион и Сэм вышли вместе с ним. Молча они спустились во двор. Снаружи Джон посмотрел на блестевшую Стену, на тающий лед, сползающий по ее поверхности сотнями тонких пальцев, и его разобрала такая ярость, что он готов был разнести эту Стену в одно мгновение и с нею весь мир.</p><p class="p1">— Джон, — проговорил взволнованный Сэмвел Тарли. — Погоди. Разве ты не понял их замысел?</p><p class="p1">Джон обернулся к нему в ярости:</p><p class="p1">— Я вижу в этом руку проклятого сира Аллисера. Вот что! Он решил опозорить меня и добился этого!</p><p class="p1">Дарион поглядел на него:</p><p class="p1">— Исполнять обязанности стюарда подобает лишь таким, как мы с тобой, Сэм, но только не лорду Сноу!</p><p class="p1">— Я же лучший фехтовальщик и наездник, — вспыхнул Джон. — Это несправедливо!</p><p class="p1">— Справедливо? — фыркнул Дарион. — Моя девица дожидалась меня голой, как мать родила. Она сама втянула меня в окно, и ты говоришь мне — несправедливо! — Он отправился прочь.</p><p class="p1">— В должности стюарда нет позора, — проговорил Сэм.</p><p class="p1">— И ты думаешь, что я хочу провести весь остаток моей жизни, стирая белье старика?</p><p class="p1">— Этот старик — лорд-командующий Ночного Дозора, — напомнил ему Сэм. — И ты будешь с ним день и ночь. Да, ты будешь наливать ему вино и приглядывать за тем, чтобы постель его была свежей, но ты будешь читать его грамоты, прислуживать ему на собраниях, помогать в бою. Ты будешь его тенью. И будешь знать все, во всем принимать участие… Лорд-стюард сказал, что Мормонт сам попросил тебя.</p><p class="p1">Когда я был маленьким, отец мой настаивал, чтобы я присутствовал в приемном зале, когда он собирал двор. Когда он уезжал в Вышесад, чтобы преклонить колено перед лордом Тиреллом, то брал меня с собой. А потом начал брать Дикона, а меня оставил. И когда в зале находился Дикон, отца более не волновало, присутствую я или нет. Он хотел, чтобы наследник его был рядом, или ты не понял этого? Чтобы наблюдать, слушать и учиться. Клянусь тебе, лорд Мормонт именно поэтому потребовал тебя, Джон, зачем же еще? Он хочет научить тебя править!</p><p class="p1">Джон недоумевал. Действительно, лорд Эддард часто заставлял Робба присутствовать на его советах в Винтерфелле. Неужели Сэм прав? Даже бастард способен высоко взлететь в Ночном Дозоре. Так все говорили.</p><p class="p1">— Но я никогда не просил этого, — возразил он упрямо.</p><p class="p1">— Мы здесь не для того, чтобы просить, — напомнил ему Сэм.</p><p class="p1">И Джон Сноу устыдился.</p><p class="p1">Трус или нет, но Сэмвел Тарли нашел в себе отвагу принять свою судьбу, как подобает мужчине. На Стене каждый получает то, чего он заслуживает, говорил ему Бенджен Старк, когда Джон в последний раз видел его живым.</p><p class="p1">— Ты еще не разведчик, Джон. Ты пока еще зеленый мальчишка… от которого пахнет летом.</p><p class="p1">Джон слыхал, что бастарды, мол, растут быстрее обычных детей, но на Стене человек или рос, или умирал.</p><p class="p1">Джон глубоко вздохнул:</p><p class="p1">— Ты прав. Я веду себя как мальчишка.</p><p class="p1">— Значит, ты останешься и произнесешь свои слова вместе со мной?</p><p class="p1">— Старые боги будут ожидать нас. — Джон заставил себя улыбнуться.</p><p class="p1">В тот вечер они выехали поздно. В Стене не было ворот как таковых. Не было их и в Черном замке на протяжении трехсот миль от гор и до моря. Дозорные вели своих коней по узкому тоннелю, прорезанному во льду, холодные темные стены смыкались, ход поворачивал и кружил. Три раза путь преграждали железные прутья, им приходилось останавливаться и ждать, пока Боуэн Марш находил нужный ключ и отпирал массивные цепи, скреплявшие их. Ожидая позади лорда-стюарда, Джон ощущал тяжесть, давящую на него. Стоячий воздух здесь был холоднее, чем в могиле. Джон почувствовал странное облегчение, когда они вновь выехали на вечерний свет по северную сторону Стены.</p><p class="p1">Сэм поморгал на солнце и задумчиво огляделся.</p><p class="p1">— А одичалые… они не могут… а они не посмеют приблизиться к Стене? А?</p><p class="p1">— Они никогда не подходили так близко. — Джон сел на коня. Когда Боуэн Марш и разведчики поднялись в седла, Джон вложил в рот два пальца и свистнул. Призрак прыжками вынесся из тоннеля.</p><p class="p1">Дорожный конек лорда-стюарда дернулся и попятился от лютоволка.</p><p class="p1">— Ты хочешь прихватить с собой зверя?</p><p class="p1">— Да, милорд, — коротко ответил Джон. Призрак поднял голову, он словно бы опробовал воздух на вкус. И в мгновение ока пересек широкую просеку и исчез за деревьями.</p><p class="p1">Едва въехав в лес, они оказались совершенно в другом мире. Джон часто охотился с отцом, Джори и братом Роббом и знал Волчий лес вокруг Винтерфелла, как положено знать мужчине. Зачарованный лес был похож на него, но при этом в нем было еще нечто необычное.</p><p class="p1">Быть может, вся разница и заключалась в том, что они были за краем света; этот факт менял все, здесь каждая тень казалась темнее, в каждом звуке слышалось что-то зловещее. Деревья теснились друг к другу, поглощая лучи заходящего солнца. Тонкая корочка льда хрустела под копытами коней, словно ломающиеся кости. Когда ветер зашелестел в листьях, по хребту Джона словно прошелся какой-то холодный палец. Стена осталась позади них, и одни только боги ведали, что лежит впереди.</p><p class="p1">Солнце уже опускалось за деревья, когда они достигли места — небольшой поляны в глубине леса, образованной кружком из девяти чардрев. Джон затаил дыхание. Он заметил, как напрягся Сэм Тарли. Даже в Волчьем лесу нельзя было увидеть рядом больше двух-трех белых деревьев, а о целой роще из девяти никто и не слыхивал. Опавшие кровавые листья покрывали черную гниль. Толстые стволы отливали слоновой костью, с них смотрели на поляну девять ликов. Сок, застывший в глазах, блестел твердым багрянцем рубина. Боуэн Марш велел всем оставить коней за пределами круга.</p><p class="p1">— Здесь священное место, и его нельзя осквернять!</p><p class="p1">Когда они вошли в рощу, Сэмвел Тарли медленно повернулся, оглядев по очереди все лики. Среди них не было и двух одинаковых.</p><p class="p1">— Они следят за нами, — шепнул он. — Это старые боги.</p><p class="p1">— Да. — Джон преклонил колено, и Сэмвел опустился на землю рядом с ним.</p><p class="p1">Они вместе произнесли слова присяги, когда последние лучи света поблекли на западе и серый вечер превратился в черную ночь.</p><p class="p1">— Слушайте мою клятву и будьте свидетелями моего обета, — говорили они, наполняя голосами молчаливую сумеречную рощу. — Ночь собирается, и начинается мой дозор. Он не окончится до самой моей смерти. Я не возьму себе ни жены, ни земель, не буду отцом детям. Я не надену корону и не буду добиваться славы. Я буду жить и умру на своем посту. Я — меч во тьме; я — Дозорный на Стене; я — огонь, который разгоняет холод; я — свет, который приносит рассвет; я — рог, который будит спящих; я — щит, который охраняет царство людей. Я отдаю свою жизнь и честь Ночному Дозору среди этой ночи и всех, которые грядут после нее.</p><p class="p1">Лес молчал.</p><p class="p1">— Вы преклонили колена мальчишками, — торжественно провозгласил Боуэн Марш. — Встаньте же теперь, мужи Ночного Дозора!</p><p class="p1">Джон протянул руку, чтобы помочь Сэму подняться на ноги. Разведчики собрались вокруг, улыбаясь и поздравляя, все, за исключением корявого старого лесовика Дайвина.</p><p class="p1">— Лучше бы нам повернуть назад, милорд, — сказал он Боуэну Маршу. — Наступает тьма, я чувствую в ночи весьма неприятный запах.</p><p class="p1">И вдруг возвратился Призрак, бесшумно скользнув между двумя чардревами. «Белый мех и красные глаза, — с тревогой отметил Джон. — Как деревья».</p><p class="p1">Волк держал в зубах нечто черное.</p><p class="p1">— Что там у него? — спросил Боуэн Марш хмурясь.</p><p class="p1">— Ко мне, Призрак. — Джон пригнулся. — Дай сюда.</p><p class="p1">Лютоволк направился к нему, и Джон услышал, как Сэм Тарли резко вздохнул.</p><p class="p1">— Боги милосердные, — пробормотал Дайвин. — Это рука.</p></span>
