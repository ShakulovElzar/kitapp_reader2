<span id="id51"><div class="title2">
<p class="p">Арья</p>
</div><p class="p1">— Вверх, — выкрикнул Сирио Форель, целя в голову. Палочные мечи стукнули, и Арья отбила удар.</p><p class="p1">— Налево, — закричал он, свистнул его клинок. Ее меч метнулся навстречу. Стук заставил его прищелкнуть зубами.</p><p class="p1">— Вправо, — сказал он. А потом снова — вниз и налево, и снова налево, Сирио быстрее и быстрее продвигался вперед. Арья отступала, отбивая каждый удар.</p><p class="p1">— Выпад, — предупредил Сирио, и когда он шагнул вперед, она отступила в сторону, отвела от себя клинок и рубанула по плечу Фореля. То есть едва не прикоснулась к нему… Едва. Но близко было уже настолько, что Арья ухмыльнулась. Перед ее глазами прыгала влажная от пота прядь. Арья отбросила ее в сторону тыльной стороной ладони.</p><p class="p1">— Налево, — пропел Сирио. — Вниз. — Меч его метался, и в маленьком зале эхо отзывалось «стук, стук, стук». — Влево. Влево. Вверх. Влево. Вправо. Влево. Вниз. Влево!</p><p class="p1">Деревянный клинок кольнул ее прямо в грудь, внезапный удар потряс ее тем более, что явился не с той стороны.</p><p class="p1">— Ох! — воскликнула она. Значит, появится свежий синяк, к тому времени, когда она заснет где-нибудь на корабле. «Синяк — это урок, — сказала себе Арья, — а каждый урок делает нас лучше».</p><p class="p1">Сирио отступил назад.</p><p class="p1">— Ты уже мертва.</p><p class="p1">Арья скорчила рожу.</p><p class="p1">— Ты сплутовал, — сказала она с жаром. — Ты сказал налево, а ударил справа.</p><p class="p1">— Так. Но ты теперь — мертвая девочка.</p><p class="p1">— Но ты же солгал!</p><p class="p1">— Это слова мои лгали. Но глаза и рука кричали тебе правду, а ты не заметила ее.</p><p class="p1">— Нет, — возразила Арья. — Я следила за тобой каждую секунду.</p><p class="p1">— Следить, девочка, это не значит видеть. Водяной плясун видит. Теперь клади меч, настало время слушать.</p><p class="p1">Она последовала за учителем к стене, он опустился на скамейку.</p><p class="p1">— Сирио Форель был первым мечом морского лорда Браавоса. И знаешь ли ты, как это случилось?</p><p class="p1">— Ты был самым сильным фехтовальщиком города?</p><p class="p1">— Именно так, но почему? Ведь другие были сильнее и моложе, но почему же Сирио Форель оказался лучшим? Теперь я скажу тебе. — Он прикоснулся кончиком своего мизинца к глазам. — Я обладаю зрением, истинным зрением, в нем самая суть.</p><p class="p1">Слушай меня, корабли Браавоса плавают повсюду, где дует ветер, к разным землям, удивительным странам, а когда они возвращаются, капитаны доставляют в зверинец морского лорда странных животных. Таких ты никогда не видала; полосатых лошадей, огромных пятнистых зверей с шеями длинными, как ходули, волосатых свиномышей, ростом с корову, жалящих мантикоров, тигров, которые вынашивают своих щенков в сумке, жутких двуногих ящеров с косами вместо когтей. Сирио Форель видел их.</p><p class="p1">В тот день, о котором я говорю, Браавос погиб первым, и морской владыка послал за мной. Многие являлись к нему, и всех он отсылал, но никто не мог понять почему. Когда я явился пред его очи, владыка сидел, а на коленях его лежал жирный желтый кот. Он сказал мне, что один из его капитанов привез ему этого зверя с островов, лежащих у солнечного восхода. «Видел ли ты когда-нибудь подобных ему?» — спросил он.</p><p class="p1">И я ответил: каждую ночь переулки Браавоса кишат тысячами подобных ему. Морской владыка расхохотался, и в тот же день я был назначен первым мечом.</p><p class="p1">Арья скривилась.</p><p class="p1">— Я не поняла.</p><p class="p1">Сирио прищелкнул зубами.</p><p class="p1">— Кошка была обыкновенной и не более того. Остальные же хотели увидеть сказочного зверя, поэтому-то и видели его. Они говорили, какой он крупный. А кот был не больше любого другого, просто разжирел от безделья, потому что морской владыка кормил его с собственного стола. Какие забавные маленькие уши, они говорили, а уши были откушены в драках. К тому же это был явный кот, хотя морской владыка назвал его кошкой. И именно кошку видели все остальные. Ты слушаешь меня?</p><p class="p1">Арья подумала.</p><p class="p1">— А ты увидел, какой он на самом деле!</p><p class="p1">— Именно так. Нужно только открыть глаза. Сердце может солгать, голова одурачит тебя, но глаза видят верно. Гляди своими глазами, слушай своими ушами. Пробуй своим ртом. Нюхай своим носом. Ощущай своей кожей. Потом придут мысли… потом. Только так можно узнать правду.</p><p class="p1">— Именно так, — сказала Арья ухмыляясь.</p><p class="p1">Сирио Форель позволил себе улыбку.</p><p class="p1">— Но я думаю, что, когда мы доберемся в этот ваш Винтерфелл, настанет время вложить Иглу в твою руку.</p><p class="p1">Позади них огромные деревянные двери Малого зала с грохотом распахнулись. Арья крутнулась на месте. Под аркой двери появился рыцарь из Королевской гвардии в компании пяти ланнистерских гвардейцев. Он был в полной броне, но забрало было поднято. Арья помнила эти сонные глаза и ржавые усы по Винтерфеллу, рыцарь этот приехал вместе с королем, звали его сир Меррин Трант. Красные плащи были в кольчугах на вареной коже и в стальных шлемах с львиными гербами.</p><p class="p1">— Арья Старк, — сказал рыцарь, — пойдем с нами, дитя.</p><p class="p1">Арья неуверенно закусила губу.</p><p class="p1">— Чего вы хотите?</p><p class="p1">— Твой отец хочет видеть тебя.</p><p class="p1">Арья шагнула вперед, но Сирио Форель удержал ее за руку.</p><p class="p1">— Хотелось бы знать, почему лорд Эддард послал вместо своих людей Ланнистеров?</p><p class="p1">— Знай свое место, учитель танцев, — сказал сир Меррин. — Не твое дело.</p><p class="p1">— Мой отец не посылал вас, — сказала Арья, хватая свой деревянный меч. Ланнистеры расхохотались.</p><p class="p1">— Положи палку, девочка, — сказал ей сир Меррин. — Я из Белых Мечей, брат Королевской гвардии.</p><p class="p1">— Каким был и Цареубийца, когда убивал старого короля, — сказала Арья. — Я не пойду с вами против желания.</p><p class="p1">У сира Меррина Транта кончилось терпение.</p><p class="p1">— Возьмите ее, — сказал он своим людям, надвигая забрало на шлем.</p><p class="p1">Трое из них шагнули вперед, кольчуги мягко позвякивали на каждом шагу. Арья вдруг испугалась. «Страх режет глубже меча», — сказала она себе, чтоб замедлить биение сердца. Но Сирио Форель шагнул между ними, легонько похлопывая деревянным мечом по сапогу.</p><p class="p1">— Остановитесь. Я вижу людей или псов, способных напасть на ребенка?</p><p class="p1">— С дороги, старик, — проговорил один из красных плащей.</p><p class="p1">Палка Сирио, просвистев, обрушилась на его шлем.</p><p class="p1">— Я — Сирио Форель, и впредь ты будешь разговаривать со мной с большим уважением.</p><p class="p1">— Лысый сукин сын. — Человек извлек свой длинный меч. Палка дернулась с невероятной быстротой. Послышался громкий хруст, и меч звякнул о каменный пол. — Ох, рука! — закричал гвардеец, хватаясь за перебитые пальцы.</p><p class="p1">— Ты слишком быстр для учителя танцев, — сказал сир Меррин.</p><p class="p1">— А ты для рыцаря слишком нетороплив, — отвечал Сирио.</p><p class="p1">— Убейте браавосийца и приведите ко мне девчонку, — приказал рыцарь в броне.</p><p class="p1">Четверо Ланнистеров обнажили мечи. Пятый, с перебитыми пальцами, сплюнув, вытащил кинжал левой рукой.</p><p class="p1">Сирио Форель цокнул зубами, занимая позу водяного плясуна, обратившись лишь одной стороной к врагу.</p><p class="p1">— Арья, детка, — окликнул он, не отрывая глаз от Ланнистеров, — на сегодня с танцами покончено. Тебе лучше идти. Беги к отцу.</p><p class="p1">Арья не хотела оставлять его, но он всегда учил ее выполнять его приказы.</p><p class="p1">— Быстрая, как олень, — прошептала она.</p><p class="p1">— Именно так, — ответил Сирио Форель, пока Ланнистеры окружали его.</p><p class="p1">Арья отступила, крепко сжимая в руках деревянный меч. Глядя на Сирио, она успела понять, что он только играл с нею во время поединков. Красные плащи наступали на него с трех сторон, со сталью в руках. Их руки и грудь прикрывали кольчуги, штаны — стальные пластины, одной только кожей были защищены лишь ноги. Все они были без перчаток, в шлемах со стрелками, но без забрала.</p><p class="p1">Сирио не стал ждать, пока они схватят его, и сразу ушел влево. Арья еще не видела, чтобы человек двигался так быстро. Один меч он остановил своей палкой и уклонился от второго. Лишившись равновесия, оба противника столкнулись друг с другом. Сирио пнул сапогом в спину второго, и красные плащи повалились вместе, на браавосийца налетел третий, метя мечом в голову. Сирио поднырнул под его клинок и ударил вверх. Человек Ланнистеров с воплем упал, кровь хлынула из кровавой дыры, оставшейся на месте левого глаза. Упавшие поднимались, Сирио ударил одного из них в лицо и прихватил стальной шлем с головы другого. Человек с кинжалом замахнулся. Сирио остановил руку шлемом и разбил палкой колено лежавшего. Последний из красных плащей с ругательством нанес удар, обеими руками взявшись за меч. Сирио откатился направо, и жестокий удар мясника угодил прямо между плечом и шлемом встававшего на колени гвардейца, того, что лишился шлема. Длинный меч рассек и панцирь, и кожу, и плоть. Прежде чем убийца успел высвободить свой кинжал, Сирио ударил его в адамово яблоко. С воем гвардеец отшатнулся назад, вцепившись пальцами в шею, лицо его почернело.</p><p class="p1">Когда Арья достигла задней двери, выходящей к кухне, пятеро латников уже лежали на полу — мертвые или умирающие. Она услышала проклятия сира Меррина Транта.</p><p class="p1">— Проклятые олухи, — ругнулся он, извлекая свой длинный меч из ножен.</p><p class="p1">Сирио Форель занял свою позу и прицокнул зубами.</p><p class="p1">— Иди отсюда, детка, — приказал он ей не глядя. — Уходи.</p><p class="p1">Смотри своими глазами, сказал он. И она видела: рыцаря, облаченного в белую броню, его ноги, голову, горло и руки, окованные металлом, глаза, упрятанные под высокий белый шлем, и в ладонях его жестокую сталь. А против него Сирио в кожаном жилете с деревянным мечом в руке.</p><p class="p1">— Сирио, беги, — закричала она.</p><p class="p1">— Первый меч Браавоса не из тех, кто бежит, — пропел он, когда сир Меррин ударил. Сирио уклонился от меча, палка его буквально растворилась в воздухе, в одно сердцебиение он нанес удары в висок, по локтю и горлу рыцаря, дерево звякнуло о металлический шлем, нагрудник и воротник.</p><p class="p1">Арья застыла на месте, сир Меррин приближался, Сирио отступал. Он отбил следующий удар, увернулся от второго, отразил третий.</p><p class="p1">Четвертый разрубил его палку пополам — и дерево, и свинцовую сердцевину.</p><p class="p1">Взрыдав, Арья побежала. Она бросилась через кухню и буфетные, в слепом ужасе находя извилистый путь между кухарками и кухонными мальчишками. Перед ней вдруг вырос помощник пекаря с деревянным подносом. Арья повалила его, разбросав благоуханные буханки свежевыпеченного хлеба по полу. Крики, поднявшиеся позади, она услыхала, уже обегая объемистого раздельщика, уставившегося на нее с ножом в руках. Руки его были по локоть в крови.</p><p class="p1">Все, чему учил ее Сирио Форель, вспыхнуло в голове девочки. Быстрая, как олень. Тихая, словно тень. Страх режет глубже меча. Гибкая, как змея. Тихая, как вода. Страх режет глубже меча. Сильная, как медведь. Свирепая, как росомаха. Страх режет глубже меча. Человек, который боится, уже погиб. Страх режет глубже меча. Страх режет глубже меча. Страх режет глубже меча. Рукоятка деревянного меча уже была влажной от пота, и Арья пыхтела, добравшись до лестницы в башню. На мгновение она замерла. Вверх или вниз? Путь вверх приведет ее к крытому мостику, нависшему над небольшим двориком, отделявшим ее от башни Десницы, куда она и должна была направиться по их распоряжению. Никогда не делай того, что от тебя ожидают, сказал ей однажды Сирио. Арья направилась вниз — вокруг центрального столба, перепрыгивая сразу через две-три узкие каменные ступеньки. Она оказалась в огромном сводчатом погребе, полном бочек с пивом, сложенных штабелями в двадцать футов высотой. Свет проникал сюда лишь сквозь узкие наклонные окна, пробитые высоко в стене.</p><p class="p1">Тупик. Из этого погреба она могла выйти лишь тем путем, которым пришла. Арья боялась подниматься по этим ступенькам, но она и не могла оставаться здесь. Она должна была отыскать отца и рассказать ему о случившемся. Отец защитит ее.</p><p class="p1">Арья заткнула деревянный меч за пояс и полезла. Перепрыгивая с бочонка на бочонок, она добралась до окна и, ухватившись за камень обеими руками, подтянулась. Стена была здесь трех футов толщиной, и окно косым лазом уходило вверх и наружу. Арья повернулась к дневному свету. Когда голова ее оказалась на уровне земли, она поглядела через двор на башню Десницы. Крепкая деревянная дверь была разбита топорами. На ступенях лицом вниз лежал мертвый. Кольчуга на спине его окрасилась алым. Охваченная ужасом, она заметила под убитым скомкавшийся серый плащ с белой атласной подкладкой. Только кто это, она не видела.</p><p class="p1">— Нет, — прошептала Арья. Что происходит? Где отец? Почему за ней пришли красные плащи? Она вспомнила, что сказал человек с желтой бородой в тот самый день, когда она побывала в подземелье чудовищ: раз может погибнуть один десница, то почему не может умереть и второй…</p><p class="p1">Арья ощутила слезы в глазах, задержав дыхание, она прислушалась. Звуки схватки, крики, стоны, звон стали о сталь доносились из башни Десницы.</p><p class="p1">Она не могла вернуться. Ее отец…</p><p class="p1">Арья закрыла глаза. На мгновение она слишком испугалась, чтобы шевелиться. Они убили Джори, Уилла, Хьюарда и того гвардейца, что сейчас лежал на ступеньках. Возможно, они убили уже и отца; убьют и ее, если захватят.</p><p class="p1">— Страх режет глубже меча, — сказала Арья громко. Однако зачем изображать из себя водяную плясунью? Это Сирио был водяным плясуном, но белый рыцарь наверняка уже убил его, а она всего лишь маленькая девочка с деревянной палкой в руках, одинокая и испуганная.</p><p class="p1">Арья вылезла во двор, настороженно оглянулась и поднялась на ноги. Замок казался опустевшим. В Красном замке всегда было людно. А теперь все, должно быть, попрятались внутри, заложив двери. Арья с тоской поглядела на свою опочивальню, а потом направилась прочь от башни Десницы, стараясь держаться возле стены, перебегая из тени в тень, как тогда, давно, когда она ловила кошек. Но сейчас она была кошкой и знала, что если ее поймают, то убьют.</p><p class="p1">Стараясь держаться между зданиями и стеной, прижимаясь к камню так, чтобы никто не мог застать ее врасплох, Арья почти без приключений добралась до конюшен. Мимо нее в кольчугах и панцирях пробежали золотые плащи, однако не зная, на чьей они стороне, Арья спряталась, чтобы ее не заметили.</p><p class="p1">Халлен, сколько помнила себя Арья, служивший в Винтерфелле мастером над конями, лежал на земле возле двери в конюшню. Его буквально истыкали кинжалами, казалось, что тунику его расшили алыми цветами. Арья не сомневалась, что он мертв, но когда она подобралась ближе, глаза конюшего открылись.</p><p class="p1">— Арья, — шепнул он. — Ты должна… предупредить своего… своего лорда-отца… — Кровавая пена запузырилась на его губах, мастер над конями закрыл глаза и более не говорил ничего.</p><p class="p1">Внутри лежали тела: конюх, который часто играл с ней, и трое гвардейцев отца. Фургон, загруженный сундуками и ящиками, остался забытым возле двери конюшни. Убитые, должно быть, как раз готовились отправиться на пристань, когда на них напали. Арья подобралась ближе. Среди покойников был Десмонд, показывавший ей свой длинный меч и обещавший защитить ее отца. Он лежал на спине, слепо уставившись в потолок, а мухи ползали по его глазам. Возле него остался убитый в красном плаще и в львином шлеме Ланнистеров, всего только один, заметила она. А ведь каждый северянин стоит десяти этих южан, говорил ей Десмонд.</p><p class="p1">— Ах ты, лжец! — буркнула она, с внезапной яростью пнув его тело.</p><p class="p1">Животные волновались в своих стойлах, фыркали и ржали от запаха крови. Арье оставалось одно — заседлать лошадь и бежать подальше от города и замка. Нужно было только держаться Королевского тракта, он сам и приведет ее назад в Винтерфелл. Арья взяла со стены уздечку и упряжь.</p><p class="p1">Проходя мимо фургона, она заметила упавший сундук. Должно быть, его столкнули во время схватки или уронили, когда грузили фургон. Дерево раскололось, из-под крышки вывалилось содержимое. Арья узнала шелк, бархат и атлас, которых она не носила. На Королевском тракте ей понадобится теплая одежда… и к тому же…</p><p class="p1">Арья встала на колени на землю, посреди разбросанных платьев. Она нашла тяжелый шерстяной плащ, бархатную юбку, шелковую рубашку и несколько нижних, платье, которое мать вышила для нее, серебряный детский браслет, который можно было продать. Отбросив в сторону разбитую крышку, она запустила руку в сундук в поисках Иглы. Свой меч она все время прятала на дне, подо всеми вещами, но теперь они были разбросаны вокруг, и на миг Арья уже испугалась, что клинок нашли и украли. Но пальцы ее ощутили твердый металл под атласным плащом.</p><p class="p1">— Вот она, — прошипел сзади нее голос.</p><p class="p1">Арья в испуге обернулась. Позади нее стоял конюшенный мальчишка с выражением блаженства на лице; запачканная белая нижняя рубашка торчала из-под грязной куртки. Сапоги его были вымазаны конским пометом, в руках он держал вилы.</p><p class="p1">— Кто ты? — спросила она.</p><p class="p1">— Она не знает меня, — проговорил он. — Но я-то ее знаю! О да. Ты — волчья девочка.</p><p class="p1">— Помоги мне заседлать коня, — попросила Арья, потянувшись назад в сундук за Иглой. — Мой отец — десница короля, он наградит тебя!</p><p class="p1">— Твой отец умер, — сказал мальчишка и направился к ней. — Это королева наградит меня. Иди сюда, девочка.</p><p class="p1">— Держись подальше! — Пальцы ее сомкнулись на рукояти Иглы.</p><p class="p1">— А я говорю, иди сюда. — Он крепко ухватил ее за руку.</p><p class="p1">Все, чему учил ее Сирио Форель, исчезло в биении сердца. И в короткий момент внезапного ужаса Арья сумела вспомнить лишь тот самый первый урок, который преподал ей Джон Сноу.</p><p class="p1">Она ударила его острым концом, направив кинжал вверх, с дикой истерической силой.</p><p class="p1">Игла пронзила кожаную куртку и белую плоть на его животе и вынырнула между лопаток. Мальчишка выронил вилы и не то вздохнул, не то негромко ойкнул. Руки его сомкнулись на клинке.</p><p class="p1">— О боги, — простонал он, когда его нижняя рубаха начала багроветь. — Вынь его.</p><p class="p1">Когда она сделала это, он умер.</p><p class="p1">Кони визжали, Арья стояла над телом в тихом испуге перед лицом смерти. Кровь хлынула изо рта мальчишки, когда он рухнул, еще больше алой жидкости вытекло из раны в животе, скопившись лужицей под телом. Он порезал руки, которыми ухватился за клинок. Арья медленно попятилась. Игла багровела в руке. Надо уходить отсюда подальше, куда-нибудь в безопасное место, где не было видно его обвиняющих глаз.</p><p class="p1">Она вновь схватила седло и уздечку и подбежала к своей кобыле. Но, закинув седло на спину лошади, Арья вдруг с болезненным ужасом поняла, что ворота замка будут скорее всего охраняться. Возможно, стражники не узнают ее, если примут за мальчика, возможно, ее пропустят… впрочем, скорее всего они получили приказ не выпускать никого — знакомого и незнакомого.</p><p class="p1">Но из замка можно было выйти другим путем.</p><p class="p1">Седло выскочило из пальцев Арьи и упало на пыльную землю, подняв целое облако. Сумеет ли она вновь найти комнату с чудовищами? Она не была уверена в этом, но знала, что придется попытаться.</p><p class="p1">Арья взяла выбранную ею одежду, набросила плащ, спрятав под ним Иглу. Остальные вещи она завязала в узелок и, зажав его под рукой, направилась в глубь конюшни, отперла заднюю дверь и осторожно выглянула. Вдали раздавался звон мечей, отчаянным голосом вопил от боли мужчина. Ей придется спуститься по змейке ступенек, мимо небольшой кухни и свинарника, так она шла, выслеживая черного кота… но этот путь приведет ее к казарме золотых плащей. Арья не могла идти туда и попыталась отыскать другую дорогу. Если только ей удастся перейти на противоположную сторону замка, она сможет тогда пробраться вдоль речной стены и через крохотную богорощу, но для этого нужно пересечь двор на виду у стражников, стоявших на стене.</p><p class="p1">Арья никогда не видела на стенах такого количества людей. Золотые плащи в основном были вооружены копьями. Некоторые из них знают ее в лицо. Что они сделают, если заметят бегущую через двор девочку? Сверху она будет казаться такой маленькой… Сумеют ли они оттуда узнать ее? Заинтересуются ли они ею?</p><p class="p1">Надо немедленно уходить, велела она себе, но когда пришло выбранное ею мгновение, Арья ощутила слишком большой испуг, чтобы шевельнуться.</p><p class="p1">Спокойная, как вода, шепнул голос ей на ухо. Арья так испугалась, что едва не выронила сверток. Она оглянулась вокруг, но в конюшне, кроме нее, находились только лошади и убитые.</p><p class="p1">Тихая, словно тень, услыхала она продолжение. Сама ли она говорила или Сирио? Она не знала этого, однако страхи ее тем не менее улеглись.</p><p class="p1">Арья вышла из конюшни.</p><p class="p1">Этот поступок потребовал от нее большей отваги, чем все, что приходилось ей делать прежде. Ей хотелось побежать, спрятаться, но Арья заставила себя неторопливо перейти через двор, ступая так, словно бы ей принадлежало все время в мире и у нее нет причин кого-нибудь бояться. Ей казалось, что она ощущает на себе взгляды стражников — словно букашек, ползавших по ее коже.</p><p class="p1">Арья не поднимала глаз. Если она увидит, что за ней наблюдают, вся отвага немедленно оставит ее, и она бросит свой сверток с одеждой и побежит, заливаясь младенческими слезами, и тогда уж ее точно поймают. Так что Арья смотрела в землю. Добравшись до тени королевской септы на противоположной стороне двора, Арья взмокла, но никто не поднял тревоги и крика.</p><p class="p1">Открытая септа была пуста. Внутри ее в благоуханном молчании горело с полсотни молитвенных свечей. Арья решила, что боги не хватятся двух из них. Она запихнула свечи в рукав и оставила септу через заднее окно. Прокрасться к проулку, где она застигла одноухого кота, было нетрудно. Но потом она заблудилась. Арья влезала и вылезала из окон, вспрыгивала на стены, искала путь в темных погребах — спокойная, словно тень.</p><p class="p1">Однажды она услышала женский плач. Ей потребовалось около часа, чтобы найти то узкое окно, через которое можно было спуститься в подземелье, где обитали чудовища.</p><p class="p1">Арья бросила внутрь свой сверток и согнулась, чтобы зажечь свечу. Это было рискованно; костер, который она заметила, прогорел до угольев, и, раздувая их, она услышала голоса. Обхватив пальцами трепещущий огонек, она нырнула в окно, пока люди входили в дверь, даже не посмотрев, кто это был.</p><p class="p1">На этот раз чудовища не испугали ее. Они казались почти что старинными друзьями. Арья подняла свечу над головой. С каждым ее шагом тени двигались по стене, они словно бы поворачивались, наблюдая за нею.</p><p class="p1">— Драконы, — шепнула она, извлекая Иглу из-под плаща. Тонкий клинок казался таким крохотным, а драконы, наоборот, огромными, однако Арья почему-то почувствовала себя уверенной, ощутив прикосновение стали к рукам.</p><p class="p1">Длинный, лишенный окон зал за дверью остался таким же мрачным, каким она запомнила его. Иглу она держала в левой руке, как привыкла, а свечу в правом кулаке. Горячий воск капал на пальцы. Вход в колодец находился слева, поэтому Арья направилась вправо. Ей отчаянно хотелось бежать, однако она опасалась погасить свечу. Арья слышала тонкий писк и заметила пару крошечных горящих крысиных глаз, но крысы ее не пугали… ее волновало другое. В коридоре было легко притаиться, ведь она и сама пряталась здесь от колдуна и человека с раздвоенной бородой. Она почти видела конюшенного мальчишку, сжавшегося у стены; руки его были стиснуты, и кровь стекала из глубоких порезов, оставленных Иглой. Что, если он захочет схватить ее, когда она окажется рядом? Он заранее увидит свечу. Возможно, ей лучше идти без света…</p><p class="p1">Страх режет глубже меча, прошептал спокойный голос внутри нее. И вдруг Арья вспомнила крипты Винтерфелла. В них было куда страшнее, чем здесь, сказала она себе. Арья впервые спустилась туда еще совсем маленькой. Братец Робб отвел их вниз — ее, Сансу и маленького Брана, который был тогда не старше, чем теперь Рикон. У них была с собой только одна свеча, и глаза Брана превращались в блюдечки, когда он глядел на каменные лики Королей Зимы, на волков у их ног и железные мечи на коленях.</p><p class="p1">Робб провел младших до самого конца — мимо деда, Брандона и Лианны, чтобы показать им их собственные гробницы. А Санса все глядела тогда на огарок свечи, опасаясь того, что она погаснет. Старая Нэн утверждала, что внизу водятся огромные пауки и крысы ростом с собаку. Робб улыбнулся, когда она это сказала.</p><p class="p1">— Здесь водятся худшие создания, чем пауки и крысы, — прошептал он. — Здесь ходят мертвецы. — Тогда-то они и услышали внизу этот негромкий глубокий звук, от которого по коже побежали мурашки, и младенец Бран вцепился в руку Арьи.</p><p class="p1">Когда привидение восстало из открытой гробницы, белое и алчущее крови, Санса с визгом метнулась к лестнице, а Бран прижался к ногам Робба, рыдая. Арья же, оставшись на месте, дала духу пинка. Это оказался всего лишь Джон, осыпавший себя мукой.</p><p class="p1">— Дурак, — сказала она ему. — Ты испугал младенца. — Но Джон и Робб только хохотали и хохотали. Скоро и Бран с Арьей тоже развеселились.</p><p class="p1">Воспоминание заставило девочку улыбнуться, и тьма перестала пугать ее. Мальчишка был мертв, она убила его, и если бы он вновь набросился на нее, то убила бы его снова. Теперь надо попасть домой… все исправится, когда она окажется дома, в безопасности, за седыми гранитными стенами Винтерфелла.</p><p class="p1">Шаги ее распространяли негромкое эхо, Арья углубилась во тьму.</p></span>
