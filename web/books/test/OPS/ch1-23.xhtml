<p class="p">Эддард</p>
</div><p class="p1">Эддард Старк въехал в высокие бронзовые ворота Красного замка усталый, голодный и раздраженный. Он был на коне и мечтал хорошенько попариться в ванне, перекусить жареной дичью, а потом сразу перебраться на перину, когда стюард короля сообщил ему, что великий мейстер Пицель срочно собирает Малый совет. Должность требовала, чтобы Нед почтил собрание своим присутствием.</p><p class="p1">— Мне было бы удобнее завтра, — спешиваясь, отрезал Нед.</p><p class="p1">Управляющий отвечал низким поклоном.</p><p class="p1">— Я передам членам совета ваши слова, милорд.</p><p class="p1">— Нет, черт побери, — отвечал Нед. Не дело оскорблять совет, даже не приступив к своим обязанностям. — Я посещу их. Только предоставьте мне немного времени, чтобы переодеться во что-нибудь презентабельное.</p><p class="p1">— Да, милорд, — поклонился стюард. — Мы отвели вам в башне Десницы покои, которые прежде занимал лорд Аррен. Если вы не возражаете, я прикажу, чтобы ваши вещи отправили туда.</p><p class="p1">— Благодарю, — отвечал Нед, снимая с рук перчатки для верховой езды и заталкивая их за пояс. Челядь уже появилась в воротах. Нед заметил Вейона Пуля, собственного управляющего, и позвал его. — Говорят, что я срочно нужен совету. Пригляди за тем, чтобы мои дочери нашли свои спальни, и скажи Джори, чтобы они там оставались. Пусть Арья никуда не выходит. — Пуль поклонился. Нед повернулся к королевскому стюарду: — Мои фургоны все еще тянутся по городу, и я нуждаюсь в какой-либо приличной одежде.</p><p class="p1">— Я помогу вам с величайшим удовольствием, — отвечал тот.</p><p class="p1">Получилось, что, когда облаченный в чужую одежду Нед вошел в зал собраний, усталый до самых костей, четверо членов Малого совета уже ожидали его.</p><p class="p1">Палата была богато обставлена. Вместо тростника пол покрывали мирийские ковры, в уголке, на ширме, привезенной с Летних островов, играли выписанные яркими красками сказочные животные. Стены были завешены гобеленами норвосской, квохорской и лиссенийской работы. Пара валирийских сфинксов стояла возле двери, глаза из полированного граната пылали на черных мраморных ликах.</p><p class="p1">Как только Нед появился в дверях, к нему обратился самый неприятный Старку советник — евнух Варис.</p><p class="p1">— Лорд Старк, я с прискорбием узнал о неприятностях, постигших вас на Королевском тракте. Мы все посетили септу и поставили свечи за здоровье принца Джоффри, я молюсь о его выздоровлении. — Рука его оставила пятна пудры на рукаве Неда, от евнуха пахло какой-то сладкой мерзостью, словно бы могильными цветами.</p><p class="p1">— Боги услышали нас, — отвечал Нед с холодной вежливостью. — Принц выздоравливает буквально на глазах. — Он высвободил свой рукав из ладоней евнуха и направился через всю комнату к лорду Ренли, стоявшему возле ширмы. Тот негромко разговаривал с коротышкой, который мог быть только Мизинцем. Когда Роберт взошел на трон, Ренли был еще восьмилетним мальчишкой, но теперь он вырос и сделался настолько похожим на брата, что Нед находил сходство смущающим. Встречая Ренли, он иногда думал, что годы пролетели бесследно и Роберт вновь предстал перед ним таким же молодцом, каким был после победы возле Трезубца.</p><p class="p1">— Вижу, что вы прибыли благополучно, лорд Старк, — проговорил Ренли.</p><p class="p1">— Как и вы, — отвечал Нед. — Простите, но иногда вы кажетесь мне истинной копией Роберта.</p><p class="p1">— Плохой копией. — Ренли пожал плечами.</p><p class="p1">— Хотя куда лучше одетой, — вставил Мизинец. — Лорд Ренли расходует на одежду больше, чем половина дворцовых дам.</p><p class="p1">Выпад был достаточно справедлив. Темно-зеленый бархат дублета лорда был расшит целой дюжиной золотых оленей. Короткий плащ из золоченой ткани удерживала на плече изумрудная брошь.</p><p class="p1">— Есть и худшие преступления, — отвечал Ренли со смешком. — Например, одеваться, как это делаешь ты.</p><p class="p1">Мизинец игнорировал укол. Он смотрел на Неда с улыбкой, граничившей с наглостью.</p><p class="p1">— Много лет я мечтал познакомиться с вами, лорд Старк. Вне сомнения, леди Кейтилин рассказывала вам обо мне.</p><p class="p1">— Конечно, — отвечал Нед с холодком в голосе. Лукавая надменность слов задела его. — Насколько я понимаю, вы были близко знакомы и с моим братом Брандоном.</p><p class="p1">Ренли Баратеон расхохотался. Варис приблизился, прислушиваясь.</p><p class="p1">— Пожалуй, излишне близко, — проговорил Мизинец. — Я до сих пор ношу на себе знак его уважения. Значит, и Брандон рассказывал обо мне?</p><p class="p1">— Нередко, и с некоторым пылом, — ответил Нед, надеясь, что тема закрыта. На такие словесные дуэли у него не хватало терпения.</p><p class="p1">— А я думал, что пыл не в обычаях Старков, — усмехнулся Мизинец. — Здесь на юге поговаривают, что Старков отливают изо льда и все они тают по дороге через Перешеек.</p><p class="p1">— Лорд Бейлиш, я не намереваюсь таять. Можете не сомневаться в этом. — Нед подошел к столу совета и сказал: — Мейстер Пицель, надеюсь, вы хорошо себя чувствуете?</p><p class="p1">Великий мейстер мягко улыбнулся из высокого кресла, замыкавшего стол.</p><p class="p1">— Достаточно хорошо для моих лет, милорд, — отвечал он. — Однако, увы, быстро утомляюсь. — Клочки белых волос обрамляли широкий купол лба над белым лицом. Оплечье мейстера представляло собой не простой металлический воротник, как у Лювина: две дюжины цепей сплетались вместе, образуя изумительное ожерелье, прикрывавшее плечи мейстера до горла. На звенья пошел всякий известный человеку металл: черное железо, червонное золото, яркая медь, тусклый свинец, сталь, олово, бледное серебро, бронза и платина. Работу кузнеца украшали гранаты, аметисты и черные жемчужины, тут и там мелькали рубины и изумруды.</p><p class="p1">— По-моему, пора начинать, — проговорил великий мейстер, сплетая руки на объемистом чреве. — Боюсь, что я могу уснуть, если ожидание затянется.</p><p class="p1">— Как угодно. — Королевское место во главе стола оставалось пустым, вышитый золотой ниткой коронованный олень Баратеонов скакал по его спинке. Нед занял кресло возле, как подобает правой руке короля. — Милорды, — произнес он вежливо. — Приношу свои сожаления в том, что заставил вас ждать.</p><p class="p1">— Вы — десница короля, — отвечал Варис. — Мы рады угодить вам, лорд Старк.</p><p class="p1">Когда остальные заняли свои привычные места, Эддард Старк вдруг заметил, насколько он не на месте здесь — в этой комнате, посреди этих людей. Он вспомнил, что Роберт говорил ему в крипте под Винтерфеллом. «Я окружен льстецами и глупцами», — сказал тогда король. Нед оглядел стол совета и попытался определить, кого здесь можно считать льстецом, а кого дураком. Прикинув ответ, он промолвил:</p><p class="p1">— Но вас всего пятеро.</p><p class="p1">— Лорд Станнис отправился на Драконий Камень вскоре после того, как король уехал на север, — ответил Варис. — А наш галантный сир Барристан, вне сомнения, сопровождает государя по городу, как подобает лорду-командующему Королевской гвардией.</p><p class="p1">— Быть может, лучше подождать сира Барристана и короля? — предложил Нед.</p><p class="p1">Ренли Баратеон громко расхохотался:</p><p class="p1">— Если мы примемся ждать, пока брат мой почтит нас своим королевским присутствием, то застрянем здесь не на один день.</p><p class="p1">— У нашего доброго короля Роберта много забот, — проговорил Варис. — И чтобы облегчить свою ношу, он доверяет нам кое-какие мелкие дела.</p><p class="p1">— Лорд Варис хочет сказать, что все эти хлопоты с монетой, урожаем и правосудием до слез утомляют моего царственного брата, — проговорил лорд Ренли. — Поэтому нам выпадает обязанность самим править страной. Время от времени король дает нам одно-два распоряжения. — Он извлек из рукава туго скатанную бумагу, положил ее на стол. — Этим утром он повелел мне скакать вперед со всей поспешностью и попросить великого мейстера Пицеля провести этот совет. У него есть для нас срочное поручение.</p><p class="p1">Мизинец улыбнулся и вручил Неду бумагу, запечатанную королевской печатью. Нед отковырнул воск большим пальцем и расправил письмо, чтобы иметь возможность прочитать срочное распоряжение короля. Но слова вызывали только возрастающее недоверие. Есть ли конец безрассудствам Роберта? А прикрываться его именем — все равно что сыпать соль на рану.</p><p class="p1">— Благие боги, — вздохнул он.</p><p class="p1">— Лорд Эддард хочет этим сказать, — объявил лорд Ренли, — что наш светлейший государь предлагает нам провести великий турнир, дабы почтить его назначение королевской десницей.</p><p class="p1">— Сколько? — кротко спросил Мизинец.</p><p class="p1">Нед вычитал ответ в письме:</p><p class="p1">— Сорок тысяч золотых драконов победителю. Двадцать тысяч тому, кто будет вторым. Еще двадцать победителю общей схватки и десять тысяч победителю среди стрелков.</p><p class="p1">— Итого девяносто тысяч золотых, — вздохнул Мизинец. — Не говоря уже о прочих расходах. Роберт хочет устроить пышное празднество. А для этого нужны повара, плотники, служанки, певцы, жонглеры, дураки…</p><p class="p1">— Ну, последних-то у нас тьма, — проговорил лорд Ренли.</p><p class="p1">Поглядев на Мизинца, великий мейстер Пицель спросил:</p><p class="p1">— Примет ли казна на себя расходы?</p><p class="p1">— Это какая казна? — проговорил Мизинец, скривив рот. — Простите мне мою глупость, мейстер. Вы прекрасно знаете, что сокровищница пуста уже не первый год. Мне придется занимать деньги. Вне сомнения, помогут Ланнистеры. Мы уже сейчас должны лорду Тайвину три миллиона драконов, так что уж там говорить еще об одной сотне тысяч.</p><p class="p1">Нед был ошеломлен.</p><p class="p1">— Неужели корона должна три миллиона золотых?</p><p class="p1">— Корона должна более шести миллионов золотых, лорд Старк. В основном Ланнистерам, но мы брали также у лорда Тирелла, в Железном банке Браавоса и у нескольких тирошийских торговых картелей. Недавно мне пришлось обратиться к жрецам. Великий септон дерет хуже, чем дорнийский рыбак.</p><p class="p1">Нед был потрясен.</p><p class="p1">— Но ведь после Эйериса Таргариена казна была выше краев полна золотом. Куда оно подевалось?</p><p class="p1">Мизинец пожал плечами:</p><p class="p1">— Мастер над монетой должен отыскать деньги. Тратят их король и десница.</p><p class="p1">— Не верю, чтобы Джон Аррен позволял Роберту такое мотовство! — с пылом проговорил Нед. Великий мейстер Пицель качнул своей большой лысой головой, цепи негромко звякнули.</p><p class="p1">— Покойный лорд Аррен был добродетельным человеком, но светлейший, увы, не всегда прислушивался к его мудрым советам.</p><p class="p1">— Мой царственный брат обожает турниры и пиры, — ответил Ренли Баратеон. — И презирает низменные медяки.</p><p class="p1">— Я поговорю со светлейшим, — пообещал Нед. — Страна не может себе позволить таких расходов.</p><p class="p1">— Говорите с ним, если угодно, — нахмурился лорд Ренли. — Но нам лучше составить план.</p><p class="p1">— В другой раз, — отмахнулся Нед, быть может, слишком резко, судя по тому, какими взглядами они посмотрели на него. Ему следует помнить, что теперь он не в Винтерфелле, где выше его был только король; здесь он был всего лишь первым среди равных. — Простите меня, милорды, — сказал он более мягким тоном. — Я устал. Давайте сегодня закончим и возобновим заседание после некоторого отдыха. — Не спрашивая согласия, Нед поднялся, кивнул всем и отправился к двери.</p><p class="p1">Снаружи поток фургонов и всадников все так же тек сквозь ворота в замок. Двор превратился в грязевую мешанину, конская плоть соседствовала с галдящими людьми. Неду сказали, что король еще не прибыл. После неприятных событий, происшедших возле Трезубца, Старки вместе с челядью ехали впереди основного отряда, подальше от Ланнистеров и растущей напряженности. Роберта видели редко. Поговаривали, что он путешествовал в огромной кибитке и нередко бывал пьян. До прибытия короля оставались часы, но все равно он появится здесь скорее, чем хотелось бы Неду. Одного выражения на лице Сансы ему хватало, чтобы ощутить ярость в душе. Последние две недели путешествия превратились в сущее несчастье. Санса во всем обвиняла Арью и говорила, что погибнуть должна была Нимерия. Арья же словно потерялась после того, как узнала, что случилось с ее приятелем, сыном мясника. Санса засыпала, только наплакавшись, Арья безмолвно сидела целыми днями, а Эддарду Старку снилась морозная преисподняя, предназначенная для Старков Винтерфеллских.</p><p class="p1">Нед уже пересек внешний двор, перешел под портиком во внутренний и повернул к сооружению, на его взгляд, являвшемуся башней Десницы, когда перед ним появился Мизинец.</p><p class="p1">— Вы идете не тем путем, Старк, следуйте за мной.</p><p class="p1">Поколебавшись, Нед последовал за Мизинцем. Тот привел его в башню, они спустились по лестнице, потом пересекли тесный дворик и направились по заброшенному коридору, вдоль стен которого караульщиками выстроились пустые доспехи. Это были реликвии Таргариенов. Черную сталь с драконьими гребнями затянуло пылью.</p><p class="p1">— Но в мои палаты ведет другая дорога, — сказал Нед.</p><p class="p1">— Разве я утверждал, что мы идем туда? Не думайте только, что я веду вас в темницу, чтобы перерезать глотку и спрятать труп за камнями в какой-нибудь нише, — отвечал Мизинец голосом, полным сарказма. — У нас нет на это времени, Старк: вас ждет жена.</p><p class="p1">— Какую игру вы затеяли, Мизинец? Кейтилин находится в Винтерфелле, в сотне лиг отсюда.</p><p class="p1">— Разве? — Серо-зеленые глаза Мизинца восторженно заблестели. — Тогда, выходит, кто-то перевоплотился в нее с удивительной ловкостью. В последний раз говорю вам: пойдемте. Если же нет, я оставлю вашу жену себе. — И заторопился вниз по ступеням.</p><p class="p1">Нед последовал за ним, подумав, что день этот, наверное, никогда не закончится. Он не любил дворцовых интриг, но уже начинал понимать, что они, словно хлеб насущный, питали людей, подобных Мизинцу.</p><p class="p1">Лестница привела их к тяжелой, окованной железом дубовой двери. Петир Бейлиш приподнял засов и пропустил Неда. Они вышли наружу. Сумерки спускались на каменистый утес над рекой.</p><p class="p1">— Но мы вышли из замка, — сказал Нед.</p><p class="p1">— Вас не одурачить, Старк, — блаженствовал Мизинец. — Солнце выдало меня или небо? Следуйте за мной. Здесь есть ступени, вырезанные в скале. Постарайтесь не упасть; Кейтилин никогда не поймет меня, если вы разобьетесь насмерть. — С этими словами он перегнулся через край утеса и ловко, как обезьяна, полез вниз.</p><p class="p1">Внимательно изучив поверхность скалы, Нед последовал за своим спутником, но не столь торопливо. Как обещал Мизинец, в скале обнаружились уступы, невидимые снизу мелкие выемки; нужно было только знать, где их искать. Река оказалась далеко внизу — просто в головокружительной дали. Нед прижимал лицо к скале и старался глядеть вниз не чаще, чем этого требовала необходимость. Достигнув наконец земли, он увидел узкую грязную колею, тянувшуюся вдоль края воды. Отдыхая на камне, Мизинец подкреплял силы яблоком, от которого уже остался один огрызок.</p><p class="p1">— Стареете, Старк, теряете скорость, — сказал он, небрежно отбрасывая огрызок в быстрый поток. — Но это не важно, остальную часть пути мы проедем верхом.</p><p class="p1">Их ждали два коня. Поднявшись в седло, Нед отправился следом за Мизинцем в город.</p><p class="p1">Наконец Бейлиш натянул поводья перед ветхим — в три этажа — деревянным домом, окна которого светились лампами в зарождавшихся сумерках. Звуки музыки и смех плыли над водой. Возле двери на тяжелой цепи висела причудливая масляная лампа с округлым свинцовым красным стеклом.</p><p class="p1">Нед Старк спешился в ярости.</p><p class="p1">— Это бордель! — рявкнул он, хватая Мизинца за плечо и разворачивая к себе. — Ты приволок меня в такую даль, чтобы показать мне бордель?!</p><p class="p1">— Здесь вы увидите свою жену, — отвечал Мизинец.</p><p class="p1">Большего оскорбления ожидать было нечего.</p><p class="p1">— Брандон был слишком добр к тебе! — выпалил Нед, толкнув невысокого спутника спиной на стену и выхватывая кинжал.</p><p class="p1">— Стойте, милорд, стойте, — послышался озабоченный голос. — Он говорит правду. — Сзади послышались шаги. Нед обернулся с кинжалом в руке и увидел спешившего к ним беловолосого старца. Домотканый наряд и рыхлая кожа на подбородке тряслись.</p><p class="p1">— Не твое дело, — начал Нед и вдруг, узнав старика, с удивлением опустил кинжал. — Сир Родрик?</p><p class="p1">Родрик Кассель кивнул:</p><p class="p1">— Ваша леди ждет наверху.</p><p class="p1">Нед был в недоумении.</p><p class="p1">— Кейтилин действительно там? Еще один фокус Мизинца? — Он спрятал клинок.</p><p class="p1">— Если бы так, Старк, — отвечал Мизинец. — Следуйте за мной, но постарайтесь не шествовать, как подобает королевской деснице… изобразите развратника. Негоже, если вас узнают. А лучше всего потискайте по пути пару девиц.</p><p class="p1">Они вошли внутрь людной комнаты, где жирная бабенка распевала непристойные песни, а молодые девицы посимпатичнее — в льняных или шелковых рубашках — жались к своим любовникам или сидели у них на коленях. Никто не обратил на Неда даже малейшего внимания. Сир Родрик остался внизу, Мизинец повел его на третий этаж к двери.</p><p class="p1">Кейтилин ждала его. Увидев Неда, она разрыдалась, бросилась к мужу и с пылом обняла его.</p><p class="p1">— Миледи, — прошептал изумленный Нед.</p><p class="p1">— Отлично, — проговорил Мизинец, прикрывая дверь за спиной. — Значит, вы узнали ее.</p><p class="p1">— Я боялась, что ты не придешь, милорд, — прошептала она, припав к его груди. — Петир приносил мне сообщения. Он рассказал о происшествии с Арьей и молодым принцем. Как мои девочки?</p><p class="p1">— Обе в трауре и полны гнева, — ответил он. — Кет, я не понимаю, что ты делаешь в Королевской Гавани? Что случилось? — спросил Нед у жены. — Ты из-за Брана? Он… — Слово «умер» просто не могло сойти с его губ.</p><p class="p1">— Из-за Брана, но совсем по другому делу.</p><p class="p1">Нед растерялся.</p><p class="p1">— Тогда зачем ты здесь, любовь моя? И что это за дом?</p><p class="p1">— Вы видели его, — отвечал Мизинец, садясь возле окна. — Это бордель. Неужели вы можете найти место, более неподходящее для Кейтилин Талли? — Он улыбнулся. — К тому же, по случаю, это заведение принадлежит мне, и я мог легко отдать нужные распоряжения. Я принял все меры, чтобы Ланнистеры не узнали, что Кет находится здесь, в Королевской Гавани.</p><p class="p1">— Но почему? — спросил Нед. И только тут увидел ее руку, сделавшуюся неловкой: свежие красные шрамы, два застывших пальца. — Ты была ранена! — Он взял ее пальцы в свои, повернул. — Боже, какие глубокие порезы… Это меч или… Как это случилось, миледи?</p><p class="p1">Кейтилин извлекла из-под плаща кинжал и вложила его в ладонь мужу.</p><p class="p1">— Этот клинок должен был перерезать горло Брану.</p><p class="p1">Голова Неда дернулась вверх.</p><p class="p1">— Но кто… и почему…</p><p class="p1">Она приложила палец к губам.</p><p class="p1">— Позволь я тебе все расскажу, любовь моя. Так будет быстрее. Слушай.</p><p class="p1">И она рассказала все, что случилось: начиная от пожара в Библиотечной башне до появления Вариса и гвардейцев вместе с Мизинцем. Когда Кейтилин умолкла, Старк опустился возле стола с кинжалом в руке. Волк Брана спас мальчику жизнь, подумал он. Как же там сказал Джон, когда они с Роббом нашли этих щенков в снегу? Эти щенки предназначены вашим детям, милорд. А он собственной рукой убил волка Сансы, и ради чего? Ощущая собственную вину? Или страх? Если это боги послали детям волков, какой безумный поступок он совершил?</p><p class="p1">С усилием Нед обратил свои мысли к кинжалу, к тому, что он означал.</p><p class="p1">— Кинжал Беса, — повторил Нед. Это была бессмыслица. Рука Неда обхватила гладкую рукоять драконьей кости, он вонзил клинок в стол, ощутив, как острие впилось в дерево. Нож застыл, смеясь над ним. — Зачем Тириону Ланнистеру смерть Брана? Мальчик никогда не делал ему плохого.</p><p class="p1">— Неужели у Старков между ушей только снег? — спросил Мизинец. — Бес никогда не стал бы действовать в одиночку.</p><p class="p1">Нед поднялся и принялся ходить по комнате.</p><p class="p1">— Если в этом участвовала королева или же, о боги, сам король… нет, я в это не верю. — И тут же вспомнил холодное утро на поле среди курганов и слова Роберта о том, что он послал бы убийц к последней принцессе из рода Таргариенов. Он вспомнил младенца — сына Рейегара, его разбитую головенку, и как тогда отвернулся король. Как отвернулся он и в приемном зале Дарри, совсем уж недавно. Он еще слышал мольбы Сансы, как и давние рыдания Лианны.</p><p class="p1">— Вероятнее всего, король не знает, — сказал Мизинец. — Это не впервые. Наш добрый Роберт приучился закрывать глаза на вещи, которых лучше не замечать.</p><p class="p1">На это Неду нечего было ответить. Перед его глазами возникло лицо сына мясника, рассеченного почти пополам. Король и тогда не сказал ни слова. В голове Неда грохотало.</p><p class="p1">Мизинец склонился над столом, извлек нож из дерева.</p><p class="p1">— Обвинение сочтут предательством в обоих случаях. Обвини короля — и попляшешь в руках Илина Пейна, как только слова вылетят из твоего рта. Королева… если удастся найти доказательства и заставить Роберта прислушаться к ним… тогда, быть может…</p><p class="p1">— У нас есть доказательства, — сказал Нед. — Кинжал.</p><p class="p1">— Этот? — Мизинец непринужденно подбросил кинжал вверх. — Приятная железка, но она режет обеими сторонами, милорд. И Бес, вне сомнения, присягнет, что потерял клинок в Винтерфелле, или же расскажет, что его украли у него, а поскольку наемник погиб, никто не сможет разоблачить эту ложь. — Он непринужденно перебросил клинок Неду. — Советую вам бросить нож в реку и забыть о том, что он вообще существовал.</p><p class="p1">Нед прохладно поглядел на него.</p><p class="p1">— Лорд Бейлиш, я Старк Винтерфеллский. Мой сын искалечен, быть может, он умирает. И он бы уже умер, и Кейтилин вместе с ним, если бы не волчонок, найденный нами в лесу. Если вы действительно верите, что я способен забыть такое, то проявляете столь же огромную глупость, как в молодости, когда изволили выйти с мечом против моего брата.</p><p class="p1">— Возможно, я и дурак, Старк… но я здесь, а брат ваш гниет в своей мерзлой могиле уже четырнадцать лет. Если вы торопитесь разделить его общество, не стану отговаривать вас, но сам я туда не спешу, покорнейше вас благодарю.</p><p class="p1">— Вас я позвал бы с собой в последнюю очередь, лорд Бейлиш.</p><p class="p1">— Вы наносите мне глубокую рану. — Мизинец прижал ладонь к сердцу. — Лично мне Старки всегда казались скучными, но Кет привязана к вам по причинам, которых я понять не могу. Я попытаюсь сохранить вам жизнь, но только ради нее. Безусловно, за такое предприятие возьмется только дурак, но вашей жене я ни в чем не способен отказать.</p><p class="p1">— Я передала Петиру наши подозрения относительно смерти Джона Аррена, — проговорила Кейтилин. — Он обещал помочь тебе отыскать правду.</p><p class="p1">Новость не обрадовала Эддарда Старка, однако они и в самом деле нуждались в помощи, а Кет некогда видела в Мизинце почти что брата. Не впервые приходится договариваться с человеком, достойным презрения.</p><p class="p1">— Очень хорошо, — проговорил Нед, засовывая кинжал за пояс. — Вы упомянули о Варисе. Евнух знает об этом?</p><p class="p1">— Не от меня, — проговорила Кейтилин. — Ты женат не на дуре, Эддард Старк. Но Варис умеет выведывать тайны любого человека. Он владеет каким-то темным искусством, Нед, я клянусь в этом!</p><p class="p1">— У него есть шпионы, это всем известно, — презрительно сказал Нед.</p><p class="p1">— Более того, — настаивала Кейтилин. — Сир Родрик беседовал с сиром Ароном в полной секретности, но паук каким-то образом узнал об их разговоре. Я боюсь этого человека.</p><p class="p1">Мизинец улыбнулся.</p><p class="p1">— Предоставьте лорда Вариса мне, милая леди. Если вы позволите мне небольшую непристойность — в этом доме она как нигде уместна, — я держу этого человека за яйца. — Он с улыбкой сжал кулак. — Точнее, держал бы, будь он мужчиной. Видите ли, когда пирог будет разрезан и птички защебечут, Варису это не понравится. На вашем месте я бы больше опасался Ланнистеров, а не евнуха.</p><p class="p1">Чтобы понять это, Нед не нуждался в Мизинце. Он вернулся мыслями ко дню, когда обнаружилась Арья, и увидел лицо королевы, сказавшей «Волк у нас есть» — таким мягким и тихим голосом. Он подумал и о мальчике Мике, о внезапной смерти Джона Аррена, о падении Брана, об Эйерисе Таргариене, безумном старце, испускающем дух на полу своего собственного тронного зала, где кровь его засохла на золоченом клинке.</p><p class="p1">— Миледи, — проговорил он, поворачиваясь к Кейтилин, — более вам здесь делать нечего. Я хочу, чтобы вы немедленно вернулись в Винтерфелл. Там, где есть один убийца, могут найтись и другие. Кто бы ни приказал убить Брана, персона эта скоро узнает, что мальчик остался жив.</p><p class="p1">— Я надеялась повидать девочек… — сказала Кейтилин.</p><p class="p1">— Это будет крайне неразумно, — вставил Мизинец. — Красный замок полон любопытных глаз, а дети не могут не проболтаться.</p><p class="p1">— Он говорит правду, любовь моя, — сказал Нед, обнимая жену. — Бери сира Родрика и уезжай в Винтерфелл. Я прослежу за девочками. Отправляйся домой к нашим сыновьям и береги их.</p><p class="p1">— Как вам угодно, милорд. — Кейтилин подняла лицо, Нед поцеловал ее. Раненые пальцы впились в спину с отчаянной силой, словно бы Кейтилин старалась навсегда удержать его в своих объятиях.</p><p class="p1">— Не хотят ли лорд и леди воспользоваться спальней? — спросил Мизинец. — Но предупреждаю, Старк, за этот род занятий здесь принято платить.</p><p class="p1">— Я хочу остаться с ним вдвоем на мгновение, не более, — сказала Кейтилин.</p><p class="p1">— Очень хорошо. — Мизинец направился к двери. — Только побыстрее. Нам с десницей следует возвратиться во дворец прежде, чем наше отсутствие станет заметным.</p><p class="p1">Кейтилин подошла к Мизинцу и взяла его руки в свои.</p><p class="p1">— Я не забуду твоей помощи, Петир. Когда твои люди явились за мной, я не знала, куда они меня приведут: к другу или врагу. Я обнаружила в тебе более чем друга — давно потерянного брата.</p><p class="p1">Петир Бейлиш улыбнулся:</p><p class="p1">— Я отчаянно сентиментален, милая леди. Никому не говорите этого. Я потратил многие годы, убеждая двор в том, что я зол и жесток, и мне бы не хотелось, чтобы все мои труды оказались напрасными.</p><p class="p1">Нед не верил ни единому его слову, но, стараясь говорить вежливо, промолвил:</p><p class="p1">— Я тоже благодарю вас, лорд Бейлиш.</p><p class="p1">— Вот ваша благодарность — это истинное сокровище, — с восторгом ответил Мизинец.</p><p class="p1">Когда дверь закрылась, Нед обернулся к жене:</p><p class="p1">— Как только ты окажешься дома, пошли слово к Хелману Толхарту и Галбарту Гловеру под моей печатью. Пусть выставят по сотне лучников каждый и пошлют их ко Рву Кейлин. Две сотни надежных стрелков способны удержать Перешеек против любой армии. Прикажи лорду Мандерли привести в порядок все укрепления Белой гавани и приглядеть, чтобы там было достаточно людей. Начиная с этого момента я хочу, чтобы за Теоном Грейджоем тщательно приглядывали. Если будет война, нам отчаянно потребуется флот его отца.</p><p class="p1">— Война? — Страх проступил на лице Кейтилин.</p><p class="p1">— Не обязательно, — пообещал ей Нед, надеясь, что эти слова окажутся верными. Он снова обнял ее. — Ланнистеры безжалостны к слабым, что, к скорби своей, узнал Эйерис Таргариен. Но они не полезут на север, не заручившись сначала поддержкой всего королевства. А ее они не добьются. Но мне придется сыграть свою роль в этом дурацком маскараде и сделать вид, словно бы ничего не происходит. Вспомни, зачем я явился сюда, любовь моя. И если я найду доказательства того, что Ланнистеры убили Джона Аррена…</p><p class="p1">Кейтилин трепетала в его руках. Покрытые шрамами руки обнимали его.</p><p class="p1">— Если… — проговорила она. — И что будет тогда, любовь моя?</p><p class="p1">Тут и крылась опасность, Нед знал это.</p><p class="p1">— Правосудие вершит король, — сказал он. — Выяснив истину, я пойду к Роберту. — «Молясь богам, чтобы он оказался таким, каким я его считаю, а не тем, каким, по-моему, он уже стал», — докончил он про себя.</p></span>
