<span id="id8"><div class="title2">
<p class="p">Арья</p>
</div><p class="p1">Стежки под рукой Арьи вновь вышли кривыми. Бросив на них хмурый и недовольный взгляд, она поглядела на сестру, окруженную девушками. Санса великолепно владела иглой. Так говорили все.</p><p class="p1">— Шитье Сансы столь же красиво, как и она сама, — сказала однажды септа Мордейн их леди-матери. — У нее такие деликатные руки. — А когда леди Кейтилин спросила об Арье, септа фыркнула: — А у Арьи руки кузнеца.</p><p class="p1">Арья повела взглядом по комнате, опасаясь, что септа Мордейн прочтет ее мысли, но септа не уделяла ей сегодня внимания. Она сидела возле принцессы Мирцеллы, выражая улыбкой восторг. Септам нечасто удается поучить женскому делу принцесс королевской крови, сказала она, когда королева привела к ним Мирцеллу. На взгляд Арьи, стежки принцессы тоже казались чуточку кривоватыми, но по воркованию септы Мордейн этого никак нельзя было определить. Арья вновь оглядела собственную работу, пытаясь найти способ исправить ее, а потом вздохнула, опустила иглу и мрачно уставилась на сестру. Санса весело трещала за работой. Бет Кассель, младшая дочь сира Родрика, сидела возле ее ног, прислушиваясь к каждому слову, Джейни Пуль, склонившись, что-то шептала ей на ухо.</p><p class="p1">— О чем вы говорите? — вдруг спросила Арья.</p><p class="p1">Джейни удивленно поглядела на нее и хихикнула. Санса смутилась. Бет покраснела. Никто не ответил.</p><p class="p1">— Скажите же, — проговорила Арья.</p><p class="p1">Джейни оглянулась, чтобы убедиться в том, что септа Мордейн не слушает. Мирцелла как раз что-то кончила рассказывать, и септа рассмеялась вместе со всеми остальными дамами.</p><p class="p1">— Мы говорили о принце, — ответила Санса голосом мягким, как поцелуй.</p><p class="p1">Арья знала, о каком из принцев шла речь: конечно же, о Джоффри, высоком и красивом. Санса сидела рядом с ним на пиру. Ей же, Арье, пришлось сидеть с пухлым малышом. Вполне естественно.</p><p class="p1">— Твоя сестра понравилась Джоффри, — прошептала Джейни с гордостью, словно от нее что-то зависело. Она была дочерью стюарда Винтерфелла и самой близкой подругой Сансы. — Он сказал ей, что она прекрасна.</p><p class="p1">— Он собирается жениться на ней, — сонным голосом объявила кроха Бет, обхватив себя руками. — Тогда Санса сделается королевой.</p><p class="p1">Санса изящно покраснела. Краснела она всегда удивительно мило. Она все делает мило, с тупой укоризной подумала Арья.</p><p class="p1">— Бет, тебе не следует сочинять такие сказки, — поправила Санса младшую, ласково погладив ее по голове, чтобы лишить резкости собственные слова. Она поглядела на Арью. — А что ты думаешь о принце Джоффри, сестра? Он очень галантен, тебе не кажется?</p><p class="p1">— Джон говорит, что он очень похож на девочку, — сказала Арья.</p><p class="p1">Санса вздохнула, не прекращая шитья.</p><p class="p1">— Бедный Джон, — сказала она. — Он ревнует потому, что он бастард.</p><p class="p1">— Он наш брат, — сказала Арья слишком уж громко. Голос ее прорезал полдневный покой горницы наверху башни.</p><p class="p1">Септа Мордейн подняла глаза. Костлявое лицо, острые глаза и тонкие губы как будто специально были созданы для того, чтобы укорять. Рот ее уже кривился.</p><p class="p1">— И о чем же вы разговариваете, девочки?</p><p class="p1">— О нашем сводном брате, — поправилась Санса, мягко и точно. Она улыбнулась септе: — Мы с Арьей как раз говорили, что нам приятно шить сегодня в обществе принцессы.</p><p class="p1">Септа Мордейн кивнула:</p><p class="p1">— Действительно. Это великая честь для всех нас. — Принцесса Мирцелла неуверенно улыбнулась комплименту. — Арья, почему ты не шьешь? — зашелестев накрахмаленными юбками, спросила септа и, встав на ноги, направилась через всю комнату. — Покажи-ка мне свою работу?</p><p class="p1">Арье хотелось заплакать. Ну зачем это Санса, как всегда, привлекла внимание септы?</p><p class="p1">— Вот, — сказала она, подавая свое шитье. Септа посмотрела на ткань.</p><p class="p1">— Арья, Арья, Арья, — покачала она головой. — Это не дело. Это совсем не дело!</p><p class="p1">Все вокруг глядели на нее. Это уж слишком. Санса была слишком хорошо воспитана, чтобы улыбнуться несчастью сестры, но Джейни блаженствовала. Даже принцессе Мирцелле было жаль ее. Арья почувствовала, как слезы наполняют ее глаза. Выскочив из кресла, она бросилась к двери.</p><p class="p1">Септа Мордейн позвала ее:</p><p class="p1">— Арья, вернись! Ты не сделаешь ни одного шага. Твоя леди-мать услышит об этом. Ты позоришь семью перед лицом нашей царственной гостьи.</p><p class="p1">Арья остановилась в дверях и повернула назад, закусив губу. Слезы теперь бежали по ее щекам. Она умудрилась отпустить короткий нервный поклон Мирцелле:</p><p class="p1">— Прошу вашего разрешения, моя госпожа.</p><p class="p1">Мирцелла моргнула и поглядела на своих дам, ожидая наставлений. Однако в отличие от принцессы септа Мордейн не испытывала неуверенности.</p><p class="p1">— И куда же ты направлялась, Арья? — потребовала ответа септа.</p><p class="p1">Бросив на нее яростный взор, Арья ответила самым любезным тоном:</p><p class="p1">— Коней ковать, — и, недолго насладившись потрясением, проступившим на лице септы, бросилась вон, сбежав по ступеням так быстро, как могли нести ее ноги.</p><p class="p1">Это было нечестно. Сансе досталось все. Санса была на два года старше, и к тому времени, когда родилась Арья, ей ничего уже не осталось. Так она считала. Санса умела шить, танцевать и петь. Она писала стихи. Она со вкусом одевалась. Она играла на высокой арфе и колокольчиках. Хуже того, она была прекрасна. Санса унаследовала высокие, тонкие скулы матери и густые, осеннего цвета волосы Талли. Арья пошла в своего лорда-отца. Каштановые волосы ее не блестели, лицо казалось длинным и скорбным. Джейни обычно дразнила ее лошадью и ржала, когда Арья проходила мимо. Лучше сестры она умела лишь ездить на коне. Ну, кроме этого, еще хорошо управлялась по дому. Санса никогда не разбиралась в цифрах. Если она выйдет за принца Джоффри, тому придется обзаводиться надежным управителем.</p><p class="p1">Нимерия ожидала ее в караулке у подножия лестницы и вскочила на ноги, едва завидев Арью. Девочка ухмыльнулась. Уж этот волчонок любит ее, как бы ни относились к ней все остальные. Они повсюду ходили вместе, Нимерия и спала в комнате Арьи — возле постели. Если бы мать этого не запрещала, Арья охотно брала бы волчонка с собой на шитье. Вот пусть тогда септа Мордейн попробует осудить ее стежки. Арья отвязала Нимерию, та лизнула ее руку. Желтые глаза волчонка, отражая солнечный свет, блеснули двумя золотыми монетами. Арья назвала ее в честь воинственной королевы ройнов, которая некогда провела свой народ через Узкое море. Это имя тут же послужило причиной для большого скандала. Санса, конечно же, назвала своего щенка Леди. Сделав гримасу, Арья обняла волчонка. Нимерия лизнула ее в ухо, и девочка хихикнула.</p><p class="p1">Септа Мордейн, безусловно, успела все сообщить ее леди-матери. Если она отправится к себе, ее сразу найдут. Арья не хотела этого. Она придумала кое-что получше. Мальчики как раз занимались во дворе. И ей хотелось увидеть, как Робб уложит галантного принца Джоффа на спину.</p><p class="p1">— Пойдем, — шепнула она Нимерии. Вскочив, Арья побежала, волчонок следовал за ней по пятам.</p><p class="p1">В стене крытого перехода между арсеналом и Великим Замком находилось окошко, из которого был виден весь двор. Туда они и направились.</p><p class="p1">Запыхавшаяся и раскрасневшаяся Арья обнаружила там Джона, сидевшего на подоконнике, поджав колени к подбородку. Он следил за происходящим, углубившись настолько, что даже не заметил ее приближения, лишь его белый волк отправился им навстречу. Нимерия приближалась с опаской. Призрак был крупнее, чем его собратья; он обнюхал сестру, лизнул в ухо и опустился на пол.</p><p class="p1">Джон, любопытствуя, повернулся.</p><p class="p1">— Разве тебе не положено сейчас работать над шитьем, маленькая сестрица?</p><p class="p1">Арья отвечала гримасой:</p><p class="p1">— Я хочу посмотреть, как они дерутся.</p><p class="p1">Он улыбнулся:</p><p class="p1">— Тогда подойди сюда.</p><p class="p1">Арья взобралась на окно и села возле него, прислушиваясь к стуку и говору во дворе. К ее разочарованию, учили младших ребят. Бран был укутан так, что показался ей завернутым в перину, а уж Томмен, при всей своей толщине, похож был на колобок. Они пыхтели, сопели и разили друг друга обмотанными тканью деревянными мечами под внимательным взглядом сира Родрика Касселя, мастера над оружием, рослого и объемистого, словно бочонок, с великолепными белыми бакенбардами во всю щеку. Дюжина зрителей, мужчины и мальчики, подбадривали сражающихся. Голос Робба был самым громким. Возле старшего брата она заметила Теона Грейджоя, черный дублет воспитанника украшал золотой кракен<a href="ch2.xhtml#id5" class="a">[5]</a> его дома, на лице проступало выражение превосходства. Оба сражавшихся уже спотыкались. Арья решила, что бой длится достаточно давно.</p><p class="p1">— Более утомительное занятие, чем шитье?</p><p class="p1">— Более веселое занятие, чем шитье, — отвечала ему Арья. Джон с ухмылкой протянул руку и взъерошил ее волосы. Арья покраснела. Они всегда были близки. Джон напоминал ей отца, и она ему тоже. Они были единственными: Робб, Санса и даже маленький Рикон пошли в Талли — улыбчивые, с пламенной шевелюрой. По малолетству Арья когда-то боялась, что из-за этого ее тоже сочтут бастардом. С опасениями своими она отправилась именно к Джону, и именно он переубедил ее.</p><p class="p1">— А ты почему не во дворе? — спросила его Арья.</p><p class="p1">Он отвечал ей полуулыбкой.</p><p class="p1">— Бастардам не позволено сражаться с юными принцами. Все синяки, которые они получат во время упражнений, должны быть нанесены руками законных сыновей.</p><p class="p1">— О!.. — Арья смутилась. Ей следовало бы понять это самостоятельно. Второй раз за сегодняшний день Арья решила, что жизнь не так уж и хороша. Она посмотрела, как ее младший брат рубанул Томмена. — А я могу управляться с мечом не хуже Брана. Ему только семь, а мне уже девять.</p><p class="p1">Джон посмотрел на нее с высоты всей своей четырнадцатилетней мудрости.</p><p class="p1">— Ты слишком худа, — объявил он и взял сестру за руку, чтобы пощупать мускулы, а потом вздохнул и покачал головой. — Едва ли ты сможешь просто поднять длинный меч, маленькая сестрица, не говоря уже о том, чтобы размахнуться им.</p><p class="p1">Арья вырвалась и яростно поглядела на него. Джон снова взлохматил ее волосы. Бран и Томмен все еще кружили друг против друга.</p><p class="p1">— А ты видишь принца Джоффри? — спросил Джон.</p><p class="p1">Она заметила его не с первого взгляда, лишь приглядевшись, — сзади, в тени высокой каменной стены. Принца окружали мужчины, которых Арья не знала, незнакомые ей молодые сквайры в ливреях Ланнистеров и Баратеонов. Среди них были мужчины постарше. Она решила, что это рыцари.</p><p class="p1">— Погляди-ка на герб на его плаще, — прошептал Джон.</p><p class="p1">Арья посмотрела. На подбитом плаще принца был вышит причудливый щит. Тут уж, вне сомнения, шитье было великолепным. Герб разделялся на две половины: по одной стороне мчался венценосный олень королевского дома, на другой рычал лев Ланнистеров.</p><p class="p1">— Ланнистеры горды, — заметил Джон. — Джоффри было бы достаточно и королевского герба, но нет, он решил воздать дому своей матери такие же почести.</p><p class="p1">— С женщиной тоже надо считаться! — возразила Арья.</p><p class="p1">Джон усмехнулся:</p><p class="p1">— Неужели и ты сделала бы то же самое, маленькая сестрица? Объединила Талли со Старками в своем гербе?</p><p class="p1">— Волк с рыбой в зубах! — Она расхохоталась. — Это было бы глупо. К тому же, если девочка не может сражаться, зачем нужен ей герб?</p><p class="p1">Джон пожал плечами:</p><p class="p1">— У девушек есть гербы, но нет мечей. Бастард получает меч, а не герб. Не я учреждаю правила, моя маленькая сестрица.</p><p class="p1">Внизу во дворе послышался крик. Принц Томмен катался в грязи, безуспешно пытаясь встать. Подушки делали из него некое подобие черепахи. Бран стоял над ним с поднятым мечом, готовый рубануть, если поверженный противник снова поднимется на ноги. Мужчины расхохотались.</p><p class="p1">— Довольно! — проговорил сир Родрик. Он подал принцу руку и поднял его на ноги. — Хорошая схватка. Лью, Доннис, помогите им снять броню. — Он огляделся. — Принц Джоффри, Робб, дело за вами, объявляю новый поединок.</p><p class="p1">Робб, уже покрывшийся по́том в предыдущей схватке, бодро шагнул вперед:</p><p class="p1">— Охотно!</p><p class="p1">Отвечая на вызов Родрика, Джоффри вышел на солнечный свет. Волосы его блеснули золотой нитью.</p><p class="p1">— Это же игра для детей, сир Родрик, — проговорил он со скукой.</p><p class="p1">Теон Грейджой разразился хохотом.</p><p class="p1">— Вы и есть дети, — сказал он.</p><p class="p1">— Робб, возможно, и ребенок, — сказал Джоффри, — но я принц. И мне надоело рубить Старков игрушечным мечом.</p><p class="p1">— Ты получил больше ударов, чем нанес, Джофф, — возразил ему Робб. — Или ты боишься?</p><p class="p1">Принц Джоффри поглядел на него и процедил сквозь зубы:</p><p class="p1">— Просто в ужасе перед таким грозным воином. — Кое-кто из Ланнистеров расхохотался.</p><p class="p1">Джон, хмурясь, глядел на эту сцену.</p><p class="p1">— А Джоффри-то хоть еще и не вырос, но уже дерьмо, — сообщил он Арье.</p><p class="p1">Сир Родрик задумчиво потянул за белый ус.</p><p class="p1">— Что вы предлагаете? — спросил он у принца. — Настоящую сталь?</p><p class="p1">— По рукам, — отвечал Робб, — сам же и пожалеешь.</p><p class="p1">Оружейных дел мастер положил руку на плечо Робба, чтобы успокоить его.</p><p class="p1">— Настоящая сталь слишком опасна. Я разрешаю вам взять турнирные мечи с затупленными краями.</p><p class="p1">Джоффри не ответил, но незнакомый Арье высокий рыцарь с черными волосами и оставленными ожогами шрамами на лице пробился вперед и стал перед принцем.</p><p class="p1">— Это твой принц, и кто ты таков, сир, чтобы указывать ему, может он или нет брать в руки острый меч.</p><p class="p1">— Я Кассель, мастер над оружием в Винтерфелле, и советую тебе не забывать об этом.</p><p class="p1">— Неужели здесь учат женщин? — захотел узнать рыцарь со шрамами. Его мышцы вздувались, как у быка.</p><p class="p1">— Я воспитываю рыцарей, — подчеркнул сир Родрик. — Они получат сталь, когда будут готовы к ней… Когда достигнут нужного возраста.</p><p class="p1">Рыцарь поглядел на Робба.</p><p class="p1">— Сколько тебе лет, мальчик?</p><p class="p1">— Четырнадцать, — отвечал Робб.</p><p class="p1">— Я убил мужчину в двенадцать лет. И не сомневайся — не тупым мечом.</p><p class="p1">Арья заметила, как Робб ощетинился, гордость его была задета. Он обернулся к сиру Родрику:</p><p class="p1">— Позволь мне сделать это. Я смогу победить его.</p><p class="p1">— Тогда бери турнирный меч, — ответил сир Родрик.</p><p class="p1">Джоффри пожал плечами:</p><p class="p1">— Встретимся, когда подрастешь, Старк. Но только не в глубокой старости. — Люди Ланнистеров расхохотались.</p><p class="p1">Ругательства Робба раздались во дворе. Потрясенная Арья прикрыла рот. Теон Грейджой схватил Робба за руку, чтобы увести его подальше от принца. Сир Родрик недовольно потянул себя за усы.</p><p class="p1">Джоффри изобразил зевок и повернулся к младшему брату.</p><p class="p1">— Пошли, Томмен, — сказал он. — Время игр закончено. Пусть дети развлекаются.</p><p class="p1">Ланнистеры снова разразились смехом, Робб опять отвечал бранью. Лицо сира Родрика под белыми бакенбардами уже побурело, как свекла. Теон удерживал Робба железной хваткой, пока принцы и их отряд не отошли подальше.</p><p class="p1">Джон проводил их взглядом. Арья заметила, что лицо Джона сделалось столь же спокойным, как пруд в середине богорощи. Наконец он слез с окна.</p><p class="p1">— Развлечение закончено, — проговорил он, нагибаясь, чтобы почесать Призрака за ушами. Волк поднялся и потерся о хозяина боком. — Лучше бы тебе отправиться к себе в комнату, маленькая сестрица. Септа Мордейн уже притаилась там, и чем дольше ты будешь прятаться, тем суровее окажется наказание. Тебе придется шить всю зиму. А когда настанет оттепель, твое тело обнаружат с иголкой, застывшей между замерзшими пальцами.</p><p class="p1">Арья не видела в подобной перспективе ничего забавного.</p><p class="p1">— Ненавижу шитье! — проговорила она с пылом. — Это нечестно!</p><p class="p1">— Все нечестно, — ответил Джон, вновь взъерошил ее волосы и отправился прочь. Призрак безмолвно последовал за хозяином. Нимерия тоже было увязалась за ними, но остановилась и вернулась назад, заметив, что Арья остается на месте. Девочка неуверенно, без особой охоты повернула в обратную сторону. Но там ее ожидала худшая участь, чем предполагал Джон: в комнате сидела не одна септа Мордейн, там была и ее мать.</p></span>
