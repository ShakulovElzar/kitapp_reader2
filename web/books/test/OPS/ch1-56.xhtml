<span id="id54"><div class="title2">
<p class="p">Бран</p>
</div><p class="p1">Холодным ветреным утром прибыли Карстарки во главе трех сотен всадников и почти двух сотен пеших из своего замка в Кархолде. Колонна приближалась, поблескивая стальными остриями пик. Перед ней шел человек, выбивая гулкий неторопливый походный ритм на барабане, который был больше его самого. Бум, бум, бум.</p><p class="p1">Бран следил за их приближением со сторожевой башенки на внешней стене с помощью бронзовой подзорной трубы мейстера Лювина, сидя на плечах Ходора. Прибывших возглавлял сам лорд Рикард, сыновья его Харрион, Эддард и Торрхен ехали возле отца под черными как ночь знаменами с вышитой колючей звездой. Старуха Нэн утверждала, что в жилах рода текла кровь Старков, от которых ветвь эта отделилась несколько веков назад. Однако, на взгляд Брана, прибывшие не напоминали Старков: высокие могучие люди, густобородые, волосы до плеч. Плечи их покрывали медвежьи, тюленьи и волчьи шкуры.</p><p class="p1">Пришли последние, он знал это. Остальные лорды уже собрались в Винтерфелле со своими дружинами. Брану хотелось посмотреть, как наполняются зимние дома, на оживленную толпу, каждый день собиравшуюся по утрам на рыночной площади, увидеть улицы, изрытые колесами и копытами. Но Робб запретил ему оставлять замок.</p><p class="p1">— Мы не можем выделить людей, которые будут тебя охранять, — объяснил он брату.</p><p class="p1">— Я возьму Лето, — возразил Бран.</p><p class="p1">— Не принимай меня за ребенка, — сказал Робб. — Ты знаешь, в чем дело. Только два дня назад человек лорда Болтона зарезал человека лорда Сервина в «Курящемся бревне». Наша леди-мать сдерет с меня шкуру, если я позволю себе рисковать твоей жизнью, — окончил он голосом лорда Робба, и Бран понял, что возражений не может быть.</p><p class="p1">Так было из-за того, что произошло в Волчьем лесу, Бран знал это. Ему до сих пор снился тот день. Он оказался беспомощен как младенец, способный защитить себя не более, чем, скажем, Рикон. Даже менее… Рикон хотя бы стал отбиваться. Бран ощутил стыд. Он ведь всего лишь на несколько лет младше Робба, но если брат уже почти стал взрослым, значит, и он тоже. Он должен научиться защищать себя!</p><p class="p1">Год назад он бы убежал в Зимний городок, даже если бы для этого пришлось лезть вниз по стене. Тогда он мог бегать по лестнице, сам поднимался и спускался со своего пони и научился владеть деревянным мечом достаточно хорошо, чтобы сбить принца Томмена с ног. А теперь ему оставалось лишь наблюдать за происходящим через трубку с линзами. Мейстер Лювин показал ему все знамена: кольчужный кулак Гловеров, серебряный на алом фоне; черного медведя леди Мормонт; жуткого, лишенного кожи человека Болтонов из Дредфорта; лося Хорнвудов, боевой топор Сервинов, три страж-дерева Толхартов и устрашающий герб дома Амберов — ревущего гиганта в разорванных цепях.</p><p class="p1">Вскоре он узнал и лица гостей, когда лорды с сыновьями и рыцарями начали съезжаться в Винтерфелл на пиры. Даже великий чертог не вмещал сразу всех, поэтому Робб принимал своих основных знаменосцев по очереди. Брану всегда предоставлялось почетное место по правую руку от брата. Некоторые из знаменосцев посматривали на него с жестким недоумением, словно бы удивляясь тому, что над ними восседает зеленый мальчишка и — более того — калека.</p><p class="p1">— Сколько же их собралось? — спросил Бран у мейстера Лювина, когда лорд Карстарк и его сыновья въехали в ворота.</p><p class="p1">— Двенадцать тысяч людей или около того.</p><p class="p1">— А сколько среди них рыцарей?</p><p class="p1">— Не слишком много, — ответил мейстер с легким нетерпением. — Чтобы стать рыцарем, нужно выстоять стражу в септе и принять помазание семью елеями, освящающее обет. На севере мало почитателей Семерых. Наши люди чтут старых богов и не вступают в рыцари… но эти лорды, их сыновья и дружинники обладают не меньшей доблестью, отвагой и честью. Человек не становится достойнее, когда к его имени приставляют словечко «сир». Я говорил это тебе уже сотню раз.</p><p class="p1">— И все же, — спросил Бран, — сколько среди них рыцарей?</p><p class="p1">Мейстер Лювин вздохнул:</p><p class="p1">— Три сотни, быть может, четыре… кроме того, у нас есть три тысячи тяжеловооруженных всадников, не являющихся рыцарями.</p><p class="p1">— Лорд Карстарк последний, — задумчиво заметил Бран. — Робб будет пировать с ним сегодня вечером.</p><p class="p1">— Вне сомнения.</p><p class="p1">— А сколько осталось… дней до начала похода?</p><p class="p1">— Робб должен выступить вскоре или же не выступать вовсе, — ответил мейстер Лювин. — Зимний городок набит до отказа, и это войско объест всю страну, если простоит здесь достаточно долго. Остальные — рыцари курганов, озерный люд, лорды Мандерли и Флинт — присоединятся к нему на Королевском тракте. В Приречье началась война, и брату твоему придется пройти много лиг.</p><p class="p1">— Я знаю. — В голосе Брана прозвучало горе. Передавая бронзовую трубу мейстеру, он заметил, насколько редкими сделались волосы Лювина на макушке. Бран видел сквозь них розовую кожу; странно смотреть на мейстера сверху, когда всю свою жизнь ты глядел на него снизу вверх. Но тот, кто сидит на спине Ходора, глядит на всякого сверху вниз. — Я не хочу больше смотреть. Ходор, отнеси меня назад в замок.</p><p class="p1">— Ходор, — пробормотал Ходор.</p><p class="p1">Мейстер Лювин убрал трубку в рукав.</p><p class="p1">— Бран, твой лорд-брат сегодня не сможет зайти к тебе. Он должен поприветствовать лорда Карстарка и его сыновей и выказать им свое расположение.</p><p class="p1">— Я не обеспокою Робба. Я хочу посетить богорощу. — Бран опустил свою руку на плечо Ходора.</p><p class="p1">— Ходор…</p><p class="p1">Высеченные в граните опоры для рук складывались в лестницу, расположенную во внутренней стене башни. Напевая что-то непонятное, Ходор спускался, перемещая руку за рукой. Бран раскачивался на его спине в плетеной корзине, которую соорудил для него мейстер Лювин, позаимствовав идею от женщин, которые в корзинах на спине переносили хворост; прорезать отверстия для ног и приспособить ремни, способные выдержать вес Брана, было не так уж трудно. В корзине он ощущал себя, как на спине Плясуньи, однако кобыла пройдет не всюду, и Бран не ощущал стыда, как бывало, когда Ходор переносил его на руках, подобно ребенку. Ходору, похоже, тоже было удобнее, однако трудно сказать, что ему нравится.</p><p class="p1">Сложности возникали только в дверях. Иногда Ходор забывал, что Бран сидит на его спине, и тогда проникновение в дверь оказывалось болезненным.</p><p class="p1">Почти две недели в замке было столько гостей, что Робб приказал держать открытыми обе решетки и не поднимать мост между ними даже глухой ночью. Когда Бран появился из башни, длинная колонна латников пересекала ров между стенами; это люди Карстарка следовали за своими лордами в замок. На них были черные железные шишаки и черные шерстяные плащи, украшенные белой звездой. Ходор шел возле них, улыбаясь чему-то своему, сапоги его стучали по доскам подъемного моста. Стражники странно поглядывали на них, и Бран даже услышал чей-то хохоток, но отказал себе в праве смутиться.</p><p class="p1">— Люди будут смотреть на тебя, — предупредил его мейстер Лювин, как только они впервые пристроили плетеную корзину к плечам Ходора. — Они будут смотреть, они будут говорить, и некоторые даже будут смеяться.</p><p class="p1">Пусть смеются, решил Бран. В спальне над ним смеяться некому, но нельзя же всю жизнь провести в постели!</p><p class="p1">Когда они прошли под решетками башни, Бран вложил два пальца в рот и свистнул, Лето выскочил откуда-то с другой стороны двора. Внезапно копьеносцы Карстарка взялись за уздечки; кони заметались и заржали. Один жеребец с криком встал на дыбы, наездник, ругаясь, осаживал коня. Запах лютоволка всегда повергал лошадей в бешеный страх, если только они не были привычны к нему, но как только Лето исчезал, животные быстро успокаивались.</p><p class="p1">— В богорощу, — напомнил Бран Ходору.</p><p class="p1">Даже сам Винтерфелл был полон народу. Во дворе звенели мечи и топоры, грохотали фургоны, лаяли псы. Ворота арсенала были открыты, и Бран увидел Миккена у наковальни; молот звенел, и пот катился по голой груди. Стольких незнакомцев здесь не собиралось, даже когда к отцу приезжал король Роберт.</p><p class="p1">Он попытался не дернуться, когда Ходор нырнул в низкую дверь. Потом они шли длинным сумрачным коридором, Лето непринужденно топал возле них. Волк время от времени поднимал голову, и в глазах его светилось жидкое золото. Брану хотелось прикоснуться к нему, но он ехал слишком высоко и не мог дотянуться до зверя.</p><p class="p1">Богороща являла собой островок мира посреди моря хаоса, в который превратился Винтерфелл.</p><p class="p1">Ходор прошел через чистые заросли дуба, железоствола и стража, к спокойному пруду возле сердце-дерева, и остановился под корявыми ветвями чардрева, бормоча что-то себе под нос. Бран поднял руки над головой и выбрался из седла, выволакивая бессильные ноги сквозь дыры в плетеной корзине. Он повисел мгновение, темно-красные листья прикасались к его лицу, наконец Ходор опустил его на гладкий камень возле воды.</p><p class="p1">— Я хочу побыть один, — сказал Бран. — А ты можешь помокнуть, ступай к прудам.</p><p class="p1">— Ходор, — откликнулся Ходор и исчез в кустарнике. За богорощей, под окнами гостевого дома, подземный горячий источник питал три небольших пруда.</p><p class="p1">Пар клубами валил от воды день и ночь, и стена, поднимавшаяся над прудами, густо поросла мхом. Ходор ненавидел холодную воду и всякий раз сопротивлялся как дикий кот, когда ему принимались угрожать мылом. Но он с радостью погружался в самый горячий пруд из трех и сидел там часами, громко булькая всякий раз, когда на поверхности лопались пузыри, поднявшиеся из зеленых мутных глубин.</p><p class="p1">Лето лакнул воды и уселся возле Брана. Мальчик почесал волку шею, и на мгновение оба они ощутили покой. Бран всегда любил богорощу — даже до того, — но в последнее время он обнаружил, что его все больше и больше влечет сюда. Даже сердце-дерево более не пугало его, как прежде. Глубокие красные очи, врезанные в белый ствол, все еще следили за ним, но их взгляд теперь почему-то приносил утешение. Боги глядят на него, сказал он себе, старые боги, боги Старков, Первых Людей и Детей Леса, боги его отца. Под их взглядом он ощущал себя в безопасности, а глубокое молчание деревьев помогало ему думать. Бран много размышлял после своего падения. Он думал и мечтал, разговаривал с богами.</p><p class="p1">— Пожалуйста, сделайте так, чтобы Робб не уехал, — негромко помолился он. И шлепнул рукой по холодной воде, от руки его разбежались круги. — Пусть он останется. А если ему придется уехать, пусть вернется домой невредимым вместе с матерью, отцом и девочками. И пусть все будет так… будет так, чтобы Рикон понял!</p><p class="p1">Узнав, что Робб уезжает на войну, самый младший из братьев взбесился как зимняя пурга. Рикон то плакал, то надувался. Он отказывался есть, ревел и кричал по ночам, даже поколотил старую Нэн, когда старуха попыталась колыбельными песнями успокоить его. На следующий день Рикон исчез. Робб самолично обегал ползамка, разыскивая брата; наконец его отыскали — в самой глубине крипт. Рикон замахнулся на людей ржавым мечом, который он забрал из рук одного из мертвых королей, и Лохматый Песик вылетел из тьмы зеленоглазым бесом. Волк взбесился почти как Рикон. Он укусил Гейджа в руку и вырвал кусок мяса из бедра Миккена. Только сам Робб и Серый Ветер сумели угомонить их обоих. Фарлен посадил черного волка на цепь в конуре, и Рикон залился еще горшими слезами, расставшись с другом.</p><p class="p1">Мейстер Лювин советовал Роббу оставаться в Винтерфелле, и Бран тоже — ради себя самого и ради Рикона, — но брат только упрямо качал головой и говорил:</p><p class="p1">— Поймите, я не хочу ехать, я должен!</p><p class="p1">Ложью это было только отчасти. Кому-то следовало занять Перешеек и помочь Талли против Ланнистеров, Бран понимал это. Но зачем это делать Роббу? Брат его мог отдать приказ Халу Моллену, Грейджою или одному из своих знаменосцев. Мейстер Лювин предлагал ему поступить именно так, но Робб не желал даже слышать об этом.</p><p class="p1">— Мой лорд-отец никогда бы не послал людей навстречу опасности, трусливо спрятавшись за стенами Винтерфелла, — говорил он им.</p><p class="p1">Старший брат теперь казался Брану каким-то незнакомым, Робб преобразился в истинного лорда, еще не встретив шестнадцатых именин. Даже знаменосцы отца как будто бы поняли это. Многие пытались испытать его, каждый на собственный манер. Русе Болтон и Роберт Гловер требовали назначить их полководцами, первый ворчливо, второй с улыбкой и шуткой. Крепкая седоволосая Мейдж Мормонт, облаченная в кольчугу подобно мужчине, открыто заявила Роббу, что он годится ей во внуки и она не позволит командовать собой… однако закончила разговор тем, что у нее есть дочь, которую она рада будет отдать за него. Мягкоречивый лорд Сервин даже прихватил с собой свою дочь, пухленькую домашнюю девочку тринадцати лет, сидевшую у левой руки отца, не отрывая глаз от тарелки. Веселый лорд Хорнвуд дочерей не имел, но являлся с подарками, сегодня с конем, завтра с олениной, послезавтра с серебряным охотничьим рогом и ничего не просил… ничего, кроме некоего острога, отобранного у его деда, восстановления охотничьих прав Хорнвудов к северу от такого-то хребта… и чтоб ему разрешили перегородить плотиной Белый Нож, если это будет угодно его светлости.</p><p class="p1">Робб отвечал каждому холодной любезностью, как всегда поступал отец, и каким-то образом сумел подчинить всех себе.</p><p class="p1">Когда лорд Амбер, которого люди прозвали Большим Джоном, ибо он был ростом с Ходора и, наверное, раза в два шире в плечах, пригрозил увести свое войско домой, если Амберов поместят ниже Хорнвудов или Сервинов в походном порядке, Робб сказал, что будет рад этому.</p><p class="p1">— А когда мы покончим с Ланнистерами, — посулил он Большому Джону, почесывая за ухом своего лютоволка, — то направимся на север и, взяв ваш замок, милорд, повесим вас как клятвопреступника. — Тут Большой Джон с проклятиями бросил в огонь бутыль эля и объявил, что Робб еще настолько мал, что должен писать молоком.</p><p class="p1">Когда Халлис Моллен шагнул вперед, чтобы осадить его, великан одним ударом поверг его на пол, перевернул стол и извлек самый громадный и уродливый из всех великих мечей, которые Брану случалось видеть.</p><p class="p1">Сыновья его, братья и дружинники повскакали с мест, хватаясь за сталь.</p><p class="p1">Но Робб спокойно произнес одно лишь слово, раздался негромкий рык, и в мановение ока лорд Амбер оказался на спине; меч его отлетел фута на три, из руки его, там, где Серый Ветер откусил два пальца, хлынула кровь.</p><p class="p1">— Мой лорд-отец всегда говаривал, что поднявшего меч на сюзерена ждет смерть, — сказал Робб, — но вы, вне сомнения, просто захотели нарезать мне мясо. — Внутренности Брана поднялись к горлу, когда Большой Джон встал на ноги, обсасывая оставшиеся от пальцев огрызки… но тут, к его удивлению, гигант расхохотался.</p><p class="p1">— Твое мясо, — взревел он, — малость жестковато.</p><p class="p1">И каким-то образом после этого Большой Джон сделался правой рукой Робба, его надежнейшим помощником, громко уверявшим всех и вся, что юный милорд — самый настоящий Старк и тем, кто не хочет, чтобы им откусили ногу, лучше преклонить колена.</p><p class="p1">Потом, ночью, брат явился в опочивальню Брана бледный и потрясенный — уже после того, как в Великом зале потушили огни.</p><p class="p1">— Я думал, что он убьет меня, — признался Робб. — Ты видел, как он бросил Хала? Прямо как Рикона! Боги, я так испугался. Но Большой Джон вовсе не самый худший из них, он только самый громкий. Лорд Русе никогда не говорит ни слова, он только глядит на меня, а мне все представляется та комната, где у себя в Дредфорте Болтоны вешают шкуры своих врагов.</p><p class="p1">— Но это же одна из сказок старухи Нэн, — сказал Бран. Нотка сомнения вкралась в его голос. — Разве не так?</p><p class="p1">— Не знаю. — Робб устало качнул головой. — Лорд Сервин хочет взять свою дочь на юг вместе с нами. Якобы чтобы она готовила ему. Но Теон уверяет, что я однажды обнаружу эту девушку в своей постели. Как мне хотелось бы… как мне хотелось бы, чтобы отец был с нами!</p><p class="p1">Тут уж согласие было полным: все — Бран, Рикон и Робб-лорд, все хотели, чтобы отец оказался здесь. Но лорд Эддард находился в тысяче миль отсюда и был узником далекой темницы, преследуемым беглецом, спасающим свою жизнь, а может быть, даже мертвецом. Никто не знал его участи наверняка, каждый путешественник рассказывал иную повесть, еще более ужасную, чем предыдущая. Головы дружинников отца гнили на стенах Красного замка, насаженные на пики. Король Роберт скончался от рук отца. Баратеоны осадили Королевскую Гавань. Лорд Эддард бежал на юг с братом короля злодеем Ренли. Пес убил Арью и Сансу. Мать убила Тириона-Беса. Лорд Тайвин Ланнистер выступил против Орлиного Гнезда, все сжигая и убивая всех на своем пути. Один пропитавшийся вином болтун даже объявил, что Рейегар Таргариен восстал из мертвых и шествует во главе огромного войска древних героев с Драконьего Камня, чтобы заявить свои права на престол отца.</p><p class="p1">А потом прилетел ворон с письмом, запечатанным собственной печатью отца и написанным рукой Сансы, и жестокая правда оказалась не менее невероятной. Бран так никогда и не смог забыть выражения на лице Робба, читавшего слова сестры.</p><p class="p1">— Она утверждает, что отец вошел в заговор с братьями короля, — прочитал он. — Король Роберт умер, а нас с матерью призывают в Красный замок, чтобы присягнуть на верность Джоффри. Санса просит, чтобы мы изъявили верность, а когда она выйдет за Джоффри, то попросит его пощадить жизнь лорда-отца. — Пальцы Робба сжались в кулак, скомкав письмо Сансы. — А об Арье ничего, даже единого слова. Проклятие! Что случилось с девчонкой!</p><p class="p1">Бран покрылся холодным потом.</p><p class="p1">— Санса потеряла своего волка, — сказал он слабым голосом, вспоминая тот день, когда четверо гвардейцев отца доставили с юга останки Леди. Лето, Серый Ветер и Лохматый Песик завыли прежде, чем посланцы пересекли подъемный мост, и в голосах их слышались скорбь и отчаяние.</p><p class="p1">В тени Первой Твердыни прятался древний заросший могильный дворик, камни его поросли бледным лишайником; там старые Короли Зимы клали на вечный покой своих слуг. Там и погребли останки Леди, тем временем братья ее сновали между могил беспокойными тенями. Она отправилась на юг, и только кости ее вернулись домой.</p><p class="p1">Так было и с их дедом, старым лордом Рикардом, и с его сыном Брандоном, братом отца, и с двумя сотнями его лучших людей. Никто из них не вернулся. А теперь еще и отец уехал на юг вместе с Арьей и Сансой, Джори, Халденом, Толстым Томом и всеми остальными. А потом за ними последовали мать и сир Родрик, и они тоже не вернулись. А теперь еще Робб собрался туда же. Не в Королевскую Гавань, чтобы присягнуть новому королю, но в Риверран с мечом в руке. И если их лорд-отец действительно находится в заточении, поход этот, безусловно, грозил ему смертью. Это пугало Брана больше, чем он мог сказать.</p><p class="p1">— Если Робб должен будет уехать, идите за ним, — обратился Бран к старым богам, смотревшим на него с сердце-дерева красными глазами. — Приглядите за его людьми, Халом, Квентом и остальными, за лордом Амбером, леди Мормонт и прочими лордами. И за Теоном, конечно! Идите за ними, берегите их, если это угодно вам. Помогите им победить Ланнистеров, спасти отца и вернуться домой!</p><p class="p1">Слабое дыхание ветра пробежало по богороще, красные листья шевельнулись и зашептали. Лето обнажил зубы.</p><p class="p1">— Ты слышишь их, парень? — проговорил голос.</p><p class="p1">Бран поднял голову. На противоположной стороне пруда под древним дубом стояла Оша, листья скрывали ее лицо. Даже в кандалах она двигалась с удивительной легкостью. Лето обежал пруд, принюхался, высокая женщина дернулась.</p><p class="p1">— Лето, ко мне, — позвал Бран. Волк нюхнул напоследок, повернулся и направился обратно. Бран обнял его. — Что ты делаешь здесь? — Он не видел Ошу с тех пор, как она попала в плен в Волчьем лесу, но знал, что ее определили работать на кухню.</p><p class="p1">— Это и мои боги, — сказала Оша. — Там, за Стеной, других не знают. — Волосы ее отрастали, каштановые и лохматые. Она сделалась более женственной в простом платье из грубого домотканого материала, которое ей дали, сняв с нее кольчугу. — Гейдж время от времени отпускает меня помолиться, когда мне это очень нужно. А я позволяю ему делать все, что он хочет, под моей юбкой. Мне все равно. Мне даже нравится запах муки на его руках, и он ласковей Стива. — Она неловко поклонилась. — Ну, оставлю тебя. Мне нужно отмыть горшки.</p><p class="p1">— Нет, останься, — приказал ей Бран. — Ответь мне, почему ты сказала, что я слышу богов?</p><p class="p1">Оша поглядела на него.</p><p class="p1">— Ты просил, и они ответили. Открой уши, прислушайся, сам услышишь.</p><p class="p1">Бран прислушался.</p><p class="p1">— Но это же только ветер, — возразил он неуверенным голосом. — Шелестят листья…</p><p class="p1">— А кто, по-твоему, посылает ветер, если не боги? — Оша с негромким звоном уселась на другой стороне пруда. Миккен заковал ее ноги в железо, их соединяла тяжелая цепь, она могла ходить, нешироко расставляя ноги, но бежать или сесть в седло была не способна.</p><p class="p1">— Они видят тебя, парень, они слышат твою речь. А отвечают тебе этим шелестом.</p><p class="p1">— А что они говорят?</p><p class="p1">— Им грустно. Твой лорд-брат не получит от них помощи там, куда он направляется. Старые боги не имеют силы на юге. Богорощи там вырубили еще тысячу лет назад. Как они смогут проследить за твоим братом в краю, где у них нет глаз?</p><p class="p1">Бран даже не думал об этом. И сразу испугался. Если даже боги не в силах помочь его брату, откуда же взять надежду? Быть может, Оша не расслышала их? Он пригнул голову и попытался прислушаться снова. Ему показалось, что теперь улавливает печаль, но не более.</p><p class="p1">Шелест становился громче. Бран услышал глухие шаги, негромкое бормотание, из-за деревьев появился Ходор, голый и улыбающийся.</p><p class="p1">— Ходор…</p><p class="p1">— Должно быть, он услышал наши голоса, — сказал Бран. — Ходор, ты забыл одеться.</p><p class="p1">— Ходор, — согласился Ходор. Тело его ниже шеи было мокрым, в холодном воздухе от него валил пар. Он весь зарос коричневым волосом, густым как шкура. Между ногами раскачивались длинные и тяжелые признаки мужества.</p><p class="p1">Оша поглядела на него с кислой улыбкой.</p><p class="p1">— Вот это мужчина, — сказала она. — Он от крови гигантов или я королева!</p><p class="p1">— Мейстер Лювин говорит, что гигантов больше нет, все они умерли, как Дети Леса. От них остались лишь огромные кости в земле, которые люди время от времени выворачивают плугами.</p><p class="p1">— Пусть твой мейстер Лювин проедет вдоль Стены, — сказала Оша. — Тогда он найдет гигантов или скорее они сами отыщут его. Мой брат убил одну из них. В ней было десять футов роста, а еще не взрослая… Бывает, что они достигают двенадцати и тринадцати футов. Они свирепые, одни зубы да волосы, а у жен их бороды, как у мужей, и различить их трудно. Их женщины берут к себе в любовники наших мужчин и потом рожают полукровок. Но если гиганты поймают женщину, той приходится хуже. Их мужчины так велики, что могут разорвать девушку, прежде чем наградят ее ребенком. — Она ухмыльнулась. — Но ты же ведь не понимаешь, о чем я говорю, а, мальчик?</p><p class="p1">— Понимаю, — возразил Бран. Ему было известно, что такое случка: он видел и как жеребец поднимается на кобылу, и собачьи свадьбы во дворе. Но разговаривать об этом было неприятно. Он поглядел на Ходора. — Ступай назад за одеждой, Ходор, — сказал он. — Поди оденься.</p><p class="p1">— Ходор, — пробурчал тот и отправился назад тем же путем, которым пришел, поднырнув под невысокую ветвь.</p><p class="p1">А у него действительно там очень много, подумал Бран, провожая Ходора взглядом.</p><p class="p1">— Значит, за Стеной действительно обитают гиганты? — спросил он у Оши неуверенным тоном.</p><p class="p1">— Не только гиганты, но и более страшные создания, маленький лорд. Я попыталась объяснить это твоему брату, когда он начинал задавать вопросы… ему, вашему мейстеру и этому мальчишке Грейджою. Подымаются холодные ветры, люди оставляют свои очаги и не возвращаются… а если и приходят назад, то уже не как люди, а мертвяками — с синими глазами и холодными черными руками. Почему, ты думаешь, я побежала на юг вместе со Стивом, Хали и прочими дурнями? Манс считает, что он смог бы с ними сразиться, отважный, милый, упрямый мужик… Он думает, что Белые Ходоки — это все равно что разведчики Ночного Дозора. Как бы не так! Пусть он зовет себя Королем за Стеной, но, по правде говоря, он просто ворона, слетевшая с Сумеречной башни. Манс не видел зимы. А я родилась там, как моя мать… и бабка и прабабка. Я дочь свободного народа! Мы помним… — Оша встала, цепи ее загремели. — Я пыталась объяснить все это твоему лорду-брату. Только вчера, увидев его во дворе, я позвала его — «милорд Старк», с уважением, как подобает, но он поглядел мимо меня, а этот потный олух, Большой Джон Амбер оттолкнул меня прочь. Пусть будет так! Я буду носить железо и придерживать язык. Что может услышать человек, который не хочет слушать?</p><p class="p1">— Расскажи все мне. Робб ко мне прислушается, я знаю.</p><p class="p1">— Прислушается ли теперь? Посмотрим. Скажи ему так, милорд. Скажи своему брату, что он идет не в ту сторону. Ему следовало бы повернуть свои мечи на север. На север, а не на юг. Ты слышишь меня?</p><p class="p1">Бран кивнул:</p><p class="p1">— Я скажу ему.</p><p class="p1">Но в ту ночь, когда они пировали в Великом зале, Робба не было с ними. Он ужинал в своем солярии вместе с лордом Рикардом, Большим Джоном и прочими лордами-знаменосцами, уточняя планы предстоящего долгого похода. Брану пришлось занять место брата во главе стола и исполнять роль хозяина перед сыновьями и высокочтимыми друзьями лорда Карстарка. Все уже расселись по местам, когда Ходор на спине внес Брана в зал, и преклонили колена перед высоким престолом. Двое слуг помогли ему выбраться из корзины. Бран ощущал на себе взгляд каждого незнакомца в зале, все притихли.</p><p class="p1">— Милорды, — объявил Халлис Моллен. — Брандон Старк из Винтерфелла.</p><p class="p1">— Приветствую вас у нашего очага, — сказал напряженным голосом Бран. — И предлагаю вам мясо и мед в честь нашей дружбы.</p><p class="p1">Харрион Карстарк, старший из сыновей лорда Рикарда, поклонился, следом за ним братья, и все же, когда они заняли места, Бран услыхал молодые негромкие голоса за стуком винных чаш.</p><p class="p1">— …я бы скорее умер, чем жил таким, — пробормотал один из них, тезка отца Эддард, а брат его Торрхен ответил, что мальчишка, наверное, сломлен внутри, как и снаружи, и слишком труслив, чтобы избавиться от жизни.</p><p class="p1">Сломлен, подумал Бран, сжимая нож. Так вот кем он стал теперь: Браном Сломанным.</p><p class="p1">— Я не хочу быть сломанным! — в ярости прошептал он мейстеру Лювину, который сидел справа от него. — Я хочу быть рыцарем…</p><p class="p1">— Есть люди, которые называют братьев моего ордена рыцарями ума, — проговорил Лювин. — Ты, Бран, обнаруживаешь невероятные способности, когда берешься за учебу. Тебе еще не приходило в голову подумать о цепи мейстера? Нет пределов тому, что ты сможешь узнать.</p><p class="p1">— Я хочу научиться магии, — сказал ему Бран. — Ворона обещала, что я сумею летать.</p><p class="p1">Мейстер Лювин вздохнул.</p><p class="p1">— Я могу обучить тебя истории, знахарскому делу, травам. Еще — речи воронов и тому, как построить замок и как в море вести по звездам корабль. Я могу научить тебя измерять ночи и дни, научить определять времена года. А в Цитадели Старгорода тебя обучат в десять раз большему. Но, Бран, ни один человек не способен научить тебя магии.</p><p class="p1">— Дети могут, — сказал Бран. — Дети Леса. — Имя ушедшего народа напомнило ему об обещании, данном Оше в богороще, и он передал Лювину ее слова.</p><p class="p1">Мейстер выслушал вежливо.</p><p class="p1">— Твоя одичалая способна поучить басням старуху Нэн, — сказал он, когда Бран окончил. — Я могу поговорить с ней, если ты хочешь, но лучше, чтобы ты не смущал своего брата этими глупостями. У него хватает дел без всяких гигантов и мертвяков в лесу. Подумай, Бран, ведь это Ланнистеры захватили твоего лорда-отца, а не Дети Леса. — Он ласково положил руку на плечо мальчика. — А о моих словах подумай, дитя.</p><p class="p1">И через два дня, едва кровавый рассвет выполз на продутое ветром небо, Бран сидел на спине Плясуньи во дворе под надвратной башней и прощался со своим братом.</p><p class="p1">— Теперь ты — лорд Винтерфелла, — сказал ему Робб. Брат сидел на лохматом сером скакуне, на седле щит: дерево, окованное железом, чередующиеся белые и серые полосы, а на них — оскаленная пасть лютоволка. Робб был облачен в серую кольчугу поверх выбеленной кожи; меч и кинжал на поясе, подбитый мехом плащ на плечах. — Ты займешь мое место, как я занял место отца, пока мы не вернемся домой.</p><p class="p1">— Знаю, — ответил Бран несчастным голосом. Он никогда еще не чувствовал себя таким маленьким, одиноким, испуганным. Он не знал, как это — быть лордом.</p><p class="p1">— Слушайся советов мейстера Лювина и заботься о Риконе. Скажи ему, что я скоро вернусь — как только закончатся сражения.</p><p class="p1">Рикон отказался спуститься. Возмущенный, заплаканный, он засел в своей палате.</p><p class="p1">— Нет! — завопил он, когда Бран спросил, не хочет ли он попрощаться с Роббом. — Никакого прощания не будет!</p><p class="p1">— Я сказал ему, — объяснил Бран. — А он ответил, что никто никогда не возвращается.</p><p class="p1">— Рикон не может навсегда остаться младенцем. Он — Старк, и ему уже скоро четыре года. — Робб вздохнул. — Ладно, мать скоро вернется. А я возвращусь с отцом, обещаю тебе!</p><p class="p1">Брат развернул своего коня и пустил его рысью. Серый Ветер бежал возле коня, высокий и быстрый. Халлес Моллен выехал перед ними обоими из ворот с трепещущим белым знаменем дома Старков на высоком древке из серого клена. Теон Грейджой и Большой Джон заняли места по обе стороны Робба. Рыцари последовали за ними двойной цепочкой, увенчанные сталью копья поблескивали на солнце.</p><p class="p1">Несчастный Бран вспомнил слова Оши. «Робб направляется не в ту сторону…» Какое-то мгновение он хотел поскакать следом за братом и выкрикнуть вслед предупреждение, но Робб уже исчез под решеткой, и возможность исчезла.</p><p class="p1">За стенами замка множеством глоток взревела пехота, вместе с горожанами приветствовавшая выехавшего Робба. Бран знал это. Они встречали лорда Старка Винтерфеллского; брат скакал на великом коне, и плащ его трепетал на ветру, а Серый Ветер несся рядом. «Меня никогда не будут так приветствовать», — понял Бран с тупой болью. Быть может, ему и суждено быть владыкой Винтерфелла в отсутствие отца и брата, но он навсегда останется Браном Сломанным. Он даже не в силах самостоятельно спуститься с коня.</p><p class="p1">Когда далекие крики постепенно стихли и двор наконец опустел, Винтерфелл показался Брану заброшенным и мертвым. Он поглядел на оставшихся с ним: женщин, детей, стариков… и Ходора. Огромный конюх озирался потерянно и испуганно.</p><p class="p1">— Ходор? — повторял он печально.</p><p class="p1">— Ходор, — согласился Бран, гадая, что это значит.</p></span>
