<p class="p">Кейтилин</p>
</div><p class="p1">Казалось, прошла тысяча лет с тех пор, как Кейтилин Старк вышла с младенцем-сыном из ворот Риверрана и, переправившись через Камнегонку в небольшой лодочке, начала свое путешествие на север — к далекому Винтерфеллу. Она снова переправлялась через Камнегонку, только на мальчике теперь была кольчуга и панцирь вместо распашонок с пеленками.</p><p class="p1">Робб сидел на носу рядом с Серым Ветром, рука его покоилась на голове лютоволка, гребцы навалились на весла. С ним был Теон Грейджой. Дядя Кейтилин Бринден следовал за ними во второй лодке, рядом с Большим Джоном и лордом Карстарком.</p><p class="p1">Кейтилин заняла место на корме. Камнегонка несла лодку вниз, бурное течение увлекало их к высокой Колесной башне. Плеск воды и грохот водяного колеса напомнили ей о детстве, и на губах Кейтилин появилась скорбная улыбка. На сложенных из красного песчаника стенах замка воины и челядь выкрикивали их с Роббом имена, то и дело слышалось: «Да здравствует Винтерфелл!» Над каждым бастионом трепетало красно-синее знамя Талли с прыгающей серебряной форелью над волнами. Вдохновляющий вид не вселял в ее сердце восторга. Интересно, суждено ли ей снова обрадоваться? О, Нед, Нед…</p><p class="p1">Под Колесной башней они развернулись, прорезая кипящую воду. Люди навалились на весла. Широкая арка Водяных ворот выросла перед ними, и Кейтилин услышала скрип тяжелых цепей. Огромная железная решетка неторопливо поползла наверх. Приближаясь, Кейтилин заметила, что нижняя половина прутьев покрылась красной ржавчиной. С нижних шипов, оказавшихся буквально в дюйме над головой, капал бурый ил. Кейтилин разглядывала решетку и все пыталась определить, насколько глубоко успела проникнуть ржавчина, устоит ли теперь решетка против тарана, не следует ли поменять ее. Подобные мысли редко покидали ее в эти дни.</p><p class="p1">Оставив свет, они проплыли под аркой в стене, погрузившись в тень, и снова выехали на солнце. Здесь повсюду вокруг них большие и малые лодки были привязаны к вделанным в стены железным кольцам. На лестнице ее встретили гвардейцы отца и брат, сир Эдмар Талли, коренастый молодой человек с лохматой гривой желтых волос и медной бородой. Нагрудные пластины его панциря были помяты и поцарапаны в битве, сине-красный плащ запятнан кровью и сажей. Возле него стоял лорд Титос Блэквуд — не человек, а клинок с коротко подстриженными, цвета соли с перцем, усами и кривым носом. Его ярко-желтые доспехи покрывал причудливый узор из черных виноградных лоз, а плащ из перьев горного ворона был наброшен на тонкие плечи. Именно лорд Титос возглавил вылазку, освободившую ее брата из лагеря Ланнистеров.</p><p class="p1">— Помогите им, — приказал сир Эдмар. Трое его воинов спрыгнули с лестницы и, став по колено в воду, подтянули лодку к берегу длинными баграми. Когда Серый Ветер выскочил на берег, один из них вздрогнул, выронив багор, пошатнулся и уселся прямо в реку. Все расхохотались, упавшему оставалось только кротко ухмыльнуться. Теон Грейджой, перегнувшись, взял Кейтилин за талию и перенес ее на сухую ступеньку, вода лизала его сапоги.</p><p class="p1">Эдмар спустился по ступеням, чтобы обнять ее.</p><p class="p1">— Милая сестра, — послышался его хриплый голос. Синие глаза и рот его были созданы для улыбки, но теперь Эдмар не улыбался. Он показался ей усталым, даже измученным, еще не отошедшим после битвы и плена. Шея брата была перевязана. Кейтилин с пылом обняла его.</p><p class="p1">— Кет, твое горе — мое горе, — сказал он, когда они отодвинулись друг от друга. — Когда мы услышали о лорде Эддарде… Ланнистеры заплатят, клянусь тебе, ты будешь отомщена!</p><p class="p1">— Разве месть вернет Неда? — сказала она резко. Рана была слишком свежа для утешений; она не могла еще вспоминать об утрате. Нельзя. Она не вправе этого делать. Она должна быть сильной. — Но со всем этим потом. Я должна видеть отца.</p><p class="p1">— Он ожидает тебя в солярии, — сказал Эдмар.</p><p class="p1">— Лорд Хостер прикован к постели, миледи, — объяснил стюард отца. Когда же успел этот добрый человек настолько постареть, откуда взялась седина? — Он приказал мне немедленно доставить вас к нему.</p><p class="p1">— Я сам провожу ее. — Эдмар повел ее вверх по причальной лестнице, потом через нижний двор, где некогда Петир Бейлиш и Брандон Старк скрестили из-за нее мечи. Массивные, сложенные из песчаника стены крепости поднимались над ними. Входя в дверь, которую охраняли стражники с гребнями-рыбами на шлемах, она опасливо спросила:</p><p class="p1">— Ему очень плохо?</p><p class="p1">Эдмар посмотрел на нее с печалью.</p><p class="p1">— Ему недолго жить среди нас, так говорят мейстеры. Отца мучают боли, они не оставляют его.</p><p class="p1">Слепой гнев наполнял Кейтилин; гнев на весь мир, на брата Эдмара, на сестру Лизу, на Ланнистеров, мейстеров, наконец, на Неда и отца… на чудовищную несправедливость богов, решивших отобрать у нее сразу обоих.</p><p class="p1">— Надо было известить меня, — сказала она. — Ты должен был послать мне слово сразу, как только узнал об этом.</p><p class="p1">— Отец запретил. Он не хотел, чтобы наши враги проведали о его близкой смерти. Он опасался, что, когда повсюду война, Ланнистеры могут воспользоваться его слабостью.</p><p class="p1">— И напасть на Риверран, — жестко договорила за него Кейтилин. «Твоя работа, твоя, — шептал внутренний голос. — Если бы ты не схватила карлика…»</p><p class="p1">Они молча поднимались по винтовой лестнице. Как и сам Риверран, крепость была треугольной. Треугольным был и солярий лорда Хостера. Каменный балкон выдавался на восток кормой какого-то гигантского корабля. Отсюда владетель замка мог видеть стены и укрепления, а за ними простор, образовавшийся при слиянии вод. Кровать отца переставили на балкон.</p><p class="p1">— Он любит сидеть на солнышке и смотреть на реки, — объяснил Эдмар. — Отец, погляди, кого я привел. Кет пришла повидать тебя…</p><p class="p1">Хостер Талли всегда был внушительным мужчиной: рослым и широкоплечим в молодости, объемистым в зрелые годы. Теперь он словно съежился, плоть исчезла, оставив кости. Даже лицо его обтянула восковая кожа. Когда Кейтилин в последний раз видела отца, каштановые волосы и борода его едва подернулись сединой. Теперь они сделались белыми, словно снег.</p><p class="p1">Глаза отца открылись.</p><p class="p1">— Кошечка, — пробормотал он тонким и неровным, полным боли голосом. — Моя маленькая кошечка! — Дрожащая улыбка прикоснулась к его лицу, и он протянул руку. — Я ждал тебя…</p><p class="p1">— А теперь я оставлю вас, чтобы вы поговорили, — сказал брат, нежно поцеловав лорда-отца в лоб, прежде чем уйти.</p><p class="p1">Кейтилин преклонила колено и взяла руку отца. Большая ладонь сделалась теперь бесплотной, кости ходили свободно под кожей; все силы оставили его.</p><p class="p1">— Ты мог бы известить меня, — сказала она. — Послать всадника или ворона…</p><p class="p1">— Всадников перехватывают и допрашивают, — сказал он. — Воронов сбивают. — Судорога боли пронзила его, пальцы стиснули ее руку. — Крабы угнездились в моем животе… они щиплются, всегда щиплются, день и ночь. У них жуткие клещи, у этих крабов. Мейстер Виман делает мне сонное вино из макового молока. Я много сплю… но я хотел бодрствовать, когда ты придешь. Я уже боялся… когда Ланнистеры захватили твоего брата и вокруг стояли враги… я боялся, что уйду, не повидавшись с тобой… Я боялся…</p><p class="p1">— Я здесь, отец, — сказала она. — С Роббом, моим сыном. Он тоже хочет видеть тебя.</p><p class="p1">— С твоим сыном… — шепнул он, — помню, у него были мои глаза.</p><p class="p1">— Были и есть. А еще мы привели Джейме Ланнистера — закованным в железо. Риверран вновь свободен, отец!</p><p class="p1">Лорд Хостер улыбнулся:</p><p class="p1">— Я видел. Вчера ночью, когда это началось, я велел им… надо было посмотреть. Меня принесли в Надвратную башню, и я следил с крыши. Ах, это было прекрасно… огненным ручьем текли факелы, за рекой кричали… какие же это были приятные крики… когда эта их башня вспыхнула, боги, я готов был умереть; я был бы рад смерти, если бы только сперва смог увидеть вас, моих детей. Значит, это сделал твой мальчик? Твой Робб?</p><p class="p1">— Да, — проговорила Кейтилин с гордостью. — Это сделал Робб… и Бринден. Твой брат вернулся домой, милорд.</p><p class="p1">— Вот как. — Отец едва шептал. — Черная Рыба… вернулся назад? Из Долины?</p><p class="p1">— Да.</p><p class="p1">— А Лиза? — Холодный ветер шевельнул тонкие белые волосы лорда Хостера. — Боги милосердные, твоя сестра… она тоже здесь?</p><p class="p1">Отец казался ей столь полным надежд и ожиданий, жаль было разочаровывать его.</p><p class="p1">— Как ни жаль, нет.</p><p class="p1">— Ох. — Лорд Хостер сразу приуныл, и свет оставил его глаза. — А я так надеялся… Мне бы хотелось увидеть ее, прежде…</p><p class="p1">— Сейчас она вместе с сыном в Орлином Гнезде.</p><p class="p1">Лорд Хостер устало кивнул:</p><p class="p1">— Д-да, он теперь лорд Роберт, бедный Аррен ушел… помню… почему она не приехала вместе с тобой?</p><p class="p1">— Лиза боится, милорд, а в Орлином Гнезде она чувствует себя в безопасности. — Кейтилин поцеловала морщинистый лоб. — Робб ждет встречи с тобой, ты примешь его? А Бриндена?</p><p class="p1">— Твоего сына, — прошептал он, — да. Сына Кет… у него были мои глаза. Помню, когда он родился. Пусть приходит… да.</p><p class="p1">— А твой брат?</p><p class="p1">Отец ее поглядел в даль над реками.</p><p class="p1">— Черная Рыба… — сказал он. — Он еще не женат? Так и не взял в жены какую-нибудь девицу?</p><p class="p1">Даже на смертном одре, со скорбью подумала Кейтилин.</p><p class="p1">— Он по-прежнему не женат. Ты знаешь, отец, дядя Бринден никогда не сделает этого.</p><p class="p1">— Я же говорил ему… приказывал. Женись!.. Я ведь был его лордом. И я имел право подобрать ему пару. Хорошую пару. Из Редвинов. Старый дом, милая девушка, хорошенькая… с веснушками… Бетани, да. Бедная девочка, она все еще ждет! Да, все еще…</p><p class="p1">— Бетани Редвин вышла за лорда Рована много лет назад, — напомнила Кейтилин отцу. — Сейчас у нее уже трое детей.</p><p class="p1">— Даже так, — пробормотал лорд Хостер. — Даже так! Наплевать на эту девицу и Редвинов. Наплевать на меня. Его лорда, его брата… вот тебе и Черная Рыба. У меня есть другие предложения. Дочери есть у лорда Бракена и у Уолдера Фрея… он предлагал любую из трех… Так ты говоришь, он не женат? По-прежнему?</p><p class="p1">— По-прежнему, — подтвердила Кейтилин. — Тем не менее он с боем прошел множество лиг на обратном пути в Риверран. Если бы не помощь сира Бриндена, я бы сейчас не стояла перед тобой.</p><p class="p1">— Да, он всегда был воином, — хрипло проговорил отец. — Это он умеет, Рыцарь Ворот. Да. — Он откинулся назад и закрыл глаза в беспредельной усталости. — Пришли его, только потом. А сейчас я посплю. Я слишком хвор, чтобы сражаться с ним, так что Черная Рыба пусть придет после…</p><p class="p1">Кейтилин ласково поцеловала старика, пригладила его волосы и оставила лежащим в тени — над сливающимися внизу реками. Сир Хорстер заснул прежде, чем она оставила солярий.</p><p class="p1">Когда она спустилась во двор, сир Бринден Талли стоял у причальной лестницы в мокрых сапогах, занятый разговором с капитаном гвардии Риверрана. Он немедленно подошел к ней.</p><p class="p1">— Ну как он?..</p><p class="p1">— Умирает, — отвечала Кейтилин. — Как мы и боялись.</p><p class="p1">На морщинистом лице сира Бриндена проступила явная боль. Он провел пальцами по густой седеющей шевелюре.</p><p class="p1">— Так он примет меня?</p><p class="p1">Она кивнула:</p><p class="p1">— Сказал, что слишком хвор, чтобы сражаться.</p><p class="p1">Бринден Черная Рыба усмехнулся:</p><p class="p1">— Я слишком старый воин, чтобы поверить в это. Хостер будет зудеть об этой девице даже со своего погребального костра!</p><p class="p1">Кейтилин улыбнулась, зная, что дядя прав.</p><p class="p1">— Я не вижу Робба.</p><p class="p1">— По-моему, они с Грейджоем направились в чертог.</p><p class="p1">Теон Грейджой сидел на скамье в чертоге Риверрана; наслаждаясь пивом, он повествовал гвардейцам ее отца о побоище в Шепчущем Лесу.</p><p class="p1">— Некоторые попытались бежать, но мы перекрыли долину с обоих концов и выехали из тьмы с мечами и копьями. Наверное, Ланнистеры решили, что попали в засаду Иных, когда волк Робба оказался среди них. Я сам видел, как эта зверюга вырвала руку из плеча одному из них; а кони вообще просто обезумели от его запаха. Я даже не знаю, скольких человек…</p><p class="p1">— Теон, — перебила она. — Где я могу отыскать моего сына?</p><p class="p1">— Лорд Робб направился в богорощу, миледи.</p><p class="p1">«Так поступил бы и Нед. Он сын своего отца, так же как и мой. Не надо забывать об этом. О боги, Нед…»</p><p class="p1">Она обнаружила Робба под зеленым пологом листьев, окруженного высокими красностволами и великими старыми ильмами. Сын преклонял колено перед сердце-деревом — стройным чардревом, лицо на стволе которого было скорее скорбным, чем свирепым. Длинный меч перед ним был вонзен острием в землю, облаченные в перчатки руки сына сжимали рукоять меча. Вокруг него преклонили колена и остальные: Большой Джон Амбер, Рикард Карстарк, Мейдж Мормонт, Галбарт Гловер и прочие. Даже Титос Блэквуд находился среди них, огромный вороний плащ топорщился позади него. Они сохранили верность старым богам, подумала Кейтилин и спросила у себя, каким богам поклоняться теперь ей, но не смогла отыскать ответа.</p><p class="p1">Не дело прерывать их молитву. Боги должны получить свое… даже жестокие боги, отобравшие у нее Неда и лорда-отца. И Кейтилин принялась ждать. Ветер шевелился в высоких зеленых ветвях, справа высилась Колесная башня, наполовину заросшая плющом. Непрошеным потоком нахлынули воспоминания. Среди этих деревьев отец учил ее ездить верхом; вон с того ильма свалился Эдмар и сломал себе руку, а среди этих кустов вместе с Лизой они играли в поцелуи с Петиром.</p><p class="p1">Она не вспоминала об этом многие годы. Как молоды они были тогда; она была не старше Сансы, а Лиза даже младше Арьи, но все-таки старше Петира. Девочки менялись им, то серьезно, то хихикая. Воспоминание оказалось настолько ярким, что она едва ли не ощутила потные мальчишеские пальцы на своих плечах и мятный запах дыхания Петира. В богороще всегда росла мята, и Петир любил жевать ее. Он был смелый мальчишка и всегда попадал в неприятности.</p><p class="p1">— Он попытался засунуть мне в рот свой язык, — призналась потом Кейтилин своей сестре, когда они остались вдвоем.</p><p class="p1">— И мне тоже, — шепнула Лиза, застенчивая и задыхающаяся. — А мне понравилось!</p><p class="p1">Робб медленно поднялся на ноги, опустил меч в ножны, и Кейтилин подумала, случалось ли ее сыну целовать девушку в богороще. Наверняка! Она видела, как Джейни Пуль глядела на него влажным взглядом, и кое-кто из служанок, даже восемнадцатилетние… А теперь он побывал в битве, убивал своим мечом и, конечно же, узнал поцелуй. На глазах ее выступили слезы. Кейтилин сердито смахнула их.</p><p class="p1">— Мать, — проговорил Робб, заметив ее, — надо созвать совет. Нужно принять решение.</p><p class="p1">— Твой дед хотел бы видеть тебя, — сказала она. — Робб, он очень болен.</p><p class="p1">— Сир Эдмар сказал мне. Мне очень жаль, мать… и лорда Хостера и тебя. Но сперва мы должны обсудить дела. Пришли известия с юга. Ренли Баратеон заявил, что возлагает на себя корону брата.</p><p class="p1">— Ренли? — спросила удивленная Кейтилин. — А я-то думала, что это сделает лорд Станнис…</p><p class="p1">— Как и все мы, миледи, — ответил Галбарт Гловер.</p><p class="p1">Военный совет собрался в чертоге, четыре длинных стола на козлах расставили неровным квадратом. Лорд Хостер был слишком слаб, чтобы присутствовать, он спал на своем балконе и видел во сне солнце, встающее над реками его молодости. Эдмар занял высокий престол Талли, Бринден Черная Рыба был возле него, знаменосцы отца расположились справа и слева у обоих боковых столов. Слово о победе при Риверране достигло беглых лордов Трезубца, повернувших обратно. Вошел Карил Венс, ставший теперь лордом. Отец его погиб под Золотым Зубом. С ним был сир Марк Пайпер, они привели сына сира Реймена Дарри, парнишку не старше Брана. Лорд Джонос Бракен от руин Стоунхеджа, сердитый и грозный, он устроился подальше от Титоса Блэквуда — насколько это было возможно.</p><p class="p1">Северные лорды расположились напротив, вокруг Кейтилин и Робба, лицом к сиру Эдмару. Их было меньше. Большой Джон сидел у левой руки Робба, с ним рядом Теон Грейджой. Галбарт Гловер и леди Мормонт — справа от Кейтилин. Лорд Рикард Карстарк, исхудавший от горя, занял свое место движениями человека, видящего кошмарный сон; длинная борода его была непричесана и немыта. Двое сыновей его погибли в Шепчущем Лесу, и не было вестей от третьего, старшего, который возглавлял копейщиков Карстарка, выступивших против Тайвина Ланнистера у Зеленого Зубца.</p><p class="p1">Споры затянулись до ночи. Каждый лорд имел право сказать слово, и они говорили… кричали, ругались, рассуждали, улещивали, шутили, торговались, хлопали кружками о стол, угрожали, уходили и возвращались — мрачные или улыбающиеся. Кейтилин сидела и слушала.</p><p class="p1">Русе Болтон занял со своим потрепанным войском устье гати. Сир Хелман Олхарт и Уолдер Фрей удерживают Близнецы. Армия лорда Тайвина переправилась через Трезубец и направилась к Харренхоллу. Более того, в стране было два короля. Два короля и никакого согласия!</p><p class="p1">Многие из лордов-знаменосцев предлагали немедленно выступить к Харренхоллу, чтобы встретиться с лордом Тайвином и положить конец семени Ланнистеров раз и навсегда. Юный и горячий Марк Пайпер рекомендовал ударить на запад, на Бобровый утес. Но остальные советовали ждать.</p><p class="p1">— Риверран перерезал коммуникации войска Ланнистеров, — заметил Ясон Маллистер. — Надо выжидать, не позволяя подкреплениям и фуражирам достичь лорда Тайвина, мы укрепим свою оборону и дадим отдых усталым войскам.</p><p class="p1">Лорд Блэквуд не желал даже слушать об этом:</p><p class="p1">— Следует закончить дело, которое было начато в Шепчущем Лесу. Все на Харренхолл, пусть туда идет и Русе Болтон.</p><p class="p1">Как всегда против предложения Блэквуда выступал лорд Джонас, он предложил присягнуть королю Ренли и выступить на юг, чтобы соединиться с ним.</p><p class="p1">— Ренли не король, — сказал Робб. Сын ее впервые отверз уста. Подобно собственному отцу он умел слушать.</p><p class="p1">— Вы не можете присягнуть Джоффри, милорд, — проговорил Галбарт Гловер. — Он отправил на смерть вашего отца.</p><p class="p1">— Значит, он плохой человек, — отвечал Робб. — Но отсюда отнюдь не следует, что Ренли можно считать королем. Джоффри остается старшим, законнорожденным сыном Роберта, поэтому престол по праву принадлежит ему. Если он умрет, — а я постараюсь устроить это, — у него есть еще младший брат; Томмен наследует следом за Джоффри.</p><p class="p1">— Томмен такой же Ланнистер, — отрезал сир Пайпер.</p><p class="p1">— Как вам угодно, — отвечал без сомнения Робб. — Но если никто из них не может быть королем, как может стать им лорд Ренли? Он младший брат Роберта. Бран не вправе стать лордом Винтерфелла раньше меня. Ренли не быть королем перед лордом Станнисом.</p><p class="p1">Леди Мормонт согласилась:</p><p class="p1">— У лорда Станниса больше прав!</p><p class="p1">— Но Ренли коронован, — сказал Марк Пайпер. — Вышесад и Штормовой Предел поддерживают его претензии, и дорнийцы не будут тянуть с признанием. Если Винтерфелл и Риверран будут за него, он получит поддержку пяти из семи великих домов. Шести, если Аррены потрудятся шевельнуть пальцем! Шестеро против Скалы! Милорды, через год головы всех Ланнистеров будут торчать на пиках: и королевы, и мальчишки-короля, и лорда Тайвина, и Беса, и Цареубийцы, и сира Кивана, всех! Так будет, если мы присоединимся к королю Ренли. Что может предложить нам лорд Станнис, чтобы забыть об этом?</p><p class="p1">— Справедливость, — сказал Робб упрямо, и Кейтилин почудились в голосе сына знакомые отцовские нотки.</p><p class="p1">— Итак, ты считаешь, что мы должны присягнуть Станнису? — спросил Эдмар.</p><p class="p1">— Не знаю, — ответил Робб. — Я молился, чтобы боги указали мне путь, но они молчат. Ланнистеры убили моего отца, назвав его изменником; все мы знаем, что это ложь, но если Джоффри — законный король, изменниками оказываемся уже все мы.</p><p class="p1">— Мой лорд-отец посоветовал бы соблюдать осторожность. — Пожилой сир Стеврон улыбнулся во всю хорьковую мордочку Фреев. — Надо подождать, посмотреть, как два короля разыграют свою партию. Когда драка закончится, можно преклонить колено перед победителем или выступить против него — при желании. Раз Ренли вооружается, лорд Тайвин предложит нам перемирие… потом он хочет получить назад сына. Благородные лорды, позвольте мне съездить к нему в Харренхолл, обговорить условия и выкуп…</p><p class="p1">Голос его потонул в яростном басе.</p><p class="p1">— Трус! — грохотнул Большой Джон.</p><p class="p1">— Если мы предложим перемирие, Ланнистеры сочтут нас слабыми, — объявила леди Мормонт.</p><p class="p1">— К черту любой выкуп, мы не должны отдавать Цареубийцу, — выкрикнул Рикард Карстарк.</p><p class="p1">— Чем вас не устраивает мир? — спросила Кейтилин.</p><p class="p1">Лорды смотрели на нее, но она ощущала на себе только глаза Робба, его и только его.</p><p class="p1">— Миледи, они убили моего лорда-отца и вашего мужа, — мрачно сказал он. Достав длинный меч, он положил его перед собой, яркая сталь блеснула на грубом дереве. — Только он примирит меня с Ланнистерами.</p><p class="p1">Большой Джон прогрохотал одобрение, к нему присоединились и другие голоса, лорды с криками извлекали мечи и стучали кулаками по столу.</p><p class="p1">Кейтилин дождалась, пока они притихли.</p><p class="p1">— Милорды, — проговорила она, — лорд Эддард был вашим сюзереном, я разделяла его ложе и рожала ему детей. Неужели вы думаете, что я люблю его меньше, чем вы? — Голос ее дрогнул от горя, но Кейтилин глубоким вздохом успокоила себя. — Робб, если бы этот меч мог вернуть твоего отца назад, я бы не позволила тебе вложить его в ножны, пока Эддард Старк вновь не встал бы рядом со мной… Но Неда нет, и сотне Шепчущих Лесов ничего не переменить. Нед ушел, а с ним Дарин Хорнвуд, доблестные сыновья лорда Карстарка и многие другие добрые люди; никто из них не вернется к нам. Нужны ли нам новые смерти?</p><p class="p1">— Вы женщина, миледи, — глухо прогудел Большой Джон. — Женщины не разбираются в подобных вещах.</p><p class="p1">— Вы мягкий пол, — проговорил лорд Карстарк, и свежие морщины шевельнулись на его лице. — Муж нуждается в мести.</p><p class="p1">— Дайте мне Серсею Ланнистер, лорд Карстарк, и вы увидите, какими мягкими бывают женщины, — ответила Кейтилин. — Быть может, я не знаток тактики и стратегии, но у меня есть здравый смысл. Вы выступили на войну, когда армия Ланнистеров разоряла Речной край и Нед был узником, ложно обвиненным в предательстве. Мы хотели защитить себя и освободить моего мужа.</p><p class="p1">Одна цель достигнута, а другая теперь навсегда останется невыполненной. Я буду оплакивать Неда до конца моих дней, но сперва я должна подумать о живущих. Я хочу вернуть своих дочерей, которых захватила королева. Если мне придется отдать четверых Ланнистеров за двух Старков, я назову это выгодной сделкой и поблагодарю бога. Я хочу, чтобы ты, Робб, правил в Винтерфелле на престоле своего отца. Я хочу, чтобы ты жил, целовал девушку, вступил с ней в брак и родил сына. Я хочу положить конец этой войне. Я хочу вернуться домой, милорды, и оплакать моего мужа.</p><p class="p1">Все притихли, когда Кейтилин закончила.</p><p class="p1">— Мир, — проговорил ее дядя Бринден. — Мир — хорошая штука, миледи… но на каких условиях? Незачем вечером перековывать меч на орало, если утром тебе снова потребуется меч.</p><p class="p1">— За что погибли Торрхен и мой Эддард, если я вернусь в Кархолд только с их костями? — спросил Рикард Карстарк.</p><p class="p1">— Именно, — проговорил лорд Бракен. — Григор Клиган опустошил мои земли, перебил моих людей, превратил Стоунхедж в дымящиеся руины. Неужели я должен преклонять колено перед теми, кто послал его? За что мы сражались, если все станет так, как было прежде!</p><p class="p1">Лорд Блэквуд согласился с ним — к удивлению и разочарованию Кейтилин:</p><p class="p1">— Но если мы помиримся с королем Джоффри, то разве не изменим королю Ренли? Где мы окажемся, если олень победит льва?</p><p class="p1">— Что бы вы ни решили, я никогда не назову Ланнистера своим королем, — объявил Марк Пайпер.</p><p class="p1">— И я тоже! — вскричал маленький Дарри. — Никогда!</p><p class="p1">Тут вновь начались крики. Кейтилин чуть не впала в отчаяние. Она была так близка к успеху, они почти послушались ее… почти. Но такого момента больше не будет! Не будет мира, исцеления, безопасности. Она глядела на своего сына, следила за тем, как он выслушивает мнения лордов… хмурящегося, встревоженного, повенчанного со своей войной.</p><p class="p1">Он обещал жениться на дочери Уолдера Фрея. Но Кейтилин видела его истинную невесту: меч, лежавший на столе перед сыном.</p><p class="p1">Кейтилин вновь думала о своих девочках, не зная, увидит ли их снова, когда на ноги поднялся Большой Джон.</p><p class="p1">— Милорды! — рявкнул он, отголоски загуляли между балками. — Вот мое мнение об этих двух королях! — Он смачно плюнул. — Ренли Баратеон — ничто для меня. Станнис тоже. Почему они должны править мной и моими людьми с их цветочного сиденья в Вышесаде или Дорне? Что они знают о Стене, о Волчьем Лесе или о курганах Первых Людей? Даже боги их ложны. Пусть Иные поберут меня, я сыт Ланнистерами по горло. — Он потянулся рукой за плечо и обнажил свой колоссальный двуручный меч. — Почему мы не можем вновь править в своей стране? Мы уступили только драконам, а драконы теперь мертвы. — Он указал на Робба клинком. — Вот единственный король, перед которым я готов преклонить колено, милорды, — прогрохотал он. — Король Севера!</p><p class="p1">И лорд Амбер поклонился и положил свой меч к ногам ее сына.</p><p class="p1">— На таких условиях я согласен на мир, — присоединился к нему лорд Карстарк. — Пусть берут себе свой Красный замок и сидят на Железном троне. — Он извлек длинный меч из ножен. — За Короля Севера! — провозгласил Карстарк, опускаясь на колено возле Большого Джона.</p><p class="p1">Встала Мейдж Мормонт.</p><p class="p1">— За Короля Зимы! — крикнула она, опуская свою шипастую булаву возле мечей. Поднимались и речные лорды Блэквуды, Бракены и Маллистеры, которые никогда не подчинялись Винтерфеллу, но Кейтилин видела, как они встают, извлекают клинки, преклоняют колена и выкрикивают старые слова, которых не было слышно в стране более трех сотен лет… с той поры, как Эйегон-Дракон явился, чтобы слить Семь Королевств воедино… теперь они снова гремели в чертоге ее отца.</p><p class="p1">— За Короля Севера!</p><p class="p1">— За Короля Севера!</p><p class="p1">— ЗА КОРОЛЯ СЕВЕРА!</p></span>
