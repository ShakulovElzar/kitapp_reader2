<p class="p">Дейенерис</p>
</div><p class="p1">Когда битва закончилась, Дени пустила Серебрянку на покрытое мертвыми телами поле. Служанки и мужи кхаса следовали за ней, улыбаясь и перешучиваясь.</p><p class="p1">Копыта дотракийских коней взрыли землю и втоптали в нее рис и чечевицу, а аракхи и стрелы пожали свой страшный урожай, напоив ее кровью. Умирающие кони поднимали головы и ржали. Раненые стонали и молились. Джакка рхан — мужи милосердия — переходили от одного к другому, тяжелыми топорами лишая головы мертвых и умирающих. За ними следовали стайки маленьких девочек; выдергивая стрелы из трупов, они складывали их в свои корзины. За ними торопились псы, тощие и голодные; свирепая стая никогда не отставала от кхаласара.</p><p class="p1">Первыми погибли овцы. Похоже, их были тысячи, тушки уже почернели под покровом мух, каждая щетинилась стрелами. Это сделал наездник кхала Ого, Дени это знала. Ни один всадник из кхаласара Дрого не обнаружил бы глупости, расходуя стрелы на овец, когда нужно было еще убить пастухов.</p><p class="p1">Город горел, черные клубы дыма поднимались в жесткую синеву неба. Под разрушенными стенами из сушеной земли взад и вперед разъезжали наездники; размахивая длинными кнутами, они выгоняли уцелевших из дымящихся руин. Женщины и дети из кхаласара Ого шествовали с угрюмой гордостью, которой их не могли лишить даже поражение и неволя. Теперь они сделались рабами, но как будто бы не боялись этого. Иначе вели себя горожане. Дени жалела их, вспоминая свой прежний ужас. Матери с бледными помертвевшими лицами увлекали за собой за руки рыдающих детей. Мужчин было немного: деды, калеки, трусы.</p><p class="p1">Сир Джорах говорил, что люди этой страны называли себя лхазарянами, но дотракийцы звали их хаеш ракхи, народом ягнят. Прежде Дени могла бы принять их за дотракийцев: та же медная кожа, такой же миндалевидный разрез глаз. Теперь они казались ей чужаками — коренастые, плосколицые, с чересчур уж коротко подстриженными черными волосами. Они пасли овец и выращивали овощи; кхал Дрого говорил, что их место к югу от речной излучины. Трава дотракийского моря не предназначена для овец.</p><p class="p1">Дени видел, как один из мальчишек вырвался и бросился к реке. Всадник отрезал ему дорогу и заставил вернуться, за ним бросились другие. Ударяя кнутами, они гнали беглеца то туда, то сюда, за спиной мальчишки ехал дотракиец, хлеставший кнутом по ягодицам, пока бедра ребенка не побагровели от крови. Новый всадник бросил его на землю, обвив лодыжку кнутом. Наконец, когда мальчишка мог только ползти, они оставили свое развлечение, наградив жертву стрелой, посланной в спину.</p><p class="p1">Сир Джорах Мормонт встретил ее возле разбитых городских ворот. Темно-зеленый плащ прикрывал его панцирь. Перчатки, поножи и великий шлем отливали темно-серой сталью. Дотракийцы стали дразнить его трусом, когда он надевал доспехи, рыцарь отвечал оскорблениями; вспыхнула ссора, длинный меч столкнулся с аракхом, и самый недовольный из всадников пал на землю, истекая кровью.</p><p class="p1">Подъехав к ней, сир Джорах поднял забрало плосковерхового шлема.</p><p class="p1">— Ваш благородный муж ожидает вас в городе.</p><p class="p1">— С Дрого все в порядке?</p><p class="p1">— Несколько порезов, — ответил сир Джорах. — Ничего существенного. Он убил двух кхалов. Сперва кхала Ого, а потом его сына Фого, сделавшегося кхалом после гибели отца. Кровные срезали колокольчики с их кос, и теперь каждый шаг кхала Дрого сделался еще более громким.</p><p class="p1">Кхал Ого и его сын делили высокое седалище с ее благородным мужем на том именинном пиршестве, где Визерис добился короны, но это было в Вейес Дотрак, у подножия Матери гор, где все всадники были братьями и все ссоры были забыты. Здесь, в степи, отношения складывались иначе. Кхаласар Ого штурмовал город, когда кхал Дрого застал дотракийцев врасплох. Интересно, о чем подумали ягнячьи люди, заметив со своих потрескавшихся сырцовых стен пыль, поднятую копытами их коней? Быть может, несколько молодых глупцов и поверили, что боги, услышав молитвы отчаявшихся людей, послали им помощь.</p><p class="p1">По ту сторону дороги девушка, не старше Дени, закричала тоненьким голосом, когда всадник, бросив ее вниз лицом на гору поверженных трупов, вошел в ее тело. Другие всадники спускались с коней, занимали очередь. Такое вот избавление принес кхал Дрого народу ягнят.</p><p class="p1">«Я от крови дракона», — напомнила себе Дейенерис Таргариен отворачиваясь. Сжав губы и ожесточив свое сердце, она въехала в ворота.</p><p class="p1">— Большая часть кхаласара Ого бежала, — сказал ей сир Джорах. — Однако пленников взяли тысяч десять.</p><p class="p1">Рабов, подумала Дени. Кхал Дрого погонит их теперь вдоль реки к одному из городов на берегу залива Работорговцев. Ей хотелось заплакать, однако она напомнила себе, что должна быть сильной. Это война. Такой будет цена Железного трона.</p><p class="p1">— Я сказал кхалу, что ему нужно повернуть к Миширину, — сказал сир Джорах. — Там заплатят больше, чем он получит от странствующих работорговцев. Иллирио пишет, что в прошлом году Миширин посетил мор, и бордели платят двойную цену за здоровых молодых девиц, и тройную за мальчишек не старше десяти лет. Если дети выдержат дорогу, полученного за них золота может хватить, чтобы нанять нужные нам корабли и оплатить услуги матросов.</p><p class="p1">Ту девушку все еще насиловали, долгий рыдающий стон продолжался и продолжался. Дени, стиснув поводья в кулаке, повернула голову к Серебрянке.</p><p class="p1">— Пусть они остановятся, — приказала она сиру Джораху.</p><p class="p1">— Кхалиси? — В голосе рыцаря послышалось смущение.</p><p class="p1">— Вы слышали мои слова, — сказала она. — Остановите их. — Она обратилась к своему кхасу на отрывистом дотракийском. — Чхого, Куаро, помогите сиру Джораху. Я не хочу насилия.</p><p class="p1">Воины обменялись озадаченными взглядами.</p><p class="p1">Сир Джорах направил своего коня ближе к ней.</p><p class="p1">— Принцесса, — проговорил он, — у вас мягкое сердце, но вы не понимаете. Так было всегда. Эти мужи проливали кровь за кхала. Теперь они получают свою награду.</p><p class="p1">Девушка на этой стороне дороги все еще рыдала, высокий звонкий говор казался странным для ушей Дени. Первый дотракиец закончил с делом, и место его занял второй.</p><p class="p1">— Это ягнячья девица, — сказал Куаро на дотракийском. — Она ничто, кхалиси. Всадники делают ей честь. Все знают, что ягнячьи мужчины любят и овец.</p><p class="p1">— Все это знают, — подтвердила ее служанка Ирри.</p><p class="p1">— Все это знают, — подтвердил и Чхого со спины высокого серого жеребца, которого подарил ему Дрого. — Но если ее стоны терзают твои уши, кхалиси, Чхого положит перед тобой ее язык.</p><p class="p1">— Я не хочу, чтобы ей причинили вред, — сказала Дени. — Она будет моей. Делай, как я приказываю, или кхал Дрого захочет узнать, почему ты отказался исполнять.</p><p class="p1">— Ай, кхалиси, — ответил Чхого, ударив пятками в бока коня. Куаро и остальные последовали за ним под пение колокольчиков в их волосах.</p><p class="p1">— Ступайте с ними, — приказала она сиру Джораху.</p><p class="p1">— Как вам угодно. — Рыцарь с любопытством поглядел на Дени. — А знаете, вы действительно сестра своего брата.</p><p class="p1">— Визериса? — Она не поняла его.</p><p class="p1">— Нет, — ответил рыцарь. — Рейегара. — И галопом направился прочь.</p><p class="p1">Дени услышала крик Чхого. Насильники расхохотались. Один ответил оскорблением. Мелькнул аракх Чхого, и голова обидчика слетела с плеч. Смех превратился в проклятия, всадники потянулись к оружию, к этому времени и Куаро, и Агго, и Ракхаро уже были рядом. Она видела, как Агго показал через дорогу на нее, сидевшую на своей Серебрянке. Всадники поглядели на нее с холодом в черных глазах. Один сплюнул. Другие, недовольно бормоча, полезли на коней.</p><p class="p1">Все это время мужчина, оседлавший ягнячью девицу, продолжал свое дело: удовольствие явно не позволяло ему обратить внимание на происходящее вокруг. Сир Джорах спустился с коня и оторвал его от жертвы рукой в кольчужной перчатке. Дотракиец упал в пыль, вскочив с ножом в руке, и умер, получив в горло стрелу Агго. Мормонт поднял девицу с груды трупов, набросив на нее свой окровавленный плащ, и повел через дорогу к Дени.</p><p class="p1">Девица дрожала, широкие глаза недоуменно озирались, волосы ее были перепачканы кровью.</p><p class="p1">— Дореа, посмотри, не ранена ли она. Ты не похожа на наездницу, быть может, тебя она не испугается. Остальные — за мной. — Она послала Серебрянку в проломленные деревянные ворота.</p><p class="p1">Там, в городе, было еще хуже. Многие дома горели, и джакка рхан занимались своим мрачным делом, наполняя узкие извилистые улицы безголовыми трупами. Они проезжали мимо других сцен насилия. И каждый раз Дени останавливала коня, посылала кхас, чтобы люди ее прекратили это занятие, и забирала себе рабыню.</p><p class="p1">Одна из них, толстая плосконосая женщина лет сорока, неуверенно поблагодарила Дени на общем языке, однако остальные отвечали угрюмыми взглядами. Они боялись ее, со скорбью осознала Дени, боялись, что она приберегает их для другой участи.</p><p class="p1">— Ты не можешь взять всех себе, дитя, — сказал сир Джорах, когда они остановились в четвертый раз, чтобы воины ее кхаса могли присоединить новую рабыню.</p><p class="p1">— Я — кхалиси, наследница Семи Королевств, от крови дракона, — напомнила ему Дени. — И не тебе напоминать мне, что я могу делать.</p><p class="p1">На другой стороне города рухнул дом, вспыхнул огонь, поднялся столб дыма. Дени услышала далекие крики и вопли испуганных детей.</p><p class="p1">Кхала Дрого они обнаружили на площади перед квадратным храмом; над толстыми, лишенными окон стенами из сырцового кирпича набухала одутловатая маковка, похожая на огромную луковицу. Перед ней высилась груда отрубленных голов, уже поднявшаяся выше роста кхала. Одна из коротких стрел ягнячьих людей пронзила мякоть его плеча, кровь пятном краски покрывала левую сторону его груди. Трое кровных всадников были возле него.</p><p class="p1">Чхику помогла Дени спуститься; живот сделал ее неловкой. Она преклонила колено перед кхалом.</p><p class="p1">— Мое солнце и звезды ранен. — Аракх ударил широко, но не глубоко; левый сосок был срублен, и полоска окровавленной плоти свисала с груди кхала мокрой тряпкой.</p><p class="p1">— Эту царапину, луна моей жизни, нанес мне один из кровных наездников кхала Ого, — ответил кхал Дрого на общем языке. — Я убил его за это и Ого тоже. — Он повернул голову, колокольчики в косе мягко звякнули. — Ты слышишь: Ого и Фого, его кхалакку, который стал кхалом, перед тем как я убил его.</p><p class="p1">— Ни один муж не в силах устоять перед солнцем моей жизни, — проговорила Дени, — отцом жеребца, который покроет весь мир.</p><p class="p1">Подъехавший всадник выпрыгнул из седла. Он обратился к Хагго, поток гневных дотракийских слов тек слишком быстро, чтобы Дени могла понять. Громадный кровный всадник мрачно поглядел на нее, прежде чем повернулся к кхалу.</p><p class="p1">— Перед тобой Маго, который едет в кхасе ко Чхаго. Он говорит, что кхалиси забрала его добычу, ягнячью девицу, которую он мог по праву покрыть.</p><p class="p1">Лицо кхала Дрого оставалось спокойным и жестким, но черные глаза с любопытством обратились к Дени.</p><p class="p1">— Говори мне правду, луна моей жизни, — приказал он на дотракийском.</p><p class="p1">Дени рассказала мужу о своем поступке на его собственном языке так, чтобы кхал понял ее лучше, простыми и прямыми словами.</p><p class="p1">Выслушав, Дрого нахмурился:</p><p class="p1">— Так положено на войне. Эти женщины стали нашими рабынями, и они обязаны угождать нам.</p><p class="p1">— Мне было бы приятно, если бы они остались целы, — проговорила Дени, не зная, не дерзает ли она на слишком многое.</p><p class="p1">— Если твои воины поднимутся на этих женщин, пусть берут их себе в жены. Дай им место в кхаласаре, чтобы они рожали сыновей.</p><p class="p1">Квото всегда был самым жестоким среди кровных. Он и расхохотался:</p><p class="p1">— От овцы разве может родиться конь?</p><p class="p1">Что-то в его голосе напомнило ей о Визерисе. Дени повернулась к нему с гневом:</p><p class="p1">— Дракон ест и коней и овец.</p><p class="p1">Кхал Дрого улыбнулся.</p><p class="p1">— Видите, какой свирепой она становится! — сказал он. — Это мой сын, жеребец, который покроет весь мир, наполняет ее своим огнем. Скачи помедленней, Квото… если мать не испепелит тебя на этом самом месте, значит, сын ее втопчет тебя в грязь. А ты, Маго, придержи свой язык и найди себе другую овцу. Эти принадлежат моей кхалиси.</p><p class="p1">Он протянул руку к Дейенерис, но вздрогнул от боли и отвернул голову.</p><p class="p1">Дени чувствовала, как он страдает. Раны оказались куда серьезнее, чем говорил ей сир Джорах.</p><p class="p1">— А где целители? — спросила она. В кхаласаре они были двух разновидностей: бесплодные женщины и рабы-евнухи. Знахарки применяли мази и заклинания, евнухи действовали огнем, ножом и иглой. — Почему они не приглядели за кхалом?</p><p class="p1">— Кхал отослал безволосых прочь, кхалиси, — ответил ей старый Кохолло. Дени заметила, что кровный сам получил рану: глубокий порез зиял в его левом плече.</p><p class="p1">— Среди всадников много раненых, — проговорил кхал Дрого. — Пусть они первыми получат лечение. Эта стрела всего лишь комариный укус, а маленький порез превратится в новый шрам, которым я буду хвастать перед своим сыном.</p><p class="p1">Срезанная кожа открывала мышцы груди. Струйка крови стекала из раны, оставленной стрелой, пронзившей руку.</p><p class="p1">— Кхалу Дрого не положено ждать, — объявила Дени. — Чхого, разыщи евнухов и немедленно доставь сюда.</p><p class="p1">— Серебряная госпожа, — раздался из-за ее спины женский голос. — Я могу залечить раны Великого Наездника.</p><p class="p1">Дени повернула голову. Говорила одна из рабынь, которых она забрала себе: тяжелая плосконосая женщина, поблагодарившая ее.</p><p class="p1">— Кхал не нуждается в помощи жен, чьи мужья спят с овцами, — рявкнул Квото. — Агго, отрежь ей язык.</p><p class="p1">Агго ухватил ее за волосы и приложил нож к горлу.</p><p class="p1">Дени подняла руку:</p><p class="p1">— Нет, она моя. Пусть говорит.</p><p class="p1">Агго посмотрел на Квото и опустил нож.</p><p class="p1">— Я не хочу вам зла, свирепые наездники. — Женщина хорошо говорила по-дотракийски. Легкое одеяние ее некогда сшили из тончайшей шерсти, украсив богатой вышивкой, но теперь, разодранное, оно было покрыто грязью и кровью. Женщина прижимала оторванный верх к своим тяжелым грудям. — Я умею исцелять.</p><p class="p1">— Кто ты? — спросила ее Дени.</p><p class="p1">— Меня зовут Мирри Маз Дуур. Я божья жена из этого храма.</p><p class="p1">— Мейега, — пробормотал Хагго, крутя в пальцах аракх. Он мрачно озирался. Дени вспомнила это слово из жуткой истории, которую ей однажды ночью возле костра рассказала Чхику. Мейегами звали женщин, развлекавшихся с демонами и предававшихся самому черному волшебству; злых, преступных и бездушных тварей, в темноте ночи нападавших на людей, высасывая жизнь и силу из их тел.</p><p class="p1">— Нет, я целительница, — проговорила Мирри Маз Дуур.</p><p class="p1">— Целительница овец, — фыркнул Квото. — Кровь от моей крови, прошу тебя, убей эту мейегу и подожди безволосых.</p><p class="p1">Дени не обратила внимания на выпад кровного. Старая и такая домашняя с виду, толстуха не казалась ей мейегой.</p><p class="p1">— Где ты научилась целительному искусству, Мирри Маз Дуур?</p><p class="p1">— Моя мать была здесь божьей женой; она научила меня всем песням и заклинаниям, угодным Великому Пастырю, научила делать священные курения и мази из листа, корня и ягоды. А когда я была еще молодой и красивой, то сходила с караваном в Асшай, чтобы поучиться у их магов. В этом краю собираются корабли из многих земель, и я жила там, осваивая способы исцеления, знакомые дальним народам. Лунная певица из Джогос Нхая обучала меня родовспомогательным песням, женщина из вашего конного народа научила меня волшебству травы, зерна и коня, мейстер из Закатных земель вскрыл передо мной тело и объяснил мне все тайны, скрывающиеся под кожей.</p><p class="p1">Сир Джорах Мормонт переспросил:</p><p class="p1">— Мейстер?</p><p class="p1">— Он назвал себя Марвином, — ответила женщина на общем языке. — А прибыл из-за моря. Из Семи земель, сказал он, Закатных земель. Там, где люди выкованы из железа, а правят ими драконы. Он научил меня их речи.</p><p class="p1">— Мейстер в Асшае? — удивился сир Джорах. — Скажи мне, божья жена, что носил этот Марвин на шее?</p><p class="p1">— Цепь столь тугую, что она могла вот-вот задушить его, железный господин. Звенья ее были выкованы из многих металлов.</p><p class="p1">Рыцарь поглядел на Дени.</p><p class="p1">— Только человек, обученный в Цитадели Старгорода, имеет право носить подобную цепь, — сказал он, — такие люди многое знают об искусстве исцеления.</p><p class="p1">— Почему ты хочешь помочь моему кхалу?</p><p class="p1">— Нас учат тому, что все люди — единое стадо, — ответила Мирри Маз Дуур. — Великий Пастырь послал меня на землю лечить его ягнят, где бы они ни жили.</p><p class="p1">Квото больно ударил ее.</p><p class="p1">— Мы не овцы, мейега.</p><p class="p1">— Прекрати, — гневно сказала Дени. — Она моя. Я не хочу ей вреда.</p><p class="p1">Кхал Дрого буркнул:</p><p class="p1">— Эта стрела должна выйти из моего тела, Квото.</p><p class="p1">— Да, Великий Наездник, — наклонила голову Мирри Маз Дуур, ощупывая синяк на лице. — А твою грудь следует омыть и зашить, чтобы рана не воспалилась.</p><p class="p1">— Делай тогда, — приказал кхал Дрого.</p><p class="p1">— Великий Наездник, — сказала женщина, — инструменты мои и мази находятся внутри дома бога — там целительная сила сильнее.</p><p class="p1">— Я отнесу тебя, кровь от моей крови, — предложил Кхаго.</p><p class="p1">Кхал Дрого отмахнулся.</p><p class="p1">— Я не нуждаюсь в помощи мужчины, — сказал он голосом гордым и жестким, поднимаясь без всякой помощи. Свежая кровь хлынула из раны, оставленной на груди ударом аракха. Дени торопливо придвинулась к Дрого.</p><p class="p1">— Я не мужчина, — прошептала она, — поэтому ты можешь опереться на меня.</p><p class="p1">Дрого опустил тяжелую ладонь на ее плечо. Приняв на себя часть его веса, она направилась к огромному храму, построенному из сырцового кирпича. За ними следовали трое кровных всадников. Дени приказала сиру Джораху и воинам своего кхаса охранять вход и приглядеть, чтобы здание не подожгли, пока они находятся в нем.</p><p class="p1">Миновав несколько прихожих, они вступили в высокий центральный зал под куполом. Неяркий свет сочился из укрытых над головой окон. Несколько факелов дымили на стенах. Земляной пол прикрывали разбросанные овечьи шкуры.</p><p class="p1">— Сюда, — указала Мирри Маз Дуур на массивный алтарь. Каменные с синими прожилками бока его покрывали резные изображения пастухов со стадами. Кхал Дрого лег. Женщина бросила горстку сушеных листьев на жаровню, и палата наполнилась благоуханным дымом. — Лучше, если вы будете ждать снаружи, — сказала она.</p><p class="p1">— Мы кровь от его крови, — проговорил Кохолло. — И мы ждем здесь.</p><p class="p1">Квото шагнул к Мирри Маз Дуур.</p><p class="p1">— Знахарка, жена овечьего бога. Знай — повредишь кхалу, встретишь ту же участь. — Он извлек свой нож и показал ей клинок.</p><p class="p1">— Она не сделает ничего плохого. — Дени чувствовала, что может довериться этой простой плосконосой старухе, которую она — в конце концов — вырвала из жестких рук насильников.</p><p class="p1">— Если вы должны остаться, тогда помогите мне, — сказала знахарка кровным. — Великий Наездник слишком силен для меня. Держите его, пока я буду извлекать стрелу из его плоти.</p><p class="p1">Мирри Маз Дуур опустила руку, позволив платью открыть ее грудь, и принялась копаться в резном сундуке, извлекая из него флаконы, шкатулки, ножи и иголки. Подготовившись, она отломила зазубренный наконечник и вытащила древко, распевая что-то на певучем языке Лхазарина. А потом вскипятила на жаровне вино и облила им рану. Кхал Дрого ругался, но не пошевелился. Покрыв рану, оставленную стрелой, пластырем из влажных листьев, она занялась разрезом на груди, намазав его бледно-зеленой пастой, прежде чем вернуть полоску кожи на место. Лишь сомкнув зубы, кхал сумел подавить крик. Достав серебряную иголку и катушку шелковых ниток, божья жена начала сшивать плоть. Покончив с этим делом, она провела по шву красной мазью и, покрыв его листьями, обвязала грудь кхала куском овечьей шкуры.</p><p class="p1">— А теперь ты будешь произносить молитвы, которым я научу тебя, а овечья шкура пусть остается на месте. Тебя будет лихорадить, кожа будет чесаться, а когда исцеление совершится, останется огромный шрам.</p><p class="p1">Кхал Дрого сел, зазвенев колокольчиками.</p><p class="p1">— Я пою о моих шрамах, ягнячья женщина. — Кхал согнул руку и нахмурился.</p><p class="p1">— Не пей ни вина, ни макового молока, — предостерегла она. — Тебе будет больно, но тело твое должно быть сильным, чтобы одолеть ядовитых духов.</p><p class="p1">— Я кхал, — сказал Дрого. — Я плюю на боль и пью что хочу. Кохолло, принеси мой жилет. — Старик одел Кхала.</p><p class="p1">— Я слыхала, что ты знаешь повивальные песни, — обратилась Дени к уродливой лхазарянке.</p><p class="p1">— Я знаю все секреты кровавого ложа, серебряная госпожа, и ни разу не потеряла жизнь ребенка, — поклонилась Мирри Маз Дуур.</p><p class="p1">— Мое время близко, — сказала Дени. — Я бы хотела, чтобы ты приглядела за мной, когда начнутся роды, — если ты не против.</p><p class="p1">Кхал Дрого расхохотался:</p><p class="p1">— Луна моей жизни, рабыню не просят, ей приказывают. Она выполнит твой приказ. — Он соскочил с алтаря. — Пойдем, кровь моя. Жеребцы зовут, а здесь пепел. Пора ехать!</p><p class="p1">Хагго последовал за кхалом из храма, но Квото задержался, чтобы почтить Мирри Маз Дуур яростным взглядом.</p><p class="p1">— Запомни, мейега, от здоровья кхала зависит твое собственное здоровье.</p><p class="p1">— Как тебе угодно, наездник, — ответила ему женщина, собирая горшочки и флаконы. — Великий Пастырь охраняет свое стадо.</p></span>
