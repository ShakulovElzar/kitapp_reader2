<p class="p">Кейтилин</p>
</div><p class="p1">— Миледи, вам следовало бы покрыть голову, — сказал сир Родрик. Кони их шли на север. — Простудитесь.</p><p class="p1">— Это всего лишь вода, сир Родрик, — ответила Кейтилин.</p><p class="p1">Влажные волосы облепили ее лицо, прилипли ко лбу, она вполне понимала, насколько неопрятной кажется ныне, но это ее не смущало. Южный дождь — ласковый, теплый. Кейтилин нравилось прикосновение капель к лицу, мягкое, как поцелуй матери. Она словно бы вернулась в свое детство, в долгие серые дни Риверрана. Кейтилин вспомнила богорощу, поникшие ветви, тяжелые от воды, смех брата, гонявшегося за ней между грудами сырой листвы. Она вспомнила, как делала вместе с Лизой пирожки из грязи, почувствовала их приятную тяжесть, коричневую скользкую глину, выступавшую между пальцев. Хихикая, они подавали их Мизинцу, тот однажды даже наелся глины и прохворал целую неделю. Какими маленькими они тогда были!</p><p class="p1">Кейтилин почти забыла об этом. На севере дождь всегда был холодным и жестоким; иногда ночами он превращался в лед. Дождь этот мог напитать урожай, а мог и убить, и даже взрослые люди прятались от него. Под северным дождем маленькие девочки не играли.</p><p class="p1">— А я весь промок, — пожаловался сир Родрик. — До костей. — Лес плотно обступил их, ровный стук дождя по листве сопровождал негромкое чавканье, когда лошади высвобождали копыта из грязи. — Сегодня нам потребуется костер и горячая еда.</p><p class="p1">— У перекрестка есть постоялый двор, — сказала ему Кейтилин. В юности она нередко ночевала там, когда путешествовала с отцом. Лорд Хостер Талли в расцвете сил не знал отдыха: он всегда куда-нибудь да ездил. Кейтилин еще помнила содержательницу постоялого двора, толстуху по имени Маша Хедль, днем и ночью жевавшую кислолист и всегда находившую для девочки улыбку и сладкий пирог. Пироги ее сочились медом и были приятны на вкус, но тогда Кейтилин боялась этой улыбки, потому что жвачка навсегда окрасила зубы Маши в багровый цвет, превращая ее улыбку в кровавый ужас.</p><p class="p1">— Гостиница, — сказал сир Родрик печально. — Если бы… Но мы не сумеем остановиться там и остаться неизвестными, лучше отыскать небольшую крепость. — Он умолк, заслышав впереди на дороге звуки: плеск воды, звяканье металла, ржание коней. — Всадники, — предупредил сир Родрик, опуская руку на рукоять меча. Даже на Королевском тракте осторожность никому не вредила.</p><p class="p1">Звуки приближались из-за неторопливого изгиба дороги, и они наконец заметили встречных: колонну вооруженных мужчин, с шумом переправлявшуюся через раздувшийся ручей. Кейтилин остановилась, пропуская их. Знамя в руке первого из всадников намокло и висело тряпкой, но воины были облачены в индиговые плащи, и на их плечах летел серебряный орел Сигарда.</p><p class="p1">— Маллистеры, — шепнул сир Родрик, как будто она не знала. — Миледи, лучше опустите капюшон на голову. — Кейтилин не шевельнулась.</p><p class="p1">Лорд Ясон Маллистер ехал во главе своих рыцарей, сын Патрек около, а сквайры следовали за ними. Путь их лежал к Королевской Гавани, на турнир десницы, это было понятно. В течение последней недели путников на Королевском тракте было что мух. Рыцари и свободные всадники, певцы с арфами и барабанами, тяжелые фургоны, груженные хмелем, зерном, бочонками с медом; торговцы, ремесленники, шлюхи — все они направлялись на юг.</p><p class="p1">Кейтилин отважно поглядела на лорда Ясона. Последний раз она видела его на собственном брачном пиру, он обменивался шутками с ее дядей; Маллистеры были знаменосцами Талли, и он поднес новобрачной пышные дары. Каштановые волосы с тех пор успела сбрызнуть морская соль, и время убрало лишнее с его лица, и все же годы не умерили гордости лорда Ясона. Он ехал как человек, который ничего не страшится. Кейтилин позавидовала ему: ей пришлось научиться страху. Когда всадники подъехали, лорд Ясон коротко кивнул, но это был только жест — любезность знатного лорда к встреченным путникам. Узнавание ни на мгновение не промелькнуло в его свирепых глазах, а сын лорда даже не соизволил поглядеть на нее.</p><p class="p1">— Он не узнал вас, — удивился сир Родрик.</p><p class="p1">— Он увидел на обочине дороги пару забрызганных грязью путников, мокрых и усталых. Ему даже в голову не пришло, что здесь может оказаться дочь его сюзерена. По-моему, мы можем спокойно остановиться в гостинице, сир Родрик.</p><p class="p1">Уже почти стемнело, когда они добрались до постоялого двора, расположенного на перекрестке дорог к северу от великого слияния у Трезубца. Маша Хедль еще более растолстела и поседела; она до сих пор жевала свой кислолист и удостоила их лишь самым поверхностным взглядом, забыв сопроводить его кровавой улыбкой.</p><p class="p1">— Две комнаты наверху — это все, что у меня есть, — сказала она, не прекращая жевать. — Они под часовой башней, так что еду вы не пропустите, однако некоторые считают, что там слишком шумно, но я ничего не могу сделать. Гостиница набита битком, точнее, почти битком! Словом, вы ночуете или в этих комнатах, или на дороге…</p><p class="p1">Комнатушки, низкие и пыльные, узкие, словно пеналы, располагались наверху узкой лестницы.</p><p class="p1">— Оставьте сапоги здесь, — сказала Маша, получив от них деньги, — мальчишка почистит их. Я не хочу, чтобы вы таскали грязь по лестнице наверх. Кстати, про колокол: опоздавшие не едят. — Ни улыбки, ни слова о сладких пирожках.</p><p class="p1">Когда зазвонил колокол, звук его действительно оказался оглушающим. Переодевшись в сухое, Кейтилин сидела у окна и смотрела, как дождь струится по стеклу, мутному и полному пузырей; снаружи уже сгущался влажный сумрак. Кейтилин едва различала грязный перекресток двух великих дорог.</p><p class="p1">Перекресток дал им время подумать. На запад до Риверрана доехать легко. Отец всегда давал ей мудрый совет, когда он был более всего нужен ей, и она хотела поговорить с ним о собирающейся буре. Если кому и нужно готовиться к войне, то в первую очередь Риверрану, близкому соседу Королевской Гавани, на владения которого с запада бросал тень своего могущества Бобровый утес. Если бы отец чувствовал себя лучше, она бы рискнула, но Хостер Талли последние два года провел в постели, и Кейтилин не хотелось утруждать его.</p><p class="p1">Восточная дорога шла по диким местам и считалась еще более опасной; она поднималась через скалистые предгорья и густые леса к Лунным горам. Минуя перевалы и глубокие пропасти, она приводила к Долине Арренов и каменистым Перстам за ней. Высоко над Долиной неприступное Орлиное Гнездо тянулось своими башнями к небу. Там она найдет свою сестру… и, быть может, некоторые из ответов, необходимых Неду. Конечно, Лиза знает больше, чем осмелилась написать в письме. Возможно, у нее есть те самые доказательства, которые нужны Неду, чтобы погубить дом Ланнистеров, а если дело дойдет до войны, им потребуются Аррены и восточные лорды, служащие им.</p><p class="p1">Однако горная дорога опасна. На перевалах водятся сумеречные коты, нередки обвалы, а кланы горцев, не соблюдая законов, спускались с высот, грабили и убивали, исчезая, как растаявший снег, когда Долина высылала рыцарей. Даже Джон Аррен — а Орлиное Гнездо еще не знало более великого господина — всегда путешествовал через горы с сильным отрядом. Кейтилин же могла положиться только на одного пожилого рыцаря, вооруженного в основном своей верностью.</p><p class="p1">Нет, решила она, Риверрану и Орлиному Гнезду придется подождать. Ее дорога лежит на север, в Винтерфелл, где ждут сыновья и обязанности. Как только они благополучно минуют Перешеек, она может открыться любому из знаменосцев Неда и послать вперед гонцов с приказом выставить конный дозор на Королевский тракт.</p><p class="p1">Дождь скрывал от ее глаз поля за перекрестком. Но Кейтилин отчетливо видела эти места в своей памяти. Рыночная площадь находилась как раз напротив, в миле за ней располагалась деревня: с полсотни белых домиков вокруг невысокой каменной септы. Домиков должно было прибавиться, лето выдалось долгим и мирным… Далее на север от Трезубца Королевский тракт шел вдоль Зеленого Зубца. Через плодородные земли и пышные леса, мимо богатых городков, крепких твердынь и замков речных владетелей.</p><p class="p1">Кейтилин знала их всех. Блэквудов и Бракенов, вечных врагов, чьи ссоры постоянно приходилось улаживать ее отцу; леди Уэнт, последнюю представительницу рода, обитавшую вместе со своими призраками под сводами огромных залов Харренхолла; раздражительного лорда Фрея, пережившего семь жен и наполнившего свои два замка детьми, внуками, правнуками, бастардами и прабастардами. Все они были знаменосцами Талли и мечом принесли присягу Риверрану. Кейтилин гадала, хватит ли этого, если дело дойдет до войны. Отец ее был самым надежным человеком из всех, когда-либо живших на свете, и она не сомневалась в том, что он созовет знамена… но придут ли они? Дарри, Риджерсы, Мутоны тоже присягнули Риверрану, однако они сражались с Рейегаром Таргариеном возле Трезубца, а лорд Фрей вместе со своим войском явился туда, когда битва уже закончилась, предоставляя повод для некоторых сомнений в том, к кому из соперников намеревался он присоединиться. После битвы он торжественно клялся победителям в том, что намеревался стать на их сторону, но с тех пор отец именовал его покойным лордом Фреем. До войны дойти не должно, лихорадочно подумала Кейтилин. Ее нельзя допустить.</p><p class="p1">Сир Родрик зашел за ней как раз когда колокол перестал звонить.</p><p class="p1">— Надо поспешить, если вы хотите поужинать сегодня, миледи.</p><p class="p1">— Будет безопаснее, если мы не будем звать друг друга рыцарем и дамой до тех пор, пока не пересечем Перешеек, — сказала она. — Обычные путешественники привлекают меньше внимания. Назовемся, скажем, отцом и дочерью, отправившимися в путь по какому-то семейному делу.</p><p class="p1">— Как вам угодно, миледи, — согласился сир Родрик, осознав ошибку, только когда она расхохоталась. — Привычку одолеть трудно… дочь моя. — Он попытался потянуть за отсутствующие бакенбарды и вздохнул.</p><p class="p1">Кейтилин взяла его за руку.</p><p class="p1">— Пойдемте, отец, — сказала она. — Вот увидите, Маша Хедль кормит хорошо, только постарайтесь не хвалить ее, чтобы она так страшно не улыбалась.</p><p class="p1">Гостиная оказалась длинной, и в ней сквозило; в одном углу ее выстроились рядком огромные деревянные бочки, в другом располагался очаг. Слуга носился с ломтями мяса, Маша тем временем цедила пиво из кегов, привычно жуя кислолист.</p><p class="p1">Скамьи были полны. Горожане и фермеры мешались с самыми разнообразными путниками: перекресток дорог сводит вместе странных соседей — красильщиков с руками, окрашенными черной и пурпурной краской, рыбаков, пропахнувших рыбой… Бугрящийся мышцами молотобоец сидел возле старого септона, привыкшие к суровой жизни наемники обменивались новостями с мягкотелыми, расплывшимися купцами.</p><p class="p1">На постоялом дворе собралось больше вооруженных людей, чем хотелось бы Кейтилин. На одежде троих, что устроились возле очага, скакал жеребец Бракенов, с ними соседствовал большой отряд в синих стальных кольчугах и серебристых шлемах, знак на плече этих людей тоже был известен Кейтилин: двойные башни дома Фрея. Она попыталась приглядеться к лицам: все они были слишком молоды, чтобы знать ее. Когда она уехала на север, самый старший из них был, наверное, моложе, чем Бран.</p><p class="p1">Сир Родрик выбрал для нее укромное место на скамье возле кухни. Напротив них сидел молодой симпатичный юноша и держал на коленях деревянную арфу.</p><p class="p1">— Семь благословений вам, добрые люди, — сказал он, когда они сели. Перед ним на столе стояла пустая чаша для вина.</p><p class="p1">— И тебе того же, певец, — отвечала Кейтилин. Сир Родрик потребовал хлеба, мяса и пива тоном, не терпящим возражения. Певец, молодой человек лет восемнадцати, непринужденно посмотрел на них, спросил, куда они направляются, откуда приехали и с какими новостями. Забрасывая быстрыми как стрелы вопросами, он не дожидался ответа.</p><p class="p1">— Мы оставили Королевскую Гавань две недели назад, — ответила Кейтилин на самый безопасный из его вопросов.</p><p class="p1">— Туда-то я и направляюсь, — поведал юноша. Как она подозревала, он больше стремился рассказать собственную историю, чем выслушивать их. Певцы ничего не любят больше, чем звуки собственных голосов. — На турнир в честь десницы съедутся богатые лорды с толстыми кошельками. В последний раз я едва сумел увезти свое серебро… точнее, увез бы, если бы в тот день не поставил все на Цареубийцу.</p><p class="p1">— Боги неблагосклонны к игрокам, — сурово проговорил сир Родрик. Как северянин, он разделял взгляды Старков на турниры.</p><p class="p1">— Ко мне они действительно были неблагосклонны, — ответил певец. — Жестокие боги и рыцарь Цветов разорили меня.</p><p class="p1">— Вне сомнения, неудача послужила тебе уроком, — сказал сир Родрик.</p><p class="p1">— Безусловно. В этот раз я поставлю на сира Лораса.</p><p class="p1">Сир Родрик попытался потянуть себя за бакенбарды, которых, естественно, не оказалось на месте, но прежде, чем он успел сделать замечание, явился слуга. Он поставил перед ними поднос с хлебом, наполнил их тарелки ломтями жареного мяса, источавшими горячий сок. На другой тарелке высилась горка крошечных луковок, огненного перца и грибов. Сир Родрик с жадностью приступил к еде, мальчишка бросился за пивом.</p><p class="p1">— Меня зовут Мариллон, — проговорил певец, прикоснувшись пальцем к струне. — Вне сомнения, вы слышали мою игру?</p><p class="p1">Подобное утверждение заставило Кейтилин улыбнуться. На такой дальний север, каковым является Винтерфелл, странствующие певцы забредали нечасто, но она помнила эту породу по девичьим годам в Риверране.</p><p class="p1">— Боюсь, что нет, — улыбнулась она.</p><p class="p1">Певец извлек из арфы укоризненный аккорд.</p><p class="p1">— Вы много потеряли. А кто из певцов вам нравился больше всех остальных?</p><p class="p1">— Алия из Браавоса, — немедленно ответил сир Родрик.</p><p class="p1">— О, я пою куда лучше, чем этот старый скрипун, — сказал Мариллон. — Если у вас найдется серебряная монетка за песню, я охотно докажу вам свою правоту.</p><p class="p1">— Медяк или два у меня найдутся, но я скорее брошу их в колодец, чем буду слушать твой вой, — буркнул сир Родрик. Мнение его о певцах было общеизвестно; музыка вообще создана для девиц, и он не мог понять, почему здоровому парню приходит в голову возиться с арфой, когда ему лучше взяться за меч.</p><p class="p1">— Ваш дед — человек едкий, — обратился Мариллон к Кейтилин. — Я хотел почтить вас, воздать должное вашей красоте. Я и создан для того, чтобы петь перед королями и высокими лордами.</p><p class="p1">— Ну, это заметно, — сказала Кейтилин. — Лорд Талли любит песни, как я слыхала. Ты, вне сомнения, бывал в Риверране?</p><p class="p1">— Сотню раз, — непринужденно отвечал певец. — Там для меня держат наготове комнату, а молодой лорд относится ко мне, как к брату.</p><p class="p1">Кейтилин улыбнулась, представив, что сказал бы об этом Эдмар. Однажды какой-то певец утащил в степь девицу, которая нравилась брату, и с той поры Эдмар вообще возненавидел их породу.</p><p class="p1">— А как насчет Винтерфелла? — спросила она. — Ездил ли ты когда-нибудь на север?</p><p class="p1">— Зачем? — спросил Мариллон. — Там только метели и медвежьи шкуры, а Старки не разбираются в музыке, им бы только слушать вой волков.</p><p class="p1">Внезапно Кейтилин увидела, что в противоположном конце комнаты распахнулась дверь.</p><p class="p1">— Хозяйка, — послышался голос слуги. — Нам нужно разместить коней, милорд Ланнистер требует комнату и горячей воды.</p><p class="p1">— О боги, — проговорил сир Родрик, и Кейтилин стиснула его руку.</p><p class="p1">Маша Хедль уже кланялась и улыбалась, обнажая жуткие красные зубы.</p><p class="p1">— Простите, милорд, но гостиница полна до отказа, заняты все комнаты, простите.</p><p class="p1">Их четверо, заметила Кейтилин. Старик в черном одеянии Ночного Дозора, двое слуг… и он сам, маленький, но отважный.</p><p class="p1">— Мои люди переночуют у вас на конюшне, а что касается меня самого, то много места не займу, как можно видеть. — Карлик насмешливо ухмыльнулся. — Мне хватит жаркого огня в очаге и отсутствия блох в соломе…</p><p class="p1">Маша Хедль стояла возле него.</p><p class="p1">— Милорд, у нас все занято, турнир, ничего нельзя поделать…</p><p class="p1">Тирион Ланнистер извлек монету из кошелька, подбросил над головой, поймал, подбросил снова. Даже на том конце комнаты, где сидела Кейтилин, трудно было не заметить, что она золотая.</p><p class="p1">Вольный всадник в полинялом голубом плаще вскочил на ноги.</p><p class="p1">— Я приглашаю вас в свою комнату, милорд!</p><p class="p1">— Вот умный человек, — объявил Ланнистер, бросив монету через всю комнату. Вольный всадник подхватил ее в воздухе. — И какой сообразительный! — Карлик повернулся к Маше Хедль: — Надеюсь, вы дадите мне поесть?</p><p class="p1">— Все что угодно, милорд, все что угодно, — запела хозяйка. Чтоб ты подавился, подумала Кейтилин, представив себе Брана, задыхающегося, захлебывающегося собственной кровью.</p><p class="p1">Ланнистер поглядел на ближайший стол.</p><p class="p1">— Моим людям достаточно того, что вы подаете всем остальным. Двойную порцию каждому, как же иначе, мы — после тяжелой дороги. А мне подайте жареную птицу — цыпленка, утку, голубя, безразлично. И еще бутылку лучшего вина. Йорен, вы отужинаете со мной?</p><p class="p1">— Да, милорд, — поклонился черный брат.</p><p class="p1">Карлик пока еще не поглядел в дальний конец комнаты, и Кейтилин уже благодарила людные скамьи между ними, когда Мариллон внезапно вскочил на ноги.</p><p class="p1">— Милорд Ланнистер! — возопил он. — Я буду рад развлечь вас за едой. Позвольте мне спеть о великой победе вашего отца у Королевской Гавани.</p><p class="p1">— Ничто не может с такой надежностью погубить мой ужин, — сухо проговорил карлик. Разные глаза его коротко остановились на певце, отвернулись… и взгляд упал на Кейтилин. Он поглядел на нее, озадаченный. Она отвернулась, но слишком поздно. Карлик уже улыбался.</p><p class="p1">— Леди Старк, какое неожиданное удовольствие, — проговорил он. — К сожалению, я разминулся с вами в Винтерфелле.</p><p class="p1">Мариллон, открыв рот, уставился на него, смятение уступало место досаде; тем временем Кейтилин поднялась на ноги. Она услышала, как сир Родрик ругнулся. И чего этому уроду не сиделось на Стене, подумала она, зачем…</p><p class="p1">— Леди… Старк? — глупо проговорила Маша Хедль.</p><p class="p1">— В последний раз ночуя здесь, я звалась Кейтилин Талли, — сказала она хозяйке. Кейтилин услышала общий ропот, все взгляды устремились на нее. Она оглядела комнату, лица рыцарей и наемников и глубоко вздохнула, чтобы замедлить отчаянное биение сердца. Рискнуть ли? Но времени на раздумья не было, только мгновение, и она услышала, как звенит в ушах ее собственный голос. — Сир, действительно ли на вашем плаще вышита черная летучая мышь Харренхолла? — обратилась она к пожилому человеку, которого заметила только что.</p><p class="p1">Мужчина поднялся на ноги.</p><p class="p1">— Да, миледи.</p><p class="p1">— И леди Уэнт по-прежнему старинный и истинный друг моего отца, лорда Хостера Талли из Риверрана?</p><p class="p1">— Так, — ответил он.</p><p class="p1">Сир Родрик спокойно поднялся и извлек меч из ножен. Карлик, моргая, глядел на них, и в разноцветных глазах его отражалось непонимание.</p><p class="p1">— Красному скакуну всегда рады в Риверране, — сказала она троим сидящим у очага. — Отец мой числит Джонаса Бракена среди своих самых старых и верных защитников.</p><p class="p1">Трое воинов обменялись неуверенными взглядами.</p><p class="p1">— Наш лорд почтен вашим доверием, — не без колебаний ответил один из них.</p><p class="p1">— Завидую вашему отцу, у него такие прекрасные друзья, — вмешался Ланнистер, — но я не понимаю, чего вы хотите, леди Старк.</p><p class="p1">Не обращая внимания на него, она обратилась к отряду, облаченному в синее и серое. Люди эти находились в центре событий, их было более двадцати.</p><p class="p1">— Я вижу и ваш герб: двойные башни Фреев. Как поживает ваш добрый лорд, сиры?</p><p class="p1">Поднялся капитан.</p><p class="p1">— Лорд Уолдер прекрасно себя чувствует, миледи. В день своих девяностых именин он намеревается заключить новый брак и просит вашего лорда-отца почтить его свадьбу своим присутствием.</p><p class="p1">Тирион Ланнистер фыркнул. И тут Кейтилин поняла, что он в ее руках.</p><p class="p1">— Этот человек явился гостем в мой дом и замыслил там убийство моего сына, семилетнего мальчика! — объявила она всей комнате, указывая на Ланнистера. Сир Родрик стоял возле нее с мечом в руках. — Именем короля Роберта и волей добрых лордов, которым вы служите, я приказываю вам схватить его и помочь доставить преступника в Винтерфелл, где он будет ожидать королевского правосудия.</p><p class="p1">Кейтилин не сразу поняла, что более обрадовало ее: звук дюжины извлеченных мечей или выражение лица Тириона Ланнистера.</p></span>
