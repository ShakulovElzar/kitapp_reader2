<span id="id48"><div class="title2">
<p class="p">Эддард</p>
</div><p class="p1">Он шел через крипту под Винтерфеллом, как ходил тысячу раз до этого. Короли зимы следили за ним ледяными глазами, а лютоволки у их ног поворачивали огромные каменные головы и рычали. Он подошел к последней гробнице, где спал отец его, возле Брандона и Лианны.</p><p class="p1">— Обещай мне, — шепнуло изваяние Лианны. На нем была гирлянда из бледно-голубых роз, глаза сестры плакали кровью.</p><p class="p1">Эддард Старк вздрогнул, сердце его колотилось, простыни перепутались. В комнате было темно как в яме, кто-то барабанил в двери.</p><p class="p1">— Лорд Эддард, — позвал громкий голос.</p><p class="p1">— Мгновение. — Ничего не соображавший, нагой, он прохромал через темную палату. Когда он открыл дверь, то обнаружил там Томарда с занесенным кулаком и Кейна с тоненькой свечой в руке. Между ними стоял личный стюард короля.</p><p class="p1">Лицо его могло быть высеченным из камня, настолько мало оно показывало.</p><p class="p1">— Милорд десница, — проговорил стюард, — светлейший король требует вашего немедленного присутствия.</p><p class="p1">Итак, Роберт вернулся с охоты. Время закончилось.</p><p class="p1">— Мне потребуется несколько мгновений, чтобы привести себя в порядок. — Нед оставил человека ожидать снаружи.</p><p class="p1">Кейн помог ему одеться. Белая льняная рубаха и серый плащ, брюки, разрезанные вдоль заключенной в лубок ноги, знак должности и в последнюю очередь — пояс из тяжелых серебряных звеньев. Он спрятал валирийский кинжал на груди.</p><p class="p1">Кейн и Томард повели его через внутренний двор. В Красном замке было темно и тихо, луна невысоко висела над стенами — еще не созревшая, но стремящаяся к полноте. На стене расхаживал стражник в золотом плаще.</p><p class="p1">Королевские покои находились в твердыне Мейегора, массивной квадратной крепости, истинном сердце Красного замка, обнесенной стенами двенадцати футов толщиной и окруженной сухим рвом, усаженным железными шипами. Это был замок внутри замка. Сир Борос Блаунт охранял дальний конец моста, белая стальная броня казалась призрачной в лунном свете. Оказавшись внутри, Нед миновал еще двоих рыцарей Королевской гвардии. Сир Престон Гринфилд стоял у подножия ступеней, а сир Барристан Селми ожидал у дверей королевской опочивальни. Трое людей в белых плащах, подумал он, вспоминая, и странный холодок пробежал по его спине. Лицо сира Барристана было бледнее брони. Неду хватило лишь одного взгляда на него, чтобы понять, что случилось нечто ужасное. Королевский стюард отворил дверь.</p><p class="p1">— Лорд Эддард Старк, — объявил он.</p><p class="p1">— Введите его сюда, — проговорил странный глухой голос.</p><p class="p1">Пламя горело в двух очагах в каждом конце опочивальни, наполняя комнату мрачным кровавым огнем. Жара внутри удушала. Роберт лежал под пологом на постели. Около ложа его возвышался великий мейстер Пицель, лорд Ренли беспокойно расхаживал перед закрытыми окнами. Слуги сновали взад и вперед, подкладывая поленья в очаг, и кипятили вино. Серсея Ланнистер сидела на краю постели возле своего мужа. Волосы ее были взлохмачены, словно со сна, но в глазах королевы дремоты не было. Она следила за Недом, которому Томард и Кейн помогали пересечь комнату. Ему казалось, что он двигался очень медленно, словно бы во сне.</p><p class="p1">Король лежал в сапогах. Нед видел засохшую грязь и травинки, прилипшие к коже сапог, носками торчащих из-под прикрывавшего его одеяла. Зеленый дублет остался на полу, распоротый и брошенный, ткань покрывали засохшие кровавые пятна. В комнате пахло дымом, кровью и смертью.</p><p class="p1">— Нед, — шепнул король, увидев его. Лицо Роберта было белее молока. — Подойди… ближе.</p><p class="p1">Люди помогли Неду приблизиться. Он оперся рукой на столб балдахина. Одного только взгляда на Роберта было довольно, чтобы понять, как плохо королю.</p><p class="p1">— Что?.. — спросил он, и горло его перехватило.</p><p class="p1">— Вепрь. — Лорд Ренли оставался в охотничьем зеленом костюме, плащ его был запачкан кровью.</p><p class="p1">— Дьявол, — хрипел король. — Я сам виноват. Перебрал вина, проклятие, промахнулся!</p><p class="p1">— А где были все вы? — потребовал Нед ответа у лорда Ренли. — Где был сир Барристан и Королевская гвардия?</p><p class="p1">Рот лорда Ренли дернулся.</p><p class="p1">— Брат приказал нам отступить в сторону и не мешать ему брать вепря.</p><p class="p1">Эддард приподнял одеяло. Они сделали все, что могли, чтобы зашить рану, но этого было мало. Зверь был наверняка матерым. Он распорол живот короля снизу до груди своими клыками. Пропитанные вином повязки, которые накладывал великий мейстер Пицель, уже почернели от крови, от раны жутко разило. Желудок Неда перевернулся, он опустил одеяло.</p><p class="p1">— Воняет, — сказал Роберт, — смертью воняет, или ты думаешь, что я не понимаю этого? Ловко обошелся со мной это сукин сын! Но я… я расплатился с ним, Нед. — Улыбка короля была столь же жуткой, как его рана; зубы были в крови. — Я вогнал ему нож прямо в глаз. Спроси их, если не веришь!</p><p class="p1">— Истинно так, — пробормотал лорд Ренли, — мы привезли тушу с собой, как приказал мой брат.</p><p class="p1">— Для пира, — прошептал Роберт. — А теперь оставьте нас, все оставьте. Я должен поговорить с Недом.</p><p class="p1">— Роберт, милый мой господин… — начала Серсея.</p><p class="p1">— Я сказал, все уйдите, — бросил Роберт с тенью прежней свирепости. — Что в моих словах непонятного, женщина?</p><p class="p1">Серсея подобрала свои юбки и достоинство и направилась к двери, за ней последовали лорд Ренли и все остальные. Великий мейстер Пицель помедлил, трясущимися руками предлагая королю чашу густого белого настоя.</p><p class="p1">— Маковое молоко, светлейший государь. Выпейте, чтобы уменьшить боль.</p><p class="p1">Роберт отмахнулся тыльной стороной руки.</p><p class="p1">— Убери чашу. Скоро я отосплюсь, старый дурак. Убирайся.</p><p class="p1">С ужасом посмотрев на Неда, великий мейстер Пицель побрел вон из комнаты.</p><p class="p1">— Проклятие, Роберт, — проговорил Нед, когда они остались одни. Нога его пульсировала так, что он почти ослеп от боли. Или, быть может, это горе туманило его глаза. Он нагнулся к постели, к лицу друга. — Ну почему ты всегда был таким упрямым?</p><p class="p1">— Ах, мать-перемать, Нед, — проговорил хриплым голосом король. — Я убил его, и все тут. — Прядь спутанных волос прикрыла его глаза, он смахнул ее и поглядел на Неда. — Надо было бы и тебя тоже. Ну не можете дать человеку поохотиться в мире. Сир Робар отыскал меня… Снять голову с Григора? Ну и идея. Я не сказал Псу, пусть Серсея сама удивит его.</p><p class="p1">Смех короля превратился в ворчание, когда боль пронзила его.</p><p class="p1">— Боги милосердные, — пробормотал король в муке. — Девочка, Дейенерис, она всего лишь только ребенок… Вот поэтому… боги послали вепря… чтобы наказать меня… — Король закашлялся, отплевываясь кровью. — Я был не прав, я был не прав… она всего только девочка. Мизинец… Варис, Мизинец, даже мой брат… все они… но никто не воспротивился мне, кроме тебя, Нед. Только ты… — Он с усилием поднял руку. — Перо и бумага здесь, на столе. Пиши, что я приказываю.</p><p class="p1">Нед разгладил бумагу на колене, взял перо.</p><p class="p1">— Повинуюсь, светлейший государь.</p><p class="p1">— По слову и воле Роберта из дома Баратеонов, первого носителя этого имени, короля андалов и так далее… вставишь проклятые титулы, ты знаешь, как они звучат… Повелеваю Эддарду из дома Старков, лорду Винтерфелла и деснице короля, принять обязанности лорда-регента и протектора королевства после моей… после моей смерти… и править моим именем… до тех пор, пока сын мой Джоффри не достигнет нужного возраста.</p><p class="p1">«Роберт… Джоффри не твой сын», — хотел сказать Нед, но слова эти не шли. Лицо Роберта искажала слишком сильная мука. Он не мог ранить его еще сильнее. И, нагнув голову, лорд Старк принялся писать, но там, где король сказал «мой сын Джоффри», он написал «мой наследник». Ложь эта оставила на душе его грязный отпечаток. «Чего только не приходится совершать, да простят меня боги».</p><p class="p1">— Что еще я должен сказать?</p><p class="p1">— Скажи… все что нужно. Хранить и оборонять старых богов и новых, ты знаешь слова. Пиши все. Я подпишу. Передашь совету после моей смерти.</p><p class="p1">— Роберт, — проговорил Нед голосом, полным горя, — ты не должен умирать. Ну постарайся. Страна нуждается в тебе.</p><p class="p1">Роберт стиснул его руку.</p><p class="p1">— Ты… неумелый лжец, Нед Старк, — промолвил он, одолевая боль, — страна… страна знает… каким паршивым королем я был. Хуже Эйериса, да простят меня боги.</p><p class="p1">— Нет, — сказал Нед своему умирающему другу. — Зачем так говорить, светлейший государь! Тебя с Эйерисом даже сравнить нельзя!</p><p class="p1">Роберт умудрился улыбнуться.</p><p class="p1">— Ну теперь люди хотя бы скажут… что в последней воле… я не ошибся. Ты ведь не подведешь меня! Теперь править тебе. Ты ведь любишь это занятие еще меньше, чем я, но ты справишься, Нед. Написал?</p><p class="p1">— Да, светлейший государь. — Нед подал Роберту бумагу.</p><p class="p1">Король вслепую поставил подпись, оставив на бумаге кровавое пятно.</p><p class="p1">— Приложишь печать. А вепря съешьте на поминках, — скрежетнул Роберт, — с яблоком во рту и поджарьте до хруста. Съешьте ублюдка. Сделай так, Нед, хотя тебе-то кусок в глотку не полезет. Обещай мне, Нед!</p><p class="p1">— Обещаю. — И в памяти отозвался голос Лианны, те же слова: «Обещай мне, Нед!»</p><p class="p1">— Девочка, — сказал король. — Дейенерис. Пусть живет. Если ты можешь, если это… не слишком поздно… переговори с ними… с Варисом, Мизинцем, пусть они не убивают ее. Помоги моему сыну, Нед, сделай его… лучшим королем, чем был я. — Он дернулся. — Да смилуются боги над нами.</p><p class="p1">— Смилуются, мой друг, — обещал Нед. — Обязательно.</p><p class="p1">Король закрыл глаза и как будто расслабился.</p><p class="p1">— Был убит свиньей, — пробормотал он. — Можно бы и посмеяться, но слишком уж больно.</p><p class="p1">Неду не хотелось смеяться.</p><p class="p1">— Позвать всех назад?</p><p class="p1">Роберт слабо кивнул:</p><p class="p1">— Как хочешь. Боги, почему здесь так холодно?</p><p class="p1">Слуги торопливо вошли и принялись подкладывать дрова в огонь. Королева ушла, принеся этим какое-то облегчение. Если у нее остались хоть крохи ума, Серсея заберет детей и убежит с ними еще до рассвета, подумал Нед. Она и так задержалась здесь слишком долго.</p><p class="p1">Король Роберт определенно не горевал без жены. Он попросил своего брата Ренли и великого мейстера Пицеля стать свидетелями и приложил печать к горячему желтому воску, которым Нед капнул на грамоту.</p><p class="p1">— А теперь дайте мне что-нибудь от боли и позвольте умереть.</p><p class="p1">Великий мейстер Пицель поспешно смешал ему новую чашу макового молока. На этот раз король выпил все без остатка. Густую бороду усеяли белые капли, когда Роберт отбросил пустую чашу в сторону.</p><p class="p1">— Я усну?</p><p class="p1">Нед склонился над ним:</p><p class="p1">— Да, милорд.</p><p class="p1">— Отлично, — улыбнулся король. — Я передам Лианне твою любовь, Нед. Позаботься о моих детях.</p><p class="p1">Слова эти повернулись в животе Неда ударом ножа. На мгновение он потерялся. Он не мог заставить себя солгать. А затем вспомнил его бастардов… маленькую Барру у груди матери, Мию, оставшуюся в Долине, Джендри у наковальни и остальных.</p><p class="p1">— Я буду охранять твоих детей, как своих собственных, — медленно проговорил он.</p><p class="p1">Роберт кивнул и закрыл глаза. На глазах Неда старый друг осел на подушки, и маковое молоко смыло боль с его лица. Король погрузился в сон.</p><p class="p1">Тяжелые цепи негромко звякнули, когда великий мейстер Пицель подошел к Неду.</p><p class="p1">— Я сделал все, что было в моих силах, милорд, однако рана успела загнить. На дорогу ушло два дня, и я увидел его уже слишком поздно. Я могу лишь уменьшить страдания светлейшего государя, но одни только боги могут теперь исцелить его.</p><p class="p1">— Сколько ему осталось? — спросил Нед.</p><p class="p1">— По всем правилам он должен был уже скончаться. Я еще не видел, чтобы человек так яростно держался за жизнь.</p><p class="p1">— Мой брат всегда был могуч, — заметил лорд Ренли, — хотя, может быть, и не слишком мудр.</p><p class="p1">В обжигающей жаре опочивальни чело его увлажнил пот. Он мог показаться призраком Роберта — молодой и темноволосый красавец.</p><p class="p1">— Он убил вепря! Внутренности уже вываливались из его живота, но тем не менее он убил вепря. — В голосе его слышалось удивление.</p><p class="p1">— Роберт был не из тех, кто оставляет поле боя, пока враг стоит на ногах, — кивнул Нед.</p><p class="p1">Снаружи за дверью сир Барристан по-прежнему охранял вход в башню.</p><p class="p1">— Мейстер Пицель дал королю маковое молоко. Приглядите, чтобы никто не потревожил его без моего разрешения, — распорядился Нед.</p><p class="p1">— Как прикажете, милорд. — Сир Барристан, казалось, постарел еще более. — Я не сумел исполнить свою священную клятву.</p><p class="p1">— И самый верный рыцарь не смог бы защитить короля от него самого, — проговорил Нед. — Роберт любил охотиться на вепрей. При мне он взял их, наверное, тысячу.</p><p class="p1">Король не знал трепета, упирался в землю ногами, с огромным копьем в руке, притом нередко ругая зверя, бросавшегося на него, и ожидал — до самого последнего мгновения. И когда вепрь оказывался рядом, убивал несущегося зверя одним коротким и уверенным движением.</p><p class="p1">— Никто не знал, что именно этот вепрь принесет ему смерть.</p><p class="p1">— Вы добры ко мне, лорд Эддард.</p><p class="p1">— То же самое сказал и король. Он обвинил вино.</p><p class="p1">Седоволосый рыцарь устало кивнул.</p><p class="p1">— Когда мы выгнали вепря из логова, светлейший государь едва не сползал из седла, однако он приказал нам отступить.</p><p class="p1">— Интересно, сир Барристан, — негромко спросил Варис, — а кто дал королю это вино?</p><p class="p1">Нед не заметил приближения евнуха, но, обернувшись, увидел его. Черное бархатное одеяние Вариса мело по земле, лицо покрывал слой свежей пудры.</p><p class="p1">— Вино было из собственного бурдюка короля, — проговорил сир Барристан.</p><p class="p1">— Единственного бурдюка? Охота пробуждает жажду.</p><p class="p1">— Я не считал, сколько их было. Сквайр всегда приносил новый мех по требованию короля.</p><p class="p1">— Такой услужливый мальчик, — сказал Варис. — Старался, чтобы светлейший не ощущал жажды.</p><p class="p1">Во рту Неда сделалось горько. Он вспомнил двух светловолосых юнцов, которых Роберт посылал искать кузнеца, чтобы растянуть нагрудник. В тот вечер на пиру король всем рассказывал эту повесть и всякий раз трясся от хохота.</p><p class="p1">— Который из них?</p><p class="p1">— Старший, — ответил сир Барристан. — Лансель.</p><p class="p1">— Я отлично знаю юношу, — сказал Варис. — Преданный молодой человек. Сын сира Кивана Ланнистера, племянник лорда Тайвина и кузен королевы. Надеюсь, милый мальчик ни в чем не обвиняет себя. Дети в своей юной невинности настолько ранимы! Я это прекрасно помню…</p><p class="p1">Безусловно, Варис некогда был молодым. Впрочем, Нед сомневался, что он вообще когда-либо был невинным.</p><p class="p1">— Вы упомянули о детях. Роберт изменил свои намерения в отношении Дейенерис Таргариен. Какие бы распоряжения вы ни отдали, я хочу, чтобы их отменили. Немедленно.</p><p class="p1">— Увы, — отвечал Варис, — даже если я сделаю это немедленно, и то будет уже поздно. Птички, увы, уже улетели. Но я выполню все, что могу, милорд. Прошу вашего прощения. — Он поклонился и скользнул вниз по ступеням, негромко ступая по камням своими мягкими туфлями.</p><p class="p1">Кейн и Томард помогали Неду перейти мост, когда лорд Ренли выбежал из крепости Мейегора.</p><p class="p1">— Лорд Эддард, — окликнул он Неда. — Подождите мгновение, будьте любезны.</p><p class="p1">Нед остановился.</p><p class="p1">— Как вам угодно.</p><p class="p1">Ренли подошел к нему.</p><p class="p1">— Отошлите ваших людей.</p><p class="p1">Они остановились на середине моста, над сухим рвом. Лунный свет серебрил острия пик, усаживающих его дно.</p><p class="p1">Нед махнул. Томард и Кейн склонили головы и почтительно отступили. Сир Ренли с опаской поглядел на сира Престона, замершего в дальнем конце моста, и на сира Барристана в дверях позади них.</p><p class="p1">— Это письмо. — Он наклонился поближе. — Речь шла о регентстве? Мой брат назначил вас протектором?</p><p class="p1">Ренли не дожидался ответа.</p><p class="p1">— Милорд, в моей собственной гвардии тридцать человек, есть друзья среди рыцарей и лордов. Предоставьте мне час, и я отдам в ваши руки сотню мечей.</p><p class="p1">— И что я сделаю с сотней мечей, милорд?</p><p class="p1">— Вы нанесете удар! Немедленно, пока замок спит. — Ренли поглядел на сира Бороса и вновь понизил свой голос до настоятельного шепота. — Надо отделить Джоффри от матери и взять его. Протектор или нет, но человек, который владеет юным королем, владеет властью. Надо захватить Мирцеллу и Томмена. Если дети будут у нас, Серсея не посмеет сопротивляться. Совет подтвердит вашу власть лорда-протектора и отдаст Джоффри в вашу опеку.</p><p class="p1">Нед холодно поглядел на него.</p><p class="p1">— Роберт еще не умер, и боги могут пощадить его. А если нет, я передам совету его последние слова, и мы обдумаем вопрос о наследовании престола, однако я не буду бесчестить его последние часы на земле, проливая кровь в его палатах, извлекая испуганных детей из постелей.</p><p class="p1">Лорд Ренли отступил назад, напряженный как тетива.</p><p class="p1">— С каждым мгновением промедления Серсея получает лишнее время на подготовку. И когда Роберт умрет, его может не хватить… нам.</p><p class="p1">— Тогда следует молиться, чтобы Роберт не умер.</p><p class="p1">— На это шансы невелики, — отвечал Ренли.</p><p class="p1">— Иногда боги бывают милосердны.</p><p class="p1">— Боги, но не Ланнистеры. — Лорд Ренли повернулся и направился назад через ров к башне, где лежал его умирающий брат.</p><p class="p1">Вернувшись к себе в палаты, Нед ощутил усталость и боль в сердце, но о том, чтобы уснуть, не было даже речи. Тот, кто играет в престолы, либо побеждает, либо погибает, сказала ему Серсея Ланнистер в богороще. Нед подумал, не ошибся ли он, отказав предложению лорда Ренли. Он не любил подобных интриг, к тому же бесчестно угрожать детям, и все же… если Серсея решила сопротивляться, а не бежать, ему не хватит даже тех мечей, которые предложил Ренли.</p><p class="p1">— Мне нужен Мизинец, — сказал он Кейну. — Если он сейчас не у себя, возьмите столько людей, сколько потребуется, и обыщите все винные погребки и бордели в Королевской Гавани, но найдите его и доставьте ко мне до рассвета.</p><p class="p1">Кейн поклонился и направился прочь.</p><p class="p1">Нед обратился к Томарду:</p><p class="p1">— «Владычица ветра» отправляется с вечерним приливом. Ты выбрал свиту?</p><p class="p1">— Десять человек, старшим — Портер.</p><p class="p1">— Двадцать, старшим поедешь ты, — сказал Нед. Портер человек отважный, но недалекий. Девочек он мог доверить лишь человеку более надежному и разумному.</p><p class="p1">— Как вам угодно, милорд, — поклонился Том. — Не могу сказать, что мне будет жаль расстаться с этим местом. Я соскучился по жене.</p><p class="p1">— Вы пройдете мимо Драконьего Камня, когда повернете на север. Я хочу, чтобы вы передали письмо.</p><p class="p1">Том удивился.</p><p class="p1">— На Драконий Камень, милорд? — Островная крепость дома Таргариенов пользовалась мрачной репутацией.</p><p class="p1">— Велите капитану Кроссу поднять мой стяг, как только он завидит остров: там могут опасаться незваных гостей. Если капитан проявит нерешительность, предложите ему все, что он захочет. Я дам тебе письмо, передашь его в собственные руки лорда Станниса Баратеона. И никому более: ни управляющему, ни капитану его гвардии, ни его леди-жене, только самому лорду Станнису.</p><p class="p1">— Как вам угодно, милорд.</p><p class="p1">Когда Том оставил его, лорд Эддард Старк сел, не отводя глаз от огонька свечи, горевшей перед ним на столе, на мгновение позволив себе расслабиться. Ему захотелось спуститься в богорощу, преклонить колено перед сердце-деревом и помолиться за жизнь Роберта Баратеона, который был ему более чем братом. Пусть люди шепчут потом, что Эддард Старк предал своего короля, что лишил наследства его сыновей; ему осталось только надеяться, что боги не допустят этого и что Роберт все равно узнает правду в стране, что начинается по ту сторону могилы.</p><p class="p1">Нед вынул последнее письмо короля, свиток хрустящего белого пергамента, запечатанный золотым воском… несколько коротких слов и пятно крови. Сколь же невелика разница между победой и поражением, между жизнью и смертью!</p><p class="p1">Он извлек свежий листок бумаги и обмакнул перо в чернильницу. <em>«К его светлости Станнису из дома Баратеонов. Когда вы получите это письмо, ваш брат Роберт, король, правивший нами последние пятнадцать лет, будет мертв. Он был убит вепрем на охоте в Королевском лесу…»</em> Буквы, казалось, змеились и дергались на бумаге, и рука Неда остановилась. Лорд Тайвин и сир Джейме не из тех, кто принимает несчастья с кротостью, эти не побегут, они будут сопротивляться. Лорд Станнис вел себя осторожно после смерти Джона Аррена, но дело требовало, чтобы он немедленно явился в Королевскую Гавань со всей своей силой, прежде чем Ланнистеры выступят.</p><p class="p1">Нед старательно выбирал слова. Закончив, он подписал письмо — <em>«Лорд Эддард Старк, властитель Винтерфелла, десница короля и протектор государства»</em>. Промокнув бумагу, он дважды сложил ее и расплавил над свечой воск для печати.</p><p class="p1">Его регентство будет коротким, думал Нед, глядя на плавящийся воск. Новый король выберет собственного десницу. Он сможет вернуться домой. Мысль о Винтерфелле заставила его улыбнуться. Ему хотелось снова услышать смех Брана, отправиться на соколиную охоту вместе с Роббом, посмотреть на игры Рикона. Он хотел заснуть в своей собственной постели, обнимая леди Кейтилин.</p><p class="p1">Кейн вернулся, когда Нед оттиснул на воске лютоволка Старков. Вместе с Десмондом он привел Мизинца. Поблагодарив своих гвардейцев, Нед отослал их.</p><p class="p1">Лорд Петир был облачен в синюю тунику с пышными рукавами, серебристый плащ его был расшит пересмешниками.</p><p class="p1">— Предполагаю, я должен принести поздравления, — сказал он усаживаясь.</p><p class="p1">Нед нахмурился.</p><p class="p1">— Король лежит раненый, он близок к смерти.</p><p class="p1">— Я знаю, — отвечал Мизинец. — Но мне известно, что он назначил вас протектором государства.</p><p class="p1">Глаза Неда метнулись к письму короля, лежавшему на столе; печать была цела.</p><p class="p1">— А откуда вам это известно, милорд?</p><p class="p1">— Намекнул Варис, — сказал Мизинец, — да и вы только что подтвердили.</p><p class="p1">Рот Неда гневно дернулся.</p><p class="p1">— Проклятие Варису и его маленьким пташкам! — Кейтилин была права: человеку этому известно какое-то черное искусство. — Я не доверяю ему.</p><p class="p1">— Великолепно. Вы учитесь. — Мизинец наклонился вперед. — И все же бьюсь об заклад, что вы позвали меня ночью не для того, чтобы обсуждать порядочность евнуха.</p><p class="p1">— Нет, — согласился Нед. — Я знаю секрет, который погубил Джона Аррена. Роберт не оставит после себя истинного наследника. Джоффри и Томмен — бастарды Джейме Ланнистера, рожденные в инцесте с королевой.</p><p class="p1">Мизинец приподнял бровь.</p><p class="p1">— Потрясающая вещь, — проговорил он голосом абсолютно равнодушным. — И девочка тоже? Вне сомнения. Итак, когда король умрет…</p><p class="p1">— Трон должен по праву перейти к лорду Станнису, старшему из двух братьев Роберта.</p><p class="p1">Лорд Петир погладил свою остроконечную бородку, обдумывая вопрос.</p><p class="p1">— Похоже на то, если только…</p><p class="p1">— Что если только, милорд? Неопределенности быть не может. Станнис является настоящим наследником, и ничто не может отменить этого.</p><p class="p1">— Станнис не сумеет занять престол без вашей помощи. Ну а если вы наделены мудростью, то постараетесь, чтобы престол наследовал Джоффри.</p><p class="p1">Нед ответил ему каменным взглядом.</p><p class="p1">— Неужели у вас нет и лоскутка чести?</p><p class="p1">— О, лоскуток, конечно, найдется, — непринужденно улыбнулся Мизинец. — Выслушайте меня. Станнис не друг ни вам, ни мне. Даже братья едва способны переваривать его. Этот человек выкован из железа, жесткого и неподатливого. Он назначит нового десницу и новый совет, это уж вне сомнения. Уверен, что он только поблагодарит вас за то, что вы передали ему корону, но не станет испытывать к вам любви. К тому же его восшествие на престол означает войну. Станнис не сможет спокойно пребывать на троне, пока не погибнет Серсея со своими бастардами. Или вы думаете, лорд Тайвин будет невозмутимо смотреть, как насаживают на пику голову его собственной дочери? Бобровый утес поднимется, и не один. Роберт простил людей, служивших королю Эйерису, при условии, что они покорятся ему. Станнис не столь доверчив. Он не забыл осаду Штормового Предела! Все, кто воевал под знаменем дракона или поднялся с Беелоном Грейджоем, получат основания для страха. Усадите Станниса на Железный трон, и клянусь, страна немедленно обагрится кровью.</p><p class="p1">А теперь посмотрим на другую сторону монеты. Джоффри всего двенадцать, и Роберт передал регентство вам, милорд. Вы — десница короля и протектор государства. Власть принадлежит вам, лорд Старк. Вам нужно лишь протянуть руку и взять ее. Помиритесь с Ланнистерами, освободите Беса, обвенчайте Джоффри с вашей Сансой. Обвенчайте вашу младшую девочку с принцем Томменом, наследника — с Мирцеллой. Джоффри достигнет зрелости лишь через четыре года. К тому времени он будет видеть в вас второго отца, ну а если же нет… четыре года — это долгий срок, милорд. Достаточно долгий, чтобы управиться с лордом Станнисом, ну а потом, если Джоффри будет вызывать беспокойство, мы сможем открыть его маленький секрет и возвести на престол лорда Ренли.</p><p class="p1">— Мы? — спросил Нед.</p><p class="p1">Мизинец пожал плечами:</p><p class="p1">— Бремя власти лучше разделить с кем-нибудь еще. Уверяю вас, цена моя будет самой умеренной.</p><p class="p1">— Ваша цена велика, лорд Бейлиш, — ответил Нед ледяным голосом. — Вы предлагаете мне измену!</p><p class="p1">— Только если мы проиграем.</p><p class="p1">— Вы забыли кое о чем, — заметил Нед. — О Джоне Аррене… о Джори Касселе и об этом… — Он выложил кинжал на стол между ними. Драконья кость и валирийская сталь, грань между жизнью и смертью, между правдой и кривдой. — Они подослали человека, чтобы перерезать горло моему сыну, лорд Бейлиш.</p><p class="p1">Мизинец вздохнул:</p><p class="p1">— Увы, я забыл об этом. Прошу простить меня. На какое-то мгновение я забыл, что разговариваю со Старком. — Рот его дернулся. — Значит, будет Станнис и война?</p><p class="p1">— Выбора нет, наследник — Станнис.</p><p class="p1">— Не мне обсуждать решения лорда-протектора. Зачем я тогда потребовался вам? Безусловно, не ради мудрого совета.</p><p class="p1">— Я постараюсь по возможности забыть ваш… мудрый совет, — проговорил Нед с отвращением. — Я позвал вас, чтобы попросить о помощи, которую вы обещали Кейтилин. Настал опасный час для всех нас! Роберт назвал меня протектором, однако в глазах света Джоффри остается его сыном и наследником. У королевы есть дюжина рыцарей и сотня вооруженных людей, которые сделают то, что она прикажет… Их достаточно, чтобы справиться с остатками моей гвардии. Насколько я знаю, ее брат Джейме, возможно, уже скачет в Королевскую Гавань во главе войска Ланнистеров.</p><p class="p1">— А у вас нет армии. — Мизинец принялся играть с кинжалом на столе, медленно крутя его пальцем. — Лорд Ренли и Ланнистеры не испытывают особой любви друг к другу. Бронзовый Джон Ройс, сир Белон Свонн, сир Лорас, леди Танда, близнецы Редвины… у всех них есть свита рыцарей и наемные мечи при дворе.</p><p class="p1">— У Ренли тридцать человек в его личной гвардии, у остальных еще меньше. Этого недостаточно, даже если бы я мог быть уверен в их верности. Я должен рассчитывать на поддержку золотых плащей. Две тысячи мечей городской стражи способны защитить замок, город и королевский мир.</p><p class="p1">— Да, но что будет, если королева объявит одного короля, а десница другого, чей мир будет тогда защищать стража?</p><p class="p1">Лорд Петир резко крутнул кинжал пальцем. Оружие кружилось и кружилось, дергалось при каждом обороте. И когда наконец кинжал замер, острие его указывало на Мизинца.</p><p class="p1">— Ну что ж, вот и ответ, — сказал он улыбаясь. — Они пойдут за тем, кто заплатит больше. — Он откинулся назад и поглядел Неду прямо в лицо, в зеленых глазах светилась насмешка. — Старк, вы закованы в свою честь, словно в панцирь. Вы думаете, что она способна сохранить вам жизнь, но она только отягощает вас, мешает шевелиться. Поглядите на себя! Вы знаете, почему призвали меня сюда. Вы знаете, о чем хотите попросить меня. Вы знаете, что это нужно сделать… но это нечестно, и поэтому слова застревают в вашей гортани.</p><p class="p1">Шея Неда напряглась от напряжения. На миг он настолько разгневался, что заставил себя молчать.</p><p class="p1">Мизинец расхохотался.</p><p class="p1">— Мне бы следовало попросить вас произнести все вслух, однако это чрезмерно жестоко, поэтому не опасайтесь, мой добрый лорд. Ради той любви, которую я испытываю к Кейтилин, я отправлюсь к Яносу Слинту прямо сейчас и удостоверюсь, что городская стража поддержит вас. Хватит шести тысяч золотых: треть командиру, треть офицерам, треть людям. Мы могли бы купить их и за половину этой суммы, однако я не хочу рисковать. — С улыбкой он взял со стола кинжал и подал его Неду рукоятью вперед.</p></span>
