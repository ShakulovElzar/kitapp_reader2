<span id="id1"><div class="title2">
<p class="p">Пролог</p>
</div><p class="p1">— Надо бы поворачивать, — встревожился Гаред, как только лес вокруг них начал темнеть. — Одичалые мертвы.</p><p class="p1">— Неужели ты боишься покойников? — вопросил сир Уэймар Ройс с легким намеком на улыбку.</p><p class="p1">Гаред не попался на крючок. За свои пятьдесят лет он успел навидаться, как приходят и уходят эти господа.</p><p class="p1">— Мертвый мертв, — отвечал он. — С ним не о чем говорить.</p><p class="p1">— А они действительно мертвы? — спросил Ройс. — Какие доказательства есть у нас?</p><p class="p1">— Уилл видел их, — отвечал Гаред. — И если он говорит, что они мертвы, мне других доказательств не нужно.</p><p class="p1">Уилл знал, что его рано или поздно вовлекут в разговор, и хотел, чтобы это случилось по возможности позже.</p><p class="p1">— Мать моя говорила мне, что покойник не запоет, — сказал он.</p><p class="p1">— То же самое говорила моя няня, — отозвался Ройс. — Уилл, никогда не верь тому, что слышишь возле женской титьки. Есть вещи, которые можно узнать даже от мертвых. — Голос его слишком громко отдавался в сумрачном лесу.</p><p class="p1">— Нам предстоит долгая дорога, — напомнил Гаред. — Восемь дней, а быть может, и девять. И ночь уже близка.</p><p class="p1">Сир Уэймар Ройс поглядел на небо без всякого интереса.</p><p class="p1">— Ночь каждый день приходит примерно в это же время. Неужели тьма лишает тебя мужества, Гаред?</p><p class="p1">Уилл увидел, как напрягся рот Гареда, как сверкнул едва сдерживаемый гнев в глазах под толстым черным капюшоном плаща.</p><p class="p1">Сорок лет — юность и зрелость — провел Гаред в Ночном Дозоре, и свое прошлое он уважал. Однако здесь крылось нечто большее. Под раненой гордостью старшего Уилл угадывал нервное напряжение, опасно приближающееся к страху.</p><p class="p1">Уилл разделял это нелегкое чувство. На Стене он провел четыре года. И когда в первый раз отправился за нее, то сразу вспомнил все старые россказни и чрево его обратилось в воду. Потом, вспоминая первую вылазку, он смеялся. Сотня походов сделала его ветераном, и бесконечная мрачная чаща, которую южане зовут Зачарованным лесом, более не казалась ему ужасной.</p><p class="p1">Но не сегодня. Сегодняшний вечер сулил иное. В этой тьме таилось нечто, заставлявшее подниматься волосы на его затылке. Девять дней они ехали на север, потом на северо-запад и снова на север, все дальше от Стены, преследуя банду дикарей-налетчиков. Каждый день был хуже предшествовавшего ему. И нынешний стал наихудшим. С севера задувал холодный ветер, деревья шелестели, словно живые. Весь день Уиллу казалось, что за ним следит нечто холодное и непреклонное, совершенно не испытывающее к нему симпатии. Гаред ощущал то же самое. Уилл хотел одного — броситься во всю конскую прыть под защиту Стены, но подобными чувствами не делятся со своим командиром.</p><p class="p1">В особенности с таким командиром.</p><p class="p1">Сир Уэймар Ройс был самым молодым отпрыском древнего рода, одним из многочисленных наследников. Симпатичный юноша лет восемнадцати, сероглазый, изящный и стройный, как клинок. Восседая на спине своего рослого вороного боевого коня, рыцарь возвышался над Уиллом и Гаредом на их невысоких дорожных лошадках. Все на нем: черные кожаные сапоги, черные шерстяные штаны, черные перчатки из кротовых шкурок и тонко выделанная куртка из блестящих черных кольчужных колец, нашитых на стеганые слои черной шерсти и вареной кожи, — говорило о принадлежности к Ночному Дозору.</p><p class="p1">Сир Уэймар присягнул на верность братству менее полугода назад, и никто не мог сказать, что он не был подготовлен для такого занятия. Во всяком случае, если говорить о его гардеробе. Довершал одеяние плащ. Соболиный, толстый, черный и соблазнительно мягкий.</p><p class="p1">— Клянется, что сам убил всех зверьков, вот так вот, — показывал Гаред в казарме за вином. — Свернул им головенки наш могучий воитель.</p><p class="p1">Все дружно хохотали.</p><p class="p1">Трудно повиноваться человеку, которого осмеиваешь за выпивкой, думал Уилл, ежившийся на спине своей лошаденки. Гаред, должно быть, испытывал те же чувства.</p><p class="p1">— Мормонт приказал нам выследить их, и мы это сделали, — проговорил Гаред. — Одичалые мертвы. Более они не причинят хлопот. А нам предстоит тяжелая дорога. Мне не нравится погода. Если пойдет снег, на возвращение домой уйдет две недели, а ведь даже снегопад будет подарком. Вы когда-нибудь видели ледяную бурю, милорд?</p><p class="p1">Лорденыш как будто и не слышал его. Ройс изучал сгущающийся сумрак в этакой полурассеянности-полускуке. Уилл успел достаточно долго проездить с рыцарем и знал — лучше не докучать ему в подобном настроении.</p><p class="p1">— Опиши мне еще раз то, что ты видел, Уилл. Все подробности. Ничего не забудь.</p><p class="p1">Прежде чем поступить в Ночной Дозор, Уилл был охотником, точнее говоря, браконьером. Вольные всадники Маллистеров взяли его с кровью на руках в собственных лесах Маллистеров, над освежеванной тушей одного из оленей, принадлежавших Маллистерам; так что ему осталось или надеть черное, или расстаться с рукой. Никто не умел двигаться по лесу безмолвнее Уилла, и Черные Братья весьма скоро обнаружили этот дар.</p><p class="p1">— Их лагерь располагается в двух милях отсюда, за тем гребнем, возле ручья, — проговорил Уилл. — Я подобрался так близко, как только осмелился. Одичалых — восьмеро, есть и мужчины, и женщины. Я не видел там никаких детей. Они соорудили навес возле скалы. Теперь все засыпал снег, но я не заметил огня, хотя кострище было видно как на ладони. Никто не двигался, а ведь я долго следил за ними. Живому человеку не под силу пролежать так, не шевелясь.</p><p class="p1">— А ты видел кровь?</p><p class="p1">— Нет, — признал Уилл.</p><p class="p1">— А оружие?</p><p class="p1">— Несколько мечей и луков. У одного был топор, тяжелый такой, с двумя лезвиями… жестокое железо. Он лежал на земле возле этого человека, прямо у руки.</p><p class="p1">— А ты заметил положение тел?</p><p class="p1">Уилл пожал плечами:</p><p class="p1">— Один сидел возле скалы. Остальные были на земле, попадали, что ли.</p><p class="p1">— Или спали, — предположил Ройс.</p><p class="p1">— Упали, — настаивал Уилл. — Женщина влезла наверх железного дерева и пряталась среди ветвей. Дозорная. — Он тонко улыбнулся. — Я старался, чтобы она не увидела меня. Но когда подобрался ближе, то заметил, что и она не шевелится. — И против желания он поежился.</p><p class="p1">— Тебе холодно? — спросил Ройс.</p><p class="p1">— Слегка, — пробормотал Уилл. — Ветер, милорд.</p><p class="p1">Молодой рыцарь повернулся к седому оруженосцу. Побитые морозом листья с шелестом пролетели мимо, и конь Ройса беспокойно шевельнулся.</p><p class="p1">— Итак, какова, по-твоему, была причина смерти этих людей, Гаред? — непринужденно спросил сир Уэймар, поправляя длинный соболиный плащ.</p><p class="p1">— Холод, — отвечал Гаред с железной уверенностью. — Прошлой зимой я видел, как замерзают люди, видел и позапрошлой, когда был еще наполовину мальчишкой. Все говорят о снегах глубиной в сорок футов, о том, как ледяной ветер, воя, налетает с севера, но главным врагом является холод. Он добирается до тебя бесшумнее, чем Уилл, и сперва ты только поеживаешься и стучишь зубами, а потом топаешь ногами и мечтаешь о подогретом вине с пряностями и чудесном жарком очаге. Мороз жжет. Ничто не обжигает, как холод. Но лишь поначалу. А потом он проникает внутрь тела, наполняет тебя, пока у человека не остается сил сопротивляться. Легче просто сесть и уснуть. Говорят, что, замерзая, перед концом не чувствуешь никакой боли. Просто слабеешь и тихонько засыпаешь, все словно блекнет, а потом как будто проваливаешься в море теплого молока, в мир и покой.</p><p class="p1">— Экое красноречие, Гаред, — усмехнулся сир Уэймар. — Никогда не подозревал в тебе подобного дара.</p><p class="p1">— Холод проникал и в меня, молодой лорд. — Гаред откинул назад капюшон, давая сиру Уэймару возможность рассмотреть обрубки, оставшиеся на месте ушей. — Два уха, три пальца на ногах и мизинец на левой руке. Я еще легко отделался. Моего брата тогда нашли замерзшим и улыбающимся.</p><p class="p1">Сир Уэймар пожал плечами:</p><p class="p1">— Надо было одеться потеплее, Гаред.</p><p class="p1">Тот гневно глянул на юного лорда, шрамы на месте ушей, там, где мейстер Эйемон срезал обмороженный хрящ, налились кровью от гнева.</p><p class="p1">— Посмотрим, как согреет тебя одежда, когда придет зима. — Он натянул на голову капюшон и сгорбился на своей лошади, угрюмый и молчаливый.</p><p class="p1">— Если Гаред говорит, что было холодно… — начал Уилл.</p><p class="p1">— А ты был в карауле на прошлой неделе, Уилл?</p><p class="p1">— Да, милорд. — Ни одна неделя не проходила без того, чтобы ему не выпадало с дюжину этих паскудных караулов. Чего, собственно, Ройс хочет от него?</p><p class="p1">— И какой была Стена?</p><p class="p1">— Мокрой, — сказал Уилл хмурясь. Теперь он понял, чего добивается молодой лорд. — Они не могли замерзнуть. Ведь Стена подтаяла. Настоящего холода не было.</p><p class="p1">Ройс кивнул:</p><p class="p1">— Смышленый парень. На этой неделе несколько раз подмораживало, выпадал снег, но холодов, достаточно свирепых, чтобы убить восьмерых взрослых людей, не было. Напоминаю: одетых в меха и кожу, возле укрытия и костра. — Улыбка рыцаря сделалась самоуверенной. — Уилл, веди нас туда, я сам хочу увидеть этих мертвецов.</p><p class="p1">Ну что ж, делать нечего. Приказ отдан, надо повиноваться.</p><p class="p1">Уилл направился первым, его косматая невысокая лошадка внимательно выбирала путь через подлесок. Позапрошлой ночью выпал легкий снежок, и камни, корни и ямки прятались под его поверхностью, поджидая неосторожного и беспечного. Сир Уэймар Ройс следовал за ним, рослый вороной жеребец нетерпеливо фыркал. Боевой конь не годился для разведки, но попробуй это сказать его лордству. Гаред замыкал линию. Старый оруженосец что-то бурчал под нос.</p><p class="p1">Сумерки сгущались. Неласковое небо сперва приняло глубокий пурпурный оттенок, потом цвет старого синяка и, наконец, почернело. Начали выступать звезды. Над деревьями объявился и полумесяц. Уилл обрадовался свету.</p><p class="p1">— Можно бы и прибавить шагу, — заметил Ройс, когда луна поднялась повыше.</p><p class="p1">— Я не уверен, — отвечал Уилл. Страх заставил его забыть про вежливость. — Быть может, милорд хочет возглавить нас?</p><p class="p1">Сир Уэймар Ройс не потрудился ответить.</p><p class="p1">Где-то вдалеке в лесу завыл волк. Уилл завел свою лошадь под ствол, древний и корявый, и спешился.</p><p class="p1">— Почему ты остановился? — спросил сир Уэймар.</p><p class="p1">— Остаток пути лучше пройти пешком, милорд. Место как раз за гребнем.</p><p class="p1">Вглядываясь вдаль, Ройс помедлил, на мгновение остановившись в явной задумчивости. Холодный ветер прошелестел в деревьях, толстый меховой плащ рыцаря словно бы сам собой шевельнулся сзади.</p><p class="p1">— Здесь что-то неладно, — пробормотал Гаред.</p><p class="p1">Молодой рыцарь посмотрел на него с презрительной улыбкой:</p><p class="p1">— В самом деле?</p><p class="p1">— Неужели вы не ощущаете сами? — спросил Гаред. — Прислушайтесь к тьме.</p><p class="p1">Уилл чувствовал это. За все четыре года, проведенных в Ночном Дозоре, ему никогда не приводилось так пугаться. Что это такое?</p><p class="p1">— Дует ветер. Деревья шелестят. Волк воет. Какой звук лишает тебя мужества, Гаред? — Не дождавшись ответа, Ройс изящно выскользнул из седла. Он надежно привязал скакуна к низкому суку, чуть в стороне от остальных, и извлек из ножен длинный меч. На рукоятке блеснули самоцветы, лунный свет пробежал по сверкающей стали. Великолепное оружие, выкованное в замке, и не столь уж давно, если как следует приглядеться. Только вот едва ли им замахивались в гневе, решил Уилл.</p><p class="p1">— Здесь всюду деревья, — предостерег Уилл. — Меч помешает вам, милорд. Лучше возьмите нож.</p><p class="p1">— Если мне потребуются наставления, я попрошу их, — сказал молодой лорд. — Гаред, оставайся здесь. Охраняй коней.</p><p class="p1">Гаред спешился.</p><p class="p1">— Нам нужен огонь. Я разведу костер.</p><p class="p1">— Какой же ты дурак, старик! Если по этому лесу бродят враги, значит, в огне мы нуждаемся в самую последнюю очередь.</p><p class="p1">— Бывает, что врагов огонь удерживает в стороне, — проговорил Гаред. — Его боятся медведи и лютоволки… да и другие…</p><p class="p1">Рот сира Уэймара сложился в прямую линию:</p><p class="p1">— Никакого огня!</p><p class="p1">Капюшон Гареда прикрыл лицо, но, поворачиваясь к рыцарю, Уилл заметил в глазах старика жесткий блеск. На миг он испугался, что Гаред достанет свой меч… короткая уродливая штуковина, рукоятка изъедена по́том, лезвие притуплено долгим употреблением… Уилл не дал бы железного шиллинга за жизнь лорденыша, если бы Гаред извлек свой клинок из ножен.</p><p class="p1">Наконец Гаред поглядел вниз.</p><p class="p1">— Никакого огня, — пробормотал он едва слышным голосом.</p><p class="p1">Ройс принял это за подтверждение и отвернулся.</p><p class="p1">— Ступай, — сказал он Уиллу.</p><p class="p1">Уилл направился в чащу, потом вверх по склону к высокому гребню, где он обнаружил удобное место под страж-деревом. Тонкая корочка снега едва прикрывала грязь и влагу, ноги скользили — мешали камни и скрытые корни, — однако, поднимаясь, Уилл не произвел ни звука. За его спиной негромко позвякивал кольчугой лорденок, шелестели листья, раздавались негромкие ругательства, когда загребущие ветви цеплялись за длинный меч и за великолепный соболий плащ.</p><p class="p1">Огромное страж-дерево находилось прямо на гребне; как помнил Уилл, нижние ветви его поднимались от земли почти на фут. Уилл скользнул под дерево, лег на живот в снег и грязь, поглядел на пустую поляну внизу, и сердце его провалилось в пятки. Мгновение он не смел дохнуть. Луна освещала поляну, кострище, занесенный снегом навес, огромную скалу, маленький узкий полузамерзший ручеек. Все это осталось неизменным — как и несколько часов назад.</p><p class="p1">Но людей не было, все тела исчезли.</p><p class="p1">— Ах, боги! — услышал он позади себя голос. Меч рубанул по ветке, и сир Уэймар Ройс поднялся на гребень. Он остановился возле страж-дерева с мечом в руках, ветер раздувал плащ, все вокруг могли видеть благородный силуэт на фоне звездного неба.</p><p class="p1">— Немедленно вниз! — настоятельно шепнул Уилл. — Здесь что-то не так.</p><p class="p1">Ройс не шевельнулся. Он поглядел на пустую прогалину и расхохотался:</p><p class="p1">— Выходит, твои мертвецы куда-то перебрались.</p><p class="p1">Голос Уилла предал его. Он искал слова и не находил их. Немыслимо! Глаза его метались взад и вперед по покинутому стану и остановились на топоре. Огромный боевой топор с двумя лезвиями все еще лежал на прежнем месте. Ценное оружие…</p><p class="p1">— На ноги, Уилл, — приказал сир Уэймар. — Здесь никого нет. Я не хочу, чтобы ты прятался под кустом.</p><p class="p1">Уилл нерешительно поднял голову.</p><p class="p1">Сир Уэймар глядел на него с открытым неодобрением.</p><p class="p1">— Я не намереваюсь вернуться в Черный замок с признанием о неудаче моей первой вылазки. Мы найдем этих людей. — Он огляделся. — Лезь на дерево. И быстро. Ищи огонь.</p><p class="p1">Уилл молча отвернулся, спорить было бесполезно. Ветер менялся. Теперь порывы продували насквозь. Уилл подошел к дереву, высоко поднимавшему свои серо-зеленые ветви, и полез вверх. Скоро руки его запачкались смолой, и он почти потерялся среди иголок. Страх наполнил нутро Уилла комом непереваренной пищи. Прочитав молитву безымянным богам леса, он извлек свой кинжал из ножен и зажал в зубах, чтобы можно было держаться за дерево обеими руками. Вкус холодного железа во рту почему-то всегда успокаивал его.</p><p class="p1">Лорденыш внизу вдруг воскликнул:</p><p class="p1">— Кто идет?</p><p class="p1">Уилл услышал неуверенность в его голосе и замер, прислушиваясь и наблюдая.</p><p class="p1">Лес дал ответ: шелестели листья, в ледяном ложе бежал ручей, вдалеке кричала снежная сова.</p><p class="p1">Иные не издают звуков.</p><p class="p1">Уилл заметил движение уголком глаза. Бледные силуэты появились в лесу. Повернув голову, он увидел белую тень, скользнувшую во тьме. Тень исчезла. Ветки легко шевелились под ветром, скребли друг друга деревянными пальцами. Уилл открыл рот, чтобы выкрикнуть предупреждение, но слова как будто замерзли в его горле. Возможно, он ошибся, и это всего лишь птица или отражение, брошенное на снег прихотью лунного света. В конце концов, что он видел?</p><p class="p1">— Уилл, где ты? — поднял голову вверх сир Уэймар. — Ты заметил что-нибудь? — Зажав в руке меч, рыцарь медленно, с внезапным напряжением повернулся на месте. Значит, и он ощутил их. Ощутил, но не увидел. — Отвечай мне! Почему так холодно?</p><p class="p1">Было действительно холодно. Ежась, Уилл плотнее прижался к стволу, припав лицом к грубой коре. Сладко пахло смолой, прилипшей к щеке.</p><p class="p1">Из тьмы леса родилась тень и остановилась перед Ройсом. Высокая, тощая и твердая, как старые кости, и вместе с тем бледная, как молоко. Панцирь ее словно менял цвет при каждом движении. Он то становился белым, как свежевыпавший снег, то покрывался угольной тенью, то отливал серой зеленью деревьев. С каждым шагом новый узор пробегал по броне, словно лунный свет по воде.</p><p class="p1">Уилл услышал, как дыхание с долгим шипением вырвалось из груди сира Уэймара Ройса.</p><p class="p1">— Стой! — выкрикнул лорденыш, дав петуха как мальчишка. Забросив длинный соболий плащ за плечи, он освободил обе руки для боя и взял меч. Ветер утих, но сделалось еще холоднее.</p><p class="p1">Иной скользил вперед, бесшумно ступая; в руке существо держало длинный меч. Таких клинков Уилл никогда не видел. Ни один известный людям металл не мог бы пойти на это лезвие. Играя в лунном свете, меч казался прозрачной полоской тонкого хрусталя и почти исчезал, поворачиваясь плоскостью. Он горел призрачным голубым пламенем, и чутье поведало Уиллу, что более острого клинка ему еще не встречалось.</p><p class="p1">— Ну что ж, попляшем и согреемся, — пробормотал сир Уэймар и занес свой меч над головой. Руки его дрожали от тяжести оружия или, может быть, от холода. И все же в тот момент Уилл увидел в нем не прежнего мальчика, но мужа из Ночного Дозора.</p><p class="p1">Иной остановился, и Уилл заметил глаза существа: глубокая и густая нечеловеческая синева сверкала как лед. Они были обращены к длинному мечу, занесенному над головой, и лунный свет леденил металл. На миг Уилл потерял надежду.</p><p class="p1">Они безмолвно возникали из теней двойниками первого. Их было трое… четверо… пятеро… Сир Уэймар, должно быть, ощущал холод, который принесли Иные, но не видел их, даже не слышал. Уиллу следовало бы крикнуть. Но, выполняя свой долг, он лишь навлек бы на себя несомненную смерть. Трепеща, Уилл только теснее обнял дерево, сохраняя молчание.</p><p class="p1">Бледный меч холодом пронзил воздух.</p><p class="p1">Сир Уэймар встретил удар сталью. Клинки соприкоснулись не со звоном металла о металл: в воздухе проплыл тонкий стон животного, получившего смертельную рану. Ройс отразил и второй удар, и третий, а затем отступил на шаг. Последовал еще поток ударов, и он снова отступил.</p><p class="p1">Позади него, справа, слева, вокруг стояли терпеливые, безликие и безмолвные наблюдатели, текучие узоры на хрупкой броне делали их в лесу почти невидимыми. И все же они не пытались вмешаться.</p><p class="p1">Вновь и вновь встречались мечи. Уиллу захотелось зажать уши, только бы не слышать этот странный болезненный визг. Сир Уэймар теперь пыхтел от натуги, дыхание паром струилось в лунном свете. Его клинок побелел от мороза. Иной же плясал вокруг с бледным голубым пламенем в руках.</p><p class="p1">А потом удар Ройса чуть запоздал. Бледный меч прорезал его кольчугу на боку. Молодой лорд вскрикнул от боли. Кровь хлынула между колец. Она задымилась на холоде, красные как огонь капли падали на снег. Пальцы сира Уэймара зажали бок, на кротовой перчатке выступила кровь.</p><p class="p1">Иной что-то сказал: языка Уилл не знал, голос чужака трещал словно лед на зимнем озере, но в словах слышалась насмешка.</p><p class="p1">К сиру Уэймару вновь вернулась ярость.</p><p class="p1">— За короля Роберта! — закричал он и отчаянно бросился вперед, обеими руками занес покрытый изморозью меч и рубанул им сбоку, вложив в удар вес всего тела. Иной ответил небрежным ленивым движением.</p><p class="p1">Клинки соприкоснулись, и сталь разбилась.</p><p class="p1">С визгом, отозвавшимся в ночном лесу, длинный меч рассыпался на сотню хрупких иголок, дождем разлетевшихся вокруг. Ройс упал на колени, с криком прижимая руку к глазам. Кровь проступала между его пальцев.</p><p class="p1">Безмолвные наблюдатели разом шагнули вперед, словно получив какой-то сигнал. Мечи поднимались и падали в смертельном безмолвии. Началась хладнокровная бойня. Бледные клинки прорезали кольчугу, словно какой-то шелк. Уилл закрыл глаза. Голоса их и смех, колючий словно сосульки, раздавались где-то под ним.</p><p class="p1">Не скоро он накопил достаточно отваги, чтобы поглядеть вниз, даже когда гребень уже опустел.</p><p class="p1">Едва смея дышать, Уилл еще долго оставался на дереве, и луна медленно ползла по черному небу. Наконец мышцы его окоченели, пальцы онемели от холода, и он стал спускаться.</p><p class="p1">Тело Ройса лежало лицом в снег, одна рука была протянута в сторону, толстый соболий плащ прорезан в дюжине мест. Было видно, насколько он молод. Мальчишка.</p><p class="p1">Уилл нашел остатки меча чуть в стороне: клинок расщепился и изогнулся, напоминая дерево, пораженное ударом молнии. Став на колени, Уилл осторожно огляделся вокруг и подобрал оружие. Расщепленный клинок послужит доказательством его слов. Гаред знает, что все это значит, а если нет, то поймет старый медведь Мормонт или мейстер Эйемон. Ждет ли его еще Гаред с лошадьми? Надо торопиться.</p><p class="p1">Уилл поднялся. Над ним высился сир Уэймар Ройс. Тонкие одежды разодраны, лицо разбито. Осколок торчал из ослепленной левой глазницы.</p><p class="p1">Правый глаз был открыт. Зрачок его горел синим огнем и… видел.</p><p class="p1">Сломанный меч упал из бесчувственных пальцев. Уилл закрыл глаза, чтобы помолиться. Длинные благородные пальцы коснулись его щеки, стиснули горло. Уилл ощутил прикосновение тончайшей выделки кротовой кожи, липкой от крови. Но прикосновение оказалось ледяным.</p></span>
