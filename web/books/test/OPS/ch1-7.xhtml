<p class="p">Эддард</p>
</div><p class="p1">Гости хлынули в ворота замка рекой золота, серебра и полированной стали; отряд в три сотни мечей, горделивые знаменосцы и рыцари, присягнувшие наемники и вольные всадники. Над их головами северный ветер теребил дюжину золотых знамен, расшитых венценосным оленем Баратеонов.</p><p class="p1">Нед знал многих. Вот сир Джейме Ланнистер, с волосами светлыми, как кованое золото, а вот промелькнуло жуткое обгорелое лицо Сандора Клигана. Высокий юноша возле него мог быть только кронпринцем, а тот коротышка позади них, безусловно, Бес, Тирион Ланнистер.</p><p class="p1">Но рослый мужчина, возглавлявший отряд, которого сопровождали по бокам два рыцаря в снежно-белых плащах королевской гвардии, показался Неду почти неузнаваемым… пока не соскочил со спины боевого коня со знакомым ревом и не приступил к сокрушающим кости объятиям.</p><p class="p1">— Нед! Ах, как я рад снова видеть твою ледяную физиономию! — Король оглядел его сверху донизу и расхохотался. — А ты вовсе не переменился.</p><p class="p1">Неду хотелось бы сказать то же самое. Миновало пятнадцать лет с той поры, как они выехали, чтобы отвоевать престол, и тогда владыка Штормового Предела был чисто выбрит, светлоглаз и мускулист, как девичья мечта. Шести с половиной футов ростом, он и так возвышался над окружающими, но, надевая броню и великий рогатый шлем своего дома, становился истинным гигантом. И сила у него была под стать обличью: Роберт в сражениях предпочитал шипастый боевой молот, который Нед едва мог поднять. В те дни запах крови и кожи пропитывал его, словно духи. Ну а теперь к нему прилип запах настоящих духов, и пузо выросло под стать росту. Нед в последний раз видел короля девять лет назад, во время битвы Беелона Грейджоя, когда олень и лютоволк объединились, чтобы покончить с претензиями владыки Железных Островов, провозгласившего себя королем. С той ночи, когда они стояли бок о бок в павшей твердыне Грейджоя, где Роберт принял капитуляцию восставшего лорда, а Нед взял в заложники и воспитанники его сына Теона, король набрал не менее восьми стоунов.<a href="ch2.xhtml#id6" class="a">[4]</a> Борода, грубая и черная, словно железная проволока, покрывала его щеки, пряча двойной подбородок, но ничто не могло спрятать его брюхо и черные круги под глазами.</p><p class="p1">И все же Роберт был теперь королем Неда, а не просто другом, поэтому он отвечал согласно этикету:</p><p class="p1">— Светлейший государь, Винтерфелл к вашим услугам.</p><p class="p1">К этому времени начали спешиваться, и все остальные, конюхи двинулись, чтобы увести коней. Королева Роберта Серсея Ланнистер вошла в ворота пешком вместе со своими младшими детьми. Кибитка, в которой они ехали, точнее, огромная двухэтажная повозка из умащенного маслом дерева и позолоченного металла, влекомая сорока тяжеловозами, была слишком велика, чтобы пройти в ворота замка. Нед встал на колено в снег, чтобы поцеловать кольцо королевы, а тем временем Роберт обнял Кейтилин, словно давно потерянную сестру. Потом позвали детей, их представили, и обе стороны одобрили молодежь.</p><p class="p1">Когда официальное приветствие и все формальности были совершены, король сказал хозяину:</p><p class="p1">— Отведи меня в свою крипту, Эддард, я должен отдать дань памяти.</p><p class="p1">Неду понравилось, что король не позабыл его сестру. А ведь прошло столько лет! Он крикнул, чтобы принесли фонарь. Других слов было не нужно. Королева немедленно начала протестовать. Они ехали с самого рассвета, все устали и замерзли и, конечно, в первую очередь должны привести себя в порядок. Мертвые могут и подождать. Лишь только она начала ворчать, Роберт поглядел на нее, а брат-близнец Джейме сжал королеве руку. Ей пришлось замолчать.</p><p class="p1">Потом они вместе отправились в крипту: Нед и король, которого он едва узнал. Вились крутые каменные ступеньки. Нед шел первым с фонарем в руках.</p><p class="p1">— А я уже думал, что мы никогда не доберемся до Винтерфелла, — пожаловался Роберт спускаясь. — Когда на юге мне говорят о моих Семи Королевствах, то обычно забывают, что твоя часть больше всех шести остальных.</p><p class="p1">— Полагаю, путешествие было приятным, светлейший?</p><p class="p1">Роберт фыркнул:</p><p class="p1">— Болота, леса и поля, изредка попадались приличные постоялые дворы, но к северу от Перешейка их почти нет. Я никогда не видел подобных диких просторов. А где же твой народ?</p><p class="p1">— Должно быть, перепугались и спрятались, — пошутил Нед. Он ощущал поднимающийся по лестнице холод земных глубин. — Короли редко показываются на севере.</p><p class="p1">Роберт усмехнулся:</p><p class="p1">— Скорее всего зарылись в снег. В снег, Нед! — Король оперся рукой о стену, чтобы не упасть.</p><p class="p1">— Поздним летом снег у нас выпадает нередко, — проговорил Нед. — Надеюсь, эта пороша не смутила тебя. Снега выпало немного.</p><p class="p1">— Это Иным, может быть, немного. — Роберт выругался. — На что же похож Винтерфелл зимой? Боюсь и подумать.</p><p class="p1">— Зимы здесь суровы, — согласился Нед. — Но Старки живут. Нам зимовать не впервой.</p><p class="p1">— Тебе нужно съездить на юг, — сказал Роберт, — хотя бы посмотреть, каким бывает лето, прежде чем оно закончится. Заглянуть в Вышесад, там золотые розы покрывают целые поля, уходящие вдаль так далеко, как может видеть глаз. Плоды становятся такими спелыми, что просто лопаются во рту, — дыни, тыквы, огненные сливы, ты никогда не пробовал подобной сладости. Но я кое-что привез. Даже в Штормовом Пределе, когда добрый ветер дует с залива, дни настолько жарки, что не хочется шевелиться. Посмотрел бы ты сейчас на наши города, Нед! Цветы повсюду, рынки полны еды, летние вина так дешевы и добры, что пьянеешь от одного запаха. Вокруг одни только подгулявшие богатые толстяки. — Король расхохотался и шлепнул себя по объемистому животу.</p><p class="p1">— Ну а девицы, Нед! — воскликнул Роберт, и глаза его заиграли. — Уверяю тебя, жара заставила женщин забыть о всякой скромности. Они купаются голыми в реке как раз возле замка, на улицах слишком парит, чтобы носить шерсть или мех, поэтому они ходят в коротких платьях, в шелке — если у них есть монеты, — но даже если это простая материя, пот заставляет платья липнуть к телу, и они кажутся голыми. — Король блаженно расхохотался.</p><p class="p1">Роберт Баратеон всегда обладал неуемным аппетитом и умел брать от жизни все удовольствия. Никто не мог бы обвинить в этом Эддарда Старка. И все же Нед с сожалением заметил, сколь тягостный отпечаток оставили плотские радости на внешности короля. К тому времени, когда они достигли подножия лестницы, Роберт успел запыхаться, лицо его побагровело.</p><p class="p1">— Светлейший, она в дальнем конце, вместе с отцом и Брандоном, — почтительно сказал Нед, описывая фонарем широкий полукруг. Тени двигались и шевелились. Мерцающий свет прикасался к камням под ногой, вырисовывал длинную процессию гранитных столбов, попарно маршировавших вперед во тьму. Между столбами на каменных тронах возле стены сидели изваяния усопших, припав спиной к склепам, хранившим их смертные останки.</p><p class="p1">Нед отправился вперед, и Роберт молча последовал за ним, поеживаясь от подземного холода. Тут всегда было зябко. Звук шагов по камню отдавался над головой; они словно бы шли мимо строя мертвецов дома Старков. Покойные лорды Винтерфелла следили за шагами пришельцев. Длинными рядами сидели подобия здешних хозяев на камнях, запечатавших гробницы, их слепые глаза разглядывали вечную тьму, а огромные каменные лютоволки лежали, свернувшись, возле каменных ног. Казалось, что тени заставляют каменные фигуры шевелиться, пропуская мимо себя живых. По древнему обычаю, на колени каждому, кто был лордом Винтерфелла, клали длинный железный меч, чтобы дух доблести оставался в своей гробнице. Меч родоначальника давно рассыпался в прах, оставив лишь несколько красных пятен там, где металл соприкасался с камнем. Нед подумал, что теперь самые древние призраки могут бродить по замку. Оставалось надеяться, что это не так. Первые лорды Винтерфелла были людьми жесткими, как и та земля, которой они правили. В те столетия, что предшествовали появлению повелителей драконов из-за моря, Старки никому не приносили присяги, собственной волей именуя себя Королями Севера.</p><p class="p1">Нед остановился возле последней гробницы и поднял масляный фонарь. Здесь оканчивались запечатанные гробницы, но крипта тянулась и дальше, зияющие черные дыры ожидали постояльцев: и его самого, и детей. Неду не хотелось даже думать об этом.</p><p class="p1">— Здесь, — сказал он королю.</p><p class="p1">Роберт безмолвно кивнул, преклонил колени и нагнул голову.</p><p class="p1">В этом месте бок о бок располагались три гробницы. Вот длинное суровое лицо короля лорда Рикарда Старка, отца Неда. Камнетес хорошо знал своего господина. Он глядел вперед со спокойным достоинством, каменные пальцы сжимали меч, лежащий на его коленях. Но при жизни все мечи подвели его. В двух меньших гробницах по обе стороны от него лежали его дети.</p><p class="p1">Брандону было двадцать, когда он был удавлен по приказу Безумного короля Эйериса Таргариена за несколько дней до свадьбы с Кейтилин Талли из Риверрана. Отца заставили видеть смерть сына. Брандон был истинным наследником земель — первенцем, рожденным, чтобы править.</p><p class="p1">Лианне было всего лишь шестнадцать, еще ребенком она обещала стать женщиной невероятного очарования. Нед любил ее всем сердцем. Роберт еще сильнее. Она была его невестой.</p><p class="p1">— Ее красоту невозможно передать в камне, — сказал король, помолчав. Глаза его задержались на лице Лианны, словно он все еще надеялся вернуть ее к жизни. Наконец грузный король неловко поднялся на ноги. — Ах, проклятие мне. Неужели ты не мог ее похоронить в другом месте? — Голос его был полон горя. — Она заслуживала света, а не тьмы…</p><p class="p1">— Она родом из Старков, господ Винтерфелла, — отвечал Нед спокойно. — Нам положено лежать здесь.</p><p class="p1">— Лианну можно было положить на вершине холма под плодовое дерево, чтобы она видела солнце и облака, а дождь омывал ее.</p><p class="p1">— Я был возле сестры, когда она умерла, — напомнил Нед королю. — Она решила вернуться домой, чтобы лечь на покой возле Брандона и отца. — Он, казалось, все еще слышал ее голос. «Обещай мне это, — попросила она его в комнате, пропахшей кровью и розами. — Обещай мне это, Нед».</p><p class="p1">Лихорадка украла силы, и голос ее был тих, но едва он дал свое слово, страх оставил глаза сестры. Нед вспомнил, как она улыбнулась, как стиснули руку ее пальцы, когда она перестала бороться за жизнь и выпустила из ладони мертвые розовые лепестки. Больше он ничего не помнил. Онемевшего от горя, его нашли возле тела сестры. Хоуленд Рид — тот, что из поселка на озере, — разнял их руки.</p><p class="p1">— Я ношу ей цветы, когда удается, — сказал Нед. — Лианна… любила цветы.</p><p class="p1">Король прикоснулся к изваянию, пальцы скользнули по грубому камню столь же мягко, как по живой плоти.</p><p class="p1">— Я поклялся убить Рейегара за то, что он сделал с ней.</p><p class="p1">— Ты и убил его, — напомнил ему Нед.</p><p class="p1">— Но только однажды, — с горечью отвечал Роберт.</p><p class="p1">Это было так давно. Возле Трезубца они сошлись вместе, вокруг бушевала битва. Роберт при своем боевом молоте, в огромном рогатом шлеме напал на облаченного в черный панцирь таргариенского принца. На нагрудной пластине того был вычеканен знак дома — трехголовый дракон, осыпанный рубинами, сверкавшими подобно пламени. Багряные воды Трезубца омывали копыта их боевых коней, они сходились снова и снова, и наконец последний сокрушительный удар молота Роберта разбил и дракона, и грудь под ним. Когда Нед наконец явился к месту событий, Рейегар уже лежал мертвым в потоке, а воины обеих армий копошились в грязи, разыскивая вылетевшие из панциря рубины.</p><p class="p1">— Мне снится, что я убиваю его, каждую ночь, — признался Роберт. — Но и тысячи смертей ему мало, он заслуживает большего.</p><p class="p1">На это Неду нечего было ответить. Помолчав, он сказал:</p><p class="p1">— Пора бы возвратиться, светлейший государь, ваша жена ждет.</p><p class="p1">— Чтоб Иные побрали мою жену, — кисло пробормотал Роберт, но направился назад, тяжело топая в темноте. — И если я еще раз услышу «светлейший», то велю насадить твою голову на пику. Мы слишком близки друг другу, чтобы пользоваться подобным титулом.</p><p class="p1">— Я этого не забыл, — проговорил тихо Нед. Молчание затянулось, и он попросил: — Расскажи мне о Джоне…</p><p class="p1">Роберт покачал головой:</p><p class="p1">— Я никогда не видел, чтобы человек заболевал так внезапно. Мы устраивали турнир в честь именин моего сына. Если бы ты видел в этот день Джона, то поклялся бы, что ему суждена вечная жизнь. Две недели спустя он был уже мертв. Болезнь опалила его нутро. Она прожгла его насквозь. — Король остановился у колонны возле гробницы одного из давно усопших Старков. — Мне нравился этот старик.</p><p class="p1">— Мне тоже. — Нед помедлил мгновение. — Кейтилин боится за свою сестру. Как Лиза справляется с горем?</p><p class="p1">Рот Роберта горько скривился.</p><p class="p1">— Не слишком-то хорошо, если честно, — признался он. — По-моему, смерть Джона заставила ее свихнуться. Она увезла мальчишку в Орлиное Гнездо. Против моего желания. Я надеялся воспитать его у Тайвина Ланнистера на Бобровом утесе. У Джона нет братьев и сыновей. Неужели я могу допустить, чтобы его сына воспитывали женщины?</p><p class="p1">Нед скорее доверил бы дитя подколодной змеюге, чем лорду Тайвину, однако он оставил свое мнение невысказанным. Иногда старые раны не исцеляются до конца и вновь кровоточат при первом упоминании.</p><p class="p1">— Жена потеряла мужа, — тщательно выбирая слова, проговорил он. — Быть может, мать страшится потерять сына. Мальчик еще очень юн.</p><p class="p1">— Ему шесть, он хвор и к тому же лорд Орлиного Гнезда, да смилуются над ним боги. — Король помолчал немного и выругался. — Лорд Тайвин никогда не брал себе воспитанников. Лиза должна была чувствовать себя польщенной. Ланнистеры — весьма благородный дом, но она и слушать меня не стала, уехала среди ночи, даже не спросив разрешения. Серсея была в гневе. — Он глубоко вздохнул. — Мы с мальчиком тезки, или ты не знал этого? Его имя Роберт Аррен. Я поклялся защищать его. А как я могу сделать это, после того как собственная мать похитила Роберта?</p><p class="p1">— Я могу взять мальчика на воспитание, если ты хочешь, — сказал Нед. — Лиза согласится на это. Они с Кейтилин были в детстве близки, в Винтерфелле будут рады и ей.</p><p class="p1">— Благородное предложение, друг мой, — сказал король, — но, увы, запоздалое. Лорд Тайвин уже дал согласие. Он оскорбится, если я передам мальчика на воспитание в другое место.</p><p class="p1">— Меня более заботит благоденствие моего племянника, чем гордость Ланнистеров.</p><p class="p1">— Это ты говоришь потому, что тебе не приходилось спать с представительницей их рода, — расхохотался Роберт, звук загрохотал между гробниц и несколько раз отразился от сводчатого потолка. Вспыхнула улыбка: в чащобе огромной черной бороды блеснули белые зубы. — Ах, Нед, — сказал король. — Ты по-прежнему слишком серьезен. — Он обнял тяжелой рукой плечи Неда. — Я намеревался поговорить с тобой через несколько дней, но теперь в этом нет нужды. Пойдем!</p><p class="p1">Они шли между колонн. Слепые каменные глаза, казалось, провожали их. Король не снимал свою руку с плеч Неда.</p><p class="p1">— Ты, конечно, не догадываешься о причине моего визита в Винтерфелл после столь долгого перерыва?</p><p class="p1">У Неда были некоторые подозрения на сей счет, однако он не стал говорить о них.</p><p class="p1">— Чтобы порадоваться моему обществу, — ответил он непринужденно. — Кроме того, нельзя забывать о Стене. Тебе надо бы посмотреть на нее, светлейший, пройтись поверху, поговорить с теми, кто защищает ее. Ночной Дозор стал тенью прежнего своего величия. Бенджен утверждает…</p><p class="p1">— Вне сомнения, я услышу слова твоего брата из его собственных уст и достаточно скоро, — проговорил Роберт. — Сколько ж простояла Стена… восемь тысячелетий? Продержится еще несколько дней. У меня есть более насущные дела. Наступают трудные времена, мне нужны надежные люди. Люди, подобные Джону Аррену. Он служил мне как лорд Орлиного Гнезда, как Хранитель Востока, как десница короля. Джона трудно заменить.</p><p class="p1">— Но его сын… — начал Нед.</p><p class="p1">— Его сын унаследует Орлиное Гнездо со всеми доходами, — отвечал Роберт отрывисто, — и не более.</p><p class="p1">Ответ застал Неда врасплох. Он удивился, вздрогнул и начал поворачиваться к своему королю. Слова вылетели сами собой:</p><p class="p1">— Аррены всегда были Хранителями Востока, титул этот передается вместе с владением.</p><p class="p1">— Когда Роберт повзрослеет, честь эту можно будет возвратить его роду, — сказал король. — Я могу подумать об этом и сейчас, и в следующем году. Однако шестилетний мальчишка не способен возглавить войско.</p><p class="p1">— В мирные времена титул этот является просто почетным. Пусть мальчик унаследует его хотя бы в честь отца, если не ради него самого. Ты ведь в долгу перед Джоном за его службу.</p><p class="p1">Король был недоволен ответом. Он снял руку с плеча Неда.</p><p class="p1">— Джон был обязан служить своему сюзерену. Не считай меня неблагодарным, Нед. Тебе лучше всех известно, что это не так. Но сын — это далеко не отец, мальчику не удержать Восток. — Тут голос его смягчился. — Ну, довольно об этом. У меня есть и более важное дело, и я не стану спорить с тобой. — Роберт взял Неда за локоть. — Ты мне нужен.</p><p class="p1">— Я всегда к твоим услугам, светлейший. Всегда. — Нед чувствовал, что должен был сказать эти слова, и он произносил их, еще не зная, что услышит сейчас.</p><p class="p1">Роберт как будто бы не слышал его.</p><p class="p1">— Эти годы, которые мы провели в Орлином Гнезде… боги, это были добрые годы. Я хочу, чтобы ты вновь находился возле меня, Нед. Ты мне нужен в Королевской Гавани, а не здесь, на краю мира, где ты ничего не можешь сделать. — Роберт поглядел во тьму, на мгновение сделавшись столь же меланхоличным, как и Старк. — Клянусь тебе, усидеть на троне в тысячу раз труднее, чем завоевать его. Законы — скучное дело, считать медяки еще хуже, но, кроме того, есть еще люди… и им нет конца. Я сижу на этом проклятом кресле, выслушиваю жалобы, пока ум мой не онемеет, а задница не разболится. Всем что-то нужно: деньги, земля или правосудие. Ну а враки, которые они рассказывают… Впрочем, мои лорды и леди ничем не лучше. Меня окружают льстецы и дураки. Нед, это может довести человека до безумия. Одна половина из них не смеет открыть мне истину, другая половина не способна найти ее. Бывают такие ночи, когда я жалею о том, что мы победили возле Трезубца. Ну не совсем, конечно, но…</p><p class="p1">— Понимаю, — негромко проговорил Нед.</p><p class="p1">Роберт поглядел на него.</p><p class="p1">— Может быть, и в самом деле понимаешь. Но если так, то лишь ты один, мой старый друг. — Он улыбнулся. — Лорд Эддард Старк, я собираюсь назвать тебя десницей короля.</p><p class="p1">Нед опустился на одно колено. Предложение не удивило его: по какой еще причине мог Роберт заехать в такую даль? Сан десницы в Семи Королевствах предоставлял вторую власть после самого короля. Он позволял говорить от лица короля, командовать королевским войском, добиваться исполнения королевских законов. Десница мог даже сесть на Железный трон, чтобы совершить правосудие, если король был болен, отсутствовал или же не хотел заниматься делами. Роберт предлагал ему ответственность величиной во все королевство.</p><p class="p1">Самая непривлекательная перспектива.</p><p class="p1">— Светлейший государь, — отвечал он, — я не достоин этой чести.</p><p class="p1">Роберт застонал с добродушным нетерпением.</p><p class="p1">— Если бы я хотел оказать тебе честь, то отправил бы тебя в отставку. А я хочу, чтобы ты правил королевствами, воевал, позволив обжорству, пьянкам и распутству загнать меня в раннюю могилу. — Похлопав по своему чреву, король ухмыльнулся. — А знаешь, как говорят о короле и его деснице?</p><p class="p1">Пословицу Нед знал.</p><p class="p1">— Пока король спит, — отозвался он, — рука строит.</p><p class="p1">— Рыбачка, с которой я спал однажды, рассказала мне, как выражает эту мысль простонародье. Король ест, сказала она, а десница подтирает задницу. — Закинув назад голову, Роберт громогласно расхохотался. Эхо со звоном пронзило тьму, окружающие их покойники Винтерфелла, казалось, обратили к ним холодные неодобрительные взгляды. Наконец смех иссяк.</p><p class="p1">Нед все еще оставался на одном колене, подняв глаза к королю.</p><p class="p1">— Проклятие, Нед, — пожаловался король. — Мог хотя бы порадовать меня улыбкой.</p><p class="p1">— Говорят, что здесь зимой бывает так холодно, что смех застывает в горле и душит человека насмерть, — невозмутимым голосом отвечал Нед. — Быть может, поэтому Старки не отличаются весельем.</p><p class="p1">— Отправляйся на юг вместе со мной, и я научу тебя смеяться, — пообещал король. — Ты помог мне завоевать этот проклятый трон, теперь помоги удержать. Мы должны были править вместе. Если бы Лианна не умерла, мы стали бы братьями, связанными любовью и кровью. Но и теперь еще не поздно. У меня есть сын. У тебя дочь. Мой Джофф и твоя Санса соединят наши дома, как хотели сделать это мы с Лианной.</p><p class="p1">А вот это предложение и в самом деле удивило Неда.</p><p class="p1">— Но ведь Сансе всего лишь одиннадцать.</p><p class="p1">Роберт нетерпеливо махнул рукой.</p><p class="p1">— Достаточно, чтобы просватать их. Ну а с браком можно подождать несколько лет. — Король улыбнулся. — А теперь вставай, проклятый, и говори — да.</p><p class="p1">— Ничто не доставит мне большего удовольствия, светлейший, — отвечал Нед, помедлив. — Но все эти почести настолько неожиданны… Можно ли мне подумать какое-то время? Мне надо рассказать жене…</p><p class="p1">— Да-да, конечно, разумеется. Расскажи Кейтилин. Выспись, если тебе нужно. — Король схватил Неда за руку и потянул с колен. — Только не заставляй меня ждать слишком долго. Я не самый терпеливый среди людей.</p><p class="p1">На миг Эддарда Старка переполнило жуткое предчувствие. Здесь было его место, здесь, на Севере. Он поглядел на каменные фигуры, окружавшие его, глубоко вздохнул. В холодном безмолвии крипты он чувствовал на себе взгляды мертвецов. Они все понимали, он знал это. И зима приближалась.</p></span>
