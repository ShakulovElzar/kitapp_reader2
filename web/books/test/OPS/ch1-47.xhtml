<span id="id45"><div class="title2">
<p class="p">Санса</p>
</div><p class="p1">— А он не захотел послать сира Лораса, — в тот же вечер Санса рассказывала Джейни Пуль, ужиная с нею на скорую руку при свете лампы. — Наверное, это из-за его ноги.</p><p class="p1">Лорд Эддард ужинал у себя в спальне вместе с Элином, Харвином и Вейоном Пулем, чтобы не тревожить сломанную ногу, а септа Мордейн пожаловалась на то, что перетрудила ноги, простояв целый день в галерее. Предполагалось, что к ним присоединится Арья, но та запаздывала со своего урока танцев.</p><p class="p1">— Его нога? — неуверенно спросила Джейни, девушка хорошенькая и темноволосая, почти ровесница Сансе. — Неужели сир Лорас повредил ногу?</p><p class="p1">— Речь идет не о ноге сира Лораса, — отвечала Санса, деликатно обгладывая цыплячью ножку. — А о ноге отца, глупая. Ему так больно, что он становится раздражительным. Иначе, я не сомневаюсь, отец послал бы сира Лораса.</p><p class="p1">Решение отца до сих пор смущало ее. Когда рыцарь Цветов сказал свое слово, Санса уже решила, что на ее глазах воплотится в жизнь одна из сказок старухи Нэн. Сир Григор, конечно, чудовище, и сир Лорас, как положено истинному герою, должен убить его. Он и похож был на истинного героя, стройный красавец с золотыми розами вокруг тонкой талии и густыми каштановыми волосами, непослушной челкой спускавшимися на глаза. И отец отказал ему! Санса расстроилась так, что просто ничего не могла сказать. Она объяснила это септе Мордейн, когда они шли по лестнице с галереи, но септа ответила, что не дело дочери сомневаться в решениях лорда-отца.</p><p class="p1">И тут в разговор вступил лорд Бейлиш:</p><p class="p1">— Ох, не знаю, септа. Некоторые из решений ее лорда-отца нуждаются в доле сомнения, а молодая леди столь же мудра, как и очаровательна. — Он низко поклонился Сансе, и она даже не вполне поняла, слышит ли комплимент или насмешку.</p><p class="p1">Септа Мордейн была очень огорчена тем, что лорд Бейлиш подслушал их разговор.</p><p class="p1">— Это просто слова, милорд, — проговорила она. — Девичья болтовня. Она ничего не хотела этим сказать!</p><p class="p1">Лорд Бейлиш погладил свою крохотную остроконечную бородку и улыбнулся:</p><p class="p1">— Ничего? Скажи мне, дитя, а почему ты послала бы сира Лораса?</p><p class="p1">Тут Сансе просто пришлось рассказать ему и о героях, и о чудовищах. Советник короля улыбнулся.</p><p class="p1">— Ну что ж, я бы руководствовался другими причинами, однако… — Он прикоснулся к ее щеке, прочертив на ней короткую линию большим пальцем. — Жизнь это не песня, моя милая. Однажды, к скорби своей, ты это узнаешь.</p><p class="p1">Сансе не хотелось рассказывать все это Джейни; ей не хотелось даже вспоминать.</p><p class="p1">— Королевское правосудие исполняет сир Илин, а не сир Лорас, — сказала Джейни. — Лорду Эддарду следовало послать его.</p><p class="p1">Санса поежилась. Ей было не по себе всякий раз, когда она глядела на сира Илина Пейна. При виде его Сансе казалось, что какая-то мертвечина прикасается к ее голой коже.</p><p class="p1">— Сир Илин похож на чудовище. Я рада, что отец не выбрал его.</p><p class="p1">— Лорд Берис такой же герой, как и сир Лорас, такой же отважный и доблестный.</p><p class="p1">— Наверное, — согласилась Санса не без некоторого сомнения. Берис Дондаррион, конечно, красив, но он почти что старик; скоро ему двадцать два; рыцарь Цветов гораздо лучше подходит на эту роль. Конечно, Джейни сразу влюбилась в лорда Бериса, когда впервые увидела его на поле. Санса считала это глупостью. Ведь Джейни всего лишь дочь стюарда, и как бы она ни сходила с ума, лорд Берис никогда не обратит своего внимания на девушку, настолько уступающую ему в положении, даже если она в два раза младше его.</p><p class="p1">Однако жестоко так говорить, поэтому Санса прихлебнула молока и переменила тему разговора.</p><p class="p1">— Мне приснилось, что именно Джоффри добудет белого оленя, — сказала она. Точнее говоря, это было ее желанием, но лучше было назвать его сном. Все знали, что сны бывают пророческими. Белых оленей считали существами редкими и волшебными, и в сердце своем она решила, что ее галантный принц более достоин подобной добычи, чем его пьяница-отец.</p><p class="p1">— Тебе приснилось? В самом деле? Значит, принц Джоффри просто подошел к оленю и прикоснулся к нему рукой, не причинив вреда?</p><p class="p1">— Нет, — отвечала Санса. — Он застрелил его золотой стрелой и привез мне. — В песнях благородные рыцари никогда не убивали волшебных зверей — только подходили и гладили, — но она знала, что Джоффри любит охотиться, в особенности убивать… лишь зверей, конечно. Санса не сомневалась, что ее принц не принимал участия в убийстве Джори и всех остальных бедняг, во всем виноват был его злобный дядя; одно слово — Цареубийца. Она знала, что отец ее до сих пор из-за этого в гневе, однако нечестно обвинять Джоффа. Это все равно как обвинять ее в том, что натворила Арья.</p><p class="p1">— Сегодня вечером я видела твою сестру, — выпалила Джейни, словно прочитав мысли Сансы. — Она ходила на руках по конюшне. Зачем, по-твоему, ей это понадобилось?</p><p class="p1">— Я уверена лишь в том, что вообще не понимаю, зачем Арья что-либо делает. — Санса ненавидела конюшни, всю эту вонь, докучливых мух и конский помет. Отправляясь на прогулку верхом, она всегда предпочитала, чтобы конюх подал ей заседланную лошадь к крыльцу. — Ты хочешь еще услышать, что было при дворе?</p><p class="p1">— Конечно, — обрадовалась Джейни.</p><p class="p1">— Туда приехал Черный Брат, старый такой и вонючий, — продолжила рассказ Санса, — он просил людей для Стены. — Это ей не понравилось вовсе. Сансе всегда представлялось, что Ночной Дозор состоит из мужей, подобных дяде Бенджену. Таких в песнях звали Черными Рыцарями Стены. Но посланец Ночного Дозора был горбат и уродлив, и к тому же одежда его явно кишела блохами. Неужели Ночной Дозор на самом деле выглядит иначе? Она почувствовала жалость к своему сводному брату Джону. — Отец спросил, не найдется ли в зале рыцарей, которые готовы оказать честь своим домам, уйдя в чернецы, однако никто не шагнул вперед, поэтому он отдал этому Йорену тех, кого извлек из королевских темниц, и отослал его обратно. А потом к нему приехали эти два брата, свободные всадники из Дорнской Марни, и присягнули мечами на службу королю. Отец принял их клятву…</p><p class="p1">Джейни зевнула.</p><p class="p1">— А лимонные пирожки есть?</p><p class="p1">Санса не любила, когда ее прерывали, однако приходилось согласиться с тем, что лимонный пирог представлял собой более интересную тему, чем происходившее в тронном зале.</p><p class="p1">— Посмотрим, — сказала она.</p><p class="p1">На кухне лимонных пирожков не обнаружилось, однако обнаружилась половинка холодного пирога с клубникой, что было ничуть не хуже. Девицы съели его на ступеньках башни, хихикая, сплетничая и делясь секретами; словом, в ту ночь Санса отправилась в постель, ощущая себя такой же врединой, как и Арья.</p><p class="p1">На следующее утро она проснулась еще до рассвета и сонная подобралась к окошку, чтобы поглядеть, как лорд Берис выстраивает своих людей. Они выехали с первыми лучами солнца, перед отрядом полоскались три стяга: коронованный олень короля летел за высоким древком, лютоволк Старков и двойная молния лорда Бериса — за более короткими. Все было так красиво, как в ожившей песне: звякали мечи, мерцали факелы, на ветру плясали знамена, ржали и фыркали кони, золотые лучи пронзили насквозь решетку, когда она поползла вверх. Люди Винтерфелла казались особенными красавцами в своих серебристых панцирях и длинных серых плащах.</p><p class="p1">Элин держал в руке знамя Старков. Увидев, как он подъехал к лорду Берису, чтобы обменяться с ним словами, Санса ощутила неподдельную гордость. Элин был красивее Джори; когда-нибудь и он станет рыцарем.</p><p class="p1">Башня Десницы, казалось, опустела после их отъезда, и, спустившись вниз, Санса обрадовалась даже обществу Арьи.</p><p class="p1">— А куда все подевались? — поинтересовалась сестра, обдирая шкурку с ярко-красного апельсина. — Отец отослал их ловить Джейме Ланнистера?</p><p class="p1">Санса вздохнула:</p><p class="p1">— Они уехали вместе с лордом Берисом, чтобы обезглавить сира Григора Клигана. — Она повернулась к септе Мордейн, черпавшей деревянной ложкой овсянку. — Септа, а лорд Берис выставит голову сира Григора наверху собственных ворот или привезет ее сюда, чтобы это сделал король? — Они с Джейни Пуль поспорили об этом вчера вечером.</p><p class="p1">Септа была потрясена:</p><p class="p1">— Леди не подобает говорить о подобных вещах за овсянкой! Где твое воспитание, Санса? Клянусь, последнее время ты ведешь себя ничем не лучше сестры.</p><p class="p1">— А что натворил Григор? — спросила Арья.</p><p class="p1">— Он сжег острог и убил кучу людей, женщин и детей тоже.</p><p class="p1">Арья скривилась:</p><p class="p1">— Джейме Ланнистер убил Джори, Хьюарда и Уила, а Пес зарубил Мику. Их тоже следовало бы обезглавить.</p><p class="p1">— Это совсем не одно и то же, — сказала Санса. — Пес присягнул Джоффри, а твой мальчишка, да еще сын мясника, набросился на принца.</p><p class="p1">— Ты лжешь, — бросила Арья. Руки ее стиснули кровавый апельсин так, что красный сок закапал между пальцев.</p><p class="p1">— Ладно, давай, обзывайся как хочешь, — непринужденно сказала Санса. — Ты не осмелишься так поступать, когда я выйду замуж за Джоффри. Тебе придется кланяться мне и называть светлейшей государыней!</p><p class="p1">Она взвизгнула, увидев, что Арья бросила апельсин; влажно хлюпнув, он угодил Сансе прямо в лоб и шлепнулся на юбку.</p><p class="p1">— Светлейшая государыня, вы испачкали личико соком, — заметила Арья.</p><p class="p1">Сок тек вдоль носа, ел глаза. Санса стерла его салфеткой. Но заметив ущерб, причиненный упавшим на подол плодом ее прекрасному шелковому платью цвета слоновой кости, она закричала снова.</p><p class="p1">— Ты ужасна, — завопила она Арье. — Лучше было бы, если бы убили тебя, а не Леди!</p><p class="p1">Септа Мордейн неловко вскочила на ноги.</p><p class="p1">— Об этом узнает ваш лорд-отец! Ступайте по своим палатам, немедленно. Немедленно!</p><p class="p1">— Я тоже? — Слезы наполняли глаза Сансы. — Это нечестно!</p><p class="p1">— Никаких обсуждений. Ступайте!</p><p class="p1">Санса отправилась прочь, подняв голову. Она будет королевой, а королевы не плачут. По крайней мере когда это видят люди. Вернувшись к себе в опочивальню, она заложила дверь щеколдой и сняла платье. Кровавый апельсин оставил на шелке расплывчатое красное пятно.</p><p class="p1">— Ненавижу ее! — закричала Санса. Скомкав платье, она швырнула его в холодный очаг на пепел, оставшийся после вчерашнего вечера. Обнаружив, что красная жидкость просочилась и на нижнюю юбку, она не сдержалась и зарыдала. Сорвав всю остальную одежду, Санса бросилась в постель и плакала до тех пор, пока не заснула.</p><p class="p1">Септа Мордейн постучала в ее дверь уже около полудня.</p><p class="p1">— Санса! Лорд-отец хочет видеть тебя.</p><p class="p1">Девочка села и прошептала:</p><p class="p1">— Леди! — На мгновение ей показалось, что волчица вернулась и сидит у постели, глядит на нее золотыми скорбными и всезнающими глазами. Ей снился сон, поняла Санса. Леди вернулась к ней, они бегали вместе и… и… Пытаться вспомнить было все равно как ловить первый снег ладонями. Сон померк, и Леди вновь оказалась мертва.</p><p class="p1">— Санса! — Стук прозвучал резче. — Ты слышишь меня?</p><p class="p1">— Да, септа. Не позволите ли вы мне сперва одеться? Я быстро. — Глаза ее покраснели от слез, однако Санса постаралась привести себя в порядок.</p><p class="p1">Лорд Эддард горбился над огромным, переплетенным в кожу томом, когда септа Мордейн ввела Сансу в солярий; его нога, укрытая лубком, скрывалась под столом.</p><p class="p1">— Подойди сюда, Санса, — сказал он не столь уж и строго, когда септа отправилась за сестрой. — Сядь возле меня. — Он закрыл книгу.</p><p class="p1">Септа Мордейн вернулась с Арьей, все еще пытавшейся вырваться из ее рук. Санса надела очаровательную бледно-зеленую дамаскиновую мантилью и изобразила раскаяние, но на сестре ее оставалась та же самая крысиная кожа и домотканое платье, в которых она была за завтраком.</p><p class="p1">— А вот и вторая, — объявила септа.</p><p class="p1">— Благодарю вас, септа Мордейн. Я хочу переговорить с моими дочерьми с глазу на глаз, прошу прощения. — Откланявшись, септа ушла.</p><p class="p1">— Все начала Арья, — торопливо затараторила Санса, стремясь заполучить первое слово. — Она обозвала меня лгуньей и бросила в меня апельсин, испортила мое платье, шелковое, цвета слоновой кости, которое мне подарила королева Серсея, когда мы обручились с принцем Джоффри. Арье завидно, что я выйду замуж за принца. Она пытается все испортить, она ведь терпеть не может красоты, добра и великолепия.</p><p class="p1">— Довольно, Санса! — В голосе лорда Эддарда слышалось резкое нетерпение.</p><p class="p1">Арья подняла глаза:</p><p class="p1">— Прости, отец. Я была не права и прошу прощения у моей милой сестры.</p><p class="p1">Санса настолько удивилась, что на мгновение лишилась дара речи. Наконец она обрела голос:</p><p class="p1">— А как насчет моего платья?</p><p class="p1">— Быть может, я сумею отстирать его, — предположила Арья с сомнением в голосе.</p><p class="p1">— Стирка не поможет, — ответила Санса, — даже если ты будешь тереть весь день и ночь. Шелк погиб.</p><p class="p1">— Тогда я… сошью тебе новое, — сказала Арья.</p><p class="p1">Санса презрительно закинула голову:</p><p class="p1">— Ты? В сшитом тобой платье можно лишь чистить свинарник!</p><p class="p1">Отец вздохнул:</p><p class="p1">— Я позвал вас сюда не для того, чтобы вы ссорились из-за одежды. Я отсылаю вас обеих домой в Винтерфелл.</p><p class="p1">Во второй раз Санса лишилась дара речи и ощутила, как глаза ее вновь наполнились влагой.</p><p class="p1">— Ты не можешь так поступить, — сказала Арья.</p><p class="p1">— Пожалуйста, отец, — наконец выдавила Санса. — Пожалуйста, не надо.</p><p class="p1">Лорд Старк почтил дочерей усталой улыбкой:</p><p class="p1">— Наконец-то вы сошлись хоть на чем-то.</p><p class="p1">— Я не сделала ничего плохого, — принялась умолять Санса. — Я не хочу возвращаться.</p><p class="p1">Ей нравилось в Королевской Гавани пышное великолепие двора, лорды и леди в шелке, бархате и драгоценных камнях, огромный город, полный людей. Турнир оказался самым волшебным событием во всей ее жизни. А сколько она еще не видела: пиршества в честь урожая, бала-маскарада, представления кукольников. Она просто не могла представить себе, что лишится всего этого.</p><p class="p1">— Отошли Арью. Она начала ссору, отец. Клянусь тебе, я буду хорошей. Разреши мне остаться, и я обещаю стать изящной, благородной и любезной, как королева.</p><p class="p1">Рот отца странно дернулся.</p><p class="p1">— Санса, я отсылаю вас не из-за ваших ссор, хотя боги ведают, как я устал от них. Я хочу, чтобы вы вернулись в Винтерфелл ради вашей же собственной безопасности. Трех моих людей зарезали как собак не далее чем в лиге от места, где мы сейчас сидим, и что делает Роберт? Он уезжает на охоту!</p><p class="p1">Арья как всегда по-дурацки закусила губу.</p><p class="p1">— А можно ли взять с нами Сирио?</p><p class="p1">— Кому нужен твой дурацкий учитель танцев? — вспыхнула Санса. — Папа, я только сейчас вспомнила, я ведь не могу уехать, потому что должна выйти замуж за принца Джоффри. — Собравшись с духом, она улыбнулась. — Я люблю его, папа, я на самом деле люблю его — как королева Нейерис любила принца Эйемона, Рыцаря-дракона, как Джонквиль любила сира Флориана. Я хочу стать его королевой и рожать ему детей…</p><p class="p1">— Милая моя, — проговорил отец мягко. — Послушай меня. Когда ты подрастешь, я подыщу тебе суженого среди знатных лордов, человека, достойного тебя, отважного, благородного и сильного. А твое обручение с Джоффри было ужасной ошибкой. Этот мальчишка — не принц Эеймон, поверь мне.</p><p class="p1">— Это не так, — принялась настаивать Санса. — Я не хочу никаких отважных и благородных, я хочу только его! Мы будем такими счастливыми, как поют в песнях, ты увидишь. У меня родится сын с золотыми волосами, и однажды он станет королем всей страны, самым величайшим, отважным как волк, гордым как лев.</p><p class="p1">Арья скривилась:</p><p class="p1">— Только если его отцом не будет Джоффри, он — трусливый лжец, и к тому же он олень, а не лев.</p><p class="p1">Санса ощутила, как слезы подступили к ее глазам.</p><p class="p1">— Это не так! Он совсем не похож на старого пьяницу короля, — закричала она на сестру, забывшись в своем горе.</p><p class="p1">Отец странными глазами поглядел на дочерей.</p><p class="p1">— Боги, — воскликнул он негромко, — устами младенца… — и позвал септу Мордейн, а девочкам сказал: — Я найму быструю торговую галею, которая доставит вас домой. В эти дни море безопаснее Королевского тракта. Вы отправитесь домой, как только я отыщу нужный корабль, вместе с септой Мордейн и подобающей вам охраной… и — ладно — вместе с Сирио Форелем, если он согласится поступить на мою службу. Но никому не говорите об этом! Лучше, чтобы никто не знал о наших планах. Мы поговорим обо всем завтра.</p><p class="p1">Санса рыдала, спускаясь следом за септой Мордейн по ступенькам. Всего ее лишили: и турниров, и двора, и принца. Они вернутся назад, в серые стены Винтерфелла, которые вновь замкнут ее. Жизнь ее закончилась, еще не начавшись.</p><p class="p1">— Прекрати плакать, дитя, — сурово сказала септа Мордейн. — Я не сомневаюсь, что твой лорд-отец прекрасно знает, что для тебя лучше.</p><p class="p1">— Вообще-то не так уж и плохо, — сказала Арья. — Мы поплывем на галее. Новое приключение, а потом мы вернемся к Брану и Роббу, старой Нэн, Ходору и всем остальным. — Она прикоснулась к руке сестры.</p><p class="p1">— К Ходору! — завопила Санса. — Тебе надо жениться на Ходоре, ты такая же глупая, волосатая и уродливая! — Вырвав руку, она бросилась в свою опочивальню и закрыла за собой дверь.</p></span>
