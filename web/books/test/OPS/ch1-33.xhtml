<span id="id31"><div class="title2">
<p class="p">Эддард</p>
</div><p class="p1">— Я сам отстоял по нему панихиду, — проговорил сир Барристан Селми, и они поглядели на тело, лежавшее в задней части повозки. — У него никого здесь не было. Говорят, в Долине осталась мать.</p><p class="p1">В бледных лучах рассвета молодой рыцарь казался уснувшим. Он не был красив, но смерть сгладила грубые черты, а Молчаливые Сестры облачили его в лучшую бархатную рубаху с высоким воротником, закрывшим рану, оставленную пикой на его горле. Эддард Старк поглядел на лицо и подумал, что этот мальчик, наверное, умер из-за него. Знаменосец Ланнистеров убил его прежде, чем Нед успел поговорить с юношей. Неужели это простое совпадение? Он понял, что никогда не узнает этого.</p><p class="p1">— Хью пробыл сквайром Джона Аррена четыре года, — проговорил Селми. — Король произвел его в рыцари в память Джона до того, как мальчишка уехал на север. Он отчаянно добивался этого звания, но, увы, не был готов к нему.</p><p class="p1">Нед в ту ночь спал скверно и ощущал, что навалившаяся не по годам усталость одолевает его.</p><p class="p1">— Никто из нас не бывает готов, — проговорил он.</p><p class="p1">— К посвящению в рыцари?</p><p class="p1">— К смерти. — Нед аккуратно укрыл мальчика плащом, между полумесяцев на синем атласе проступало кровавое пятно. Когда мать спросит, как погиб ее сын, с горечью подумал он, ей ответят, что он сражался на турнире в честь десницы короля, Эддарда Старка.</p><p class="p1">Бессмысленная смерть. Войну нельзя превращать в игру. Нед повернулся к женщине, стоявшей возле повозки. Серые одежды прятали и тело ее, и лицо, все, кроме глаз. Молчаливые Сестры готовили людей к могиле, но увидеть лицо смерти значило навлечь на себя неудачу.</p><p class="p1">— Отошлите его доспехи в Долину. Они понадобятся матери.</p><p class="p1">— Панцирь его стоит достаточно сребреников, — проговорил сир Барристан. — Мальчик заказал броню специально для турнира. Работа простая, но добротная. Даже не знаю, заплатил ли он кузнецу.</p><p class="p1">— Он заплатил вчера, милорд, и заплатил дорого, — заметил Нед. А Молчаливой Сестре указал: — Отошлите панцирь матери, я улажу отношения с оружейником. — Она склонила голову.</p><p class="p1">Потом сир Барристан направился с Недом в Королевский павильон. Лагерь начинал шевелиться. Жирные сосиски шипели и плевались над очагами, в воздухе пахло перцем и чесноком. Молодые сквайры забе́гали по поручениям, отданным проснувшимися хозяевами; они зевали и потягивались, встречая день. Слуга, державший под мышкой гуся, преклонил колено, завидев их.</p><p class="p1">— Милорды, — пробормотал он; гусь тем временем гоготал и щипал его за пальцы.</p><p class="p1">Щиты, выставленные у шатров, говорили о своих владельцах: серебряный орел Сигарда, соловьи Брайса Карона, гроздья винограда Редвинов, щетинистый вепрь, красный бык, горящее дерево, белый баран, тройная спираль, пурпурный единорог, пляшущая дева, черная гадюка, двойные башни, филин и, наконец, чисто-белые щиты Королевской гвардии, отражавшие лучи рассвета…</p><p class="p1">— Король намеревается принять участие в общей схватке, — проговорил сир Барристан, проезжая мимо щита сира Меррина, на котором осталась глубокая царапина, нанесенная копьем сира Лораса, выбросившим рыцаря из седла.</p><p class="p1">— Да, — ответил Нед мрачно. Джори разбудил его ночью, чтобы известить о новости.</p><p class="p1">Нечего удивляться, что он спал так скверно.</p><p class="p1">Сир Барристан выглядел обеспокоенным.</p><p class="p1">— Говорят, что ночные красотки с рассветом теряют свою красоту, а вино отрекается от своих детей в свете утра…</p><p class="p1">— Так говорят, — согласился Нед, — но о Роберте этого не скажешь. — Другие могли бы отречься от слов, выкрикнутых в пьяном угаре, но Роберт Баратеон запомнит их и не отступит.</p><p class="p1">Павильон короля стоял возле воды, и наползавший с реки утренний туман окутывал его серыми клочьями. Сооруженный из золотистого шелка, он представлял собой самое большое и величественное сооружение в лагере. Возле входа стоял боевой молот — рядом с колоссальным щитом, украшенным коронованным оленем дома Баратеонов.</p><p class="p1">Нед надеялся найти короля спящим после выпитого вина. Но удача оставила его: Роберт уже встал и пил пиво из полированного рога, высказывая при этом неудовольствие двоим молодым сквайрам, пытавшимся упаковать его тело в броню.</p><p class="p1">— Светлейший государь, — проговорил один из них едва ли не сквозь слезы, — панцирь вам мал. Он не подходит вам. — Рука его дрогнула, и воротник, который он пытался пристроить вокруг толстой шеи Роберта, упал на землю.</p><p class="p1">— Седьмое пекло! — выругался Роберт. — Неужели мне придется делать это самому! Подберите, засранцы… Не стой, Лансель! Не стой с открытым ртом, подбирай! — Парнишка торопливо оглянулся, и король заметил Неда. — Погляди-ка на этих олухов, Нед. Моя жена настояла, чтобы я взял эту парочку сквайрами, а от них нет никакого толка. Не умеют даже одеть человека в его собственный панцирь и еще называют себя сквайрами! А я говорю, что они свинопасы, одетые в шелка!</p><p class="p1">Неду хватило одного взгляда, чтобы понять причину всех сложностей.</p><p class="p1">— Мальчишки не виноваты, — сказал он королю. — Ты слишком растолстел для этих доспехов, Роберт.</p><p class="p1">Роберт Баратеон хорошенько глотнул пива, бросил опустевший рог на меховое покрывало, вытер рот тыльной стороной руки и мрачно буркнул:</p><p class="p1">— Растолстел? Это я-то? Разве так положено разговаривать с королем? — Внезапный хохот налетел бурей. — Ах, проклятие, Нед, объясни мне, ну почему ты всегда бываешь прав?</p><p class="p1">Сквайры нервно заулыбались, когда король повернулся к ним.</p><p class="p1">— Эй вы. Да, оба! Вы слыхали слова десницы. Король слишком толст для его панциря. Ступайте за сиром Ароном Сантагаром. Скажите ему, что мне необходимо срочно расставить нагрудную пластину. Живо! Чего вы ждете?</p><p class="p1">Наталкиваясь друг на друга, мальчишки поспешили выбраться из шатра. Роберт сохранял на лице своем деланный гнев, пока они не ушли. А потом опустился в кресло и зашелся в хохоте.</p><p class="p1">Сир Барристан Селми похихикал вместе с ним, даже Эддард Старк умудрился улыбнуться. На него, как всегда, словно тучи наползали серьезные думы. Он успел разглядеть сквайров: симпатичные мальчишки, светловолосые и хорошо сложенные. Один, кудрявый и золотоволосый, был ровесником Сансы, другой, наверное, пятнадцатилетний, с песчаными волосами и тонкими усиками, глядел на мир изумрудно-зелеными глазами королевы.</p><p class="p1">— Хотелось бы мне увидеть сейчас лицо Сантагара, — проговорил Роберт. — Надеюсь, что у него хватит ума отослать их к кому-нибудь еще. Надо бы заставить их побегать весь день.</p><p class="p1">— А кто эти ребята? — спросил его Нед. — Родня Ланнистерам?</p><p class="p1">Роберт кивнул, вытирая слезы с глаз.</p><p class="p1">— Кузены, сыновья брата лорда Тайвина. Одного из покойных братьев. А может быть, и здравствующего, не помню. У моей жены слишком уж большое семейство, Нед.</p><p class="p1">И весьма честолюбивое, подумал Нед. Он не стал ничего говорить, но его встревожило то, что Роберт и ночью и днем окружен родней королевы. Жадность Ланнистеров, их любовь к должностям и почестям как будто бы не имели границ.</p><p class="p1">— Поговаривают, что вы с королевой вчера поссорились?</p><p class="p1">Физиономия Роберта мгновенно скисла.</p><p class="p1">— Эта баба попыталась запретить мне драться. Сейчас она сидит в замке. Твоя сестра никогда не опозорила бы меня таким образом!</p><p class="p1">— Ты не знал Лианну так, как я, Роберт, — ответил Нед. — Ты видел только ее красоту, но под ней таилось железо. Она сказала бы тебе, что в общей схватке тебе нечего делать.</p><p class="p1">— И ты тоже? — нахмурился король. — Старк, ты прокис. Ты слишком много лет просидел на севере, и все жизненные соки в тебе замерзли. Но в моем теле они еще бегут. — Он хлопнул себя по груди, чтобы доказать это.</p><p class="p1">— Ты король, — напомнил ему Нед.</p><p class="p1">— Я сажусь на проклятый престол, когда обязан это делать. Неужели поэтому я должен отказывать себе в том, что любит всякий мужчина? В лишнем глотке вина, в девице, что верещит в постели, в конских боках между моими ногами! Седьмое пекло, Нед, как мне хочется отлупить кого-нибудь!</p><p class="p1">Ответил ему сир Барристан Селми.</p><p class="p1">— Светлейший государь, — проговорил он. — Королю не подобает участвовать в схватке. Это не честно. Кто осмелится ударить вас?</p><p class="p1">Роберт вполне искренне удивился.</p><p class="p1">— Любой, черт побери. Пусть только сумеют! И последний оставшийся на ногах человек…</p><p class="p1">— …окажется тобой, — проговорил Нед. Он немедленно понял, что Селми попал в точку. Опасности, которые сулила общая схватка, лишь раззадоривали Роберта, но подобное соображение ранило гордость. — Сир Барристан прав. В Семи Королевствах не найдется такого человека, который рискнул бы поднять на тебя руку.</p><p class="p1">Король поднялся на ноги, побагровев.</p><p class="p1">— Ты хочешь сказать, что эти брыкучие трусы позволят мне победить?</p><p class="p1">— Безусловно, — отвечал Нед. Сир Барристан Селми склонил свою голову в безмолвном согласии.</p><p class="p1">На мгновение Роберт разгневался настолько, что даже не смог заговорить. Король метнулся в угол шатра, резко повернулся и зашагал обратно с мрачным и гневным лицом. Подхватив с земли нагрудную пластину панциря, он запустил ею в Барристана Селми, по-прежнему не находя слов от ярости. Селми уклонился.</p><p class="p1">— Убирайтесь, — сказал король холодным голосом. — Убирайтесь, пока я не убил вас.</p><p class="p1">Сир Барристан заторопился к выходу. Нед уже собрался последовать за ним, когда король вновь позвал его:</p><p class="p1">— А ты останься, Нед.</p><p class="p1">Нед повернул назад. Роберт вновь взял рог, наполнил его пивом из бочонка в углу и протянул Неду.</p><p class="p1">— Пей, — сказал он отрывисто.</p><p class="p1">— Я не хочу…</p><p class="p1">— Пей. Король приказывает.</p><p class="p1">Нед приложился к рогу. Черное густое пиво оказалось настолько крепким, что у него защипало глаза.</p><p class="p1">Роберт сел.</p><p class="p1">— Проклятие на твою голову, Нед Старк. На твою и Джона Аррена, я любил вас обоих, и что же вы со мной сделали? Это тебе нужно было становиться королем, тебе или Джону.</p><p class="p1">— У тебя было больше прав, светлейший.</p><p class="p1">— Я велел тебе пить, а не спорить. Раз ты сделал меня королем, так по крайней мере потрудись любезно слушать, пока я говорю, черт побери. Погляди на меня, Нед. Видишь, что сделала из меня эта королевская власть? Боги, я слишком разжирел для своего панциря. Как могло дойти до такого позора?</p><p class="p1">— Роберт…</p><p class="p1">— Пей и молчи, пока король говорит. Клянусь тебе, я никогда не чувствовал себя таким живым, когда добивался этого престола, и таким мертвым после того, как занял его. А Серсея… За нее я должен отблагодарить Джона Аррена. Я не хотел жениться после того, как у меня отняли Лианну. Но Джон заявил, что государство нуждается в наследнике и Серсея Ланнистер составит для меня хорошую пару. Он уверял меня, что она привяжет ко мне лорда Тайвина, на случай, если Визерис Таргариен когда-нибудь попытается вернуть престол своего отца. — Король покачал головой. — Я любил этого старика, клянусь, но теперь думаю, что он был бо́льшим дураком, чем мой Лунатик. Серсея красива, это так, но она холодна… а как стережет свою щель! Можно подумать, что у нее между ног спрятано все золото Бобрового утеса. Эй, дай-ка сюда это пиво, если ты не хочешь пить его. — Король опустошил рог, перевернул его, рыгнул, вытер рот. — Поверь, Нед, мне действительно жаль твою девочку. Это я о волке. Мой сын лгал, клянусь в этом душой. Мой сын… ты своих детей любишь, так?</p><p class="p1">— Всем сердцем, — отвечал Нед.</p><p class="p1">— Тогда я открою тебе секрет. Много раз я мечтал отказаться от короны. Уехал бы на корабле в Вольные Города, взял бы с собой молот и проводил время в стычках или со шлюхами, для этого я и создан. Король-наемник, как полюбили бы меня певцы! И знаешь, что меня останавливает? Мысль о том, что Джоффри окажется на моем троне, а Серсея будет из-за спины нашептывать ему на ухо. Мой сын… Как я мог сделать такого, а, Нед?</p><p class="p1">— Он всего лишь мальчишка, — неловко ответил Нед. Принца Джоффри он недолюбливал, но в голосе Роберта слышалась истинная боль. — Неужели ты забыл, каким дикарем был в его возрасте?</p><p class="p1">— Я бы не беспокоился, если бы мальчишка был дикарем. Ты же не знаешь его так, как я. — Король вздохнул и покачал головой. — К тому же, возможно, ты прав. Джон часто бывал недоволен мной, однако же я вырос и сделался добрым королем. — Роберт поглядел на Неда, хмурясь его молчанию. — Мог бы уже сказать слово и согласиться со мной, мог бы!</p><p class="p1">— Светлейший… — начал Нед, выбирая слова.</p><p class="p1">Роберт хлопнул Неда по спине.</p><p class="p1">— Ладно, скажи просто, что я лучший король, чем Эйерис, и закончим на этом. Ты никогда не умел лгать ни ради любви, ни ради чести, Нед Старк. Я еще молод, и теперь, когда ты вновь рядом со мной, все переменится. Мы сделаем мое правление таким, что о нем будут петь, и пусть Ланнистеры убираются в седьмое пекло. Ветчиной пахнет. А как ты думаешь, кто победит сегодня? Ты видел парня Мейса Тирелла? Его зовут рыцарь Цветов. Вот это сын, истинная гордость своего отца! На последнем турнире он сбросил Цареубийцу на землю — прямо на золоченую задницу! Видел бы ты выражение на лице Серсеи… Я хохотал, пока не заломило в боках. Ренли утверждает, что у него есть сестра, четырнадцатилетняя девочка, прекрасная, как рассвет…</p><p class="p1">Они позавтракали возле реки на раскладном столе черным хлебом, вареными гусиными яйцами и рыбой, поджаренной на луке с беконом. Меланхолия короля улетучилась вместе с утренним туманом, и, приступив к апельсину, Роберт уже размяк и принялся вспоминать об утре в Орлином Гнезде, когда они были мальчишками…</p><p class="p1">— …и подарил Джону бочонок апельсинов? Только они сгнили и я бросил один через стол, угодив прямо в физиономию Даккса. Помнишь сквайра Редфорда с изрытым оспой лицом? Он бросил в меня другим, и пока Джон решал, что делать, апельсины залетали по всему чертогу во все стороны! — Он громогласно расхохотался, и даже Нед улыбнулся воспоминанию.</p><p class="p1">Это был тот мальчишка, с которым он рос, это был тот самый Роберт Баратеон, которого он знал и любил. И если он сумеет доказать, что Ланнистеры подстроили нападение на Брана, что именно они убили Джона Аррена, этот человек поверит ему. Тогда Серсея падет, а вместе с ней и Цареубийца, ну а если лорд Тайвин осмелится поднять Запад, Роберт раздавит его, как раздавил он Рейегара Таргариена у Трезубца. Все было ясно.</p><p class="p1">Завтрак этот показался Неду вкуснее всех трапез за последнее время, и вскоре лорд Старк заулыбался. А потом настало время турнира.</p><p class="p1">Нед отправился вместе с королем на поле сражения. Он обещал посмотреть финальные схватки вместе с Сансой. Септа Мордейн, как выяснилось, прихворнула, а дочь не хотела пропустить конца состязаний. Увидев Роберта на своем месте, он отметил, что Серсея Ланнистер решила не появляться; место возле короля оказалось свободным. Этот факт также вселил в Неда некоторые надежды.</p><p class="p1">Он протолкался к месту, где сидела дочь, как раз когда затрубили трубы, объявляя о первой схватке. Санса была настолько увлечена, что не сразу заметила появление отца.</p><p class="p1">Первым выехал Сандор Клиган в оливково-зеленом плаще, прикрывающем серо-пепельный панцирь. Лишь шлем в виде собачьей головы украшал доспех.</p><p class="p1">— Сотня золотых драконов на Цареубийцу, — объявил громко Мизинец, когда появился Джейме Ланнистер на элегантном чистокровном гнедом. Конь был покрыт позолоченной кольчужной попоной. Джейме сверкал с головы до ног. Даже пика его была изготовлена из золотого дерева, доставленного с Летних островов.</p><p class="p1">— По рукам, — отвечал лорд Ренли. — Нынешним утром Пес кажется мне голодным.</p><p class="p1">— Всякий голодный пес знает, что лучше не кусать руку, которая кормит его, — сухо отозвался Мизинец.</p><p class="p1">Сандор Клиган с громким лязгом уронил забрало и занял свое место. Сир Джейме послал воздушный поцелуй какой-то женщине среди простонародья, мягко опустил забрало и выехал на конец дорожки. Оба рыцаря опустили копья.</p><p class="p1">Неду Старку хотелось бы, чтобы проиграли оба, но Санса смотрела на них, блестя от волнения глазами. Сооруженная на скорую руку галерея затряслась, когда лошади перешли в галоп. Пес наклонился вперед, копье его ровно покачивалось, но Джейме чуть изменил положение в мгновение, предшествующее удару. Острие копья Клигана лишь скользнуло по золотому щиту с изображением льва, а сам Ланнистер точно попал в щит Пса. Дерево треснуло, Клиган пошатнулся, пытаясь удержаться в седле. Санса охнула. Неровный ропот пробежал по толпе.</p><p class="p1">— На что мне лучше потратить ваши деньги, милорд? — обратился Мизинец к Ренли.</p><p class="p1">Пес ухитрился усидеть в седле. Он развернул своего коня и направился к загородке для второй схватки. Ланнистер бросил сломанное копье и подхватил новое, успев обменяться шутками со сквайром. Пес бросился вперед жестким галопом, Ланнистер спокойно скакал навстречу. На этот раз, когда Джейме изменил позу, Сандор Клиган повторил его движение. Пики разлетелись в щепки, и когда обломки опустились на землю, лишившийся ездока кровный гнедой отправился пощипать травку, а сир Джейме Ланнистер повалился в грязь в своей золотой, но уже помятой броне.</p><p class="p1">Санса проговорила:</p><p class="p1">— Я знала, что Пес победит…</p><p class="p1">Мизинец услыхал ее.</p><p class="p1">— Если вы знаете, кто победит во втором поединке, скажите об этом сейчас, прежде чем Ренли успеет раздеть меня догола, — обратился он к Сансе, и Нед улыбнулся.</p><p class="p1">— Жаль, что с нами нет Беса, — заметил лорд Ренли, — тогда я выиграл бы в два раза больше.</p><p class="p1">Джейме Ланнистер был уже на ногах, но при падении пышный львиный шлем его повернулся, смялся и не желал сниматься с головы. Простолюдины улюлюкали и тыкали пальцами, но Нед слышал громовой хохот короля Роберта, заглушавший все прочие голоса. В конце концов слепому и спотыкающемуся Ланнистеру пришлось отправиться к кузнецу.</p><p class="p1">К этому времени сир Григор Клиган уже оказался в своем углу ограждения. Эддард Старк еще не видел столь высокого рыцаря. Роберт Баратеон и его братья — люд рослый, как, впрочем, и Пес, да и у него самого в Винтерфелле остался конюх по имени Ходор, рядом с которым все выглядели малышами. Но рыцарь, которого звали Скачущей Горой, возвышался бы и над Ходором. В нем было футов восемь, руки казались стволами небольших деревьев. Рослый верховой конь превратился в пони между его облаченных в железо ног, пика в его руках напоминала ручку метлы. В отличие от своего брата сир Григор жил не при дворе. Он вел уединенную жизнь и оставлял собственные земли разве что ради войн и турниров. Он находился возле лорда Тайвина во время падения Королевской Гавани, тогда юному рыцарю было всего лишь семнадцать лет, но он уже прославился — ростом и невозмутимой свирепостью. Утверждали, что именно Григор разбил о стену голову младенца Эйегона Таргариена; поговаривали, что потом он изнасиловал его мать, дорнийскую принцессу Элию, прежде чем зарубить ее. Обо всем этом при Григоре не вспоминали.</p><p class="p1">Нед Старк не помнил, чтобы когда-либо разговаривал с ним, хотя Григор сопутствовал им среди других рыцарей во время мятежа Беелона Грейджоя. Нед глядел на него с беспокойством. Он редко верил слухам, но о сире Григоре рассказывали весьма жуткие вещи. Говорили, что он намеревается жениться в третий раз, а в отношении причин смерти первых двух жен ходили разные слухи. Все считали замок его местом зловещим, где даже слуги исчезают без счета, а псы боятся войти в зал. Сестра его скончалась при сомнительных обстоятельствах, известно было и про пожар, который изуродовал его брата, и про несчастный случай на охоте, когда погиб отец. Григор унаследовал замок, золото и фамильное достояние. Его младший брат Сандор в тот же самый день покинул замок, чтобы поступить наемником к Ланнистерам; утверждали, что он ни разу не заехал в родной дом даже с коротким визитом.</p><p class="p1">Когда рыцарь Цветов появился у входа, по толпе пробежал шум и лорд Старк услышал лихорадочный шепот Сансы:</p><p class="p1">— О, как он прекрасен. — Стройное, как тростник, тело сира Лораса Тирелла прикрывала сказочная серебряная броня, отполированная до зеркального блеска и украшенная переплетенными виноградными лозами и крохотными голубыми незабудками. Чернь успела заметить, что лепестки цветов выложены сапфирами, и вздох вырвался из тысячи глоток. На плечах юноши висел тяжелый плащ, сотканный тоже из незабудок — на этот раз настоящих: сотни свежих цветов были нашиты на плотную шерстяную материю.</p><p class="p1">Лошадь его была стройна, как и сам наездник, это была прекрасная серая кобыла, словно созданная для быстрой езды. Почуяв ее запах, огромный жеребец сира Григора заржал. Мальчишка из Хайгардена шевельнул ногами, и его лошадь метнулась вперед, легкая как плясунья. Санса вцепилась в руку Неда.</p><p class="p1">— Отец, пусть сир Григор не ранит его, — проговорила она. Нед заметил на платье дочери розу, которую вчера подарил ей сир Лорас. Джори рассказал ему об этом.</p><p class="p1">— Это турнирные пики, — объяснил он дочери. — При столкновении они ломаются, ран не бывает. — Однако Нед помнил мальчика в телеге, прикрытого плащом с полумесяцами…</p><p class="p1">Сир Григор с трудом управлялся с конем. Жеребец ржал, бил копытом и тряс головой. Гора лягнул животное кованым сапогом — лошадь взвилась и едва не сбросила его.</p><p class="p1">Рыцарь Цветов отдал салют королю, направился в дальний конец арены и взял копье на изготовку. Сир Григор вывел жеребца на линию, пытаясь сдержать его уздой. Тут все началось. Конь Горы сорвался в тяжелый галоп, навстречу ему потоком шелка текла кобыла. Сир Григор выставил вперед щит и копье, одновременно стараясь удержать непокорного коня, и вдруг Лорас Тирелл оказался рядом, острие его копья ударило именно в нужное место, и в мгновение ока Гора рухнул на землю, повалив и коня грудой стали и плоти.</p><p class="p1">Нед услышал аплодисменты, восторженные крики, свист, восклицания, взволнованный шепот, но громче всего скрежетал хриплый хохот Пса. Рыцарь Цветов отправился на конец арены. Пика его даже не расщепилась. Сапфиры мерцали на солнце, и он, улыбаясь, поднял свое забрало. Простонародье обезумело.</p><p class="p1">Сир Григор Клиган выбрался посреди поля из-под коня и, кипя яростью, вскочил на ноги. Сорвав шлем, он хлопнул им о землю. Лицо его потемнело от гнева, а волосы посыпались на глаза.</p><p class="p1">— Меч! — крикнул он сквайру, и мальчишка подбежал к нему с оружием. К этому времени конь Григора тоже поднялся на ноги.</p><p class="p1">Григор Клиган убил коня одним ударом — настолько мощным, что наполовину перерубил шею животного. Крики восторга в одно сердцебиение превратились в панические вопли. Жеребец упал на колени и, заржав, умер. К этому времени Григор уже шагал по дорожке в сторону сира Лораса Тирелла, зажав в руке окровавленный меч.</p><p class="p1">— Остановите его! — закричал Нед, но голос его потерялся в реве толпы. Все вокруг вопили, Санса плакала.</p><p class="p1">Все случилось так быстро… Рыцарь Цветов еще только крикнул, чтобы ему подали меч, когда сир Григор отбросил в сторону его сквайра и схватил за поводья. Кобыла почуяла кровь и взвилась на дыбы. Сир Лорас удержался в седле, но с трудом. Размахнувшись двуручным мечом, сир Григор нанес жестокий удар, угодивший юноше в грудь и выбросивший его из седла. Лошадь в панике бросилась в сторону, а оглушенный сир Лорас повалился в грязь. Но когда Григор занес свой меч для убийственного удара, скрежещущий голос остановил его:</p><p class="p1">— Пусть живет! — И облаченная в сталь рука отвела меч от мальчика.</p><p class="p1">Гора повернулся в безмолвной ярости и замахнулся уже со всей своей силой, но Пес перехватил удар и отвел его. Тут два брата схватились и, казалось, целую вечность молотили друг друга, пока ошеломленному Лорасу Тиреллу помогали уйти в безопасное место. Трижды Нед видел, как сир Григор направлял свирепые удары в шлем с песьей головой, а Сандор оставил не один порез на незащищенном лице брата.</p><p class="p1">Прекратил драку голос короля… Голос короля и двадцать мечей. Джон Аррен всегда говорил, что голос предводителя войска должен быть слышен на всем поле боя, и Роберт доказал справедливость этих слов еще на Трезубце. Прибегнув к этому способу, он прогремел:</p><p class="p1">— Прекратите это безумие. Именем короля!</p><p class="p1">И Пес преклонил колено. Удар сира Григора вспорол воздух, и он наконец пришел в себя. Григор выронил меч, яростно поглядел на Роберта, окруженного Королевской гвардией и дюжиной рыцарей и стражников. Не говоря более ни слова, он направился прочь, оттолкнув с пути Барристана Селми.</p><p class="p1">— Пусть уходит, — проговорил Роберт, и все сразу закончилось.</p><p class="p1">— Так, значит, Пес теперь чемпион?<a href="ch2.xhtml#id13" class="a">[10]</a> — спросила Санса у Неда.</p><p class="p1">— Нет, — отвечал он. — Будет еще один финальный поединок, между Псом и рыцарем Цветов.</p><p class="p1">Тем не менее Санса оказалась права. Несколько мгновений спустя сир Лорас Тирелл вышел на поле в простом льняном дублете и сказал Сандору Клигану:</p><p class="p1">— Я обязан вам жизнью, день принадлежит вам, сир!</p><p class="p1">— Я не сир, — ответил Пес, но тем не менее принял победу и чемпионскую награду и, быть может, впервые за свою жизнь, признание народа. Его приветствовали, когда он оставил арену, чтобы возвратиться в свой павильон.</p><p class="p1">Тогда Нед вместе с Сансой в компании Мизинца, лорда Ренли и кое-кого еще направились на поле для стрелков.</p><p class="p1">— Тирелл, конечно, знал, что кобыла его была в поре, — говорил Мизинец. — Клянусь, мальчишка все продумал заранее. А Григор всегда выбирает огромных злых жеребцов, у которых больше свирепости, чем разума.</p><p class="p1">Мысль эта как будто развлекла его. В отличие от сира Барристана Селми.</p><p class="p1">— Хитрость не приносит чести, — чопорно провозгласил старик.</p><p class="p1">— Меньше чести, да больше золота — на целых двадцать тысяч, — улыбнулся лорд Ренли.</p><p class="p1">В тот день юноша по имени Анже, простолюдин с Дорнских болот, выиграл соревнования стрелков, одолев сира Белона Свонна и Джалабхара Ксо на сотне шагов, после того как все остальные лучники отсеялись на более коротких расстояниях. Нед послал к нему Элина, чтобы предложить место в гвардии десницы, но парень, еще не остывший от вина, победы и не снившихся прежде богатств, отказался. Общая схватка затянулась на три часа. В ней приняли участие почти сорок человек. Свободные всадники, засечные рыцари и свежеиспеченные сквайры, стремившиеся добиться репутации, дрались тупым оружием посреди грязи и крови, маленькие отряды съезжались, рубились, сражались между собой и друг против друга, чего требовали создающиеся и тут же разрушающиеся скоротечные альянсы; наконец на коне остался лишь один из сражавшихся. Победителем оказался красный жрец Торос из Мира, бритоголовый безумец, бившийся сверкающим мечом.</p><p class="p1">Ему уже приходилось выигрывать общую схватку, огненный меч пугал коней, самого же Тороса ничто испугать не могло. К итогам сражения можно было отнести три сломанные конечности, перебитую ключицу, дюжину раздавленных пальцев; двух коней пришлось прирезать, а порезам, ушибам и синякам не было числа. Нед был отчаянно рад тому, что Роберт не принял участия в схватке.</p><p class="p1">Вечером на пиру Эддард Старк испытал новый прилив надежды: Роберт находился в хорошем настроении, Ланнистеров нигде не было видно, и даже дочери вели себя хорошо. Джори привел Арью, и Санса говорила с сестрой вполне вежливо.</p><p class="p1">— Турнир был великолепен, — вздохнула она. — Тебе надо было посмотреть. А как ты поплясала?</p><p class="p1">— Все тело болит, — отозвалась Арья, с удовлетворением предъявляя огромный пурпурный синяк на ноге.</p><p class="p1">— Должно быть, ты ужасно танцуешь, — с сомнением проговорила Санса.</p><p class="p1">Потом, пока Санса слушала труппу певцов, исполнявших сложное рондо из переплетенных баллад, именуемое Пляской драконов, Нед сам осмотрел синяк.</p><p class="p1">— Надеюсь, Форель не слишком сурово обходится с тобой, — сказал он.</p><p class="p1">Арья встала на одну ногу. Это удалось ей куда легче, чем прежде.</p><p class="p1">— Сирио утверждает, что всякая ссадина — это урок, а каждый урок идет на пользу.</p><p class="p1">Нед нахмурился. Этот Сирио Форель предъявил великолепные характеристики, ну а его пышный браавосианский стиль прекрасно подходил к тонкому клинку Арьи, и все же… Несколько дней назад она ходила повсюду с полоской темного шелка, завязанной на глазах. Сирио учит ее видеть ушами, носом и кожей, объяснила она. А перед этим он учил ее кружиться и делать сальто назад.</p><p class="p1">— Арья, а ты уверена, что хочешь именно этого?</p><p class="p1">Она кивнула:</p><p class="p1">— А завтра мы идем ловить кошек.</p><p class="p1">— Кошек? — вздохнул Нед. — Наверное, я ошибся, наняв этого браавосийца. Если хочешь, я попрошу Джори заняться с тобой. Можно даже переговорить с сиром Барристаном, в молодости он был лучшим мечом во всех Семи Королевствах.</p><p class="p1">— Они не нужны мне, — отвечала Арья. — Я хочу Сирио.</p><p class="p1">Нед провел пальцами по волосам. Любой пристойный фехтовальщик мог научить Арью началам боя без этой чуши; без повязок, сальто, стояния на одной ноге, но он знал свою младшую дочь и успел убедиться, что спорить с ней бесполезно.</p><p class="p1">— Ну, как ты хочешь, — сказал он. Безусловно, когда-нибудь это ей надоест. — Старайся быть осторожной.</p><p class="p1">— Обязательно, — обещала она, перепрыгивая с правой ноги на левую.</p><p class="p1">Поздно ночью Нед проводил девочек через город и уложил их в постель. Оставив Сансу наедине с ее мечтами, а Арью с синяками, Нед поднялся в собственные палаты на вершине башни Десницы. День выдался теплым, и в комнате было душно и жарко. Нед подошел к окну и приоткрыл тяжелые ставни, чтобы впустить прохладный ночной воздух. На противоположной стороне Великого двора в окне Мизинца горели свечи. Время уже перевалило за полночь. Веселье у реки едва начинало затихать.</p><p class="p1">Нед извлек кинжал и принялся изучать его. Клинок Мизинца, выигранный на пари Тирионом Ланнистером, посланный, чтобы убить Брана во сне. Почему? Зачем карлику понадобилась смерть Брана? Зачем вообще кто-то захотел покуситься на его жизнь?</p><p class="p1">Кинжал и падение Брана каким-то образом связывались с убийством лорда Аррена. Нед чувствовал это нутром, но правда о смерти Джона по-прежнему оставалась столь же скрытой от него, как и прежде. Лорд Станнис не вернулся на турнир в Королевскую Гавань, Лиза Аррен хранила молчание за высокими стенами Орлиного Гнезда. Сквайр погиб, а Джори все еще обследовал публичные дома. Он располагал только бастардом Роберта.</p><p class="p1">В том, что угрюмый ученик оружейника является сыном короля, Нед не сомневался. Черты Баратеонов несомненно отпечатались на его лице, скулах, глазах, черных волосах. Ренли был еще слишком молод, чтобы сын его мог достичь такого возраста, холодный Станнис замкнулся в своей гордости, поэтому Джендри, безусловно, сын Роберта.</p><p class="p1">Но что же он узнал, обнаружив мальчика? По Семи Королевствам король оставил немало детей. Он открыто признал одного из своих бастардов: мальчика в возрасте Брана, рожденного от знатной матери. Парнишку воспитывал кастелян лорда Ренли в Штормовом Пределе.</p><p class="p1">Нед вспомнил первое дитя Роберта, дочь, родившуюся в Долине, когда Роберт был, по сути дела, мальчишкой. Такая милая крохотная девчонка. Молодому лорду Штормового Предела ребенок понравился, Роберт ежедневно заходил поиграть с младенцем, даже после того, как потерял интерес к его матери. И при этом нередко прихватывал с собой для компании Неда, вне зависимости от его желания. Девочке должно исполниться семнадцать или восемнадцать; она теперь старше, чем был Роберт, когда она родилась. Странная мысль. Подобные связи мужа, естественно, не радовали Серсею, но в конце концов какая разница — один бастард у короля или сотня? Закон и обычай не предоставляли незаконнорожденным особых прав. Ни Джендри, ни девушка из Долины, ни мальчик из Штормового Предела не представляли опасности для законных детей Роберта.</p><p class="p1">Размышления Неда прервал негромкий стук в дверь.</p><p class="p1">— К вам человек, милорд, — доложил Харвин. — Он не хочет называть свое имя.</p><p class="p1">— Впустите, — произнес Нед удивленно. Посетитель, коренастый, в потрескавшихся, покрытых грязью сапогах и тяжелом коричневом балахоне из самой грубой домотканой ткани, прятал свое лицо под капюшоном, а руки в объемистых рукавах.</p><p class="p1">— Кто вы? — спросил Нед.</p><p class="p1">— Друг, — ответил из-под капюшона низкий голос. — Нам надо поговорить наедине, лорд Старк.</p><p class="p1">Любопытство оказалось сильнее осторожности.</p><p class="p1">— Харвин, оставь нас, — сказал он.</p><p class="p1">Гость откинул капюшон, лишь когда они остались вдвоем за закрытыми дверями.</p><p class="p1">— Лорд Варис? — удивленно проговорил Нед.</p><p class="p1">— Лорд Старк, — вежливо попросил Варис усаживаясь, — не нальете ли вы мне вина?</p><p class="p1">Нед наполнил две чаши летним напитком и вручил одну из них Варису.</p><p class="p1">— Я мог бы пройти в футе от вас, но так и не узнать, — сказал он, не веря своим глазам. Он еще не видел, чтобы евнух одевался во что-нибудь, кроме шелков и бархата, самого богатого дамаскина; теперь же от этого человека разило по́том, а не пахло сиренью.</p><p class="p1">— Именно на это я и надеялся, — отвечал Варис. — Нехорошо получится, если некоторые люди узнают, что мы разговаривали наедине; королева не сводит с вас глаз. Великолепное вино, благодарю вас.</p><p class="p1">— А как вы прошли мимо остальных стражей? — спросил Нед. — Кейн дежурил у башни, а Элин на лестнице.</p><p class="p1">— В Красном замке есть пути, доступные лишь призракам и паукам. — Варис улыбнулся, извиняясь. — Я не задержу вас надолго, милорд. Есть вещи, которые вы должны знать. Теперь вы — десница короля, а король глуп. — Сладкие интонации в голосе евнуха исчезли, тонкий голос резал как нож. — Он ваш друг, я знаю это, и тем не менее он глуп… и обречен, если только вы не спасете его. Беда грозила ему сегодня. Они собирались убить короля во время схватки.</p><p class="p1">Потрясение лишило Неда дара речи.</p><p class="p1">— Кто?</p><p class="p1">Варис отпил вина.</p><p class="p1">— Если мне и в самом деле необходимо объяснять это вам, тогда вы еще больший дурак, чем Роберт, и я попал не туда.</p><p class="p1">— Ланнистеры, — проговорил Нед. — И королева… Нет, не верю. Это не Серсея. Она же просила его не участвовать в схватке!</p><p class="p1">— Она запретила ему драться перед лицом своего брата, его рыцарей и половины двора. Скажите мне откровенно, знаете ли вы более надежный способ заставить короля Роберта выехать на поле битвы? Я спрашиваю вас!</p><p class="p1">Сердце Неда заныло. Евнух попал в точку; скажите Роберту Баратеону, что он не может, не должен или не имеет права что-либо делать, и можно считать дело сделанным.</p><p class="p1">— Но если бы он выехал на поле боя, кто осмелился бы ударить короля?</p><p class="p1">Варис пожал плечами.</p><p class="p1">— На поле выехали сорок всадников. У Ланнистеров много друзей. Кто сумел бы назвать убийцу посреди всей сумятицы, лошадиного ржания и хруста костей, рядом с Торосом из Мира и его дурацким огненным мечом, если бы какой-нибудь случайный удар повалил государя? — Подойдя к бутыли, он сам наполнил свою чашу. — А потом убийца горестно припал бы к ногам покойного. Я просто слышу его рыдания и вижу скорбь. Вне сомнения, благородная и скорбная вдова пощадила бы его, подняла бы несчастного на ноги и благословила добрым поцелуем. У юного короля Джоффри тоже не осталось бы другого выхода, кроме как простить его. — Евнух провел рукой по щеке. — А может, Серсея приказала бы сиру Илину снести ему голову. Меньше риска для Ланнистеров, так почему бы не удивить своего маленького друга?</p><p class="p1">Нед ощутил, как в душе его окреп гнев.</p><p class="p1">— Вы знали о заговоре и ничего не сделали!</p><p class="p1">— Я командую шептунами, а не воинами.</p><p class="p1">— Вы должны были обратиться ко мне раньше.</p><p class="p1">— О да, конечно. И вы бросились бы прямо к королю. И как поступил бы Роберт, узнав об опасности? Как вы думаете?</p><p class="p1">Нед прикинул.</p><p class="p1">— Он проклял бы всех и выехал бы на поле, чтобы показать, что он никого не боится.</p><p class="p1">Варис развел руки.</p><p class="p1">— А теперь я сделаю еще одно признание, лорд Эддард. Мне хотелось узнать, как в этой ситуации поступите лично вы. Вы спросили, почему я не обратился к вам. Я должен ответить. Ну что ж, потому, что я не доверял вам, милорд.</p><p class="p1">— Вы не доверяли мне? — Нед был самым явным образом удивлен.</p><p class="p1">— В Красном замке обитает две разновидности людей, лорд Эддард, — проговорил Варис. — Те, что верны государству, и те, что верны лишь самим себе. До нынешнего утра я не знал, кто вы, и ждал… но теперь я знаю это. — Он напряженно улыбнулся, на мгновение лицо евнуха и носимая им прилюдно маска соединились. — Я начинаю понимать, почему королева настолько опасается вас. Да-да, в самом деле.</p><p class="p1">— Скорее ей следовало бы бояться вас, — сказал Нед.</p><p class="p1">— Нет. Я — это я. Король пользуется моими услугами, но они позорят его. Наш Роберт могучий и доблестный воин, а подобные воплощения рыцарства не любят соглядатаев, шпионов и евнухов. Если настанет день, когда Серсея шепнет ему: «Убей этого человека», — Илин Пейн снесет мне голову мановением руки… Кто тогда будет оплакивать Вариса? И на юге, и на севере песен о пауках не поют. — Он протянул к Неду влажную руку. — Но что касается меня, лорд Старк… я думаю… нет, знаю… король не убьет вас, даже ради своей королевы, и в этом может быть наше спасение.</p><p class="p1">Какое-то мгновение Эддард Старк чувствовал одно желание: возвратиться в свой Винтерфелл, к чистой простоте севера, где врагами были зима и одичалые, обитающие за Стеной.</p><p class="p1">— Но у Роберта, безусловно, есть еще верные друзья, — возразил он. — Его братья, его…</p><p class="p1">— …жена? — договорил за него Варис, обрезав улыбкой. — Братья ненавидят Ланнистеров, это верно, но между ненавистью к королеве и любовью к королю есть большая разница, так? Сир Барристан любит свою честь, великий мейстер Пицель любит свое дело… а Мизинец любит Мизинца.</p><p class="p1">— А Королевская гвардия?</p><p class="p1">— Бумажный щит, — ответил евнух. — Попытайтесь не обнаруживать свое потрясение, лорд Старк. Джейме Ланнистер присягнул на верность братству Белых Мечей, но все мы знаем, какова цена его клятве. Времена, когда мужи, подобные Райему Редвину и принцу Эйемону, Рыцарю Дракона, носили белый плащ, рассыпались в прах и ушли в песни. Из всех семерых лишь сир Барристан ковался из истинной стали, но Селми стар. Сир Борос и сир Меррин до мозга костей верны королеве, и я испытываю глубокие сомнения в отношении остальных. Нет, милорд, когда дело воистину дойдет до мечей, вы окажетесь единственным истинным другом, на которого сможет рассчитывать Роберт Баратеон.</p><p class="p1">— Надо предупредить Роберта, — сказал Нед. — Если вы говорите правду, даже часть ее, то король должен узнать все.</p><p class="p1">— И какие же доказательства мы предъявим ему? Мои слова против их слов? Песни моих пташек против речей королевы и Цареубийцы, против его братьев и совета, против Хранителей Востока и Запада, против всей мощи Бобрового утеса? Можно сразу просто послать за сиром Илином, чтобы избавить нас от хлопот. Я знаю, где закончится эта дорога.</p><p class="p1">— Итак, если вы правы, они выдержат какое-то время и предпримут новую попытку?</p><p class="p1">— Так и будет, — ответил Варис, — и скорее рано, чем поздно. Вы заставляете их нервничать, лорд Эддард. Но мои пташки слушают, и вместе мы сможем отвести удар. — Он поднялся, опустил капюшон на лицо. — Благодарю вас за вино. Мы будем встречаться с вами. Но на следующем заседании совета постарайтесь обращаться ко мне с вашим привычным пренебрежением. Вы не найдете эту задачу сложной.</p><p class="p1">Он был уже возле двери, когда Нед окликнул его:</p><p class="p1">— Варис! — Евнух повернулся. — Как умер Джон Аррен?</p><p class="p1">— Я ждал этого вопроса.</p><p class="p1">— Расскажите.</p><p class="p1">— Эту штуковину зовут слезами Лисс. Вещь редкая и дорогая, чистая, как вода, и не оставляет следов. Я просил лорда Аррена завести дегустатора, молил его в этой самой комнате, но он ничего не пожелал слушать. Он сказал, что такая мысль не может прийти в голову мужчине.</p><p class="p1">Неду следовало выяснить все остальное.</p><p class="p1">— А кто дал ему яд?</p><p class="p1">— Один из близких друзей, деливших с ним мясо и мед. Кто именно? Не знаю, таких много. Лорд Аррен был добрым, доверчивым человеком. — Евнух вздохнул. — Крутился там такой юноша, всем в своей судьбе он был обязан Джону Аррену, но когда вдова его бежала в Орлиное Гнездо со своей свитой, он остался в Королевской Гавани, проявляя признаки благосостояния. Сердце мое всегда радуется, когда молодые становятся заметными. — Голос его хлестал кнутом, отмеривая каждое слово. — Он показался мне таким галантным на турнире: в яркой новой броне, с этими полумесяцами на плаще. Как жаль, что он умер столь не ко времени, прежде чем вы успели с ним поговорить…</p><p class="p1">Нед и так уже ощущал себя наполовину отравленным.</p><p class="p1">— Сквайр, — проговорил он. — Сир Хью. — Голова Неда раскалывалась. — Но почему? Почему именно сейчас? Джон Аррен был десницей четырнадцать лет! Почему они решили убить его?</p><p class="p1">— Потому что он начал задавать вопросы, — шепнул Варис, прежде чем скользнуть в дверь.</p></span>
