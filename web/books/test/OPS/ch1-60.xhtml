<span id="id58"><div class="title2">
<p class="p">Санса</p>
</div><p class="p1">Снятые с обнажившихся стен тронного зала гобелены со сценами охоты, которые так нравились королю Роберту, лежали в углу неопрятной грудой.</p><p class="p1">Сир Мендон Мур отправился на свое место у подножия трона, возле двух других братьев из Королевской гвардии.</p><p class="p1">Санса осталась у дверей — наконец без охраны. В качестве награды за хорошее поведение королева позволила ей передвигаться по замку, но при этом ее все равно повсюду сопровождали.</p><p class="p1">— Почетный караул для моей будущей дочери, — объяснила королева, но Санса не почувствовала радости.</p><p class="p1">Разрешение означало, что Санса могла ходить по Красному замку куда угодно — только не за ворота. Обещание это Санса дала более чем охотно: она все равно не могла выйти за стены. За воротами день и ночь следили золотые плащи Яноса Слинта, и гвардия Ланнистеров всегда была неподалеку. К тому же куда ей идти, если она покинет замок? Так что она была рада, что может гулять во дворе, собирать цветы в садике Мирцеллы и посещать септу, чтобы молиться за своего отца. Иногда Санса молилась в богороще; ведь Старки хранят верность старым богам.</p><p class="p1">Джоффри впервые созвал свой двор, и Санса нервно огляделась. Цепочка гвардейцев Ланнистеров стояла под западными окнами, городские стражники в золотых плащах выстроились в линию под восточными. Людей простых и незнатных заметно не было, но под галереей беспокойно переминалось скопление лордов — великих и малых… не более двадцати человек. В былые времена целая сотня собиралась, ожидая выхода короля Роберта.</p><p class="p1">Санса скользнула между ними и, бормоча приветствия, принялась продвигаться вперед. Она узнала чернокожего Джалабхара Ксо, мрачного сира Арона Сантагара, близнецов Редвинов, Страшилу и Беббера… однако никто из них ее как бы не узнавал… ну а если и замечали, то отодвигались, как от больной серой хворью. Вечно простуженный лорд Джайлс, увидев ее, прикрыл лицо платком и зашелся в притворном припадке кашля, а когда забавный пьяница сир Донтас уже собрался ответить ей, сир Белон Свонн что-то шепнул ему на ухо, и тот отвернулся.</p><p class="p1">Не хватало очень многих. Куда же подевались все они? — подумала Санса. Она тщетно искала приязни на лицах, но никто даже не хотел поглядеть ей в глаза. Словно бы перед ними предстал живой призрак.</p><p class="p1">Великий мейстер Пицель в одиночестве сидел за столом совета; он как будто бы дремал, сложив руки поверх бороды. Санса заметила торопящегося лорда Вариса, поспешно вступившего в зал, не производя ни звука. Мгновение спустя в высокой задней двери появился улыбающийся лорд Бейлиш. Обменявшись дружескими репликами с сирами Белоном и Донтасом, он направился вперед. Желудок Сансы сжался в комок.</p><p class="p1">«Не надо бояться, — сказала она себе. — Мне нечего бояться. Все будет хорошо, Джофф любит меня, королева тоже, она сама так говорила…»</p><p class="p1">Голос геральда провозгласил:</p><p class="p1">— Да здравствует его величество Джоффри из домов Баратеонов и Ланнистеров, первый носитель этого имени, король андалов, ройнаров и Первых Людей, владыка Семи Королевств! Да здравствует его леди-мать, Серсея из дома Ланнистеров, регентствующая королева, Свет Запада, Хранительница Областей!</p><p class="p1">Сир Барристан Селми, блистая великолепием белого панциря, вошел первым. Сир Арис Сукхар следовал за королевой, сир Борос Блаунт был возле Джоффри, и в тронном зале оказалось шестеро королевских гвардейцев, все Белые Мечи. Кроме одного лишь Джейме Ланнистера. Ее принц — нет, теперь ее король! — взбежал по ступеням Железного трона, перепрыгивая через две ступени. Королева-мать уселась в центре совета. На Джоффе был черный бархат с алыми прорезями, сверкающий парчовый плащ с высоким воротником, голову его венчала золотая корона, усыпанная рубинами и черными алмазами. Оглядев зал, Джоффри заметил Сансу. Он улыбнулся, уселся и проговорил:</p><p class="p1">— Король обязан наказать неверных и вознаградить тех, кто проявил преданность. Великий мейстер Пицель, я приказываю вам прочитать мои указы!</p><p class="p1">Пицель, облаченный в великолепное одеяние из темно-красного бархата, с горностаевым воротником и блестящими золотыми застежками, поднялся на ноги и извлек свиток из широкого рукава, украшенного тяжелым золотым шитьем. Развернув его, он приступил к чтению длинного списка лордов, которые должны были представиться королю и совету и присягнуть на верность Джоффри. В противном случае они объявлялись изменниками, и земли и титулы их должны были отойти к престолу.</p><p class="p1">Имена, которые он произносил, заставили затаить дыхание. Лорд Станнис Баратеон, его леди-жена и дочь. Лорд Ренли Баратеон, оба лорда Ройса и их сыновья. Сир Лорас Тирелл, лорд Мейс Тирелл, его братья, дяди и сыновья. Красный жрец Торос из Мира. Лорд Берик Дондаррион, леди Лиза Аррен и ее сын, маленький лорд Роберт. Лорд Хостер Талли, брат его сир Бринден, сын его Эдмар. Лорд Ясон Маллистер, лорд Брайс Карон из Мирни. Лорд Титос Блэквуд. Лорд Уолдер Фрей и наследник его сир Стеврон. Лорд Карил Венс. Лорд Джонос Бракен. Леди Шелла Уэнт. Доран Мартелл, принц Дорнский и все его сыновья. Их так много, думала она, слушая голос Пицеля. Сколько же нужно птиц, чтобы разослать эти приказы!</p><p class="p1">В конце, едва ли не самыми последними, прозвучали имена, которые так боялась услышать Санса. Леди Кейтилин Старк. Робб Старк. Брандон Старк, Рикон Старк, Арья Старк. Санса подавила восклицание. Арья. Значит, они требуют, чтобы Арья явилась и принесла присягу… Это могло означать, что сестра ее бежала на галее и что теперь она пребывает в полной безопасности в Винтерфелле…</p><p class="p1">Великий мейстер Пицель свернул свой лист, засунул его в левый рукав и извлек из правого новый пергамент. Откашлявшись, он приступил к чтению:</p><p class="p1">— Вместо изменника Эддарда Старка велением светлейшего государя назначено, чтобы Тайвин Ланнистер, лорд Бобрового утеса, Хранитель Запада, принял сан десницы короля, имеющего право говорить голосом государя, вести его армию против врагов и выполнять его королевскую волю. Так повелел король.</p><p class="p1">Малый совет одобрил.</p><p class="p1">— Вместо изменника Станниса Баратеона велением светлейшего государя назначено, чтобы его государыня-мать, регентствующая королева Серсея Ланнистер, бывшая его самой надежной опорой, сидела в его Малом совете, дабы он мог править мудро и справедливо. Так повелел король.</p><p class="p1">Малый совет одобрил.</p><p class="p1">Санса услышала негромкий ропот среди окружающих ее лордов, но голоса сразу смолкли. Пицель продолжил:</p><p class="p1">— Волею светлейшего государя его верный слуга Янос Слинт, командующий городской стражей в Королевской Гавани, будет немедленно возведен в сан лорда. Еще он получит древний удел в Харренхолле со всеми окружающими замок землями и доходами, сыновья же и внуки его унаследуют эту честь после него до конца времен. Далее король приказывает, чтобы указанный лорд Слинт немедленно сел среди его Малого совета, дабы помогать ему в правлении государством. Так повелел король.</p><p class="p1">Малый совет одобрил.</p><p class="p1">Уголком глаза Санса заметила движение, когда вошел Янос Слинт. На этот раз ропот был громче и грознее. Гордые лорды, корни которых уходили в прошлое на тысячелетия, не имели желания расступаться перед лысеющим и пучеглазым, словно лягушка, простолюдином. Золотые чешуйки, нашитые на черный бархат дублета, негромко звенели при каждом шаге Слинта под плащом черно-золотого атласа. Двое уродливых мальчишек, сыновья новоявленного лорда, шли впереди, с трудом удерживая перед собой тяжелый металлический щит высотой в их собственный рост. В качестве герба Слинт выбрал окровавленное копье, золотое на черном фоне. Вид этого щита вселял трепет в душу Сансы, руки ее покрылись гусиной кожей.</p><p class="p1">Когда лорд Слинт занял свое место, великий мейстер Пицель приступил к делу:</p><p class="p1">— Наконец, во времена предательства и смуты, после столь недавней смерти нашего возлюбленного короля Роберта, по мнению совета, следует позаботиться о жизни и безопасности короля Джоффри… — Он поглядел на королеву.</p><p class="p1">Серсея встала:</p><p class="p1">— Сир Барристан Селми, выйдите вперед.</p><p class="p1">Сир Барристан, невозмутимым изваянием застывший у подножия Железного трона, преклонил колено и склонил голову:</p><p class="p1">— Ваше величество, приказывайте, повинуюсь.</p><p class="p1">— Восстаньте, сир Барристан, — сказала Серсея Ланнистер. — Вы можете снять свой шлем.</p><p class="p1">— Миледи? — Старый рыцарь, вставая, снял с головы высокий белый шлем, явно не понимая, зачем он это делает.</p><p class="p1">— Вы служили стране долго и верно, добрый сир, и каждый обитатель Семи Королевств благодарен вам. Но ваша служба, увы, закончена. По воле короля и совета вы можете сложить свой тяжелый груз.</p><p class="p1">— Мой… груз? Боюсь, я… но я не…</p><p class="p1">Новоиспеченный лорд Янос Слинт проговорил голосом тяжелым и тупым:</p><p class="p1">— Ее величество хочет сказать вам, что вы освобождены от обязанностей лорда-командующего Королевской гвардией.</p><p class="p1">Высокий седовласый рыцарь словно бы сразу сделался ниже.</p><p class="p1">— Ваше величество, — едва выдохнул он наконец, — Королевская гвардия — это братство. Мы даем пожизненный обет. Только смерть может освободить лорда-командующего от его священного долга.</p><p class="p1">— Чья смерть, сир Барристан? — проговорила королева голосом мягким как шелк, но слова ее были слышны всему залу. — Ваша или вашего короля?</p><p class="p1">— Вы позволили моему отцу умереть, — проговорил Джоффри обвиняющим тоном с вершины Железного трона. — Вы слишком стары, чтобы кого-нибудь защищать!</p><p class="p1">Санса заметила, как старый рыцарь посмотрел на своего нового короля. Она никогда не видела, чтобы сир Барристан казался старым, но теперь он выглядел на весь свой возраст.</p><p class="p1">— Светлейшая государыня, — сказал он. — Меня избрали в Белые Мечи на двадцать третьем году жизни. Это было все, о чем я мечтал с тех пор, как впервые взял меч в руки. Я отказался от всех претензий на наследственный удел. Девушка, с которой я был помолвлен, вышла замуж за моего двоюродного брата; у меня нет ни земли, ни сыновей — я не нуждался в них, потому что жизнь моя была отдана королю. Сир Герольд Хайтауэр сам принял мой обет… ограждать короля всей моей силой… отдать за него всю мою кровь… Я сражался рядом с Белым Быком и принцем Ливеном Дорнским, рядом с сиром Эртуром Деном, Мечом Зари. Прежде чем перейти на службу к вашему отцу, я был щитом короля Эйериса, а до того я служил его отцу Джейехерису… трем королям…</p><p class="p1">— И все они погибли, — сказал Мизинец.</p><p class="p1">— Ваше время закончилось, — объявила Серсея Ланнистер. — Джоффри должен быть окружен молодыми и крепкими людьми. Совет определил, чтобы сир Джейме Ланнистер занял ваше место в качестве лорда-командующего Братства Белых Мечей.</p><p class="p1">— Цареубийца, — жестко проговорил сир Барристан голосом, полным презрения. — Лживый рыцарь, осквернивший свой клинок кровью короля, которого поклялся защищать!</p><p class="p1">— Выбирайте слова, сир, — предостерегла старого рыцаря королева. — Вы говорите о нашем возлюбленном брате, кровном родственнике нашего короля.</p><p class="p1">Тут заговорил лорд Варис — голосом более мягким:</p><p class="p1">— Мы не забыли о вашей службе, сир. Лорд Тайвин Ланнистер по своему благородству согласился выделить вам добрый участок земли возле моря к северу от Ланниспорта, дать золото и людей, чтобы вы могли воздвигнуть замок, и слуг, которые приглядят за каждой вашей нуждой.</p><p class="p1">Сир Барристан резко поглядел на него.</p><p class="p1">— Дом, где я умру, и людей, которые похоронят меня. Благодарю вас, милорды… но я плевать хотел на ваше сочувствие! — Подняв руки, он расстегнул застежки, удерживающие на месте его плащ. Тяжелое белое одеяние скользнуло с его плеч, ударилось о пол. Со звоном отлетел шлем. — Я рыцарь, — объявил он всем присутствующим и, расстегнув серебряные застежки нагрудника, дал ему упасть. — И умру рыцарем.</p><p class="p1">— Нагим рыцарем, — вставил Мизинец.</p><p class="p1">Все расхохотались; Джоффри на троне и лорды, стоящие перед королем, Янос Слинт и королева Серсея, Сандор Клиган, даже королевские гвардейцы, которые только что были его братьями. Наверное, именно это предательство ранило его глубже всего, подумала Санса. Сердце ее тянулось к доблестному старику, опозоренному, побагровевшему, чересчур разъяренному для речей. Наконец сир Барристан обнажил меч.</p><p class="p1">Санса услышала, как кто-то охнул. Сиры Борос и Меррин шагнули вперед, чтобы преградить ему путь, но сир Барристан буквально приморозил их к месту взглядом, полным презрения.</p><p class="p1">— Не опасайтесь, сиры, король ваш в безопасности… но не благодаря вам. Даже сейчас я сумею одолеть вас пятерых — так, как кинжал режет сыр. Если вы признаёте главенство Цареубийцы, ни один из вас не достоин белых одежд. — Он бросил свой меч к подножию Железного трона. — Бери, парень, пусть переплавят и прилепят к твоему трону. Все равно будет больше пользы, чем от всех мечей в руках этой пятерки. Или пригодится лорду Станнису, когда он отберет у тебя престол!</p><p class="p1">Сир Барристан гулко ступал по полу, звонкое эхо отражалось от голых стен. Лорды и леди расступились перед ним. Лишь когда пажи закрыли за ним огромные, окованные бронзой дубовые двери, Санса вновь услышала смущенные голоса… неловкое шевеление, шорох бумаг на столе совета.</p><p class="p1">— Он назвал меня мальчишкой, — капризно проговорил Джоффри тоном, явно не подобающим его возрасту. — И мерзко говорил о моем дяде Станнисе!</p><p class="p1">— Праздные речи, — заметил Варис-евнух, — праздные и бессмысленные…</p><p class="p1">— Возможно, он вступил в заговор с моими дядьями. Я хочу, чтобы его схватили и допросили. — Никто не шевельнулся. Джоффри возвысил голос: — Я же сказал, что хочу, чтобы его схватили.</p><p class="p1">Янос Слинт поднялся из-за стола совета:</p><p class="p1">— Мои золотые плащи сделают это, светлейший государь!</p><p class="p1">— Хорошо, — сказал король Джоффри. Лорд Янос направился к выходу из зала, уродливые сыновья его потянулись следом, увлекая тяжелый металлический щит с гербом дома Слинтов.</p><p class="p1">— Светлейший государь, — напомнил королю Мизинец, — кажется, мы можем продолжить, от семерых теперь осталось шестеро. Королевская гвардия нуждается в новом мече.</p><p class="p1">Джоффри улыбнулся:</p><p class="p1">— Скажи им, мать.</p><p class="p1">— Король и совет определили, что в Семи Королевствах нет человека, более достойного охранять и защищать светлейшего государя, чем присягнувший ему Сандор Клиган.</p><p class="p1">— Ну, доволен, Пес? — спросил король Джоффри.</p><p class="p1">Выражение на лице Пса трудно было понять. Он ненадолго задумался.</p><p class="p1">— Почему бы и нет? У меня нет ни земель, ни жены, не от кого отказываться, это всем безразлично. — Обгорелая сторона его рта дернулась. — Но я предупреждаю, что не принесу никаких рыцарских обетов!</p><p class="p1">— Братья Королевской гвардии всегда были рыцарями, — твердо сказал сир Борос.</p><p class="p1">— До нынешних времен, — проскрежетал Пес, и сир Борос умолк.</p><p class="p1">Когда герольд короля шагнул вперед, Санса поняла, что момент близок, и нервно разгладила юбку. На ней был траур — в знак уважения к покойному королю. Тем не менее она постаралась выглядеть как надо. Она выбрала то самое платье из шелка слоновой кости, которое подарила ей королева… то самое, которое погубила Арья. Санса велела выкрасить его в черный цвет, и пятен теперь не было заметно. Она несколько часов обдумывала, какие драгоценности ей следует надеть, и наконец решила остановиться на элегантной и простой серебряной цепочке.</p><p class="p1">Голос герольда загрохотал:</p><p class="p1">— Если в этом зале кто-нибудь имеет вопросы к его величеству, пусть выступит вперед и встанет в молчании.</p><p class="p1">Санса дрогнула. «Сейчас, — сказала она себе. — Я должна это сделать сейчас. Боги, наделите меня отвагой». Она шагнула вперед, сделала второй шаг. Лорды и рыцари отступали в сторону, молчаливо пропуская ее, и спиной она ощутила на себе тяжесть их взглядов. «Я должна быть столь же сильной, как моя леди-мать!»</p><p class="p1">— Светлейший государь, — проговорила она негромким, чуть дрогнувшим голосом.</p><p class="p1">С высоты Железного трона Джоффри было видно лучше, чем кому-либо в зале, и он первым заметил ее.</p><p class="p1">— Выходите вперед, миледи, — сказал он с улыбкой.</p><p class="p1">Улыбка его приободрила Сансу и заставила вновь почувствовать себя прекрасной и сильной. «Он любит меня, да!» Санса подняла голову и направилась к королю — не слишком медленно и не слишком быстро. Она не должна позволить им заметить, как волнуется.</p><p class="p1">— Леди Санса из дома Старков, — провозгласил герольд.</p><p class="p1">Санса остановилась возле престола, перед белым плащом и шлемом сира Барристана.</p><p class="p1">— Есть ли у вас какой-нибудь вопрос к королю и совету, Санса? — спросила королева из-за стола совета.</p><p class="p1">— Да. — Она преклонила колено осторожно, чтобы не испачкать платье, и посмотрела на своего принца, сидевшего на жутком Железном троне. — Если это будет угодно светлейшему государю, я прошу прощения для моего отца, лорда Эддарда Старка, десницы покойного короля. — Она заучила эти слова наизусть, повторила их сотню раз.</p><p class="p1">Королева вздохнула:</p><p class="p1">— Санса, вы разочаровываете меня. Что я говорила о крови предателя?</p><p class="p1">— Отец ваш совершил серьезное преступление, миледи, — провозгласил великий мейстер Пицель.</p><p class="p1">— Бедная печальная девочка, — вздохнул Варис. — Она только ребенок, милорды, и не понимает, о чем просит!</p><p class="p1">Санса глядела только на Джоффри. Он должен послушать меня, должен, подумала она. Король пошевелился.</p><p class="p1">— Пусть говорит, — приказал он. — Я хочу слышать, что она скажет.</p><p class="p1">— Благодарю вас, светлейший государь. — Санса улыбнулась застенчивой тайной улыбкой, предназначенной только для него одного. Он выслушает ее. Она знала, что так и будет.</p><p class="p1">— Злые плевелы предательства, — объявил торжественно Пицель, — должны быть вырваны с корнем, стеблем и семенем, чтобы новые предатели не поднялись по обе стороны дороги.</p><p class="p1">— Вы отрицаете преступление своего отца? — спросил лорд Бейлиш.</p><p class="p1">— Нет, милорды. — Санса понимала, что этого делать не стоит. — Я знаю, что он виноват и должен принять наказание. Я прошу только милосердия. Я знаю, мой лорд-отец будет сожалеть о содеянном. Он был другом короля Роберта и любил его, все вы знаете об этом. Он никогда не хотел быть его десницей, пока король не попросил его. Должно быть, его обманули. Лорд Ренли, или лорд Станнис, или… кто-нибудь еще. Его наверняка обманули, иначе…</p><p class="p1">Король Джоффри нагнулся вперед, руки его впились в подлокотники трона. Острия сломанных мечей торчали вперед между его пальцев.</p><p class="p1">— Он сказал, что я не король. Почему он это сделал?</p><p class="p1">— У него перебита нога, — с готовностью ответила Санса. — Она очень болит. Мейстер Пицель давал ему маковое молоко, а говорят, что маковое молоко туманит голову. Иначе он никогда бы не сказал такого!</p><p class="p1">— Детская вера… какая милая невинность… и все же мудрость нередко говорит устами младенцев, — сказал Варис.</p><p class="p1">— Предательство есть предательство, — немедленно возразил Пицель.</p><p class="p1">Джоффри беспокойно качнулся на троне.</p><p class="p1">— Мать?</p><p class="p1">Серсея Ланнистер задумчиво посмотрела на Сансу.</p><p class="p1">— Если лорд Эддард также признает свое преступление, — сказала она наконец, — мы поймем, что он раскаивается в своем безрассудстве.</p><p class="p1">Джоффри поднялся на ноги. «Пожалуйста, — подумала Санса, — пожалуйста, будь истинным королем, — я знаю, что ты такой, — добрым и благородным! Ну, пожалуйста!»</p><p class="p1">— Хотите ли вы еще что-нибудь сказать? — спросил он.</p><p class="p1">— Только… если вы любите меня, будьте ко мне добры, мой принц, — сказала Санса.</p><p class="p1">Король Джоффри оглядел ее сверху вниз.</p><p class="p1">— Ваши ласковые слова тронули меня, — проговорил он, галантно кивая, словно бы желая показать, что все будет хорошо. — Я выполню вашу просьбу. Но ваш отец должен признать свою вину. Он должен признать и объявить, что я — король, иначе ему не будет пощады!</p><p class="p1">— Он признается, — сказала Санса с восторгом. — Я знаю — он сделает это!</p></span>
