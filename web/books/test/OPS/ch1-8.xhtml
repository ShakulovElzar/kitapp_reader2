<span id="id6"><div class="title2">
<p class="p">Джон</p>
</div><p class="p1">Не слишком часто, но случалось, что Джон Сноу радовался тому, что родился бастардом. Вновь наполняя свой кубок из шедшей по кругу ендовы, он подумал, что такое мгновение наступило.</p><p class="p1">Джон занял свое место на скамье между молодыми сквайрами и выпил. Сладкое летнее вино наполнило его рот вкусом плодов и вернуло улыбку на губы.</p><p class="p1">Под сводами просторного чертога Винтерфелла плавала дымка, пахло жареным мясом и свежевыпеченным хлебом. Серые каменные стены были увешаны знаменами: белыми, золотыми, алыми. Лютоволк Старков соседствовал с коронованным оленем Баратеонов и львом Ланнистеров. Аккомпанируя себе на звонкой арфе, певец выпевал слова баллады, но в этом конце зала его голос был едва слышен за ревом огня, стуком оловянных тарелок и чаш, громким говором сотен подвыпивших глоток.</p><p class="p1">Шел четвертый час приветственного пира в честь короля. Братья и сестры Джона сидели возле королевских детей рядом с помостом, на котором лорд и леди Старк принимали короля и королеву. Ради подобной оказии лорд-отец, безусловно, разрешит каждому своему отпрыску выпить по бокалу вина, но не более. Здесь же, на скамье, никто не мог помешать Джону выпить столько, сколько требовала его жажда.</p><p class="p1">Джон обнаружил умение пить по-мужски, чем пробудил завистливое восхищение юнцов, поощрявших его всякий раз, когда он опустошал очередной кубок. Общество собралось приятное, и Джон наслаждался их россказнями о битвах, любви и охоте. Он не сомневался в том, что в этой компании было веселее, чем с королевскими отпрысками. Джон уже удовлетворил свое любопытство в отношении гостей, когда они выходили в зал. Процессия двигалась в каком-то футе от места, определенного ему на скамье, и Джон успел досыта наглядеться.</p><p class="p1">Его лорд-отец шествовал первым, сопровождая королеву. Мужчины называли ее красавицей. Украшенная драгоценными камнями тиара сверкала на длинных золотых волосах, рубины подчеркивали зелень глаз. Отец помог ей подняться на ступени, подвел к сиденью, но королева даже не поглядела на него. В свои четырнадцать лет Джон уже смог разобраться в том, что прячет ее улыбка.</p><p class="p1">Следующим шел король Роберт собственной персоной, об руку с леди Старк. Король весьма разочаровал Джона. Отец часто рассказывал о безупречном Роберте Баратеоне, демоне Трезубца, свирепейшем воине края, гиганте среди князей. Джон же увидел лишь толстяка, краснолицего, заросшего бородой, взмокшего под всеми шелками. Двигался он весьма неуклюже.</p><p class="p1">За ним шли дети. Первым — маленький Рикон, с тем достоинством, которое только может изобразить трехлетка. Джону пришлось поторопить его, когда братец остановился рядом. Позади малыша шел Робб в сером шерстяном облачении с белыми полосами по краю. Это были цвета Старков. Он провожал принцессу Мирцеллу, воздушное создание, еще не достигшее восьми лет. Золотые кудри ее весьма эффектно ниспадали из-под украшенной камнями сетчатой шапочки. Джон заметил, как застенчиво она поглядывает на Робба, проходя между столов, как смущенно улыбается брату. И решил, что она чересчур проста. А Робб даже не замечал, насколько она глупа. Он все время ухмылялся, как сельский дурень.</p><p class="p1">Сводные сестры Джона сопровождали кронпринцев. Арья выступала возле пухлого юного Томмена, светлые волосы принца оказались длиннее, чем у нее. Санса, что была старше сестры на два года, шла возле кронпринца Джоффри Баратеона. Двенадцатилетний, он был младше Джона или Робба, но, к огромному разочарованию Джона, оба брата уступали в росте принцу. У Джоффри были такие же волосы, как и у сестры, и зеленые глаза матери. Густые светлые кудри ниспадали на золотой бант, закрывая стоячий бархатный воротник. Санса светилась, шествуя возле него, однако Джону не понравились надменные губы Джоффри и тот скучный разочарованный взгляд, которым он рассматривал великий чертог Винтерфелла.</p><p class="p1">Но более его интересовала пара, шествовавшая следом: братья королевы, Ланнистеры с Бобрового утеса. Лев и Бес, перепутать их было невозможно. Сир Джейме Ланнистер, близнец королевы Серсеи, высокий, золотой, с искрящимися зелеными глазами и улыбкой, резавшей, словно нож. Облаченный в алые шелка, черные высокие сапоги и черный атласный плащ. С груди его туники разевал пасть вышитый золотой нитью герб его дома. Джейме называли в лицо Львом Ланнистера, а за спиной шептали — Цареубийца.</p><p class="p1">Джон с трудом отвернулся от него. Вот таким и должен быть король, подумал он, провожая идущего красавца взглядом.</p><p class="p1">Потом он углядел второго брата, почти незаметного в тени. Тирион Ланнистер, самый младший из отпрысков лорда Тайвина и, бесспорно, самый уродливый. Тириону не досталось ничего из того, что боги уделили Серсее и Джейме. Карлик, едва ли не по пояс своему брату, он с трудом поспевал за ним на коротких ногах. Голова его была слишком велика для тела, под выпуклым лбом открывалось расплывшееся лицо уродца. Из-под прямых волос, светлых настолько, что они казались белыми, глядел зеленый глаз, рядом с ним поблескивал черный. Джон завороженно посмотрел на Беса.</p><p class="p1">Замыкая череду высоких лордов, вошли его дядя Бенджен Старк из Ночного Дозора и воспитанник отца, молодой Теон Грейджой. Проходя мимо, Бенджен одарил Джона теплой улыбкой. Теон же как бы не заметил его, но в этом не было ничего необыкновенного. Наконец все уселись, провозгласили тосты, ответили благодарностями и снова поблагодарили, и пир начался.</p><p class="p1">Тогда Джон начал пить и с тех пор не останавливался.</p><p class="p1">Что-то потерлось о его ногу под столом. Джон заметил обращенные к нему красные глаза.</p><p class="p1">— Опять проголодался? — спросил он. На середине стола еще оставалась половинка цыпленка под медом, Джон потянулся, чтобы оторвать ножку, но придумал кое-что получше. И целиком подцепив птицу, между своих ног спустил тушку на пол. В дикарском молчании Призрак вцепился в мясо. Братьям и сестрам не разрешили взять своих волков на банкет, но псов набежало больше, чем Джон мог сосчитать. В дальней стороне зала никто не сказал ни одного укоризненного слова о его щенке. Джон попытался уверить себя в том, что ему снова повезло. Глаза его щипало. Джон яростно потер их, ругая дым. Выпив еще глоток вина, он посмотрел, как его лютоволк расправляется с цыпленком.</p><p class="p1">Следуя за служанками, между столами сновали псы. Одна из собак, черная дворовая сучонка с продолговатыми желтыми глазами, унюхала запах цыпленка. Она остановилась и полезла под скамью, чтобы получить свою долю. Джона это заинтересовало. Сука негромко заворчала и подвинулась ближе. Призрак безмолвно посмотрел на собаку красными глазами. Сука гневно зарычала. Она была в два раза больше волчонка, но тот не шевельнулся. Стоя над своей добычей, он ощерился, обнажил клыки. Сука напряглась, вызывающе тявкнула, потом передумала, повернулась и исчезла между столов, еще раз тявкнув на прощание, чтобы сохранить достоинство. Призрак принялся за еду.</p><p class="p1">Джон ухмыльнулся, потянулся под стол, чтобы погладить косматый белый мех. Лютоволк поглядел на него, по-приятельски цапнул за руку и возвратился к еде.</p><p class="p1">— И это один из лютоволков, о которых я так много слыхал? — проговорил рядом знакомый голос.</p><p class="p1">Джон радостно поглядел на своего дядю Бена, положившего руку на его голову и взъерошившего волосы, как только что Джон ерошил шерсть волка.</p><p class="p1">— Да, — отвечал он. — Зовут его Призрак.</p><p class="p1">Один из сквайров прервал свою непристойную историю, чтобы расчистить место у стола для брата их лорда. Бенджен Старк перешагнул через скамью длинными ногами и взял чашу с вином из руки Джона.</p><p class="p1">— Летнее вино, — сказал он, попробовав. — Какое сладкое. И сколько же чаш тебе уже досталось, Джон?</p><p class="p1">Тот только улыбнулся.</p><p class="p1">Бен Старк расхохотался.</p><p class="p1">— Этого я и опасался. Помнится, я был младше тебя, когда впервые искренне и честно напился. — Он подхватил с ближайшего блюда зажаренную луковицу, источавшую бурый сок, и с хрустом впился в нее зубами.</p><p class="p1">Лицо дяди напоминало острый горный утес, но в серо-голубых глазах всегда проглядывал смех. Бенджен Старк был одет в черное, как и подобает тому, кто служит в Ночном Дозоре. Сегодня он предпочел богатый черный бархат, высокие кожаные сапоги и широкий пояс с серебряной пряжкой. Тяжелая серебряная цепь лежала на его шее. Доедая луковицу, Бенджен с удивлением посмотрел на Призрака.</p><p class="p1">— Очень спокойный волк, — заметил он.</p><p class="p1">— Этот не такой, как остальные, — сказал Джон. — Он всегда молчит, поэтому я и назвал его Призраком. Но еще и потому, что он белый. Все остальные темные: серые или черные.</p><p class="p1">— Ну, за Стеной лютоволков еще хватает. Мы слышим их вой во время вылазок. — Бенджен пристально поглядел на Джона. — Разве ты обычно ешь не вместе со своими братьями?</p><p class="p1">— Обычно да, — отвечал Джон ровным голосом, — но сегодня леди Старк решила, что королевская семья посчитает оскорблением общество бастарда.</p><p class="p1">— Понимаю. — Взгляд дяди обратился за спину Джона к возвышению в конце зала. — Что-то на лице моего брата сегодня не видно праздничного настроения.</p><p class="p1">Джон тоже разглядел это. Бастарду приходится все замечать, учиться читать истину, которую люди прячут за своими глазами. Отец держался учтиво, однако в нем чувствовалась напряженность, которой обычно не было. Лорд Старк ел немного и оглядывал зал полуприкрытыми глазами, словно ничего не видя. Король же, сидевший через два места от него, пил и ел вовсю. Широкое лицо его побагровело под черной бородой. Король уже провозгласил достаточное количество тостов, громко смеялся всем шуткам и атаковал каждое блюдо, словно изголодавшийся. Но королева казалась рядом с ним холодной, как ледяная статуэтка.</p><p class="p1">— Королева тоже сердита, — негромко проговорил Джон своему дяде. — Отец вчера вечером водил короля вниз. Королева не хотела этого.</p><p class="p1">Бенджен посмотрел на Джона долгим взвешивающим взглядом.</p><p class="p1">— Итак, Джон, ты многое замечаешь? Такому человеку найдется место на Стене.</p><p class="p1">Джон раздулся от гордости.</p><p class="p1">— Робб лучше владеет копьем, но я лучше фехтую, а Халлен говорит, что лучше меня в нашем замке никто не сидит на коне.</p><p class="p1">— Заметные достижения.</p><p class="p1">— Возьми меня с собой, когда будешь возвращаться на Стену, — вдруг выпалил Джон. — Отец разрешит мне, если ты попросишь, я знаю это.</p><p class="p1">Дядя Бен внимательно оглядел его лицо.</p><p class="p1">— Мальчикам на Стене не место, Джон.</p><p class="p1">— Но я почти уже вырос, — запротестовал Джон. — В следующие именины мне исполнится пятнадцать, а мейстер Лювин говорит, что бастарды растут быстрее, чем обычные дети.</p><p class="p1">— Наверное, — чуть скривился Бенджен. Он взял со стола чашу Джона, наполнил ее из ближайшего кувшина и выпил единым долгим глотком.</p><p class="p1">— Дейерену Таргариену было только четырнадцать, когда он покорил Дорн, — напомнил Джон. Юный Дракон был одним из его героев.</p><p class="p1">— На покорение ушло целое лето, — напомнил ему дядя. — Твой мальчишка-король потерял десять тысяч людей, чтобы захватить королевство, и еще пятьдесят тысяч, пытаясь удержать его. Кто-то должен был объяснить ему, что война — это не игра. — Он выпил еще вина. — Кстати, — проговорил он, вытирая рот, — Дейерену Таргариену было всего лишь восемнадцать, когда он погиб. Или ты забыл об этом?</p><p class="p1">— Я ничего не забываю, — похвастал Джон. Вино наделило его отвагой. Он попытался выпрямиться на скамье, чтобы показаться выше. — Я хочу служить в Ночном Дозоре, дядя.</p><p class="p1">Он давно и упорно думал об этом по ночам, когда братья уже засыпали. Когда-нибудь Робб унаследует Винтерфелл и как Хранитель Севера возглавит великое войско. Бран и Рикон будут знаменосцами Робба, им суждено править крепостями от лица брата. Сестры Арья и Санса выйдут замуж за наследников других великих домов и отправятся на юг хозяйничать в собственных замках. Но какое место может достаться бастарду?</p><p class="p1">— Ты не знаешь, чего просишь, Джон. Ночной Дозор — это братство, которому присягают. У нас нет семей. Никто из нас не может родить сына. Долг — вот наша жена. А любовница — честь.</p><p class="p1">— Честь есть и у бастарда, — проговорил Джон. — Я уже готов принести вашу клятву.</p><p class="p1">— Ты мальчик, тебе еще четырнадцать, — проговорил Бенджен. — Ты еще не мужчина. Пока ты не познаешь женщину, не поймешь, от чего отказываешься.</p><p class="p1">— Я не хочу даже думать об этом! — с пылом проговорил Джон.</p><p class="p1">— Захочешь, когда узнаешь, что это такое, — сказал Бенджен. — Если бы ты знал, чего стоит плата, то, возможно, не стал бы торопиться с клятвой, сынок.</p><p class="p1">Джон ощутил, как в нем вспыхнул гнев.</p><p class="p1">— Я тебе не сынок!</p><p class="p1">Бенджен Старк поднялся.</p><p class="p1">— Вот это и жалко. — Он положил ладонь на плечо Джона. — Обратишься ко мне, когда заведешь собственных бастардов, посмотрим, как ты тогда запоешь.</p><p class="p1">Джон задрожал.</p><p class="p1">— Я никогда не буду отцом бастарда. Никогда! — подчеркнул он, словно выплеснул яд.</p><p class="p1">И вдруг понял, что все за столом умолкли и глядят на него. Джон почувствовал, как слезы начинают наполнять глаза. Он поднялся на ноги.</p><p class="p1">— Прости, — сказал он, собрав остатки достоинства, и, резко повернувшись, бросился прочь, чтобы вокруг не заметили его слез. Наверное, он выпил больше вина, чем полагал: ноги подвели Джона, он столкнулся со служанкой, опрокинул кувшин вина на пол. Вокруг загремел смех, и Джон ощутил на щеках жаркие слезы. Кто-то попытался поддержать его. Он вырвался из услужливых рук и, полуслепой, бросился к двери.</p><p class="p1">Призрак последовал за ним в ночь.</p><p class="p1">Во дворе было тихо и пусто. Одинокий часовой застыл высоко на внутренней стене, плотно кутаясь в плащ, закрывавший его от ветра. Скучный и несчастный, он горбился там в одиночестве, но Джон охотно поменялся бы с ним местами. Но в остальном замок казался темным и брошенным. Джону уже приходилось видеть заброшенную крепость, скучные стены, среди которых шевелился лишь ветер. Камни молчали о людях, которые жили там. Ныне Винтерфелл напоминал ту твердыню. Звуки музыки и песни сквозь открытые окна тянулись за ним. Но Джону не хотелось веселья. Он стер слезы рукавом рубашки, жалея о том, что пролил их, и собрался уйти.</p><p class="p1">— Мальчик, — позвал его голос. Джон обернулся. Тирион Ланнистер сидел на карнизе над дверью великого чертога, напоминая горгулью. Карлик ухмыльнулся. — Это животное называется волком?</p><p class="p1">— Лютоволком, — отвечал Джон. — Его зовут Призрак. — Он поглядел на невысокого человека, разом забыв свое разочарование. — А что ты делаешь наверху? Почему ты не присутствуешь на пиру?</p><p class="p1">— Там слишком жарко, слишком шумно, и я уже выпил слишком много вина, — поведал карлик. — Я уже давно понял, что блевать на собственного брата неучтиво. Скажи, а можно посмотреть поближе на твоего волка?</p><p class="p1">Поколебавшись, Джон кивнул:</p><p class="p1">— Ты сумеешь спуститься или мне принести лестницу?</p><p class="p1">— О, к чертям лестницы, — отвечал человечек, отрываясь от карниза. Джон охнул, а потом с уважением проследил, как Тирион Ланнистер свернулся в тугой комок, легко приземлился на руки, потом сделал сальто и встал на ноги. Призрак в нерешительности отскочил в сторону.</p><p class="p1">Отряхнувшись, карлик рассмеялся:</p><p class="p1">— По-моему, я испугал твоего волчонка. Прошу прощения.</p><p class="p1">— Он не испуган, — отвечал Джон и, согнувшись, позвал: — Призрак, иди сюда. Иди сюда. Вот так.</p><p class="p1">Волчонок подошел ближе, ткнулся носом в лицо Джона, приглядывая осторожным глазом за Тирионом Ланнистером, но когда карлик протянул руку, чтобы погладить его, отодвинулся и с безмолвной угрозой обнажил клыки.</p><p class="p1">— Боится, правда? — заметил Ланнистер.</p><p class="p1">— Сидеть, Призрак! — скомандовал Джон. — Вот так. Сиди смирно. — Он поглядел на карлика. — Теперь ты можешь прикоснуться к волку, он не пошевелится, пока я не прикажу ему. Я учу его.</p><p class="p1">— Понимаю, — проговорил Ланнистер. Погладив белую шерсть между ушами Призрака, он сказал: — Хороший волк.</p><p class="p1">— Если бы меня не было рядом, он разорвал бы тебе глотку, — сказал Джон. Пока дело обстояло не совсем так, но все еще впереди…</p><p class="p1">— В таком случае лучше держись поближе, — проговорил карлик. Он нагнул свою слишком крупную голову набок и поглядел на Джона разными глазами. — Я — Тирион Ланнистер.</p><p class="p1">— Я знаю это, — проговорил Джон распрямляясь. Ростом он был выше карлика… странное ощущение.</p><p class="p1">— А ты — бастард Неда Старка, так?</p><p class="p1">Джон ощутил, как холод пробежал по нему. Стиснув зубы, он ничего не ответил.</p><p class="p1">— Я обидел тебя? — спросил Ланнистер. — Прости, карликам не обязательно соблюдать такт. Поколения шутов и дураков дают мне право скверно одеваться и высказывать все, что приходит в голову. — Он ухмыльнулся. — Но ты и есть бастард.</p><p class="p1">— Лорд Эддард Старк — мой отец, — жестко признался Джон.</p><p class="p1">Ланнистер поглядел ему в лицо.</p><p class="p1">— Да, — сказал он, — это видно. В тебе больше севера, чем в твоих братьях.</p><p class="p1">— Сводных братьях, — поправил Джон. Слова карлика были приятны ему, но он попытался не показать этого.</p><p class="p1">— Позволь мне дать тебе кое-какой совет, бастард, — сказал Ланнистер. — Никогда не забывай, кто ты такой, ведь мир, конечно, этого не забудет. Сделай происхождение своей силой. Не допускай, чтобы оно превратилось в слабость. Облачись в это, словно в броню, и тогда никто не сможет ранить тебя.</p><p class="p1">Джону было не до советов.</p><p class="p1">— Ну что ты знаешь о том, как чувствуют себя бастарды?</p><p class="p1">— Любой карлик — бастард в глазах собственного отца.</p><p class="p1">— Но ты законный сын своей матери, истинный Ланнистер.</p><p class="p1">— Неужели? — с иронией отвечал карлик. — Скажи это моему лорду-отцу. Моя мать умерла, рожая меня, и он никогда не испытывал уверенности в этом.</p><p class="p1">— А я даже не знаю своей матери, — проговорил Джон.</p><p class="p1">— Вне сомнения, она была женщиной. Как и все они. — Он одарил Джона скорбной улыбкой. — Запомни это, мальчик. Всякого карлика можно считать бастардом, но бастарду не обязательно быть карликом! — Тут он повернулся и направился в замок на пир, насвистывая расхожую мелодию. Когда Тирион открыл дверь, свет бросил длинную тень на двор, и какое-то мгновение Бес Ланнистер казался высоким, словно король.</p></span>
