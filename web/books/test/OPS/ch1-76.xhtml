<span id="id74"><div class="title2">
<p class="p">Приложение</p>
</div><span id="id75"><div class="title1">
<p class="p">Дом Баратеонов</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_006.png"/>
</div><p class="p1">Самый младший из великих домов; родился во время Завоевательных войн. Основатель его, Орис Баратеон, по слухам, был незаконнорожденным братом Эйегона Дракона. Орис возвысился, став одним из наиболее свирепых полководцев Эйегона. Когда Орис победил и убил Аргилака Надменного, последнего короля Шторма, Эйегон наградил его замком Аргилак, землями и дочерью. Орис взял девушку в жены, принял знамя, почести и девиз ее рода. Знак Баратеонов — коронованный олень, черный на золотом поле; девиз их — «Нам ярость».</p><p class="empty-line"/><p class="p1">КОРОЛЬ РОБЕРТ БАРАТЕОН, первый этого имени.</p><p class="p1">Жена его, КОРОЛЕВА СЕРСЕЯ, из дома Ланнистеров.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">ПРИНЦ ДЖОФФРИ, наследник Железного трона, мальчик двенадцати лет.</p><p class="p1">ПРИНЦЕССА МИРЦЕЛЛА, девочка восьми лет.</p><p class="p1">ПРИНЦ ТОММЕН, мальчик семи лет.</p><p class="p1"><strong>Его братья:</strong></p><p class="p1">СТАННИС БАРАТЕОН, лорд Драконьего Камня.</p><p class="p1">Жена его, ЛЕДИ СЕЛИСА, из дома Флорент;</p><p class="p1">их дочь ШИРИН, девочка двенадцати лет.</p><p class="p1">РЕНЛИ БАРАТЕОН, лорд Штормового Предела.</p><p class="p1"><strong>Его Малый совет:</strong></p><p class="p1">ВЕЛИКИЙ МЕЙСТЕР ПИЦЕЛЬ,</p><p class="p1">ЛОРД ПЕТИР БЕЙЛИШ, по прозвищу МИЗИНЕЦ, мастер над монетой,</p><p class="p1">ЛОРД СТАННИС БАРАТЕОН, мастер над кораблями,</p><p class="p1">ЛОРД РЕНЛИ БАРАТЕОН, мастер над законом,</p><p class="p1">СИР БАРРИСТАН СЕЛМИ, лорд-командующий Королевской гвардией,</p><p class="p1">ВАРИС-ЕВНУХ, по прозвищу Паук, мастер над шептунами.</p><p class="p1"><strong>Двор его и свита:</strong></p><p class="p1">СИР ИЛИН ПЕЙН, Королевское Правосудие, палач.</p><p class="p1">САНДОР КЛИГАН, по прозвищу Пес, присягнувший на верность принцу Джоффри.</p><p class="p1">ЯНОС СЛИНТ, простолюдин, командующий городской стражей Королевской Гавани.</p><p class="p1">ДЖАЛАБХАР, принц Летних островов, изгнанник.</p><p class="p1">БЕЗУМЕЦ, шут и дурак.</p><p class="p1">ЛАНСЕЛЬ и ТИРЕК ЛАНКАСТЕРЫ, сквайры короля, кузены королевы.</p><p class="p1">СИР АРОН САНТАГАР, мастер над оружием.</p><p class="p1"><strong>Его Королевская гвардия:</strong></p><p class="p1">СИР БАРРИСТАН СЕЛМИ, лорд-командующий,</p><p class="p1">СИР ХАЙМЕ БЛАУНТ,</p><p class="p1">СИР МЕРРИН ТРАНТ,</p><p class="p1">СИР АРИС АКХАРТ,</p><p class="p1">СИР ПРЕСТОН ГРИНФИЛД,</p><p class="p1">СИР МЕНДОН МУР.</p><p class="empty-line"/><p class="p1">Штормовому Пределу присягнули на верность следующие дома: Селми, Вилде, Трант, Пенроз, Эррол, Эстермонт, Тарт, Свонн, Дондаррион, Карон.</p><p class="p1">Драконьему Камню присягнули на верность: Селтигары, Велирионы, Сиворты, Бар-Эммоны и Санглассы.</p></span><span id="id76"><div class="title1">
<p class="p">Дом Старков</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_007.png"/>
</div><p class="p1">Происхождение Старков восходит к Брандону-Строителю и древним Королям Зимы. Тысячи лет они правили в Винтерфелле, называя себя Королями Севера, пока наконец Торрхен Старк, Король Преклонивший колено, решил присягнуть на верность Эйегону Драконовластному, а не сражаться с ним. На гербе их серый лютоволк мчится на снежно-белом фоне. Девиз Старков — «Зима близко».</p><p class="p1">ЭДДАРД СТАРК, лорд Винтерфелла, Хранитель Севера.</p><p class="p1">Жена его, ЛЕДИ КЕЙТИЛИН, из дома Талли.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">РОББ, наследник Винтерфелла, мальчик четырнадцати лет,</p><p class="p1">САНСА, старшая дочь, одиннадцати лет,</p><p class="p1">АРЬЯ, младшая дочь, девочка девяти лет,</p><p class="p1">БРАНДОН, зовущийся Браном, семи лет,</p><p class="p1">РИКОН, трехлетний малыш.</p><p class="p1">Незаконнорожденный сын его, ДЖОН СНОУ, мальчик четырнадцати лет.</p><p class="p1">Его воспитанник, ТЕОН ГРЕЙДЖОЙ, наследник Железных островов.</p><p class="p1"><strong>Его родственники:</strong></p><p class="p1">БРАНДОН, старший брат, убитый по приказу Эйериса II Таргариена.</p><p class="p1">ЛИАННА, его младшая сестра, скончавшаяся в горах Дорна.</p><p class="p1">БЕНДЖЕН, его младший брат, Черный Брат Ночного Дозора.</p><p class="p1"><strong>Его приближенные:</strong></p><p class="p1">МЕЙСТЕР ЛЮВИН, советник, целитель и учитель.</p><p class="p1">ВЕЙОН ПУЛЬ, стюард Винтерфелла.</p><p class="p1">ДЖЕЙНИ, его дочь, ближайшая подруга Сансы.</p><p class="p1">ДЖОРИ КАССЕЛЬ, капитан гвардии.</p><p class="p1">ХАЛЛИС МОЛЛЕН, ДЕСМОНД, ДЖЕКС, ПОРТЕР, КВЕНТ, ЭЛИН, ТОМАРД, ВАРЛИ, ХЬЮАРД, КЕЙН, УИЛ, гвардейцы.</p><p class="p1">СИР РОДРИК КАССЕЛЬ, мастер над оружием, дядя Джори.</p><p class="p1">БЕТ, его младшая дочь.</p><p class="p1">СЕПТА МОРДЕЙН, воспитательница дочерей лорда Эддарда.</p><p class="p1">СЕПТОН ШЕЙЛИ, хранитель замковой септы и библиотеки.</p><p class="p1">ХАЛЛЕН, мастер над конями.</p><p class="p1">ДЖОЗЕТ, мастер над конями и воспитатель коней.</p><p class="p1">ФАЙЛЕН, мастер над псарней.</p><p class="p1">СТАРАЯ НЭН, сказительница, прежде няня.</p><p class="p1">ХОДОР, ее правнук, простодушный конюх.</p><p class="p1">ГЕЙДЖ, повар.</p><p class="p1">МИККЕН, кузнец и оружейник.</p><p class="p1"><strong>Его главные лорды-знаменосцы:</strong></p><p class="p1">Сир Халман Толхарт,</p><p class="p1">Рикард Карстарк, лорд Кархолда,</p><p class="p1">Сир Русе Болтон, лорд Дредфорта,</p><p class="p1">Джон Амбер, по прозвищу Большой Джон.</p><p class="p1">Галбарт и Роберт Гловеры,</p><p class="p1">Виман Мандерли, лорд Белой гавани,</p><p class="p1">Мейдж Мормонт, леди Медвежьего острова.</p><p class="empty-line"/><p class="p1">На верность Винтерфеллу присягнули Карстарки, Амберы, Флинты, Мормонты, Хорнвуды, Сервины, Риды, Мандерли, Гловеры, Толхарты, Болтоны.</p></span><span id="id77"><div class="title1">
<p class="p">Дом Ланнистеров</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_008.png"/>
</div><p class="p1">Светловолосые, высокие и красивые Ланнистеры являются потомками андалов-завоевателей, создавших могучее королевство в Западных холмах и долинах. По женской линии они претендуют на происхождение от Ланна Умного, легендарного шута века героев. Золото Бобрового утеса и Золотого Зуба сделало их самыми богатыми среди великих домов. Их герб — золотой лев на алом фоне. Их девиз — «Услыши мой рев!».</p><p class="empty-line"/><p class="p1">ТАЙВИН ЛАННИСТЕР, лорд Бобрового утеса, Хранитель Запада, щит Ланниспорта.</p><p class="p1">Его жена ЛЕДИ ДЖОАННА, кузина, умерла в родах.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">СИР ДЖЕЙМЕ, по прозвищу Цареубийца, наследник Бобрового утеса и близнец Серсеи,</p><p class="p1">КОРОЛЕВА СЕРСЕЯ, жена короля Роберта I Баратеона, близнец Джейме.</p><p class="p1">ТИРИОН, по прозвищу Бес, карлик.</p><p class="p1"><strong>Родственники его:</strong></p><p class="p1">СИР КИВАН, его старший брат,</p><p class="p1">Его жена ДОРНА, из дома Свифтов.</p><p class="p1">Их старший сын ЛАНСЕЛЬ, сквайр короля,</p><p class="p1">Их близнецы сыновья, ВИЛЛЕМ и МАРТИН,</p><p class="p1">Их дочь, младенец ДЖЕНЕЯ,</p><p class="p1">ДЖЕННА, его сестра, замужем за сиром Эммоном Фреем.</p><p class="p1">Их сын СИР КЛЕОС ФРЕЙ,</p><p class="p1">Их сын ТАЙЕН ФРЕЙ, сквайр.</p><p class="p1">СИР ТИГЕТТ, его второй брат, умер от язвы.</p><p class="p1">Его вдова, ДАРЛЕССА из дома Марбрандов.</p><p class="p1">Их сын ТИРЕК, сквайр короля</p><p class="p1">ГЕРИОН, его младший брат, пропавший на море.</p><p class="p1">Его незаконнорожденная дочь ДЖОЙ, девятилетняя девочка.</p><p class="p1">Их кузен, СИР СТАФФОРД ЛАННИСТЕР, брат покойной леди Джоанны.</p><p class="p1">Его дочери СЕРЕННА и МИРИЕЛЬ.</p><p class="p1">Его сын, СИР ДЕВИН ЛАННИСТЕР.</p><p class="p1">Его советник, МЕЙСТЕР ГРЕЙЛИН,</p><p class="p1"><strong>Его основные рыцари и лорды-знаменосцы:</strong></p><p class="p1">лорд ЛЕО ЛЕФФОРД,</p><p class="p1">сир АДДАМ МАРБРАНД,</p><p class="p1">сир ГРИГОР КЛИГАН, Скачущая Гора,</p><p class="p1">СИР ХАРИС СВИФТ, тесть сира Кивана,</p><p class="p1">ЛОРД АНДРОС БРАКС,</p><p class="p1">СИР ФОРЛИ БРАКС,</p><p class="p1">СИР АМОРИ ЛОРХ,</p><p class="p1">ВАРГО ХОУТ, наемник из Вольного Города Квохора.</p><p class="empty-line"/><p class="p1">На верность Бобровому утесу присягнули Пейны, Свифты, Марбранды, Лиддены, Вейнфорты, Леффорды, Кракехоллы, Серреты, Брумы, Клиганы, Пристеры и Вестерлинги.</p></span><span id="id78"><div class="title1">
<p class="p">Дом Арренов</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_009.png"/>
</div><p class="p1">Аррены происходят от Королей Горы и Долины, это одна из стариннейших и самых чистых линий андальской знати. Их знак — месяц и сокол, белые на небесно-синем фоне. Девиз Арренов — «Высокий как честь».</p><p class="empty-line"/><p class="p1">ДЖОН АРРЕН, недавно почивший лорд Орлиного Гнезда, Защитник Долины, Хранитель Востока, десница короля.</p><p class="p1">Его первая жена, ЛЕДИ ДЖЕЙНЕ из дома Ройсов, умерла, родив мертвую дочь.</p><p class="p1">Его вторая жена, бездетная ЛЕДИ РОВЕНА из дома Арренов, его кузина, умерла от зимней простуды.</p><p class="p1">Его третья жена и вдова, ЛЕДИ ЛИЗА из дома Талли.</p><p class="p1">Их сын</p><p class="p1">РОБЕРТ АРРЕН, болезненный мальчик шести лет, нынешний лорд Орлиного Гнезда и Защитник Долины.</p><p class="p1"><strong>Их свита и подданные:</strong></p><p class="p1">МЕЙСТЕР КОЛЕМОН, советник, целитель и наставник,</p><p class="p1">СИР ВАРДИС ИГЕН, капитан гвардии,</p><p class="p1">СИР БРИНДЕН ТАЛЛИ, по прозвищу Черная Рыба, Рыцарь Ворот и дядя леди Лизы.</p><p class="p1">ЛОРД НЕСТОР РОЙС, Высокий Стюард Долины,</p><p class="p1">СИР АЛБАР РОЙС, его сын.</p><p class="p1">МИЯ СТОУН, незаконнорожденная девушка, прислужница.</p><p class="p1">ЛОРД ЕОН ХАНТЕР, ухажер леди Лизы.</p><p class="p1">СИР ЛИН КОРБРЕЙ, ухажер леди Лизы.</p><p class="p1">МИКЕЛЬ РЕДФОРТ, его сквайр.</p><p class="p1">ЛЕДИ АНЬЯ УЭЙНВУД, вдова.</p><p class="p1">СИР МОРТЕН УЭЙНВУД, ее сын, ухажер леди Лизы.</p><p class="p1">СИР ДОННЕЛ УЭЙНВУД, ее сын.</p><p class="p1">МОРД — жестокий тюремщик.</p><p class="empty-line"/><p class="p1">На верность Орлиному Гнезду присягнули Ройсы, Бейлиши, Игнеты, Уэйнвуды, Хантеры, Редфорты, Корбреи, Белморы, Мелколмы и Херси.</p></span><span id="id79"><div class="title1">
<p class="p">Дом Талли</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_010.png"/>
</div><p class="p1">Талли никогда не были королями, хотя они владеют богатыми землями и великим замком Риверрана уже тысячу лет. Во время Завоевательных войн Речной край принадлежал Харрену Черному, Королю Островов. Дед Харрена, король Харвин Жестокая Рука отобрал Трезубец у Аррека, короля Шторма, чьи предки захватили весь край вплоть до Перешейка три столетия назад, убив наследника прежних королей Реки. Подданные не любили тщеславного и кровожадного тирана Харрена Черного, и многие из речных лордов, оставив его, присоединились к войску Эйегона. Первым среди них был Эдмин Талли из Риверрана. Когда Харрен и его род погибли при пожаре Харренхолла, Эйегон возвысил дом Талли, наградив его главу Эдмина Талли властью над землями Трезубца. Лордам Реки пришлось присягнуть на верность новому властелину. Герб Талли — прыгающая форель, серебряная среди синих и красных волн. Девиз Талли — «Семья, долг, честь».</p><p class="empty-line"/><p class="p1">ХОСТЕР ТАЛЛИ, лорд Риверрана.</p><p class="p1">Жена его, ЛЕДИ МИЛИСА из дома Уэнт, умершая в родах.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">КЕЙТИЛИН, старшая дочь, замужем за лордом Эддардом Старком,</p><p class="p1">ЛИЗА, младшая дочь, вдова Джона Аррена,</p><p class="p1">СИР ЭДМАР, наследник Риверрана.</p><p class="p1">Его брат, СИР БРИНДЕН, зовущийся Черной Рыбой.</p><p class="p1"><strong>Его челядь:</strong></p><p class="p1">МЕЙСТЕР ВИМАН, советник, целитель и наставник,</p><p class="p1">СИР ДЕСМОНД ГРЕЛЛ, мастер над оружием,</p><p class="p1">СИР РОБИН РИГЕР, капитан гвардии,</p><p class="p1">УТЕРАЙДС УЭЙН, стюард Риверрана.</p><p class="p1">Его рыцари и лорды-знаменосцы:</p><p class="p1">ЯСОН МАЛЛИСТЕР, лорд Сигарда,</p><p class="p1">ПАТРЕК МАЛЛИСТЕР, его сын и наследник,</p><p class="p1">УОЛДЕР ФРЕЙ, лорд Переправы.</p><p class="p1"><strong>Его многочисленные сыновья, внуки и бастарды.</strong></p><p class="p1">ДЖОНАС БРАКЕН, лорд Каменной Изгороди, Стоунхеджа.</p><p class="p1">ТИТОС БЛЭКВУД, лорд Древорона.</p><p class="p1">СИР РЕЙМЕН ДАРРИ.</p><p class="p1">СИР КАРИЛ ВЕНС.</p><p class="p1">СИР МАРК ПАЙПЕР.</p><p class="p1">ШЕЛЛА УЭНТ, леди Харренхолла.</p><p class="p1">СИР УИЛЛИС ВОДЕ, рыцарь, служащий ей.</p><p class="empty-line"/><p class="p1">На верность Риверрану присягнули меньшие дома: Дарри, Фреи, Маллистеры, Бракены, Блэквуды, Венты, Ригеры, Пайперы, Венсы.</p></span><span id="id80"><div class="title1">
<p class="p">Дом Тиреллов</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_011.png"/>
</div><p class="p1">Тиреллы возвысились как стюарды Королей Раздолья, власть которых распространялась на плодородные равнины, лежащие на северо-запад от Дорнской Марни и на юго-запад от Черноводной. По женской линии они претендуют на происхождение от венчанного лозами и цветами Гарта Зеленая Длань, короля и садовника, правителя Первых Людей, при котором край процветал. Когда король Мерн, последний представитель древней династии, пал на Пламенном поле, стюард его Харлен Тирелл сдал Вышесад Эйегону-завоевателю Таргариену и присягнул ему. Эйегон даровал ему замок и власть над Раздольем. Знак Тиреллов — золотая роза на зеленом, как трава, поле. Их девиз: «Вырастая — крепнем».</p><p class="empty-line"/><p class="p1">МЕЙС ТИРЕЛЛ, лорд Вышесада, Хранитель Юга, Защитник Марни, Верховный Маршал Раздолья.</p><p class="p1">Его жена, ЛЕДИ АЛЕРИЯ, из дома Хайтаэуров Староместских.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">УИЛЛИАС, старший сын, наследник Вышесада,</p><p class="p1">СИР ГАРЛАН, прозванный Доблестным, средний сын,</p><p class="p1">СИР ЛОРАС, рыцарь Цветов, младший сын,</p><p class="p1">МАРГЕРИТ, дочь, дева четырнадцати лет.</p><p class="p1">Его вдовствующая мать, ЛЕДИ ОЛЕННА из дома Редвинов, прозванная Королевой Шипов.</p><p class="p1"><strong>Его сестры:</strong></p><p class="p1">МИНА, замужем за лордом Пакстером Редвином,</p><p class="p1">ЯННА, замужем за сиром Джоном Фоссовеем.</p><p class="p1"><strong>Его дядя:</strong></p><p class="p1">ГАРТ, прозванный Тучным, лорд-сенешаль Вышесада.</p><p class="p1">Его сыновья, бастарды ГАРСЕ и ГАРРЕТТ ФЛАУЭРСЫ.</p><p class="p1">СИР МЕРИН, лорд-командующий городской стражи Староместа.</p><p class="p1">МЕЙСТЕР ГОРМЕН, ученый в Цитадели.</p><p class="p1"><strong>Его челядь:</strong></p><p class="p1">МЕЙСТЕР ЛОМИС, советник, целитель и наставник,</p><p class="p1">АЙГОН ВИРВЕЛ, капитан гвардии,</p><p class="p1">СИР ВЕЙТИМЕР КРЕЙН, мастер над оружием.</p><p class="p1">Его рыцари и лорды-знаменосцы:</p><p class="p1">ПАКСТЕР РЕДВИН, лорд Бора,</p><p class="p1">Его жена, ЛЕДИ МИНА, из дома Тиреллов.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">СИР ХОРАС, известный как Орясина, близнец Хоббера,</p><p class="p1">СИР ХОББЕР, известный как Боббер, близнец Хораса</p><p class="p1">ДЕСМЕРА, дева пятнадцати лет.</p><p class="p1">РЕНДЕЛЛ ТАРЛИ, лорд Рогова Холма.</p><p class="p1">СЭМВЕЛ, его старший сын, брат Ночного Дозора,</p><p class="p1">ДИКОН, его младший сын, наследник Рогова Холма.</p><p class="p1">АРВИН ОКХАРТ, леди Старого Дуба.</p><p class="p1">МАТХИС РЕВАН, лорд Золотой Рощи.</p><p class="p1">ЛЕЙТОН ХАЙТАУЭР, Глас Староместа, лорд Гавани.</p><p class="p1">СИР ДЖОН ФОССОВЕЙ.</p><p class="empty-line"/><p class="p1">На верность Вышесаду присягнули Вирвелы, Флоренты, Окхарты, Хайтауэры, Крейны, Тарли, Рованы, Фоссовеи и Маллендоры.</p></span><span id="id81"><div class="title1">
<p class="p">Род Грейджоев</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_012.png"/>
</div><p class="p1">Грейджой из Пика претендует на происхождение от Серого Короля из века героев. Легенды утверждают, что Серый Король правил не только Западными островами, но и самим морем, и даже был женат на русалке.</p><p class="p1">Тысячи лет пираты с Железных Островов — железными людьми называли их те, кого они грабили, — сеяли на морях ужас, доплывая даже до Порт-Иббена и Летних островов. Они гордились своей свирепостью в битве и священной свободой. На каждом островке был свой король «камня и соли». Верховного правителя островов долго выбирали из их числа, пока наконец король Уррон не учредил наследственное правление, перебив собравшихся на выборы королей. Род самого Уррона пресекся через тысячу лет, когда андалы захватили острова. Грейджой, как и прочие островные владыки, смешал свою кровь с кровью завоевателей.</p><p class="p1">Железные короли простерли свою власть за пределы самих островов, добывая себе владения на материке огнем и мечом. Король Кхоред справедливо хвастал тем, что власть его простирается повсюду, «где люди чуют запах соленой воды и слышат плеск волн». В последующие столетия наследники Кхореда утратили Бор, Старомест, Медвежий остров и большую часть западного побережья. Все же перед Завоевательными войнами король Харрен Черный правил всеми землями, что между гор — от Перешейка до Черноводной. Когда Харрен вместе с сыновьями пал, обороняя Харренхолл, Эйегон Таргариен отдал Речные земли дому Талли и позволил уцелевшим людям Железных Островов возобновить свой древний обычай и избрать среди себя того, кто будет править ими. Они назвали лорда Викона Грейджоя, из Пайка. Знак Грейджоев — золотой кракен на черном поле. Их девиз — «Мы не сеем».</p><p class="empty-line"/><p class="p1">БЕЕЛОН ГРЕЙДЖОЙ, лорд Железных островов, король камня и соли, сын Морского Ветра, лорд-жнец Пайка.</p><p class="p1">Его жена, ЛЕДИ АЛАННИС, из дома Харло.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">РОДРИК, старший сын, убитый при Сиграде во время бунта Грейджоя,</p><p class="p1">МАРЕН, средний сын, убитый на стенах Пайка во время бунта Грейджоя,</p><p class="p1">АША, их дочь, капитан «Черного ветра»,</p><p class="p1">ТЕОН, их единственный уцелевший сын, наследник Пайка, воспитанник лорда Эддарда Старка.</p><p class="p1"><strong>Его братья:</strong></p><p class="p1">ЕУРОН, прозванный Вороньим Глазом, капитан «Молчаливого», беззаконный пират и разбойник,</p><p class="p1">ВИКТАРИОН, лорд-капитан Железного Флота,</p><p class="p1">АЕРОН, прозванный Мокроголовым, жрец Утонувшего Бога.</p><p class="empty-line"/><p class="p1">На верность Пайку присягнули меньшие дома, в том числе Харлоу, Стоунхаусы, Мерлины, Сандерли, Бетли, Тауни, Уинги, Гудбразеры.</p></span><span id="id82"><div class="title1">
<p class="p">Дом Мартеллов</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_013.png"/>
</div><p class="p1">Нимерия, воинствующая королева ройнаров с десятью тысячами кораблей высадилась в Дорне, самом южном из Семи Королевств, и взяла в мужья лорда Морса Мартелла. С ее помощью он устранил всех, кто мешал ему добиться единоличной власти над Дорном. Ройнаров не забыли в стране. По обычаю правители Дорна называют себя принцами, а не королями. По местным законам земли и титулы наследуются старшим сыном. Лишь Дорн из всех Семи Королевств не был покорен Эйегоном Драконом. Постоянное присоединение состоялось лишь два века спустя — по браку и договору, а не мечом. Миролюбивый король Дейерон II преуспел там, где потерпели неудачи воины. Он женился на дорнийской принцессе Мириах и отдал свою сестру правящему принцу Дорнскому. На знамени Мартеллов красное солнце пронзено золотым копьем. Девиз их — «Не поклонившийся, не согнувшийся, не сломленный».</p><p class="empty-line"/><p class="p1">ДОРАН НИМЕРОС МАРТЕЛЛ, лорд Солнечного копья, принц Дорнский.</p><p class="p1">Его жена МЕЛАРИО из Вольного Города Норвоса.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">ПРИНЦЕССА АРИАННА, старшая дочь, наследница Золотого копья,</p><p class="p1">ПРИНЦ КВЕНТИН, их старший сын,</p><p class="p1">ПРИНЦ ТРИСТАН, их младший сын.</p><p class="p1"><strong>Его родственники:</strong></p><p class="p1">Сестра: ПРИНЦЕССА ЭЛИЯ, замужем за принцем Рейегаром Таргариеном, убита при взятии Королевской Гавани.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">ПРИНЦЕССА РЕЙЕНИС, маленькая девочка, убита при взятии Королевской Гавани.</p><p class="p1">ПРИНЦ ЭЙЕГОН, младенец, убит при взятии Королевской Гавани.</p><p class="p1">Его брат, ПРИНЦ ОБЕРИН, Красная Гадюка.</p><p class="p1"><strong>Его челядь:</strong></p><p class="p1">АРЕ ХОТАХ, норвошийский наемник, капитан гвардии,</p><p class="p1">МЕЙСТЕР КАЛЕОТТЕ, советник, целитель, наставник.</p><p class="p1">Его рыцари и лорды-знаменосцы:</p><p class="p1">ЕДРИК ДЕЙН, лорд Звездопада</p><p class="empty-line"/><p class="p1">Среди главных домов, присягнувших Солнечному копью, числятся Джордейны, Сантагары, Аллирионы, Толанды, Айронвуды, Уилы, Фаулеры и Дейны.</p></span><span id="id83"><div class="title1">
<p class="p">Старая династия</p>
<p class="p">Дом Таргариенов</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_014.png"/>
</div><p class="p1">Таргариены от крови дракона, потомки знатных лордов древнего Фригольда Валирии; о происхождении их свидетельствует потрясающая (некоторые утверждают — нечеловеческая) красота: сиреневые, индиговые или фиолетовые глаза, серебряные с золотым отливом или платиново-белые волосы.</p><p class="p1">Предки Эйегона уцелели при гибели Валирии и в последующем кровавом хаосе и поселились на Драконьем Камне, скалистом острове в Узком море. Именно отсюда Эйегон Драконовластный и его сестры Висенья и Рейенис отправились покорять Семь Королевств. Чтобы сохранить в чистоте королевскую кровь, в доме Таргариенов нередко предпочитали, придерживаясь валирийского обычая, выдавать сестру за брата. Сам Эйегон взял в жены обеих сестер и имел сыновей от каждой. На знамени Таргариенов изображен трехголовый дракон, красный на черном, три головы его символизируют Эйегона и его сестер. Девиз Таргариенов — «Пламя и кровь».</p><p class="subtitle">Династия Таргариенов в годах от высадки Эйегона</p><p class="p1">1—37, Эйегон I, Эйегон Завоеватель, Эйегон Драконовластный;</p><p class="p1">37—42, Эейгон I, Сын Эйегона и Рейнис</p><p class="p1">42—48, Мейегор I, Мейегор Жестокий, сын Эйегона и Висеньи</p><p class="p1">48—103, Джейехерис I, Старый король, Умиротворитель, сын Эйениса</p><p class="p1">103—129, Визерис I, Внук Джейехериса</p><p class="p1">129—131, Эйегон II, Старший сын Визериса (Восшествию на престол Эейгона воспротивилась его сестра Рейенира, старшая на год. Оба погибли в междуусобной войне, названной сказителями Пляской Драконов)</p><p class="p1">131—157, Эйегон III, Губитель Драконов, сын Рейениры (Во время правления Эйегона III умер последний дракон Таргариенов)</p><p class="p1">157—161, Дейерон I, Юный Дракон, Король-мальчик, старший сын Эйегона III (Дейерон покорил Дорн, но не сумел его удержать и умер молодым)</p><p class="p1">161—171, Бейелор I, Возлюбленный, Благословенный, септон и король, второй сын Эйегона III</p><p class="p1">171—72, Визерис II, Четвертый сын Эйегона III</p><p class="p1">172—184, Эйегон IV, Недостойный, старший сын Визериса (Его младший брат, принц Эйемон Рыцарь Драконов, назвал своей дамой королеву Нейерис и, по слухам, был ее любовником)</p><p class="p1">184—209, Дейрон II, Сын королевы Нейерис от Эйегона или Эйемона (Дейерон присоединил к государству Дорн своим браком на дорнийской принцессе Мириах)</p><p class="p1">209—221, Эйерис I, Второй сын Дейерона II (не оставил потомства)</p><p class="p1">221—233, Мейенар I, Четвертый сын Дейерона II</p><p class="p1">233—259, Эйегон V, Невероятный, четвертый сын Мейенара</p><p class="p1">259—262, Джейехерис II, Второй сын Эйегона Невероятного</p><p class="p1">262—283, Эйерис II, Безумный король, единственный сын Джейехериса</p><p class="empty-line"/><p class="p1">Династия королей-драконов пресеклась, когда Эйерис II был низвергнут и убит; наследник его кронпринц Рейегар Таргариен погиб от руки Роберта Баратеона у Трезубца.</p><p class="subtitle">Последние таргариены</p><p class="p1">КОРОЛЬ ЭЙЕРИС ТАРГАРИЕН, второй обладатель этого имени, убит Джейме Ланнистером во время взятия Королевской Гавани.</p><p class="p1">Его сестра и жена КОРОЛЕВА РЕЙЕЛЛА из дома Таргариенов, умерла в родах на Драконьем Камне.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">ПРИНЦ РЕЙЕГАР: наследник Железного трона, убит Робертом Баратеоном у Трезубца, его жена ПРИНЦЕССА ЭЛИЯ из дома Мартеллов, убита при взятии Королевской Гавани.</p><p class="p1"><strong>Их дети:</strong></p><p class="p1">ПРИНЦЕССА РЕЙЕНИС, маленькая девочка, убита при взятии Королевской Гавани,</p><p class="p1">ПРИНЦ ЭЙЕГОН, младенец, убит при взятии Королевской Гавани.</p><p class="p1">ПРИНЦ ВИЗЕРИС, называвшийся Визерисом, третьим носителем этого имени, лордом Семи Королевств, прозванный Нищим Королем,</p><p class="p1">ПРИНЦЕССА ДЕЙЕНЕРИС, прозванная Бурерожденная, дева тринадцати лет.</p></span></span>
