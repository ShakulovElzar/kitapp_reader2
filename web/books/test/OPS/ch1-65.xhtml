<span id="id63"><div class="title2">
<p class="p">Тирион</p>
</div><p class="p1">На холме, выходящем на Королевский тракт, под ильмом поставили на козлах длинный стол из грубых сосновых досок и застелили золотой тканью, чтобы лорд Тайвин мог отужинать возле своего шатра со своими ближними рыцарями и лордами-знаменосцами. Огромные штандарты — алый и золотой — развевались над ними на высоком древке.</p><p class="p1">Тирион опоздал; недовольный собой, сбив ноги о седло, он ковылял по склону, слишком отчетливо представляя, какое впечатление производит на отца. Дневной переход выдался длинным и утомительным, и он рассчитывал сегодня крепко выпить. Сгущались сумерки, и в воздухе кружили мерцающие светляки.</p><p class="p1">Повара подавали мясное блюдо: пятерых молочных поросят, зажаренных до хруста, с разными плодами в зубах. Запах наполнил его рот слюной.</p><p class="p1">— Приношу свои извинения, — начал он, занимая на скамье место возле своего дяди.</p><p class="p1">— Наверное, мне придется поручить тебе хоронить убитых, Тирион, — проговорил лорд Тайвин. — Если ты выедешь на поле боя с таким же опозданием, как к столу, сражение закончится до твоего появления.</p><p class="p1">— О, конечно, ты оставишь для меня мужика с вилами, а то и двух, отец, — отвечал Тирион. — Но не слишком много, я не хочу быть жадным.</p><p class="p1">Наполнив вином чашу, он посмотрел на слугу, нарезавшего свинину. Корочка хрустела под его ножом, из мяса выступал горячий сок. Более приятного зрелища Тирион не видел целый век.</p><p class="p1">— Разведчики сира Аддама утверждают, что войско Старков двинулось на юг от Близнецов, — сообщил отец, когда блюдо его было наполнено ломтями свинины. — К ним присоединились подданные лорда Фрея. Они находятся менее чем в одном дневном переходе к северу от нас.</p><p class="p1">— Пожалуйста, отец, — попросил Тирион. — Я хочу поесть.</p><p class="p1">— Неужели мысль о том, что нам предстоит встреча с мальчишкой Старка, лишает тебя мужества, Тирион? Твой брат Джейме был бы рад схватиться с ним.</p><p class="p1">— Я предпочту схватиться с этой свиньей. Робб Старк не настолько мягок, и от него никогда не пахло так сладко.</p><p class="p1">Лорд Леффорд, кислый тип, следивший за съестным и прочим припасом, повернулся к Тириону:</p><p class="p1">— Я надеюсь, что ваши дикари не разделяют подобной застенчивости, иначе мы понапрасну израсходовали на них добрую сталь.</p><p class="p1">— Мои дикари самым лучшим образом воспользуются вашей сталью, милорд, — ответил Тирион. Когда он рассказал Леффорду, что ему нужны оружие и доспехи на сотню мужчин, которых он привел из предгорий, тот скривился так, что можно было подумать, что его просили отдать им для увеселения собственных девственных дочерей.</p><p class="p1">Леффорд нахмурился:</p><p class="p1">— Я сегодня видел огромного и волосатого — того, который утверждал, что ему нужно два боевых топора из тяжелой черной стали с лезвиями в форме двух полумесяцев.</p><p class="p1">— Шагга любит убивать обеими руками, — проговорил Тирион, когда перед ним поставили блюдо с дымящейся свининой.</p><p class="p1">— Он так и не снял со спины свой топор дровосека.</p><p class="p1">— Шагга полагает, что три топора полезнее, чем два. — Тирион взял щепоть соли из блюда и густо посыпал мясо.</p><p class="p1">Сир Киван наклонился вперед:</p><p class="p1">— Мы решили поставить тебя с дикарями в авангард, когда дело дойдет до битвы.</p><p class="p1">Мысли редко приходили в голову сира Кивана, не побывав предварительно в голове лорда Тайвина. Тирион насадил было ломоть мяса на острие кинжала и поднес ко рту. Но теперь сразу опустил кусок свинины.</p><p class="p1">— В авангард? — переспросил он с сомнением в голосе. Либо лорд-отец воспылал новым уважением к способностям Тириона, либо же решил сразу отделаться от его сомнительного приобретения. Мрачная рассудительность подсказала Тириону правильный ответ.</p><p class="p1">— Они показались мне достаточно свирепыми.</p><p class="p1">— Свирепыми? — Тирион понял, что повторяет слова дяди, словно ученая птица. А отец наблюдает за ними, взвешивая и оценивая каждое слово. — Позвольте мне рассказать, насколько они свирепы. Вчера ночью один из Лунных Братьев заколол Каменную Ворону из-за сосиски. Сегодня, когда мы остановились лагерем, трое Каменных Ворон схватили его и перерезали глотку. Зачем — не знаю; наверное, они надеялись получить сосиску назад. Бронн не позволил Шагге отрезать хрен мертвеца, и слава за то богам, однако сейчас Улф требует денег за кровь, а Конн и Шагга отказываются платить.</p><p class="p1">— Когда солдаты не умеют соблюдать дисциплину, виноват их лорд-командир, — заметил отец.</p><p class="p1">Брат его Джейме всегда умел заставить людей последовать за ним — и умереть, если придется. Тирион был лишен этого дара. Верность он приобрел золотом, а повиновения добился своим именем.</p><p class="p1">— Более рослый человек, должно быть, сумел бы вселить в них страх, если вы имеете в виду это, милорд.</p><p class="p1">Лорд Тайвин повернулся к своему брату:</p><p class="p1">— Если отряд моего сына не повинуется ему, быть может, авангард — не их место. Вне сомнения, ему будет удобнее в тылу — охранять наш обоз.</p><p class="p1">— Пожалуйста, не заботьтесь обо мне, отец, — проговорил Тирион сердитым голосом. — Если вы не предложите мне ничего другого, я поведу ваш авангард.</p><p class="p1">Лорд Тайвин поглядел на своего сына.</p><p class="p1">— Я ничего не говорил о командовании авангардом. Ты будешь подчиняться сиру Григору.</p><p class="p1">Откусив кусок свинины, Тирион пожевал и с негодованием выплюнул его.</p><p class="p1">— Похоже, мне расхотелось есть, — сказал он, неловко перелезая через скамейку. — Прошу извинить меня, милорды.</p><p class="p1">Лорд Тайвин наклонил голову, отпуская его. Тирион повернулся и направился прочь. Ковыляя вниз по склону, он ощущал спиной общее внимание. Позади поднялся громкий хохот, однако Тирион не обернулся и только пожелал про себя, чтобы все они подавились этими молочными поросятами.</p><p class="p1">Спустился сумрак, превратив все знамена в траурные. Лагерь Ланнистеров занял несколько миль между рекой и Королевским трактом. Среди людей и деревьев было нетрудно потеряться, и Тирион заблудился.</p><p class="p1">Он прошел мимо дюжины огромных шатров и сотни костров. Светляки блуждающими звездами реяли между палаток. Запахло чесночными сосисками, острый аромат заставил взвыть пустой желудок. Вдалеке нестройный хор завел непристойную песню. Мимо него метнулась, хихикая, женщина; наготу ее прикрывал только темный плащ, пьяный преследователь спотыкался о корни. Еще дальше двое копейщиков, став друг напротив друга над узеньким ручейком, нападали и защищались попеременно, успев уже взмокнуть.</p><p class="p1">Никто не глядел на Тириона. Никто не говорил с ним. Никто не обращал на него никакого внимания. Он был окружен людьми, присягнувшими дому Ланнистеров, целым войском в двадцать тысяч человек, и все же он был один.</p><p class="p1">Он нашел стан Каменных Ворон, укрывшихся в уголке ночи, лишь по грохочущему хохоту Шагги. Конн, сын Коратта, махнул ему кружкой эля.</p><p class="p1">— Эй, Тирион-полумуж! Иди, садись возле нашего огня, раздели мясо с Каменными Воронами, мы добыли быка.</p><p class="p1">— Я вижу это, Конн, сын Коратта.</p><p class="p1">Над ревущим огнем висела огромная кровавая туша на вертеле размером с небольшое дерево. Собственно говоря, это и было небольшое дерево. Кровь и жир капали в пламя, а двое Каменных Ворон поворачивали быка.</p><p class="p1">— Благодарю, позовите, когда мясо испечется. — Судя по всему, это могло случиться лишь перед самой битвой.</p><p class="p1">Тирион пошел дальше.</p><p class="p1">Каждый клан собрался вокруг собственного очага. Черноухие не ели с Каменными Воронами, те не садились рядом с Лунными Братьями, и уж вовсе никто не делил трапезу с Обгорелыми. Скромная палатка, которую он лестью добыл из припасов лорда Леффорда, была расставлена посреди четырех костров. Тирион увидел Бронна, делившегося вином из меха с новыми слугами. Лорд Тайвин прислал сыну слугу и конюха и даже настоял, чтобы он взял сквайра. Они собрались вокруг угольков небольшого костра. С ними была девушка — тонкая, темноволосая, не старше восемнадцати лет, если судить по виду. Тирион поглядел на нее какое-то мгновение, а потом заметил в пепле рыбные кости.</p><p class="p1">— Что вы ели?</p><p class="p1">— Форель, милорд, — ответил конюх. — Бронн наловил рыбы.</p><p class="p1">Форель, подумал Тирион, скорбно разглядывая кости. Молочный поросенок. Проклятый отец. В желудке его урчало.</p><p class="p1">Юный Подрик, его сквайр, носивший зловещую фамилию Пейн, проглотил те слова, которые уже собрался сказать. Парнишка был дальним родственником сира Илина Пейна, королевского палача… и вел себя почти столь же молчаливо, хотя не из-за отсутствия языка. Тирион даже заставил его однажды открыть рот, чтобы проверить…</p><p class="p1">— Ну, видишь, язык есть, — проговорил он. — Когда-нибудь ты научишься им пользоваться.</p><p class="p1">В настоящий момент Тирион не имел настроения извлекать эту мысль из парня, которого — как он подозревал — навязали ему в порядке грубой насмешки, а посему обратил внимание на девушку.</p><p class="p1">— Это она? — спросил он у Бронна. Девица поднялась изящным движением и поглядела на него сверху вниз — с высоты своих скромных пяти с чем-то там футов.</p><p class="p1">— Да, милорд, и я могу говорить сама, если это угодно вам.</p><p class="p1">Он наклонил голову набок.</p><p class="p1">— А я Тирион из дома Ланнистеров. Люди зовут меня Бесом.</p><p class="p1">— Мать назвала меня Шаей. А мужчины зовут… нередко.</p><p class="p1">Бронн расхохотался, и Тирион тоже улыбнулся.</p><p class="p1">— Пройдем в палатку, Шая, если ты не против. — Подняв полог, он пригласил ее войти. Внутри шатра он пригнулся, чтобы зажечь свечу.</p><p class="p1">Жизнь солдата имела определенные преимущества. Во всяком военном лагере находились те, кто непременно увязывался за воинами. В конце дневного перехода Тирион отослал Бронна назад, чтобы тот отыскал ему шлюху поприятнее.</p><p class="p1">— Лучше, чтоб была помоложе и посимпатичнее, но — какую найдешь. Я уже буду рад, если она хоть раз умывалась в этом году. Если нет, пусть умоется. Но скажи ей, кто я, и предупреди, каков из себя.</p><p class="p1">Джик не всегда утруждал себя этим, и в глазах девиц при виде лорденыша, которого они собирались потешить, появлялось нечто совсем иное… чего Тирион Ланнистер не желал бы видеть.</p><p class="p1">Подняв свечу, он оглядел ее. Бронн постарался: тоненькая, с глазами голубки, твердые и маленькие грудки… и улыбка, то застенчивая, то наглая и ехидная. Ему это понравилось.</p><p class="p1">— Снять ли мне и рубашку, милорд? — спросила она.</p><p class="p1">— В свое время. Ты, случайно, не девственна, Шая?</p><p class="p1">— Если это вам угодно, милорд, — сказала она.</p><p class="p1">— Мне угодно слышать правду, девица.</p><p class="p1">— Да, но это обойдется вам в два раза дороже!</p><p class="p1">Тирион решил, что они сумеют поладить.</p><p class="p1">— Я — Ланнистер. Золота у меня много, не сомневайся в моей щедрости. Но я потребую от тебя большего, чем то, что есть у тебя между ногами, хотя мне нужно и это. Ты будешь делить со мной шатер, подавать мне вино, смеяться над моими шутками, растирать мои ноги после дневных переходов… и продержу ли я тебя день или год, но пока мы вместе, ты не примешь в свою постель никого другого.</p><p class="p1">— Мне и вас вполне достаточно. — Она потянулась к подолу своей грубой домотканой рубахи и, одним движением стянув ее через голову, отбросила в сторону. Под рубахой не было ничего, кроме Шаи. — Если вы не опустите эту свечу, милорд, она обожжет ваши пальцы.</p><p class="p1">Тирион опустил свечу, взял ее за руку и притянул к себе. Шая пригнулась, чтобы поцеловать его. Рот ее пах медом и гвоздикой, ловкие и умелые пальцы отыскали застежки его одежды.</p><p class="p1">Когда он вошел в нее, она подбодрила его ласковыми словами и тихим удовлетворенным вздохом. Тирион подозревал, что восторг свой она изобразила, однако Шая сделала это хорошо и ему было все равно. Зачем знать обо всем правду?</p><p class="p1">В том, насколько Шая была нужна ему, Тирион убедился, когда она — после — притихла в его руках. Она или любая другая женщина. Прошел почти уже год с тех пор, когда он в последний раз делил ложе с женщиной; было это, когда он направлялся в Винтерфелл в обществе своего брата и короля Роберта. Вполне возможно, что смерть встретит его завтра или послезавтра, так что лучше отправиться на тот свет, вспоминая Шаю, а не лорда-отца или леди Кейтилин Старк.</p><p class="p1">Он ощущал плечом ее мягкие груди. Приятное чувство. Песня наполняла его голову, и Тирион негромко засвистел.</p><p class="p1">— Что это, милорд? — прошептала Шая, прижимаясь к нему.</p><p class="p1">— Ничего, — отвечал он. — Песня, которую я запомнил мальчишкой, и ничего более, моя милая.</p><p class="p1">Когда глаза ее закрылись, а дыхание сделалось ровным и медленным, Тирион выскользнул из-под нее — осторожно, чтобы не потревожить ее сон. Голым он выбрался наружу, переступил через сквайра и отправился за шатер, чтобы побрызгать.</p><p class="p1">Бронн сидел под каштаном, скрестив ноги, возле привязанных лошадей. Даже не думая спать, он точил острие меча. Он, похоже, не так нуждался во сне, как обычный человек.</p><p class="p1">— Где ты отыскал ее? — спросил его Тирион, мочась.</p><p class="p1">— Отобрал у рыцаря. Он не хотел расставаться с ней, но ваше имя несколько переменило его настроение… ну и мой кинжал у горла.</p><p class="p1">— Великолепно, — сухо сказал Тирион, отрясая последние капли. — Кажется, я просил найти мне шлюху, а не врага.</p><p class="p1">— Хорошенькие все при деле, — сказал Бронн. — Охотно отведу эту обратно, если ты предпочтешь беззубую каргу.</p><p class="p1">Тирион прохромал к месту, где сидел наемник.</p><p class="p1">— Мой лорд-отец назвал бы эти слова наглостью и сослал бы тебя в рудники в качестве наказания.</p><p class="p1">— Стало быть, мне повезло, что ты не твой отец, — ухмыльнулся Бронн. — Я тут видел одну — вся рожа в прыщах, может, хочешь?</p><p class="p1">— Ну что ты… разбивать твое сердце? — ответил Тирион. — Я оставлю себе Шаю. Послушай, а ты не запомнил имя рыцаря, у которого отобрал ее? Я бы не хотел, чтобы он оказался возле меня в битве.</p><p class="p1">Бронн поднялся с кошачьей легкостью и быстротой, повернул меч в руке.</p><p class="p1">— В битве я буду рядом с тобой, карлик.</p><p class="p1">Тирион кивнул. Теплый ночной воздух проникал к его нагой коже.</p><p class="p1">— Позаботься, чтобы я уцелел в этой битве, и можешь требовать, что захочешь.</p><p class="p1">Бронн перебросил меч из правой руки в левую, замахнулся.</p><p class="p1">— Ну кто захочет убивать такого, как ты?</p><p class="p1">— Например, мой лорд-отец. Он поставил меня в авангард.</p><p class="p1">— Я сделал бы то же самое. Маленький воин за большим щитом. Стрелки помрут от расстройства.</p><p class="p1">— Твои слова вселяют в меня непонятную бодрость, — улыбнулся Тирион. — Должно быть, я свихнулся.</p><p class="p1">Бронн вернул меч в ножны.</p><p class="p1">— Вне сомнения.</p><p class="p1">Когда Тирион вернулся в шатер, Шая перекатилась на локоть и сонным голосом пробормотала:</p><p class="p1">— Я проснулась, а милорд исчез…</p><p class="p1">— Милорд вернулся. — Он скользнул рядом с ней. Ладонь Шаи направилась к развилке между его коротких ног и обнаружила там нечто твердое.</p><p class="p1">— Вернулся, — согласилась она, оглаживая его.</p><p class="p1">Тирион спросил, у кого отобрал ее Бронн, Шая назвала мелкого вассала кого-то из незначительных лордов.</p><p class="p1">— Его можно не опасаться, милорд, — сказала девушка, занимаясь его предметом. — Он не из больших людей.</p><p class="p1">— А как насчет меня? — спросил Тирион. — Или я гигант?</p><p class="p1">— О да, — промурлыкала она. — Мой гигант среди Ланнистеров. — А потом уселась на него и на какое-то время почти заставила Тириона поверить в это. Он заснул улыбаясь…</p><p class="p1">…И проснулся во тьме от рева труб. Шая трясла его за плечо.</p><p class="p1">— Милорд, — прошептала она. — Просыпайтесь, милорд, мне страшно.</p><p class="p1">Сонный он поднялся, отбросил назад одеяло. Трубы трубили в ночи, дикий и настоятельный голос их говорил: «Торопись, торопись, торопись». Раздавались крики, стук копий, ржание коней, но ничто не говорило о схватке.</p><p class="p1">— Трубы моего отца, — сказал он. — Боевой сбор; я слыхал, что Старк находится в дневном переходе отсюда.</p><p class="p1">Шая растерянно затрясла головой. Глаза ее расширились и побелели.</p><p class="p1">Тирион со стоном поднялся на ноги и, выбравшись в ночь, крикнул сквайра. Клочья белого тумана тянулись к нему от реки длинными пальцами. Люди и кони двигались в предутреннем холодке: вокруг седлали коней, грузили фургоны, гасили костры. Трубы запели снова: торопись, торопись, торопись! Рыцари поднимались на всхрапывающих коней, латники застегивали на бегу пояса с мечами. Когда он нашел Пода, оказалось, что мальчишка негромко храпит.</p><p class="p1">Тирион резко ткнул его пальцем в ребра.</p><p class="p1">— Панцирь, — сказал он, — и быстро.</p><p class="p1">Бронн выехал рысцой из тумана на коне, в панцире и в видавшем виды шишаке.</p><p class="p1">— Ты знаешь, что происходит? — спросил его Тирион.</p><p class="p1">— Мальчишка Старк надул нас на целый переход, — сказал Бронн. — Всю ночь он полз по Королевскому тракту, и теперь его войско менее чем в миле к северу отсюда разворачивается в боевой порядок.</p><p class="p1">Торопись, звали трубы, торопись, торопись!</p><p class="p1">— Проверь, готовы ли горцы? — Тирион нырнул в шатер. — Где моя одежда? — рявкнул он Шае. — Сюда. Нет, кожу, проклятие. Да принеси мне сапоги!</p><p class="p1">Пока он одевался, сквайр приготовил его доспехи. Вообще-то Тириону принадлежал прекрасный тяжелый панцирь, великолепно подогнанный под его уродливое тело. Увы, в отличие от Тириона он пребывал в полной безопасности на Бобровом утесе. Так что карлику пришлось воспользоваться разнородными предметами, полученными от лорда Леффорда: кольчужными калберком и шапкой, воротником убитого рыцаря, поножами, перчатками и остроносыми стальными сапогами. Кое-что было украшено, кое-что нет. Не все предметы подходили друг к другу и сидели на нем так, как следовало бы. Нагрудная пластина предназначалась для более рослого человека, для его большой головы едва отыскали огромный шлем ведерком, увенчанный треугольной пикой.</p><p class="p1">Шая помогала Поду с застежками и пряжками.</p><p class="p1">— Если я погибну, поплачь, — сказал Тирион шлюхе.</p><p class="p1">— А как ты узнаешь? Мертвый-то?</p><p class="p1">— Узнаю.</p><p class="p1">— И я так думаю. — Шая опустила огромный шлем на его голову, и Под привязал его к воротнику. Тирион застегнул пояс, отягощенный коротким мечом и кинжалом. К тому времени конюх подвел ему коня, рослого, в столь же тяжелой броне. Тириону нужна была помощь, чтобы подняться в седло; ему казалось, что он весит добрую тысячу стоунов. Под вручил ему щит — толстую доску из тяжелого железоствола, охваченную сталью. Наконец ему подали боевой топор. Шая, отступив назад, оглядела его.</p><p class="p1">— Милорд восхищает меня.</p><p class="p1">— Милорд похож на карлика в неподогнанной броне, — ответил кислым голосом Тирион, — однако все равно спасибо за доброту. Подрик, если битва сложится против нас, проводи даму домой. — Отсалютовав топором, Тирион развернул коня и направился прочь. Желудок его свернулся в тугой и болезненный клубок. Позади него слуги поспешно собирали шатер. Солнце уже тянуло вверх свои бледно-пурпурные пальцы из-за восточного горизонта. Густая синева на западе была еще усеяна звездами. Тирион подумал, что в последний раз встречает рассвет, и попытался уразуметь, не свидетельствует ли такая мысль о его трусости. Думает ли о смерти его брат Джейме перед битвой?</p><p class="p1">Вдали прозвучал боевой рог, глубокая скорбная нота холодила душу. Горцы садились на своих мохнатых коньков, обмениваясь ругательствами и грубыми шутками. Несколько человек показались ему пьяными. Встающее солнце начало сжигать ползучие щупальца тумана, когда Тирион повел свой отряд. Оставленная лошадьми трава отяжелела от росы, словно какой-то бог мимоходом высыпал на землю мешок алмазов. Горцы ехали следом за Тирионом, каждый клан после своего предводителя.</p><p class="p1">Армия лорда Тириона Ланнистера раскрывалась под лучами зари — словно железная роза, ощетинившаяся шипами.</p><p class="p1">Дядя его возглавит центр: сир Киван поднял свои штандарты на Королевском тракте. С колчанами у поясов пешие стрелки выстроились тремя длинными шеренгами к востоку и западу от дороги и уже невозмутимо надевали тетивы. Между ними квадратом стояли копейщики, позади них выстроились латники с мечами, копьями и топорами. Три сотни тяжелой конницы окружали сира Кивана и лордов-знаменосцев Леффорда, Лиддена, Серрета и всех, присягнувших им.</p><p class="p1">На правом крыле была только конница — почти четыре тысячи, — отягощенная весом брони. Более чем три четверти рыцарей находились там, образуя огромный стальной кулак. Командовал им сир Аддам Марбранд. Тирион увидел, как развернулась его хоругвь, когда знаменосец тряхнул ею. Горящее дерево, дым на оранжевом фоне. Позади него затрепетали стяги — сира Флемента с пурпурным единорогом, пятнистый вепрь Кракехолла, бентамский петушок Свифтов и так далее…</p><p class="p1">Его лорд-отец оставался на холме, где провел ночь. Вокруг него собрался резерв — огромная сила, наполовину конница, наполовину пешие, целых пять тысяч. Лорд Тайвин почти всегда предпочитал командовать резервом. Занимая высокое место, он наблюдал за ходом сражения, вводя свои силы именно там и тогда, когда это было нужно больше всего. Даже издалека его лорд-отец казался великолепным. Боевое облачение Тайвина Ланнистера, бесспорно, посрамило Джейме с его позолоченным панцирем. Огромный плащ, сшитый из бесчисленных слоев золотой ткани, был настолько тяжел, что едва шевелился, когда лорд Тайвин трогался с места, и настолько велик, что закрывал почти целиком задние ноги коня. Ни одна обычная застежка не выдержала бы подобной тяжести, поэтому великий плащ удерживался на месте парой миниатюрных львиц, изгибавшихся на его плечах, словно готовясь к прыжку. Их супруг, лев с великолепной гривой, полулежал на великом шлеме лорда Тайвина, разрывая воздух лапой и рыком. Все три фигуры были отлиты из золота, а рубины заменяли им глаза. Пластинчатый панцирь лорда Тайвина покрывала темно-пурпурная эмаль, поножи и перчатки были выложены причудливыми золотыми узорами. Налокотники напоминали золотые звезды, все застежки были вызолочены, а красная сталь просто сияла огнем в лучах восходящего солнца.</p><p class="p1">Тирион уже слышал рокот барабанов противника. Ему вспомнился чертов Винтерфелл и Робб Старк в момент последней их встречи — на высоком престоле отца, с обнаженным мечом в руках. Потом он вспомнил, как на него набросились лютоволки, и вдруг увидел зверей снова — скалящихся, обнажающих зубы перед его лицом. Взял ли мальчишка своих волков на войну? Мысль эта заставила Тириона поежиться.</p><p class="p1">Северяне, наверное, утомлены долгим ночным переходом. Тирион попробовал представить себе, на что рассчитывал парень. Неужели он действительно надеялся застать их врасплох во время сна? На это было немного шансов; что бы ни говорили, Тайвина Ланнистера одурачить было невозможно.</p><p class="p1">Авангард собирался слева. Тирион увидел первый штандарт: три черных пса на желтом фоне. Под ним восседал Григор — на самом большом коне из всех, которых доводилось когда-либо видеть Тириону.</p><p class="p1">Поглядев на него, Бронн ухмыльнулся:</p><p class="p1">— В бою всегда следуй за рослым.</p><p class="p1">Тирион подозрительно поглядел на него.</p><p class="p1">— А почему так?</p><p class="p1">— Из них получается великолепная цель. А уж этот притянет к себе внимание каждого лучника.</p><p class="p1">Рассмеявшись, Тирион поглядел на Гору свежим взглядом.</p><p class="p1">— Признаюсь, я никогда не воспринимал его в таком свете.</p><p class="p1">Клиган не был окружен великолепием, тускло-черная сталь пластинчатого панциря была покрыта щербинами, оставленными долгим употреблением, и не была украшена ничем — даже гербом. Сир Григор указывал своим людям их места великим двуручным мечом, держа его в одной руке, словно какой-то кинжал.</p><p class="p1">— Того, кто побежит, я зарублю сам, — проревел он, заметив Тириона. — Бес! Налево, держи реку, если сумеешь.</p><p class="p1">На левый фланг левого фланга. Чтобы обойти их, Старкам потребуются кони, способные бежать по воде. Тирион повел своих людей к берегу.</p><p class="p1">— Видите?! — прокричал он, указывая топором. — Река. — Полотнище белого тумана до сих пор висело над поверхностью воды, над мутно-зеленым и глубоким, бурлящим руслом. Илистое мелководье заросло тростником. — Эта река — наша. Что бы ни случилось, держитесь возле воды. И никогда не теряйте ее из вида. Пусть враг не отрежет нас от нее, а если они посмеют осквернить наши воды, секите их и бросайте рыбам.</p><p class="p1">Шагга, державший по топору в каждой руке, звонко стукнул ими друг о друга.</p><p class="p1">— За полумужа! — закричал он. Остальные Каменные Вороны присоединились к его боевому кличу. Черноухие и Лунные Братья тоже. Обгорелые не кричали, но и они постучали мечами о копья.</p><p class="p1">— За полумужа! За полумужа! За полумужа!</p><p class="p1">Тирион направил коня полукругом, чтобы оглядеть поле. Покатый и неровный склон, мягкий и глинистый у реки, неторопливо поднимался к Королевскому тракту, за которым на востоке начиналась обычная здесь каменистая и неровная местность. На склонах можно было видеть несколько деревьев, но в основном земля была расчищена и обработана. Сердце колотилось и грохотало в груди Тириона, повторяя ритм барабанов, и под сталью чело его увлажнилось по́том.</p><p class="p1">Он проводил взглядом сира Григора, когда Гора два раза проехал вдоль линии, жестикулируя и что-то выкрикивая. Это крыло было тоже составлено из конницы, но если справа располагался бронированный кулак из рыцарей и тяжеловооруженной кавалерии, то авангард войска западного края составили из отбросов: лучников в кожаных куртках, нестройной массы неприученных к боевому порядку вольных всадников и наемников, сельских работников на пахотных лошадях с косами и ржавыми мечами, полученными от отцов, недоученных ребят из борделей Ланниспорта, ну и Тириона с его горцами.</p><p class="p1">— Вороний харч, — пробормотал рядом Бронн слова, которые Тирион оставил при себе. Ему пришлось только кивнуть. Неужели его лорд-отец лишился рассудка? Нет копейщиков, горстка лучников, несколько рыцарей, плохо вооруженное ополчение, и командует безмозглое чудовище, склонное к припадкам слепой ярости… Как может ожидать лорд Тайвин, что эта пародия на боевые ряды удержит его левый фланг?</p><p class="p1">Впрочем, на размышления у него не было времени. Барабаны били так близко, что мороз заползал под его кожу, заставляя холодеть руки. Бронн извлек меч, и тут враг разом появился перед ними; кипящая масса размеренным шагом потекла через гребень холма, приближаясь за стеной из щитов и пик.</p><p class="p1">Проклятие богам, какая силища, подумал Тирион, даже зная, что отец вывел на поле больше людей. Войско вели капитаны на закованных в железо конях, ехавшие под собственными знаменами. Он заметил лося Хорнвудов, колючую звезду Карстарков, боевой топор лорда Сервина, кольчужный кулак Гловеров… и двойные башни Фреев, голубые на сером. Вот и плата за уверенность его отца в том, что лорд Уолдер не станет утруждать себя. Белый флаг дома Старков был виден повсюду, серые лютоволки бежали и прыгали на знаменах, рвались с высоких древков. А где же мальчишка? Хорошо было бы догадаться, подумал Тирион.</p><p class="p1">Пропел боевой горн. «Харууууууууууууууу», — говорил он голосом, низким и холодным, как ветер, дувший с севера. Ответили трубы Ланнистеров: да-да, да-да-да-ДАААААААААА! Медный и возмущенный голос их показался Тириону менее громким и слегка неуверенным. Он ощутил шевеление в своем чреве, неприятное чувство; оставалось только надеяться, что умрет он не от поноса.</p><p class="p1">Трубы умолкли, и воздух над полем зашипел. Лучники, стоявшие у дороги, засыпали войско Старков стрелами. Северяне с боевым кличем перешли на бег, но стрелы Ланнистеров сыпались на них градом — сотнями, тысячами, клич рассыпался в вопли, люди спотыкались и падали. Но второй залп был уже в воздухе, и лучники накладывали третью стрелу на тетиву.</p><p class="p1">Тут трубы пропели снова. Да-ДААА, да-ДААА, да-ДА, да-Да да-ДААААААА. Сир Григор махнул огромным мечом и рыкнул команду, тысячи голосов присоединились к нему. Тирион пришпорил коня, добавляя еще один голос к какофонии, авангард рванулся вперед.</p><p class="p1">— У реки, — крикнул он горцам, когда они тронулись с места. — Помните, держитесь реки!</p><p class="p1">Он еще был впереди, когда они прибавили ходу, наконец Чилла, испустив вопль, от которого кровь застывала в жилах, галопом опередила его. Шагга взвыл и последовал за ней. Горцы бросились вперед, оставив Тириона в пыли.</p><p class="p1">Встречая их, копейщики врага выстроились полукругом, двойная изгородь копий торчала стальной щетиной из-за высоких деревянных щитов с золотой звездой Карстарков. Григор Клиган первым достиг их во главе клина опытных латников. Половина коней попятилась в последнюю секунду, остановив бег перед рядом копий. Остальные погибли, когда стальные острия разорвали их тело, на землю упала, наверное, дюжина нападавших. Конь Горы взвился на дыбы, молотя по воздуху окованными железом копытами, когда зубастый наконечник копья распорол ему шею. Обезумевший зверь рванулся вперед. Копья пронзали его с обеих сторон, но стена щитов развалилась под его весом. Северяне отшатнулись, опасаясь предсмертных движений животного. Конь упал, обливаясь кровью, но Гора поднялся целым и невредимым, размахивая вокруг великим двуручным мечом.</p><p class="p1">Шагга пролетел в брешь прежде, чем щиты успели сомкнуться, остальные Каменные Вороны последовали за ним.</p><p class="p1">Тирион закричал:</p><p class="p1">— Обгорелые! Лунные Братья! За мной! — Впрочем, почти все они были впереди него. Тиметт уже соскакивал с коня, убитого на полном скаку, кто-то из Лунных Братьев повис, пронзенный копьем Карстарка, конь Конна, лягнув, сломал ребро воину врагов. Посыпались стрелы — неизвестно кем пущенные, — падали они и на Старков, и на Ланнистеров, отскакивая от брони или находя плоть. Прикрываясь, Тирион поднял щит.</p><p class="p1">Изгородь рушилась, северяне отступали под натиском конных. Тирион видел, как Шагга сразил копейщика ударом в грудь, когда дурень попытался шагнуть вперед; топор разрубил и панцирь, и кожу, и мышцы, вскрыв легкое. Северянин умер мгновенно, но топор завяз в его груди, а Шагга отправился дальше, успев расколоть надвое чей-то щит ударом топора в левой руке; правая же удерживала на весу труп.</p><p class="p1">Наконец мертвец сполз с древка. Шагга ударил топором о топор и заревел.</p><p class="p1">Но тут враг приблизился к Тириону, от всей битвы осталось лишь несколько футов земли вокруг коня. Латник ударил Тириона в грудь, движением топора он отбил копье. Враг отступил назад для новой попытки, но Тирион пришпорил коня и затоптал его. Бронна окружали трое, но он уже снес наконечник с первого копья и обратным движением сумел ударить клинком в лицо второму противнику.</p><p class="p1">Брошенное копье с гулким стуком вонзилось в щит Тириона. Повернув, он погнался за кидавшим, но тот поднял щит высоко над головой. Тирион объезжал его, осыпая дерево ударами топора. Полетели дубовые щепки, наконец северянин оступился и упал на спину, прикрываясь щитом. Он был за пределами досягаемости топора, а спешиваться было бы слишком сложно, и поэтому Тирион направился к другому противнику, взяв его сзади ударом, больно отозвавшимся в руке. Получив мгновенную передышку, он оглянулся, отыскивая взглядом реку. Она оказалась справа. Каким-то образом он развернулся в обратную сторону.</p><p class="p1">Мимо, привалившись к холке коня, проехал кто-то из Обгорелых. Копье пронзило его живот, наконечник торчал из спины. Он был за пределами помощи, однако, заметив, что один из северян попытался схватить за поводья, Тирион бросился вперед. Противник встретил его с мечом. Высокий и ловкий, в длинной кольчуге и перчатках из стали, он потерял свой шлем, и кровь текла на его глаза из раны на лбу. Тирион ударил в лицо, но высокий отбил удар в сторону.</p><p class="p1">— Карлик, — завопил он. — Умри.</p><p class="p1">Он поворачивался, пока Тирион объезжал его, рубя по голове и плечам. Сталь звенела о сталь, и Тирион скоро понял, что человек этот быстрее и сильнее его. В которое же пекло из семи провалился этот Бронн?</p><p class="p1">— Умри, — зарычал противник, нанося отчаянный удар.</p><p class="p1">Тирион едва успел поднять щит, и дерево словно взорвалось под могучим ударом, осыпав щепками его руку.</p><p class="p1">— Умри, — завопил меченосец, ударив Тириона в висок так, что в голове его зазвенело. Клинок врага скрежетнул по стали шлема. Высокий ухмыльнулся… но тут конь Тириона со змеиной быстротой укусил его, открыв щеку до кости. Враг закричал, и Тирион погрузил топор в его голову.</p><p class="p1">— Сам умри, — сказал он; противнику другого и не оставалось.</p><p class="p1">Вырвав свой топор, Тирион услыхал крик.</p><p class="p1">— За Эддарда! — звенел голос. — За Эддарда Винтерфелла!</p><p class="p1">На него наезжал рыцарь, размахивая шипастым кистенем над головой. Кони сошлись, прежде чем Тирион успел позвать Бронна. Правый локоть его взорвался от боли, когда шипы пронзили тонкий металл возле сустава. Топор мгновенно куда-то запропастился, он потянулся к мечу, но кистень вновь закружил, метя в его лицо. Мерзкий хруст предшествовал его падению. Тирион не помнил, как оказался на земле, но когда он поглядел вверх, над ним было лишь только небо. Тирион перекатился на бок, попытался подняться на ноги, но боль пронзила его, и мир вокруг запульсировал. Рыцарь, выбивший его из седла, остановился.</p><p class="p1">— Тирион-Бес, — прогрохотал он. — Ты — мой. Сдаешься, Ланнистер?</p><p class="p1">Да, подумал Тирион, но слово застряло в его горле. Крякнув, он попытался подняться на колени, отыскать оружие. Меч, кинжал, что угодно…</p><p class="p1">— Сдаешься? — Рыцарь на бронированном коне нависал над ним. Человек и лошадь казались огромными. Шипастый шар лениво кружил в воздухе. Руки Тириона онемели, он плохо видел, ножны были пусты.</p><p class="p1">— Сдавайся или умри, — объявил рыцарь, ускоряя вращение шара. Вскочив на ноги, Тирион ткнул головой в брюхо коня. Животное с ужасным воплем встало на дыбы, пытаясь избавиться от муки. Ливень крови обрушился на Тириона. Конь рухнул лавиной. Потом он понял, что забрало его забито грязью и что-то давит на ногу. Тирион едва вырвался на свободу, горло так перехватило, что он почти не мог говорить.</p><p class="p1">— Сдаюсь, — едва сумел выдавить он.</p><p class="p1">— Сдаюсь, — повторил полный боли голос.</p><p class="p1">Тирион стер грязь со шлема и мог теперь видеть, что конь упал на своего всадника. Нога рыцаря оставалась под животным; рука, которой он попытался остановить падение, вывернулась под причудливым углом.</p><p class="p1">— Сдаюсь, — повторил тот и, отстегнув меч, здоровой рукой бросил оружие к ногам Тириона. — Сдаюсь, милорд.</p><p class="p1">Ошеломленный карлик пригнулся и поднял меч. Боль пронзила его локоть, когда он шевельнул рукой. Битва, похоже, ушла вперед. Рядом никого не было, если не считать изрядного количества трупов. Вороны уже кружили над ними. Тирион заметил, что сир Киван повернул центр на поддержку авангарда, огромное скопление копейщиков оттесняло северян обратно к холмам. Борьба шла на склонах, пики упирались в стену овальных щитов, скрепленных железными нашлепками. Воздух вновь наполнился свистом, и люди позади дубовой стены начали падать под ударами убийственных наконечников.</p><p class="p1">— По-моему, вы проигрываете, сир, — сказал он рыцарю, лежавшему под конем. Тот не ответил.</p><p class="p1">Звук копыт за спиной заставил карлика обернуться, хотя он едва ли сумел бы поднять меч из-за терзающей локоть боли. Бронн остановился и поглядел на него сверху вниз.</p><p class="p1">— Большой пользы ты мне не принес, — укорил его Тирион.</p><p class="p1">— Вижу, что ты прекрасно справился сам, — ответил Бронн. — Хотя и потерял рог на своем шлеме.</p><p class="p1">Тирион потянулся к макушке шлема. Шип отломился начисто.</p><p class="p1">— Я не потерял его. Я знаю, где он находится. А ты не видишь моего коня?</p><p class="p1">Когда они отыскали животное, трубы запели снова, и лорд Тайвин пустил свой резерв вдоль реки. Тирион видел, как отец пролетел мимо под пурпурным и золотым знаменем Ланнистеров, трепетавшим над его головой. Пять сотен рыцарей окружали его, солнечный свет играл на остриях пик. Оборона Старков рассыпалась как стекло под их сокрушительным ударом.</p><p class="p1">Ощущая пульсирующую боль в локте, Тирион не стал пытаться присоединиться к смертоубийству. Они с Бронном принялись разыскивать своих людей. Многие нашлись среди мертвых, Улф, сын Умара, лежал в луже густевшей крови — без руки, отсеченной ниже локтя, вокруг него распростерлась дюжина Лунных Братьев. Утыканный стрелами Шагга скрючился под деревом, голова Конна лежала на его коленях. Тирион решил, что оба мертвы, но когда он спешился, Шагга открыл глаза и проговорил:</p><p class="p1">— Они убили Конна, сына Коратта.</p><p class="p1">Симпатичный Конн с виду был цел, если не считать алого пятна, оставленного на груди ударом копья. Когда Бронн поднял Шаггу на ноги, рослый горец, казалось, впервые заметил стрелы в своем теле. И по одной принялся вырывать их, проклиная дырки, которые острия оставили в его кольчуге и куртке. Те немногие, которые добрались до его плоти, он извлекал с младенческими стенаниями. Тут к ним подъехала Челла, дочь Чейка, предъявляя четыре отрезанных ею уха. Тиметта они обнаружили за грабежом: он раздевал убитых вместе со своими Обгорелыми. Из трех сотен горцев, которые выехали на поле битвы позади Тириона Ланнистера, уцелела, наверное, половина.</p><p class="p1">Он оставил живых приглядеть за убитыми, приказал Бронну позаботиться о пленном рыцаре и отправился разыскивать отца. Лорд Тайвин восседал у реки, прихлебывая вино из украшенной самоцветами чаши, сквайр возился с завязками на его панцире.</p><p class="p1">— Прекрасная победа, — проговорил сир Киван, заметив Тириона. — Твои дикари сражались отлично.</p><p class="p1">Глаза отца были обращены к нему, их бледная зелень, усыпанная золотыми искорками, казалась настолько холодной, что Тирион поежился.</p><p class="p1">— Ты удивлен, отец, — спросил он, — или это расстроило твои планы? Наверное, мы обязаны были погибнуть?</p><p class="p1">Лорд Тайвин осушил чашу, выражение на лице его не изменилось.</p><p class="p1">— Я поставил на левый фланг менее дисциплинированных. Я ожидал, что они не выдержат натиска… Робб Старк — зеленый мальчишка, он скорее проявит отвагу, чем мудрость. Я надеялся, что, заметив провал на нашем левом фланге, он бросится развивать успех. И тогда копейщики сира Кивана, развернувшись, ударили бы северян в бок, загнали бы в реку, а я с резервом добил бы их.</p><p class="p1">— И вы отправили меня в самое пекло, не сообщив ничего о своих планах?</p><p class="p1">— Нельзя убедительно изобразить отступление, — сказал отец, — а я не склонен доверять свои планы человеку, общающемуся с наемниками и дикарями.</p><p class="p1">— Как жаль, что мои дикари испортили танец. — Тирион стащил с руки стальную перчатку и выронил ее, вздрогнув от пронзившей локоть боли.</p><p class="p1">— Мальчишка Старк оказался осторожнее, чем я ожидал, — признался лорд Тайвин. — Но победа — всегда победа. Кажется, ты ранен?</p><p class="p1">Правый рукав Тириона был пропитан кровью.</p><p class="p1">— Спасибо, что вы заметили это, отец, — проговорил он, скрипнув зубами. — Могу ли я обременить вас просьбой? Пошлите кого-нибудь за вашими мейстерами. Если только вы не предпочтете иметь в качестве сына однорукого карлика.</p><p class="p1">Настоятельный крик «Лорд Тайвин!» заставил отца повернуть голову прежде, чем он успел ответить. Тайвин Ланнистер поднялся на ноги, когда сир Аддам Марбранд соскочил с коня. Конь был покрыт пеной, и губы его кровоточили. Сир Аддам пал на одно колено — рослый, темная медь волос ниспадает на плечи, полированная бронза играет на стали, изображая огненное дерево дома, вытравленное на нагруднике.</p><p class="p1">— Мой господин, мы захватили некоторых из их командиров: лорда Сервина, сира Уилиса Мандерли, Харриона Карстарка, четверых Фреев; лорд Хорнвуд погиб, и, увы, Русе Болтон сумел улизнуть.</p><p class="p1">— А мальчишка? — спросил лорд Тайвин.</p><p class="p1">Сир Аддам помедлил.</p><p class="p1">— Мальчишки Старка не было с ними, милорд. Говорят, что он пересек реку у Близнецов с большой частью своей конницы и отправился прямо к Риверрану.</p><p class="p1">Зеленый мальчишка, вспомнил Тирион, он скорее проявит отвагу, чем мудрость… Карлик расхохотался бы, если бы ему не было так больно.</p></span>
