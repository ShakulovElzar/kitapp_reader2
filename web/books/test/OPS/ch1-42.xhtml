<p class="p">Эддард</p>
</div><p class="p1">Ему снился странный сон: трое рыцарей в белых плащах, давно разрушенная башня и Лианна на окровавленном ложе.</p><p class="p1">Во сне с ним были друзья, как и тогда, в жизни. Гордый Мартин Кассель, отец Джори; верный Тео Валл; Этан Гловер, бывший тогда эсквайром Брандона, сир Марк Рисвелл, мягкоречивый и благородный сердцем; житель озера Хоуленд Рид; лорд Дастин на своем огромном рыжем коне. Нед помнил их лица, как свое собственное; но годы вторгаются в память человека даже во сне, даже если он дал обет не забывать ничего. Ему снились тени, призраки, сотканные из тумана.</p><p class="p1">Всемером они стояли перед троими — во сне, как и в жизни. Но троих трудно было назвать обыкновенными воинами. Они ожидали перед круглой башней, позади краснели горы Дорна, белые плащи раздувал ветер. Они не превратились в тени — лица оставались ясными даже теперь. Сир Эртур Дейл, Меч Зари, скорбно улыбался. Рукоять великого меча Рассвет поднималась над его правым плечом. Сир Освелл Уэнт, припав на одно колено, правил клинок точилом. На белой эмали шлема расправляла крылья черная летучая мышь его дома. Между ними стоял свирепый сир Герольд Хайтауэр, Белый Бык, лорд-командующий Королевской гвардии.</p><p class="p1">— Я искал вас у Трезубца, — сказал Нед.</p><p class="p1">— Нас не было там, — отвечал сир Герольд.</p><p class="p1">— Горе постигло бы узурпатора, если бы мы там были, — проговорил сир Освелл.</p><p class="p1">— Когда пала Королевская Гавань и сир Джейме убил вашего короля золотым мечом, я пытался узнать, где вы.</p><p class="p1">— Мы были далеко, — отвечал сир Герольд. — Иначе Эйерис по-прежнему сидел бы на Железном троне, а наш лживый брат горел бы в адском пекле.</p><p class="p1">— Я спускался к Штормовому Пределу, чтобы снять осаду, — сказал ему Нед. — Там лорды Тирелл и Редвин сложили знамена, а все их рыцари преклонили колена в знак верности. Я был уверен, что вы окажетесь среди них.</p><p class="p1">— Мы ни перед кем не склонимся, — проговорил сир Эртур Дейл.</p><p class="p1">— Сир Уиллем Дарри бежал на Драконий Камень с вашей королевой и принцем Визерисом. Я думал, что вы будете сопровождать их.</p><p class="p1">— Сир Уиллем человек добрый и верный, — заметил сир Освелл.</p><p class="p1">— Но он не принадлежит к числу гвардейцев, — возразил сир Герольд. — Королевская гвардия никогда не бежит.</p><p class="p1">— Ни прежде, ни теперь, — подтвердил сир Эртур, надевая шлем.</p><p class="p1">— Мы дали обет, — пояснил старый сир Герольд.</p><p class="p1">Призраки зашевелились возле Неда с призрачными мечами в руках. Их было семеро против троих.</p><p class="p1">— Ну а теперь начнем, — сказал сир Эртур Дейл, Меч Зари. Он извлек Рассвет и взялся за рукоять обеими руками. Бледный, как молочное стекло, клинок горел живым светом.</p><p class="p1">— Нет, — ответил Нед со скорбью в голосе. — Теперь и закончим. — И тогда он услышал за собой крик Лианны:</p><p class="p1">— Эддард!</p><p class="p1">Ветер бросил на кровавое небо тучу лепестков розы, синих, как глаза смерти.</p><p class="p1">— Лорд Эддард, — вновь прокричала Лианна.</p><p class="p1">— Обещаю, — прошептал он. — Лиа, я обещаю…</p><p class="p1">— Лорд Эддард! — позвал мужской голос из тьмы.</p><p class="p1">Со стоном Эддард Старк открыл глаза, лунный свет вливался сквозь высокие окна башни Десницы.</p><p class="p1">— Лорд Эддард? — Над постелью склонилась тень.</p><p class="p1">— Как… как долго? — Простыни сбились, нога в лубке, в боку пульсирует боль.</p><p class="p1">— Шесть дней и семь ночей. — Голос принадлежал Вейону Пулю. Стюард поднес чашу к губам Неда. — Выпейте, милорд.</p><p class="p1">— Что?..</p><p class="p1">— Чистая вода. Мейстер Пицель сказал, что вам захочется пить.</p><p class="p1">Нед глотнул. Сухие губы потрескались. Вода оказалась сладкой, как мед.</p><p class="p1">— Король оставил приказ, — проговорил Вейон Пуль, когда чаша опустела. — Он желает поговорить с вами, милорд.</p><p class="p1">— Завтра, — сказал Нед. — Когда я окрепну.</p><p class="p1">Он не мог сейчас встретить бывшего друга лицом к лицу, сон лишил его сил, сделал слабым, как котенка.</p><p class="p1">— Милорд, — проговорил Пуль, — король приказал прислать вас к нему, как только вы откроете глаза. — Стюард торопливо принялся зажигать свечи.</p><p class="p1">Нед громко ругнулся. Роберт никогда не был известен своим терпением.</p><p class="p1">— Передай королю, что я слишком слаб, чтобы явиться к нему. Если он хочет переговорить со мной, я буду рад принять его у себя. Надеюсь, ты найдешь его в глубоком сне. И позови… — Нед уже собрался назвать Джори, когда вспомнил. — Позови капитана моей стражи.</p><p class="p1">Элин вступил в опочивальню через мгновение после того, как стюард откланялся.</p><p class="p1">— Милорд!</p><p class="p1">— Пуль утверждает, что прошло шесть дней, — сказал Нед. — Я должен знать положение дел.</p><p class="p1">— Цареубийца бежал из города, — доложил Элин. — Говорят, что он направился на Бобровый утес к своему отцу. Повесть о том, как леди Кейтилин захватила Беса, у всех на устах. Я выставил дополнительную стражу, если вы не против.</p><p class="p1">— Не против, — заверил его Нед. — Как дочери?</p><p class="p1">— Они посещали вас каждый день, милорд. Санса тихо молится, но Арья… — он помедлил, — не произнесла ни слова после того, как вас принесли сюда. Такая свирепая кроха. Я никогда не видел подобной ярости в девочке.</p><p class="p1">— Что бы ни случилось, — проговорил Нед, — я хочу, чтобы дочери мои были в безопасности. Боюсь, что это только начало.</p><p class="p1">— С ними не случится плохого, лорд Эддард, — заверил Элин. — Пока я жив.</p><p class="p1">— А Джори и все остальные…</p><p class="p1">— Я передал останки Молчаливым Сестрам, чтобы их отослали на север, в Винтерфелл. Джори хотел бы лежать возле своего деда…</p><p class="p1">…Возле деда, ведь отец Джори был похоронен далеко на юге. Мартин Кассель погиб вместе с остальными. Тогда Нед велел разрушить башню и сложить из ее кровавых камней восемь кэрнов на гребне. Говорили, что Рейегар называл это место Башней Счастья, но у Неда с ней были связаны горькие воспоминания. Да, их было семеро против троих, но лишь двое смогли покинуть это место; сам Эддард Старк и маленький житель озера Хоуленд Рид. Эддард не усматривал доброго предзнаменования в том, что сон этот приснился ему именно сейчас, после столь многих лет.</p><p class="p1">— Ты распорядился правильно, Элин, — проговорил Нед, увидев возвратившегося Вейона Пуля. Стюард поклонился.</p><p class="p1">— Светлейший государь здесь, милорд, а вместе с ним и королева.</p><p class="p1">Нед подвинулся выше, дернулся, когда ногу пронзила боль. Он не рассчитывал увидеть Серсею. Встреча эта не сулила добра.</p><p class="p1">— Впусти их и оставь нас. Наши слова не должны выйти за пределы этих стен.</p><p class="p1">Пуль молча вышел.</p><p class="p1">Роберту хватило времени, чтобы облачиться в черный бархатный дублет с коронованным оленем Баратеонов, вышитым на груди золотой ниткой, и золотую мантию под плащом из светлых и темных квадратов. Рука короля держала бутыль вина, лицо его раскраснелось после выпивки. Серсея Ланнистер вошла следом, волосы ее украшала усыпанная самоцветами тиара.</p><p class="p1">— Светлейший государь, — проговорил Нед, — прошу прощения, но я не могу подняться.</p><p class="p1">— Ерунда, — отозвался король ворчливо. — Хочешь вина? Из Ибора. Хороший урожай.</p><p class="p1">— Только немного, — сказал Нед. — Голова моя еще тяжела после макового молока.</p><p class="p1">— Человек на вашем месте должен радоваться тому, что голова его вообще еще остается на плечах, — объявила королева.</p><p class="p1">— Тихо, женщина! — отрезал Роберт. Он поднес Неду чашу вина. — Нога еще болит?</p><p class="p1">— Немного, — отвечал Нед. Голова его пылала, но он не хотел признаваться в слабости перед королевой.</p><p class="p1">— Пицель утверждает, что нога заживет. — Роберт нахмурился. — Как я понимаю, тебе известно, что сделала Кейтилин?</p><p class="p1">— Так-то оно так. — Нед отпил вина. — Но моя леди-жена не виновна в своем поступке, светлейший государь. Она сделала это по моему распоряжению.</p><p class="p1">— Я недоволен тобой, Нед, — буркнул Роберт.</p><p class="p1">— По какому праву вы смеете прикасаться к моим родственникам? — потребовала ответа Серсея. — Кем, по-вашему, вы являетесь?</p><p class="p1">— Десницей короля, — ответил ей Нед с ледяной любезностью. — Иначе говоря, персоной, которую ваш лорд-муж обязал поддерживать в королевстве мир и выполнять королевское правосудие.</p><p class="p1">— Вы были десницей, — начала Серсея, — но теперь…</p><p class="p1">— Молчать! — взревел король. — Ты спросила его, и он ответил… — Серсея умолкла в холодном гневе, и Роберт повернулся к Неду: — Чтобы поддерживать в королевстве мир, ты говоришь? Так вот как ты поддерживаешь мир, Нед? Погибло семеро…</p><p class="p1">— Восьмеро, — поправила королева. — Трегар умер сегодня утром от удара, полученного им от лорда Старка.</p><p class="p1">— Похищение на Королевском тракте и пьяное побоище на моих улицах, — проговорил король. — Я этого не потерплю.</p><p class="p1">— У Кейтилин были все причины, чтобы арестовать Беса…</p><p class="p1">— Я сказал, что не потерплю этого! В пекло все причины. Ты прикажешь ей немедленно отпустить карлика и помиришься с Джейме.</p><p class="p1">— Трое моих людей погибли на моих глазах, потому что Джейме Ланнистер пожелал наказать меня. Неужели я должен это забыть?</p><p class="p1">— Мой брат не был причиной ссоры, — сказала королю Серсея. — Лорд Старк пьяным возвращался из борделя. Люди его напали на Джейме и его стражу — именно так, как жена его схватила Тириона на Королевском тракте.</p><p class="p1">— Не верь этому, Роберт, ты знаешь меня, — проговорил Нед. — Спроси лорда Бейлиша, если сомневаешься. Он был там.</p><p class="p1">— Я говорил с Мизинцем, — ответил Роберт. — Он сказал, что поехал за золотыми плащами до того, как началась схватка, но он признает, что вы возвращались из какого-то борделя.</p><p class="p1">— Какого-то борделя? Разуй свои глаза, Роберт, я ездил туда посмотреть на твою дочь! Мать назвала ее Баррой, она похожа на твою первую девочку, которая родилась в Долине, когда мы были мальчишками. — Говоря эти слова, он глядел на королеву, лицо которой превратилось в застывшую маску, бледную и ничего не выражающую.</p><p class="p1">Роберт покраснел.</p><p class="p1">— Барра, — пророкотал он. — Решила сделать мне приятное, чертова баба. Я думал, что у нее больше ума.</p><p class="p1">— Ей нет и пятнадцати, она уже шлюха, и ты считаешь, что она может быть разумной? — ответил, не веря себе, Нед. Нога его отчаянно разболелась, и трудно было сдержаться. — Дурочка любит тебя, Роберт.</p><p class="p1">Король поглядел на Серсею.</p><p class="p1">— Тема эта не подходит для ушей королевы.</p><p class="p1">— Светлейшей государыне не понравится все, что я могу сказать, — заметил Нед. — Мне передали, что Цареубийца бежал из города. Прикажи мне вернуть его и поставить перед правосудием.</p><p class="p1">Король задумчиво покрутил чашу с вином и пригубил.</p><p class="p1">— Нет, — решил он. — С меня довольно. Джейме убил у тебя троих, ты у него пятерых. На этом и закончим.</p><p class="p1">— Таково, значит, твое представление о справедливости? — вспыхнул Нед. — Я рад, что больше не являюсь твоим десницей.</p><p class="p1">Королева поглядела на мужа:</p><p class="p1">— Если бы какой-нибудь человек осмелился обратиться к Таргариену, как говорит с тобой этот…</p><p class="p1">— Ты что, принимаешь меня за Эйериса? — прервал ее Роберт.</p><p class="p1">— Я принимаю тебя за короля! Джейме и Тирион твои братья по законам брака и родственных связей. Старки изгнали одного из них и захватили другого. Человек этот бесчестит тебя каждым своим дыханием, и ты кротко стоишь здесь, спрашиваешь, болит ли его нога и не хочется ли ему вина?</p><p class="p1">Роберт потемнел от гнева.</p><p class="p1">— Сколько раз, женщина, должен я приказывать тебе попридержать язык?</p><p class="p1">Лицо Серсеи изобразило все оттенки презрения.</p><p class="p1">— Как же это нас перепутали боги? — сказала она. — По всем правилам, тебе следовало бы носить юбку, а мне броню.</p><p class="p1">Багровый от гнева король ударил ее тыльной стороной ладони по щеке, Серсея споткнулась о стул и сильно ударилась, но не вскрикнула. Тонкие пальцы легли на щеку, бледная и гладкая кожа покраснела. На следующее утро синяк, это уж точно, зальет половину ее лица.</p><p class="p1">— Буду носить его как знак чести, — объявила она.</p><p class="p1">— Только носи в молчании, иначе я еще раз почту тебя, — посулил Роберт. Он кликнул гвардейцев.</p><p class="p1">В комнате появился сир Меррин Трант, высокий и строгий в своей белой броне.</p><p class="p1">— Королева устала. Проводите ее в опочивальню. — Не говоря ни слова, рыцарь помог Серсее подняться на ноги и вывел ее.</p><p class="p1">Роберт потянулся к бутылке и вновь налил свою чашу.</p><p class="p1">— Теперь видишь, что она со мной делает, Нед. — Король опустился в кресло, сжимая чашу с вином. — Любящая жена, мать моих детей. — Ярость оставила его, в глазах короля Нед теперь видел скорбь и даже испуг. — Мне не следовало бить ее. Это не… это не королевский поступок. — Он поглядел на руки, словно бы не вполне понимая, что они собой представляют. — Я всегда был силен… никто не мог выстоять передо мной. Никто. Но как бороться с тем, кого нельзя ударить? — В смятении король потряс головой. — Рейегар… Рейегар победил, проклятие! Я убил его, Нед, я вонзил шип в его черный панцирь, в его черное сердце, и он умер у моих ног. Об этом поют песни. И все же он каким-то образом победил. Теперь он с Лианной, а мне досталась Серсея. — Он осушил чашу.</p><p class="p1">— Светлейший государь, — сказал Нед, — мы должны переговорить…</p><p class="p1">Роберт прижал пальцы к вискам.</p><p class="p1">— Меня смертельно тошнит от разговоров. Утром я отправляюсь в Королевский лес на охоту. Все, что ты хочешь сказать, может подождать до моего возвращения.</p><p class="p1">— Если боги будут милостивы, я не стану ждать твоего возвращения. Ты приказал мне возвращаться в Винтерфелл, помнишь?</p><p class="p1">Роберт встал, ухватившись за одну из опор балдахина, чтобы устоять.</p><p class="p1">— Боги редко бывают добры, Нед. Возьми свою вещь. — Из кармана в подкладке плаща он достал тяжелую застежку в форме руки и бросил на постель. — Хочешь ли ты этого или нет, но ты остаешься моей десницей, проклятый! Я запрещаю тебе уезжать.</p><p class="p1">Нед взял серебряную застежку. Похоже, у него не оставалось выбора. Нога его пульсировала, он чувствовал себя беспомощным, как ребенок.</p><p class="p1">— Наследница Таргариенов…</p><p class="p1">Король застонал:</p><p class="p1">— Седьмое пекло, не начинай сначала этот разговор. С этим покончено, я не желаю больше слышать об этом!</p><p class="p1">— Почему ты хочешь, чтобы я был твоей десницей, если не желаешь слушать моих советов?</p><p class="p1">— Почему? — Роберт расхохотался. — Хочу и все тут. Кому-то ведь надо править этим проклятым королевством! Бери знак своей власти, Нед. Он подобает тебе. Но если ты еще хоть раз бросишь его мне в лицо, клянусь, я сразу же приколю проклятую штуковину на плащ Джейме Ланнистера!</p></span>
