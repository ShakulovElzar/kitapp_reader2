<span id="id67"><div class="title2">
<p class="p">Бран</p>
</div><p class="p1">Самые старшие были уже взрослыми: по семнадцать и восемнадцать лет прошло после того, как они получили имя. Один даже встретил двадцатилетие. Но в основном здесь собрались шестнадцатилетние и моложе.</p><p class="p1">Бран следил за ними с балкона башни мейстера Лювина, прислушивался к напряженным голосам и ругательствам, с которыми они размахивали палками и деревянными мечами. Двор ожил, выслушивая стук дерева о дерево, слишком уж часто прерывавшийся вскриками боли, когда удар приходился по телу. Сир Родрик расхаживал среди мальчишек, — лицо его багровело под белыми усами, — и ругал всех и каждого. Бран никогда не видел старого рыцаря таким раздраженным.</p><p class="p1">— Нет, — приговаривал он. — Нет. Нет. Нет!</p><p class="p1">— Они не слишком хороши в бою, — с сомнением проговорил Бран. Он почесал Лето за ушами, лютоволк был занят куском мяса. Кости хрустнули под его зубами.</p><p class="p1">— Конечно, — согласился, глубоко вздохнув, мейстер Лювин. Мейстер смотрел в трубу с большими мирийскими линзами, измеряя тени и отмечая положение кометы, повисшей над горизонтом в утреннем небе. — Но если хватит времени, сир Родрик справится с делом. Нам нужны люди на стенах. Твой лорд-отец увел лучших в Королевскую Гавань, твой брат взял остальных годных парней. Они теперь за много лиг от замка. Многие не вернутся назад, а нам нужны люди, чтобы занять их места.</p><p class="p1">Бран с сомнением посмотрел на потевших внизу парней.</p><p class="p1">— Если бы у меня были ноги, я бы сумел побить любого. — Он вспомнил, что в последний раз держал меч в руке, когда король посещал Винтерфелл. Это был всего лишь деревянный меч, но все-таки он несколько раз сумел сбить с ног принца Томмена. — Сир Родрик обучит меня пользоваться алебардой. Если ее насадить на длинную ручку, Ходор может стать моими ногами. Вместе мы составим рыцаря.</p><p class="p1">— Едва ли… — усомнился мейстер Лювин. — Бран, на поле брани руки, ноги и мысли человека должны составлять единое целое.</p><p class="p1">Внизу на дворе вопил сир Родрик:</p><p class="p1">— Ты дерешься как гусь. Он клюнет тебя, и ты клюнешь его. Отбивайтесь! Защищайтесь от ударов. Гуси нам не нужны! Настоящий меч первым же ударом снесет тебе руку. — Один из мальчишек расхохотался, и старик повернулся. — И ты еще смеешься! Наглец. Ты дерешься как еж!</p><p class="p1">— Однажды был такой рыцарь, который не мог видеть, — настойчиво продолжал Бран, не обращая внимания на голос сира Родрика. — Старуха Нэн рассказывала мне о нем. У него было длинное древко с кинжалами на обоих концах, он крутил его обеими руками и мог уложить сразу двоих людей.</p><p class="p1">— Симеон Звездный Глаз, — проговорил Лювин, занося числа в книжку. — Потеряв глаза, он вставил сапфиры в пустые глазницы, так по крайней мере утверждают певцы. Бран, это же сказки, как о Флорианушке-дурачке. Сказка из века героев. — Мейстер цыкнул зубом. — Оставь эти сны, они только разорвут твое сердце.</p><p class="p1">Сны… Бран вспомнил самый последний.</p><p class="p1">— Прошлой ночью мне вновь приснился тот ворон… Трехглазый. Он влетел в мою опочивальню и велел идти вместе с ним. Я послушался. Мы спустились в крипту. Там был отец, и мы поговорили. Он был печален.</p><p class="p1">— Почему же? — спросил мейстер, глядя через трубу.</p><p class="p1">— По-моему, грусть его имела какое-то отношение к Джону. — Сон смутил Брана больше всех предыдущих. — Ходор не хочет нести меня в крипту.</p><p class="p1">Мейстер слушал его вполуха. Бран видел это. Лювин оторвал глаз от трубки и моргнул.</p><p class="p1">— Что Ходор не хочет?..</p><p class="p1">— Спускаться со мной в крипту. Проснувшись, я приказал отнести меня вниз, чтобы посмотреть, действительно ли отец находится там. Сперва он не понял, чего я хочу. Но когда я привел его на лестницу, показал, куда идти и куда поворачивать, он не захотел спускаться вниз. Просто остановился во тьме на верхней ступени и сказал «Ходор» — так, словно боялся темноты. Но у меня был с собой факел. Я обезумел настолько, что хотел стукнуть его по голове, как делает старая Нэн. — Увидев, что мейстер хмурится, Бран поспешно добавил: — Но я не сделал этого.</p><p class="p1">— Хорошо. Ходор — человек, а не мул, которого можно колотить.</p><p class="p1">— Во сне я летел вниз вместе с вороном, но я не могу сделать так наяву, — пояснил Бран.</p><p class="p1">— Почему ты хочешь спуститься в крипту?</p><p class="p1">— Я же сказал, чтобы поискать отца…</p><p class="p1">Мейстер потянул за цепочку на шее, как делал часто, когда чувствовал себя неуютно.</p><p class="p1">— Милое дитя, Бран, однажды каменное подобие лорда Эддарда сядет внизу возле своего отца и деда, рядом со всеми Старками, начиная от старых Королей Севера… Но это случится не скоро, да будут милосердны к нам боги. Отец твой в плену у королевы, он в темнице, и ты не найдешь его в крипте.</p><p class="p1">— Он был здесь прошлой ночью, я разговаривал с ним.</p><p class="p1">— Упрямый мальчишка, — вздохнул мейстер, откладывая книгу. — Посмотрим?</p><p class="p1">— Я не могу. Ходор туда не идет, а для Плясуньи ступени слишком узки и извилисты.</p><p class="p1">— По-моему, я знаю выход из положения.</p><p class="p1">Вместо Ходора пригласили Ошу, женщину, взятую среди одичалых. Высокая и крепкая, она была готова сделать все, что ей приказывают.</p><p class="p1">— Я прожила всю свою жизнь за Стеной, милорды, и эта дыра в земле меня не пугает.</p><p class="p1">— Лето, пошли, — позвал Бран, когда она подняла его на крепких руках.</p><p class="p1">Оставив свою кость, лютоволк последовал за Ошей, понесшей Брана через двор и вниз по спиральным ступеням в холодное подземелье. Мейстер Лювин шел впереди с факелом. Бран даже не обратил внимания — совершенно никакого — на то, что она несет его на руках, а не за спиной. Сир Родрик приказал, чтобы с Оши сняли цепь, поскольку после своего появления в Винтерфелле она служила Старкам честно и преданно. Но тяжелые железные обручи на лодыжках остались — в знак того, что ей не полностью доверяют, — однако они не мешали Оше уверенно шагать вниз по ступеням.</p><p class="p1">Бран и не помнил, когда в последний раз был в криптах. Конечно, это было еще до того. А в детстве он нередко играл здесь с Роббом, Джоном и сестрами.</p><p class="p1">Жаль только, что их нет сейчас рядом. Тогда бы подземелье не казалось столь темным и страшным.</p><p class="p1">Лето шел впереди в гулком мраке и вдруг остановился, поднял голову и принюхался к холодному мертвому воздуху. Оскалившись, он отступил, сверкнув золотым глазом в свете факела мейстера. Даже Оша, жесткая, как старое железо, неуютно поежилась.</p><p class="p1">— Судя по лицам, народ суровый, — сказала она, разглядывая длинный ряд гранитных Старков на тронах.</p><p class="p1">— Покойные Короли Зимы, — прошептал Бран. Здесь почему-то нельзя было разговаривать слишком громко.</p><p class="p1">Она улыбнулась.</p><p class="p1">— У зимы нет короля. Увидишь ее — узнаешь почему, летний мальчик.</p><p class="p1">— Тысячи лет они были Королями Севера, — проговорил мейстер Лювин, поднимая факел так, чтобы свет озарил каменные лица. Некоторые были длинноволосы и бородаты, лохматые люди, свирепые, как те лютоволки, что лежали у их ног. Другие, чисто выбритые, острым тонким лицом напоминали длинный меч, лежащий у каждого на коленях. — Суровое время, суровые люди. Пошли. — Резким шагом мейстер направился по залу, мимо каменных столбов и бесконечных резных фигур. Язык пламени срывался с поднятого факела.</p><p class="p1">Длинное подземелье было больше самого Винтерфелла; некогда Джон рассказывал ему, что можно спуститься еще ниже в мрачные и глубокие подземелья, где были похоронены самые древние короли. Так что без света не обойтись. Лето не согласился отойти от лестницы, даже когда Оша с Браном на руках последовала за факелом.</p><p class="p1">— Помнишь историю своего рода, Бран? — спросил мейстер, пока они шли вперед. — Расскажи Оше, кто они и чем знамениты, если сумеешь.</p><p class="p1">Глядя на лица, Бран вспоминал: что-то ему рассказывал мейстер, а старая Нэн дополняла и оживляла его повествование.</p><p class="p1">— Это Джон Старк. Когда на востоке высадились морские грабители, он прогнал их и построил в Белой гавани замок. Сын его, Рикард Старк, — не отец моего отца, а другой Рикард, — отобрал Перешеек у Болотного короля и женился на его дочери. Теон Старк — вон тот худой, с длинными волосами и узкой бородой. Его прозвали Голодным Волком, потому что он всегда воевал. А вот Брандон — с сонным лицом, — ему дали прозвище Корабельщик, потому что он любил море. Гробница эта пуста. Он поплыл на запад по Закатному морю, но не вернулся. Рядом его сын — Брандон Факельщик; с горя он сжег все корабли своего отца. Вот Родрик Старк, в поединке отвоевавший Медвежий остров и отдавший его Мормонтам. А вот и Торрхен Старк, Король, Преклонивший колено. Он был последним Королем Севера и стал лордом Винтерфелла после того, как присягнул Эйегону-завоевателю. А вот Криган Старк. Он однажды сразился с принцем Эйемоном, и сам Драконий рыцарь сказал, что никогда не встречал лучшего фехтовальщика. — Ряды заканчивались, и Бран ощутил накатывавшую на него печаль. — А вот мой дед, лорд Рикард, которого обезглавил Безумный король Эйерис. Рядом с ним покоятся его дочь Лианна и сын Брандон. Не я — другой Брандон, брат моего отца. Им не положены изваяния, их удостаиваются только лорды и короли, но отец мой так любил брата и сестру, что приказал изготовить статуи.</p><p class="p1">— Какая красавица, — сказала Оша.</p><p class="p1">— Роберт был обручен с ней, но принц Рейегар похитил ее и изнасиловал, — пояснил Бран. — Роберт затеял войну, чтобы вернуть Лианну. Он убил Рейегара возле Трезубца, но Лианна умерла и не досталась ему.</p><p class="p1">— Скорбная история, — сказала Оша, — но эти зияющие отверстия вселяют в меня больше скорби.</p><p class="p1">— Эта гробница ждет лорда Эддарда, когда придет его время, — проговорил мейстер Лювин. — Здесь ли в том сне ты видел своего отца, Бран?</p><p class="p1">— Да, — ответил мальчик. Воспоминание заставило его поежиться. Бран оглядел подземелье. Волосы на его затылке встали дыбом. Неужели он слышал шум? Или это ему почудилось?</p><p class="p1">Мейстер Лювин с факелом в руке шагнул вперед.</p><p class="p1">— Ну, видишь, твоего отца здесь нет. И не будет еще много лет. Не надо бояться снов, дитя. — Он протянул руку в темные недра гробницы, словно в пасть какого-то огромного дикого зверя. — Видишь — она пу…</p><p class="p1">Тьма, зарычав, прыгнула на него.</p><p class="p1">Сверкнули зеленые глаза и белые зубы на черной, словно могильные недра, шерсти. Мейстер Лювин, вскрикнув, вскинул руки. Факел вылетел из его пальцев, ударившись о каменное лицо Брандона Старка, и упал к ногам изваяния; языки лизали колено. В неровном мечущемся свете можно было видеть, как Лювин борется с лютоволком, молотя рукой по челюстям, стиснувшим его другую руку.</p><p class="p1">— Лето! — завопил Бран.</p><p class="p1">И Лето тенью вылетел из сомкнувшейся позади них тьмы. Столкнувшись с Мохнатым Песиком, он сбил его на землю, и оба лютоволка покатились клубком серой и черной шерсти, рыча и кусая друг друга. Тем временем мейстер Лювин поднялся на колени, придерживая окровавленную руку.</p><p class="p1">Оша посадила Брана спиной к изваянию лорда Рикарда и бросилась на помощь. Отбрасываемые светом упавшего факела громадные — футов в двадцать — тени волков воевали на стенах и на потолке.</p><p class="p1">— Лохматик, — позвал тонкий голос. Бран поглядел и увидел младшего брата, появившегося из гробницы отца. В последний раз тяпнув Лето, Лохматый Песик вырвался и бросился к Рикону.</p><p class="p1">— Оставь в покое моего отца, — сказал Рикон. — Оставь его в покое.</p><p class="p1">— Рикон, — негромко промолвил Бран, — нашего отца нет здесь.</p><p class="p1">— Нет, он здесь. Я видел его. — Слезы поблескивали на лице Рикона. — Я видел его прошлой ночью.</p><p class="p1">— Во сне…</p><p class="p1">Рикон кивнул:</p><p class="p1">— Оставьте его. Оставьте. Он вернулся домой, как обещал. Он вернулся домой!</p><p class="p1">Бран никогда не видел, чтобы мейстер Лювин обнаруживал подобную нерешительность. Кровь капала с его руки; Лохматый Песик разодрал шерстяной рукав и плоть под ним.</p><p class="p1">— Оша, факел, — приказал он, закусывая губу от боли, и она подобрала факел, не дав огню погаснуть. На каменных ногах его дяди остались следы сажи. — Эта… эта тварь… — продолжил Лювин, — кажется, должна сидеть на цепи.</p><p class="p1">Рикон погладил влажную от крови морду своего лютоволка.</p><p class="p1">— Я отпустил его. Он не любит цепей, — и облизнул пальцы.</p><p class="p1">— Рикон, — сказал Бран. — Хочешь пойти со мной?</p><p class="p1">— Нет. Мне нравится здесь.</p><p class="p1">— Здесь темно и холодно.</p><p class="p1">— Я не боюсь. Я хочу дождаться отца.</p><p class="p1">— Ты можешь подождать вместе со мной, — сказал Бран. — Будем ждать вместе… ты и я и наши волки. — Оба волка зализывали раны и явно нуждались в осмотре.</p><p class="p1">— Бран, — твердо сказал мейстер. — Я знаю, что ты хочешь добра, но Лохматый слишком одичал, чтобы оставить его. Я стал третьим, кого он покусал. Если он будет бегать по замку, то рано или поздно кого-нибудь убьет. Истина сурова, этого волка надо посадить на цепь или… — Он умолк.</p><p class="p1">«…или убить», — договорил в уме Бран и ответил:</p><p class="p1">— Он создан не для цепей. Мы будем ждать у тебя в башне, все вместе.</p><p class="p1">— Это невозможно, — сказал мейстер Лювин.</p><p class="p1">Оша ухмыльнулась:</p><p class="p1">— Насколько я помню, мальчишка здесь лорд. — Она вернула Лювину факел и вновь подхватила Брана на руки. — Отправляемся в башню мейстера.</p><p class="p1">— Ты идешь, Рикон?</p><p class="p1">Брат кивнул.</p><p class="p1">— Если Лохматик пойдет, — сказал он, обегая Ошу и Брана; мейстеру Лювину, опасливо поглядывавшему на волков, оставалось только последовать за ними.</p><p class="p1">В обители мейстера Лювина было настолько тесно, что Бран не понимал, как здесь можно что-нибудь найти. На столах и стульях росли кривые башни из книг, ряды закупоренных кувшинов выстроились на полках. Повсюду на мебели посреди лужиц застывшего воска торчали огарки свечей, бронзовая труба с мирийскими линзами восседала на треножнике возле двери на террасу, звездные карты свисали со стен, теневые карты лежали между тростинок и бумаг, перьев и бутылочек с чернилами, и на всем оставили свои пятна вороны, устроившиеся среди балок. Под их хриплую перебранку Оша омыла, обработала и перевязала рану мейстера, выполняя отрывистые наставления Лювина.</p><p class="p1">— Это безрассудство, — говорил седой человечек, пока она промакивала волчьи укусы едкой жидкостью. — Конечно, странно, что вам обоим, мальчики, приснился один и тот же сон, но, если задуматься, это вполне естественно. Вам не хватает лорда-отца, и вы знаете, что он в плену. Страх может воспалить человеческий разум и вселить в него странные мысли. Рикон слишком мал, чтобы понимать…</p><p class="p1">— Мне уже четыре, — сказал Рикон, разглядывая сквозь трубу с линзами фигуры горгулий из Первой Твердыни. Лютоволки держались в противоположных концах большой комнаты; когда они зализали раны, им бросили по кости.</p><p class="p1">— Слишком мал, и… седьмое пекло, как жжет, не надо больше! Слишком мал, как я сказал, но ты, Бран, уже достаточно большой, чтобы знать, что сны — это всего только сны.</p><p class="p1">— Бывает так, а бывает иначе. — Оша плеснула бледно-красным огненным молочком в длинную рану. Мейстер охнул. — Дети Леса могли бы кое-что рассказать тебе о снах.</p><p class="p1">Слезы текли по лицу мейстера, но он решительно качнул головой.</p><p class="p1">— Дети Леса… сами существуют только во снах. Их нет, они умерли. Хватит, довольно! Теперь повязку. Сперва тампон, потом обмотай и натяни посильнее. Чтобы не шла кровь.</p><p class="p1">— Старая Нэн говорит, что Дети Леса знали песни деревьев, умели летать как птицы и плавать как рыбы, они даже знали язык животных, — сказал Бран. — А музыка у них была настолько прекрасной, что, услышав ее, люди плакали от этих звуков.</p><p class="p1">— И всего этого они добивались волшебством, — сказал рассеянно мейстер Лювин. — Жаль, что их нет рядом. Во-первых, исцелили бы тогда мою руку и объяснили бы Лохматому, что кусать своих нельзя. — Он искоса, с раздражением поглядел на черного волка. — Учись, Бран. Человек, который полагается на заклинания, фехтует стеклянным мечом. Как делали Дети Леса. Давай-ка я вам кое-что покажу.</p><p class="p1">Он резким движением встал, направился на другую сторону комнаты и вернулся с зеленым горшочком в здоровой руке.</p><p class="p1">— Видите, — сказал он, откупорив сосуд и высыпав из него горсточку блестящих черных наконечников для стрел.</p><p class="p1">Бран взял один из них.</p><p class="p1">— Они сделаны из стекла.</p><p class="p1">Любопытный Рикон подобрался поближе и поглядел на стол.</p><p class="p1">— Драконье стекло, — назвала Оша камень, садясь возле Лювина с бинтами в руке.</p><p class="p1">— Обсидиан, — поправил ее мейстер Лювин, протягивая раненую руку. — Выкованный в кузне богов, глубоко под землей. С помощью таких стрел Дети Леса охотились тысячи лет назад. Они не знали металла; кольчугами им служили длинные рубахи из листвы, обувью — кора деревьев… получалось, что они просто растворялись в лесу. А вместо мечей у них были клинки из обсидиана.</p><p class="p1">— Они до сих пор носят их. — Оша опустила мягкие тампоны на рану и перевязала предплечье мейстера длинными льняными полосками.</p><p class="p1">Бран поднес к глазам наконечник стрелы. Скользкое черное стекло блестело. Он решил, что наконечник прекрасен.</p><p class="p1">— А можно я возьму один?</p><p class="p1">— Как хочешь, — качнул головой мейстер.</p><p class="p1">— И мне нужен один, — сказал Рикон. — Нет, четыре, мне ведь четыре года.</p><p class="p1">Мейстер заставил его отсчитать.</p><p class="p1">— Осторожно, они все еще острые. Не порежься.</p><p class="p1">— Расскажи мне о Детях Леса, — попросил Бран. — Это важно знать.</p><p class="p1">— Что ты хочешь услышать?</p><p class="p1">— Все.</p><p class="p1">Мейстер потянул за оплечье, прикоснувшееся к коже.</p><p class="p1">— Они жили в эпоху Зари, в самые первые времена, еще до королей и королевств. В те дни не было ни замков, ни острогов, ни городов; отсюда до самого Дорнского моря нельзя было сыскать ни одной ярмарки. Людей тоже не было вовсе, лишь Дети Леса обитали в землях, которые мы зовем теперь Семью Королевствами.</p><p class="p1">Смуглые и прекрасные, они никогда не вырастали выше человеческого ребенка. Они жили в глубинах леса и пещерах, посреди озер и в тайных жилищах на деревьях. Легкие, они были быстры и изящны. Мужчины и женщины охотились вместе, пользуясь луками из чардрева и летучими силками. Боги их были богами леса, ручья и камня… старые боги, чьи имена остались тайной. Их мудрецов звали Видящими Сквозь Зелень, это они вырезали странные лики на чардревах, чтобы те караулили лес. Как долго обитали здесь Дети и откуда они явились, никто из людей не знает.</p><p class="p1">Но примерно двенадцать тысячелетий назад с востока пришли Первые Люди — вдоль Перебитой Руки Дорна, прежде чем она сломалась, — верхом на конях, с бронзовыми мечами в руках и огромными кожаными щитами. По эту сторону Узкого моря еще не знали лошадей, и Дети Леса, конечно, боялись их, ну а Первые Люди боялись ликов на деревьях. Срубая деревья для острогов и ферм на будущих полях, Первые Люди стесывали лица и предавали их огню. В ужасе Дети Леса начали войну. Старые песни уверяют, что Видящие Сквозь Зелень прибегли к черным чарам, дабы море восстало и унесло землю, они раздробили Руку, но было уже поздно закрывать дверь. Война продолжалась, наконец вся земля пропиталась кровью людей и Детей Леса, однако их погибло больше, потому что люди были сильнее, а дерево, камень и обсидиан не могли противостоять бронзе. Наконец обе расы послушались своих мудрецов и договорились. Вожди и герои Первых Людей встретились с Видящими Сквозь Зелень и плясунами леса в рощах чардрев, на маленьком острове, что лежит посреди огромного озера, именуемого Глазом Богов.</p><p class="p1">Там они заключили договор. К Первым Людям отошли берега, высокие равнины и чистые луга, холмы и горы. Только густой лес навсегда оставался собственностью детей, и нельзя было отныне предать топору ни одного чардрева во всей стране. Чтобы боги были свидетелями заключения договора, каждое дерево на острове наделили лицом, а после учредили священный орден Зеленых людей, обязанных приглядывать за островом Ликов.</p><p class="p1">Мир этот создал основу четырехтысячелетней дружбы между людьми и Детьми Леса. Шло время, и Первые Люди даже отреклись от богов, которых привезли с собой, и поклонились тайным божествам леса. Заключение договора положило конец эпохе Зари, и начался век героев.</p><p class="p1">Кулак Брана свернулся вокруг блестящего черного наконечника.</p><p class="p1">— Но ты говоришь, что все Дети Леса исчезли.</p><p class="p1">— Да, они исчезли, но только здесь, — ответила Оша, откусывая конец последнего бинта зубами. — К северу от Стены все обстоит иначе. Туда ушли Дети Леса, гиганты и прочие древние расы.</p><p class="p1">Мейстер Лювин вздохнул:</p><p class="p1">— Женщина, помни, что ты сейчас должна была лежать в земле или томиться в цепях. Старки проявили к тебе не заслуженную тобой доброту. И нехорошо платить им, забивая головы ребят чепухой.</p><p class="p1">— Но тогда ты скажи мне, куда они ушли, — попросил Бран. — Я хочу знать.</p><p class="p1">— И я тоже, — присоединился Рикон.</p><p class="p1">— Слушайте тогда, — продолжил Лювин. — Мир этот соблюдался, пока стояли королевства Первых Людей, и весь век героев, и Долгую Ночь, и в пору рождения Семи Королевств, но через много столетий новые люди пришли из-за моря.</p><p class="p1">Их возглавляли андалы, высокие светловолосые воины, пришедшие со сталью, огнем и семиконечной звездой новых богов, вытатуированной на груди. Война затянулась на века, однако в конце концов все шесть южных королевств пали перед завоевателями. Только здесь, где Короли Севера отбрасывали каждую армию, пытавшуюся пересечь Перешеек, сохранилось правление Первых Людей. Андалы жгли чардрева, срубали с них лики, убивали Детей Леса повсюду, где находили их, и шумно провозглашали победу Семерых над старыми богами. Поэтому Дети убежали на север…</p><p class="p1">Лето взвыл.</p><p class="p1">Мейстер Лювин вздрогнул и умолк. Вскочив на ноги, Лохматый присоединил свой голос к голосу Лето, и ужас наполнил сердце Брана.</p><p class="p1">— Он близко, — прошептал Бран с уверенностью отчаяния. Он знал это со вчерашней ночи, когда ворон водил его в крипту прощаться. Он знал, но не верил. Он хотел, чтобы прав оказался мейстер Лювин. Ворон, подумал он, трехглазый ворон…</p><p class="p1">Волки смолкли столь же внезапно. Лето отправился к Лохматому и лизнул окровавленную шкуру на шее брата. В окно влетела птица.</p><p class="p1">Ворон опустился на серый каменный подоконник, раскрыл клюв и каркнул хриплым горестным голосом.</p><p class="p1">Рикон зарыдал. Наконечники стрел один за одним попадали из его рук, звонко ударяясь о пол. Бран прижал к себе брата и обнял его.</p><p class="p1">Мейстер Лювин глядел на черную птицу, как на скорпиона, облаченного в перья. Он поднялся и медленной походкой лунатика направился к окну. Потом мейстер свистнул, и ворон перескочил на его перевязанную руку. На крыльях его запеклась кровь.</p><p class="p1">— Сова, — пробормотал Лювин, снимая письмо с ноги, — а может, и ястреб. Бедняга, удивительно, как это он долетел.</p><p class="p1">Бран обнаружил, что, пока мейстер разворачивал листок, его била крупная дрожь.</p><p class="p1">— Что там? — спросил он, прижимая к себе брата.</p><p class="p1">— Ты уже знаешь, что там написано, мальчик, — сказала Оша, не без сочувствия в голосе. И опустила ладонь на его голову.</p><p class="p1">Мейстер Лювин, невысокий седеющий человечек, с обагренным кровью рукавом серого шерстяного одеяния, не веря, глядел на них… В его ясных серых глазах блеснули слезы.</p><p class="p1">— Милорды, — обратился он к обоим сыновьям лорда Эддарда голосом хриплым и надломленным. — Нам необходимо найти каменотеса, который хорошо знал вашего отца…</p></span>
