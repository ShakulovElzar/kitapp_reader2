<span id="id61"><div class="title2">
<p class="p">Джон</p>
</div><p class="p1">— С тобой все в порядке, Сноу? — спросил лорд Мормонт хмурясь.</p><p class="p1">— В порядке, — каркнул ворон. — В порядке.</p><p class="p1">— Да, милорд, — солгал Джон громким голосом, словно это могло придать его словами правдивость. — А как вы?</p><p class="p1">Мормонт нахмурился:</p><p class="p1">— Мертвяк попытался убить меня. Как я могу себя хорошо чувствовать? — Он поскреб под подбородком. Кустистая седая борода обгорела в огне, и он срезал ее. Бледная щетина усов превратила его в сердитого неопрятного старца. — Ты не похож на себя. Как твоя рука?</p><p class="p1">— Заживает. — Джон изогнул перевязанные пальцы, показывая ему. Не замечая того, он сильно обжегся, бросая горящие занавеси, и правая рука его почти по локоть была обвязана шелком. Тогда он почти ничего не почувствовал, мука началась после. Из трещин побагровевшей кожи текла жидкость, между пальцами надулись жуткие кровавые пузыри, огромные, как тараканы. — Мейстер говорит, что у меня останутся шрамы, но рука будет такой же, как и прежде.</p><p class="p1">— Шрамы — это не страшно. На Стене чаще приходится носить перчатки.</p><p class="p1">— Безусловно, милорд. — Но не шрамы смущали Джона, а все остальное. Мейстер Эйемон давал ему маковое молоко, но, невзирая на это, боль оставалась ужасной. Поначалу ему казалось, что руку его днем и ночью опалял огонь. Лишь погружая ее в снег или лед, он ощущал какое-то облегчение. Джон благодарил богов, что никто, кроме Призрака, не видит, как он крутится на своей постели, скуля от боли. Когда он наконец засыпал, приходили сны, а это было еще хуже. У снившегося ему мертвяка было лицо отца; синеглазый, он тянул к нему черные руки, однако Джон не посмел рассказать об этом Мормонту.</p><p class="p1">— Дайвин и Хаке возвратились вчера вечером, — сказал Старый Медведь. — Они не обнаружили никаких следов твоего дяди, как и все остальные.</p><p class="p1">— Я знаю это. — Джон заставил себя добраться до общего зала, чтобы пообедать с друзьями, и все вокруг говорили только о неудачном поиске.</p><p class="p1">— Ты знаешь, — буркнул Мормонт. — Как это получается, что все вокруг всё знают? — Он, похоже, не рассчитывал на ответ. — Кажется, что их было только двое… этих созданий. Кем бы они ни были, я не назову их людьми. Было бы больше… об этом лучше не думать. Благодари за это богов! Но они еще придут. Я ощущаю это своими старыми костями. Мейстер Эйемон согласен со мной. Задувают холодные ветры, лето кончается; грядет зима, какой еще не видал мир!</p><p class="p1">«Зима близко». Девиз Старков еще никогда не казался Джону настолько мрачным и зловещим.</p><p class="p1">— Милорд, — неуверенно сказал он, — говорят, прошлой ночью прилетела птица.</p><p class="p1">— Да. Ну и что?</p><p class="p1">— Я надеялся получить хоть какое-то известие об отце.</p><p class="p1">— Отец, — передразнил его старый ворон и, склонив голову, переступил по плечам Мормонта. — Отец.</p><p class="p1">Лорд-командующий протянул руку, чтобы прищемить ему клюв, но ворон дернул головой, взмахнул крыльями и, перелетев через палату, сел над окном.</p><p class="p1">— Горе и шум, — проворчал Мормонт. — Ничего другого от этих воронов не услышишь. И зачем я связался с этой зловещей птицей… неужели ты думаешь, что я не послал бы за тобой, получив вести о лорде Эддарде? Пусть ты бастард, но все равно от крови его. В письме шла речь о сире Барристане Селми. Его, выходит, выгнали из Королевской гвардии, а на его место взяли этого черного пса Клигана, и теперь Селми разыскивают за измену. Эти дураки послали за ним стражников, но он убил двоих и бежал. — Мормонт фыркнул, не скрывая своего мнения о людях, выславших золотые плащи против столь прославленного рыцаря, как Барристан Отважный. — По лесу бродят Белые Ходоки, мертвяки врываются в наши покои, а тут еще мальчишка уселся на Железный трон, — недовольно проговорил он.</p><p class="p1">Ворон пронзительно расхохотался:</p><p class="p1">— Мальчишка, мальчишка, мальчишка, мальчишка!</p><p class="p1">Старый Медведь всегда надеялся на помощь сира Барристана, вспомнил Джон. И если он пал, кто теперь прислушается к письму Мормонта? Джон стиснул руку в кулак. Боль пронзила обожженные пальцы.</p><p class="p1">— А что слышно о моих сестрах?</p><p class="p1">— Мне ничего не написали ни о лорде Эддарде, ни о его дочерях. — Мормонт раздраженно пожал плечами. — Быть может, они не получили мое письмо. Эйемон послал две копии с лучшими птицами, но разве можно быть в чем-то уверенным? Скорее всего Пицель не хочет отвечать. Не в первый раз и не в последний. Боюсь, что нам не на кого рассчитывать в Королевской Гавани; нам говорят лишь то, что считают нужным, а этого, увы, мало.</p><p class="p1">Ты и сам говоришь мне лишь то, что считаешь нужным, а это, увы, еще меньше, недовольно подумал Джон. Брат его Робб созвал знамена и отправился на юг воевать, и обо всем этом ни слова… правда, Сэмвел Тарли, который читал письмо, полученное мейстером Эйемоном, по секрету рассказал ему все, то и дело повторяя, что не должен этого делать. Вне сомнения, они считали, что поход брата его не касается, однако война волновала Джона сильнее, чем он смел сказать. Лорд Робб шел в бой, а он не был с ним. Сколь часто ни твердил себе Джон, что теперь его место здесь, на Стене, рядом с новыми братьями, он все равно ощущал себя трусом.</p><p class="p1">— Зерна, — каркнул ворон, — зерна, зерна!</p><p class="p1">— Да замолчи же, — сказал птице Старый Медведь. — И скоро, по мнению мейстера Эйемона, ты сумеешь пользоваться этой рукой?</p><p class="p1">— Скоро, — ответил Джон.</p><p class="p1">— Хорошо. — Лорд Мормонт положил на стол между ними большой меч в черных металлических ножнах, окованных серебром. — Вот. Значит, сумеешь поднять его.</p><p class="p1">Ворон слетел вниз, опустился на стол и направился к мечу, с любопытством наклонив набок голову. Джон медлил, не понимая, что это значит.</p><p class="p1">— Милорд?</p><p class="p1">— Огонь расплавил серебряное яблоко, сжег поперечину и рукоять… что ж, сухая кожа, старое дерево, чего еще ожидать. Клинок… лишь огонь в сотню раз более жаркий смог бы причинить вред этой стали. — Мормонт подвинул ножны по грубым дубовым доскам. — Остальное я приказал сделать заново. Бери его.</p><p class="p1">— Бери его, — отозвался ворон. — Бери его. Бери!</p><p class="p1">Неловким движением Джон взял оружие левой рукой — перевязанная правая была еще слишком неловкой. Он осторожно извлек меч из ножен и поднес к глазам. Яблоко вырезали из бледного камня, залитого свинцом, чтобы уравновесить длинный клинок, изобразив подобие оскалившейся волчьей головы. Вместо глаз в нее были вставлены зернышки граната, рукоять обтянули новой кожей, ни пот, ни кровь еще не оставили пятен на ее мягкой черной поверхности. Сам клинок оказался на добрых полфута длиннее, чем тот, к которому привык Джон. Меч суживался к концу, чтобы можно было и колоть, и рубить, три глубоких желобка тянулись по всей длине. Если Лед был настоящим двуручным мечом, этот был полуторным, — иногда такие называли бастардными. Тем не менее Волчий меч показался Джону легче клинков, которыми ему приходилось фехтовать. Повернув клинок, Джон заметил узоры на темной стали, оставшиеся после ковки.</p><p class="p1">— Это же валирийская сталь, милорд, — сказал он с восторгом. Отец часто позволял ему рассматривать Лед, так что Джон знал и облик, и ощущение.</p><p class="p1">— Так, — согласился Старый Медведь. — Оружие это принадлежало моему отцу, а прежде деду. Мормонты владели им пять столетий. Было время, я сам извлекал его из ножен, а потом передал сыну, когда ушел в Черные Братья.</p><p class="p1">«Он дарит мне меч сына!» Джон едва мог поверить в это. Клинок был самым точным образом уравновешен. Под поцелуем света лезвие поблескивало.</p><p class="p1">— Ваш сын…</p><p class="p1">— Мой сын навлек позор на дом Мормонтов, но по крайней мере честь помешала ему прихватить с собой в изгнание этот меч. Моя сестра возвратила оружие мне, но уже один вид меча напоминал мне о бесчестье Джораха, поэтому я спрятал его и забыл — пока его не нашли в пепле, оставшемся от моей опочивальни. Прежняя рукоять изображала медвежью голову из серебра, но серебро настолько истерлось за века, что его уже трудно было заметить. Я решил, что тебе больше подходит белый волк. Один из наших строителей прекрасно режет по камню.</p><p class="p1">Когда-то — в возрасте Брана — Джон мечтал о великих подвигах, как и всякий здоровый мальчишка. Подробности подвигов менялись от грезы к грезе, однако чаще всего ему представлялось, как он спасает жизнь своего собственного отца. И лорд Эддард называет его истинным Старком и отдает свой меч. Даже воспоминание пристыдило его. Какой человек может покуситься на первородство собственного брата? У меня нет права владеть и этим мечом, и Льдом, подумал он. Джон шевельнул обгорелыми пальцами, ощутив под кожей острый укол.</p><p class="p1">— Милорд, вы оказываете мне честь, но…</p><p class="p1">— Избавь меня от всяких «но», мальчик, — перебил его лорд Мормонт. — Я бы не сидел здесь, если бы не ты со своим зверем. Ты дрался отчаянно, более того — быстро соображал! Огонь! Проклятие, нам следовало бы знать. Нам следовало бы вовремя вспомнить о нем. Длинная Ночь уже приходила. Конечно, восемь тысяч лет — долгий срок, но… но если не помнит Ночной Дозор, кто же вспомнит!</p><p class="p1">— Вспомнит, — подтвердил разговорчивый ворон. — Вспомнит…</p><p class="p1">В ту ночь боги воистину услышали молитву Джона. Огонь охватил одежду мертвяка и поглотил его самого, словно убитая плоть была свечным воском, а кости — сухой древесиной. Джону нужно было только закрыть глаза, чтобы увидеть, как тварь мечется по солярию, натыкается на мебель и пытается сбить пламя. Но как истинное наваждение, преследовало Джона его лицо, окруженное облаком огня… волосы, пылающие как солома; расплавившаяся мертвая плоть стекает с черепа, открывая голую кость. Та демоническая сила, которая овладела Отором, бежала от огня, и среди пепла они обнаружили изуродованный труп — жареное мясо и обгорелые кости. Но в кошмарах мертвяк являлся Джону снова и снова… и всякий раз черный труп был как две капли воды похож на лорда Эддарда. Это кожа его отца лопалась и чернела, это отцовские глаза слезами вытекали на щеки. Джон не понимал, что это значит, но видение пугало его сильнее, чем он мог предположить.</p><p class="p1">— Меч — скромная плата за жизнь, — заключил Мормонт. — Так что бери его; я не хочу ничего больше слышать об этом, понятно?</p><p class="p1">— Да, милорд. — Мягкая кожа подалась под пальцами Джона, словно бы меч приспосабливался к его руке. Он знал, что ему оказали честь, он понимал это, и все же…</p><p class="p1">«Он не мой отец, — непрошеная мысль толкнулась в голову Джона. — Мой отец — лорд Эддард Старк, и я не забуду этого, пусть меня задарят мечами». Нельзя же признаться лорду Мормонту, что он-то всегда мечтал о другом клинке.</p><p class="p1">— Я не хочу никаких любезностей, Сноу, — продолжил лорд Мормонт. — Поэтому не благодари меня. Чти сталь подвигом, а не словами.</p><p class="p1">Джон кивнул:</p><p class="p1">— Есть ли у него имя, милорд?</p><p class="p1">— Прежде он звался Длинным Когтем.</p><p class="p1">— Когтем, — отозвался ворон. — Когтем.</p><p class="p1">— Длинный Коготь — подходящее имя. — Джон для пробы взмахнул левой рукой. Движение вышло неловким, но меч взлетел к потолку, словно по собственной воле. — Когти есть и у волков, и у медведей.</p><p class="p1">Старый Медведь был доволен:</p><p class="p1">— Конечно же. Тебе придется носить его через плечо; меч для тебя еще слишком длинен, чтобы носить на поясе… Ничего, подрастешь еще на несколько дюймов. Нужно только разучить удары двумя руками. Когда твои ожоги заживут, сир Эндрю покажет тебе некоторые приемы.</p><p class="p1">— Сир Эндрю? — Джон не знал этого имени.</p><p class="p1">— Сир Эндрю Тарт, добрый человек. Он направляется сюда из Сумеречной башни, чтобы принять обязанности мастера над оружием. Сир Аллисер Торне вчера вечером отбыл в Восточный Дозор у моря.</p><p class="p1">Джон опустил меч и с дурацким недоумением спросил:</p><p class="p1">— Почему?</p><p class="p1">Мормонт фыркнул:</p><p class="p1">— Потому, что я отослал его, понятно? Он взял кисть, которую твой Призрак оторвал от запястья Яфера Флауэрса. Я приказал сиру Аллисеру плыть на корабле в Королевскую Гавань и положить эту штуковину перед мальчишкой-королем. Уж это привлечет внимание юного Джоффри, я думаю… К тому же сир Аллисер — человек знатный, помазанный рыцарь. У него есть старые друзья при дворе, его-то уж при дворе заметят в отличие от простого ворона.</p><p class="p1">— Ворона. — Джону послышалось некоторое неодобрение в голосе птицы.</p><p class="p1">— Потом, — продолжил лорд-командующий, игнорируя выходку птицы, — он окажется в тысяче миль от тебя, и мы избавимся от всяких ссор. — Лорд Мормонт ткнул пальцем в сторону Джона. — Не думай, что я одобряю ту бессмыслицу, которая произошла в общем зале. Доблесть способна скомпенсировать проявленную глупость, но ты теперь не мальчишка, при всех твоих немногих годах. Меч этот подобает мужчине, и владеть им должен человек зрелый. Рассчитываю, что с этой поры ты будешь вести себя как положено.</p><p class="p1">— Да, милорд. — Джон задвинул меч в окованные серебром ножны; сам он выбрал бы не этот клинок, но это был дар благородный, а освобождение от злых козней сира Аллисера Торне сулило облегчение.</p><p class="p1">Старый Медведь поскреб подбородок.</p><p class="p1">— Я уже и забыл, как сильно чешется новая борода, — сказал он. — Но этому не поможешь. А твоя рука позволяет тебе приступить к делам?</p><p class="p1">— Да, милорд.</p><p class="p1">— Хорошо. Сегодня ночью будет холодно, я хочу горячего вина со специями. Найди мне бутыль красного, не слишком кислого, и не жалей специй. Потом скажи Хобу, что, если он еще раз приготовит мне отварную баранину, я прикажу отварить его самого. Та ножка, которую он прислал в последний раз, уже позеленела от старости. Даже моя птица не захотела прикоснуться к ней. — И он погладил пальцем ворона по голове, птица отвечала удовлетворенным звуком. — Ну, иди. Мне надо поработать.</p><p class="p1">Стражи, устроившиеся в нишах, встретили улыбками спустившегося по лестнице Джона, держащего меч в здоровой руке.</p><p class="p1">— Отличная сталь, — сказал один из них.</p><p class="p1">— Ты заслужил ее, Сноу, — добавил другой. Джон заставил себя отвечать улыбаясь, но сердце его было не здесь. Он знал, что должен быть доволен, однако не ощущал радости. Рука болела, вкус гнева еще не оставил рот, хотя Джон и не знал, на кого сердится и почему. С полдюжины его друзей собрались неподалеку от Королевской башни, где теперь расположился лорд-командующий Мормонт. Они повесили мишень на двери житницы так, будто тренировали свою меткость, однако он немедленно все понял.</p><p class="p1">Едва Джон отошел от башни, Пип окликнул его:</p><p class="p1">— Ну-ка, иди сюда, дай посмотреть.</p><p class="p1">— На что посмотреть? — спросил Джон.</p><p class="p1">Жаба подвинулся ближе:</p><p class="p1">— На твои розовые задние щечки, на что же еще?</p><p class="p1">— Меч, — заявил Гренн. — Хотим видеть меч.</p><p class="p1">Джон обвел их обвиняющим взглядом.</p><p class="p1">— Значит, вы знали.</p><p class="p1">Пип ухмыльнулся:</p><p class="p1">— Не все такие тупые, как Гренн.</p><p class="p1">— Сам такой, — отозвался Гренн. — И даже тупее!</p><p class="p1">Строитель Халдер, смущаясь, пожал плечами:</p><p class="p1">— Я помогал Пейту резать камень для рукояти, а твой друг Сэм разыскал гранаты в Кротовом городке.</p><p class="p1">— А мы знали даже еще раньше, — сказал Гренн. — Рудис помогал Доналу Нойе в кузнице, он был там, когда Старый Медведь принес обгорелый клинок.</p><p class="p1">— Меч! — настаивал Матт. Другие хором присоединились к нему:</p><p class="p1">— Меч, меч, меч!</p><p class="p1">Джон извлек Длинный Коготь из ножен и показал его, поворачивая так и эдак, чтобы все могли восхититься. Клинок бастарда поблескивал в бледном солнечном свете, темный и смертоносный.</p><p class="p1">— Валирийская сталь, — провозгласил Джон торжественно, пытаясь показать подобающие случаю довольство и гордость.</p><p class="p1">— А знаешь, что было с тем человеком, который сделал бритву из валирийской стали? — спросил Жаба. — Слушай — он отрезал себе голову, пытаясь побриться!</p><p class="p1">Пип ухмыльнулся:</p><p class="p1">— Ночному Дозору тысячи лет. Однако не сомневаюсь, что наш лорд Сноу первым среди братьев отмечен за то, что сжег башню лорда-командующего.</p><p class="p1">Все захохотали. Даже Джону пришлось улыбнуться. Учиненный им пожар, конечно, не мог уничтожить внушительную каменную твердыню, однако огонь повредил палаты на двух верхних этажах, которые занимал Старый Медведь. Случившаяся беда никого особо не волновала, поскольку в огне погиб полный убийственных намерений труп Отора.</p><p class="p1">Другой мертвяк — однорукий, тот, что был прежде Яфером Флауэрсом, — был изрублен в куски дюжиной мечей… но лишь после того, как он убил сира Джареми Риккера и еще четверых. Сир Джареми уже заканчивал дело, сняв с покойника голову, но тем не менее погиб, когда уже обезглавленный труп, вытащив из ножен собственный кинжал Риккера, вонзил его в нутро дозорного. Сила и отвага не помогали против врага, который не падал потому, что был уже мертв; даже оружие и броня не предоставляли надежной защиты.</p><p class="p1">Эта мрачная мысль еще больше испортила настроение Джона.</p><p class="p1">— Мне надо еще переговорить с Хобом относительно обеда Старого Медведя, — объявил он отрывисто, опуская Длинный Коготь в ножны. Друзья хотели ему добра, но ничего не понимали. Это не их вина. Им не пришлось стоять перед Отором, они не видели бледный свет синих мертвых глаз, не ощущали своей кожей холодное прикосновение черных мертвых пальцев. Не знали они и о войне, начинавшейся в Приречье. Разве могут они понять? Джон резко отвернулся и мрачно зашагал прочь. Пип окликнул его, но Джон не обратил на него внимания.</p><p class="p1">После пожара он переселился обратно в свою старую каморку в обрушившейся башне Хардина. Призрак дремал, свернувшись клубком возле двери, но, заслышав шаги Джона, поднял голову. Красные глаза лютоволка казались темнее гранатов, в них ощущалась свойственная человеку мудрость. Джон пригнулся, почесал волка за ухом и показал на рукоять меча:</p><p class="p1">— Смотри — это ты.</p><p class="p1">Призрак обнюхал свое резное подобие, попытался лизнуть камень. Джон улыбнулся.</p><p class="p1">— Эта честь принадлежит тебе, — сказал он волку… и вдруг вспомнил, как нашел его в тот день в поздних летних снегах. Они уже направились прочь с остальными щенками, но Джон услышал писк и вернулся назад. Тут-то он и нашелся, белый мех скрывал щенка среди сугробов. Он был совсем один, подумал Джон. Один, в стороне от всех остальных. Он был не похож на других, поэтому его и прогнали.</p><p class="p1">— Джон? — Он поглядел вверх. Сэм Тарли нервно покачивался на пятках. Щеки его покраснели, тяжелый меховой плащ явно годился для предстоящей зимы.</p><p class="p1">— Сэм, — Джон встал, — что случилось? Или ты тоже хочешь увидеть меч? — Если знали все остальные, значит, о Когте известно и Сэму.</p><p class="p1">Толстяк качнул головой.</p><p class="p1">— Я был наследником клинка своего отца, — сказал он скорбно. — Его имя — Губитель Сердец, лорд Рендилл несколько раз давал мне его подержать, только я всегда пугался. Он тоже был из валирийской стали, прекрасной, но настолько острой, что я опасался ранить кого-нибудь из сестер. Теперь им владеет Дикон. — Он вытер потные руки о плащ. — Я… я… мейстер Эйемон хочет видеть тебя.</p><p class="p1">Менять повязку было еще рано. Джон подозрительно нахмурился.</p><p class="p1">— Почему? — спросил он. Сэм казался несчастным. Этого было достаточно.</p><p class="p1">— Ты сказал ему? — сердито спросил Джон. — Ты признался ему в том, что все рассказал мне?</p><p class="p1">— Я… он… Джон, я не хотел этого… но он спросил… я хочу сказать… я думаю, он знал; он видит вещи, как никто другой…</p><p class="p1">— Но мейстер Эйемон слеп, — с недовольством подчеркнул Джон. — Я сам найду путь.</p><p class="p1">Затрясшийся Сэм, открыв рот, остался на месте.</p><p class="p1">Мейстер Эйемон находился в птичнике и кормил ворон. С ним был Клидас с ведерком нарезанного мяса, они неторопливо переходили от клетки к клетке.</p><p class="p1">— Сэм сказал, что вы хотели видеть меня?</p><p class="p1">Мейстер кивнул:</p><p class="p1">— Действительно. Клидас, передай Джону ведерко, быть может, он будет настолько добр, что поможет мне.</p><p class="p1">Горбатый брат с розовыми глазами передал Джону ведерко и заторопился вниз по лестнице.</p><p class="p1">— Бросай мясо в клетки, — велел Эйемон. — Птицы сделают все остальное.</p><p class="p1">Джон переложил ведерко в правую руку, запустив левую в окровавленное содержимое. Вороны, шумно перекрикиваясь, жались к решетке, ударяя по металлу черными как ночь крыльями и клювами. Мясо порезали на куски толщиной в палец. Наполнив кулак, он бросил красную плоть в клетки, и ссоры сделались жарче. Полетели перья, когда две крупные птицы схватились из-за куска. Джон торопливо набрал вторую горсть и швырнул мясо в клетку.</p><p class="p1">— А ворон лорда Мормонта любит фрукты и зерно.</p><p class="p1">— Редкая птица, — сказал ему мейстер. — Вообще-то вороны едят зерно, но предпочитают мясо. Оно придает им силу, к тому же птицам приятен вкус крови. В этом они похожи на людей… Ты, наверное, не знаешь, что, подобно людям, вороны не похожи друг на друга…</p><p class="p1">Джону нечего было ответить. Он разбрасывал мясо, гадая, зачем его вызвали. Старик скажет все сам, когда сочтет нужным. Мейстер Эйемон не из тех, кого можно торопить.</p><p class="p1">— Голубей и горлиц тоже можно было бы приучить носить письма, — продолжил мейстер. — Но ворон сильнее. Крупная, отважная и умная птица способна отбиться от ястребов… Но вороны черны пером и едят мертвечину, а посему некоторые люди испытывают к ним отвращение. Бейелор Благочестивый попытался заменить воронов голубями, ты слыхал об этом? — Мейстер обратил свои бельма к Джону и улыбнулся: — Ночной Дозор предпочитает воронов.</p><p class="p1">Пальцы Джона опустились в ведерко, вся ладонь до запястья была в крови.</p><p class="p1">— Дайвин утверждает, что одичалые зовут нас воронами, — сказал он неуверенным голосом.</p><p class="p1">— Ворона — бедная родственница ворона. Птицы эти — как нищие в черном, ненавистные и непонятные.</p><p class="p1">Джону самому хотелось бы понять, о чем говорит Эйемон и почему. Какое ему дело до воронов и голубей? Если старик хочет что-то сказать ему, почему нельзя это сделать просто и прямо?</p><p class="p1">— Джон, ты никогда не думал, почему братья Ночного Дозора не вправе заводить жен и детей? — спросил мейстер Эйемон.</p><p class="p1">Джон пожал плечами.</p><p class="p1">— Нет, — ответил он, разбрасывая мясо. Пальцы его левой руки стали липкими от крови, правую пронизывала пульсирующая боль от тяжести ведра.</p><p class="p1">— Это для того, чтобы они не могли любить, — ответил старик. — Потому что любовь способна погубить честь, убить чувство долга.</p><p class="p1">На взгляд Джона, в этих словах не было правды, однако он промолчал. Мейстеру перевалило за сотню лет, он — один из старших офицеров в Ночном Дозоре, и не его дело противоречить старику.</p><p class="p1">Тот как будто бы ощутил сомнения юноши.</p><p class="p1">— Скажи мне, Джон, если случится такое, что твоему лорду-отцу придется выбирать между честью и теми, кого он любит, что предпочтет лорд Эддард?</p><p class="p1">Джон медлил. Он хотел было сказать, что лорд Эддард никогда не обесчестит себя даже ради любви, но тихий лукавый голос шептал: «Он родил бастарда, какая же в этом честь? Потом, твоя мать, как насчет его долга перед ней, почему он так никогда и не назвал тебе ее имя?»</p><p class="p1">— Он сделает то, что сочтет справедливым, — сказал Джон… звонко, чтобы скрыть колебания. — Не считаясь ни с чем.</p><p class="p1">— Тогда второго такого, как лорд Эддард, не найдешь и среди десяти тысяч. В основном люди не столь сильны. Разве честь можно сравнить с женской любовью? И как чувство долга может превысить ту радость, с которой ты берешь на руки новорожденного сына… Ветер и слова. Ветер и слова. Мы всего только люди, и боги создали нас для любви. В ней и наше величие, и наша трагедия.</p><p class="p1">Люди, создавшие Ночной Дозор, знали, что бывают минуты, когда лишь их отвага сможет защитить страну от наползающей с севера тьмы. Они понимали, что не должны заводить связей, способных ослабить их решимость. Поэтому они поклялись не иметь ни жен, ни детей.</p><p class="p1">Но у них были братья и сестры. И матери, которые родили их, и отцы, которые дали им имена. Эти мужи приходили сюда из сотни задиристых королевств; они знали, что времена могут перемениться, но люди останутся прежними. Поэтому они поклялись, что Ночной Дозор никогда не примет участия в битвах тех земель, которые они охраняют.</p><p class="p1">Они выполнили свое обещание. Когда Эйегон убил Черного Харрена и объявил себя королем, брат Харрена был лордом-командующим на Стене и имел под рукой десять тысяч мечей, но он не выступил. В те времена, когда Семь Королевств воистину были семью королевствами, не проходило и поколения, чтобы три или четыре из них не схватились в войне. Черные Братья не принимали в них участия. Когда андалы переплыли Узкое море и смели королевства Первых Людей, верные своим обетам сыновья павших королей остались на своем посту. Так было все эти несчетные годы. Такова цена чести!</p><p class="p1">Трус может обнаружить истинную отвагу, когда ему нечего опасаться. Все мы выполняем свой долг, когда это ничего нам не стоит. Как легко кажется тогда следовать тропою чести! Однако рано или поздно в жизни каждого человека наступает день, когда не знаешь, как поступить, когда приходится выбирать.</p><p class="p1">Некоторые из воронов все еще клевали, вырывая у своих собратьев мясо из клюва. Остальные наблюдали за ними. Джон ощущал на себе тяжесть этих крошечных черных глаз.</p><p class="p1">— Значит, пришел мой день… вы это хотите сказать?</p><p class="p1">Мейстер повернул голову и поглядел на него мертвыми белыми глазами. Он словно бы видел его насквозь, заглядывал в самое его сердце. Джон казался себе нагим и беспомощным. Он взял ведерко обеими руками и перебросил через решетку оставшееся мясо. Куски разлетелись, забрызгав кровью птиц. Закричав, они взлетели, самые ловкие хватали мясо на лету и глотали его. Пустое ведерко звякнуло о пол.</p><p class="p1">Старик положил сморщенную пятнистую руку на его плечо.</p><p class="p1">— Тебе больно, мальчик, — сказал он. — Конечно. Выбирать… выбирать всегда больно. И всегда будет больно. Я знаю.</p><p class="p1">— Нет, не знаете, — с горечью сказал Джон. — И никто не знает. Пусть я только бастард, но он все-таки мой отец!</p><p class="p1">Мейстер Эйемон вздохнул:</p><p class="p1">— Неужели ты не услышал моих слов? Почему это ты считаешь себя первым? — Он качнул древней головой с невыразимой усталостью. — Три раза боги испытывали мой обет. Однажды, когда я был мальчишкой, однажды во всей полноте мужественности, и еще раз, когда я состарился. К тому времени сила оставила меня, глаза потускнели, но последний выбор был столь же жесток, как и первый. Вороны приносили мне с юга слова еще более черные, чем их крылья: вести о гибели моего дома, о смерти моих родичей, о позоре и истреблении. Но что я мог сделать, старый, слепой и бессильный? Я был беспомощен как младенец, но сколь горько мне было сидеть здесь, в забвении, когда зарубили бедного внука моего брата, его сына и даже его малых детей…</p><p class="p1">Потрясенный Джон увидел слезы, блеснувшие на глазах старика.</p><p class="p1">— Кто вы? — спросил он, едва ли не в тихом ужасе.</p><p class="p1">Беззубая улыбка дрогнула на древних губах.</p><p class="p1">— Я только мейстер цитадели, обязанный служить Черному замку и Ночному Дозору. В нашем ордене принято забывать свой род, давая обет и надевая оплечье.</p><p class="p1">Старик прикоснулся к цепи мейстера, свободно свисавшей с его тонкой бесплотной шеи.</p><p class="p1">— Отцом моим был Мейекар, он первый носил это имя, и брат мой Эйегон наследовал ему вместо меня. Дед мой назвал меня в честь принца Эйемона, Рыцаря-дракона, бывшего ему дядей — или отцом, в зависимости от того, кому верить. Меня он назвал Эйемоном…</p><p class="p1">— Эйемон… вы Таргариен? — Джон не мог поверить своим ушам.</p><p class="p1">— Некогда был им, — отвечал старик. — Некогда. Словом, теперь ты понял, Джон, что я знаю, о чем говорю… но зная, не скажу тебе, как следует поступить. Ты должен совершить свой выбор самостоятельно и весь остаток своей жизни прожить, зная это. Как пришлось сделать мне. — Голос его превратился в шепот. — Как пришлось сделать мне…</p></span>
