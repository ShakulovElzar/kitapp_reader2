<span id="id44"><div class="title2">
<p class="p">Эддард</p>
</div><p class="p1">Лучи рассвета лились сквозь узкие высокие окна колоссального тронного зала Красного замка, подчеркивая темно-бордовые полосы на стенах, оставшиеся там, где прежде висели головы драконов. Теперь камень прикрывали гобелены со сценами охоты, яркие в своей зелени, синеве и охре. Тем не менее Неду Старку казалось, что в зале властвует единственный цвет алой крови.</p><p class="p1">Он сидел на высоком и огромном древнем престоле Эйегона-завоевателя, чудовищном и причудливом сооружении из железных шипов и зубастых ребер невероятно скомканного металла. Седалище — как говорил Роберт — адски неудобное, и тем более теперь, когда боль в его раздробленной ноге пульсировала все сильнее с каждой новой минутой. Металл под ним с каждым часом становился все тверже, а зубастая сталь за спиной мешала откинуться назад. Король не должен чувствовать себя легко на престоле, утверждал Эйегон-завоеватель, повелев своим мастерам выковать трон из мечей, сложенных его врагами. Боги, прокляните Эйегона за его надменность, угрюмо думал Нед, а заодно и Роберта с его охотой!</p><p class="p1">— Вы совершенно уверены, что это не просто разбойники? — негромко спросил Варис из-за стола совета, поставленного у подножия трона. Великий мейстер Пицель неловко шевельнулся возле него, Мизинец тем временем играл с пером. Остальные советники отсутствовали. В лесу заметили белого оленя, и лорд Ренли с сиром Барристаном присоединились к ставке, составив компанию вместе с принцем Джоффри, Сандором Клиганом, Белоном Свонном и половиной двора. Поэтому и пришлось ему, Неду, замещать короля на Железном троне.</p><p class="p1">Впрочем, он мог хотя бы сидеть. Присутствующие же, за исключением членов совета, обязаны были стоять — склонившись на коленях. Просители, собравшиеся возле высоких дверей, рыцари, высокие лорды, дамы у гобеленов, мелкий люд в галерее, стражи в кольчугах, золотых или серых плащах, — все стояли.</p><p class="p1">Деревенские были на коленях: мужчины, женщины и дети, окровавленные и потрепанные, на лицах написан страх. Их охраняли трое рыцарей, которые доставили селян в качестве свидетелей.</p><p class="p1">— Разбойники, лорд Варис? — Голос сира Реймена Дарри сочился презрением. — Конечно, это были разбойники, вне всяких сомнений — ланнистерские разбойники.</p><p class="p1">Нед ощущал напряженность в зале, высокие лорды и слуги замерли с равным вниманием. Чему удивляться? Запад готов взорваться как порох, после того как Кейтилин схватила Тириона Ланнистера. Риверран и Бобровый утес созвали знамена, войска собрались в проходе под Золотым Зубом. Кровь потечет — дело только во времени. Обсуждать можно было одно: как лучше прижечь рану.</p><p class="p1">Сир Карил Венс, вполне способный сойти за красавца, если бы не багровое, цвета вина, родимое пятно, пометившее его лицо, скорбно поглядел в сторону склонившихся селян.</p><p class="p1">— Это все, что осталось от острога Шеррир, лорд Эддард. Остальные погибли вместе с жителями Вендского городка и Кукольникова брода.</p><p class="p1">— Встаньте, — приказал Нед селянам. Он никогда не доверял словам, произнесенным с колен. — Все встаньте.</p><p class="p1">Обитатели острога по одному, по двое начали подниматься на ноги. Одной древней старухе пришлось помочь, а молодая девушка в окровавленной одежде все стояла на коленях, глядя невидящими глазами на сира Ариса Скхарта, застывшего у подножия трона в белой броне гвардейца, готового защитить и оборонить короля. И королевскую десницу, усмехнувшись, подумал Нед.</p><p class="p1">— Джосс, — сир Реймен Дарри обратился к пухлому лысеющему человеку в фартуке пивовара, — расскажите деснице, что произошло в Шеррире.</p><p class="p1">Джосс кивнул:</p><p class="p1">— Если это угодно светлейшему…</p><p class="p1">— Светлейший государь охотится за Черноводной, — сказал Нед, удивляясь тому, что человек может провести всю свою жизнь в нескольких днях езды от Красного замка и не иметь представления о внешности короля. Нед был облачен в белый полотняный дублет с вышитым на груди лютоволком Старков. Черный шерстяной плащ скрепляла на горле серебряная застежка в форме руки. Черный, белый и серый — все краски истины. — Я лорд Эддард Старк, десница короля. Скажи мне, кто ты такой и что тебе известно об этих налетчиках.</p><p class="p1">— Я содержу… содержал… милорд, я содержал в Шеррире пивную возле Каменного моста. Лучшее пиво к югу от Перешейка, все говорили так, прошу прощения, милорд. Но теперь мое заведение погибло вместе со всем остальным, милорд. Они явились и сперва выпили все, что могли, а потом вылили остальное и подожгли мою пивную! И пролили бы мою кровь, если бы сумели поймать меня, милорд.</p><p class="p1">— Нас сожгли, — проговорил фермер, стоявший возле пивовара. — Они приехали ночью с юга, запалили поля и дома, убили тех, кто попытался остановить их. Это были не налетчики, милорд. Они не стали красть наше добро, мою молочную корову просто убили и оставили на съедение мухам и воронам.</p><p class="p1">— А моего ученика зарубили, — продолжил приземистый мужчина с мышцами кузнеца и перевязанной головой. Он явился ко двору в самом лучшем кафтане, но штаны его были залатаны, а дорога оставила на плаще пыль и пятна. — Гоняли его по полям, сидя на лошадях, и с хохотом тыкали в него копьями, словно в дичь. Мальчишка спотыкался и кричал, наконец рослый проткнул его пикой насквозь!</p><p class="p1">Девушка, оставшаяся на коленях, подняла голову к Неду, сидевшему над ней на высоком престоле:</p><p class="p1">— Они убили и мою мать, светлейший. Еще они… они… — Голос угас, словно бы она забыла приготовленные слова, девушка зарыдала.</p><p class="p1">Сир Реймен Дарри возобновил повествование:</p><p class="p1">— В Вендском городке жители укрылись в остроге за деревянными стенами. Налетчики обложили соломой дерево и сожгли всех живьем. Когда люди открыли ворота, чтобы бежать от огня, их перестреляли из луков, всех — даже женщин с грудными младенцами.</p><p class="p1">— Как ужасно, — пробормотал Варис. — На какие жестокости способны люди!</p><p class="p1">— То же самое сделали бы и с нами, но крепость Шеррира сложена из камня, — объяснил Джосс. — Они хотели нас выкурить, но рослый сказал, что вверх по течению есть более сочный плод, и они отправились к Кукольникову броду.</p><p class="p1">Склоняясь вперед, Нед ощутил холодное прикосновение стали к своим пальцам. Между ними торчали клинки; кривые острия мечей словно когти выступали из подлокотников престола. Миновало уже три столетия, однако о некоторые еще можно было обрезаться. Железный трон был полон ловушек для неосторожного. Песни утверждали, что на него пошла тысяча мечей, раскаленных добела яростным дыханием Балериона, Черного и Ужасного. Пятьдесят девять дней из острых лезвий, шипов и полос металла ковали седалище, способное убить человека и — если можно было верить легендам — пользовавшееся этой возможностью.</p><p class="p1">Эддард Старк не мог понять, что делает в этом зале, но все же сидел надо всеми, и люди ожидали от него справедливости.</p><p class="p1">— Какие есть доказательства тому, что все это совершили Ланнистеры? — спросил он, пытаясь удержать гнев под контролем. — Эти люди приехали в алых плащах или под львиным стягом?</p><p class="p1">— Даже Ланнистеры не способны на такую слепую тупость, — отрезал сир Марк Пайпер, пылкий молодой петушок, слишком уж молодой и слишком горячий, на взгляд Неда, однако преданный друг брата Кейтилин Эдмара Талли.</p><p class="p1">— Все налетчики были на конях и в броне, милорд, — отвечал невозмутимый сир Карил. — Со стальными пиками, длинными мечами и боевыми топорами для бойни. — Он показал в сторону одного из потрепанных беженцев. — Ты! Да, ты… никто не намеревается бить тебя. Расскажи деснице, что ты говорил мне.</p><p class="p1">Старик качнул головой.</p><p class="p1">— Я об их лошадях, — начал он, — это были боевые кони. Я много лет работал на конюшне у старого сира Виллема и знаю разницу. Этих животных никогда не впрягали в соху, и пусть боги будут свидетелями моих слов.</p><p class="p1">— Итак, разбойники приехали на хороших конях, — заметил Мизинец. — Что, если они украли коней в каком-нибудь из разоренных селений?</p><p class="p1">— А сколько людей было в этом отряде? — спросил Нед.</p><p class="p1">— По крайней мере сотня, — ответил Джосс, одновременно с ним перевязанный кузнец произнес «пятьдесят», к ним присоединилась стоявшая позади бабушка:</p><p class="p1">— Сотни, милорд, целая армия.</p><p class="p1">— Ты более чем права, добрая женщина, — сказал ей лорд Эддард. — Значит, вы говорите, что они не подняли знамен. Ну а что вы скажете об их панцирях? Вы заметили какие-нибудь украшения, девизы на щитах или шлемах?</p><p class="p1">Пивовар Джосс покачал головой:</p><p class="p1">— Увы, милорд, но мы видели лишь простую броню, разве что… разве что предводитель их, он был одет, как все остальные, но… все дело в его росте, милорд. Люди, которые говорят, что гиганты мертвы, никогда не видели этого человека. Клянусь, он ростом с быка, а от голоса камни лопаются!</p><p class="p1">— Гора! — громко проговорил сир Марк. — В этом не может быть сомнения. Итак, дело рук Григора Клигана…</p><p class="p1">Под окнами и в дальнем конце зала забормотали, даже на галерее послышались нервные шепотки. И знатному лорду, и простолюдину было точно известно, что означала бы правота сира Марка. Сир Григор Клиган являлся одним из знаменосцев лорда Тайвина Ланнистера.</p><p class="p1">Нед внимательно посмотрел на испуганные лица селян. Нечего удивляться, что они держались с такой опаской. Они ведь полагали, что их доставили сюда для того, чтобы назвать лорда Тайвина мясником и убийцей перед королем, его собственным зятем. Едва ли рыцари спрашивали их согласия. Великий мейстер Пицель внушительно поднялся над столом совета, позвякивая цепочкой.</p><p class="p1">— Сир Марк, при всем уважении к вам вынужден заметить: вы не можете утверждать, что этот разбойник являлся именно сиром Григором. Рослых людей в королевстве много.</p><p class="p1">— Это таких, как Скачущая Гора? — спросил сир Карил. — Я никогда не встречал подобных ему.</p><p class="p1">— Как и все здесь! — с жаром воскликнул сир Реймен. — Даже собственный брат рядом с ним щенок. Милорды, откройте ваши глаза. Разве вы не узнаете его руку по количеству трупов? Это Григор.</p><p class="p1">— Зачем же сиру Григору разбойничать? — спросил Пицель. — По милости своего сюзерена он держит крепкий замок, владеет собственными землями. Он прошел посвящение в рыцари.</p><p class="p1">— Он ложный рыцарь, — произнес сир Марк. — Безумный пес лорда Тайвина!</p><p class="p1">— Милорд десница, — объявил Пицель жестким голосом, — я требую, чтобы вы напомнили этому доброму рыцарю, что лорд Тайвин Ланнистер является отцом нашей милостивой королевы.</p><p class="p1">— Благодарю вас, великий мейстер Пицель, — произнес Нед. — Боюсь, что мы могли бы забыть об этом, если бы не ваше напоминание!</p><p class="p1">С высоты трона он видел людей, выскальзывающих из дверей в дальнем конце зала. Зайцы разбегаются по кустам, решил он… а может быть, и крысы спешат к сыру королевы. Заметив на галерее септу Мордейн и возле нее Сансу, он ощутил вспышку гнева: это не место для девушки. Но септа не могла заранее знать, что сегодняшний суд являет собой событие чрезвычайное, отличающееся от нудного потока прошений, споров между повздорившими соседями и разногласий относительно положения пограничных камней.</p><p class="p1">Внизу за столом совета Петир Бейлиш потерял интерес к своему перу и наклонился вперед:</p><p class="p1">— Сир Марк, сир Карил, сир Реймен… нельзя ли задать вам вопрос? Эти крепости находились под вашей защитой. Где вы находились, когда началось смертоубийство и пожары?</p><p class="p1">Сир Карил Венс поклонился:</p><p class="p1">— Я служил моему лорду-отцу в ущелье под Золотым Зубом, совместно с сиром Марком. Когда известие о погроме достигло сира Эдмара Талли, он приказал нам взять небольшой отряд, найти уцелевших и доставить их к королю.</p><p class="p1">Вперед выступил сир Реймен Дарри:</p><p class="p1">— Сир Эдмар призвал меня в Риверран со всей моей силой. Дожидаясь его приказа, я стоял за рекой, напротив стен замка, когда слово достигло меня. И когда я смог вернуться в свои собственные земли, Клиган и его мерзавцы уже переправились за Красный Зубец и ушли в холмы Ланнистера.</p><p class="p1">Мизинец задумчиво погладил остроконечную бородку.</p><p class="p1">— Ну а если они вернутся снова, сир?</p><p class="p1">— Если они придут снова, мы зальем их кровью сожженные ими поля, — с жаром ответил сир Марк Пайпер.</p><p class="p1">— Сир Эдмар выслал людей в каждый поселок или острог, что лежат в дне езды от рубежа, — объявил сир Карил. — Следующему налетчику придется труднее.</p><p class="p1">Именно этого и добивается лорд Тайвин, подумал про себя Нед. Ланнистер стремится по капле выпустить силу из Риверрана, заставить мальчишку расточить свои мечи. Брат его жены молод, не столь умен, как отважен. Он попытается удержать свою землю до последнего дюйма, защитить всякого — мужчину, женщину и ребенка, — кто зовет его лордом, а Тайвин Ланнистер достаточно проницателен, чтобы понимать это.</p><p class="p1">— Если ваши поля и крепости находятся в безопасности, — проговорил лорд Петир, — что же вы просите у трона?</p><p class="p1">— Лорды Трезубца поддерживают королевский мир, — произнес сир Реймен Дарри. — Ланнистеры нарушили его. Мы просим разрешения расплатиться с ними сталью за сталь. Мы требуем правосудия для простых людей Шеррира, Вендского городка и Кукольникова брода.</p><p class="p1">— Эдмар согласен с тем, что мы должны отплатить Григору Клигану его кровавой монетой, — объявил сир Марк. — Но старый лорд Хостер приказал нам явиться сюда и потребовать королевского разрешения на ответный удар.</p><p class="p1">Слава богам за совет старого лорда Хостера. Тайвин Ланнистер соединял в себе лиса и льва. Если он действительно послал сира Григора грабить и жечь, — а Нед в этом не сомневался, — то позаботился и о том, чтобы тот совершил свои злодеяния под покровом ночи и без знамен, как обычный разбойник. И если Риверран ответит ударом, Серсея и ее отец будут настаивать на том, что королевский мир нарушили Талли, а не Ланнистеры. Только боги знают, кому тогда поверит Роберт.</p><p class="p1">Великий мейстер Пицель вновь поднялся на ноги.</p><p class="p1">— Милорд десница, если эти добрые люди полагают, что сир Григор нарушил свои священные обеты ради грабежа и насилия, пусть они тогда отправятся к его сюзерену и принесут свои жалобы. Преступления эти не касаются престола. Пусть они обратятся к правосудию лорда Тайвина.</p><p class="p1">— В этой стране творится королевское правосудие, — ответил Нед, — на севере, юге, востоке и западе все, что мы делаем, совершается именем Роберта.</p><p class="p1">— Правосудием короля, — добавил великий мейстер Пицель. — Именно так, и поэтому мы должны оставить этот вопрос до возвращения светлейшего государя.</p><p class="p1">— Король охотится за рекой и скорее всего не вернется еще несколько дней, — проговорил лорд Эддард. — Роберт обязал меня занимать его место, слушать его ушами, отвечать его голосом. Так я и поступлю… Однако я согласен, королю следует сообщить об этом. — Нед заметил знакомое лицо возле гобеленов. — Сир Робар!</p><p class="p1">Сир Робар Ройс шагнул вперед и поклонился.</p><p class="p1">— Милорд!</p><p class="p1">— Ваш отец охотится с королем, — сказал Нед. — Можете ли вы доставить ему весть о том, что было сегодня сказано и сделано здесь?</p><p class="p1">— Немедленно, милорд.</p><p class="p1">— Значит ли это, что мы получили разрешение отомстить сиру Григору? — спросил Марк Пайпер, обращаясь к трону.</p><p class="p1">— Отомстить? — переспросил Нед. — Помнится, мы разговаривали о правосудии. Если вы сожжете поля Клигана и убьете его людей, королевский мир не восстановится, вы только принесете исцеление своей раненой гордости.</p><p class="p1">Он отвернулся, прежде чем молодой рыцарь успел произнести гневный протест, и обратился к селянам:</p><p class="p1">— Люди Шеррира, я не могу вернуть вам дома и урожай, как не могу и вернуть жизнь вашим убитым. Но тем не менее именем короля Роберта я вправе явить вам толику правосудия.</p><p class="p1">Все глаза в тронном зале смотрели на него, ожидая. Оторвав себя от трона напряжением рук, Нед медленно поднялся на ноги, раздробленная кость в лубке стонала от боли. Он постарался преодолеть боль; не время обнаруживать слабость.</p><p class="p1">— Первые Люди считали, что судья, назначивший смертный приговор, сам должен и исполнять его своим мечом; и на севере мы до сих пор придерживаемся этого правила. Не люблю заставлять других делать мое собственное дело… однако, похоже, у меня нет выхода. — Он указал на свою разбитую ногу.</p><p class="p1">— Лорд Эддард! — Голос донесся с западной стороны зала, вперед отважно шагнул совсем юный и стройный мальчишка. Без доспехов сир Лорас Тирелл казался даже моложе своих шестнадцати лет. Бледно-голубой шелк его одеяния перепоясывала цепь из золотых роз, знак его дома. — Окажите мне честь, разрешите заменить вас. Поручите мне это дело, милорд, и клянусь, я вас не подведу!</p><p class="p1">Мизинец хихикнул:</p><p class="p1">— Сир Лорас, если мы пошлем лишь вас одного, сир Григор пришлет назад только вашу голову, вставив сливу в ваш милый рот. Гора не из тех, кто склонит свою шею перед чьим-либо правосудием.</p><p class="p1">— Я не боюсь Григора Клигана, — надменно бросил сир Лорас.</p><p class="p1">Нед медленно опустился на жесткое железное сиденье уродливого трона Эйегона. Глаза его обежали лица, расположившиеся у стены.</p><p class="p1">— Лорд Берис, — позвал он. — Торос из Мира, сир Глэдден, лорд Лотар.</p><p class="p1">Поименованные мужи по одному шагнули вперед.</p><p class="p1">— Каждый из вас должен взять с собой по двадцать человек и доставить мое слово к крепости Григора. Вместе с вами направятся двадцать моих собственных гвардейцев. Лорд Берис Дондаррион, вы будете командовать, как подобает вашему чину.</p><p class="p1">Молодой золотоволосый лорд поклонился:</p><p class="p1">— Как вам угодно приказать, лорд Эддард!</p><p class="p1">Нед возвысил голос так, чтобы его услышали в дальнем конце тронного зала:</p><p class="p1">— Именем Роберта из дома Баратеона, первого носителя сего имени, короля андалов, ройнаров и Первых Людей, владыки Семи Королевств и хранителя государства, по слову Эддарда из дома Старков, королевской десницы, приказываю вам ехать на запад со всей поспешностью, под знаменем короля, пересечь Красный Зубец и явить королевское правосудие лживому рыцарю Григору Клигану и всем, кто соучаствовал в его преступлениях. Я обвиняю его и осуждаю; лишаю его всех чинов и титулов, всех земель, доходов и владений и приговариваю его к смерти. Пусть боги будут милосердны к душе его.</p><p class="p1">Когда голос десницы умолк, рыцарь Цветов в смущении спросил:</p><p class="p1">— Лорд Эддард, а что делать мне?</p><p class="p1">Нед посмотрел на него. Сверху лорд Тирелл казался почти таким же юным, как Робб.</p><p class="p1">— Никто не сомневается в вашей доблести, сир Лорас, но мы совершаем правосудие, а вы ищете мести. — Он поглядел на лорда Бериса. — Выезжайте с первым светом. Такие вещи следует делать быстро.</p><p class="p1">Нед поднял руку:</p><p class="p1">— Престол сегодня не желает выслушивать новые жалобы.</p><p class="p1">Элин и Портер поднялись по крутым железным ступеням, чтобы помочь ему. Спускаясь, Нед заметил угрюмый взгляд Лораса Тирелла, однако мальчишка ушел прежде, чем Нед оказался на полу тронного зала.</p><p class="p1">У подножия Железного трона Варис собирал бумаги со стола совета. Мизинец и великий мейстер Пицель уже откланялись.</p><p class="p1">— А вы куда более отважный человек, чем я, милорд, — проговорил евнух негромко.</p><p class="p1">— Как так, лорд Варис? — отрывисто спросил Нед. Нога пульсировала, и он не чувствовал охоты играть словами.</p><p class="p1">— На вашем месте я бы послал сира Лораса. Он так хотел это сделать… Кроме того, человек, враждующий с Ланнистерами, должен постараться сделать Тиреллов своими друзьями.</p><p class="p1">— Сир Лорас молод, — проговорил Нед. — Смею сказать, он переживет свое разочарование.</p><p class="p1">— Ну а сир Илин? — Евнух погладил пухлую припудренную щеку. — Он — именно он в конечном счете — выполняет королевское правосудие. Посылать других людей совершать его дело… Некоторые могут усмотреть в подобном поступке серьезное оскорбление!</p><p class="p1">— Я не намеревался обидеть его. — На деле Нед не доверял немому рыцарю, хотя, быть может, всего лишь потому, что не любил палачей. — Напомню вам, что Пейны — знаменосцы дома Ланнистеров. Я предпочел воспользоваться услугами людей, не присягавших лорду Тайвину.</p><p class="p1">— Очень предусмотрительно, вне сомнения, — проговорил Варис. — Тем не менее я случайно заметил в задней части зала сира Илина, и в его бледных глазах не было заметно особой радости, хотя трудно сказать что-то определенное о нашем молчаливом рыцаре. Надеюсь, он тоже переживет свое разочарование. Ведь сир Илин так любит свою работу…</p></span>
