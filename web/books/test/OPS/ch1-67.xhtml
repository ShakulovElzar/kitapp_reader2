<span id="id65"><div class="title2">
<p class="p">Дейенерис</p>
</div><p class="p1">Мухи облаком окружили кхала Дрого, их тонкий, едва слышный писк наполнял Дени ужасом.</p><p class="p1">Высокое солнце поднялось и безжалостно палило. Жар трепещущими волнами поднимался над каменистыми выступами невысоких холмов. Тонкая струйка пота неторопливо ползла между набухшими грудями Дени. Она слышала лишь ровную поступь копыт, ритмичное звяканье колокольчиков в волосах Дрого и далекие голоса за спиной.</p><p class="p1">Дени следила за мухами.</p><p class="p1">Они были здесь величиной с пчел, жирные, пурпурные, блестящие. Дотракийцы звали их кровавыми мухами. Насекомые эти жили в болотах и стоячих прудах, пили кровь и человека, и лошади, а яйца свои откладывали в умирающих. Дрого ненавидел их. Если какая-нибудь подлетала поближе, рука его выстреливала и с быстротой змеи смыкалась вокруг насекомого. Дени ни разу не видела, чтобы он промахнулся. Потом Дрого держал муху внутри своего огромного кулака и слушал ее отчаянное жужжание. Наконец пальцы сжимались, а когда он раскрывал кулак снова, от мухи оставалось лишь красное пятно на ладони.</p><p class="p1">Теперь одна из них ползла по крупу его жеребца, лошадь сердитым движением хвоста отогнала ее. Другие подлетали к Дрого все ближе и ближе. Кхал не реагировал. Глаза его были обращены к далеким бурым горам, поводья свободно лежали в руке. Под расписным жилетом пластырь из фиговых листьев и запекшейся синей глины укрывал рану на груди. Его сделала знахарка. Повязка Мирри Маз Дуур чесалась и жгла, и Дрого сорвал ее шесть дней назад, обругав лхазарянку мейегой. Глиняный пластырь не так раздражал; знахарка сделала ему макового вина. Все эти три дня Дрого налегал на дурманящие напитки, если не на маковое вино, то на перебродившее кобылье молоко или перечное пиво. Тем не менее он едва прикасался к еде, а по ночам стонал и метался.</p><p class="p1">Дени видела, как исхудало его лицо. Рейего не знал покоя в ее животе, он брыкался, как жеребец, но даже это не успокаивало Дрого. Каждое утро, пока он приходил в себя после тревожного сна, глаза ее обнаруживали на лице мужа новые следы боли. А теперь это молчание. Она боялась его. С тех пор как они сели в седло на рассвете, Дрого не сказал ни слова. На ее реплики он отвечал каким-то ворчанием, а после полудня не стало слышно даже такого ответа.</p><p class="p1">Одна из кровавых мух опустилась на голую кожу на плече кхала. Другая, кружа, прикоснулась к его шее и поползла ко рту. Кхал Дрого раскачивался в седле, колокольчики звенели, жеребец ровно шел вперед.</p><p class="p1">Дени ударила пятками свою Серебрянку, подъехала ближе.</p><p class="p1">— Мой господин, — сказала она. — Дрого, мое солнце и звезды!</p><p class="p1">Он как будто не слышал. Новая муха заползла под его вислый ус и перебралась на щеку — в складку возле носа.</p><p class="p1">Дени охнула:</p><p class="p1">— Дрого, — и неловкой рукой коснулась его плеча.</p><p class="p1">Кхал Дрого пошатнулся в седле, медленно накренился и тяжело рухнул с коня. Мухи взлетели на мгновение, затем закружили снова, чтобы усесться на лежащего.</p><p class="p1">— Нет, — проговорила Дени, останавливая коня. Не обращая внимания на живот, она слезла с коня и подбежала к кхалу. Трава под ним была бурой и сухой. Дрого вскрикнул от боли, когда Дени встала на колени возле него. Дыхание застревало в горле; не узнавая, он глядел на нее.</p><p class="p1">— Коня, — выдохнул он. Дени согнала мух с его груди и раздавила одну, как сделал бы он сам. Кожа кхала обожгла ее пальцы. Кровные следовали за ними. Она услыхала крик подъехавшего Хагго. Кохолло спрыгнул с коня.</p><p class="p1">— Кровь моей крови, — сказал он, падая на колени. Двое остальных оставались на конях.</p><p class="p1">— Нет, — застонал кхал Дрого, напрягаясь в руках Дени. — Надо ехать. Ехать. Нет.</p><p class="p1">— Он упал с коня, — сказал Хагго, поглядев вниз. Широкое лицо его было бесстрастным, но в голосе звучал свинец.</p><p class="p1">— Ты не должен говорить так, — сказала Дени. — Мы отъехали достаточно далеко. Мы остановимся здесь.</p><p class="p1">— Здесь? — Хагго огляделся. Земля вокруг казалась выгоревшей и негостеприимной. — Здесь не станешь.</p><p class="p1">— Женщина не приказывает остановиться, — сказал Квото. — Даже кхалиси не вправе этого делать.</p><p class="p1">— Мы остановимся здесь, — повторила Дени. — Хагго, скажи всем, что кхал Дрого велел остановиться. Если кто-нибудь спросит о причине, скажи, что мое время близко и я не могу продолжать путь. Кохолло, пришли рабов, пусть они немедленно поставят шатер кхала. Квото…</p><p class="p1">— Ты не приказываешь мне, кхалиси, — проговорил Квото.</p><p class="p1">— Отыщи Мирри Маз Дуур, — сказала она. Божья жена шла среди других ягнячьих людей, в длинной колонне рабов. — Приведи ее ко мне вместе с сундучком!</p><p class="p1">Квото яростно поглядел на нее, глазами жесткими как кремень.</p><p class="p1">— Мейега. — Он плюнул. — Этого я не сделаю.</p><p class="p1">— Ты сделаешь это, — сказала Дени. — Когда Дрого очнется, он захочет узнать, почему ты не послушался меня.</p><p class="p1">Разъяренный Квото развернул жеребца и отъехал… и Дени знала, что он вернется с Мирри Маз Дуур, нравится это ему или нет. Рабы поставили шатер кхала Дрого у зубастого выступа черной скалы, тень которого давала некоторое облегчение от полуденного солнца. Но и несмотря на это, под песчаным шелком было жарко, когда Ирри и Дореа помогли Дени внести Дрого внутрь. Землю прикрыли толстыми коврами и по углам разбросали подушки. Ероих, застенчивая девушка, которую Дени спасла возле сырцовых стен города ягнячьих людей, разожгла жаровню. Они положили Дрого на плетеные циновки.</p><p class="p1">— Нет, — пробормотал он на общем языке. — Нет, нет. — И ничего больше. У него уже не осталось сил, чтобы говорить.</p><p class="p1">Дореа расцепила его пояс из медальонов, сняла жилет и штаны, а Чхику склонилась у ног кхала, расплетая шнурки сандалий.</p><p class="p1">Ирри решила оставить тент открытым, чтобы впустить ветер, но Дени запретила ей. Она не хотела, чтобы кто-нибудь увидел Дрого в лихорадочном забытьи. Когда ее кхас собрался, она поставила их снаружи на стражу.</p><p class="p1">— Никого не пускайте без моего разрешения, — приказала она Чхого. — Никого.</p><p class="p1">Ероих с испугом поглядела на Дрого.</p><p class="p1">— Он умирает, — прошептала она.</p><p class="p1">Дени ударила ее.</p><p class="p1">— Кхал не может умереть. Он отец жеребца, который покроет весь мир! Волосы его ни разу не были острижены. Он до сих пор носит те колокольчики, которые подарил ему отец.</p><p class="p1">— Кхалиси, — проговорила Чхику, — он упал с коня.</p><p class="p1">Дрожа, с полными внезапных слез глазами, Дени отвернулась от них.</p><p class="p1">Он упал с коня! Это было так, она видела это, как и кровные всадники, служанки и люди ее кхаса. Сколько их было еще? Случившееся нельзя было сохранить в тайне, а Дени понимала, что это значит. Кхал, который не может ехать, не способен и править. А Дрого упал с коня.</p><p class="p1">— Мы должны выкупать его, — сказала она упрямо. Ей нельзя было отчаиваться. — Немедленно принесите ванну. Дореа и Ероих, найдите воды — холодной, у него жар. — Кожа кхала под ее рукой горела огнем.</p><p class="p1">Рабы поставили тяжелую медную ванну в уголке шатра. Когда Дореа принесла первый кувшин воды, Дени смочила длинный шелк, чтобы положить его на лоб Дрого, на его горящую кожу. Глаза кхала обратились к ней, но он ничего не видел. Когда его губы открылись, с них сошел только стон, но не слова.</p><p class="p1">— А где Мирри Маз Дуур? — вопросила она, страх уносил ее терпение.</p><p class="p1">— Квото найдет ее, — ответила Ирри.</p><p class="p1">Служанки наполнили ванну теплой, пахнувшей серой водой, усладили ее кувшинчиками горького масла и горстями листьев мяты.</p><p class="p1">Когда ванну приготовили, Дени неловко встала на колени возле своего благородного мужа, не обращая внимания на живот. Она расплела его косу пальцами, как было в ту ночь, когда он впервые взял ее под звездным небом. Колокольчики она отложила в сторону, один за одним. Они понадобятся Дрого, когда он поправится.</p><p class="p1">Дуновение воздуха вошло в шатер вместе с Агго, просунувшим голову сквозь щель в шелке.</p><p class="p1">— Кхалиси! — сказал он. — Пришел андал и просит разрешения войти.</p><p class="p1">Андал, так дотракийцы звали сира Джораха.</p><p class="p1">— Да, — сказала Дени поднимаясь. — Пусть войдет. — Она доверяла рыцарю. Если кто-то способен ей помочь, так только он.</p><p class="p1">Сир Джорах Мормонт нырнул под дверной полог и подождал мгновения, чтобы глаза его приспособились к полумраку. В великой заре юга он носил широкие штаны из пятнистого песчаного шелка и зашнурованные до колена ездовые сандалии с открытыми пальцами. Ножны его свисали с пояса, сплетенного из конского волоса. Выгоревший добела жилет прикрывал обнаженное тело, солнце окрасило кожу загаром.</p><p class="p1">— Изо рта в ухо по всему кхаласару говорят, — сказал он, — что кхал Дрого упал с коня.</p><p class="p1">— Помоги ему, — попросила Дени, — ради той любви, которую ты испытываешь ко мне, помоги ему теперь!</p><p class="p1">Рыцарь склонился возле Дрого. Он поглядел на него долгим и жестким взглядом, потом перевел взгляд на Дени.</p><p class="p1">— Отошли своих служанок.</p><p class="p1">Не говоря ни слова — горло ее перехватил страх, — Дени сделала жест. Ирри выгнала остальных девиц из шатра.</p><p class="p1">Когда они остались одни, сир Джорах извлек свой кинжал и с деликатностью, удивительной для столь рослого мужа, начал срезать черные листья и засохшую синюю глину с груди Дрого. Пластырь запекся, как земляные кирпичи людей-ягнят, и как их стены, он легко ломался. Сир Джорах разбил сухую глину ножом, сковырнул обломки с плоти и по одному снял листья. Гнусный сладкий запах поднялся от раны, едва ли не удушая. Листья были покрыты сукровицей и гноем. Загнившая грудь Дрого почернела и вздулась.</p><p class="p1">— Нет, — прошептала Дени, слезы бежали по ее щекам. — Нет, боги, нет, прошу вас, боги, услышьте меня, не надо.</p><p class="p1">Кхал Дрого дернулся, словно сопротивляясь какому-то невидимому врагу. Черная кровь медленно и обильно хлынула из его открытой раны.</p><p class="p1">— Считай своего кхала мертвым, принцесса.</p><p class="p1">— Нет, он не может умереть, он не должен, это был всего лишь порез. — Дени взяла его мозолистую руку в свои небольшие ладошки и сжала их. — Я не позволю ему умереть…</p><p class="p1">Сир Джорах с горечью усмехнулся:</p><p class="p1">— Кхалиси или королева, такие приказы за пределами твоей власти. Прибереги слезы, дитя. Оплачешь его завтра или через год. У нас нет времени для горя. Мы должны уехать отсюда быстро, пока он еще жив.</p><p class="p1">Дени растерялась.</p><p class="p1">— Уехать? Куда мы должны уехать?</p><p class="p1">— В Асшай. Он лежит далеко на юге, на краю известных морей, но люди говорят, что это огромный порт. И мы отыщем там корабль, который отвезет нас в Пентос. Нас ждет трудное путешествие, в этом можно не сомневаться. Веришь ли ты своему кхасу? Поедут ли с нами эти люди?</p><p class="p1">— Кхал Дрого приказал им охранять меня, — с уверенностью проговорила Дени. — Но если он умрет… — Она по привычке прикоснулась к своему круглому животу. — Я не понимаю, почему мы должны бежать? Я — кхалиси. Я ношу наследника Дрого. После Дрого он станет кхалом…</p><p class="p1">Сир Джорах нахмурился:</p><p class="p1">— Принцесса, выслушай меня. Дотракийцы не последуют за младенцем. Они склонялись перед силой Дрого и только перед ней. Когда его не станет, Чхако, Пого и все остальные начнут сражаться за его место, и кхаласар Дрого пожрет себя. Ну а победитель не захочет соперников. Мальчишку отнимут от твоей груди в тот самый момент, когда он родится. И отдадут псам…</p><p class="p1">Дени обхватила себя за плечи.</p><p class="p1">— Почему? — закричала она жалобным голосом. — Почему? Зачем им убивать младенца?</p><p class="p1">— Он — сын Дрого, и старухи сказали, что он станет жеребцом, который покроет весь мир. Так было предсказано, а значит, лучше убить дитя, чем столкнуться с его гневом, когда он сделается взрослым. — Ребенок взбрыкнул внутри ее, как будто услышав. Дени вспомнила повесть, которую рассказывал ей Визерис, о том, как псы узурпатора обошлись с детьми Рейегара. Сына его, еще младенца, оторвали от груди матери и ударили головой о стену. Так поступают мужчины.</p><p class="p1">— Они не должны убить моего сына! — вскричала она. — Я прикажу моему кхасу оберегать его, и кровные Дрого будут…</p><p class="p1">Сир Джорах схватил ее за плечи.</p><p class="p1">— Кровные умирают вместе со своим кхалом. Ты знаешь это, дитя. Они отвезут тебя в Вейес Дотрак к старухам, это последняя обязанность, которую они выполнят ради него… но закончив с этим делом, они присоединятся к Дрого в ночных землях.</p><p class="p1">Дени не хотелось возвращаться в Вейес Дотрак — доживать остаток своей жизни среди ужасных старух, — и все же она поняла, что рыцарь говорит правду. Дрого был больше чем ее солнцем и звездами. Он был щитом, который охранял ее жизнь.</p><p class="p1">— Я не оставлю его, — сказала она упрямым, полным горя голосом. Она снова взяла мужа за руку. — Не оставлю.</p><p class="p1">Движение в шатре заставило Дени повернуть голову. Мирри Маз Дуур вошла и низко поклонилась. Все эти дни она шла позади кхаласара и теперь прихрамывала и осунулась, ноги ее покрылись пузырями и кровоточили, под глазами залегли тени. За ней вошли Квото и Хагго, неся между собой сундук божьей жены. Когда кровные увидели рану Дрого, сундук выпал из пальцев Хагго на пол шатра, а Квото выругался так грязно, что буквально запачкал воздух.</p><p class="p1">Мирри Маз Дуур осмотрела Дрого с лицом спокойным и мертвым.</p><p class="p1">— Рана загнила.</p><p class="p1">— Твоя работа, мейега, — крикнул Квото. Хагго ударил кулаком по щеке Мирри, со смачным звуком повалив ее на землю. И пнул ее ногой.</p><p class="p1">— Прекрати, — отрезвила его Дени.</p><p class="p1">Квото отодвинул Хагго в сторону со словами:</p><p class="p1">— Пинки — слишком легкая казнь для этой мейеги. Выведи ее наружу. Мы поставим ее и привяжем к колышкам, так чтобы ее мог взять каждый прохожий. А потом пусть ею воспользуются псы. Хорьки вырвут ее внутренности, а падальщицы-вороны выклюют глаза. Мухи с реки отложат в ее чреве яйца, и их личинки будут пить гной из гнилых грудей.</p><p class="p1">Жесткими как железо пальцами он ухватил дряблую плоть божьей жены и поставил ее на ноги.</p><p class="p1">— Нет, — проговорила Дени, — я не хочу причинять ей вреда.</p><p class="p1">Губы Квото раздвинулись, открывая кривые коричневые зубы, в жуткой пародии на улыбку.</p><p class="p1">— Нет? Это ты говоришь мне — нет? Лучше молись, чтобы мы не поставили тебя рядом с твоей мейегой! Это сделала ты — не только она!</p><p class="p1">Сир Джорах шагнул между ними, доставая длинный меч из ножен.</p><p class="p1">— Придержи язык, кровный всадник. Принцесса пока еще твоя кхалиси.</p><p class="p1">— Лишь пока кровь моей крови живет, — отвечал Квото рыцарю. — Когда он умрет, она ничто.</p><p class="p1">Дени ощутила, как напряглось ее чрево.</p><p class="p1">— Прежде чем я стала кхалиси, я была от крови дракона. Сир Джорах, призови мой кхас!</p><p class="p1">— Нет, — отвечал Квото. — Мы уйдем… но потом вернемся, кхалиси. — Хагго, хмурясь, последовал за ним из шатра.</p><p class="p1">— Он не хочет тебе добра, принцесса, — сказал Мормонт. — Дотракийцы говорят, что человек и его кровные живут одной жизнью, и Квото видит ее конец. Мертвец не боится.</p><p class="p1">— Пока еще никто не умер, — сказала Дени. — Сир Джорах, мне потребуется ваш клинок. Лучше наденьте панцирь.</p><p class="p1">Она испугалась сильнее, чем смела признаться себе самой.</p><p class="p1">Рыцарь поклонился:</p><p class="p1">— Как вам угодно, — и направился из шатра. Дени повернулась к Мирри Маз Дуур. Та смотрела на нее настороженными глазами.</p><p class="p1">— Ты снова спасла мне жизнь.</p><p class="p1">— А теперь ты должна помочь мне, — сказала Дени. — Пожалуйста…</p><p class="p1">— Рабыню не просят, — резко отвечала Мирри, — ей приказывают. — Она подошла к Дрого, горевшему в жару на циновке, и внимательно поглядела на его рану. — Проси или приказывай, безразлично. Он уже неподвластен искусству целителя. — Глаза кхала были закрыты. Она открыла двумя пальцами один из них. — Он притуплял боль маковым молоком?</p><p class="p1">— Да, — проговорила Дени.</p><p class="p1">— Я сделала ему пластырь из огненного стручка и не-коли-меня и завернула в овечью шкуру.</p><p class="p1">— Он сказал, что пластырь жжет, и сорвал его. Знахарка сделала ему новый. Влажный и успокаивающий.</p><p class="p1">— Он жег, правильно. Огонь — великий исцелитель, это знают даже твои безволосые люди.</p><p class="p1">— Сделай ему другой компресс, — умоляла Дени. — На этот раз я пригляжу, чтобы он не сорвал его.</p><p class="p1">— Время для лечения прошло, моя госпожа, — проговорила Мирри. — Теперь я могу только облегчить ему спуск по темной дороге, чтобы он мог безболезненно сойти в ночные земли. Его не станет к утру.</p><p class="p1">Слова ее словно нож пронзили грудь Дени. Что она сделала, почему боги настолько жестоки к ней? Она наконец нашла безопасный уголок, наконец испытала любовь и надежду. Она уже повернула к дому. И все сгинуло…</p><p class="p1">— Нет, — умоляла она. — Спаси его, и я освобожу тебя, клянусь. Ты должна знать способ… какое-нибудь волшебство, что-то…</p><p class="p1">Мирри Маз Дуур опустилась на пятки и принялась изучать Дейенерис глазами черными словно ночь.</p><p class="p1">— Есть одно заклинание, — шепот ее был тих. — Но злое и черное, госпожа. Некоторые скажут, что смерть чище. Я научилась ему в Асшае и дорого заплатила за урок. Учил меня заклинатель крови из Края Теней.</p><p class="p1">Дени похолодела.</p><p class="p1">— Значит, ты в самом деле мейега?</p><p class="p1">— В самом деле! — Мирри Маз Дуур улыбнулась. — Только мейега может спасти твоего всадника, серебряная госпожа.</p><p class="p1">— Есть ли другой способ?</p><p class="p1">— Никакого.</p><p class="p1">Кхал Дрого, задрожав, охнул.</p><p class="p1">— Тогда делай, — выпалила Дени. Она не должна бояться, ведь она от крови дракона. — Спаси его!</p><p class="p1">— Но это дорого стоит, — предупредила ее божья жена.</p><p class="p1">— У тебя будет золото, кони; все что захочешь.</p><p class="p1">— Я говорю не о золоте или конях. Там, где заклинают кровь, госпожа, жизнь можно купить лишь смертью.</p><p class="p1">— Смертью? — Дени обняла себя, защищая, раскачиваясь взад и вперед на пятках. — Моей?</p><p class="p1">Она сказала себе, что умрет ради него, если придется. Она от крови дракона и ничего не боится. Ее брат Рейегар умер ради любимой.</p><p class="p1">— Нет, — обещала Мирри Маз Дуур. — Не твоей смертью, кхалиси.</p><p class="p1">Дени вздрогнула от облегчения.</p><p class="p1">— Тогда делай!</p><p class="p1">Мейега торжественно кивнула:</p><p class="p1">— Как ты говоришь, так и будет. Созови своих слуг.</p><p class="p1">Кхал Дрого слабо поежился, когда Ракхаро, Куаро и Агго опустили его в ванну.</p><p class="p1">— Нет, — пробормотал Дрого. — Нет, надо ехать. — Здесь, в воде, все силы наконец оставили его.</p><p class="p1">— Приведите его коня, — приказала Мирри Маз Дуур, и это было сделано. Чхого ввел в шатер огромного рыжего жеребца. Уловив запах смерти, конь заржал и попятился, закрывая глаза. Лишь втроем мужчины сумели удержать его.</p><p class="p1">— Что ты намереваешься делать? — спросила Дени.</p><p class="p1">— Нам нужна кровь, иначе ничего не сделаешь.</p><p class="p1">Чхого отступил назад с аракхом в руке. Молодой, еще шестнадцатилетний, тонкий как кнут, бесстрашный, быстрый как смех, с еле заметной тенью усов на верхней губе, он упал перед ней на колени.</p><p class="p1">— Кхалиси, — молил он, — ты не должна этого делать. Позволь мне убить эту мейегу.</p><p class="p1">— Убей ее, и ты убьешь своего кхала, — проговорила Дени.</p><p class="p1">— Она совершает волшебство над кровью, — сказал он, — это запрещено.</p><p class="p1">— А я, кхалиси, говорю тебе, что это не так: в Вейес Дотрак кхал Дрого убил жеребца, и я съела его сердце, чтобы сын наш приобрел отвагу и силу. Здесь то же самое.</p><p class="p1">Конь забился и попятился, когда Ракхаро и Агго потащили его к ванне, в которой словно покойник плавал кхал; гной и кровь сочились из его раны, загрязняя купальную воду. Мирри произнесла несколько слов на языке, которого Дени не знала, и в ее руке появился нож. Дени и не заметила, откуда он взялся. Нож показался ей старинным — из кованой красной бронзы, в форме листка. Клинок его покрывали древние иероглифы. Мейега провела им по горлу жеребца прямо под благородной головой: конь закричал и забился, кровь хлынула из него красным потоком. Он бы рухнул, но люди кхаса поддерживали его.</p><p class="p1">— Сила коня, перейди во всадника, — пела Мирри, проливая конскую кровь на кхала Дрого. — Сила животного, войди в человека.</p><p class="p1">Чхого боролся с весом коня, опасаясь прикоснуться к его мертвой плоти, опасаясь и выпустить ее. Это всего лишь конь, подумала Дени. Если жизнь Дрого можно выкупить смертью коня, такую плату она охотно внесет и тысячу раз.</p><p class="p1">Когда они позволили коню упасть, ванна наполнилась красной жидкостью, из которой выступало одно только лицо Дрого. Мирри Маз Дуур не нужно было конское мясо.</p><p class="p1">— Сожгите жеребца, — сказала Дени своим людям. Так было положено, она знала это. Когда умирал мужчина, коня его убивали и клали на похоронный костер, чтобы он унес хозяина в ночные земли. Люди ее кхаса поволокли конский труп из шатра. Кровь была всюду. Даже стены шатра были забрызганы красными каплями, а ковры почернели и хлюпали под ногами.</p><p class="p1">Зажгли жаровню. Мирри Маз Дуур бросила щепотку красного порошка на угли. Пряный дымок показался Дени приятным, но Ероих, взрыдав, бежала, и теперь даже ее собственное сердце наполнилось страхом. Однако она зашла слишком далеко и не могла отступать. Дени отослала служанок.</p><p class="p1">— Ступай вместе с ними, серебряная госпожа, — сказала ей Мирри Маз Дуур.</p><p class="p1">— Я останусь. Этот человек взял меня под звездами и дал жизнь моему ребенку. Я не оставлю его!</p><p class="p1">— Ты должна это сделать. Когда я запою, никто не должен входить в шатер. Моя песня пробудит древние и темные силы. Мертвецы будут плясать здесь сегодня ночью. Никто из живых не должен видеть их.</p><p class="p1">Дени беспомощно склонила голову. Никто не должен входить в шатер. Она согнулась над ванной, над Дрого, утопавшим в кровавой купели, и легко поцеловала его в чело.</p><p class="p1">— Верни его мне, — прошептала она Мирри Маз Дуур, прежде чем выбежать.</p><p class="p1">Снаружи солнце опустилось к самому горизонту, небо побагровело. Кхаласар разбивал стоянку. Шатры и спальные циновки виднелись повсюду, насколько мог видеть глаз. Дул жаркий ветер, Чхого и Агго рыли яму, чтобы сжечь мертвого жеребца. Собравшаяся толпа глядела на Дени жесткими черными глазами, лица дотракийцев напоминали ей маски из кованой меди. Сир Джорах Мормонт в панцире и коже проталкивался сквозь толпу, капельки пота усыпали его широкий лысеющий лоб.</p><p class="p1">Увидав алые отпечатки, которые оставили на земле сапоги, он побледнел как полотно.</p><p class="p1">— Что ты натворила, дурочка? — спросил сир Джорах хриплым голосом.</p><p class="p1">— Мне надо спасти его.</p><p class="p1">— Мы могли бы бежать, — сказал он. — Я бы доставил тебя в Асшай, принцесса. Не было необходимости…</p><p class="p1">— А я действительно твоя принцесса? — спросила она.</p><p class="p1">— Ты знаешь, что это так, боги да спасут нас обоих!</p><p class="p1">— Тогда помоги мне теперь.</p><p class="p1">Сир Джорах скривился.</p><p class="p1">— Если бы я знал как!</p><p class="p1">Голос Мирри Маз Дуур превратился в высокий дрожащий стон, от которого дрожь пробежала по спине Дени. Кое-кто из дотракийцев забормотал и начал пятиться. Шатер изнутри освещали жаровни. Позади забрызганного кровью песчаного шелка двигались тени.</p><p class="p1">Мирри Маз Дуур танцевала не одна…</p><p class="p1">Дени видела животный страх на лицах дотракийцев.</p><p class="p1">— Этого не должно быть, — прогрохотал Квото.</p><p class="p1">Она не видела, как кровник вернулся. Хагго и Кохолло были с ним. Они привели безволосых людей, евнухов, исцелявших иглой, ножом и иглой.</p><p class="p1">— Так будет, — проговорила Дени.</p><p class="p1">— Мейега, — проворчал Агго. И старый Кохолло — Кохолло, который связал свою жизнь с Дрого в день его рождения, Кохолло, всегда бывший с ней добрым, — плюнул ей прямо в лицо.</p><p class="p1">— Ты умрешь, мейега, — посулил Квото. — Но другая умрет первой!</p><p class="p1">Он извлек свой аракх и направился к шатру.</p><p class="p1">— Нет, — выкрикнула Дени. — Ты не должен этого делать!</p><p class="p1">Она поймала его за плечо, но Квото оттолкнул ее в сторону. Дени упала на колени, скрестив руки на животе, чтобы защитить дитя.</p><p class="p1">— Остановите его, — приказала она кхасу. — Убейте его.</p><p class="p1">Ракхаро и Куаро стояли возле полога шатра. Куаро шагнул вперед, потянувшись к рукояти кнута, но Квото повернулся изящным движением танцора; взлетевший аракх угодил Куаро прямо под руку, острая яркая сталь рассекла одежду, кожу, мышцы и ребра. Хлынула кровь, и молодой всадник, охнув, повалился назад.</p><p class="p1">Квото вырвал клинок.</p><p class="p1">— Табунщик, — окликнул его сир Джорах Мормонт. — Попробуй-ка меня. — Меч его выпрыгнул из ножен.</p><p class="p1">Квото обернулся ругаясь. Аракх метнулся так быстро, что кровь Куаро полетела с него тонкой пылью, как дождь под жарким ветром. Длинный меч перехватил его в футе от лица сира Джораха, аракх замер на мгновение, и Квото взвыл от ярости. Рыцарь был одет в кольчугу, на нем были стальные перчатки, поножи, тяжелый воротник защищал горло, однако он не подумал надеть шлем.</p><p class="p1">Квото, пританцовывая, отступал, аракх вился вокруг его головы сияющим кругом, молнией выскакивая из него. Сир Джорах как только мог отбивал удары, следовавшие настолько быстро, что Дени казалось, что он вот-вот пропустит аракх.</p><p class="p1">Изогнутый меч хрустнул о кольчугу, просыпались искры, когда кривой клинок соскользнул по перчатке. Вдруг оказалось, что Мормонт неловко отступает, а Квото продвигается вперед. Левая сторона лица рыцаря покраснела от крови, рана в бедре заставила его прихрамывать. Квото выкрикивал оскорбления, называл его трусом, молокососом и евнухом в железной рубахе.</p><p class="p1">— А теперь ты умрешь, — посулил он, и аракх вспорол красные сумерки. Сын отчаянно брыкнул в чреве Дени. Кривой клинок скользнул вдоль прямого и глубоко рассек бедро рыцаря там, где кольчуга раскрылась.</p><p class="p1">Мормонт охнул и пошатнулся. Дени ощутила острую боль в животе, влага хлынула на бедра. Квото победно вскрикнул, но аракх его наткнулся на кость и на мгновение остановился.</p><p class="p1">Этого было довольно. Сир Джорах обрушил на Квото свой меч, вложив в удар последние силы, прорезав плоть, мышцы и кость; и предплечье Квото повисло на тонкой полоске кожи и сухожилий. Следующий удар рыцаря пришелся в ухо дотракийца, и лицо Квото как будто бы взорвалось.</p><p class="p1">Дотракийцы кричали, Мирри Маз Дуур нечеловеческим голосом вопила в шатре, Куаро просил воды, умирая. Дени попросила помощи, но никто не слыхал ее. Ракхаро бился с Хагго, аракх плясал с аракхом, но наконец щелкнул кнут Чхого, обвиваясь вокруг горла Хагго. Движение — и кровный сделал шаг назад, оступившись и выронив меч. Взвыв, Ракхаро прыгнул вперед и, перехватив аракх обеими руками, обрушил удар на макушку головы Хагго… острие вышло между глазами, красное и дрожащее. Кто-то бросил камень, и обернувшись, Дени заметила на своем плече кровавую рану.</p><p class="p1">— Нет, — зарыдала она. — Нет, не надо. Цена слишком высока.</p><p class="p1">Опять полетели камни, она попыталась ползти к шатру, но Кохолло поймал ее. Запустив пальцы в волосы, он запрокинул назад голову Дени, и она ощутила горлом холодное прикосновение ножа.</p><p class="p1">— Мой ребенок, — завизжала она, и боги, наверное, услыхали ее, потому что Кохолло умер на месте. Стрела Агго вонзилась у него под рукой, пробив и сердце и легкие.</p><p class="p1">Когда наконец Дейенерис нашла в себе силы поднять голову, она увидела, что толпа рассеивается: дотракийцы безмолвно пробирались к своим шатрам и спальным циновкам. Некоторые уже седлали коней, отъезжая. Солнце село. Костры пылали по кхаласару, огромные оранжевые языки, яростно треща, выплевывали угольки к небу. Дени попыталась подняться, но боль охватила ее, стиснув, как кулак гиганта. Дыхание оставило ее, она сумела только охнуть. Голос Мирри Маз Дуур уже казался погребальным напевом. Внутри шатра кружили тени.</p><p class="p1">Твердая рука подняла ее и поставила на ноги. Лицо сира Джораха увлажнила кровь. Дени заметила, что половина уха его исчезла. Она дернулась в его руках, когда боль вновь овладела ею, и услышала, как рыцарь крикнул, чтобы служанки помогли ей. Почему они так испугались? Она знала ответ. Боль вновь пронзила ее, и Дени прикусила губу: похоже было, что сын пробивается наружу, ножами в обеих руках кромсая ее тело.</p><p class="p1">— Дореа, проклятая! — взревел сир Джорах. — Иди сюда. Приведи повивальных бабок.</p><p class="p1">— Они не придут, они сказали, что кхалиси проклята.</p><p class="p1">— Они придут, или я снесу им головы.</p><p class="p1">Дореа зарыдала.</p><p class="p1">— Они ушли, милорд.</p><p class="p1">— А мейега? — сказал кто-то. Кажется, Агго. — Отведите ее к мейеге.</p><p class="p1">«Нет, — хотела сказать Дени, — нет, только не это. Нельзя». Но когда она открыла рот, из него вырвался лишь долгий стон боли, и пот выступил на коже. Что случилось с ними, почему они ничего не видят? Внутри шатра плясали тени, они кружили вокруг жаровни и кровавой купели, вырисовываясь на песчаном шелке, и не все из них казались людьми; она заметила тень громадного волка, другая напоминала охваченного пламенем человека.</p><p class="p1">— Женщина из овечьего народа знает секреты родильного ложа, — сказала Ирри. — Так она говорила, и я слыхала ее.</p><p class="p1">— Да, — согласилась Дореа, — я тоже слыхала ее.</p><p class="p1">— Нет, — закричала Дени или, быть может, только хотела закричать, потому что ни звука, ни шепота не сошло с ее губ. Глаза ее обратились к небу, черному, мутному и беззвездному. — Прошу вас, не надо. — Голос Мирри Маз Дуур становился громче и наконец наполнил весь мир.</p><p class="p1">— Тени, — завизжала она. — Плясуны!</p><p class="p1">Сир Джорах внес Дени в шатер.</p></span>
