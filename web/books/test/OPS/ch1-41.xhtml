<span id="id39"><div class="title2">
<p class="p">Тирион</p>
</div><p class="p1">— Хочешь есть? — спросил Морд, окинув его злым взглядом. Короткопалая толстая рука держала блюдо отборных бобов.</p><p class="p1">Тирион Ланнистер успел наголодаться, но он не мог позволить, чтобы этот мужлан увидел его слабость.</p><p class="p1">— Неплохо бы ножку ягненка, — сказал он с груды грязной соломы в углу камеры. — Подойдет и блюдо горошка с жареным луком, и свежий хлеб, помазанный маслом… с пряным вином, чтобы лучше проскочило в желудок. Если вина нет, сгодится и пиво, попытаюсь быть не слишком разборчивым.</p><p class="p1">— Вот и бобы, — проговорил Морд, протягивая блюдо.</p><p class="p1">Тирион вздохнул. Тюремщик, служивший Лизе Аррен, представлял собой двадцать стоунов глупого жира, который дополняли бурые гнилые зубы и темные глазенки. Левую сторону его лица украшал шрам, оставленный топором, отрубившим ухо вместе с частью щеки. Он был столь же предсказуем, насколько и уродлив, но Тирион действительно испытывал голод. Он протянул руку к тарелке.</p><p class="p1">Морд отдернул ее ухмыляясь.</p><p class="p1">— Вот она, — проговорил он, ставя блюдо за пределами досягаемости Тириона.</p><p class="p1">Карлик неловко поднялся на ноги, испытывая боль в каждом суставе.</p><p class="p1">— Неужели каждый раз нужно устраивать из еды дурацкую игру? — Он потянулся к бобам.</p><p class="p1">Морд отодвинулся, ухмыляясь гнилыми зубами.</p><p class="p1">— Вот она, карлик. — Он выставил тарелку из камеры — туда, где она кончалась и начиналось небо. — Ты не хочешь есть? Иди-ка возьми.</p><p class="p1">Руки Тириона были слишком коротки, чтобы дотянуться до блюда, и он не намеревался так близко подходить к этому краю. Хватит одного лишь короткого движения белого толстого пуза Морда, и жизнь его завершится, оставив красное пятно на камнях Небесного замка, как случилось со многими пленниками Орлиного Гнезда за истекшие столетия.</p><p class="p1">— Если подумать, я вовсе не голоден, — объявил он, отступая в уголок камеры.</p><p class="p1">Морд заворчал и разжал пухлые пальцы. Ветер подхватил тарелку, перевернув ее. Тюремщик расхохотался, чрево его тряслось, как чаша с пудингом.</p><p class="p1">Тирион ощутил короткий укол ярости.</p><p class="p1">— Ах ты, трахнутый сын изъеденного язвами осла, — проговорил он. — Чтоб ты сдох от кровавого поноса!</p><p class="p1">За это на обратном пути Морд отпустил Тириону пинок подкованным сталью сапогом.</p><p class="p1">— Я это тебе запомню, — корчась на соломе, выдохнул Тирион.</p><p class="p1">— Я сам убью тебя, клянусь! — Тяжелая, окованная железом дверь захлопнулась. Тирион услышал звон ключей.</p><p class="p1">Для своего роста у меня слишком прожорливый рот и слишком болтливый, подумал карлик, отползая назад в угол сооружения, которое Аррены насмешливо именовали своей темницей. Тирион скрючился под тонким одеялом, кроме которого у него здесь ничего не было, разглядывая бездонное синее небо и далекие горы, уходившие, казалось, в бесконечность. Он пожалел о плаще из шкуры сумеречного кота, выигранном у Мариллона в кости после того, как певец стащил одеяние с тела убитого предводителя разбойников. Шкура пахла тленом и кровью, но была теплой и толстой. Морд сразу же отобрал ее.</p><p class="p1">Ветер теребил его одеяло порывами, острыми, словно когти. Камера была прискорбно мала даже для карлика. Там, где в любой настоящей тюрьме действительно была бы стена, пол кончался и начиналось небо, так что Тирион не испытывал недостатка в свежем воздухе, солнечном свете, в звездах и луне по ночам, но он охотно променял бы сейчас все это на самую мокрую и мрачную темницу в недрах Бобрового утеса.</p><p class="p1">— Ты улетишь отсюда, — посулил ему Морд, втолкнув в камеру. — Дней через двадцать или тридцать, а может, и пятьдесят, но все равно улетишь!</p><p class="p1">Аррены содержали лишь одну тюрьму и охотно предоставляли своим узникам возможность побега. В тот первый день, набравшись отваги, Тирион лег на живот и подполз к краю, чтобы поглядеть вниз. Отделенный воздушным простором, Небесный замок находился в шести сотнях футов под ним. Нагнув голову вправо и влево, он заметил другие камеры, сверху тоже. Прямо пчела в каменных сотах, только без крыльев!</p><p class="p1">В холодной камере ветер завывал и днем, но худшее заключалось в том, что пол был наклонным. Уклон был небольшим, но и его было достаточно. Тирион боялся закрыть глаза, чтобы не скатиться во сне и не проснуться во внезапном ужасе у края обрыва. Нечего удивляться тому, что эти небесные камеры доводили людей до безумия.</p><p class="p1">Синева зовет. «Боги, помилуйте меня», — написал на стене один из прежних обитателей камеры веществом, похожим на кровь. Вначале Тирион даже заинтересовался, кто это мог быть, что с ним стало, но потом решил, что лучше все-таки этого не знать.</p><p class="p1">А надо было только закрыть свой рот…</p><p class="p1">Все началось с несчастного мальчишки, глядевшего на него с трона из резного чардрева, под украшенными луной и соколом знаменами Аррена. На Тириона Ланнистера всякий смотрел сверху вниз, но этот шестилетний сопляк, моргнув красными глазами, спросил с пухлой подушки, которую ему подкладывали, чтобы сделать повыше.</p><p class="p1">— А он плохой?</p><p class="p1">— Плохой, — согласилась леди Лиза, занимавшая рядом престол пониже. Она была вся в голубом, напудрена и надушена — ради женихов, наполнявших двор.</p><p class="p1">— Он такой маленький, — хихикнул лорд Орлиного Гнезда.</p><p class="p1">— Это Тирион-Бес из дома Ланнистеров, убийца твоего отца. — Она возвысила голос, чтобы слова ее были слышны в конце чертога Орлиного Гнезда. Отражаясь от молочно-белых стен и тонких колонн, звук доносился до слуха каждого человека. — Он убил десницу нашего короля.</p><p class="p1">— Значит, я убил и его? — подобно глупцу спросил Тирион.</p><p class="p1">В такой миг подобало держать рот на замке, а голову склоненной. Теперь он понимал это; седьмое пекло, он знал это даже тогда. Высокий чертог Арренов был длинным и строгим, стены его, облицованные белым с синими прожилками мрамором, обжигали холодом, но окружающие его лица были еще холоднее. Сила Бобрового утеса была далеко, и в долине Арренов Ланнистеры друзей не имели. Покорность и молчание послужили бы ему лучшей защитой.</p><p class="p1">Но Тирион находился не в том настроении, чтобы проявлять рассудительность. К стыду своему, он сдался на последнем отрезке подъема, короткие ноги не могли поднять его дальше в Орлиное Гнездо. Бронн пронес карлика остаток пути, и унижение лишь подливало масла в огонь его ярости.</p><p class="p1">— Итак, мне пришлось основательно потрудиться, — проговорил он с горьким сарказмом. — Интересно, когда я нашел время на все эти убийства?</p><p class="p1">Ему следовало бы помнить, с кем он имеет дело. Лиза Аррен и ее задохлик и при дворе не обнаруживали симпатии к шутке, в особенности когда она была направлена против них.</p><p class="p1">— Бес, — холодно бросила Лиза, — постарайся следить за своим колким языком и разговаривай с моим сыном вежливо, иначе у тебя появится причина сожалеть об этом. Помни, где ты находишься. Это Орлиное Гнездо, тебя окружают верные рыцари Долины, люди, которые любили Джона Аррена. Любой из них охотно умрет за меня.</p><p class="p1">— Леди Аррен, если со мной что-нибудь случится, мой брат Джейме постарается, чтобы именно так и произошло. — Выплюнув эти слова, Тирион понял, насколько они безумны.</p><p class="p1">— А умеете ли вы летать, милорд Ланнистер? — спросила леди Лиза. — Неужели у карликов есть крылья? Если нет, я попросила бы проглотить следующую угрозу раньше, чем она придет в голову.</p><p class="p1">— Я не угрожаю, — отвечал Тирион, — а даю обещание.</p><p class="p1">Маленький лорд Роберт вскочил на ноги в таком беспокойстве, что даже выронил куклу.</p><p class="p1">— Ты не можешь сделать нам больно! — завопил он. — Никто не может здесь сделать нам больно! Мама, скажи ему, что он не сможет сделать нам больно! — Мальчишка начал дергаться.</p><p class="p1">— Орлиное Гнездо неприступно, — спокойным голосом проговорила Лиза Аррен. Она прижала к себе сына, окружив его оградой полных белых рук. — Этот Бес просто пытается испугать нас, милое дитя. Все Ланнистеры лжецы. Никто не причинит тебе зла, мой милый мальчик!</p><p class="p1">Черт побери, она была и в самом деле права. Испытав дорожные трудности, Тирион прекрасно представлял себе, каково придется рыцарям, с боем поднимающимся по лестнице: камни и стрелы будут сыпаться на них с неба, и враги будут защищать каждую ступеньку. Возможностей слова «кошмар» тут явно не хватало. Нечего удивляться тому, что Орлиное Гнездо так ни разу и не было взято врагом.</p><p class="p1">Но Тирион опять не сумел промолчать.</p><p class="p1">— Не то чтобы неприступно, — сказал он, — а просто неудобно лезть наверх…</p><p class="p1">Молодой Роберт показал вниз дрожащей рукой.</p><p class="p1">— Ты лжец. Мама, я хочу видеть, как он летает.</p><p class="p1">Стражи в небесно-синих плащах схватили Тириона за руки и оторвали от пола.</p><p class="p1">Одни боги знают, что бы случилось тогда, если бы не Кейтилин Старк.</p><p class="p1">— Сестра, — проговорила она со своего места за троном, — прошу тебя, вспомни: этот человек — мой пленник, и я не хочу ему вреда.</p><p class="p1">Лиза Аррен бросила на сестру холодный взгляд, потом поднялась и, шелестя длинными юбками, кинулась к Тириону. Ему даже показалось, что она ударит его, но Лиза приказала выпустить Тириона. Когда карлика поставили на пол, ноги ему отказали и Тирион упал.</p><p class="p1">Понимая, что он представляет собой, Тирион с трудом стал на колени лишь для того, чтобы, ощутив спазмы в ногах, вновь повалиться на пол. Хохот загулял по высокому чертогу Арренов.</p><p class="p1">— Маленький гость моей сестры слишком устал, чтобы стоять, — объявила леди Лиза. — Сир Вардис, проводите его вниз в тюрьму. Одна из наших небесных камер поможет ему опомниться.</p><p class="p1">Стражники вздернули его на ноги. Тирион Ланнистер болтался среди них, слабо брыкаясь, побагровев от стыда.</p><p class="p1">— Я вам это припомню, — пообещал он, когда его понесли прочь. Ничего другого Тириону и не оставалось.</p><p class="p1">Сначала он утешал себя тем, что заточение продлится недолго: Лиза Аррен просто решила унизить его, вот и все. Она скоро пришлет за ним. Если же нет, тогда Кейтилин Старк наверняка захочет допросить его. Но на этот раз он будет следить за своим языком. Они не посмеют убить его: он все-таки оставался Ланнистером с Бобрового утеса, и, пролив его кровь, сестры накличут на себя войну. Так, во всяком случае, он убеждал себя самого.</p><p class="p1">Но теперь он более не был в этом уверен.</p><p class="p1">Быть может, похитители решили сгноить его здесь; однако Тирион опасался, что сил у него может не хватить на долгое гниение. Он слабел с каждым днем, и потом Морд рано или поздно должен был сделать свое дело, если только тюремщик до этого не успеет заморить его насмерть голодом. Еще несколько голодных ночей, и синева начнет призывать к себе и его.</p><p class="p1">Он попытался представить себе, что происходит за стенами его, так сказать, камеры. Получив известие, лорд Тайвин, безусловно, послал погоню. Джейме, возможно, уже ведет войско через Лунные горы, если только не едет на север в Винтерфелл. Подозревает ли кто-нибудь за пределами Долины, куда именно Кейтилин Старк отвезла его? Он подумал о том, что предпримет Серсея, когда услышит о его похищении. Король может приказать освободить его, но кого послушает Роберт — свою королеву или десницу? Тирион не испытывал иллюзий относительно любви короля к его сестре.</p><p class="p1">Если у Серсеи хватит ума, она настоит на том, чтобы король сам решил участь Тириона. Даже Нед Старк не смог бы возразить против этого, не запятнав чести короля. Тирион будет только рад: в каких бы убийствах его ни обвиняли, пока у Старков не было никаких доказательств. Пускай себе излагают свое дело перед Железным троном и лордами королевства. Это погубит их. Если бы у Серсеи хватило ума понять это…</p><p class="p1">Тирион Ланнистер вздохнул. Сестра его была не лишена определенной низменной хитрости, но гордость ослепляла ее. Она увидит в ситуации оскорбление и предоставившуюся возможность убрать врагов. Джейме был еще хуже. Опрометчивый, упрямый и раздражительный, он никогда не развязывал узел, если его можно было разрубить ударом меча.</p><p class="p1">Тирион попытался представить, кто из них нанял убийцу, чтобы заставить замолчать мальчишку Старков, и действительно ли они ускорили смерть лорда Аррена. Если старый десница действительно убит, то это было подстроено искусно и гладко. Люди его возраста во все времена умирали от внезапных болезней. Напротив, олух, явившийся с краденым ножом к Брандону Старку, вел себя невероятно неловко. И разве не было это странно, если хорошенько подумать?</p><p class="p1">Тирион поежился, ощутив действительно жуткое подозрение: что, если в лесу сражаются не только лютоволк и лев, но кто-то третий воспользовался их схваткой как прикрытием? Тирион Ланнистер не любил, чтобы им пользовались…</p><p class="p1">Следовало выбираться отсюда и поскорее. Шансов справиться с Мордом практически не существовало, и никто не намеревался передать ему шестисотфутовую веревку, чтобы он мог бежать на свободу. Язык завел его в эту камеру, язык должен и вывести.</p><p class="p1">Тирион поднялся на ноги, стараясь по возможности игнорировать уклон, вечно толкавший к краю, и застучал кулаком в дверь.</p><p class="p1">— Морд! — завопил он. — Тюремщик! Морд, ты мне нужен!</p><p class="p1">Тириону пришлось барабанить минут десять, прежде чем он услышал шаги. Карлик отступил назад, и дверь со скрипом открылась.</p><p class="p1">— Шумишь, — пробурчал Морд, глаза которого налились кровью, в одной из его ладоней была зажата широкая кожаная полоска, огибавшая кулак.</p><p class="p1">Никогда не показывай испуг, напомнил себе Тирион и спросил:</p><p class="p1">— А ты не хочешь разбогатеть?</p><p class="p1">Морд ударил его ленивым движением. Тирион пошатнулся и стиснул зубы от боли.</p><p class="p1">— Не болтать, карлик, — предупредил Морд.</p><p class="p1">— Золото, — проговорил Тирион, изображая улыбку. — Бобровый утес полон золота… аххх. — На этот раз Морд ударил сильнее, полоска щелкнула. Удар пришелся Тириону в ребра, он рухнул на колени, скуля от боли. А потом заставил себя поглядеть на тюремщика. — Богат, как Ланнистер, — выпалил он. — Так говорят люди, Морд…</p><p class="p1">Морд заурчал. Свистнув в воздухе, ремень ударил Тириона по лицу. Боль на мгновение лишила карлика сознания, он даже не помнил, как упал, но, открыв глаза, обнаружил, что лежит на полу камеры. В ухе звенело, а во рту было полно крови; он потянулся за опорой, чтобы подняться, но пальцы прикоснулись… к пустоте. Тирион отвел руку назад так быстро, как будто обжегся, и попытался не дышать. Он лежал на самом краю — в нескольких дюймах от синевы.</p><p class="p1">— Хочешь еще что-нибудь сказать? — Морд взял ремень в обе руки и резко потянул его. Щелчок заставил Тириона подпрыгнуть. Тюремщик расхохотался.</p><p class="p1">«Он не сбросил меня, — в отчаянии сказал себе Тирион, отползая от края. — Я нужен Кейтилин Старк живым, и он не посмеет убить меня». Тыльной стороной ладони он отер кровь с губ, ухмыльнулся и сказал:</p><p class="p1">— Ну это, пожалуй, грубовато, Морд. — Тюремщик скосился, пытаясь понять, не смеются ли над ним. — Мне нужны такие сильные люди, как ты. — Ремень вновь взвился, но на этот раз Тирион сумел отодвинуться прочь. Удар скользнул по плечу, не причинив боли. — Золото, — повторил он, крабом отползая назад. — Больше золота, чем ты видел в своей жизни. Достаточно, чтобы купить земли, женщин, лошадей и… чтобы сделаться лордом. Представь себе — лорд Морд. — Тирион отхаркнул комок крови и мокроты, сплюнул его в небо.</p><p class="p1">— Никакого золота, — отвечал Морд.</p><p class="p1">Значит, услышал, подумал Тирион.</p><p class="p1">— Меня избавили от кошелька, когда взяли в плен, но золото по-прежнему принадлежит мне. Кейтилин Старк может заключить меня в темницу, но она не станет грабить своего пленника. Это бесчестно. Помоги мне, и все золото будет твоим.</p><p class="p1">Морд вновь замахнулся, но на сей раз удар вышел не столь решительным — Тирион перехватил ремень рукой и удержал его.</p><p class="p1">— Ты ничем не рискуешь — тебе нужно только передать весть.</p><p class="p1">Тюремщик вырвал кожаную полоску из рук Тириона.</p><p class="p1">— Весть, — проговорил он, словно бы никогда не слышал этого слова. Морд нахмурился, на лбу его залегли морщины.</p><p class="p1">— Вы слышали меня, милорд? Лишь передайте мое слово вашей госпоже. Скажите ей… — Что может заставить Лизу Аррен передумать? Вдохновение немедленно явилось к Тириону Ланнистеру. — Скажите ей, что я хочу признаться в своих преступлениях.</p><p class="p1">Морд занес руку, и Тирион съежился, ожидая нового удара, но тюремщик медлил. Подозрительность и жадность ссорились в его глазах. Золота он хотел, но подвоха опасался. Его, похоже, часто обманывали.</p><p class="p1">— Лжешь, карлик. Ты хочешь обмануть меня! — мрачно буркнул он.</p><p class="p1">— Могу дать письменное обязательство, — пообещал Тирион. Неграмотные иногда относились к письму с презрением, другие, напротив, испытывали суеверное почтение к написанному слову, как будто оно представляло какое-нибудь волшебство. К счастью, тюремщик принадлежал к последним. Морд опустил ремень.</p><p class="p1">— Напиши про золото. Про много золота…</p><p class="p1">— О, будет много золота, — заверил его Тирион. — Кошелек только для начала, друг мой. Мой брат носит панцирь из литого золота. — На деле панцирь Джейме был сделан из позолоченной стали, но эти олухи никогда не поймут разницы…</p><p class="p1">Морд задумчиво теребил ремень, но в конце концов сдался и отправился за бумагой и чернилами. Когда письмо было написано, тюремщик подозрительно нахмурился, глядя на бумагу.</p><p class="p1">— А теперь передай мою весть, — приказал Тирион.</p><p class="p1">Он ежился в полусне, когда за ним пришли поздно ночью. Морд открыл дверь, сохраняя молчание. Сир Вардис Иген разбудил Тириона носком сапога.</p><p class="p1">— На ноги, Бес. Миледи хочет видеть тебя.</p><p class="p1">Тирион попытался протереть глаза и кривился с деланным недовольством.</p><p class="p1">— Она-то, вне сомнения, хочет, но что заставляет вас считать, что я хочу видеть ее?</p><p class="p1">Сир Вардис нахмурился. Тирион помнил его по годам, которые он провел в Королевской Гавани в качестве начальника домашней дружины десницы. Серебряные волосы, квадратное лицо, крупные черты и полное отсутствие улыбки.</p><p class="p1">— Твое желание меня не касается. На ноги, или я прикажу нести тебя.</p><p class="p1">Тирион неловко поднялся на ноги.</p><p class="p1">— Холодная ночь, — сказал он небрежно, — а в чертоге, наверное, еще холоднее. Я не хочу простудиться. Морд, будь другом, принеси мой плащ.</p><p class="p1">Тюремщик скривился, на лице его проступило подозрение.</p><p class="p1">— Мой плащ, — проговорил Тирион. — Шкуру сумеречного кота, которую ты взял от меня на хранение. Помнишь?</p><p class="p1">— Принеси ему проклятый плащ, — приказал сир Вардис.</p><p class="p1">Морд не осмелился возражать. Отвесив Тириону взгляд, сулящий расплату, он отправился за плащом. Завязывая шкуру на шее, Тирион улыбнулся:</p><p class="p1">— Благодарю. Я буду вспоминать тебя всякий раз, когда стану надевать его. — Перебросив край чересчур длинного меха через правое плечо, он впервые за последние дни почувствовал себя согревшимся. — Ведите меня, сир Вардис.</p><p class="p1">Большой зал дома Арренов был освещен пятьюдесятью факелами, горящими на стенах. Леди Аррен сидела на троне в черном шелковом платье с луной и соколом, вышитыми жемчужинами на груди. Поскольку Лиза явно не собиралась в Ночной Дозор, Тирион решил, что она сочла траурное одеяние самым подходящим, чтобы слушать его признания. Длинные, как солома, волосы, заплетенные в сложную косу, опускались на ее левое плечо. Высокий трон возле нее пустовал, маленький лорд Орлиного Гнезда, конечно же, спал и трясся во сне. Тирион был в высшей мере благодарен за это судьбе.</p><p class="p1">Ланнистер глубоко поклонился и оглядел зал. Как он и надеялся, леди Аррен созвала своих рыцарей и свиту, чтобы они выслушали его признание. Он увидел морщинистое лицо сира Бриндена Талли и пухлую физиономию лорда Нестора Ройса. Возле Нестора находился человек помоложе, с пышными черными бакенбардами, который мог быть лишь его наследником, сиром Альбаром. Представлены были почти все основные дома Долины. Тирион заметил сира Лина Корбрея, старого лорда Хантера на подагрических ногах, вдовевшую леди Уэйнвуд в окружении сыновей. Других гербов Тирион не знал: сломанное копье, зеленая гадюка, горящая башня, крылатая чаша…</p><p class="p1">Среди лордов Долины оказалось несколько его знакомых по высокогорной дороге. Бледный от полузаживших ран сир Родрик Кассель стоял возле сира Уиллиса Воде. Мариллон-певец успел найти себе новую деревянную арфу. Тирион улыбнулся; что бы ни случилось сегодня, важно, чтобы события не остались в тайне, ну а певец разнесет повесть по всем Семи Королевствам.</p><p class="p1">В дальнем углу зала у колонны устроился Бронн. Черные глаза вольного всадника были обращены к Тириону, рука его непринужденно лежала на рукояти меча. Тирион поглядел на него и задумался…</p><p class="p1">Кейтилин Старк заговорила первой:</p><p class="p1">— Нам сказали, что ты хочешь признаться в своих преступлениях!</p><p class="p1">— Именно так, миледи, — ответил Тирион.</p><p class="p1">Лиза Аррен улыбнулась сестре:</p><p class="p1">— Небесная камера сломает любого. В ней злодея видят боги, там нет тьмы, где он мог бы укрываться от их глаз.</p><p class="p1">— Он не кажется мне сломленным, — заметила леди Кейтилин.</p><p class="p1">Леди Лиза не обратила внимания.</p><p class="p1">— Говори, — приказала она Тириону.</p><p class="p1">А теперь пора бросить кости, подумал он, торопливо глянув на Бронна. С чего же начать?</p><p class="p1">— Признаюсь, я очень злой карлик. Грехи мои и преступления несчетны, милорды и леди. Я спал со шлюхами — и не однажды, а сотни раз. Я желал смерти моему лорду-отцу и моей сестре, нашей доброй королеве. — Позади него кто-то хихикнул. — Я не всегда обращался со слугами с добротой. Я играл в кости и плутовал при этом, признаюсь со стыдом. Я говорил много жестоких и злобных вещей о благородных лордах и дамах двора. — Послышался хохот. — Однажды я…</p><p class="p1">— Молчать! — Бледное лицо Лизы Аррен порозовело. — И что же ты сейчас делаешь, карлик?</p><p class="p1">Тирион свесил голову на плечо.</p><p class="p1">— Как что? Исповедуюсь в своих преступлениях, миледи.</p><p class="p1">Кейтилин Старк шагнула вперед.</p><p class="p1">— Вас обвиняют в том, что вы подослали наемного убийцу, чтобы убить моего сына Брана в постели, и соучаствовали в убийстве лорда Джона Аррена, десницы короля.</p><p class="p1">Тирион беспомощно пожал плечами:</p><p class="p1">— А вот в этих преступлениях, увы, я признаться не могу. Я ничего не знаю об этих убийствах.</p><p class="p1">Леди Лиза поднялась со своего деревянного престола.</p><p class="p1">— Я не намереваюсь подвергаться твоим насмешкам. Ты устроил себе развлечение и, вне сомнения, насладился им. Сир Вардис, отведите его назад в темницу… Но на этот раз пусть камера будет меньше и с более крутым полом.</p><p class="p1">— Неужели так творится правосудие в Долине? — вскричал Тирион так громко, что сир Вардис застыл на мгновение. — Неужели честь не может проехать под Кровавыми воротами? Вы обвиняете меня в преступлениях, я отрицаю свою вину, и поэтому меня бросают в открытую камеру на холод и голод. — Он приподнял голову, показывая всем синяки, которые Морд оставил на его лице. — Где правосудие короля? Разве Орлиное Гнездо не часть Семи Королевств? Вы обвиняете меня. Очень хорошо. Я требую суда! Позвольте мне говорить, и пусть моя правда или ложь будут открыты перед лицом богов и людей!</p><p class="p1">Негромкий ропот наполнил высокий зал. В самую точку, подумал Тирион. Ему, знатному господину, сыну самого могущественного лорда страны, брату королевы, нельзя было отказать в правосудии. Гвардейцы в небесно-синих плащах направились в сторону Тириона, но сир Вардис велел им остановиться и поглядел на леди Лизу.</p><p class="p1">Ее маленький рот дернулся в воинственной усмешке.</p><p class="p1">— Если ты будешь допрошен и обнаружен виновным в тех преступлениях, в которых тебя обвиняют, тогда, по собственным законам короля, ты должен будешь заплатить своей жизнью. У нас в Орлином Гнезде нет палача. Откройте Лунную дверь.</p><p class="p1">Толпа зрителей расступилась, открыв узкую дверь из чардрева между двумя мраморными колоннами, на белом дереве которой был вырезан полумесяц. Стоявшие рядом отступили, когда пара гвардейцев направилась к ней. Один из мужчин отодвинул тяжелый бронзовый запор, второй навалился на дверь. Синие плащи взметнулись с плеч, подхваченные внезапным порывом ветра, с воем ворвавшегося через открывшийся проем. За дверью зияла пустота ночного неба, усеянного холодными безразличными звездами.</p><p class="p1">— Вот оно, королевское правосудие, — проговорила Лиза Аррен. Пламя факелов заметалось по стенам, языки их гасли то тут, то там.</p><p class="p1">— Лиза, по-моему, это неразумно, — проговорила Кейтилин Старк, пока черный ветер кружил по залу.</p><p class="p1">Сестра не обращала на нее внимания.</p><p class="p1">— Вы хотите суда, милорд Ланнистер? Очень хорошо, суд будет. Сын мой выслушает твои слова, и ты услышишь его приговор. Потом ты выйдешь отсюда… Этой дверью или другой…</p><p class="p1">Она довольна собой, подумал Тирион, тут нечему удивляться. Чем мог угрожать ей суд, когда приговор будет выносить ее слабак сын? Тирион поглядел на Лунную дверь. «Мама, я хочу видеть, как он полетит!» — сказал мальчишка. Скольких же человек этот курносый дурачок уже велел выкинуть через эту дверь?</p><p class="p1">— Благодарю вас, моя добрая леди, но я не вижу нужды беспокоить лорда Роберта, — вежливо сказал Тирион. — Боги знают, что я не виновен. Я приму их суждение, а не суд человека. Я требую суда поединком.</p><p class="p1">Буря внезапного хохота наполнила высокий зал Арренов. Лорд Нестор Ройс фыркнул, сир Уиллис хихикнул, сир Лин Корбрей хохотнул, остальные откинули назад головы и загоготали; слезы побежали по их лицам. Мариллон неловко перебирал лады, едва касаясь своей новой деревянной арфы кончиками пальцев сломанной руки. Даже ветер как будто завыл с возмущением, врываясь через Лунную дверь.</p><p class="p1">Водянистые глаза Лизы Аррен стали неуверенными. Он вывел ее из равновесия.</p><p class="p1">— Конечно, у тебя есть на это право.</p><p class="p1">Молодой рыцарь с зеленой гадюкой, вышитой на плаще, шагнул вперед и опустился на колено.</p><p class="p1">— Миледи, умоляю о чести защитить ваше дело.</p><p class="p1">— Эта честь должна принадлежать мне, — сказал старый лорд Хантер. — Ради той любви, которую я испытываю к вашему лорду-мужу, позвольте мне отомстить за его смерть.</p><p class="p1">— Мой отец верно служил лорду Джону управляющим Долины, — буркнул сир Альбар Ройс. — Позвольте мне услужить его сыну.</p><p class="p1">— Боги чтят человека, выступающего за справедливость, — отвечал сир Лин Корбрей. — Однако им нередко оказывается тот, кто лучше владеет мечом. Все мы знаем, кто здесь лучший боец. — Он скромно улыбнулся.</p><p class="p1">Еще дюжина рыцарей попыталась добиться внимания. Тирион был несколько обескуражен количеством незнакомцев, готовых убить его. Что, если план его все-таки не слишком умен?</p><p class="p1">Леди Лиза подняла руку, призывая к молчанию.</p><p class="p1">— Благодарю вас, милорды. Сын мой, безусловно, отблагодарит вас так, словно бы он присутствовал среди нас. В Семи Королевствах нет людей столь же отважных и верных, как рыцари Долины. Если бы я могла, то даровала бы всем вам эту честь. Сир Вардис Иген, вы всегда были правой рукой моего благородного мужа. Вы будете нашим чемпионом.<a href="ch2.xhtml#id10" class="a">[12]</a></p><p class="p1">Сир Вардис не проявил восторга.</p><p class="p1">— Миледи, — проговорил он серьезным голосом, опускаясь на одно колено, — прошу вас возложить эту ответственность на другого, я не испытываю желания драться. Этот человек не воин, поглядите на него. Он карлик, в два раза ниже меня и хром. Позорно убивать такого человека и называть это правосудием.</p><p class="p1">Великолепная мысль, рассудил Тирион, я с ней согласен!</p><p class="p1">Лиза с яростью поглядела на него:</p><p class="p1">— Ты потребовал поединка. А теперь я требую назначить своего чемпиона, как это сделали мы.</p><p class="p1">— Мой брат Джейме охотно примет участие в нем.</p><p class="p1">— Твой драгоценный Цареубийца в сотнях лиг отсюда, — отрезала Лиза Аррен.</p><p class="p1">— Пошлите за ним птицу, и я охотно дождусь его прибытия.</p><p class="p1">— Ты встретишься с сиром Вардисом завтра.</p><p class="p1">— Певец, — сказал Тирион, обращаясь к Мариллону, — когда ты сложишь балладу о сегодняшнем дне, не пропусти этого мгновения: пусть там будет сказано, как леди Аррен отказала карлику в праве выбора чемпиона и как выставила против хромого недоростка своего лучшего рыцаря.</p><p class="p1">— Я тебе ни в чем не отказывала! — выпалила Лиза Аррен, в пронзительном голосе ее слышалось раздражение. — Называй своего чемпиона, Бес, если ты считаешь, что найдешь здесь человека, готового умереть ради тебя.</p><p class="p1">— Если вы не против, я предпочту такого, который готов убить ради меня, — ответил Тирион, оглядывая длинный зал. Никто не шевельнулся. На мгновение он подумал, что совершает колоссальную ошибку. Но позади кто-то шевельнулся.</p><p class="p1">— Я выйду за карлика, — вызвался Бронн.</p></span>
