<p class="p">Тирион</p>
</div><p class="p1">— Они захватили моего сына.</p><p class="p1">— Истинно, милорд, — отозвался гонец голосом тусклым от утомления. Полосатый вепрь Кракехолла на груди его порванного кафтана наполовину скрывался за пятнами засохшей крови.</p><p class="p1">Одного из твоих сыновей, подумал Тирион. Но глотнув вина, не проронил ни слова, погрузившись в размышления о Джейме. Когда карлик поднял руку, боль пронзила его локоть, напомнив о недолгом знакомстве с битвой. При всей любви к своему брату, Тирион не хотел бы оказаться возле него в Шепчущем Лесу даже за все золото Бобрового утеса.</p><p class="p1">Капитаны и знаменосцы лорда-отца сразу притихли, когда гонец сообщил свою весть. И стало слышно, как потрескивают и шипят бревна в очаге на дальнем конце холодной гостиной.</p><p class="p1">После всех лишений, перенесенных во время долгой и безжалостной скачки на юг, возможность хотя бы раз заночевать на постоялом дворе весьма приободрила Тириона… впрочем, он предпочел бы другую гостиницу — только не эту. Воспоминания не всегда бывают веселыми…</p><p class="p1">Отец гнал жестоко, и дорога брала свое. Раненым приходилось напрягать все свои силы, иначе их предоставляли собственной судьбе. Каждое утро возле дороги оставалось еще несколько человек, заснувших вечером, но более не проснувшихся. Каждый день из седла падали новые. И каждый вечер кое-кто исчезал, растворившись во тьме. Тириону, пожалуй, даже хотелось присоединиться к ним.</p><p class="p1">В своей комнате наверху он наслаждался мягкой периной и теплой Шаей, устроившейся под боком, когда сквайр разбудил его, доложив, что прибыл гонец с жестокими вестями из Риверрана. Итак, все было бесполезно. Эта скачка, бесконечные переходы, тела, брошенные возле дороги, — все попусту. Робб Старк пришел в Риверран несколько дней назад.</p><p class="p1">— Как это могло случиться? — простонал сир Харис Свифт. — Как? Даже после Шепчущего Леса Риверран был охвачен железным кольцом, окружен огромным войском. Какое безумие заставило сира Джейме разделить своих людей на три отдельных лагеря? Он ведь знал, насколько уязвимы они будут!</p><p class="p1">Уж лучше, чем ты, трус с подрубленным подбородком, подумал Тирион. Джейме вполне мог потерять Риверран, но он не мог слышать, как его брата склоняют такие, как Свифт, бесстыжие лизоблюды: самое великое достижение этого типа заключалось в том, что он выдал свою, также лишенную подбородка дочь за сира Кивана, тем самым связав себя с Ланнистерами.</p><p class="p1">— Я поступил бы так же, — заметил его дядя куда более спокойным голосом, чем сделал бы Тирион. — Вы никогда не видели Риверрана, сир Харис, иначе вы бы знали, что у Джейме не было выбора. Дело в том, что замок расположен на мысу между Камнегонкой и Красным Зубцом. Реки ограждают Риверран с двух сторон, а в случае опасности Талли открывают шлюзы и наполняют широкий ров с третьей стороны треугольника, превращая замок в остров. Стены поднимаются прямо из воды, а со своих башен защитники прекрасно видят, что происходит на противоположных берегах на много лиг вокруг. Чтобы перекрыть все подходы, осаждающий должен поставить лагеря к северу от Камнегонки и к югу от Красного Зубца, а третий должен располагаться между реками, к западу от рва. Другого способа нет.</p><p class="p1">— Сир Киван говорит правду, милорды, — сказал гонец. — Лагеря мы оградили частоколами из заостренных кольев, но этого оказалось мало; разделенные реками, мы не смогли предупредить друг друга. Враги сначала напали на северный лагерь. Никто не ожидал этого. Марк Пайпер тревожил наших фуражиров, но у него было не более пятидесяти человек; к тому же мы думали, что сир Джейме управился с ними прошлой ночью, мы ведь не знали тогда, что это северяне. Мы считали, что Старки находятся к востоку от Зеленого Зубца и идут на юг.</p><p class="p1">— А ваши разведчики? — Лицо сира Григора Клигана казалось вырезанным из камня. Огонь в очаге бросал оранжевые отблески на его кожу, черные тени заливали глазницы. — Неужели они ничего не видели? Они вас предупреждали?</p><p class="p1">Окровавленный вестник затряс головой.</p><p class="p1">— Наши разведчики все время исчезали. Мы считали, что это работа Марка Пайпера. Ну а те, кто возвращался назад, утверждали, что не видели ничего.</p><p class="p1">— Человек, который ничего не видит, не умеет пользоваться глазами, — объявил Гора. — Такие глаза нужно вырвать и отдать другому разведчику; пусть знает, что вы считаете, что четверо глаз видят лучше, чем двое. Если ж не поймет, у следующего будет шесть глаз.</p><p class="p1">Лорд Тайвин повернул лицо к сиру Григору. Тирион заметил золотые искры в глазах отца, однако трудно было понять, выражает ли этот взгляд одобрение или презрение. Лорд Тайвин часто безмолвствовал в совете, предпочитая слушать, а не говорить; привычке этой пытался следовать и Тирион. Однако столь упорное молчание было непривычным даже для него; вино в его чаше тоже осталось нетронутым.</p><p class="p1">— Ты сказал, что они напали ночью, — проговорил сир Киван.</p><p class="p1">Человек устало кивнул.</p><p class="p1">— Черная Рыба вел авангард, они зарубили часовых, проломили бреши в палисадах для своего войска. Пока наши пытались понять, что происходит, их всадники уже ехали по лагерю с мечами и факелами в руках. Я ночевал в западном лагере между реками. Когда мы услышали звон мечей и стали загораться шатры, лорд Бракс повел нас к плотам. Мы попытались переправиться, но поток унес плоты вниз по течению, а катапульты Талли начали забрасывать нас камнями со стен. Я видел, как один плот разлетелся в щепу, два других перевернулись, люди попадали в реку и утонули… Ну а те, кто сумел переправиться, попали прямо в руки Старков, поджидавших на берегу.</p><p class="p1">Сир Флемент Бракс в своем пурпурно-серебряном плаще, с видом человека, явно не вполне осознающего то, что он услышал, спросил:</p><p class="p1">— А мой лорд-отец?</p><p class="p1">— Простите, милорд, — проговорил гонец, — лорд Бракс был облачен в кольчугу и панцирь, когда плот его перевернулся. Он был очень доблестным человеком…</p><p class="p1">Дураком он был, подумал Тирион и, покрутив чашу, уставился в винные глубины. Если переправляться в панцире через быструю реку ночью на грубом плоту, когда враг ждет тебя на другом берегу, — это отвага, то он готов считать себя трусом. Интересно, а ощущал ли лорд Бракс свою доблесть, когда тяжесть стали увлекала его в черные воды?</p><p class="p1">— Лагерь между рек также подвергся нападению, — продолжил вестник. — Пока мы пытались переправиться, с запада подошли новые знамена Старков двумя колоннами панцирной конницы. Я заметил гиганта в цепях лорда Амбера и орла Маллистеров, но войско вел мальчишка с чудовищным волком, бежавшим возле его коня. Я сам не видел, но люди рассказывали, что тварь убила четверых людей и задрала дюжину лошадей. Наши копейщики поставили стену из щитов и сдержали первый натиск, но, увидев это, Талли открыли ворота Риверрана, и Титос Блэквуд повел отряд по подъемному мосту и напал на них с тыла.</p><p class="p1">— Боги, спасите нас, — крякнул лорд Леффорд.</p><p class="p1">— Большой Джон Амбер поджег осадные башни, которые мы сооружали, а лорд Блэквуд отыскал сира Эдмара Талли в цепях среди пленников и увел их всех. Южным лагерем командовал сир Форли Престер. Увидев, что остальные лагеря взяты, он отступил в полном порядке с двумя тысячами копейщиков и таким же количеством лучников. Однако тирошиец, возглавлявший наемников, бросил наши знамена и переметнулся к врагу.</p><p class="p1">— Проклятие. — В голосе дяди Кивана звучал скорее гнев, чем удивление. — Я просил Джейме не доверять ему. Человек, который сражается из-за денег, верен лишь собственному кошельку.</p><p class="p1">Лорд Тайвин слушал, оперев подбородок на переплетенные пальцы, не двигаясь, следя за говорящими лишь глазами. Колючие золотые бакенбарды обрамляли лицо спокойное, словно маска, но Тирион видел крошечные капельки пота, выступившие на бритой голове отца.</p><p class="p1">— Как это могло случиться? — вновь простонал сир Харис Свифт. — Сир Джейме в плену, осада снята… Это катастрофа!</p><p class="p1">— Не сомневаюсь, что все благодарны вам, сир Харис, за напоминание об очевидном. Но вопрос заключается в том, что нам делать дальше, — сказал сир Аддам Марбранд.</p><p class="p1">— Что мы можем сделать? Войско Джейме истреблено, взято в плен или разбежалось. Старки и Талли перекрыли линию снабжения. Мы отрезаны от запада! При желании они могут повернуть прямо на Бобровый утес, и чем мы остановим их? Милорды, мы потерпели поражение. И должны просить мира.</p><p class="p1">— Мира? — Тирион одним глотком опустошил чашу, бросил пустую посудину на пол, и она разлетелась на тысячу кусков. — Вот ваш мир, сир Харис. Мой милый племянник раз и навсегда лишил нас такой возможности, украсив головой лорда Эддарда Красный замок. Сейчас легче выпить вина из разбитой мной чаши, чем заставить Робба Старка заключить мир. Он побеждает, или вы этого не заметили?</p><p class="p1">— Но две битвы — это еще не война, — настаивал сир Аддам. — Мы еще не погибли! Я буду рад любой возможности испытать своей сталью мальчишку Старка.</p><p class="p1">— Быть может, они согласятся на перемирие, захотят обменять наших пленных…</p><p class="p1">— Придется уговаривать менять троих на одного, иначе нам придется туго на переговорах, — едко сказал Тирион. — Но что мы можем предложить за моего брата? Гниющую голову лорда Эддарда?</p><p class="p1">— Я слышал, что королева Серсея задержала дочерей десницы, — сказал Леффорд с надеждой. — Если бы мы вернули парню его сестер…</p><p class="p1">Сир Аддам пренебрежительно фыркнул:</p><p class="p1">— Только полный осел будет менять Джейме Ланнистера на двух девчонок.</p><p class="p1">— Тогда мы должны выкупить сира Джейме, чего бы это ни стоило, — высказал мысль лорд Леффорд.</p><p class="p1">Тирион закатил глаза.</p><p class="p1">— Если Старки ощущают необходимость в золоте, они могут переплавить панцирь моего брата.</p><p class="p1">— Если мы запросим перемирия, они подумают, что мы слабы, — проговорил сир Аддам. — Следует немедленно наступать.</p><p class="p1">— Конечно, наших друзей при дворе можно убедить присоединиться к нам со свежими войсками, — сказал сир Харис. — И кому-то придется вернуться на Бобровый утес, чтобы собрать новое войско.</p><p class="p1">Лорд Тайвин Ланнистер поднялся.</p><p class="p1">— Они захватили моего сына, — сказал он еще раз голосом, сразу пресекшим все разговоры. — А теперь оставьте меня. Все!</p><p class="p1">Даже Тирион — воплощение неповиновения — поднялся, чтобы отправиться вместе с остальными, но отец поглядел на него.</p><p class="p1">— Нет, Тирион, ты останься. И ты, Киван. Все остальные — вон!</p><p class="p1">Тирион опустился на скамью, от удивления потеряв дар речи.</p><p class="p1">Сир Киван направился через всю комнату к бочонку с вином.</p><p class="p1">— Дядя, — попросил Тирион, — если вы будете столь любезны…</p><p class="p1">— Вот, — предложил отец ему свою чашу, к которой он так и не прикоснулся.</p><p class="p1">Теперь Тирион был воистину потрясен. Он выпил.</p><p class="p1">Лорд Тайвин уселся.</p><p class="p1">— Ты прав относительно Старка. Будь он жив, мы могли бы воспользоваться лордом Эддардом, чтобы выковать мир с Винтерфеллом и Риверраном, мир, который позволил бы нам управиться с братьями Роберта. Мертвый же… — Рука его сжалась. — Безумие, откровенное безумие!</p><p class="p1">— Джофф еще мальчишка, — указал Тирион. — В его возрасте я успел натворить достаточно безрассудств.</p><p class="p1">Отец остро поглядел на него.</p><p class="p1">— Ну все-таки мы должны радоваться тому, что он еще не женился на шлюхе.</p><p class="p1">Тирион тянул вино, гадая, как отреагирует лорд Тайвин, если он выплеснет чашу прямо ему в лицо.</p><p class="p1">— Наше положение хуже, чем вы думаете, — продолжил отец. — Похоже, мы получили нового короля.</p><p class="p1">Сира Кивана словно ударили по голове.</p><p class="p1">— Нового… кого? Что они сделали с Джоффри?</p><p class="p1">Легкое недовольство отразилось на губах лорда Тайвина.</p><p class="p1">— Пока ничего. Мой внук еще сидит на Железном троне, но евнух услыхал шепотки, доносившиеся с юга. На той неделе Ренли Баратеон обвенчался с Маргерит Тирелл и заявил о своих претензиях на престол. Отец и братья невесты преклонили колена и присягнули ему мечами.</p><p class="p1">— Суровая весть. — Сир Киван нахмурился, морщины на его лице превратились в ущелья.</p><p class="p1">— Моя дочь приказывает нам немедленно ехать в Королевскую Гавань, чтобы защитить Красный замок от короля Ренли и рыцаря Цветов. — Рот его напрягся. — Приказывает нам, представляете себе… именем короля и совета!</p><p class="p1">— А как воспринял новость король Джоффри? — спросил Тирион с изумлением.</p><p class="p1">— Серсея еще не сочла возможным сказать ему, — ответил лорд Тайвин. — Она опасается того, что он решится выступить против Ренли своим силами.</p><p class="p1">— С каким же это войском? — спросил Тирион. — Вы же не собираетесь предоставить ему вот это?</p><p class="p1">— Он собирается взять городскую стражу, — ответил лорд Тайвин.</p><p class="p1">— Если он возьмет стражу, город останется без защиты, — сказал Тирион. — А лорд Станнис Баратеон сидит на Драконьем Камне…</p><p class="p1">— Да. — Лорд Тайвин поглядел на сына. — Тирион, я думал, что ты создан для роли шута, но похоже, что я ошибался.</p><p class="p1">— Ну что же, отец, — ответил карлик, — это звучит как похвала. — Он наклонился вперед. — А как насчет Станниса? Старший ведь он, а не Ренли. Как он относится к претензиям своего брата?</p><p class="p1">Отец нахмурился.</p><p class="p1">— С самого начала мне казалось, что Станнис представляет большую опасность, чем все остальные, вместе взятые. И все же он ничего не делает. О! До лорда Вариса доносятся слухи: Станнис строит корабли, Станнис собирает наемников, Станнис выписал из Асшая тенезаклинателя. Но что это значит? Верны ли эти шепотки? — Он раздраженно пожал плечами. — Киван, принеси нам карту.</p><p class="p1">Сир Киван выполнил поручение. Лорд Тайвин развернул кожу, разгладил ее.</p><p class="p1">— Джейме заставил нас пойти не в ту сторону. Русе Болтон и остатки его войска располагаются к северу от нас. Наши враги удерживают Близнецы и ров Кейлин. Робб Старк преграждает дорогу на запад, и без битвы мы не можем отступить к Бобровому утесу. Джейме в плену, и войско его рассеялось. Торос из Мира и Берик Дондаррион продолжают препятствовать нашим фуражирам. На востоке находятся Аррены, Станнис Баратеон засел на Драконьем Камне, а на юге Вышесад и Штормовой Предел собирают знамена.</p><p class="p1">Тирион криво усмехнулся:</p><p class="p1">— Приободрись, отец, все-таки Рейегар Таргариен еще не восстал из мертвых.</p><p class="p1">— Я надеялся, что ты сумеешь воздержаться от своих выходок, — проговорил лорд Тайвин Ланнистер.</p><p class="p1">Лорд Киван стоял над картой, наморщив лоб.</p><p class="p1">— Робб Старк уже заручился помощью Эдмара Талли и лордов Трезубца. Их объединенное войско может превосходить наше. Ну а учитывая, что Русе Болтон находится позади нас… Тайвин, если мы останемся здесь, то можем оказаться между трех армий.</p><p class="p1">— Я не намереваюсь оставаться здесь. Мы должны выяснить отношения с молодым лордом Старком прежде, чем Ренли Баратеон сумеет выступить к нам из Вышесада. Болтон не беспокоит меня. Он и так человек осторожный, а Зеленый Зубец должен был еще более остудить его. Болтон не станет торопиться с погоней. Итак… утром выступаем на Харренхолл. Киван, я хочу, чтобы разведчики сира Аддама прикрывали наше передвижение. Дайте ему столько людей, сколько потребуется, и посылайте их по четыре человека. Я не желаю, чтобы они пропадали.</p><p class="p1">— Как вам угодно, милорд, но почему на Харренхолл? Это мрачное и несчастливое место. Некоторые называют его проклятым…</p><p class="p1">— Мало ли что болтают! Спустите с поводка сира Григора и его головорезов, пошлите их вперед. Пусть едут и Варго Хоуп с вольными всадниками, и сир Амари Лорх. У каждого из них по три сотни конных. Скажи им, я хочу, чтобы Речные земли горели от Божия Ока до Красного Зубца.</p><p class="p1">— Они вспыхнут, милорд, — пообещал сир Киван вставая. — Я отдам приказы.</p><p class="p1">Он поклонился и отправился к двери.</p><p class="p1">Когда они остались вдвоем, лорд Тайвин поглядел на Тириона.</p><p class="p1">— Твои дикари могут попользоваться, скажи, чтобы ехали с Варго Хоупом грабить. Добро, скот, женщин… пусть берут все, что хотят, а остальное сжигают.</p><p class="p1">— Учить Шаггу грабить — все равно что учить петуха кукарекать, — проговорил Тирион. — Но я предпочел бы оставить их при себе. — При всей их непокорности и диком виде горцы принадлежали ему самому, им он доверял больше, чем людям отца.</p><p class="p1">— Тогда научись управлять ими. Я не хочу грабежей в городе.</p><p class="p1">— В городе? — Тирион растерялся. — В каком городе?</p><p class="p1">— В Королевской Гавани. Я посылаю тебя ко двору.</p><p class="p1">Ничего подобного Тирион Ланнистер даже не мог ожидать. Он потянулся к вину и задумался на мгновение, прежде чем глотнуть.</p><p class="p1">— И что я буду там делать?</p><p class="p1">— Править, — резко проговорил отец.</p><p class="p1">Тирион взорвался смехом.</p><p class="p1">— У моей милой сестры есть свое мнение по этому вопросу.</p><p class="p1">— Пусть говорит что хочет, но сына ее нужно прибрать к рукам, прежде чем он погубит всех нас. Виноваты и эти ослы-советники. Наш друг Петир, достопочтенный великий мейстер и это чудо без хрена, лорд Варис. Какие советы они дают Джоффри, раз его бросает от одной глупости к другой! И кто это придумал возвести Яноса Слинта в лорды? Отец его был мясником, а ему дарят Харренхолл… Харренхолл, седалище королей! И пока я жив, я не позволю ему даже ступить туда. Мне рассказали, что он взял себе гербом окровавленное копье; топор мясника был бы куда уместнее.</p><p class="p1">Отец говорил ровным голосом, однако Тирион видел гнев в его золотых глазах.</p><p class="p1">— И потом, зачем они прогнали Селми, какой в этом смысл? Да, он состарился, но имя Барристана Отважного известно всему королевству. Он возвышал всякого, кому служил. Можно ли сказать то же самое о Псе? Собакам бросают корм под стол, но не сажают рядом с собой на высокий престол. — Он ткнул пальцем в сторону Тириона. — Если Серсея не способна угомонить мальчишку, ты обязан сделать это за нее. Но если эти советники дурачат нас…</p><p class="p1">Тирион сразу все понял.</p><p class="p1">— Голову с плеч, — вздохнул он. — И на стену.</p><p class="p1">— Вижу, ты научился от меня кое-чему.</p><p class="p1">— Более, чем ты думаешь, отец, — ответил Тирион негромко.</p><p class="p1">Допив вино, он задумчивым движением отставил в сторону чашу. Часть души его испытывала больше довольства, чем он готов был признать, другая часть не забыла сражение у реки… Хотелось бы знать, не посылает ли его отец снова на левый фланг?</p><p class="p1">— Но почему я? — спросил он, наклоняя голову к плечу. — Почему не мой дядя, почему не сир Аддам, не сир Флемент или не лорд Серрет? Кто-нибудь повыше ростом?</p><p class="p1">Тайвин резко поднялся.</p><p class="p1">— Потому что ты — мой сын.</p><p class="p1">Тут Тирион все понял. «Ты считаешь, что Джейме уже пропал. Сукин ты сын! Решил, что Джейме мертв и, кроме меня, у тебя никого не осталось!» Тириону хотелось ударить отца, плюнуть ему в лицо, извлечь кинжал, вырезать сердце и посмотреть, не сделано ли и в самом деле оно из старого жесткого золота, как говорили в простонародье. Однако он сидел на месте и молчал.</p><p class="p1">Обломки разбитой чаши хрустнули под сапогом отца, лорд Тайвин направился к выходу.</p><p class="p1">— Вот еще что, — сказал он сыну. — Ты не должен брать шлюху ко двору.</p><p class="p1">Тирион долго сидел один в гостиной после того, как отец ушел. Наконец он поднялся по ступеням в свою уютную комнату в башне под часами. Потолок был невысок, что карлику, естественно, не мешало. За окном торчала виселица, которую отец поставил во дворе. Тело содержательницы постоялого двора бесшумно раскачивалось на веревке под порывами ночного ветра. Плоть ее истощала, как и надежды Ланнистеров. Шая что-то пробормотала со сна и подкатилась к нему, когда Тирион сел на край перины. Запустив руку под одеяло, он погладил рукой мягкую грудь, и глаза открылись.</p><p class="p1">— Милорд, — проговорила она с сонной улыбкой.</p><p class="p1">Когда сосок Шаи напрягся, Тирион поцеловал ее.</p><p class="p1">— Я решил взять тебя в Королевскую Гавань, милая, — шепнул он.</p></span>
