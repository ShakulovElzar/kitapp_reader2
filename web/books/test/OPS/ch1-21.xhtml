<p class="p">Кейтилин</p>
</div><p class="p1">— Через час мы причалим в Королевской Гавани.</p><p class="p1">Кейтилин отвернулась от поручней и заставила себя улыбнуться.</p><p class="p1">— Твои гребцы хорошо потрудились ради нас, капитан. Каждый из них получит серебряного оленя в знак моей благодарности.</p><p class="p1">Капитан Морео Тумитис почтил ее полупоклоном.</p><p class="p1">— Вы слишком благородны, леди Старк. Довольно с них и чести везти столь знатную госпожу.</p><p class="p1">— Но от серебра они не откажутся?</p><p class="p1">Морео улыбнулся:</p><p class="p1">— Не откажутся.</p><p class="p1">Он бегло говорил на общем языке — с самым легчайшим акцентом тирошийского. Капитан бороздил Узкое море уже тридцать лет, как он рассказывал ей, сперва гребцом, потом квартирмейстером и, наконец, капитаном собственных торговых галей. «Пляшущая на валах» была его четвертым кораблем и самым быстрым: двухмачтовая галея имела шестьдесят весел.</p><p class="p1">Корабль этот оказался самым быстроходным среди всех, находившихся в Белой гавани, когда Кейтилин и сир Родрик Кассель появились там после долгой скачки. Тирошийцы славились своей алчностью, и сир Родрик предложил было нанять рыбацкий шлюп с Трех сестер, но Кейтилин настояла на галее. И хорошо, что она так поступила. Ветры все время препятствовали путешествию, и без весел галеи они сейчас плелись бы где-нибудь возле Перстов, не имея возможности проскочить мимо них, чтобы добраться до Королевской Гавани и тем самым завершить путешествие.</p><p class="p1">Так близко, подумала Кейтилин. Пальцы ее еще болели под полотняными повязками там, где их укусил кинжал. Боль твердила ей, верила Кейтилин, чтобы она ничего не забыла. Она не могла теперь согнуть два последних пальца на левой руке, да и прочие никогда не обретут прежней гибкости. И все же это была мизерная цена за жизнь Брана.</p><p class="p1">Сир Родрик избрал этот момент, чтобы появиться на палубе.</p><p class="p1">— Мой добрый друг, — обратился к нему Морео сквозь раздвоенную зеленую бороду. — Тирошийцы любят яркие краски, даже когда речь идет о цвете лица. Как прекрасно, что вам сегодня лучше.</p><p class="p1">— Да, — согласился сир Родрик. — Мне уже второй день не хочется умирать. — Он поклонился Кейтилин. — Миледи…</p><p class="p1">Рыцарь действительно выглядел лучше. Может быть, он слегка похудел на море после отплытия из Белой гавани, но теперь вновь сделался самим собой. Сильные ветры и бурные воды Узкого моря не отвечали его натуре, и сир Родрик едва не вывалился за борт, когда неожиданный шторм налетел на них от Драконьего Камня, но все-таки каким-то чудом сумел уцепиться за веревку, тем самым позволив людям Морео спасти его и доставить в безопасное место под палубой.</p><p class="p1">— Капитан как раз говорил мне, что наше путешествие почти закончилось, — сказала Кейтилин.</p><p class="p1">Сир Родрик выдавил сухую улыбку:</p><p class="p1">— Так скоро? — Лишившись своих огромных белых бакенбардов, он казался ей незнакомым. Сир Родрик сделался меньше ростом, да и постарел лет на десять. В море на волнах Пасти ему пришлось покориться бритве одного из мореходов, чтобы в третий раз не осквернить свои бакенбарды, припадая к борту и извергая содержимое желудка в бушующие волны.</p><p class="p1">— Ну, оставляю вас, чтобы вы могли обсудить свои дела, — проговорил капитан Морео и с поклоном отправился прочь.</p><p class="p1">Галея неслась по волнам подобно стрекозе, весла мерно вздымались и опускались в ровном ритме. Держась за поручень, сир Родрик поглядел на приближающийся берег.</p><p class="p1">— Я оказался не самым надежным из хранителей.</p><p class="p1">Кейтилин тронула его за руку.</p><p class="p1">— Мы прибыли сюда, сир Родрик, без приключений. Это я считаю главным. — Рука ее нырнула под плащ, неловкие пальцы нащупали кинжал. Она успела заметить, что время от времени прикасается к нему, чтобы подбодрить себя. — А теперь мы должны проникнуть к оружейных дел мастеру короля, и остается только молиться, чтобы ему можно было довериться.</p><p class="p1">— Сир Арон Сантагар человек тщеславный, но честный. — Рука сира Родрика отправилась к лицу, чтобы разгладить бакенбарды, и немедленно — с явным неудовольствием — обнаружила их отсутствие. — Быть может, он узнает этот клинок… но для вас, миледи, риск начнется сразу, как только мы выйдем на берег. При дворе есть люди, которые узнают вас на месте.</p><p class="p1">Рот Кейтилин напрягся.</p><p class="p1">— Мизинец, — пробормотала она, увидев умственным взором юношеское лицо, хотя обладатель его более не являлся мальчишкой. Отец его умер несколько лет назад, и теперь Петир сделался лордом Бейлишем, но его до сих пор звали Мизинцем. Прозвище это дал ему в Риверране ее брат Эдмар. Скромные владения Бейлишей располагались на меньшем из Перстов, к тому же Петир был мелковат и невысок для своего возраста.</p><p class="p1">Сир Родрик прочистил глотку.</p><p class="p1">— Лорд Бейлиш некогда… э… — Он в нерешительности подыскивал нужное слово.</p><p class="p1">Кейтилин было не до деликатности.</p><p class="p1">— Он был воспитанником моего отца. Мы выросли вместе в Риверране. Я видела в нем брата, он же относился ко мне… с более чем братской любовью. Когда было объявлено, что я должна выйти замуж за Брандона Старка, Петир решил оспорить его право на мою руку. Безумный поступок; Брандону уже исполнилось двадцать, а Петиру не было и пятнадцати. Мне пришлось просить, чтобы Брандон пощадил Петира. Он отпустил его, удовольствовавшись одним шрамом. Потом мой отец отослал Петира прочь. С той поры я не видела его. — Она подставила лицо водяной пыли, словно бы резкий ветер мог прогнать воспоминания. — После смерти Брандона он прислал мне письмо в Риверран, но я сожгла его не читая. Тогда я уже знала, что Нед женится на мне вместо брата.</p><p class="p1">Пальцы сира Родрика вновь попытались найти несуществующие бакенбарды.</p><p class="p1">— Теперь Мизинец заседает в Малом совете.</p><p class="p1">— Я знала, что Петир поднимется высоко, — проговорила Кейтилин. — Он всегда был умен, даже в мальчишеские годы, но ум и мудрость — вещи разные. Интересно, что сделали с ним годы?.. — Высоко над головой среди снастей пропел голос впередсмотрящего. Капитан Морео расхаживал по палубе, отдавая приказы, и на «Пляшущей на валах» началась лихорадочная деятельность. Королевская Гавань, раскинувшаяся на трех высоких холмах, медленно разворачивалась перед ними.</p><p class="p1">Три сотни лет назад, как знала Кейтилин, высоты эти были покрыты лесом, и лишь горстка рыбаков обитала на северном берегу Черноводной возле устья, где глубокая и быстрая река вливалась в море. Потом Эйегон-завоеватель приплыл с Драконьего Камня. Именно здесь его войско и высадилось на берег, именно здесь он поставил на самом высоком холме первое грубое укрепление из дерева и земли.</p><p class="p1">Теперь город захватил всю землю. Дворцы в рощах, амбары, кирпичные склады, бревенчатые гостиницы, дома купцов, таверны, кладбища, бордели — все друг на друге. Гомон рыбного рынка был слышен даже с моря. Здания разделяли широкие дороги, обсаженные деревьями, от них отделялись кривые улочки, а переулки были такими узкими, что два человека едва могли разойтись. Холм Висеньи венчала септа Бейелора с семью хрустальными башнями. На противоположной стороне города, на холме Рейенис, высились почерневшие стены Драконьего логова. Огромный купол обрушился, бронзовые двери не отпирали уже целый век. Соединяла холмы улица Сестер, прямая, словно стрела. Вдали поднимались стены города — высокие и надежные.</p><p class="p1">Возле воды вытянулась целая сотня причалов, и гавань была полна судов. Морские рыболовные корабли и речные посыльные суда сновали туда и сюда, перевозчики шестами направляли свои лодки через Черноводную, торговые галеи разгружали товар, доставленный из Браавоса, Пентоса и Лиса. Кейтилин заметила причудливую барку королевы, привязанную возле толстопузого китобоя из Порт-Иббена. Корпус ее покрывала черная смола. Вверху на реке дюжина стройных военных кораблей, спустив паруса, отдыхала у своих причалов, о мощные железные тараны плескала вода.</p><p class="p1">И над всем этим на высоком холме Эйегона хмурился Красный замок: семь огромных башен, увенчанных железом. Из стены вырастала огромная и мрачная подвесная башня, виднелись сводчатые палаты, залы, крытые переходы, казармы, темницы, амбары, зубчатые массивные стены, сложенные из бледного красного камня. Этот замок приказал возвести Эйегон-завоеватель. Завершили стройку при его сыне Мейегоре Жестоком. Он велел обезглавить каждого каменщика, плотника и строителя, трудившегося здесь. Лишь крови дракона подобает знать тайны этой крепости.</p><p class="p1">Но теперь над укреплениями реяли золотые, а не черные знамена; там, где прежде извергал огонь трехголовый дракон, ныне скакал венценосный олень дома Баратеонов.</p><p class="p1">Из порта неторопливо выходил корабль с высокими мачтами под флагом Летних островов, огромные белые паруса наполнял ветер. «Пляшущая на валах» миновала его, уверенно направляясь к берегу.</p><p class="p1">— Миледи, — проговорил сир Родрик. — Отлеживаясь, я понял, как нам нужно поступить. Вам не следует появляться в замке. Я сделаю это и приведу к вам сира Арона в какое-нибудь безопасное место.</p><p class="p1">Она поглядела на старого рыцаря. Галея остановилась возле пирса, Морео уже вовсю кричал на вульгарном валирийском Вольных Городов.</p><p class="p1">— Вы будете рисковать не менее, чем я.</p><p class="p1">Сир Родрик улыбнулся:</p><p class="p1">— Едва ли. Я поглядел на собственное отражение в воде и едва узнал себя. Последний раз без бакенбард меня видела моя мать, а она умерла сорок лет назад. Думаю, мне ничего не грозит, миледи.</p><p class="p1">Морео выкрикнул команду. Все шестьдесят весел разом поднялись из воды и, обратив движение, опустились в воду. Галея замедлила ход. Раздался новый крик. Весла скользнули внутрь корпуса. Когда корабль стукнулся о причал и тирошийские матросы соскочили на берег, Морео поднялся наверх, блистая улыбкой.</p><p class="p1">— Королевская Гавань, миледи, как вы приказывали! Ни один корабль еще не доплывал сюда быстрее и спокойнее. Не потребуется ли вам помощь, чтобы перенести вещи в замок?</p><p class="p1">— Мы направимся не в замок. Быть может, вы можете порекомендовать нам гостиницу, чистую и уютную, чтобы она стояла не слишком далеко от реки?</p><p class="p1">Тирошиец принялся теребить раздвоенную зеленую бороду.</p><p class="p1">— Значит, так. Я знаю несколько заведений, которые могут подойти вам. И все же, если я вправе осмелиться, как насчет второй части платы, которую мы обговорили? И конечно, насчет того серебра, которое вы так любезно обещали. Кажется, речь шла о шестидесяти оленях.</p><p class="p1">— Для гребцов, — напомнила ему Кейтилин.</p><p class="p1">— О, конечно же! — вскричал Морео. — Хотя я, например, приберег бы серебро до возвращения в Тирош, ради их жен и детей. Если выдать людям серебро, миледи, они в одну ночь спустят его, играя в кости, или потратят на женщин.</p><p class="p1">— Есть худшие способы спустить деньги, — вставил сир Родрик. — Зима близко.</p><p class="p1">— Человек вправе самостоятельно делать свой выбор, — сказала Кейтилин. — Они заработали серебро, а как они потратят его, меня не касается.</p><p class="p1">— Как вам угодно, миледи, — отвечал Морео, кланяясь и улыбаясь.</p><p class="p1">На всякий случай Кейтилин сама заплатила каждому гребцу по оленю и дала по медяку двум людям, которые перенесли их сундуки на холм Висеньи в ту гостиницу, которую порекомендовал Морео. Старый покосившийся дом располагался в Угревом переулке. Хозяйничала там кислолицая карга, недоверчиво оглядевшая их рассеянным взором и прикусившая монету, которую дала ей Кейтилин, чтобы убедиться в том, что она не фальшивая. Комнаты были просторны и полны воздуха, а Морео клялся, что лучшей ухи, чем здесь, не сыщешь во всех Семи Королевствах. Но удобнее всего было то, что их именами хозяйка не интересовалась.</p><p class="p1">— Я думаю, вам лучше держаться подальше от гостиной, — сказал сир Родрик, когда они устроились. — Нельзя заранее знать, кого может сюда принести. — Рыцарь облачился в кольчугу и спрятал длинный меч под темным плащом, капюшон которого легко можно было набросить на голову. — Я вернусь к вечеру вместе с сиром Ароном, — пообещал он. — А теперь отдыхайте, миледи.</p><p class="p1">Она устала. Путешествие было долгим и изнурительным, а она более не чувствовала себя молодой. Окна выходили на переулки и крыши, за ними тускло поблескивала Черноводная. Кейтилин проследила за удалявшейся фигурой сира Родрика. Рыцарь торопливой походкой направился вниз по людной улице и скоро затерялся в толпе. Пришлось последовать его совету. Матрас оказался набитым соломой, а не перьями, но уснула она сразу.</p><p class="p1">Проснувшись от стука в дверь, Кейтилин резко села. За окном под лучами заходящего солнца багровели крыши Королевской Гавани. Она проспала дольше, чем намеревалась. Кулак вновь забарабанил в дверь, и голос выкрикнул:</p><p class="p1">— Откройте! Именем короля! Приказываю!</p><p class="p1">— Мгновение, — отвечала она, закутываясь в плащ. Кинжал лежал возле постели. Она схватила его, прежде чем отпереть тяжелую деревянную дверь. В комнату ворвались люди в черных кольчугах и золотых плащах городской стражи. Их предводитель улыбнулся, увидев кинжал в ее руке, и сказал:</p><p class="p1">— Излишняя предосторожность, миледи. Мы должны проводить вас в замок.</p><p class="p1">— Кто приказал? — спросила она.</p><p class="p1">Он показал ей ленту. Кейтилин ощутила, как дыхание перехватило ее горло. На сером воске печати вырисовывалось изображение пересмешника.</p><p class="p1">— Петир, — прошептала она. — Так скоро. Должно быть, что-то случилось с сиром Родриком.</p><p class="p1">Кейтилин поглядела на старшего из стражников.</p><p class="p1">— Ты знаешь, кто я?</p><p class="p1">— Нет, миледи, — отвечал тот, — милорд Мизинец приказал нам только привести вас к нему так, чтобы вы при этом не претерпели никаких неприятностей по дороге.</p><p class="p1">Кейтилин кивнула:</p><p class="p1">— Можете подождать снаружи, пока я оденусь.</p><p class="p1">Она омыла руки в тазу и вытерла их чистым полотном. Неловкие и опухшие пальцы с трудом застегнули платье и завязали под горлом толстый коричневый плащ. Как мог узнать Мизинец, что она находится здесь? Сир Родрик никогда бы не сказал ему этого. Он стар, упрям и безупречно верен. Неужели они опоздали и Ланнистеры уже успели достичь Королевской Гавани? Нет, если бы это было так, Нед тоже был бы здесь, а тогда он сам пришел бы к ней. Как же?..</p><p class="p1">Тут она поняла. Морео! Тирошиец — черти бы его взяли — знал, кто они и где остановились. Можно было не сомневаться в том, что он хорошо заработал на этом.</p><p class="p1">Для нее привели коня. Все фонари вдоль улиц были зажжены, и, окруженная стражей, Кейтилин ощущала на себе глаза всего города. Когда они добрались до Красного замка, решетка была опущена и Великие ворота уже закрылись на ночь, хотя в окнах замка было полно мерцающих огней. Гвардейцы оставили своих коней за стеной, проводили ее через узкую калитку, а потом по бесконечной лестнице она поднялась в башню.</p><p class="p1">Мизинец находился в комнате один, он сидел за тяжелым деревянным столом и писал в свете масляной лампы. Когда ее ввели, он отложил перо, поглядел на нее и негромко сказал:</p><p class="p1">— Кет!</p><p class="p1">— Почему ты приказал доставить меня сюда таким образом?</p><p class="p1">Он поднялся и резко махнул стражникам.</p><p class="p1">— Оставьте нас.</p><p class="p1">Люди ушли.</p><p class="p1">— Надеюсь, что с тобой обходились вежливо, — сказал он после того, как они вышли. — Я дал им твердые наставления. — Он заметил ее повязки. — Твои руки…</p><p class="p1">Кейтилин игнорировала вопрос.</p><p class="p1">— Я не привыкла, чтобы со мной обращались, как со служанкой, — сказала она ледяным тоном. — В детстве у тебя были лучшие манеры.</p><p class="p1">— Я прогневал вас, миледи, простите; я не хотел этого.</p><p class="p1">Петир явно раскаивался. Взгляд извлек из памяти яркие воспоминания: в детстве он всегда был лукавым ребенком, но после проказ обычно принимал невинное обличье, так уж он был устроен. Годы не слишком-то переменили Петира. Невысокий, он так и не вырос, оставшись на дюйм или два ниже Кейтилин. Тонкий и быстрый, он сохранил острые черты, памятные ей, и те же самые смеющиеся серо-синие глаза. Подбородок его теперь украшала небольшая, острым клинышком бородка, темные волосы Петира пронизывала седина, хотя ему еще не было и тридцати. Шевелюра его гармонировала с серебристым пересмешником, которым был застегнут плащ. В детстве он тоже любил серебро.</p><p class="p1">— Откуда ты узнал, что я в городе? — спросила она.</p><p class="p1">— Лорд Варис знает все, — ответил Петир с лукавой улыбкой. — Он скоро присоединится к нам, но сначала я хотел повидать тебя. Кет, как это было давно, сколько же лет прошло?</p><p class="p1">Кейтилин игнорировала его фамильярность. У нее были более важные дела.</p><p class="p1">— Итак, меня обнаружил королевский паук?</p><p class="p1">Мизинец дернулся.</p><p class="p1">— Не надо так называть его. Он очень чувствителен — должно быть, потому, что евнух. В этом городе не случается ничего такого, о чем не знал бы Варис. А иногда он заранее узнает о том, что случится. У него повсюду есть доносчики… маленькие птички — так он зовет их. Одна из его птах услыхала о твоем прибытии. К счастью, Варис пришел сразу ко мне.</p><p class="p1">— Почему к тебе?</p><p class="p1">Он пожал плечами:</p><p class="p1">— А почему бы и нет? Я здесь мастер над монетой, личный советник короля. Селми и лорд Ренли уехали на север встречать Роберта, лорд Станнис отправился на Драконий Камень, остались только я и мейстер Пицель. Я был самой очевидной кандидатурой. Я всегда был другом твоей сестры Лизы, и Варис знает об этом.</p><p class="p1">— А Варис знает о…</p><p class="p1">— Лорд Варис знает обо всем… кроме причин, которые привели тебя сюда. — Он приподнял бровь. — Итак, почему ты здесь?</p><p class="p1">— Жена вправе желать мужа, а если мать решила повидать дочерей, кто может отказать ей?</p><p class="p1">Мизинец расхохотался:</p><p class="p1">— Весьма убедительные доводы, миледи, однако прошу вас не рассчитывать, что я поверю им. Для этого я знаю вас слишком хорошо. Как там говорят Талли?</p><p class="p1">Горло Кейтилин пересохло.</p><p class="p1">— Семья, долг, честь, — строгим голосом повторила она. Петир хорошо знал этот девиз.</p><p class="p1">— Семья, долг, честь, — отозвался он. — И то, и другое, и третье требуют, чтобы ты оставалась в Винтерфелле, где десница оставил тебя. Нет, миледи, что-то случилось, твое внезапное путешествие свидетельствует о срочном деле. Прошу, разреши мне помочь тебе, старые друзья должны полагаться друг на друга.</p><p class="p1">В дверь негромко постучали.</p><p class="p1">— Войдите, — позвал Мизинец.</p><p class="p1">Дверь открыл пухлый, надушенный, напудренный и безволосый, как яйцо, человек, в жилете, расшитом золотой нитью, и свободной мантии из пурпурного шелка. На ногах его были шлепанцы из мягкого бархата с заостренными носами.</p><p class="p1">— Леди Старк, — сказал он, принимая ее руку обеими, — я просто счастлив видеть вас после столь долгих лет. — Прикосновение его было мягким и влажным, а дыхание отдавало сиренью. — О бедные руки! Неужели вы обожглись, милая леди? Пальцы столь нежны… наш добрый мейстер Пицель делает великолепную мазь, я могу послать за горшочком?</p><p class="p1">Кейтилин высвободила руку.</p><p class="p1">— Благодарю вас, милорд, но мой мейстер Лювин уже приглядел за моей раной.</p><p class="p1">Варис покачал головой:</p><p class="p1">— Я с глубокой скорбью узнал о случившемся с вашим сыном. Он так молод, но боги жестоки.</p><p class="p1">— В этом я с вами согласна, лорд Варис, — проговорила она. Титулом этим пользовались лишь из почтения к члену совета; лорд Варис ничем не правил, кроме собственной паутины, и был повелителем лишь своих шептунов.</p><p class="p1">Евнух развел мягкие руки.</p><p class="p1">— Но я все-таки надеюсь, милая леди. Я весьма уважаю вашего мужа, нашу новую десницу, и знаю, что мы оба любим короля Роберта.</p><p class="p1">— Да, — пришлось согласиться ей. — Конечно.</p><p class="p1">— В стране еще не было короля столь любимого, как наш Роберт, — вмешался Мизинец. Он лукаво улыбнулся. — По крайней мере так уверяет лорд Варис.</p><p class="p1">— Добрая леди, — заявил Варис с полной убежденностью в голосе. — В Вольных Городах есть люди, обладающие удивительной целительной силой. Скажите лишь слово, и я пошлю за одним из них ради нашего дорогого Брана.</p><p class="p1">— Мейстер Лювин уже сделал для Брана все возможное, — сказала она, не желая разговаривать об изувеченном сыне здесь, с этими людьми. Мизинцу она доверяла лишь отчасти, а Варису вовсе не доверяла. Нельзя позволять им видеть ее горе. — Лорд Бейлиш сказал мне, что я должна поблагодарить вас за то, что меня доставили сюда.</p><p class="p1">Варис хихикнул, как распутная девчонка:</p><p class="p1">— О да. Признаюсь вам в своей вине и надеюсь на прощение, добрая леди. — Он опустился в кресло и сложил руки. — А нельзя ли попросить вас показать нам кинжал?</p><p class="p1">Ошеломленная, не веря своим ушам, Кейтилин Старк глядела на евнуха. Действительно паук, подумала она, чародей или хуже того. Этот знает вещи, которых не знает никто, кроме…</p><p class="p1">— А что вы сделали с сиром Родриком? — потребовала она ответа.</p><p class="p1">Мизинец сделал вид, что ничего не понимает:</p><p class="p1">— Я ощущаю себя рыцарем, который явился на поле боя, забыв свое копье. О каком кинжале мы говорим? Кто такой сир Родрик?</p><p class="p1">— Сир Родрик Кассель — мастер над оружием в Винтерфелле, — пояснил ему Варис. — Уверяю вас, леди Старк, с добрым рыцарем ничего не случилось. Он заходил сюда сегодня утром, посетил сира Арона Сантагара в оружейной, где они и поговорили о кинжале. А к закату оба рыцаря вместе оставили замок и отправились к той жуткой дыре, где вы остановились. Они и сейчас там, пьют в гостиной и дожидаются вашего возвращения. Сир Родрик весьма расстроился, обнаружив ваше отсутствие.</p><p class="p1">— Откуда вы знаете все это?</p><p class="p1">— Птички нашептывают, пичужки, — отвечал Варис улыбаясь. — Я знаю все, милая леди. Такова природа моей службы. — Он пожал плечами. — Итак, кинжал сейчас при вас?</p><p class="p1">Кейтилин извлекла оружие из-под плаща и бросила на стол перед ним.</p><p class="p1">— Вот он. Быть может, ваши пташки начирикают и имя человека, которому он принадлежит?</p><p class="p1">Варис поднял нож с преувеличенной осторожностью и провел пальцем вдоль края. Выступила кровь, он вскрикнул и уронил кинжал обратно на стол.</p><p class="p1">— Осторожно, — предупредила Кейтилин. — Он очень острый.</p><p class="p1">— Ничто так не держит заточку, как валирийская сталь, — проговорил Мизинец и, пока Варис сосал кровоточащий палец, мрачно и многозначительно качал головой, глядя на Кейтилин. Потом Петир непринужденно взвесил нож на руке, опробовал рукоятку. Подбросил в воздух, поймал другой рукой. — Какой баланс! Значит вам нужно отыскать владельца, и за этим вы пожаловали сюда? Для этого сир Арон вам не потребуется, миледи. Надо было сразу обратиться ко мне.</p><p class="p1">— Ну а если так, — проговорила она, — что скажешь мне ты?</p><p class="p1">— Я бы рассказал тебе, что в Королевской Гавани видели лишь один такой кинжал.</p><p class="p1">Взявшись большим и указательным пальцами за острие, он бросил кинжал назад через плечо заученным движением кисти. Нож вонзился в дверь и глубоко застрял в дубовой доске.</p><p class="p1">— Он мой.</p><p class="p1">— Твой? — Это было бессмысленно. Петир не приезжал в Винтерфелл.</p><p class="p1">— Он был моим до турнира в честь именин принца Джоффри, — сказал он, пересекая комнату, чтобы извлечь кинжал из дерева. — В тот день вместе с половиной двора я ставил на сира Джейме. — Застенчивая улыбка вновь сделала из Петира мальчишку. — Когда Лорас Тирелл выбил его из седла, многие из нас чуточку обеднели. Сир Джейме потерял сотню золотых драконов, королева — изумрудный кулон, а я — свой нож. Ее величество получила свой изумруд назад, но победитель сохранил остальное.</p><p class="p1">— Кто он? — спросила она голосом, сухим от страха. Пальцы ее заныли, незабытая боль вновь пронзила их.</p><p class="p1">— Бес, — сказал Мизинец, пока лорд Варис следил за ее лицом. — Тирион Ланнистер.</p></span>
