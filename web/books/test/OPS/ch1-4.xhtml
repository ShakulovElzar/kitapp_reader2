<span id="id2"><div class="title2">
<p class="p">Бран</p>
</div><p class="p1">Утро выдалось чистым и ясным, свежесть напоминала о близящемся конце лета. Они выехали на рассвете, чтобы поглядеть, как этому типу отрубят голову; их было двадцать человек, и Бран ехал среди них, нервничая от возбуждения. Впервые лорд-отец и братья сочли его достаточно взрослым, чтобы лицезреть совершенство королевского правосудия. Шел девятый год лета — и седьмой в жизни Брана.</p><p class="p1">Человека этого взяли возле небольшой крепости в горах. Робб считал, что это один из одичалых — человек, присягнувший мечом Мансу-налетчику, Королю за Стеной. По коже Брана при этой мысли побежали мурашки. Он помнил, о чем старая Нэн рассказывала у очага. Одичалые — люд жестокий, говорила она, убийцы, работорговцы и воры. Они водились с гигантами и мертвяками, глухими ночами крали девчонок и пили кровь из обточенных рогов. А их женщины долгой ночью ложились с Иными, чтобы породить ужасных детей, в которых было мало человеческого. Но человек, связанный по рукам и ногам возле стены и ожидавший совершения королевского правосудия, был стар и худ и ростом лишь немного превышал Робба. Лишенный обоих ушей и пальца, он был одет в черное, как подобает брату из Ночного Дозора, только меха его были потрепанны и грязны.</p><p class="p1">Дыхание людей и коней мешалось, струясь парком в холодном утреннем воздухе. Отец Брана, лорд, велел отрезать веревки от стены и подтащить пленника поближе. Робб и Джон, высокие и спокойные, сидели на конях, между ними красовался Бран на своем пони и пытался казаться старше семи лет, старательно изображая, что все это он уже видел. Слабый ветерок дул из ворот крепости. Над головами трепетало знамя Старков из Винтерфелла:<a href="ch2.xhtml#id11" class="a">[1]</a> серый лютоволк несся по снежно-белому полю.</p><p class="p1">Отец невозмутимо сидел на коне, длинные каштановые волосы теребил ветер. В подстриженной бороде мелькали белые нити, он выглядел старше своих тридцати пяти лет. Серые глаза лорда нынче смотрели угрюмо, он казался непохожим на того мужчину, который вечерами возле огня негромко рассказывал о веке героев и детях леса. Бран подумал: он снял с себя личину отца и надел маску, подобающую лорду Старку,<a href="ch2.xhtml#id9" class="a">[2]</a> владетелю Винтерфелла.</p><p class="p1">Холодное утро услышало вопросы судей и ответы на них; сам Бран впоследствии не мог вспомнить, о чем шла речь. Наконец лорд-отец дал приказ, и двое гвардейцев потащили оборванца к колоде железоствола, стоящей в центре площади, и заставили его положить голову на твердое дерево. Лорд Эддард Старк спешился, и его подопечный Теон Грейджой подал меч. Клинок имел собственное имя и звался Лед. Шириной он был в ладонь мужчины, а в длину превышал рост Робба. Черное лезвие выковали из валирийской стали и укрепили заклинаниями. Нет меча острее, чем валирийский.</p><p class="p1">Отец стащил перчатки, передал их Джори Касселю, капитану его домашней гвардии. Он обхватил меч обеими руками и проговорил:</p><p class="p1">— Именем Роберта из дома Баратеонов, первого носителя этого имени, короля андалов, ройнаров и Первых Людей, владыки Семи Королевств и Хранителя Областей, по слову Эддарда из дома Старков, лорда Винтерфелла и Хранителя Севера, я выношу тебе смертный приговор. — Огромный меч сверкнул высоко над головой.</p><p class="empty-line"/><p class="p1">Бастард Джон Сноу подвинулся ближе к Брану.</p><p class="p1">— Придержи-ка своего пони, — шепнул он. — И не отворачивайся, отец заметит.</p><p class="p1">Бран удержал пони на месте и не отвернулся.</p><p class="p1">Отец снес голову преступнику одним уверенным ударом. Кровь хлынула на снег, окрасившийся в цвет летнего вина. Один из коней встал на дыбы, и его пришлось удерживать на месте. Бран не мог отвести глаз от крови. Снег вокруг колоды быстро впитывал ее, краснея буквально на глазах.</p><p class="p1">Голова ударилась о толстый корень и откатилась к ногам Грейджоя. Теон, смуглый молодец девятнадцати лет, во всем находил смешное. Он расхохотался, поставил сапог на голову и пнул…</p><p class="p1">— Осел, — пробормотал Джон, но так, чтобы не слышал Грейджой. Он положил руку на плечо Брана, тот поглядел на своего незаконнорожденного брата. — А ты молодец, — торжественно объявил Джон с высоты своих четырнадцати лет, как знаток совершения правосудия.</p><p class="p1">Обратная дорога показалась более длинной и холодной, хотя ветер стих и солнце поднялось выше. Бран ехал вместе с братьями впереди основного отряда, пони его с трудом держался вровень с рослыми лошадьми.</p><p class="p1">— Дезертир принял смерть отважно, — проговорил Робб. Высокий и широкоплечий, он рос день ото дня. Робб пошел в мать: светлая кожа, рыже-каштановые волосы и синие глаза Талли из Риверрана. — Ему по крайней мере хватило отваги.</p><p class="p1">— Нет, — вновь негромко ответил Джон. — Это не отвага. Он окоченел от страха. Мог бы и посмотреть ему в глаза, Старк. — Собственные глаза Джона, серые настолько, что казались почти что черными, редко упускали что-либо. Он был одного возраста с Роббом, хотя сходства в них обнаруживалось немного, и если Джон был худощав, темноволос и быстр, то Робб мускулист, светловолос, крепок и надежен.</p><p class="p1">Робб явно не был заинтересован в разговоре.</p><p class="p1">— Чтоб его глаза вынули Иные, — буркнул он. — Дезертир умер достойно. Спорим, я буду первым у моста?</p><p class="p1">— По рукам, — ответил Джон, немедленно посылая своего коня вперед. Робб ругнулся и последовал за ним; они помчались вдоль дороги. Робб хохотал и улюлюкал, Джон сохранял сосредоточенное молчание. Копыта коней поднимали фонтаны снега.</p><p class="p1">Бран и не пытался последовать за ними. Пони его не был способен на такие штучки. Но глаза оборванца он тоже видел — и теперь вспоминал их. Спустя некоторое время смех Робба растаял вдали, и в лесу вновь стало тихо.</p><p class="p1">Бран так глубоко погрузился в думу, что даже не услышал, как его нагнал весь отряд и отец подъехал к нему сзади.</p><p class="p1">— С тобой все в порядке, Бран? — спросил он, пожалуй, даже с заботой.</p><p class="p1">— Да, отец, — ответил Бран, поднимая взгляд. Его лорд-отец, закутанный в меха, высился над ним на огромном боевом коне подобно гиганту. — Робб сказал, что человек этот умер с отвагой, но Джон уверяет, что он боялся.</p><p class="p1">— А ты как думаешь? — спросил отец.</p><p class="p1">Бран подумал.</p><p class="p1">— А не может ли человек сразу быть отважным, но чего-то бояться?</p><p class="p1">— Только так и может человек быть отважным, — ответил отец. — А ты понимаешь, почему я это сделал?</p><p class="p1">— Он был из одичалых, — проговорил Бран. — Они крадут женщин и продают их Иным.</p><p class="p1">Лорд-отец улыбнулся:</p><p class="p1">— Опять наслушался сказок старухи Нэн? Понимаешь, человек этот был клятвопреступником, сбежавшим из Ночного Дозора. Нет преступника более опасного. Дезертир знает, что если его поймают, то лишат жизни, и не остановится перед любым злодеянием. Но ты не понял меня. Я говорю не о том, почему он должен был умереть, а о том, почему я сделал это своими руками.</p><p class="p1">Брану нечего было сказать.</p><p class="p1">— У короля Роберта есть палач, — проговорил он неуверенно.</p><p class="p1">— Да, это так, — согласился отец. — Как и прежде у королей Таргариенов. Но наш обычай древнее. Кровь Первых Людей по-прежнему течет в жилах Старков: мы считаем, что тот, кто выносит приговор, должен и нанести удар. Если ты собираешься взять человеческую жизнь, сам загляни в глаза осужденного. Ну а если ты не в силах этого сделать, тогда человек, возможно, и не заслуживает смерти. Однажды, Бран, ты станешь знаменосцем Робба, будешь править собственной крепостью от имени твоего брата и твоего короля, и тебе придется совершать правосудие. Когда настанет такой день, ты не должен находить удовольствие в этом деле, но нельзя и отворачиваться… Правитель, прячущийся за наемных палачей, скоро забывает лик смерти.</p><p class="p1">В этот-то миг на гребне холма перед ними появился Джон. Махнув рукой, он закричал им:</p><p class="p1">— Отец, Бран, быстрее, посмотрите, что нашел Робб! — И с этими словами снова исчез.</p><p class="p1">Джори подъехал к ним.</p><p class="p1">— Что-то случилось, милорд?</p><p class="p1">— Вне сомнения, — отвечал лорд-отец. — Поехали посмотрим, какое безобразие обнаружили мои сыновья.</p><p class="p1">Он послал своего коня рысью. Джори, Бран и все остальные последовали за ним. Робба они обнаружили на берегу реки к северу от моста, Джон возле него оставался верхом. Снег позднего лета лежал глубоко. Робб стоял по колено в белом сугробе, капюшон откинут назад, и солнце поблескивает в волосах… Он держал что-то в руках, и мальчишки переговаривались негромкими взволнованными голосами.</p><p class="p1">Кони осторожно пробрались среди сугробов, пытаясь отыскать прочную опору для ног на неровной земле. Джори Кассель и Грейджой первыми приблизились к мальчикам. Грейджой смеялся и шутил всю дорогу, но тут Бран услышал, как резко оборвался его смех.</p><p class="p1">— О боги! — воскликнул он, пытаясь сохранить власть над лошадью и протягивая руку к мечу.</p><p class="p1">Меч Джори уже был в его руках.</p><p class="p1">— Робб, отойди! — крикнул он, когда лошадь попятилась. Робб ухмыльнулся и поднял взгляд от комка, который держал в руках.</p><p class="p1">— Она не причинит тебе вреда, Джори, — отвечал он. — Она мертва.</p><p class="p1">Брана сжигало любопытство. Он пришпорил своего пони, но отец велел ему спешиться перед мостом и идти пешком. Бран соскочил с коня и побежал. К тому времени Джори, Джон и Теон уже спешились.</p><p class="p1">— И что же это такое, клянусь всеми семью пеклами? — проговорил Грейджой.</p><p class="p1">— Волчица, — сказал ему Робб.</p><p class="p1">— Урод, — отвечал Грейджой. — Погляди на величину.</p><p class="p1">Сердце Брана отчаянно стучало, пока он пробирался к братьям через сугроб, провалившись в него по грудь. В окрашенном кровью снегу утопал огромный темный силуэт. Косматая серая шкура уже успела покрыться ледком, слабый запах падали тянулся с навязчивостью женских духов. Бран увидел слепые глаза, в которых уже ползали черви, широкую пасть, полную желтых зубов. Величина существа заставила его охнуть. Зверь был выше пони, в два раза больше самой рослой собаки отца.</p><p class="p1">— Это не урод, — невозмутимо отвечал Джон. — Это лютоволк. Они больше обычных.</p><p class="p1">Теон Грейджой заметил:</p><p class="p1">— Уже две сотни лет лютоволка ни разу не встречали к югу от Стены.</p><p class="p1">— Вот он перед нами, — ухмыльнулся Джон.</p><p class="p1">Бран сумел оторвать взгляд от чудовища и, сразу заметив ком шерсти в руках Робба, с восторженным воплем пододвинулся ближе. Щенок — слепой шар серо-черного меха — тыкался носом в грудь Робба, державшего его на руках, и, не находя молока, грустно скулил. Бран неуверенно протянул руку.</p><p class="p1">— Давай, — сказал Робб. — Можешь погладить.</p><p class="p1">Бран нервным торопливым движением погладил животное, потом повернулся, услышав голос Джона.</p><p class="p1">— А вот и еще один. — Его сводный брат держал в руках второго щенка. — Их здесь пять.</p><p class="p1">Бран сел в снег и прижал волчонка к лицу. Мягкая шкурка грела щеку.</p><p class="p1">— После стольких-то лет лютоволки разгуливают по стране, — пробормотал Халлен, мастер над конями. — Мне это не нравится.</p><p class="p1">— Это знак, — сказал Джори.</p><p class="p1">Отец нахмурился.</p><p class="p1">— Джори, это всего лишь мертвое животное, — проворчал он. И все же он казался встревоженным. Захрустел снег под сапогами, отец обошел волчицу. — А почему она погибла?</p><p class="p1">— Что-то застряло в ее горле, — отвечал Робб, гордясь, что нашел ответ на вопрос, прежде чем отец задал его. — Тут, сразу под челюстью.</p><p class="p1">Отец встал на колени и запустил руку под голову зверя. Сильным движением он извлек и показал, чтобы все видели, отломанный отросток рога, мокрый от крови.</p><p class="p1">Внезапное молчание вдруг окутало отряд. Люди в смятении глядели на рог, никто не осмеливался заговорить. Даже Бран ощутил их страх, хотя не мог понять его причины.</p><p class="p1">Отец отбросил рог в сторону и вытер руки.</p><p class="p1">— Удивительно, что она протянула достаточно долго и успела ощениться, — сказал он мрачным голосом, разрывая молчание.</p><p class="p1">— Необязательно, — ответил Джори. — Говорят… словом, сука могла умереть раньше, чем появились щенки.</p><p class="p1">— Рожденные от мертвой, — заметил другой мужчина. — Счастья не будет.</p><p class="p1">— Не важно, — сказал Халлен. — Их все равно ждет смерть.</p><p class="p1">Бран испустил крик досады.</p><p class="p1">— Тогда чем скорее, тем лучше, — согласился Теон Грейджой, доставая меч. — Давай эту тварь сюда, Бран.</p><p class="p1">Кроха прижалась к нему, словно могла услышать и понять слова.</p><p class="p1">— Нет! — отчаянно выкрикнул Бран. — Он мой.</p><p class="p1">— Убери-ка меч, Грейджой, — сказал Робб, и в голосе его прозвучала отцовская повелительная нотка, напомнив о том, что когда-нибудь и он станет властным лордом. — Надо сохранить этих щенков.</p><p class="p1">— Этого нельзя делать, мальчик, — отвечал Харвин, сын Халлена.</p><p class="p1">— Милосердие велит убить их, — добавил Халлен.</p><p class="p1">В поисках поддержки Бран повернулся к лорду-отцу, но получил в ответ лишь хмурый, озабоченный взгляд.</p><p class="p1">— Халлен говорит правду, сын. Лучше быстрая смерть, чем медленная от холода и голода.</p><p class="p1">— Нет! — Бран ощутил, как слезы наполняют глаза, и отвернулся. Он не хотел плакать перед отцом.</p><p class="p1">Робб упрямо сопротивлялся.</p><p class="p1">— Рыжая сука сэра Родрика ощенилась на прошлой неделе, — сказал он. — Помет невелик, в живых осталось лишь два щенка. У нее хватит молока.</p><p class="p1">— Она разорвет их на части, когда они попытаются сосать.</p><p class="p1">— Лорд Старк, — проговорил Джон, обращаясь к отцу с непривычной официальностью. Бран поглядел на него с отчаянной надеждой. — Всего щенков пять. Трое кобельков, две суки.</p><p class="p1">— Ну и что из этого, Джон?</p><p class="p1">— У вас пятеро законных детей, — сказал Джон. — Трое сыновей, две дочери. Лютоволк — герб вашего дома. Эти щенки предназначены судьбой вашим детям, милорд.</p><p class="p1">Бран заметил, как лицо отца переменилось, все вокруг обменялись взглядами. В этот миг он любил Джона всем сердцем. Даже в свои семь лет Бран понял, на что пошел его брат. Счет сошелся лишь потому, что Джон исключил себя. Оставив девочек и даже младенца Рикона, но не посчитав себя самого — бастарда, носящего фамилию Сноу. Закон северных земель предписывает называться так любому несчастному, которому не выпала удача родиться с собственным именем.</p><p class="p1">Отец это прекрасно понял.</p><p class="p1">— Разве ты не хотел бы взять щенка и себе, Джон? — спросил он негромко.</p><p class="p1">— Отец, лютоволк украшает знамена Старков, — сказал Джон, — а я не Старк.</p><p class="p1">Лорд-отец задумчиво посмотрел на Джона. Робб торопливо попытался заполнить напряженное молчание.</p><p class="p1">— Я сам выкормлю щенка, — пообещал он. — Обмакну полотенце в теплое молоко и дам ему пососать.</p><p class="p1">— Я тоже! — отозвался Бран.</p><p class="p1">Лорд Старк внимательно поглядел на своих сыновей.</p><p class="p1">— Легко сказать, труднее сделать. Я не хочу, чтобы вы тратили время своих слуг на пустяки. Если вам нужны щенки, кормите их сами. Понятно?</p><p class="p1">Бран ретиво закивал. Щенок пошевелился в его руке, лизнул в лицо теплым языком.</p><p class="p1">— Вы должны и воспитать их, — сказал отец. — Только самостоятельно. Псарь не подойдет к этим чудовищам, я это обещаю. И пусть боги помогут вам, если вы забросите их, озлобите и плохо обучите. Такой пес не станет молить подачки, его нельзя будет отбросить пинком. Лютоволк способен запросто отхватить человеку руку, как пес перегрызает крысу. Вы уверены, что хотите этого?</p><p class="p1">— Да, отец, — отвечал Бран.</p><p class="p1">— Да, — согласился Робб.</p><p class="p1">— Невзирая на все ваши старания, щенки могут умереть.</p><p class="p1">— Они не умрут, — обещал Робб. — Мы не допустим этого.</p><p class="p1">— Пусть тогда живут. Джори, Десмонд, заберите остальных щенков. Пора возвращаться в Винтерфелл.</p><p class="p1">Только когда все поднялись в седло и взяли с места, Бран позволил себе ощутить сладкий вкус победы. К тому времени его щенок уже устроился под кожаной одеждой, в тепле и безопасности. Бран все думал о том, как назвать его. На половине моста Джон внезапно остановился.</p><p class="p1">— Что такое, Джон? — спросил лорд-отец.</p><p class="p1">— Вы не слышите?</p><p class="p1">Бран слышал голос ветра в ветвях, стук копыт по доскам железного дерева, скулеж голодного щенка, но Джон внимал чему-то другому.</p><p class="p1">— Там, — сказал Джон. Развернув коня, он направился галопом через мост.</p><p class="p1">Все видели, как он спешился, наклонился над мертвой волчицей. И мгновение спустя направился назад улыбаясь.</p><p class="p1">— Наверное, отполз в сторону от остальных, — проговорил Джон.</p><p class="p1">— Или его прогнали, — сказал отец, глядя на последнего щенка, белого в отличие от серых сестер и братьев. Глаза его были красны, как кровь того оборванца, что умер этим утром. Бран удивился тому, что именно этот щенок уже открыл глаза, когда все остальные еще оставались слепыми.</p><p class="p1">— Альбинос, — с сухим удивлением сказал Теон Грейджой. — Этот умрет даже быстрее, чем все остальные.</p><p class="p1">Джон Сноу одарил воспитанника своего отца долгим холодным взглядом.</p><p class="p1">— Едва ли, Грейджой, — возразил он. — Этот принадлежит мне.</p></span>
