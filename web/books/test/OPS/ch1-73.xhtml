<p class="p">Джон</p>
</div><p class="p1">Кобыла негромко заржала, когда Джон Сноу натянул удила.</p><p class="p1">— Полегче, милая леди, — проговорил он негромко, успокаивая лошадь прикосновением. Ветер шептал в конюшне, холодное мертвенное дыхание холодило лицо, но Джон ни на что не обращал внимания. Он привязал свой сверток к седлу, покрытые шрамами пальцы остались жесткими и неловкими.</p><p class="p1">— Призрак, — позвал Джон негромко. — Ко мне. — И волк оказался рядом. Глаза его светились угольками.</p><p class="p1">— Джон, пожалуйста, не делай этого.</p><p class="p1">Сноу поднялся в седло, взял поводья и повернул коня мордой к ночи. В дверях конюшни стоял Сэмвел Тарли, полная луна светила за его плечами, отбрасывая тень, казалось бы, принадлежащую гиганту, колоссальную и черную.</p><p class="p1">— Убирайся с моей дороги, Сэм.</p><p class="p1">— Джон, нельзя этого делать, — сказал Сэм. — Я не пущу тебя!</p><p class="p1">— Я предпочел бы не причинять тебе боль, — ответил ему Джон. — Отойди, Сэм, иначе я затопчу тебя.</p><p class="p1">— Не надо. Послушай меня. Не надо…</p><p class="p1">Джон ударил шпорами, и кобыла бросилась к двери. Мгновение Сэм стоял на месте, круглое лицо его разом сделалось бледнее повисшей сзади луны. Рот его от удивления расширился кружком. В самый последний момент он отпрыгнул вбок — в чем Джон и не сомневался, — споткнулся и упал. Кобыла перепрыгнула через него и направилась в ночь.</p><p class="p1">Джон поднял капюшон своего тяжелого плаща и дал лошади волю. Черный замок безмолвствовал в тишине. Призрак топал рядом. Позади на Стене дежурили люди, он знал это, но глаза их были обращены на север, а не на юг. Никто не увидит, как он уехал; только Сэм Тарли, пытающийся подняться на ноги в пыли старой конюшни. Он надеялся, что Сэм не получил повреждений при падении. Тяжелый и неловкий, он мог сломать кисть или вывихнуть лодыжку, убираясь с пути.</p><p class="p1">— Я же предостерегал его, — негромко сказал Джон. — Мои дела не имеют к нему никакого отношения. — Отъехав, он принялся разминать свою обожженную руку, разжимая и сжимая покрытые шрамами пальцы. Они еще болели, но все-таки без бинтов было приятнее. Лунный свет серебрил далекие горы, он скакал по извилистой ленте Королевского тракта. Нужно отъехать от Стены как можно дальше, прежде чем там поймут, что он бежал. Утром он оставит дорогу и поедет напрямик через поле, кустарники и ручьи, чтобы сбить с толку погоню, но сейчас скорость была важнее обмана. Впрочем, они легко могли понять, куда он направился.</p><p class="p1">Старый Медведь привык подниматься с рассветом, поэтому Джону следовало до первых лучей солнца оставить между собой и Стеной как можно больше лиг… если только Сэм Тарли не предаст его. Толстяк был верен своим обязанностям и легко пугался, но любил Джона как брата. Когда его будут допрашивать, Сэм, вне сомнения, расскажет правду, но Джон не мог представить себе, чтобы друг его попросил стражу возле Королевской башни срочно разбудить Мормонта.</p><p class="p1">Когда Джон не принесет из кухни Старому Медведю завтрак, они заглянут в его келью и увидят на постели Длинный Коготь. С мечом было трудно расстаться, однако Джон не настолько забыл про честь, чтобы взять с собой такое оружие. Даже Джорах Мормонт, спасаясь бегством, не сделал этого. Вне сомнения, лорд Мормонт отыщет для такого клинка более достойного наследника. На душе Джона стало скверно, когда он подумал о старике. Он знал, что бегством своим сыплет соль на незажившую рану, оставленную позором сына. Выходило, что Джон не оправдал доверия, но этого нельзя было избежать. Как бы он ни поступил сейчас, Джон все равно кого-нибудь да предавал. Даже теперь он не знал, так ли поступает, как должен был сделать честный человек. Южанам легче, у них есть септоны, которые могут посоветовать, сообщить волю богов, отделить правое от ошибочного. Но Старки поклонялись богам старым и безымянным, и если сердце-дерево и слышало, оно не отвечало.</p><p class="p1">Когда последние огни Черного замка исчезли позади него, Джон перевел кобылу на шаг. Ему предстояла дальняя дорога, и проделать ее нужно было на одной лошади. Вдоль южной дороги встречались остроги и сельские поселки, где он мог бы при необходимости обменять свою кобылу на свежего коня; однако туда она должна добраться невредимой.</p><p class="p1">Еще надо постараться найти себе одежду, скорее всего придется украсть ее. Джон был во всем черном с головы до пят. Высокие кожаные меховые сапоги, грубые домотканые брюки, туника, кожаный жилет без рукавов и тяжелый шерстяной плащ. Ножны длинного меча и кинжал были покрыты черной кротовьей шкуркой, а кольчуга и бармица, что лежат в седельной суме, сплетены из черных колец. Один только лоскут подобного облачения после побега грозил ему смертью на месте. Одетого в черное незнакомца в каждом селении к северу от Перешейка рассматривали с холодной подозрительностью, а его скоро начнут разыскивать. Как только мейстер Эйемон разошлет воронов, тихой пристани для него не найдется. Даже в Винтерфелле. Бран-то, может, и впустил бы его, но у мейстера Лювина больше здравого смысла. Он заложит ворона и отошлет незваного гостя подальше — как и следует поступить. Так что домой лучше не заезжать вовсе. Джон видел родной замок своим внутренним оком, словно бы оставил его только вчера. Могучие гранитные стены, великий чертог, пропахнувший дымом, собаками и жареным мясом. Солярий отца, его спальню в башне. Части души его ничего не хотелось так сильно, как вновь услышать смех Брана, съесть испеченный Гейджем пирог с беконом и говядиной, послушать сказку старухи Нэн о Детях Леса и Флорианушке-дурачке.</p><p class="p1">Но он бежал со Стены вовсе не для этого. Он поступил так потому лишь, что в конце концов он — сын своего отца и брат Роббу. Дареный меч, даже столь прекрасный, как Длинный Коготь, не превратил его в Мормонта. И в Эйемона Таргариена. Старик выбирал три раза и все три раза предпочел честь, но так выбрал и он сам. Даже теперь Джон не знал, остался ли мейстер на Стене потому, что был слаб и труслив, или же потому, что был доблестен и силен. И все же Джон понимал старика, утверждавшего, что знает боль такого выбора, он понимал это, пожалуй, чересчур хорошо.</p><p class="p1">Тирион Ланнистер говорил, что люди обычно предпочитают отрицать жестокую правду, не принимают ее, но зачем ему-то обманывать себя; ему, Джону Сноу, бастарду и проклятому клятвопреступнику, не знающему ни матери, ни друзей. Остаток своей жизни, какой бы короткой она ни оказалась, он вынужден провести человеком, чужим для всех, безмолвным обитателем теней, не смеющим назвать свое собственное имя. И чтобы проехать все Семь Королевств, он вынужден будет лгать — иначе всякий вправе поднять на него руку. Но все это безразлично, лишь бы жизни его хватило, чтобы, став рядом с братом, суметь отомстить за отца.</p><p class="p1">Он вспомнил, как прощался с Роббом; снежинки, таявшие на золотисто-рыжих волосах брата. Придется посетить его тайно — прикинувшись кем-то другим. Джон попытался представить себе то выражение, которое появится на лице Робба, когда он откроет себя. Брат тряхнет головой и улыбнется… а скажет… что же он скажет…</p><p class="p1">Нет, улыбки его Джон представить не мог, невзирая на все старания. Он вспомнил дезертира, которого отец обезглавил в тот день, когда они нашли лютоволков.</p><p class="p1">— Ты произнес слова, — сказал ему тогда лорд Эддард. — Ты дал обет перед Черными Братьями и богами — старыми и новыми.</p><p class="p1">Десмонд и Толстый Том поволокли человека к колоде. Бран смотрел на происходящее круглыми, как блюдца, глазами, и Джону пришлось напомнить, чтобы тот не забыл про поводья. Он вспомнил выражение на лице отца, когда Теон Грейджой поднес ему Лед; вспомнил алую струю, хлынувшую в снег; и то, как Теон пнул голову, подкатившуюся к его ногам.</p><p class="p1">Интересно, как поступил бы лорд Эддард, окажись дезертиром его брат Бенджен, а не незнакомый оборванец. Повел бы он себя по-другому? Конечно, да… И Робб, бесспорно, обрадуется ему! Обрадуется или…</p><p class="p1">Но об этом лучше не думать. Боль пронзила пальцы, когда он стиснул поводья. Джон ударил пятками в бока кобылы и погнал ее галопом по Королевскому тракту, словно стремясь ускакать от сомнений. Смерти Джон не боялся, но ему не хотелось умирать связанным и обезглавленным, как обычный разбойник. Если ему суждено погибнуть, он встретит смерть с мечом в руке, сражаясь с убийцами отца. Пусть он никогда не был настоящим Старком, но тем не менее способен умереть как подобает. Чтобы потом сказали, что у Эддарда Старка было четверо сыновей, а не трое!</p><p class="p1">Призрак держался вровень с ними почти полмили, вывалив красный язык изо рта. Но когда человек и конь склонили головы и Джон попросил лошадь прибавить шагу, волк быстро отстал, остановился, наблюдая, поблескивая красными в лунном свете глазами. Зверь исчез позади, но Джон знал, что лютоволк догонит его обязательно.</p><p class="p1">Впереди по обе стороны дороги среди деревьев замелькала россыпь огней. Кротовый городок. Пока Джон ехал через него, залаял пес, да мул завозился в конюшне, но и только. Из-за ставен пробивались лучики света, но таких окон было совсем мало.</p><p class="p1">Кротовый городок был много больше, чем могло показаться на первый взгляд; три четверти его располагалось под землей — теплые подземелья соединял лабиринт тоннелей. Внизу находился и публичный дом, на поверхности оставался лишь небольшой сарайчик с подвешенным над дверью красным фонарем. Он слышал, как люди на Стене называли шлюх «погребенными сокровищами». Интересно бы знать, ищет ли сегодня кто-нибудь из Черных Братьев эти самоцветы; тоже клятвопреступление, но на него никто не обращает внимания.</p><p class="p1">Джон замедлил ход, лишь проехав селение. К этому времени и он, и кобыла покрылись потом. Он спешился, ежась, обожженная рука горела. Под деревом льдинка замерзшей канавы отражала лунный свет, вода сочилась из-под нее, образуя небольшие мелкие лужицы. Джон присел на корточки и зачерпнул ладонями. Талая вода была холодной как лед. Попив, он умыл лицо, щеки его загорелись, пальцы дергало — они уже давно так не болели, в голове грохотало. «Я поступаю правильно, — сказал он себе, — так почему же мне так плохо?»</p><p class="p1">Лошадь и без того была в мыле, поэтому Джон взял узду и повел ее шагом. Здесь ширины тракта едва хватало, чтобы по нему могли проехать рядом два всадника; поверхность дороги прорезали крошечные ручейки, загромождали мелкие камни. Его ночная скачка была истинной глупостью, стремлением сломать себе шею. Джон удивился, что это вступило в него. Зачем он так торопился к смерти?</p><p class="p1">Поодаль среди деревьев испуганно вскрикнуло какое-то существо. Кобыла тревожно заржала. Неужели его волк отыскал для себя добычу? Джон поднес руку ко рту и выкрикнул:</p><p class="p1">— Призрак! Призрак, ко мне. — Но ответили ему только забившие совиные крылья.</p><p class="p1">Хмурясь, Джон продолжил свой путь. С полчаса он вел кобылу в поводу, пока она не высохла. Призрак не появлялся. Джону хотелось сесть в седло, но его тревожило, что волк отстал.</p><p class="p1">— Призрак, — окликал он снова и снова. — Где ты? Ко мне! Призрак!</p><p class="p1">В этих лесах нет зверя, опасного для лютоволка, пусть даже еще и не совсем взрослого, если только… нет, у Призрака хватит ума не дразнить медведя! Ну а если бы его окружила волчья стая, Джон, вне сомнения, услышал бы вой.</p><p class="p1">Он решил поесть. Еда успокоит его желудок, да и Призрак успеет догнать их. Опасности в этом не было: в Черном замке еще спали. В переметной суме он отыскал сухарь, кусок сыра и небольшое побуревшее, морщинистое яблоко. Еще он прихватил себе с кухни солонины и бекона, но мясо лучше приберечь до завтра. Потом придется охотиться, и это замедлит его продвижение. Джон сел под деревьями и съел хлеб и сыр, кобыла отправилась пастись к тракту. Яблоко он оставил напоследок. Оно чуточку размякло, но мякоть оставалась сочной и вкусной. Джон уже дошел до огрызка, когда с севера послышался топот копыт. Джон торопливо вскочил и направился к кобыле. Можно ли ускакать от них? Едва ли, всадники уже слишком близко, и, конечно же, они услышат его, ну а если они из Черного замка…</p><p class="p1">Он повел кобылу с дороги за частый клин сизо-зеленых страж-деревьев.</p><p class="p1">— Тихо ты, — прикрикнул он на лошадь, пригибаясь, чтобы поглядеть сквозь ветви. Если боги будут добры к нему, всадники поедут мимо. Скорее всего это кто-нибудь из Кротового городка отправился в поле, хотя что там делать посреди ночи?</p><p class="p1">Джон прислушивался… топот копыт становился все громче и громче. Судя по звуку, всадников было пятеро или шестеро. Голоса уже доносились из-за деревьев.</p><p class="p1">— …уверен, что он отправился в эту сторону?</p><p class="p1">— Мы не можем быть в этом уверены.</p><p class="p1">— Конечно, он мог бежать на восток или пуститься напрямик, оставив тракт. Так бы я поступил.</p><p class="p1">— Это ночью-то? Глупо. Тот, кто не свалится с коня и не сломает себе шею, заблудится и окажется у Стены, когда солнце взойдет.</p><p class="p1">— А я бы поступил иначе, — услышал он голос Гренна. — Я бы поехал прямо на юг; юг можно найти и по звездам.</p><p class="p1">— А когда небо облачное? — спросил Пип.</p><p class="p1">— Тогда бы я не поехал.</p><p class="p1">Вступил другой голос:</p><p class="p1">— А знаете, куда бы направился я, если бы речь шла обо мне? В Кротовый городок, поискать под землею сокровищ.</p><p class="p1">Пронзительный смех пронесся под деревьями. Кобыла Джона фыркнула.</p><p class="p1">— Тихо, — приказал Халдер. — Похоже, я что-то слышал.</p><p class="p1">— Где? А я ничего не слышу. — Лошади остановились.</p><p class="p1">— Ты не услышишь, даже когда пернешь!</p><p class="p1">— Ну это я всегда слышу, — настаивал Гренн.</p><p class="p1">— Тихо!</p><p class="p1">Все они молча прислушивались. Джон невольно задержал дыхание. Сэмова работа. Он не стал будить Старого Медведя, но и не отправился в постель, а поднял друзей. Проклятие! Если на рассвете их не увидят в постели, всех объявят дезертирами. Что они, собственно говоря, собираются здесь делать?</p><p class="p1">Глухое молчание продолжалось. Из своего укрытия Джон видел копыта их коней. Наконец заговорил Пип:</p><p class="p1">— А что ты слышал?</p><p class="p1">— Не знаю, — признался Халдер. — Звук. Мне показалось, что это лошадь…</p><p class="p1">— Здесь никого нет.</p><p class="p1">И тут уголком глаза Джон заметил бледную тень, мелькнувшую между деревьев. Зашелестели листья, и Призрак выскочил из тьмы так внезапно, что кобыла Джона вздрогнула и заржала.</p><p class="p1">— Здесь он! — крикнул Халдер.</p><p class="p1">— Я тоже слыхал!</p><p class="p1">— Предатель! — обругал Джон лютоволка, вскакивая в седло. Он бросился прочь от дороги, но его нагнали, не успел он проехать и десяти футов.</p><p class="p1">— Джон! — крикнул ему в спину Пип.</p><p class="p1">— Останавливай! — прокричал Гренн. — Ты не сумеешь ускакать от всех нас!</p><p class="p1">Джон обернулся лицом к ним, извлекая меч.</p><p class="p1">— Возвращайтесь, я не хочу крови, но, если придется, я пойду и на это.</p><p class="p1">— Один против семерых? — Халдер дал знак. Юноши разъехались, окружая его.</p><p class="p1">— Чего вы хотите от меня? — фыркнул Джон.</p><p class="p1">— Мы хотим, чтобы ты вернулся туда, где должен быть, — крикнул Пип.</p><p class="p1">— Я должен быть рядом со своим братом!</p><p class="p1">— Теперь мы все — твои братья, — сказал Гренн.</p><p class="p1">— Тебе отрубят голову, если поймают. Ты это знаешь. — Жаба нервно хохотнул. — Такую глупость мог бы выкинуть один только Зубр.</p><p class="p1">— Такого и я не натворю, — сказал Гренн. — Я не клятвопреступник; я произнес слова и выполню их.</p><p class="p1">— Я тоже так думал, — ответил Джон. — Ну неужели вы не понимаете? Они убили моего отца! Сейчас на юге война, и мой брат Робб сражается в Речных землях…</p><p class="p1">— Мы знаем, — торжественно проговорил Пип. — Сэм рассказал нам все.</p><p class="p1">— Нам жаль твоего отца, — произнес Гренн. — Но это ничего не значит. Ты дал клятву и теперь не можешь уехать отсюда, что бы там ни случилось.</p><p class="p1">— Но я должен, — лихорадочно проговорил Джон.</p><p class="p1">— Ты сказал слова, — напомнил ему Пип. — Теперь начинается моя стража, так ты говорил, и она не кончится до моей смерти…</p><p class="p1">— И в жизни и в смерти я останусь на своем посту, — добавил Гренн.</p><p class="p1">— Не надо повторять, я помню эти слова не хуже вас. — Теперь он уже сердился. Почему они не могут оставить его в покое? Только все усложняют.</p><p class="p1">— Я — меч во тьме, — нараспев произнес Халдер.</p><p class="p1">— И дозорный на Стене, — вставил Жаба.</p><p class="p1">Джон обругал их — прямо в лицо. Никто не обратил внимания.</p><p class="p1">Пип направил коня поближе, продолжая:</p><p class="p1">— Я — огонь, который ограждает от холода, свет, который приносит рассвет, рог, который пробуждает спящих, щит, который охраняет счастье людей…</p><p class="p1">— Остановитесь, — проговорил Джон, замахиваясь мечом. — Прошу тебя, Пип. — На них не было даже панцирей, можно изрубить их в куски — если заставят.</p><p class="p1">Матхар, заехав за его спину, присоединился к общему хору:</p><p class="p1">— Я отдаю свою жизнь и честь Ночному Дозору…</p><p class="p1">Джон пнул кобылу, поворачивая ее кругом. Мальчишки окружали его, охватывая со всех сторон.</p><p class="p1">— И в этой ночи… — Халдер подъехал слева.</p><p class="p1">— И во всех грядущих, — дополнил Пип и потянулся к удилам кобылы Джона. — Так что решай, будешь рубить меня, или все едем назад.</p><p class="p1">Джон поднял меч… и бессильно опустил его…</p><p class="p1">— Проклятие, — буркнул он. — Проклятые вы!</p><p class="p1">— Нам связать тебе руки или ты дашь слово, что с миром вернешься назад? — спросил Халдер.</p><p class="p1">— Я не убегу, если ты хочешь слышать это. — Призрак выскочил из-за деревьев, и Джон яростно поглядел на него. — Ничего себе помощничек, — сказал он. Глубокие красные глаза с сочувствием глядели на него.</p><p class="p1">— Надо бы поторопиться, — сказал Пип. — Если мы не вернемся к первому свету, Старый Медведь снимет головы со всех нас.</p><p class="p1">Возвращаясь, Джон не замечал дороги. Она теперь показалась ему короче, чем его путешествие на юг, быть может, потому, что мысли его бродили сейчас в иных местах. Пип задавал темп, он то галопировал, то пускал лошадь шагом или рысью, то снова срывался в галоп. Приблизился и остался позади Кротовый городок, красную лампу над дверью борделя давно погасили. Кони скакали быстро, и до рассвета оставался еще один час, когда Джон заметил впереди башни Черного замка, проступившие на фоне колоссальной ледяной стены. Но на этот раз они не показались ему домом.</p><p class="p1">«Пусть сегодня меня привезли назад, — сказал себе Джон, — но никто не может заставить меня остаться». Война не закончится завтра или послезавтра; друзья все равно не сумеют следить за ним день и ночь. Он будет дожидаться своего мгновения, пусть они думают, что он решил остаться на Стене… Ну а потом, когда они ослабят бдительность, он попытается бежать снова. Но в следующий раз не по Королевскому тракту. Он направится вдоль Стены на восток, скорее всего до самого моря; путь будет дольше, но безопасней. А может быть, лучше повернуть на запад к горам, а потом уже направиться к югу через высокогорные перевалы? Путь этот — путь одичалых — опасен и суров, но там по крайней мере его не будут преследовать. И он не подойдет ни к Винтерфеллу, ни к Королевскому тракту даже на сотню лиг…</p><p class="p1">Сэмвел Тарли ожидал их в старой конюшне, устроившись в сене. Тревога помешала ему уснуть. Поднявшись, толстяк отряхнулся.</p><p class="p1">— Я… я рад, что они нашли тебя, Джон.</p><p class="p1">— А я — нет, — сказал Джон, спешившись.</p><p class="p1">Пип соскочил с коня и с отвращением поглядел на светлеющее небо.</p><p class="p1">— Пригляди за конями, Сэм, — сказал невысокий юноша. — Впереди целый день, а мы даже не вздремнули по милости лорда Сноу.</p><p class="p1">Когда день забрезжил, Джон, как всегда, направился прямо в кухню. Трехпалый Хоб, ничего не говоря, выдал ему завтрак для Старого Медведя. В тот день это были три бурых яйца, сваренных вкрутую, поджаренный хлеб, кусок ветчины и чаша сморщенных слив. Джон направился с пищей в Королевскую башню. Мормонт сидел возле окна, лорд-командующий писал. Ворон расхаживал взад и вперед по его плечам, бормотал:</p><p class="p1">— Зерна, зерна, зерна…</p><p class="p1">Когда Джон вошел, птица вскрикнула.</p><p class="p1">— Оставь еду на столе, — сказал Старый Медведь, поглядев на него. — И налей пива.</p><p class="p1">Открыв ставни, Джон достал бутыль с пивом, стоявшую снаружи на подоконнике, и налил в рог. Хоб дал ему лимон, еще холодный после Стены. Джон раздавил плод в руке, сок побежал по его пальцам. Мормонт каждый день пил пиво с лимоном и объявлял, что именно это позволило ему сохранить зубы в целости.</p><p class="p1">— Вне сомнения, ты любил своего отца, — сказал Мормонт, когда Джон принес ему рог. — Нас губит именно то, что мы любим. Помнишь, я уже говорил тебе это?</p><p class="p1">— Помню, — угрюмо сказал Джон. Он не хотел разговаривать о смерти отца, даже с Мормонтом.</p><p class="p1">— Постарайся не забыть этих слов. Жестокую истину труднее всего принять. Подай-ка мне тарелку. Опять ветчина? Ладно. Ну и вид у тебя сегодня. Ночная езда-то утомляет.</p><p class="p1">Горло Джона пересохло.</p><p class="p1">— Вы знаете?</p><p class="p1">— Знает, — отозвался ворон с плеч Мормонта. — Знает.</p><p class="p1">Старый Медведь фыркнул:</p><p class="p1">— Неужели ты считаешь, что меня выбрали лордом-командующим Ночного Дозора за то, что я туп, как полено? Эйемон сказал мне, что ты уедешь. Я ответил ему, что ты вернешься. Я знаю своих людей. Честь заставила тебя ступить на Королевский тракт, честь и повернула назад.</p><p class="p1">— Это сделали мои друзья, — проговорил Джон.</p><p class="p1">— Разве я сказал — твоя собственная честь? — Мормонт поглядел на тарелку.</p><p class="p1">— Они убили моего отца, и вы ожидаете, что я буду сидеть здесь?</p><p class="p1">— Откровенно говоря, мы ожидали, что ты поступишь именно так. — Мормонт взял сливу, выплюнул косточку. — Я приказал следить за тобой. Люди видели, как ты уезжал. Если бы не твои братья, тебя бы перехватили по пути другие — на этот раз не друзья. Разве что у твоей лошади есть крылья, как у ворона? Или все-таки есть?</p><p class="p1">— Нет. — Джон ощущал себя круглым дураком.</p><p class="p1">— Жаль, такая лошадь пригодилась бы нам.</p><p class="p1">Джон выпрямился. Он сказал себе, что умрет с честью — по крайней мере на это он способен.</p><p class="p1">— Я знаю, какое наказание положено за дезертирство, милорд. Я не боюсь умереть.</p><p class="p1">— Умереть! — отозвался ворон.</p><p class="p1">— Не побоишься и жить, я надеюсь, — проговорил Мормонт, отрезая кинжалом кусок ветчины. Подав мясо птице, он сказал: — Ты еще не дезертировал… пока. Ты стоишь передо мной. Если бы мы казнили каждого парня, который ночью удирал в Кротовый городок, то на Стене давно уже остались бы одни только призраки. Но ты, наверное, надеешься бежать завтра или через две недели, так? Ты на это надеешься, парень?</p><p class="p1">Джон молчал.</p><p class="p1">— Так я и думал. — Мормонт колупнул скорлупу яйца. — Отец твой погиб, парень. Как, по-твоему, можешь ты вернуть его назад?</p><p class="p1">— Нет, — ответил Джон мрачным голосом.</p><p class="p1">— Хорошо, — продолжил Мормонт. — Мы с тобой видели, какими возвращаются мертвые. Второй раз я бы не хотел этого увидеть!</p><p class="p1">В два глотка проглотив яйцо, Мормонт вытащил застрявший между зубов кусочек скорлупы.</p><p class="p1">— Брат твой вывел в поле все силы Севера. У каждого из его лордов-знаменосцев больше мечей, чем насчитывается во всем Ночном Дозоре. С чего это ты решил, что они нуждаются в твоей помощи? Или ты великий витязь, или в кармане у тебя сидит грамкин, способный зачаровать твой меч?</p><p class="p1">У Джона не было ответа на эти слова. Ворон клевал яйцо, разламывая скорлупу. Потом просунул клюв в дырку, начал вытаскивать кусочки белка и желтка.</p><p class="p1">Старый Медведь вздохнул:</p><p class="p1">— Война эта задела не тебя одного. Хочу я того или нет, но сестра моя Мейдж идет в войске твоего брата, она отправилась на войну вместе с дочерьми, надев мужские доспехи… старая, вредная, упрямая, раздражительная и похотливая. Откровенно говоря, я едва могу терпеть эту поганку, но тем не менее любовь моя к ней не меньше, чем твоя любовь к сводным сестрам.</p><p class="p1">Хмурясь, Мормонт взял последнее яйцо и сжал его в кулаке так, что хрустнула скорлупа.</p><p class="p1">— Ладно, наверное, меньше. Пусть так, но мне будет горько, если она погибнет. Но я тем не менее не сбегу отсюда. Я дал клятву, произнес слова, как сделал и ты. Мое место здесь, а где твое место, парень?</p><p class="p1">«У меня нет места, — хотел ответить Джон. — Я бастард. У меня нет прав, нет имени, нет матери, нет теперь даже отца». Слова не шли.</p><p class="p1">— Не знаю.</p><p class="p1">— А я знаю, — покачал головой лорд-командующий Мормонт. — Задувают холодные ветры, Сноу; за Стеной удлинились тени. Коттер Пайк пишет об огромных стадах лосей, уходящих на юг и на восток, и о мамонтах, появившихся в лесу. Он говорит, что один из его людей видел чудовищные следы в трех лигах от Восточного Дозора. Разведчики из Сумеречной башни обнаруживают заброшенные деревни, а по ночам, утверждает сир Денис, в горах пылают костры, огромные, не гаснущие от заката и до рассвета. Куорен Полурукий взял пленника в глубинах Ущелья, и человек этот клянется, что Манс-налетчик собирает весь свой люд в какой-то неведомой нам новой тайной твердыне, а зачем — одни боги знают. Неужели ты думаешь, что твой дядя Бенджен оказался единственным разведчиком, которого мы потеряли в прошлом году?</p><p class="p1">— Бенджен, — каркнул ворон, покачивая головой, кусочки яйца разлетались из клюва. — Бен Джен. Бен Джен…</p><p class="p1">— Нет, — ответил Джон. Исчезали и другие, их было слишком много.</p><p class="p1">— И неужели ты думаешь, что война твоего брата будет важнее нашей? — рявкнул старик.</p><p class="p1">Джон прикусил губу. Ворон захлопал крыльями.</p><p class="p1">— Война, война, война, война…</p><p class="p1">— Это не так, — сказал Мормонт. — Одни боги могут спасти нас, парень; ты ведь не слеп и не глух. Когда мертвяки выходят охотиться по ночам, неужели же важно, кто будет сидеть на Железном троне?</p><p class="p1">— Нет. — Джон даже не думал об этом.</p><p class="p1">— Твой лорд-отец отослал тебя к нам. Почему, ты знаешь это?</p><p class="p1">— Почему? Почему? Почему? — отозвался ворон.</p><p class="p1">— Вот и я могу только сказать, что в жилах Старков течет кровь Первых Людей. Первые Люди построили Стену; говорят, они и сейчас помнят вещи, забытые остальными. А этот твой зверь… он привел нас к мертвякам и предупредил тебя об убитом на лестнице. Сир Джареми, вне сомнения, назвал бы это случайностью, но сир Джареми мертв, а я нет.</p><p class="p1">Лорд Мормонт наколол кусочек ветчины на острие кинжала.</p><p class="p1">— Я думаю, что твое место именно здесь; там, за Стеной, мне потребуетесь и ты, и твой волк.</p><p class="p1">От этих слов восторг побежал по спине Джона.</p><p class="p1">— За Стеной?</p><p class="p1">— Я намереваюсь отыскать Бена Старка, живым или мертвым. — Мормонт пожевал и проглотил. — Я не буду кротко дожидаться здесь прихода снегов и ледяных ветров, мы должны знать, что происходит. На этот раз Ночной Дозор выйдет во всей своей силе — против Короля за Стеной, Иных… любого, кто встанет на нашем пути. Я сам поведу войско. — Он указал кинжалом в сторону Джона. — По обычаю стюард лорда-командующего является и его сквайром; однако, просыпаясь, я должен быть уверен в том, что ты не убежал ночью. Поэтому я требую от вас ответа, лорд Сноу, и я получу его именно сейчас. Кто ты: Брат Ночного Дозора… или мальчишка-бастард, который решил поиграть в войну?</p><p class="p1">Джон снова распрямился, глубоко вздохнул.</p><p class="p1">«Простите меня, отец, Робб, Арья, Бран, простите меня… я не могу помочь вам. Он прав. Место мое здесь».</p><p class="p1">— Я… ваш, милорд. Я — ваш человек. Клянусь. Я больше не убегу!</p><p class="p1">Старый Медведь фыркнул:</p><p class="p1">— Хорошо. А теперь ступай, надень свой меч.</p></span>
