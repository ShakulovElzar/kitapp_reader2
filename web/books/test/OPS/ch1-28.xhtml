<span id="id26"><div class="title2">
<p class="p">Эддард</p>
</div><p class="p1">— Смерть лорда Аррена глубоко опечалила всех нас, милорд, — проговорил великий мейстер. — И я буду рад поведать всем то, что знаю об этом. Садитесь же. Хотите подкрепиться? Быть может, вам угодно фиников? У меня есть великолепная хурма. Увы, вино теперь возмущает мое пищеварение, но я могу предложить вам чашу подслащенного медом мороженого молока. На такой жаре оно освежает.</p><p class="p1">Жара действительно угнетала. Нед ощущал, что шелковая рубашка липнет к его груди. Густой влажный воздух покрывал город, словно мокрое шерстяное одеяло. Возле реки царил беспорядок: беднота оставила свои жаркие, лишенные воздуха обиталища и устроилась спать у воды, где только и можно было вздохнуть.</p><p class="p1">— Это будет весьма любезно с вашей стороны, — отвечал Нед усаживаясь.</p><p class="p1">Большим и указательным пальцами Пицель приподнял крохотный серебряный колокольчик и негромко позвонил. Стройная молодая служанка торопливо вошла в солярий.</p><p class="p1">— Мороженого молока для королевской десницы и для меня самого; будь добра, деточка, сделай послаще.</p><p class="p1">Девушка отправилась за питьем, а великий мейстер сплел пальцы вместе и опустил ладони на чрево.</p><p class="p1">— Простонародье утверждает, что последний год лета всегда бывает самым жарким. Это далеко не так, однако порой народные поверья оказываются справедливыми. В подобные дни я завидую вам, северянам, привыкшим к летнему снегу. — Тяжелая, усыпанная драгоценными камнями цепь на шее старика мягко звякнула, когда он переменил позу. — Конечно, лето Мейекара было жарче этого и лишь немного короче. Даже в Цитадели находились дураки, предполагавшие, что пришло наконец великое лето, которое никогда не закончится, но на седьмой год вышел срок и ему, и после короткой осени на нас обрушилась жуткая долгая зима. Летняя жара была кошмарной. Старый город днями исходил по́том и варился в тени; он оживал только ночью, мы гуляли в садах возле реки и спорили о бегах. Я помню запах этих ночей, милорд, — духи и пот; помню дыни, лопавшиеся от спелости, персики и гранаты, ночные тени и лунный свет. Тогда я был молодым человеком, и цепь моя еще ковалась. Жара не утомляла меня так, как сейчас. — Тяжелые веки прикрывали глаза Пицеля, он казался почти уснувшим. — Извините меня, лорд Эддард. Вы явились сюда не для того, чтобы слушать дурацкие воспоминания о лете, закончившемся еще до рождения вашего отца. Простите старческую болтливость, если сумеете. Ум — словно меч: старый клинок рассыпается ржавчиной. А вот и молоко. — Служанка поставила между ними блюдо, и Пицель улыбнулся ей: — Милая девочка! — Он приподнял чашу, попробовал и кивнул. — Благодарю, можешь идти.</p><p class="p1">Когда девица ушла, Пицель обратил к Неду свои бледные, выцветшие, в прожилках глаза.</p><p class="p1">— Итак, о чем мы говорили? Ах да! Вы спрашивали о лорде Аррене…</p><p class="p1">— Да. — Нед вежливо пригубил ледяное молоко, оно приятно холодило горло, но на его вкус казалось чересчур сладким.</p><p class="p1">— Откровенно говоря, десница некоторое время казался непохожим на самого себя, — проговорил Пицель. — Мы много лет заседали вместе в совете, и знаки были вполне очевидны, но я относил их на счет великой тяжести, которую лорд Аррен так долго и верно нес. На его широкие плечи легли все тяготы королевства. Более того, сын его вечно болел, а леди-жена так волновалась за мальчика, что не отпускала его от себя. Уже этого достаточно, чтобы утомить даже крепкого человека, а лорд Джон был не слишком молод. Поэтому я не удивлялся его усталости и грусти. Так мне казалось в то время, но сейчас я менее уверен в прошлом. — Он затряс головой.</p><p class="p1">— А что вы сможете сказать мне о его последней болезни?</p><p class="p1">Великий мейстер развел руки жестом беспомощной печали.</p><p class="p1">— Однажды он явился ко мне и попросил некую книгу, крепкий и здоровый как всегда, хотя мне и показалось, что какая-то мысль глубоко тревожит его. А на следующее утро он уже корчился от боли и не мог подняться с постели. Мейстер Колемон решил, что он застудил желудок. Погода была жаркой, и десница часто употреблял вино со льдом, что могло расстроить пищеварение. Лорд Джон продолжал слабеть, и я отправился к нему сам, но боги не даровали мне сил, чтобы спасти его.</p><p class="p1">— Я слыхал, что вы отослали мейстера Колемона?</p><p class="p1">Утвердительный кивок великого мейстера совершился медленно и непреклонно — как движение ледника.</p><p class="p1">— Да, так я поступил тогда и, боюсь, что леди Лиза никогда не простит мне этого. Возможно, я ошибался, но в то время я не видел лучшего выхода. Мейстер Колемон для меня словно сын, и я никогда не позволил бы себе усомниться в его способностях, но он был еще так молод! А молодые нередко не понимают всей хрупкости старого тела. Он очищал организм лорда Аррена слабительными настоями и перечным соком, и я побоялся, что такое лечение может убить больного.</p><p class="p1">— Может быть, лорд Аррен что-нибудь говорил в последние часы своей жизни?</p><p class="p1">Пицель нахмурил чело.</p><p class="p1">— На последней стадии лихорадки десница несколько раз произнес имя «Роберт», но кого он звал — короля или сына, я сказать не могу. Леди Лиза не позволяла мальчику входить к больному, чтобы он не заразился. Король пришел и несколько часов просидел возле постели, занимая лорда Джона разговором и надеясь шутками подбодрить его. Король просто был полон сострадания!</p><p class="p1">— И это все? Какими были последние слова лорда Аррена?</p><p class="p1">— Увидев, что надежд больше нет, я дал деснице маковое молоко, чтобы избавить его от мук. Но перед тем, как закрыть глаза в последний раз, лорд Джон что-то шепнул королю и своей жене и благословил своего сына. «Крепкое семя», — проговорил он. А потом его речь сделалась слишком неразборчивой, чтобы ее можно было понять. Смерть пришла лишь следующим утром, но лорд Джон находился в глубоком забытьи. Он более не открыл уст.</p><p class="p1">Нед еще раз глотнул молока, пытаясь подавить отвращение к приторному питью.</p><p class="p1">— А вы не находили в смерти лорда Аррена чего-нибудь неестественного?</p><p class="p1">— Неестественного? — переспросил древний мейстер едва ли не шепотом. — Нет, я бы так не сказал. Смерть всегда приносит с собою скорбь, но на свой собственный лад она — самое естественное событие из всех, приключающихся с человеком, лорд Эддард. Джон Аррен теперь упокоился с миром, избавившись от своих тягот.</p><p class="p1">— А как насчет болезни, которая унесла его? — проговорил Нед. — Приключалось ли нечто подобное с другими людьми?</p><p class="p1">— Почти сорок лет я был великим мейстером Семи Королевств, — проговорил Пицель. — Под нашим добрым королем Робертом, и под предшественником его Эйерисом Таргариеном, и отцом его Джейехерисом Вторым, помню даже несколько коротких месяцев правления отца Джейехериса — Эйегона Удачливого, милорд. Но скажу вам одно: каждый случай не похож на другие, и все они как один. Смерть лорда Джона была не страннее любой другой.</p><p class="p1">— Его жена полагает иначе.</p><p class="p1">Великий мейстер кивнул:</p><p class="p1">— Теперь я вспомнил, вдова Джона Аррена является сестрой вашей благородной жены, но простите старику прямолинейность; горе может повергнуть в смятение даже могучий и дисциплинированный ум, каковым леди Лиза, увы, не обладает. После последних неудачных родов она видела врагов в каждой тени, а смерть лорда-мужа вывела ее из равновесия.</p><p class="p1">— Итак, вы вполне уверены в том, что Джон Аррен умер от внезапной хвори?</p><p class="p1">— Да, — ответил Пицель серьезным голосом. — Что же еще могло явиться причиной этой смерти, как не болезнь, мой добрый лорд?</p><p class="p1">— Яд, — негромко предположил Нед.</p><p class="p1">Сонные глаза Пицеля разом открылись. Древний мейстер неуютно поежился на своем месте.</p><p class="p1">— Возмутительная мысль. У нас не Вольные Города, где подобные преступления нередки. Великий мейстер Эйтельмур писал, что все люди лелеют убийство в своем сердце, но и тогда отравитель не достоин даже пренебрежения. — Он помолчал мгновение, погрузившись в думу. — Ваше предположение вполне допустимо, милорд, однако я сомневаюсь. Распознать яды может каждый деревенский мейстер, а лорд Аррен не обнаруживал признаков отравления. Кроме того, десницу любили все. Только чудовище, воплотившееся в человеческую плоть, осмелилось бы отравить столь благородного лорда.</p><p class="p1">— Говорят, что яд — это оружие женщины.</p><p class="p1">Пицель задумчиво погладил бороду.</p><p class="p1">— Так говорят. Женщины, труса… и евнуха. — Он прокашлялся и сплюнул на тростник густой ком мокроты. Вверху громко каркнул ворон. — Лорд Варис был рожден рабом в Лисе, вы знаете это? Не доверяйте паукам, милорд.</p><p class="p1">Подобных слов можно было и не говорить. От присутствия Вариса по плоти всегда бежали мурашки.</p><p class="p1">— Я запомню ваши слова, мейстер. Благодарю вас за помощь. Похоже, я отнял у вас достаточно много времени. — Лорд Эддард встал.</p><p class="p1">Великий мейстер Пицель с трудом, медленно поднялся из кресла и проводил Неда до двери.</p><p class="p1">— Надеюсь, я некоторым образом помог вашему уму избавиться от тяжести. Если я смогу помочь вам чем-нибудь еще, стоит лишь попросить.</p><p class="p1">— Еще одна вещь, — проговорил Нед. — Мне хотелось бы посмотреть книгу, которую вы одолжили Джону перед его внезапной болезнью.</p><p class="p1">— Боюсь, что вы найдете ее неинтересной, — проговорил Пицель. — Этот увесистый том великий мейстер Маллеон посвятил родословиям великих домов.</p><p class="p1">— И все же мне хотелось бы посмотреть его.</p><p class="p1">Старик открыл дверь.</p><p class="p1">— Ну, как угодно. Книга у меня где-то здесь. Когда я найду ее, то прикажу немедленно доставить прямо в ваши палаты.</p><p class="p1">— Вы в высшей степени любезны, — ответил Нед и, словно бы вдруг припомнив, проговорил: — Кстати, не позволите ли вы мне задать самый последний вопрос? Вы упомянули, что король находился возле смертного одра лорда Аррена. Интересно, а сопутствовала ли ему королева?</p><p class="p1">— Вовсе нет, — покачал головой Пицель. — Она вместе с детьми как раз отъехала на Бобровый утес в обществе своего отца. Лорд Тайвин прибыл в город вместе со свитой на турнир в честь именин принца Джоффри и, вне сомнения, рассчитывал, что его сын Джейме завоюет венец чемпиона, но ему пришлось перенести жестокое разочарование. Мне выпало отослать королеве слово о внезапной кончине лорда Аррена. Никогда не отсылал я птицу с более тяжелым сердцем.</p><p class="p1">— Черные крылья, черные слова, — пробормотал Нед. Пословицу эту старая Нэн часто повторяла, когда он был мальчишкой.</p><p class="p1">— Так говорят рыбацкие женки, — согласился великий мейстер Пицель. — Но мы знаем, что так бывает отнюдь не всегда. Когда птица мейстера Лювина принесла весть о вашем Бране, каждое верное сердце в замке возрадовалось, разве не так?</p><p class="p1">— Благодарю вас, мейстер.</p><p class="p1">— Боги милостивы. — Пицель склонил голову. — Приходите ко мне почаще, лорд Эддард. Я здесь, чтобы служить.</p><p class="p1">«Да, — подумал Нед, закрывая за собой дверь, — но кому?»</p><p class="p1">Возвращаясь в свои покои, он застал Арью на ступенях винтовой лестницы башни Десницы. Она крутила руками, как ветряная мельница, пытаясь застыть на одной ноге. К грубому камню прикасались босые ноги. Нед остановился и поглядел на нее.</p><p class="p1">— Арья, что ты делаешь?</p><p class="p1">— Сирио говорит, что водяной плясун может стоять на одном пальце несколько часов. — Девочка замахала руками, потеряв равновесие.</p><p class="p1">Неду пришлось улыбнуться.</p><p class="p1">— На каком пальце? — поддразнил он.</p><p class="p1">— На любом, — отвечала взволнованная вопросом Арья. Она перепрыгнула с правой ноги на левую, опасно покачнувшись, прежде чем восстановить равновесие.</p><p class="p1">— Неужели это нужно делать именно здесь? — спросил он. — Падать по ступенькам далеко и больно.</p><p class="p1">— Сирио говорит, что водяной плясун никогда не падает. — Она опустила ногу и встала на обе. — Отец, а Бран приедет и будет жить вместе с нами?</p><p class="p1">— Не скоро, моя милая, — отвечал он. — Нужно, чтобы силы сперва вернулись к нему.</p><p class="p1">Арья прикусила губу.</p><p class="p1">— А что будет делать Бран, когда он вырастет?</p><p class="p1">Нед нагнулся к ней.</p><p class="p1">— Чтобы найти ответ на этот вопрос, у него еще достаточно лет впереди. А нам пока достаточно знать, что он будет жить. — Той ночью из Винтерфелла прилетела птица, и Эддард Старк отвел девочек в здешнюю богорощу — выходящий на реку уголок, заросший вязом, ольхой и высоким тополем. Сердцем здесь был огромный дуб, древние его конечности оплела ползучая жимолость; все вместе они склонились перед ним, принося благодарность, как перед чардревом. Санса уснула, лишь взошла луна, Арья только через несколько часов свернулась на траве под плащом Неда. Все ночные часы он один стерег дочерей. Наконец над городом рассвело, и темно-красные цветки драконьего зева окружили лежащих девочек.</p><p class="p1">— Мне снился Бран, — шепнула Санса. — Он улыбался.</p><p class="p1">— Он собирался стать рыцарем, — сказала Арья. — Рыцарем Королевской гвардии. А Бран может стать рыцарем?</p><p class="p1">— Нет, — отвечал Нед, не считая необходимым обманывать дочь. — Со временем он, наверное, сделается владетелем большой крепости и будет заседать среди советников короля. А может быть, станет зодчим, будет возводить замки подобно Брандону-Строителю, или уплывет на корабле через Закатное море, или примет веру твоей матери и станет верховным септоном.</p><p class="p1">Но ему никогда не бежать возле своего волка, подумал он со скорбью слишком глубокой, чтобы ее можно было выразить словами. Не лечь рядом с женщиной и не обнять своего сына.</p><p class="p1">Арья наклонила голову набок.</p><p class="p1">— А я могу стать советником короля, возводить замки или стать верховным септоном?</p><p class="p1">— Ты, — отвечал Нед, поцеловав ее в лоб, — выйдешь замуж за короля и будешь править его замком, а твои сыновья станут рыцарями, принцами, лордами, может, среди них будет и верховный септон.</p><p class="p1">Арья скривилась.</p><p class="p1">— Нет, — сказала она. — Все это суждено Сансе. — Поджав правую ногу, она встала на левую. Нед вздохнул и оставил дочь.</p><p class="p1">Оказавшись в своей палате, Нед стянул взмокший от пота шелк и плеснул на голову холодной воды из чаши, стоявшей возле постели. Элин вошел, когда он вытирал лицо.</p><p class="p1">— Милорд, — проговорил он, — явился лорд Бейлиш и просит аудиенции.</p><p class="p1">— Проводи его в мой солярий, — кивнул Нед, протягивая руку за свежей рубахой, скроенной из самого легчайшего полотна, которое он смог отыскать. — Я немедленно приму его.</p><p class="p1">Когда Нед вошел, Мизинец сидел у окна и следил за рыцарями Королевской гвардии, фехтовавшими внизу во дворе.</p><p class="p1">— Если бы ум старика Селми был столь же быстр, как его клинок, — заметил он задумчивым голосом, — заседания нашего совета проходили бы намного живее…</p><p class="p1">— Сир Барристан — человек доблестный и почтенный, как никто в Королевской Гавани. — Нед привык уважать состарившегося седоволосого лорда-командующего Королевской гвардией.</p><p class="p1">— И скучен как никто, — добавил Мизинец, — хотя, на мой взгляд, его ждет удача в турнире. В прошлом году он выбил из седла Пса, а победителем был всего лишь четыре года назад.</p><p class="p1">Вопрос о том, кто может победить в турнире, ни в какой мере не интересовал Эддарда Старка.</p><p class="p1">— Я полагаю, ваш визит имеет причину, лорд Петир, или же вы просто хотите насладиться видом из моего окна?</p><p class="p1">Мизинец улыбнулся:</p><p class="p1">— Я обещал Кет помочь вам в вашем расследовании и сделал это.</p><p class="p1">Нед растерялся. Обещал или не обещал, но он не мог найти в себе сил довериться лорду Петиру Бейлишу, чересчур уж скорому мыслью.</p><p class="p1">— У вас есть для меня что-нибудь?</p><p class="p1">— Кто-нибудь, — поправил Мизинец. — Точнее говоря, четыре души. Вам не пришло в голову опросить слуг покойного десницы?</p><p class="p1">Нед нахмурился.</p><p class="p1">— Если бы я смог это сделать! Леди Аррен увезла всю свою челядь назад в Орлиное Гнездо. — Да, Лиза ничем не помогла ему. — Все приближенные ее мужа бежали вместе с ней.</p><p class="p1">— Большая часть, — поправил Мизинец. — Но не все. Несколько человек осталось. Беременная кухарка спешно вышла замуж за одного из конюхов лорда Ренли, помощник конюшего перешел в городской дозор, горшечник был прогнан за кражу, остался и сквайр лорда Аррена.</p><p class="p1">— Его сквайр? — Нед был приятно удивлен, сквайры нередко бывали хорошо осведомлены о делах и обстоятельствах своих господ.</p><p class="p1">— Это сир Хью из Долины, — назвал имя Мизинец. — Король возвел мальчика в рыцари после смерти лорда Аррена.</p><p class="p1">— Надо послать за ним и всеми остальными, — сказал Нед.</p><p class="p1">Мизинец вздрогнул.</p><p class="p1">— Милорд, прошу вас, подойдите к окну.</p><p class="p1">— Зачем?</p><p class="p1">— Подойдите, я кое-что покажу вам, милорд.</p><p class="p1">Хмурясь, Нед подошел к окну. Петир Бейлиш сделал небрежный жест.</p><p class="p1">— Видите на той стороне двора в дверях арсенала мальчишку, сидящего на ступенях и полирующего меч оселком?</p><p class="p1">— Ну и что?</p><p class="p1">— Это доносчик Вариса. Паук весьма интересуется и вашей особой, и всеми вашими делами. — Мизинец шевельнулся. — А теперь поглядите на стену над конюшней. Видите гвардейца, спрятавшегося за зубец?</p><p class="p1">Нед заметил его.</p><p class="p1">— Еще один из шептунов евнуха?</p><p class="p1">— Нет. Этот служит королеве. Отметим, что он наслаждается прекрасным видом на дверь этой башни, чтобы лучше видеть, кто к вам приходит. Есть и другие, многих из которых не знаю даже я; Красный замок полон соглядатаев. Почему, по-вашему, мне пришлось спрятать Кет в борделе?</p><p class="p1">Эддард Старк не имел склонности к подобным интригам.</p><p class="p1">— Седьмое пекло! — выругался он. Казалось, что человек на стене следит именно за ним. С внезапной неуверенностью Нед отошел от окна. — Неужели в этом проклятом городе все кому-то доносят?</p><p class="p1">— Едва ли, — отвечал Мизинец. Он принялся откладывать пальцы на руке. — Молчим мы с вами… король… Хотя, если подумать, король слишком много рассказывает королеве, и я не столь уж уверен в вас. — Он поднялся. — Есть ли среди ваших людей человек, которому вы полностью доверяете?</p><p class="p1">— Да, — отвечал Нед.</p><p class="p1">— В таком случае у меня есть в Валирии великолепный дворец, который я готов уступить вам недорого, — промолвил Мизинец с насмешливой улыбкой. — Лучше бы вы ответили отрицательно, милорд, но пусть будет так. Пошлите эту вашу доверенную персону к сиру Хью и ко всем остальным. За вами следят, но даже Варис-паук не сможет проследить за всеми, кто служит вам. — Он направился к двери.</p><p class="p1">— Лорд Петир, — окликнул его Нед. — Я… благодарен вам за помощь. Быть может, я ошибся в своей недоверчивости.</p><p class="p1">Мизинец провел пальцем по остроконечной бородке.</p><p class="p1">— Вы плохой ученик, лорд Эддард. Проявив ко мне недоверие, вы сделали самый мудрый поступок из всех, совершенных вами в Королевской Гавани.</p></span>
