<p class="p">Эддард</p>
</div><p class="p1">— Они нашли ее, милорд.</p><p class="p1">Нед торопливо поднялся.</p><p class="p1">— Чьи люди нашли ее — наши или Ланнистеров?</p><p class="p1">— Это сделал Джори, — сообщил управляющий Вейон Пуль. — Она цела.</p><p class="p1">— Слава богам, — проговорил Нед. Его люди разыскивали Арью уже четыре дня, искали ее и люди королевы. — Где она? Прикажи Джори немедленно привести ее ко мне.</p><p class="p1">— Прошу прощения, милорд, — пояснил Пуль. — У ворот караулили люди Ланнистеров, и они известили королеву, когда Джори привел ее. Арью взяли прямо пред королевские очи.</p><p class="p1">— Проклятая баба, — проговорил Нед, подходя к двери. — Найди Сансу, пусть придет в палату для аудиенции, возможно, потребуется ее голос.</p><p class="p1">В страшной ярости спускался он по ступеням башни. Он и сам искал свою дочь, не уснув даже на час после исчезновения Арьи. Этим утром сердце Неда стиснула такая усталость, что он едва мог стоять, но теперь ярость вернула ему силы.</p><p class="p1">Во дворе замка люди окликали его, но Нед, торопясь, не замечал их. Он побежал бы, но, оставаясь десницей короля, должен был соблюдать достоинство. Он видел взгляды, которыми его провожали; недоуменные голоса бормотали, гадая, что он будет делать.</p><p class="p1">Они находились в скромном замке, в половине дня езды на юг от Трезубца. Отряд короля нежданно нагрянул к его владельцу сиру Реймену Дарри, пока Арью и сына мясника разыскивали по обоим берегам реки. Нагрянул нежданно и нежеланно. Сир Реймен жил в мире под рукой короля, но родичи его воевали под драконьими знаменами Рейегара возле Трезубца, трое его старших братьев погибли там, о чем не забыл ни сам Роберт, ни сир Реймен. И когда люди короля, Дарри, Ланнистеров и Старков набились в тесный замок, отношения накалились.</p><p class="p1">Король присвоил себе приемный зал сира Реймена, где и нашел его Нед. Палата была уже полна, когда он ворвался внутрь. Слишком полна, решил он. Оставшись вдвоем с Робертом, они могли бы уладить вопрос миром.</p><p class="p1">Роберт горбился в высоком сиденье Дарри в дальнем конце зала. Лицо его казалось замкнутым и мрачным. Серсея Ланнистер и сын ее стояли возле него. Королева опиралась на плечо Джоффри. Плотная шелковая повязка до сих пор покрывала руку мальчика.</p><p class="p1">Арья стояла посреди комнаты одна, если не считать Джори Касселя; все глаза были обращены к ней.</p><p class="p1">— Арья! — громко окликнул дочь Нед и направился к ней, стуча сапогами по каменному полу. Увидев его, она заплакала навзрыд.</p><p class="p1">Нед опустился на колено и обнял дочь. Она тряслась.</p><p class="p1">— Мне так жаль, — прорыдала она. — Так жаль, так жаль.</p><p class="p1">— Я знаю, — отвечал он. Она казалась такой крошечной в его руках, просто маленькая неряшливая девчонка. Трудно понять, как она могла вызвать столько хлопот. — Ты ранена?</p><p class="p1">— Нет. — Слезы бежали по грязному лицу, оставляя полоски на щеках. — Только голодна. Я ела ягоды, но ничего больше не нашла.</p><p class="p1">— Скоро мы тебя накормим, — обещал Нед.</p><p class="p1">Поднявшись, он стал лицом к королю.</p><p class="p1">— Что значит все это? — Глаза его обежали комнату, отыскивая дружелюбные лица. Если не считать его собственных людей, таких было немного. Сир Реймен Дарри словно замкнулся в себе. На лице лорда играла полуулыбка, способная прикрыть все что угодно. Старый сир Барристан сохранял серьезность, остальные были Ланнистеры, и они глядели враждебно. Повезло ему лишь в одном: Джейме Ланнистер и Сандор Клиган отсутствовали здесь, потому что возглавляли поиски к северу от Трезубца.</p><p class="p1">— Почему мне не доложили, что нашли мою дочь? — вопросил Нед звонким голосом. — Почему ее немедленно не доставили ко мне?</p><p class="p1">Он обращался к Роберту, но ответила Серсея Ланнистер:</p><p class="p1">— Как ты смеешь так разговаривать со своим королем!</p><p class="p1">Король шевельнулся.</p><p class="p1">— Тихо, женщина, — сказал он, поворачиваясь на своем сиденье. — Прости, Нед, я не хотел пугать девочку. Просто мне показалось, что лучше привести ее сюда и быстрее покончить с делом.</p><p class="p1">— С каким это делом? — Нед добавил льда в свой голос.</p><p class="p1">Королева шагнула вперед.</p><p class="p1">— Ты прекрасно знаешь, Старк! Это твоя девица напала на моего сына. Она и парень мясника. А этот ее зверь попытался оторвать Джоффри руку!</p><p class="p1">— Это не так, — громко возразила Арья. — Она только укусила его, потому что он делал больно Мике.</p><p class="p1">— Джофф поведал нам, что произошло, — сказала королева. — Ты и сын мясника били его дубинками, а потом напустили своего волка.</p><p class="p1">— Это было не так, — проговорила Арья, едва сдерживая слезы. Нед опустил руки на ее плечи.</p><p class="p1">— Неправда! — настаивал принц Джоффри. — Они напали на меня, и она выбросила Львиный Зуб в реку! — Нед заметил, что он не глядит на Арью.</p><p class="p1">— Лжец! — завопила Арья.</p><p class="p1">— Заткнись! — закричал на нее принц.</p><p class="p1">— Довольно! — в гневе взревел король, поднимаясь с места. Наступило молчание. Глаза его над густой бородой яростно впились в Арью. — А теперь, дитя, расскажи мне, как все случилось, во всех подробностях и правдиво. Лгать королю — великий грех. — Потом король поглядел на своего сына. — Когда она закончит, наступит твой черед. До тех пор попридержи язык.</p><p class="p1">Когда Арья начала свою повесть, Нед услышал, как позади растворилась дверь. Он оглянулся назад и увидел, что в зал вошла Санса и тихо остановилась позади, услыхав голос Арьи. Когда Арья стала описывать, как зашвырнула меч Джоффри на самую середину Трезубца, Ренли Баратеон расхохотался. Король немедленно ощетинился:</p><p class="p1">— Сир Барристан, выставите моего брата из зала, прежде чем он задохнется.</p><p class="p1">Лорд Ренли справился со смехом.</p><p class="p1">— Мой брат слишком добр, я и сам сумею найти дверь. — Он поклонился Джоффри. — Быть может, потом вы, принц, сумеете объяснить мне, как девятилетняя девочка ростом с мокрую крысу смогла разоружить вас, орудуя одной палкой от метлы, и забросить меч на середину реки. — Как только дверь закрылась за Ренли, Нед услыхал его голос с той стороны: — Львиный Зуб! — За этими словами вновь послышался хохот.</p><p class="p1">Принц Джоффри, побледнев, начал излагать собственную версию событий. Когда сын его завершил речь, король тяжко поднялся с сиденья, напоминая человека, желающего оказаться где угодно, только не здесь.</p><p class="p1">— И что же, во имя семи преисподних, я должен сейчас решить? Он говорит одно, девчонка другое…</p><p class="p1">— Присутствовали не только они, — сказал Нед. — Санса, подойди сюда. — Нед выслушал ее версию событий в ночь исчезновения Арьи и узнал правду. — Расскажи нам, что случилось.</p><p class="p1">Старшая дочь лорда Старка неуверенно шагнула вперед. Она была одета в синий бархат с белой строчкой, на ее шее висела серебряная цепь. Густые золотистые волосы были расчесаны до блеска. Санса моргнула сестре, потом молодому принцу.</p><p class="p1">— Не знаю, — проговорила она голосом, полным слез, всем видом выражая желание выбежать отсюда. — Я ничего не помню. Все произошло так быстро, что я не успела…</p><p class="p1">— Ах ты, дрянь! — воскликнула Арья. Она стрелой бросилась на сестру и, повалив Сансу на пол, принялась колотить ее. — Врунья, врунья, врунья, врунья!</p><p class="p1">— Арья, прекрати! — закричал Нед. Джори стащил брыкающуюся девочку с сестры. Бледная Санса тряслась, когда Нед поднял ее на ноги. — Тебе не больно? — спросил он, но Санса глядела на Арью и словно не слышала его.</p><p class="p1">— Эта девица столь же дика, как и ее грязная животина, — проговорила Серсея Ланнистер. — Роберт, я хочу, чтобы ее наказали.</p><p class="p1">— Седьмое пекло! — огрызнулся король. — Серсея, погляди на нее. Это ребенок, или ты хочешь, чтобы я приказал прогнать ее кнутом по улицам? Обычная детская драка, все закончено, все целы.</p><p class="p1">Королева была в ярости:</p><p class="p1">— Эти шрамы навсегда останутся на теле Джоффри.</p><p class="p1">Роберт Баратеон поглядел на своего старшего сына.</p><p class="p1">— Да, это так. И быть может, они научат его кое-чему. Нед, проследи, чтобы твою дочь наказали. Я сделаю то же с моим сыном.</p><p class="p1">— Охотно, светлейший государь, — ответил Нед с огромным облегчением.</p><p class="p1">Роберт повернулся к трону, но королева еще не закончила.</p><p class="p1">— А как насчет лютоволка? — окликнула она короля. — Что будет с тварью, которая изуродовала твоего сына?</p><p class="p1">Король остановился, повернулся, нахмурился.</p><p class="p1">— Я забыл об этом.</p><p class="p1">Нед видел, как напряглась Арья в руках Джори, и тот быстро проговорил:</p><p class="p1">— Светлейший государь, мы не нашли даже следа лютоволка.</p><p class="p1">Роберт не обнаружил ни малейших признаков расстройства.</p><p class="p1">— Нет? Ну, ладно.</p><p class="p1">Королева возвысила голос:</p><p class="p1">— Даю сотню золотых драконов тому, кто принесет мне его шкуру!</p><p class="p1">— Дорогая будет шкура, — пробормотал Роберт. — Я в этом не участвую, женщина. Можешь покупать себе меха на деньги Ланнистеров.</p><p class="p1">Королева наделила его холодным взглядом.</p><p class="p1">— Я не думала, что ты такое ничтожество. Король, за которого я выходила, положил бы волчью шкуру на мою постель, прежде чем взойдет солнце.</p><p class="p1">Лицо Роберта потемнело от гнева.</p><p class="p1">— Сущие пустяки, если волка нет.</p><p class="p1">— Волк у нас, — проговорила Серсея Ланнистер голосом весьма спокойным. В зеленых глазах ее светился триумф.</p><p class="p1">Все какое-то мгновение осознавали ее слова, но потом король раздраженно повел плечами.</p><p class="p1">— Как угодно. Пусть сир Илин займется им!</p><p class="p1">— Роберт, нельзя ли обойтись без этого? — проговорил Нед.</p><p class="p1">Король более не желал спорить.</p><p class="p1">— Довольно, Нед. Не желаю ничего больше слушать. Лютоволк — свирепый зверь. Рано или поздно он порвет твою собственную девицу не хуже, чем моего сына. Заводи ей собаку, и все будет в порядке.</p><p class="p1">Санса только тут наконец поняла, что происходит. Испуганные глаза ее обратились к отцу.</p><p class="p1">— Но ведь он же говорит не про Леди, так ведь? — Она увидела подтверждение на лице Неда. — Нет, — сказала она. — Нет, только не Леди. Леди никого не кусает, она хорошая…</p><p class="p1">— Леди там не было! — гневно крикнула Арья. — Оставьте ее в покое.</p><p class="p1">— Останови их, — молила Санса. — Зачем так поступать? Пожалуйста, при чем тут Леди, это сделали Нимерия с Арьей, ты не можешь допустить этого, это была не Леди, не позволяй им убивать Леди. Она будет хорошей, я обещаю, обещаю… — Санса заплакала.</p><p class="p1">Неду оставалось только покрепче обнять плачущую дочь. Он глядел через комнату на Роберта, старинного друга, более близкого ему, чем любой брат.</p><p class="p1">— Прошу тебя, Роберт, не разбивай любви, которую ты ко мне питаешь. Ради твоей любви к моей покойной сестре, прошу тебя.</p><p class="p1">Король долго глядел на них, а потом обратил взгляд к жене.</p><p class="p1">— Проклятие на твою голову, Серсея, — сказал он с ненавистью.</p><p class="p1">Нед встал, мягко высвободившись из объятий Сансы. Вся усталость минувших четырех дней возвратилась к нему.</p><p class="p1">— Тогда ты сам сделай это, Роберт, — отрезал он голосом холодным как сталь. — Во всяком случае, имей отвагу сделать это своей рукой.</p><p class="p1">Король поглядел на Неда мертвыми глазами и вышел, не говоря ни слова, шаги его были тяжелы как свинец. Молчание наполнило зал.</p><p class="p1">— А где лютоволк? — спросила Серсея Ланнистер, когда муж ее вышел. Принц Джоффри стоял возле нее и улыбался…</p><p class="p1">— Тварь на цепи возле воротной сторожки, ваша светлость, — не без колебаний ответил сир Барристан Селми.</p><p class="p1">— Пошлите за Илином Пейном.</p><p class="p1">— Нет, не надо, — возразил Нед. — Джори, отведи девочек в их комнаты и принеси мне Лед. — Слова застревали в горле, он вытолкнул их. — Если так надо, я сам сделаю это.</p><p class="p1">Серсея Ланнистер с подозрением поглядела на него.</p><p class="p1">— Вы, Старк? Может, это какой-нибудь подвох? Почему вы хотите сделать такую вещь?</p><p class="p1">Все уставились на него, но взгляд Сансы резал.</p><p class="p1">— Волчица эта родом с севера и заслуживает лучшей участи, чем смерть от руки мясника.</p><p class="p1">Он вышел из комнаты — глаза ело, рыдания дочери отдавались в ушах — и нашел волчицу там, где ее привязали. Нед посидел возле нее немного.</p><p class="p1">— Леди, — проговорил он, пробуя имя на вкус. Он никогда не уделял особого внимания тем именам, которые выбрали дети, но, поглядев на волчицу, понял теперь, что Санса дала ей подходящую кличку. Леди была самой маленькой и самой симпатичной во всем помете, самой доброй и доверчивой. Волчица глядела на него ясными золотыми глазами, и он взлохматил густой серый мех.</p><p class="p1">Тут Джори принес ему Лед.</p><p class="p1">Когда все было закончено, он сказал:</p><p class="p1">— Выбери четверых людей и отправь их вместе с телом на север. Похороните ее в Винтерфелле.</p><p class="p1">— Зачем так далеко? — спросил удивленный Джори.</p><p class="p1">— Затем, — подтвердил распоряжение Нед, — чтобы Ланнистерша никогда не получила этой шкуры.</p><p class="p1">Он направился к башне, чтобы наконец отоспаться, когда Сандор Клиган и его всадники прогрохотали сквозь ворота замка, возвращаясь со своей охоты.</p><p class="p1">Через круп коня Сандора было переброшено что-то тяжелое… тело, обернутое кровавым плащом.</p><p class="p1">— Твоей дочери мы не нашли, десница, — скрежетнул Пес. — Но день провели не напрасно. Мы добыли ее приятеля. — Протянув руку назад, он сбросил свою ношу, упавшую прямо перед Недом. Согнувшись, тот отвернул плащ, страшась тех слов, которые придется искать для Арьи, но перед ним оказалась не Нимерия, а сын мясника, Мика. Тело его, покрытое запекшейся кровью, было перерублено почти пополам — от плеча до поясницы — тяжелым, нанесенным сверху ударом.</p><p class="p1">— Значит, загнал его, — сказал Нед.</p><p class="p1">Глаза Пса блеснули сквозь стальное забрало жуткой собачьей морды.</p><p class="p1">— Он бежал. — Сандор поглядел в глаза Неда и расхохотался. — Но недостаточно быстро.</p></span>
