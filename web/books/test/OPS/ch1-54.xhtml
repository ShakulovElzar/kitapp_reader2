<span id="id52"><div class="title2">
<p class="p">Санса</p>
</div><p class="p1">За Сансой они пришли на третий день.</p><p class="p1">Она выбрала простое платье из темно-серой шерсти с богатой вышивкой на воротнике и рукавах. Пальцы ее, вдруг сделавшиеся толстыми и неловкими, пытались справиться с серебряными застежками без помощи служанок. Джейни Пуль оставалась вместе с ней, но на ее помощь рассчитывать было нечего. Лицо Джейни опухло от слез, она безутешно оплакивала отца.</p><p class="p1">— А я уверена, что с твоим отцом все в порядке, — сказала ей Санса, сумев наконец застегнуть платье. — Я попрошу королеву, чтобы она тебе разрешила встретиться с ним. — Санса думала, что добротой сумеет подбодрить Джейни, но та, подняв на нее красные опухшие глаза, лишь сильней залилась слезами. Какое она еще дитя!</p><p class="p1">Санса тоже поплакала в первый день. Трудно было не испугаться, когда началось побоище, даже здесь, в крепких стенах крепости Мейегора, за запертой и заложенной дверью. Звон стали во дворе давно сделался привычным для ее уха, едва ли один день жизни Сансы проходил без того, чтобы она не слыхала лязга мечей, однако на этот раз сражение было взаправдашним, что совершенно меняло дело. Она вслушивалась как никогда в своей жизни; постепенно к звону стали начали примешиваться другие звуки: стоны, гневные проклятия, призывы о помощи, стенания раненых и умирающих людей. В песнях рыцари никогда не кричали от боли и не молили о пощаде…</p><p class="p1">И она плакала, умоляя, чтобы те — за дверью — объяснили ей, что происходит, звала отца, септу Мордейн, короля и своего галантного принца. Если люди, охранявшие дверь, и слышали ее, они не отвечали. Только раз, поздно ночью, дверь отворилась, и внутрь втолкнули Джейни Пуль, побитую и трясущуюся.</p><p class="p1">— Они убивают всех, — взвизгнула дочь стюарда. Она говорила и говорила: Пес разбил ее дверь боевым молотом. На лестнице башни Десницы лежали тела, ступеньки стали скользкими от пролитой крови. Санса высушила собственные слезы и попыталась утешить подругу. Они заснули в одной постели, прижавшись друг к другу как сестры.</p><p class="p1">На второй день стало еще хуже. Комната, в которую заточили Сансу, находилась наверху самой высокой башни крепости Мейегора. Из окна она могла видеть, что тяжелая железная решетка надвратной башни опущена, а подъемный мост поднят над глубоким сухим рвом, отделявшим внутреннюю крепость от остального замка. Гвардейцы Ланнистеров расхаживали на стенах с копьями и арбалетами в руках. Сражение закончилось, могильное молчание легло на Красный замок, если не считать бесконечных рыданий и всхлипываний Джейни Пуль.</p><p class="p1">Их покормили — на завтрак дали жесткого сыра, свежевыпеченного хлеба и молока, в полдень жареных цыплят с зеленью, завершил все ужин из говядины и ячменного супа, но приносившие еду слуги не отвечали на вопросы Сансы. Вечером пришли женщины с одеждой из башни Десницы, прихватив и какие-то вещи Джейни, однако они казались почти столь же испуганными, как ее подруга, и когда Санса попыталась поговорить с ними, они бросились прочь, словно бы она была больна серой заразой. Гвардейцы, караулившие дверь снаружи, отказывались выпустить их из комнаты.</p><p class="p1">— Пожалуйста, мне нужно еще раз поговорить с королевой, — сказала им Санса, как говорила она всем в этот день. — Она захочет переговорить со мной, я знаю это. Передайте королеве, что я хочу видеть ее. Если королева занята, тогда попросите принца Джоффри. Будьте добры, мы ведь должны пожениться, когда станем старше.</p><p class="p1">На закате второго дня зазвонил огромный колокол. Голос его был глубок и звучен, низкие тягучие удары наполнили Сансу ужасом. Звон не смолкал, и спустя некоторое время ему ответили другие колокола — с башен Великой септы Бейелора, с холма Висеньи. Колокольный звон громом прокатывался над городом, предвещая грядущую грозу.</p><p class="p1">— Что это? — спросила Джейни, зажимая уши. — Почему звонят в колокола?</p><p class="p1">— Король умер. — Санса не могла сказать, как она это узнала, но сомнений она не испытывала: низкий, бесконечный звон наполнял комнату, скорбный, как погребальный напев. Неужели какой-то враг взял штурмом замок и убил короля Роберта? Неужели им пришлось быть свидетелями этого сражения?</p><p class="p1">Она отправилась спать в недоумении: беспокойная и испуганная. Неужели ее прекрасный Джоффри стал теперь королем? Или враги убили и его? Она боялась за него и за своего отца. Если бы только ей сказали, что случилось…</p><p class="p1">В эту ночь Сансе приснился Джоффри на троне; она сидела возле него в сотканной из золота мантии. На голове ее была корона, и все, кого она знала, кланялись ей, преклоняли колена и говорили любезные слова.</p><p class="p1">На следующее утро — утро третьего дня — сир Борос Блаунт из Королевской гвардии явился, чтобы проводить ее к королеве.</p><p class="p1">Сир Борос — человек уродливый, широкогрудый, с короткими кривыми ногами, плосконосый, щеки мешочками, волосы серые и колючие — сегодня был выряжен в белый бархат, а его снежный плащ был застегнут львиной брошью. Фигурка отливала ярким золотом, вместо глаз у нее были вставлены крошечные рубины.</p><p class="p1">— Сегодня вы весьма симпатичны и великолепны, сир Борос, — сказала ему Санса. Истинная леди всегда вежлива, а она решила быть настоящей дамой вне зависимости от любых обстоятельств.</p><p class="p1">— Как и вы, миледи, — отвечал сир Борос ровным голосом. — Светлейшая государыня ждет. Пойдемте со мной.</p><p class="p1">Перед дверями Серсеи стояла стража: воины Ланнистеров в пурпурных плащах и шлемах с львиными гривами. Проходя мимо, Санса заставила себя улыбнуться и пожелать им доброго утра. Она впервые оставила свою каморку, после того как сир Арис Окхарт привел ее в башню два утра назад.</p><p class="p1">— Ради твоей же безопасности, моя милая, — сказала ей тогда королева Серсея. — Джоффри никогда не простит мне, если что-нибудь случится с его драгоценной Сансой.</p><p class="p1">Санса ожидала, что сир Борос проводит ее в королевские апартаменты, но вместо этого он повел ее из крепости Мейегора. Мост был снова опущен. Какие-то работники спускали внутрь сухого рва человека на веревках. Посмотрев вниз, Санса заметила тело, повисшее на одном из огромных железных шипов. Она торопливо отвернулась, боясь спрашивать, опасаясь приглядываться, чтобы не узнать знакомого.</p><p class="p1">Королеву Серсею они нашли в палатах совета — во главе длинного стола, заваленного бумагами, свечами и брусками печатного воска. Комната была прекрасна, Санса еще не видела таких. Она с восхищением поглядела на резную деревянную ширму и пару одинаковых сфинксов, восседавших возле двери.</p><p class="p1">— Светлейшая государыня, — проговорил сир Борос, когда их впустил внутрь королевский гвардеец, сир Мендон, обладатель на удивление мертвого лица. — Я привел девушку.</p><p class="p1">Санса надеялась увидеть Джоффри, однако ее принца не было здесь, в отличие от трех советников короля. Лорд Петир Бейлиш сидел по левую сторону королевы, великий мейстер Пицель — в конце стола, распространявший цветочный аромат лорд Варис возвышался над ними. Все они были в черном, подметила Санса с ужасом. Знак траура.</p><p class="p1">На королеве было черное шелковое платье с высоким воротником, от шеи до пояса расшитое темными рубинами. Камни были огранены как слезинки, словно бы королева плакала кровью. Серсея улыбнулась вошедшей, и Санса подумала, что более сладкой и печальной улыбки она еще не видела.</p><p class="p1">— Санса, мое милое дитя, — сказала королева, — я знаю, что ты хотела видеть меня. Прости, что я не могла послать за тобой раньше. Дела еще не устроились, у меня не было даже свободной минутки. Надеюсь, мои люди хорошо позаботились о тебе?</p><p class="p1">— Все было мило и прекрасно, светлейшая государыня, благодарю вас за беспокойство, — ответила Санса вежливо. — Только никто не захотел объяснить нам, что случилось…</p><p class="p1">— Нам? — удивилась Серсея.</p><p class="p1">— Мы поместили к ней дочь стюарда, — пояснил сир Борос. — Мы не знали, что делать с ней.</p><p class="p1">Королева нахмурилась.</p><p class="p1">— В следующий раз спрашивайте, — сказала она резким голосом. — Лишь одни боги знают, какими россказнями она успела наполнить головку Сансы!</p><p class="p1">— Джейни испугана, — продолжила Санса. — Она плачет без остановки. Я обещала попросить, чтобы ей разрешили повидаться с отцом.</p><p class="p1">Старый великий мейстер Пицель потупил глаза.</p><p class="p1">— С ее отцом все в порядке, разве не так? — тревожно спросила Санса. Она знала, что произошло сражение, но какое отношение мог иметь к нему стюард? Вейон Пуль даже не носил меча…</p><p class="p1">Королева Серсея оглядела по очереди всех своих советников.</p><p class="p1">— Не надо попусту волновать Сансу. Ну, что будем делать с этой ее подружкой, милорды?</p><p class="p1">Лорд Петир наклонился вперед.</p><p class="p1">— Я отыщу для нее место.</p><p class="p1">— Только не в городе, — сказала королева.</p><p class="p1">— Вы принимаете меня за дурака?</p><p class="p1">Королева игнорировала вопрос.</p><p class="p1">— Сир Борос, проводите эту девушку в апартаменты лорда Петира и прикажите его людям охранять ее, пока он сам не придет за ней. Скажите, что Мизинец придет, чтобы отвести ее к отцу, тогда она успокоится. Я хочу, чтобы ее забрали прежде, чем Санса вернется к себе.</p><p class="p1">— Как прикажете, светлейшая, — ответил сир Борос. Отвесив низкий поклон, он развернулся на пятках и отбыл, шевельнув воздух длинным белым плащом.</p><p class="p1">Санса была в смятении.</p><p class="p1">— Не понимаю. Где отец Джейни? Почему сир Борос не может прямо отвести ее, зачем поручать это лорду Петиру?</p><p class="p1">Она обещала себе, что будет вести себя, как истинная леди, будет благородной, как королева, и сильной, как ее мать, леди Кейтилин, но теперь Сансу вновь охватил испуг. Она даже испугалась, что вот-вот зарыдает.</p><p class="p1">— Куда вы посылаете Джейни? Она не сделала ничего плохого, она — хорошая девочка.</p><p class="p1">— Она расстроила тебя, — мягко проговорила королева, — а этого нельзя допускать. И более ни слова об этом. Лорд Бейлиш приглядит за Джейни, обещаю тебе. — Она похлопала по стулу возле себя. — Садись, Санса, я хочу поговорить с тобой.</p><p class="p1">Санса уселась возле королевы. Серсея опять улыбнулась, однако тревога девочки от этого не уменьшилась. Варис тер мягкие ладони друг о друга, великий мейстер Пицель сонными глазами рассматривал бумаги, лежавшие перед ним, она ощущала на себе пристальный взгляд Мизинца, в котором было нечто такое, от чего Сансе показалось, что на ней вовсе нет одежды. На коже ее выступили мурашки.</p><p class="p1">— Милая Санса, — проговорила королева Серсея, положив легкую ладонь на ее руку, — прекрасное дитя. Надеюсь, ты понимаешь, как мы с Джоффри любим тебя.</p><p class="p1">— В самом деле? — спросила Санса, затаив дыхание. Она сразу забыла про Мизинца. Принц ее любит, все прочее ничего не значит!</p><p class="p1">Королева улыбнулась.</p><p class="p1">— Я вижу в тебе едва ли не собственную дочь. И я знаю ту любовь, которую ты питаешь к Джоффри. — Она устало качнула головой. — Увы, у нас есть неприятные вести о твоем лорде-отце. Соберись с мужеством, дитя.</p><p class="p1">Спокойные слова эти вселили в Сансу трепет.</p><p class="p1">— Что случилось?</p><p class="p1">— Твой отец — изменник, моя дорогая, — проговорил лорд Варис.</p><p class="p1">Великий мейстер Пицель поднял древнюю голову.</p><p class="p1">— Своими собственными ушами я слышал, как лорд Эддард клялся нашему возлюбленному королю Роберту охранять молодых принцев, как своих собственных детей. Но не успел король умереть, как он созвал Малый совет, чтобы лишить принца Джоффри законного трона.</p><p class="p1">— Нет, — выпалила Санса. — Он не мог этого сделать, не мог!</p><p class="p1">Королева подала грамоту. Бумага была порвана, на ней засохла кровь, но сломанная печать принадлежала отцу — лютоволк, оттиснутый на бледном воске.</p><p class="p1">— Мы нашли письмо на капитане твоей домашней стражи, Санса. Твой отец написал лорду Станнису, брату моего покойного мужа, предлагая ему корону.</p><p class="p1">— Пожалуйста, светлейшая государыня, здесь какая-то ошибка. — От внезапного отчаяния голова ее закружилась. — Пожалуйста, пошлите за моим отцом, пусть все расскажет; он не мог написать такого письма, король был его другом!</p><p class="p1">— Роберт тоже так полагал, — сказала королева. — И эта измена разбила бы его сердце. Но боги смилостивились, и он не дожил до этого дня. — Она вздохнула. — Санса, милая, теперь ты видишь, в каком ужасном положении мы очутились. Ты ни в чем не виновата, мы все это знаем, и все же ты — дочь предателя. Как я могу позволить тебе выйти замуж за моего сына?</p><p class="p1">— Но я же люблю его, — простонала Санса в смятении и испуге. Что они хотят сделать с ней? Что они сделали с отцом? Такого просто не должно было случиться. Ей предстоит выйти замуж за Джоффри, они же обручены, и он, ее суженый, даже снился ей. Нечестно разлучать их, что бы ни натворил ее отец!</p><p class="p1">— Я прекрасно знаю это, дитя, — проговорила Серсея голосом сладким и ласковым. — Итак, зачем же ты пришла ко мне и рассказала, что отец хочет отослать вас, если не по любви?</p><p class="p1">— По любви, — заторопилась Санса. — Отец даже не разрешил мне попрощаться. — Девочка добрая и послушная, в то утро она чувствовала себя такой же вредной, как Арья, и ускользнула из-под опеки септы Мордейн, не послушавшись лорда-отца. Она никогда не позволяла себе подобных причуд и не позволила бы, если бы так не любила Джоффри.</p><p class="p1">— Он собирался отвезти нас в Винтерфелл и выдать меня за какого-нибудь засечного рыцаря, хотя я люблю Джоффри. Я сказала ему, но он не пожелал слушать.</p><p class="p1">Король был ее последней надеждой. Король мог приказать отцу оставить ее в Королевской Гавани и выдать за принца Джоффри. Санса знала это, но король всегда пугал ее. Громкоголосый, грубый, нередко пьяный, он, возможно, отослал бы ее к лорду Эддарду, даже если бы ее допустили к нему. Поэтому она направилась к королеве и излила свое сердце; Серсея выслушала и ласково поблагодарила ее… только потом сир Арис проводил ее в высокую палату крепости Мейегора и поставил охрану, а через несколько часов началась схватка.</p><p class="p1">— Прошу вас, — закончила она, — позвольте Джоффри жениться на мне. Я буду ему хорошей женой, вы увидите. А когда я стану королевой, то буду во всем подражать вам, обещаю.</p><p class="p1">Королева Серсея оглядела собравшихся.</p><p class="p1">— Милорды-советники, что вы ответите на эту просьбу?</p><p class="p1">— Бедное дитя, — пробормотал Варис. — Любящее, верное и невинное, светлейшая государыня, этого нельзя отрицать… и все же, что нам остается делать? Отец ее обречен. — Его мягкие ладони терли друг друга в беспомощной растерянности.</p><p class="p1">— Дитя, рожденное от семени предателя, непременно обнаружит в себе природную склонность к предательству, — заметил великий мейстер Пицель. — Сейчас она милая девочка, но кто может сказать, какой она сделается через десять лет?</p><p class="p1">— Нет, — забормотала Санса с ужасом. — Нет, я никогда… я не предам Джоффри, я люблю его… Клянусь, я не сделаю ничего подобного!</p><p class="p1">— Посмотрите, какая уверенность, — буркнул Варис. — Тем не менее истинно говорят, что кровь сильнее любых клятв…</p><p class="p1">— Она напоминает мне мать, а не отца, — проговорил негромко лорд Петир Бейлиш. — Поглядите на нее: волосы, глаза! Вылитая мать в этом возрасте.</p><p class="p1">Королева с беспокойством поглядела на нее, однако Сансе виделась доброта в чистых зеленых глазах.</p><p class="p1">— Дитя, — сказала она. — Если бы я действительно могла поверить, что ты не подобна отцу, ничто не обрадовало бы меня больше, чем твоя свадьба с моим Джоффри. Я знаю, что он любит тебя всем сердцем. — Она вздохнула. — И все же я опасаюсь, что лорд Варис и великий мейстер правы. Все решает кровь. Мне остается лишь вспомнить, как твоя сестра напустила волка на моего сына.</p><p class="p1">— Я не такая, как Арья, — выпалила Санса. — Это в ней кровь предателя, а не во мне! Я хорошая, спросите септу Мордейн, она вам скажет. Я только хочу быть верной и преданной женой вашему Джоффри!</p><p class="p1">Санса ощутила на себе тяжесть взгляда Серсеи, королева пристально вглядывалась в ее лицо.</p><p class="p1">— Я верю в твою искренность, дитя. — Она обернулась к остальным. — Милорды, мне кажется, что, если остальные ее родственники проявят верность в это ужасное время, мы сможем забыть наши страхи.</p><p class="p1">Великий мейстер Пицель погладил огромную мягкую бороду, широкое чело его наморщилось в задумчивости.</p><p class="p1">— У лорда Эддарда трое сыновей.</p><p class="p1">— Мальчишки, — пожал плечами лорд Петир. — Меня более волнуют леди Кейтилин и Талли.</p><p class="p1">Королева взяла руки Сансы в свои.</p><p class="p1">— Дитя, ты знаешь грамоту?</p><p class="p1">Санса нервно кивнула. Она умела читать и писать лучше, чем ее братья, хотя безнадежно отставала от них в сложении.</p><p class="p1">— Рада слышать это. Быть может, вы с Джоффри еще можете надеяться.</p><p class="p1">— Что я должна сделать?</p><p class="p1">— Просто напиши своей леди-матери и своему брату, старшему… как его зовут?</p><p class="p1">— Робб, — ответила Санса.</p><p class="p1">— Известие о предательстве твоего лорда-отца, вне сомнения, скоро достигнет их. Лучше, если оно будет исходить из твоих уст. Поведай им, как лорд Эддард предал своего короля.</p><p class="p1">Санса отчаянно хотела добиться Джоффри, однако она не думала, что у нее хватит отваги исполнить просьбу королевы.</p><p class="p1">— Но он никогда… я не могу… светлейшая государыня, я не знаю, что написать…</p><p class="p1">Королева похлопала ее по руке.</p><p class="p1">— Мы подскажем тебе все необходимое. Важно, чтобы ты попросила леди Кейтилин и своего брата сохранять королевский мир.</p><p class="p1">— В противном случае им придется трудно, — добавил великий мейстер Пицель. — Ради той любви, которую ты испытываешь к ним, попроси своих родных ступить на тропу мудрости.</p><p class="p1">— Твоя леди-мать, вне сомнения, ужасно боится за тебя, — проговорила королева. — Напиши ей, что тебе хорошо с нами, что мы обращаемся с тобой мягко и выполняем каждое твое желание. Попроси их явиться в Королевскую Гавань и принести присягу Джоффри, когда он займет престол. Если они сделают это… тогда мы будем знать, что в твоей крови нет предательства. А когда ты войдешь в цвет женственности, то обвенчаешься с королем в Великой септе Бейелора, перед глазами богов и людей.</p><p class="p1">…обвенчаешься с королем… — слова эти заставили участиться ее дыхание, и все же Санса медлила.</p><p class="p1">— Быть может… если бы я могла повидаться с отцом, переговорить с ним о…</p><p class="p1">— Предательстве? — подсказал лорд Варис.</p><p class="p1">— Ты разочаровываешь меня, Санса, — проговорила королева, глаза ее сделались жесткими, словно камни. — Мы уже рассказали тебе о преступлениях твоего отца. Если ты действительно нам верна, как утверждаешь, почему же ты хочешь повидаться с ним?</p><p class="p1">— Я… я только хотела… — Санса ощутила, как глаза ее наполняются слезами. — Он не… он не был… ранен или… или…</p><p class="p1">— Лорд Эддард невредим, — ответила королева.</p><p class="p1">— Но что… что будет с ним?</p><p class="p1">— Это решит король, — многозначительно пояснил великий мейстер Пицель.</p><p class="p1">Король! Санса проглотила слезы. Теперь Джоффри сделался королем, подумала она. Ее галантный принц никогда не причинит вреда ее отцу, что бы тот ни сделал. И если она придет к нему и попросит милосердия, Джоффри прислушается… непременно прислушается, потому что он любит ее, ведь королева сказала так. Джофф захочет наказать отца, ведь лорды будут ожидать этого; быть может, он просто отошлет отца в Винтерфелл или сошлет в один из Вольных Городов за Узким морем. Ссылка продлится лишь несколько лет, к этому времени они с Джоффри поженятся, а став королевой, она убедит Джоффри вернуть отца назад и даровать ему прощение.</p><p class="p1">Но только… если мать и Робб не усугубят измену, не созовут знамена и не откажутся присягнуть Джоффри на верность, иначе все пойдет прахом. Ее Джоффри добр и ласков, она сердцем знала это, однако король обязан проявлять жестокость к мятежникам. Она должна убедить их. Ей придется это сделать!</p><p class="p1">— Я… я напишу, — сказала им Санса.</p><p class="p1">С улыбкой теплой, словно рассвет, Серсея Ланнистер наклонилась поближе и ласково поцеловала ее в щеку.</p><p class="p1">— Я знала это. Джоффри будет горд, когда я расскажу ему о той отваге и здравом смысле, которые ты продемонстрировала сейчас.</p><p class="p1">В конце концов Санса написала четыре письма. Своей матери, леди Кейтилин Старк, и братьям в Винтерфелл, потом тетке и деду: леди Лизе Аррен в Орлиное Гнездо и лорду Хостеру Талли в Риверран. Когда Санса завершила дело, пальцы ее онемели и перепачкались чернилами. Лорд Варис держал печать отца. Она согрела белый пчелиный воск над свечой, капнула четыре раза на бумагу и посмотрела, как евнух запечатал каждое письмо лютоволком дома Старков.</p><p class="p1">Джейни Пуль и все ее вещи исчезли, когда сир Мендон Мур проводил Сансу назад в башню крепости Мейегора. Теперь никаких слез, подумала она с благодарностью. И все же после исчезновения Джейни в палате стало как-то холоднее, хотя Санса и развела огонь. Она пододвинула кресло к очагу, взяла одну из своих любимых книг и погрузилась в повествование о Флориане и Джонквиль, леди Шилле и Радужном рыцаре, о доблестном принце Эйемоне и его несчастной любви к королеве, жене его брата.</p><p class="p1">Лишь глубокой ночью, отходя ко сну, Санса поняла, что забыла спросить о сестре.</p></span>
