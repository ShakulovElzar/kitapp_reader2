<p class="p">Кейтилин</p>
</div><p class="p1">Войско тянулось по гатям через черные болотины Перешейка, вытекало из них на широкие равнины Приречья, но Кейтилин одолевали предчувствия. Страхи свои она скрывала за внешним спокойствием и строгостью, однако они не оставляли ее и лишь возрастали с каждой новой пройденной лигой. Дни ее проходили в тревогах, ночь не приносила покоя, и каждый появившийся в небе ворон заставлял ее вздрагивать.</p><p class="p1">Кейтилин боялась за своего лорда-отца и удивлялась его зловещему молчанию. Она боялась за брата, боялась и молилась, чтобы боги помогли ему, если Эдмару придется на поле брани встретиться лицом к лицу с Цареубийцей. Она боялась за Неда и за девочек, за милых сыновей, которых оставила в Винтерфелле. Однако она ничем не могла помочь им, а поэтому заставляла себя гнать прочь все мысли о них. «Ты должна отдать все свои силы одному Роббу, — сказала она себе. — Только ему ты можешь помочь. Кейтилин Талли, ты должна быть жестокой и суровой, как север. Ты должна стать истинным Старком, как и твой сын!»</p><p class="p1">Робб ехал во главе колонны под плещущим белым знаменем Винтерфелла; каждый день он просил одного из своих лордов разделить его общество, чтобы переговорить с ним на марше; по очереди он выказывал внимание каждому, не заводя любимцев, подобно его лорду-отцу, выслушивая и взвешивая слова каждого. «Ты многому научился у Неда, — думала Кейтилин, глядя на сына. — Но хватит ли тебе этих знаний?»</p><p class="p1">Черная Рыба отобрал сотню людей и самых быстрых коней и ехал впереди, открывая движение и разведывая дорогу. Вести, доставляемые всадниками сира Бриндена, не многим могли ободрить Кейтилин. Войско лорда Тайвина еще находилось на юге — во многих днях пути, однако Уолдер Фрей, лорд Переправы, собрал почти четыре тысячи людей в своих замках на Зеленом Зубце.</p><p class="p1">— Опять опоздал, — пробормотала Кейтилин, услыхав об этом. Снова, как у Трезубца. Проклятый старик! Брат ее Эдмар созвал знамена, и лорд Фрей обязан был присоединиться к войску Талли при Риверране, но он остался дома.</p><p class="p1">— Четыре тысячи людей, — повторил Робб, скорее озадаченный, чем разгневанный. — У лорда Фрея не хватит сил, чтобы в одиночку противостоять Ланнистерам. Конечно, он намеревается соединиться с нами.</p><p class="p1">— В самом деле? — Кейтилин выехала вперед, пристроившись к Роббу и Роберту Гловеру, его сегодняшнему спутнику. Авангард растянулся позади них, неторопливый лес пик, знамен и копий. — Хотелось бы знать. Лучше не ожидать от Уолдера Фрея ничего, тогда не будет оснований для удивления.</p><p class="p1">— Он — знаменосец твоего отца.</p><p class="p1">— Люди по-разному относятся к своим клятвам, Робб, а лорд Уолдер всегда обнаруживал больше приязни к Бобровому утесу, чем нравилось моему отцу. Один из его сыновей женат на сестре Тайвина Ланнистера. Правда, сам по себе этот факт недорого стоит; при том множестве детей, которых он породил за свою долгую жизнь, всякий из них должен иметь супруга. И все же…</p><p class="p1">— Значит, вы, миледи, считаете, что он изменит нам, встав на сторону Ланнистеров? — серьезно спросил Роберт Гловер.</p><p class="p1">Кейтилин вздохнула:</p><p class="p1">— Откровенно говоря, я сомневаюсь в том, что самому лорду Фрею сейчас известно, что именно собирается предпринять лорд Фрей. Осторожность старца в его натуре сосуществует с честолюбием молодого человека, да и хитрости ему не занимать.</p><p class="p1">— Нам нужны Близнецы, мать, — с жаром сказал Робб. — Другого пути через реку нет. Ты знаешь это.</p><p class="p1">— Да. А еще это знает Уолдер Фрей, можешь не сомневаться.</p><p class="p1">В ту ночь они остановились лагерем на южном краю болот, на половине пути между Королевским трактом и рекой. Здесь Теон Грейджой доставил им новую весть от ее дяди.</p><p class="p1">— Сир Бринден велел передать вам, что его всадники скрестили мечи с отрядом Ланнистеров. Их была дюжина, и ни один не предстанет с вестью перед лордом Тайвином — ни сейчас, ни потом. — Он ухмыльнулся. — Их разведчиками командует сир Аддам Марбранд, и он отступает назад, сжигая все на пути. Он примерно представляет, где мы находимся, но Черная Рыба клянется, что он не узнает, когда мы разделимся.</p><p class="p1">— Если только лорд Фрей не расскажет ему, — резко бросила Кейтилин. — Теон, когда ты вернешься к моему дяде, передай ему, что он должен расставить лучших лучников вокруг Близнецов, чтобы они днем и ночью сбивали любого ворона, который взлетит со стен. Я не хочу, чтобы птицы принесли лорду Тайвину весть о движении войска моего сына.</p><p class="p1">— Сир Бринден уже позаботился об этом, миледи, — ответил Теон с задиристой улыбкой. — Вот собьем еще нескольких черных птах, и можно будет испечь хороший пирог. А перья их я соберу вам для шляпки.</p><p class="p1">Следовало бы помнить, что Бринден Черная Рыба видит не хуже ее.</p><p class="p1">— А что делают Фреи, пока Ланнистеры сжигают их поля и грабят остроги?</p><p class="p1">— Произошло несколько стычек между людьми сира Аддама и лорда Уолдера, — доложил Теон. — Почти в дне езды отсюда мы обнаружили двух ланнистерских лазутчиков, повешенных Фреем. Основные силы лорда Уолдера стоят у Близнецов.</p><p class="p1">Поступок этот, вне сомнения, нес на себе печать лорда Фрея, с горечью подумала Кейтилин; засесть, дождаться, понаблюдать и не рисковать, пока не заставят.</p><p class="p1">— Если он оказал сопротивление Ланнистерам, то, быть может, захочет выполнить свой обет.</p><p class="p1">Кейтилин не ощущала особой надежды.</p><p class="p1">— Защищать свою землю — дело одно, открыто выступить против лорда Тайвина — совсем другое.</p><p class="p1">Робб повернулся к Теону Грейджою:</p><p class="p1">— А Черная Рыба не сумел отыскать другую переправу через Зеленый Зубец?</p><p class="p1">Теон качнул головой:</p><p class="p1">— Река глубока и быстра. Сир Бринден утверждает, что здесь, на севере, бродов через нее нет.</p><p class="p1">Робб повернулся назад к Теону и гневно выкрикнул:</p><p class="p1">— Я должен переправиться! Наши кони переплывут реку, но только без латников. Можно было бы соорудить плоты, чтобы переправить на них все железо — шлемы, кольчуги и пики, но для этого у нас нет деревьев. И времени. Лорд Тайвин идет маршем на север… — Он сжал руку в кулак.</p><p class="p1">— Лорд Фрей проявит глупость, если решит преградить нам путь, — проговорил Теон Грейджой с обычной уверенностью. — Наше войско в пять раз больше. Мы можем взять Близнецы, если понадобится, Робб.</p><p class="p1">— Дело нелегкое, — предупредила их Кейтилин. — И несвоевременное. Пока вы будете брать замок, Тайвин Ланнистер приведет свое войско и раздавит вас с тыла.</p><p class="p1">Робб поглядел на Грейджоя в поисках ответа, но не нашел его. На мгновение он показался Кейтилин даже моложе своих пятнадцати лет, невзирая на кольчугу и заросшие щеки.</p><p class="p1">— А как поступил бы в подобном случае мой лорд-отец? — спросил он.</p><p class="p1">— Нед нашел бы способ перебраться, — ответила Кейтилин. — Во что бы то ни стало!</p><p class="p1">На следующий день к ним приехал сам сир Бринден Талли. Тяжелый панцирь и шлем, положенные Рыцарю Ворот, он сменил на легкую кожаную куртку и кольчугу разведчика, однако плащ по-прежнему был перехвачен обсидиановой рыбой.</p><p class="p1">Спрыгнув с коня, дядя посмотрел на Кейтилин серьезным взглядом.</p><p class="p1">— Под стенами Риверрана состоялась битва, — сказал сир Бринден сурово. — Мы узнали об этом от взятых нами лазутчиков. Цареубийца разгромил войско Эдмара, лорды Трезубца с боем отступили.</p><p class="p1">Холодная рука стиснула сердце Кейтилин.</p><p class="p1">— А брат мой?</p><p class="p1">— Раненым взят в плен, — сказал сир Бринден. — Лорд Блэквуд и все, кто уцелел, осаждены в Риверране войском Джейме.</p><p class="p1">Робб явно был недоволен.</p><p class="p1">— Мы обязаны перебраться через эту проклятую реку, если надеемся успеть в Риверран вовремя.</p><p class="p1">— Сделать это будет нелегко, — проговорил сир Бринден. — Лорд Фрей отвел все свое войско за стены, ворота его закрыты и заперты.</p><p class="p1">— Проклятый! — выругался Робб. — Если старый дурак не передумает и будет препятствовать нашей переправе, придется идти на приступ. И тогда уж я прикажу похоронить его под руинами. Посмотрим, как ему это понравится.</p><p class="p1">— Ты говоришь голосом обиженного мальчишки, Робб, — резко бросила Кейтилин. — Когда ребенок видит препятствие, первым делом он стремится обежать вокруг или сломать его. Лорд должен знать, что иногда слова способны достичь того, что не под силу мечам.</p><p class="p1">Робб покраснел, смутившись.</p><p class="p1">— Объясни мне, что ты имеешь в виду, мать, — проговорил он кротко.</p><p class="p1">— Фреи удерживают Переправу шесть сотен лет и ни разу не ошиблись в достижении собственной цели.</p><p class="p1">— Какой цели? Чего он хочет?</p><p class="p1">Она улыбнулась:</p><p class="p1">— А это мы еще должны выяснить.</p><p class="p1">— Ну а если я не сочту возможным заплатить его цену?</p><p class="p1">— Тогда тебе лучше возвратиться назад ко рву Кейлин и ожидать там лорда Тайвина… иначе придется отрастить крылья. Других способов я не вижу. — Кейтилин ударила пятками коня и отъехала, оставив сына обдумывать ее слова. Так ему не покажется, что мать пытается занять его место. «Научил ли ты его мудрости, Нед… или одной только доблести? — подумала она. — Научил ли ты его кланяться? Кладбища Семи Королевств полны отважных людей, так и не сумевших одолеть этот урок».</p><p class="p1">Авангард заметил башни Близнецов, где издавна сидели лорды Переправы, уже около полудня.</p><p class="p1">Течение Зеленого Зубца было здесь и быстрым и глубоким, но Фреи много веков назад перекинули мост через реку, разбогатев на монете, которую им платили за переправу. Массивный пролет из гладкого серого камня был достаточно широк, чтобы по нему могли проехать в ряд два фургона. В середине моста поднималась Водяная башня, преграждая реку и дорогу своими бойницами и решетками. Мост строили три поколения Фреев. И закончив, воздвигли прочные деревянные укрепления на каждом берегу так, чтобы никто не мог пересечь реку без их разрешения.</p><p class="p1">Дерево давно уступило место камню. Близнецы — два приземистых, уродливых, но крепких замка, схожих буквально во всем, не один век охраняли въезд на изгибающийся между ними мост. Высокие стены, глубокие рвы, решетки; прочные створки из железа и дуба защищали ворота под висячими башнями. Водяная башня перекрывала саму переправу.</p><p class="p1">Одного взгляда было достаточно, чтобы Кейтилин поняла: замок этот штурмом не взять. Стены щетинились копьями и мечами наверху, гнули скорпионьи хвосты катапульт, лучники стояли у всех амбразур и зубцов, подъемный мост поднят, решетки опущены, ворота и закрыты и заперты.</p><p class="p1">Большой Джон начал ругаться и проклинать все на свете, едва увидев это зрелище. Рикард Карстарк угрюмо молчал.</p><p class="p1">— Замок неприступен, милорды, — объявил Русе Болтон.</p><p class="p1">— По крайней мере мы не сумеем взять его штурмом и переправить войско на другой берег, чтобы осадить второй замок, — буркнул Хелман Толхарт. Двойник замка, высившийся за глубокими зелеными водами, казался отражением своего восточного брата. — Даже если бы у нас было время — а его у нас нет.</p><p class="p1">Пока северяне изучали замок, в воротах открылась калитка, дощатый мост лег на ров и дюжина рыцарей выехала навстречу; возглавляли отряд четверо из многочисленных сыновей лорда Уолдера. Их серебристое знамя украшали двойные темно-синие башни. Слово от Фреев, сказал сир Стеврон, наследник лорда Уолдера. Все Фреи напоминали хорьков, и сир Стеврон, при своих шестидесяти годах успевший обзавестись внуками, казался особенно старым и усталым хорьком, однако же держался с достаточной вежливостью.</p><p class="p1">— Мой лорд-отец отправил меня приветствовать вас и осведомиться о том, кто ведет это могучее войско.</p><p class="p1">— Я. — Робб послал коня вперед. Он был в панцире, но украшенный лютоволком щит Винтерфелла оставался привязан к седлу. Серый Ветер последовал за своим хозяином.</p><p class="p1">Старый рыцарь поглядел на сына Кейтилин с легким удивлением в водянистых серых глазах, хотя мерин его попятился от лютоволка.</p><p class="p1">— Мой лорд-отец будет польщен, если вы разделите с ним мед и мясо в нашем замке, а заодно объясните цель вашего появления у его стен.</p><p class="p1">Слова эти рухнули на лордов-знаменосцев как огромный камень, пущенный с катапульты. Согласных не было. Они ругались, спорили и кричали друг на друга.</p><p class="p1">— Вы не должны делать этого, милорд, — обратился Галбарт Гловер к Роббу. — Лорду Уолдеру нельзя доверять.</p><p class="p1">Русе Болтон кивнул:</p><p class="p1">— Только войди к нему в одиночку — и конец! Он продаст вас Ланнистерам, бросит в тюрьму, перережет глотку — если захочет.</p><p class="p1">— Если он хочет разговаривать с нами, пусть откроет ворота, и мы все охотно разделим с ним его мясо и мед, — объявил сир Уэндел Мандерли.</p><p class="p1">— Или же пусть выедет сюда и переговорит с Роббом, так чтобы видели и мы, и его люди, — предложил его брат, сир Уилис.</p><p class="p1">Кейтилин Старк полностью разделяла все их сомнения, но, судя по лицу сира Стеврона, ход разговора абсолютно не удовлетворял его. Еще несколько слов, и мгновение будет безвозвратно утеряно. Надо действовать — быстро и решительно.</p><p class="p1">— Я поеду, — громко проговорила она.</p><p class="p1">— Вы, миледи? — Большой Джон нахмурил чело.</p><p class="p1">— Мать, ты уверена? — Робб явно сомневался.</p><p class="p1">— Конечно же, — непринужденно солгала Кейтилин. — Лорд Уолдер — знаменосец моего отца; я знаю его с детства. Он никогда не причинит мне вреда. — Если не увидит, что это ему выгодно, добавила она про себя. Впрочем, правду не всегда нужно произносить, а ложь нередко бывает необходимой.</p><p class="p1">— Я уверен, что мой лорд-отец будет рад беседе с леди Кейтилин, — проговорил сир Стеврон. — В доказательство наших добрых намерений мой брат, сир Первин, останется здесь, пока она благополучно не возвратится к вам.</p><p class="p1">— Он будет нашим почетным гостем, — заверил Робб.</p><p class="p1">Сир Первин, самый младший из четверых Фреев, спешился и передал брату поводья своего коня.</p><p class="p1">— Ставлю условие, чтобы моя леди-мать возвратилась к вечеру, — продолжил Робб. — Я не намереваюсь долго задерживаться здесь.</p><p class="p1">Сир Стеврон вежливо кивнул:</p><p class="p1">— Как вам угодно, милорд.</p><p class="p1">Кейтилин, не оглядываясь, послала коня вперед и не стала прощаться. Сыновья лорда Уолдера и свита последовали за ней.</p><p class="p1">Отец ее некогда говаривал, что во всех Семи Королевствах лишь один Уолдер Фрей способен отрядить на войну войско из своих собственных отпрысков. Лорд Переправы приветствовал Кейтилин в огромном зале Восточного замка в окружении двадцати сыновей (сир Первин был двадцать первым по счету), тридцати шести внуков, девятнадцати правнуков и несчетного количества дочерей, внучек, бастардов и прабастардов, и только тут она по-настоящему поняла слова отца.</p><p class="p1">Девяностолетний лорд Уолдер напоминал морщинистую розовую куницу с покрывшейся пятнами лысиной; подагра мешала ему стоять. Самая последняя жена его, хрупкая бледная девушка лет семнадцати, стояла возле его носилок, среди жен она была восьмой по счету.</p><p class="p1">— Весьма рада видеть вас после столь долгих лет, милорд, — проговорила Кейтилин.</p><p class="p1">Старик подозрительно прищурился.</p><p class="p1">— В самом деле? Сомневаюсь. Избавьте меня от любезностей, леди Кейтилин, я слишком стар для них. Для чего вы здесь? Или ваш мальчишка слишком горд, чтобы прийти ко мне? Что я должен делать с вами?</p><p class="p1">Кейтилин в последний раз была в Близнецах еще девочкой, но уже тогда лорд Уолдер, раздражительный и острый на язык, показался ей человеком, не признающим вежливости. С возрастом он, похоже, сделался только хуже. Итак, придется тщательно выбирать слова и не обижаться на его колкости.</p><p class="p1">— Отец, — сказал сир Стеврон с укоризной, — ты забываешь, что леди Старк прибыла сюда по твоему приглашению.</p><p class="p1">— Разве я спрашивал тебя? Ты станешь лордом Фреем лишь после моей смерти. А я как будто бы не похож на покойника. Твои наставления мне не нужны!</p><p class="p1">— Не надо так говорить перед нашей благородной гостьей, отец, — заметил один из его младших сыновей.</p><p class="p1">— Ну теперь и мои бастарды начнут учить меня вежливости, — пожаловался лорд Уолдер. — Я буду говорить так, как хочу, проклятые! Я принимал троих королей и столько же королев, и ты, Ригер, считаешь, что я нуждаюсь в твоих наставлениях? Твоя мать доила коз, когда я наделил ее своим семенем. — Он отмахнулся от побагровевшего юнца движением пальцев и махнул двум другим сыновьям. — Денвел, Велен, помогите мне перейти в кресло.</p><p class="p1">Они перенесли лорда Уолдера из носилок к высокому престолу Фреев; высокая спинка, вырезанная из черного дерева, изображала две башни, связанные мостом. Его молодая жена застенчиво поднялась наверх и прикрыла ноги старика пледом. Усевшись, лорд Фрей поманил Кейтилин к себе и прикоснулся бумажными губами к ее руке.</p><p class="p1">— Вот, — объявил он. — Теперь я соблюл все любезности, миледи, и мои сыновья, возможно, окажут мне честь, закрыв свои рты. Зачем вы здесь?</p><p class="p1">— Чтобы попросить вас открыть ворота, милорд, — вежливо ответила Кейтилин. — Мой сын и его лорды-знаменосцы стремятся пересечь реку и продолжить свой путь.</p><p class="p1">— К Риверрану? — Фрей фыркнул. — Только не надо обманывать меня — не надо. Я еще не ослеп. Этот старик еще способен читать карту!</p><p class="p1">— К Риверрану, — подтвердила Кейтилин. Бессмысленно отрицать это. — Возле которого я рассчитывала увидеть вас, милорд. Вы как будто все еще считаетесь знаменосцем моего отца, правда?</p><p class="p1">— Хо, — начал лорд Уолдер, не то усмехнувшись, не то кашлянув. — Я созвал свои мечи, правильно; все мои люди здесь, и вы видели их на стенах. Я намеревался выступить сразу, как только соберу все свои силы. Ну конечно, послать сыновей. Я уже не способен к походам, леди Кейтилин. — Подыскивая доказательство, он огляделся вокруг и указал на высокого согбенного человека лет пятидесяти. — Скажи ей, Джяред. Скажи, что я действительно намеревался так поступить.</p><p class="p1">— Да, миледи, — подтвердил сир Джяред Фрей, один из сыновей второй жены старика. — Честью своей свидетельствую.</p><p class="p1">— И в чем я виноват, если ваш глупый брат проиграл битву раньше, чем мы успели выступить? — Хмурясь, лорд Фрей откинулся на подушки, словно бы Кейтилин оспаривала его версию. — Мне сказали, что Цареубийца разрубил его войско, как спелый сыр топором. Зачем теперь отправлять моих мальчиков на юг — на верную смерть? Все, кто пошел к Риверрану, теперь бегут на север.</p><p class="p1">Кейтилин охотно насадила бы говорливого старца на вертел и поджарила его над огнем, однако нужно было еще до вечера уговорить его открыть мост. А посему она спокойно ответила:</p><p class="p1">— Тем больше у нас причин поскорее добраться до Риверрана. Где мы можем переговорить, милорд?</p><p class="p1">— Но мы уже разговариваем, — удивился лорд Фрей. Пятнистая розовая голова огляделась вокруг. — Что вы тут увидели? — закричал он на свою родню. — Все убирайтесь. Леди Старк хочет переговорить со мной с глазу на глаз. Возможно, она рассчитывает покуситься на мою добродетель, ха. Ступайте, займитесь полезным делом. Да, и ты, женщина. Все, все, все — вон!</p><p class="p1">Когда его сыновья, внуки, дочери, бастарды, племянники и племянницы потекли из зала, лорд Фрей пригнулся поближе к Кейтилин и пожаловался:</p><p class="p1">— Все они ждут только моей смерти. Стеврон ждет дольше всех, но я уже сорок лет разочаровываю его. А зачем мне умирать только для того, чтобы он стал лордом? Я спрашиваю вас! Я не хочу этого делать…</p><p class="p1">— Я надеюсь, что вы встретите столетний юбилей.</p><p class="p1">— Ну, тогда они будут кипеть, не сомневайтесь. Итак, что вы хотите сказать?</p><p class="p1">— Мы хотим пересечь реку, — проговорила Кейтилин.</p><p class="p1">— В самом деле? Откровенное признание. А почему я должен вас пропустить?</p><p class="p1">На мгновение она поддалась гневу:</p><p class="p1">— Если бы у вас, лорд Фрей, хватило сил, чтобы подняться на собственные стены, вы бы увидели, что мой сын стоит у ваших ворот во главе двадцатитысячной рати.</p><p class="p1">— К приходу лорда Тайвина от нее останутся двадцать тысяч трупов, — ответил выпадом старик. — Не пытайтесь испугать меня, миледи. Ваш муж брошен в гнилое подземелье под Красным замком, отец ваш болен, быть может, умирает. Джейме Ланнистер надел цепи на вашего брата. Кого мне бояться? Вашего сына? Ставлю против ваших детей сына на сына, и у меня останется восемнадцать, когда все ваши погибнут.</p><p class="p1">— Вы дали присягу моему отцу, — напомнила ему Кейтилин.</p><p class="p1">Фрей с улыбкой покачал головой из стороны в сторону:</p><p class="p1">— О да, я говорил какие-то слова, но я присягал и короне, как мне кажется. Теперь правит Джоффри, а посему и вы, и ваш мальчишка, и все дураки, явившиеся ко мне, являются обычными мятежниками. Даже если бы я обладал только рассудком, которым боги наделили рыбу, мне следовало бы помочь Ланнистерам свалить вас всех.</p><p class="p1">— Почему вы этого не делаете? — спросила она.</p><p class="p1">Лорд Уолдер фыркнул с пренебрежением:</p><p class="p1">— Лорд Тайвин, великолепный и пышный, Хранитель Запада, десница короля и все такое… Великий муж, золото здесь и золото там, и львы повсюду! Но, уверяю вас, когда он переест бобов, то пускает ветер, как и я сам, однако ни за что не признается в этом. О нет! Потом, почему он так надувается? У него всего два сына, и один из них уродливый карлик. Я выставлю против него сына за сына, и у меня останется девятнадцать с половиной, когда все они погибнут! — Он кашлянул. — Если бы лорд Тайвин хотел моей помощи, то вполне мог бы и попросить ее…</p><p class="p1">Именно на это рассчитывала Кейтилин.</p><p class="p1">— Тогда я прошу вашей помощи, милорд, — проговорила она смиренно. — И мой отец, и мой брат, и мой лорд-муж, и мои сыновья просят моим голосом!</p><p class="p1">Лорд Уолдер ткнул в ее сторону костлявыми пальцами.</p><p class="p1">— Приберегите ваши ласковые речи, миледи. Их мне говорит жена. Видели ее? Ей шестнадцать, маленький цветочек, и мед ее предназначен лишь для меня. Клянусь, на будущий год, примерно в эту пору, она подарит мне сына. Возможно, я назову наследником именно его, чтобы позлить всех остальных.</p><p class="p1">— Не сомневаюсь в том, что ваша жена подарит вам еще множество сыновей.</p><p class="p1">Голова старика закивала вверх и вниз.</p><p class="p1">— А ваш лорд-отец не явился на мою свадьбу. На мой взгляд, это оскорбление. Даже если он умирает. Не был он и на моей предыдущей свадьбе. А вы знаете, что лорд Хостер зовет меня покойным лордом Фреем? Или он уже считает меня покойником? А я еще переживу и его, как пережил его собственного отца. Ваша семья всегда хотела ссать на меня… не надо отрицать, не лгите, вы знаете, что это так! Много лет назад я послал к вашему отцу и предложил заключить брак между его сыном и моей дочерью. Почему бы и нет? Я наметил одну дочь, милая девочка, лишь на несколько лет старше Эдмара, но если бы у вашего брата не лежало к ней сердце, у меня нашлись бы другие, молодые, старые, девственницы, вдовы — словом, все что угодно! Так нет, лорд Хостер даже не захотел слышать об этом. О, он ответил мне ласковыми словами, принес извинения, но я-то хотел сбыть с рук девицу!</p><p class="p1">А ваша сестра, та еще хуже. Это произошло год назад, не более. Джон Аррен тогда был еще королевской десницей. Я отправился в город, чтобы посмотреть, как мои сыновья выступят на турнире. Стеврон и Джяред слишком стары для этого, но Денвел и Хостин выехали, Первин тоже; двое моих бастардов записались в общую схватку. Если бы я только знал, как они опозорят меня, то не стал бы предпринимать такое далекое путешествие. Зачем мне таскаться за тридевять земель, чтобы увидеть, как этот щенок Тирелл выбил из седла моего Хостина! Мальчишка-то вполовину младше его. Его там кличут сир Маргаритка… что-то в этом роде. А Денвела выставил засечный рыцарь! На несколько дней я даже усомнился в том, что они действительно мои дети. Третья моя жена была родом из Кракехолла, а все их женщины — шлюхи. Впрочем, вас это не должно интересовать, она умерла еще до вашего рождения.</p><p class="p1">Ах да, я говорил о вашей сестре. Я предложил лорду и леди Аррен взять ко дворцу моих внуков и воспитать здесь, в Близнецах, их сына. Неужели мои внуки не достойны появиться при дворе короля? Милые мальчики, спокойные и воспитанные. Уолдера, сына Меретта, его назвали в мою честь, а другой… эх, забыл… он тоже мог быть Уолдером, они всегда называют их Уолдерами, чтобы я любил их, но его отец… кто же был его отцом, а? — Лицо его наморщилось. — Ладно, кто бы он ни был, лорд Аррен мог взять его — или другого, — и в этом я обвиняю вашу леди-сестру! Она держалась так, словно бы я предложил ей отдать мальчишку в труппу марионеточника или сделать его евнухом; а когда лорд Аррен ответил, что дитя поедет на Драконий Камень, к Станнису Баратеону, она вылетела из палаты, не сказав даже слова сожаления; деснице пришлось принести мне извинения! А что из них можно сделать, скажите мне?</p><p class="p1">Кейтилин беспокойно нахмурилась:</p><p class="p1">— Насколько я понимаю, мальчика Лизы хотели отдать на воспитание лорду Тайвину.</p><p class="p1">— Речь шла о лорде Станнисе, — раздраженным тоном ответил Уолдер Фрей. — Неужели вы считаете, что я уже не способен отличить лорда Станниса от лорда Тайвина! Обе эти жопы считают себя слишком благородными, чтобы срать, но разница между ними все-таки есть. Или вы думаете, что от старости я лишился памяти? Мне уже девяносто, но я все очень хорошо помню. Помню и то, что надо делать с женщиной. Клянусь, эта жена родит мне сына в следующем году или же дочь, этого не избежишь. Мальчика или девочку — красного, морщинистого и верещащего младенца, и скорее всего она захочет назвать его Уолдером или Улдой.</p><p class="p1">Кейтилин не было дела до того, как леди Фрей назовет своего ребенка.</p><p class="p1">— Джон Аррен намеревался воспитывать своего сына у лорда Станниса? Вы уверены в этом?</p><p class="p1">— Да, да и да, — отвечал старик. — Но он умер, так что какая разница? Итак, вы говорите, что хотите пересечь реку?</p><p class="p1">— Хотим.</p><p class="p1">— Вы не можете этого сделать, — отрывисто объявил лорд Уолдер, — без моего разрешения, а зачем мне эти хлопоты? Талли и Старки никогда не были моими друзьями. — Старик откинулся в своем кресле и скрестил руки, ожидая ответа.</p><p class="p1">Ну а потом начался торг.</p><p class="p1">Распухшее красное солнце уже опустилось к краю холодных холмов, когда ворота замка открылись, подъемный мост заскрипел, решетка поднялась, и леди Кейтилин выехала, чтобы присоединиться к сыну и его знаменосцам. За нею следовали сир Джяред Фрей, Хостен Фрей, Денвел Фрей и бастард лорда Уолдера, Ронил Риверс, во главе длинной двойной цепочки копейщиков в синих стальных кольчугах и серебристо-серых плащах.</p><p class="p1">Робб галопом направился навстречу, и Серый Ветер несся возле его коня.</p><p class="p1">— Сделано, — сказала ему Кейтилин. — Лорд Уолдер разрешает нам переправиться и предоставляет тебе все свои силы, за исключением четырех сотен мечей, которые необходимы ему для обороны Близнецов. Я предложила, чтобы ты оставил ему четыре сотни своих мечников и лучников. Он едва ли станет возражать против укрепления гарнизона… только убедись, чтобы твоими людьми командовал достойный доверия человек. Не исключено, что лорду Уолдеру придется помочь выполнить его долг.</p><p class="p1">— Как тебе угодно, мать, — ответил Робб, оглядывая ряды копейщиков. — Быть может… подойдет сир Хелман Толхарт. Как ты думаешь?</p><p class="p1">— Отличный выбор.</p><p class="p1">— А что… что он хочет от нас?</p><p class="p1">— Если можешь, выдели нескольких мечников проводить двух внуков лорда Фрея на север, в Винтерфелл, — сказала она. — Я согласилась взять их в воспитанники. Это мальчишки восьми и семи лет. Похоже, их обоих зовут Уолдерами. Как мне кажется, Бран будет рад обществу ребят своего возраста.</p><p class="p1">— И это все? Двое воспитанников? Достаточно малая цена за…</p><p class="p1">— С нами отправится сын лорда Фрея Оливер, — продолжила Кейтилин. — Он будет твоим сквайром. Отец хочет, чтобы его в должное время возвели в рыцари.</p><p class="p1">— Сквайр? — Робб пожал плечами. — Отлично, это отлично, если он…</p><p class="p1">— А также — если сестра твоя Арья возвратится к нам — мы решили, что она выйдет замуж за младшего сына лорда Уолдера Элмара, когда оба они повзрослеют.</p><p class="p1">Робб казался недовольным.</p><p class="p1">— Арье это не понравится.</p><p class="p1">— А ты обвенчаешься с одной из его дочерей, когда война закончится, — договорила она. — Его светлость любезно согласился предоставить тебе право выбора. У него много девиц, которые подходят тебе по возрасту.</p><p class="p1">К чести сына, Робб не дрогнул.</p><p class="p1">— Понимаю.</p><p class="p1">— Ты возражаешь?</p><p class="p1">— Разве я могу отказаться?</p><p class="p1">— Нет, если хочешь переправиться через реку.</p><p class="p1">— Я согласен, — проговорил Робб торжественно. Он еще никогда не казался ей более взрослым, чем в это мгновение. Мальчишки могут играть с мечами, но брак заключает лорд, понимая, что это значит.</p><p class="p1">Через реку они переправились уже вечером, когда рогатый месяц поплыл над водой. Двойная колонна втекала в ворота восточного Близнеца огромной стальной змеей и, скользнув по двору крепости, а потом по мосту, извергалась из ворот замка на западном берегу.</p><p class="p1">Кейтилин ехала во главе змеи вместе с сыном, сиром Бринденом и сиром Стевроном. За ними последовали девять из каждых десяти всадников: рыцари, копейщики, наемники, конные лучники. Переправлялись они несколько часов. Потом Кейтилин долго вспоминала стук бессчетных копыт по подъемному мосту, лорда Уолдера Фрея, наблюдавшего из носилок за переправой, блестящие глаза за щелями бойниц в потолке Водяной башни.</p><p class="p1">Основные силы северного войска — копейщики, лучники и пехота остались на восточном берегу под командованием Русе Болтона. Робб приказал им следовать на юг и встретить огромную армию Ланнистеров, идущую на север под командованием лорда Тайвина.</p><p class="p1">К счастью или нет, но сын ее бросил кости.</p></span>
