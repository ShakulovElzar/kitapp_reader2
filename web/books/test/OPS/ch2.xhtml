<div class="title">
<p class="p">Примечания</p>
</div>
<span id="id11"><div class="title1">
<p class="p">1</p>
</div><p class="p1">В этом названии на общем языке сливаются наступление зимы и ее свирепость. — <em>Здесь и далее примеч. пер.</em></p></span>
<span id="id9"><div class="title1">
<p class="p">2</p>
</div><p class="p1">А в этом имени звучат сила, непреклонность, суровость и стойкость.</p></span>
<span id="id7"><div class="title1">
<p class="p">3</p>
</div><p class="p1">Свободное владение.</p></span>
<span id="id6"><div class="title1">
<p class="p">4</p>
</div><p class="p1">1 стоун = 14 фунтов, около 50 кг.</p></span>
<span id="id5"><div class="title1">
<p class="p">5</p>
</div><p class="p1">Кракен — гигантский кальмар.</p></span>
<span id="id4"><div class="title1">
<p class="p">6</p>
</div><p class="p1">старинная английская мера длины, около 4,8 км.</p></span>
<span id="id3"><div class="title1">
<p class="p">7</p>
</div><p class="p1">около 200 м.</p></span>
<span id="id2"><div class="title1">
<p class="p">8</p>
</div><p class="p1">В средневековье север нередко ассоциировался с верхом, вершиной мира.</p></span>
<span id="id1"><div class="title1">
<p class="p">9</p>
</div><p class="p1">приблизительно 127 кг.</p></span>
<span id="id13"><div class="title1">
<p class="p">10</p>
</div><p class="p1">Слово «чемпион» существует со времен средневековья.</p></span>
<span id="id12"><div class="title1">
<p class="p">11</p>
</div><p class="p1">надмогильный холм из камней.</p></span>
<span id="id10"><div class="title1">
<p class="p">12</p>
</div><p class="p1">средневековый термин, означающий рыцаря, в поединке защищающего чью-либо честь или жизнь.</p></span>
<span id="id8"><div class="title1">
<p class="p">13</p>
</div><p class="p1">полы замков устилались скошенной травой и тростником.</p></span>
