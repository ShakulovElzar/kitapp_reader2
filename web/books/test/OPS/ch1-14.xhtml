<p class="p">Дейенерис</p>
</div><p class="p1">Свадьбу Дейенерис Таргариен с кхалом Дрого, страшную и варварски великолепную, сыграли на поле возле стен Пентоса, потому что дотракийцы верили, что все важные события в мире и в жизни мужчины должны совершаться под открытым небом.</p><p class="p1">Дрого созвал свой кхаласар, и они пришли, сорок тысяч воинов-дотракийцев, вместе с несчетным количеством женщин, детей и рабов. Они остановились вместе со своими стадами у городских стен, воздвигли жилища из спряденной травы и съели все, что можно было найти вблизи. Добрый народ Пентоса с каждым днем проявлял все большее беспокойство.</p><p class="p1">— Мои друзья-магистры удвоили численность городской стражи, — говорил Иллирио, сидя ночью за блюдом с уткой в меду и оранжевым хрустящим перцем во дворце, что принадлежал Дрого. Кхал отправился к своему кхаласару, предоставив дом в распоряжение Дейенерис и ее брата до дня свадьбы.</p><p class="p1">— Только лучше выдать принцессу Дейенерис скорее, чем они скормят добро Пентоса наемникам, — пошутил сир Джорах Мормонт. Беглец предложил ее брату свой меч в ту самую ночь, когда Дени продали кхалу Дрого, и Визерис охотно принял его. С той поры Мормонт сделался их постоянным спутником.</p><p class="p1">Магистр Иллирио непринужденно расхохотался, поглаживая раздвоенную бороду, а Визерис даже не улыбнулся.</p><p class="p1">— Он может получить ее хоть завтра, если захочет, — сказал брат, поглядев на Дени. Она опустила глаза. — Пусть только выплатит цену.</p><p class="p1">Иллирио махнул мягкой рукой в воздухе, кольца блеснули на толстых пальцах.</p><p class="p1">— Я сказал вам, что все улажено. Доверьтесь мне. Кхал обещал вам корону, и вы ее получите.</p><p class="p1">— Да, но когда?</p><p class="p1">— Когда кхал решит, — ответил Иллирио. — Сначала он получит девицу, а после того, как они вступят в брак, ему нужно будет совершить путешествие по равнинам и представить ее подданным. После этого, быть может, все и решится. Если кхал получит добрые предзнаменования.</p><p class="p1">Визерис кипел нетерпением:</p><p class="p1">— Клал я на дотракийские предзнаменования! Узурпатор сидит на троне моего отца. Долго ли мне ждать?</p><p class="p1">Иллирио пожал жирными плечами:</p><p class="p1">— Вы ждали всю свою жизнь, великий король. Что для вас еще несколько месяцев или даже несколько лет?</p><p class="p1">Сир Джорах, бывалый путешественник и знаток местных обычаев, согласно кивнул:</p><p class="p1">— Я советую вам проявить терпение, светлейший. Дотракийцы верны своему слову, но поступки они совершают, когда настает их время. Низменный человек может молить кхала о милости, но не вправе корить его.</p><p class="p1">Визерис ощетинился:</p><p class="p1">— Последите за своим языком, Мормонт, или я вырву его. Я не из простонародья; я — законный владыка Семи Королевств. Дракон не просит!</p><p class="p1">Сир Джорах с почтением потупил взгляд. Иллирио, загадочно улыбаясь, отодрал крылышко от утки. Мед и жир стекали по его пальцам, капали на бороду, зубы впились в нежное мясо.</p><p class="p1">«Драконов больше не существует», — подумала Дени, глядя на своего брата, хотя и не осмелилась высказать свою мысль вслух.</p><p class="p1">Но той ночью ей приснился дракон. Визерис бил ее нагую, млевшую от страха, делая ей больно. Дени побежала от брата, но тело сделалось непослушным. Он вновь ударил ее, она споткнулась и упала.</p><p class="p1">— Ты разбудила дракона, — вскрикнул Визерис, ударяя ее. — Разбудила дракона, разбудила дракона. — Бедра ее увлажняла кровь. Она закрыла глаза и заскулила. И словно бы отвечая ей, послышался жуткий хруст, затрещал великий огонь. Когда она поглядела снова, Визерис исчез, вокруг поднялись великие столбы пламени, а посреди него оказался дракон. Он медленно поворачивал свою огромную голову. А когда огненная лава его глаз коснулась ее взгляда, она проснулась, сотрясаясь в холодном поту. Ей еще не случалось так пугаться…</p><p class="p1">…до дня, когда наконец свершился ее брак.</p><p class="p1">Обряд начался на рассвете, продолжался до сумерек; бесконечный день заполняли пьянство, обжорство и сражения. Посреди зеленых дворцов была возведена высокая земляная насыпь, откуда Дени наблюдала за происходящим, сидя возле кхала Дрого над морем дотракийцев. Ей еще не приводилось видеть столько людей вокруг себя, тем более из столь чуждого и страшного народа. Табунщики, посещая свободные города, наряжались в самые богатые одеяния и душились благовониями, но под открытым небом они сохраняли верность старым обычаям. И мужчины, и женщины надевали на голое тело разрисованные кожаные жилеты и сплетенные из конского волоса штаны в обтяжку, которые удерживались на теле поясами из бронзовых медальонов. Воины смазывали свои длинные косы жиром, взятым из салотопных ям. Они обжирались зажаренной на меду и с перцем кониной, напивались до беспамятства перебродившим конским молоком и тонкими винами Иллирио, обменивались грубыми шутками над кострами; голоса их звучали резко и казались Дени совсем чужими.</p><p class="p1">Облаченный в новую черную шерстяную тунику с алым драконом на груди, Визерис сидел ниже ее. Иллирио и сир Джорах находились возле брата. Им предоставили весьма почетное место, как раз чуть ниже кровных всадников кхала. Однако Дени видела гнев, собирающийся в сиреневых глазах брата. Визерису не нравилось, что Дени сидит выше, и он кипел уже оттого, что рабы предлагали каждое блюдо сначала кхалу и его невесте, а ему подавали лишь то, от чего они отказывались. Тем не менее ему приходилось скрывать свое раздражение, и оттого Визерис впадал во все более мрачное настроение, усматривая все новые и новые оскорбления собственной персоне.</p><p class="p1">Дени никогда еще не было так одиноко, как посреди этой громадной толпы. Брат велел ей улыбаться, и она улыбалась, пока лицо ее не заболело и непрошеные слезы не подступили к глазам. Она постаралась сдержать их, понимая, насколько сердит будет Визерис, если заметит, что она плачет. Ей подносили еду: дымящиеся куски мяса, черные толстые сосиски, кровяные дотракийские пироги, а потом фрукты и отвары сладких трав, тонкие лакомства из кухонь Пентоса, но она отмахивалась от всего. В горле ее словно встал ком, и она понимала, что не сумеет ничего проглотить.</p><p class="p1">Поговорить было не с кем, кхал Дрого обменивался распоряжениями и шутками со своими кровными, смеялся их ответам, но даже не глядел на Дени, сидевшую возле него. У них не было общего языка. Дотракийского она не понимала, а сам кхал знал лишь несколько слов того ломаного валирийского наречия, на котором разговаривали в Вольных Городах, и вовсе не слыхал общего языка Семи Королевств. Дени была бы рада обществу Иллирио и брата, однако они находились слишком далеко внизу, чтобы слышать ее.</p><p class="p1">Так сидела она в своих брачных шелках, с чашей подслащенного медом вина, не в силах поесть, безмолвно уговаривая себя. «Я от крови дракона, — говорила она про себя. — Я Дейенерис Бурерожденная, принцесса Драконьего Камня, от крови и семени Эйегона-завоевателя…»</p><p class="p1">Солнце поднялось вверх по небу лишь на четверть пути, когда Дейенерис впервые в жизни увидела смерть человека. Били барабаны, женщины плясали перед кхалом. Дрого бесстрастно следил за ними, провожая взглядом движения и время от времени бросая вниз бронзовые медальоны, за которые женщины принимались бороться. Воины тоже наблюдали. Один из них вступил в круг, схватил плясунью за руку, кинул на землю и взгромоздился на нее, как жеребец на кобылу. Иллирио предупреждал ее о том, что подобное может случиться, ведь дотракийцы в своих стадах ведут себя подобно животным. В кхаласаре нет уединения, они не знают ни греха, ни позора в нашем понимании.</p><p class="p1">Осознав происходящее, Дени в испуге отвернулась от совокупляющейся пары, но тут шагнул в круг второй воин, за ним третий, и скоро глаза некуда было прятать. Потом двое мужчин схватили одну женщину. Она услыхала крик, увидала движение, и в одно мгновение они обнажили аракхи: длинные и острые как бритва клинки, смесь меча и косы. Смертельная пляска началась, воины сходились, рубились, прыгали друг вокруг друга, махали клинками над головой, выкрикивали оскорбления при каждом ударе. Никто не сделал даже попытки вмешаться.</p><p class="p1">Схватка завершилась так же быстро, как и началась. Руки замелькали быстрее, чем Дени могла уследить, один из мужчин споткнулся, клинок другого описал широкую плоскую дугу. Сталь впилась в плоть как раз над плечом дотракийца и развалила его тело от шеи до пупка, внутренности вывалились наружу. Когда побежденный умер, победитель схватил ближайшую женщину — даже не ту, из-за которой они поссорились, — и немедленно взял ее. Рабы унесли тело, пляска возобновилась.</p><p class="p1">Магистр Иллирио предупреждал Дени и об этом. Свадьбы хотя бы без трех смертей кажутся дотракийцам скучными, сказал он. Ее свадьба оказалась особо благословенной: прежде чем день окончился, погибла дюжина мужчин.</p><p class="p1">Шли часы, и ужас все сильнее овладевал Дени; наконец она едва могла сдерживать крик. Она боялась дотракийцев, чьи обычаи казались ей чудовищными и чуждыми, словно бы они были зверями в человеческом обличье. Она боялась своего брата, того, что он может натворить, если она подведет его. Но более всего она боялась наступления ночи, когда брат отдаст ее этому гиганту, который пил возле нее, храня на лице жестокий покой бронзовой маски.</p><p class="p1">«Я от крови дракона», — сказала она себе.</p><p class="p1">Когда наконец солнце опустилось к горизонту, кхал Дрого хлопнул в ладони, и все барабаны, пир и крик вдруг остановились. Дрого встал и поднял Дени на ноги. Наступило время свадебных подарков.</p><p class="p1">После подарков, когда опустится солнце, настанет время для первой езды и совершения брака. Дени попыталась отодвинуть эту мысль, но не смогла. Она обняла себя, чтобы не дрожать.</p><p class="p1">Братец Визерис подарил ей трех служанок. Дени знала, что подарок ничего не стоил ему. Вне сомнения, девиц предоставил Иллирио. Меднокожих дотракиек с черными волосами и миндальными глазами звали Ирри и Чхику, светлокожую и синеглазую лисенийку — Дореа.</p><p class="p1">— Это не обычные служанки, милая сестрица, — сказал брат, когда девушек поставили перед ней. — Мы с Иллирио специально выбирали их для тебя. Ирри научит тебя верховой езде, Чхику — дотракийскому языку, а Дореа наставит в женственном искусстве любви. — Он тонко улыбнулся. — Она очень хороша в нем, мы с Иллирио оба можем это подтвердить.</p><p class="p1">Сир Джорах Мормонт извинился за свой подарок.</p><p class="p1">— Это пустяк, моя принцесса, но большего бедный изгнанник не может себе позволить, — проговорил он, положив перед ней небольшую стопку старинных книг. Это были истории и песни Семи Королевств, написанные на общем языке. Дени поблагодарила рыцаря от всего сердца.</p><p class="p1">Магистр Иллирио пробормотал приказ, и пятеро крепких рабов вышли вперед с огромным кедровым сундуком, окованным бронзой. Открыв его, она обнаружила груды тончайших бархатов и дамасков, которые умели делать в Вольных Городах; поверх мягкой ткани лежали три огромных яйца. Дени охнула. Она не видела ничего прекраснее, каждое отличалось от других и переливалось невероятно богатыми красками; сначала ей даже показалось, что они украшены драгоценностями. Яйца были такими большими, что их пришлось брать обеими руками. Дени поднимала их аккуратно, предполагая, что видит вещицы, изготовленные из тонкого фарфора, деликатной эмали или цветного стекла, но они оказались гораздо тяжелее, чем если бы были сделаны из камня. Поверхность яиц была покрыта крошечными чешуйками, и, повертев их, Дени заметила, что они отливают полированным металлом цвета заходящего солнца. Одно яйцо было глубокого зеленого цвета с золотистыми пятнышками, которые появлялись и исчезали в зависимости от того, как она его поворачивала. Другое оказалось бледно-желтым с красными полосками. Последнее же, черное, как полночное море, выглядело живым, по нему пробегали алые завитки и волны.</p><p class="p1">— Что это такое? — спросила она негромким, полным удивления голосом.</p><p class="p1">— Драконьи яйца, привезенные из Края Теней за Асшаем, — отвечал магистр Иллирио. — Эоны обратили их в камень, и все же они горят красотой.</p><p class="p1">— Я буду хранить это сокровище! — Дени слыхала рассказы о подобных яйцах, но никогда не видела ни одного и не думала, что увидит. Это был действительно великолепный дар. Впрочем, она знала, что Иллирио может позволить себе расточительность: он получил целое состояние лошадьми за посредничество в ее продаже кхалу Дрого.</p><p class="p1">Кровные всадники кхала поднесли ей, как требовал обычай, три вида оружия, надо сказать, великолепной работы. Хагго подарил ей огромный кожаный кнут с серебряной рукоятью. Кохолло — великолепный аракх, украшенный золотом, а Квото — громадный изогнутый лук из драконьей кости. Магистр Иллирио и сир Джорах научили ее подобающему отказу от подобных приношений. Ей следовало говорить, что сей дар достоин великого воина, что она всего лишь женщина и что только господин ее и муж достоин носить это оружие. Так и кхал Дрого получил свои брачные дары.</p><p class="p1">Дотракийцы подарили ей множество всяких вещей. Шлепанцы и драгоценные камни, серебряные кольца для волос и пояса для медальонов, раскрашенные жилеты и мягкие меха, песочный шелк, горшочки с притираниями, иголки, перья и крошечные бутылочки пурпурного стекла, наконец, мантию, сшитую из шкурок тысячи мышей.</p><p class="p1">— Великолепный дар, кхалиси, — оценил магистр Иллирио последний предмет, объяснив ей магические свойства мантии: — Сулит счастье.</p><p class="p1">Дары складывали вокруг Дейенерис в огромные груды, их было больше, чем она могла представить себе, больше, чем ей было нужно, больше, чем она могла использовать.</p><p class="p1">Наконец, кхал Дрого преподнес ей собственный дар. Когда он оставил ее, молчание побежало от центра стана и постепенно охватило весь кхаласар. Когда Дрого вернулся, плотная толпа подносящих дары дотракийцев расступилась, и кхал подвел к ней коня. Это была молодая кобылица, нервная и великолепная. Дени достаточно разбиралась в конях, чтобы понять, насколько это необыкновенная лошадь. Было в ней нечто такое, от чего захватывало дыхание. Шкура напоминала зимнее море, а грива курилась серебряным дымом. Дени нерешительно прикоснулась к ней, погладила конскую шею, провела пальцами по серебристой гриве. Кхал Дрого сказал что-то по-дотракийски, и магистр Иллирио перевел:</p><p class="p1">— Серебро к серебру твоих волос, сказал тебе кхал.</p><p class="p1">— Она прекрасна, — пробормотала Дени.</p><p class="p1">— Она — гордость всего кхаласара, — сказал Иллирио. — Обычай требует, чтобы кхалиси ездила на коне, достойном ее места возле кхала.</p><p class="p1">Дрого шагнул вперед и взял ее за талию. Он поднял Дени так легко, словно бы она была ребенком, и усадил в тонкое дотракийское седло, много проще тех, к которым она привыкла. Дени застыла, растерявшись на миг: никто не предупредил ее об этом.</p><p class="p1">— Что мне делать? — спросила она Иллирио.</p><p class="p1">Ответил ей сир Джорах Мормонт:</p><p class="p1">— Берите поводья и поезжайте. Но недалеко.</p><p class="p1">Волнуясь, Дени подобрала узду и вставила ноги в короткие стремена. Она ездила только на ярмарках и наездницей себя считать не могла; путешествовать ей приводилось на кораблях, фургонах, паланкинах, но не на конской спине. Помолившись о том, чтобы не упасть и не опозорить себя, Дени легко, едва ли не застенчиво прикоснулась к лошади и коленями послала ее вперед.</p><p class="p1">И впервые за последнее время совсем забыла об испуге. А быть может, и вообще впервые в жизни.</p><p class="p1">Серебристо-серая кобыла взяла с места гладко и плавно, толпа расступилась, не отводя от Дени глаз; она обнаружила, что несется быстрее, чем хотела, но скорость лишь обрадовала ее, а не испугала. Лошадь перешла на рысь, Дени улыбнулась. Дотракийцы торопливо давали дорогу. Хватало легкого прикосновения ногами, напряжения удил. Она послала лошадь в галоп, и дотракийцы захохотали, с криками отпрыгивая с пути. Когда Дени повернула обратно, прямо перед ней возник костер. Их сжимали с обеих сторон так, что не было места объехать. С неведомой до сих пор отвагой Дейенерис послала кобылу вперед. Серебряная лошадь перелетела пламя словно бы на крыльях.</p><p class="p1">Когда она остановилась возле магистра Иллирио, Дени проговорила:</p><p class="p1">— Скажи кхалу Дрого, что он подарил мне ветер. — Жирный пентошиец гладил желтую бороду, переводя ее слова на дотракийский, и тут она впервые увидела улыбку своего мужа.</p><p class="p1">Последний осколок солнца исчез за высокими стенами Пентоса на западе, но Дени потеряла счет времени. Кхал Дрого велел кровным всадникам привести своего собственного коня, стройного рыжего жеребца. Пока кхал седлал его, Визерис скользнул поближе к серебряной кобыле, впился пальцами в ногу Дени и сказал:</p><p class="p1">— Порадуй его, милая сестрица, или клянусь, ты увидишь такого дракона, какого еще не встречала.</p><p class="p1">С этими словами брата страх опять вернулся к ней. Дени вновь ощутила себя ребенком, тринадцатилетней одинокой девочкой, не готовой к тому, что ожидало ее.</p><p class="p1">Они оставили позади кхаласар и травяные жилища, они мчались, и звезды высыпали на небо. Кхал Дрого не говорил ей ни слова, но гнал своего жеребца крупной рысью в собирающейся тьме. Крошечные серебряные колокольчики в его длинной косе тихо позвякивали при езде.</p><p class="p1">— Я от крови дракона, — громко прошептала Дени, чтобы поддержать в себе отвагу. — Я от крови дракона. Я от крови дракона. Я от крови дракона. Дракон никогда не боится!</p><p class="p1">Потом она не могла вспомнить, сколько времени это длилось, но когда они остановились у заросшей травой низинки возле небольшого ручья, совсем стемнело. Дрого соскочил с коня и снял Дени с кобылы. В его руках она ощущала себя хрупкой как стекло, а руки и ноги сделались слабыми как вода. Беспомощная и жалкая, она дрожала в своих свадебных шелках, пока Дрого привязывал коней, а когда кхал обернулся к ней, заплакала. Кхал Дрого поглядел на ее слезы со странно бесстрастным лицом.</p><p class="p1">— Нет. — Он поднял руку и стер слезы с ее лица грубым мозолистым большим пальцем.</p><p class="p1">— Ты говоришь на общем языке? — с удивлением спросила Дени.</p><p class="p1">— Нет, — отвечал он опять.</p><p class="p1">Наверное, он знает одно это слово, подумала Дени, но она почему-то вдруг приободрилась. Дрого легким движением прикоснулся к ее волосам, пропустив серебристые пряди между пальцами, тихо бормоча что-то на дотракийском. Дени не понимала слов, но в голосе мужа слышались тепло и нежность, которых она не ожидала от этого человека.</p><p class="p1">Взяв за подбородок, он приподнял ее голову, и она заглянула в его глаза. Дрого возвышался над ней, как над всем вокруг.</p><p class="p1">Взяв Дени под руки, он посадил ее на круглый камень. Потом сел на землю перед ней, скрестив ноги. Их лица наконец оказались на одной высоте.</p><p class="p1">— Нет, — сказал он.</p><p class="p1">— Это единственное слово, которое ты знаешь? — спросила она.</p><p class="p1">Дрого не ответил. Тяжелая коса покрылась пылью. Он перебросил ее через правое плечо и начал по одному снимать колокольчики. Спустя мгновение Дени склонилась вперед, чтобы помочь. Когда они были сняты, Дрого кивнул. Она поняла. И медленно, осторожно начала расплетать косу. На это ушло много времени. Все это время он сидел, молчаливо следя за ней, и когда она закончила, мотнул головой и волосы рассыпались позади него темной рекой, намасленные и блестящие. Она никогда не видела таких длинных, черных и густых волос.</p><p class="p1">Теперь пришел его черед. Он начал раздевать ее. Пальцы Дрого оказались ловкими и странно нежными. Один за другим он снял с нее шелка. Недвижимая Дени лишь молча глядела ему в глаза. Когда он обнажил ее крохотные грудки, она не сумела справиться с собой, потупила глаза и прикрыла их руками.</p><p class="p1">— Нет, — сказал Дрого и отвел ее руки, мягко, но твердо, а потом опять поднял ее лицо, чтобы она глядела на него. — Нет, — повторил он.</p><p class="p1">— Нет, — отозвалась она словно эхо. Он поставил ее и придвинул к себе, чтобы снять последние одежды. Ночной воздух холодом прикоснулся к нагому телу. Дени поежилась, на ногах и руках выступила гусиная кожа. Она боялась того, что будет, но ничего страшного не случилось. Кхал Дрого сидел, скрестив ноги, впивая ее тело своими глазами. А потом начал прикасаться к ней, сперва почти незаметно, потом крепче. Дени ощущала свирепую силу в его руках, но ей не было больно. Он взял ее руку и по одному растер пальцы. Потом нежно провел рукой по ноге. Погладил лицо, уши, ласково повел пальцем вокруг рта, запустил обе руки в волосы и расчесал их своими пальцами. Потом повернул ее, растер плечи, провел рукой по спине.</p><p class="p1">Наверное, прошли часы, прежде чем его руки добрались до грудей.</p><p class="p1">Он гладил мягкую кожу под ними, пока по ним не побежали мурашки. Поведя пальцами вокруг ее сосков, он зажал их между указательным и большим пальцами, а потом потянул на себя — сперва легко-легко, а потом настойчивее, так, что соски напряглись и заныли.</p><p class="p1">Тогда он остановился и посадил девушку к себе на колени. Дени горела, задыхалась, сердце колотилось в груди. Взяв ее лицо в свои огромные руки, он заглянул в ей глаза.</p><p class="p1">— Нет? — спросил он. И она поняла, что это за вопрос.</p><p class="p1">Она взяла его руку и опустила к влаге между своих бедер.</p><p class="p1">— Да, — прошептала она, вводя в себя его палец.</p></span>
