<span id="id11"><div class="title2">
<p class="p">Джон</p>
</div><p class="p1">Джон медленно поднимался по ступенькам, стараясь не думать о том, что, возможно, делает это в последний раз. Призрак безмолвно топал позади него. Снаружи, в воротах замка, кружил снег, во дворе стоял шум и хаос, но внутри толстых каменных стен было тепло и покойно. Слишком уж спокойно — на взгляд Джона.</p><p class="p1">Поднявшись, он испуганно замер на лестничной площадке. Призрак ткнулся носом в его ладонь, подбадривая. Джон распрямился и вошел в комнату.</p><p class="p1">Леди Старк находилась возле постели Брана. Она сидела там день и ночь уже почти две недели, ни на мгновение не оставляя Брана. Сюда ей приносили еду, горшок тоже. Спала она на твердой небольшой постели; впрочем, говорили, что она вообще не спала. Кейтилин сама кормила сына медом, поила водой и травяным отваром, поддерживавшими его, ни на миг не оставляя комнату. Поэтому Джон сюда и не приходил, но теперь выхода не было.</p><p class="p1">Он на миг задержался в двери, боясь заговорить, боясь подойти ближе. Окно было открыто. Внизу завыл волк. Призрак услыхал и поднял голову.</p><p class="p1">Леди Старк оглянулась. Мгновение она как будто не узнавала его, но наконец моргнула.</p><p class="p1">— Что ты делаешь здесь? — спросила она голосом странно бесстрастным и ровным.</p><p class="p1">— Я пришел повидать Брана, — отвечал Джон. — Попрощаться с ним.</p><p class="p1">Лицо мачехи не переменилось. Длинные, осеннего цвета волосы потускнели и спутались. Казалось, что она постарела на двадцать лет.</p><p class="p1">— Ты уже попрощался. А теперь уходи.</p><p class="p1">Часть души его мечтала только о бегстве, но Джон знал, что если поддастся слабости, то никогда впредь не увидит Брана. Он нервно шагнул в комнату и попросил:</p><p class="p1">— Пожалуйста!</p><p class="p1">Что-то холодное шевельнулось в ее глазах.</p><p class="p1">— Я велела тебе уходить. Ты здесь не нужен.</p><p class="p1">Некогда подобные слова заставили бы его бежать. Некогда они могли заставить его плакать. Но сейчас Джон лишь рассердился. Скоро он присягнет на верность Ночному Дозору, и тогда его ждут худшие опасности, чем общество Кейтилин Талли Старк.</p><p class="p1">— Он мой брат, — сказал Джон.</p><p class="p1">— Или мне позвать стражу?</p><p class="p1">— Зовите, — ответил Джон с возмущением. — Но вы не сможете запретить мне попрощаться с ним. — Он вошел в комнату, держась по другую сторону постели от леди Старк, и поглядел на Брана.</p><p class="p1">Она держала одну из его рук, теперь напоминавшую клешню. Это был не тот Бран, которого помнил Джон: плоть ушла от него. Кожа обтянула кости, подобные палкам. Ноги под одеялом изгибались под таким углом, что Джону сделалось худо. Глаза брата ввалились в черные ямы, они были открыты, но ничего не видели. Падение каким-то образом иссушило Брана. Он казался засохшим листком, и первый порыв ветра мог унести его в могилу. И все же под хрупкой грудной клеткой, под переломанными ребрами вздымалась грудь, опадая с каждым мелким выдохом.</p><p class="p1">— Бран, — позвал Джон. — Прости, что я не пришел к тебе раньше. Я боялся. — Он ощущал, как слезы катятся по его щекам, но ему теперь было безразлично. — Не умирай, Бран, прошу тебя. Мы все ждем, чтобы ты очнулся. Я, Робб и девочки, все кругом…</p><p class="p1">Леди Старк неотрывно следила за ним. Она не подняла крик, и Джон принял ее молчание за согласие. Снаружи, за окном, вновь взвыл лютоволк. Тот, которому Бран так и не успел дать имени.</p><p class="p1">— Сейчас мне надо ехать, — проговорил Джон. — Дядя Бенджен ждет, я поеду на север, к Стене. Мы отправимся сегодня, пока еще не пошел сильный снег.</p><p class="p1">Как ждал Бран предстоявшее ему путешествие! Джон не мог подумать, что придется оставить брата таким. Он смахнул слезы, нагнулся и легонько поцеловал брата в губы.</p><p class="p1">— Я хотела, чтобы он остался со мной, — сказала негромко леди Старк.</p><p class="p1">Джон с опаской повернулся в ее сторону, но Кейтилин даже не глядела на него. Она говорила, словно бы не замечая его.</p><p class="p1">— Я молилась об этом, — проговорила она тусклым голосом. — Бран был моим любимцем. Я отправилась в септу и семь раз помолилась семи именам бога, чтобы Нед изменил свои намерения и оставил его со мной. Иногда молитвы доходят.</p><p class="p1">Джон не знал, что сказать.</p><p class="p1">— Но в этом не было вашей вины, — выдавил он после неловкого молчания. Глаза ее обратились к нему. Взгляд леди Кейтилин был полон яда.</p><p class="p1">— Я не нуждаюсь в твоих утешениях, бастард.</p><p class="p1">Джон потупил глаза. Она не выпускала одну из ладоней Брана. Он прикоснулся к другой и пожал пальцы, ставшие похожими на птичьи кости.</p><p class="p1">— До свидания, — проговорил Джон. Он уже был у двери, когда Кейтилин остановила его.</p><p class="p1">— Джон, — сказала она. Он ушел бы, но леди Старк никогда не обращалась к нему по имени. Он обернулся и увидел, что она смотрела на него, словно бы впервые заметив.</p><p class="p1">— Да? — проговорил он.</p><p class="p1">— На его месте должен был лежать ты, — сказала она. А потом повернулась назад к Брану и зарыдала, сотрясаясь всем телом. Джон никогда еще не видел, чтобы она так плакала.</p><p class="p1">Долог был путь вниз во двор. Снаружи царили шум и смятение. Вовсю кричали люди, грузившие фургоны, запрягавшие и седлавшие коней и выводившие их из конюшен. Пошел легкий снег, и все торопились.</p><p class="p1">Посреди толпы находился Робб, выкрикивавший распоряжения; брат, казалось, сразу подрос, словно бы падение Брана и несчастье матери каким-то образом прибавили ему сил. Серый Ветер был возле него.</p><p class="p1">— Дядя Бенджен разыскивает тебя, — сказал Робб. — Он хотел уехать уже час назад.</p><p class="p1">— Знаю, — отмахнулся Джон. — Сейчас! — Он оглядел весь этот шум и смятение. — А расставаться труднее, чем я думал.</p><p class="p1">— По-моему, тоже, — проговорил Робб. Снежинки застревали в его волосах и таяли. — Видел его?</p><p class="p1">Джон кивнул, не имея силы ответить.</p><p class="p1">— Он не умрет, — сказал Робб. — Я знаю это.</p><p class="p1">— Вас, Старков, трудно убить, — согласился Джон голосом ровным и усталым. Визит этот отнял у него все силы.</p><p class="p1">Робб понял, что случилось нечто нехорошее.</p><p class="p1">— Моя мать… — начал он.</p><p class="p1">— Она была… очень добра со мной, — перебил его Джон.</p><p class="p1">Робб улыбнулся с облегчением:</p><p class="p1">— Хорошо. В следующий раз мы встретимся, когда ты будешь уже в черном.</p><p class="p1">Джон заставил себя ответить улыбкой:</p><p class="p1">— Я всегда любил этот цвет. А как ты думаешь, много ли времени пройдет до присяги?</p><p class="p1">— Не очень, — предположил Робб. Он прижал к себе Джона и крепко обнял его. — Ну а теперь — прощай!</p><p class="p1">Джон ответил объятием:</p><p class="p1">— И ты тоже, Старк. Заботься о Бране.</p><p class="p1">— Можешь не сомневаться! — Они отодвинулись и с неловкостью поглядели друг на друга. — Дядя Бенджен велел, как только я увижу тебя, передать, чтобы ты шел в конюшню, — наконец сказал Робб.</p><p class="p1">— Мне нужно попрощаться еще с одним человеком, — сообщил ему Джон.</p><p class="p1">— Тогда я тебя не видел, — ответил Робб.</p><p class="p1">Джон оставил брата стоящим в снегу, окруженным фургонами, волками и лошадьми. До арсенала было недалеко. Джон прихватил свой сверток и по крытому мостику направился в замок.</p><p class="p1">Арья находилась в своей комнате, она укладывала вещи в полированный сундук из железного дерева, такой большой, что она сама поместилась бы в нем. Нимерия помогала. Арье нужно было только показать, и волчица бросалась через всю комнату, брала зубами нужное шелковое одеяние и приносила его. Но уловив запах Призрака, она присела на задние лапы и тявкнула на вошедших.</p><p class="p1">Арья обернулась, заметила Джона и вскочила на ноги. Она обняла его за шею своими тонкими руками.</p><p class="p1">— Я боялась, что ты уже уехал, — сказала она, дыхание ее перехватывало. — Меня не выпускают, чтобы попрощаться.</p><p class="p1">— А что ты сейчас делала? — Джон был удивлен.</p><p class="p1">Арья отодвинулась от него и скривилась.</p><p class="p1">— Ничего. Я просто собиралась. — Она кивнула на огромный сундук, наполненный не более чем наполовину, и вещи, разбросанные по комнате. — Но септа Мордейн сказала, что я сделала все не так и вещи мои сложены неправильно. Она считает, что настоящая южная леди не бросает свои вещи в сундук словно тряпки.</p><p class="p1">— Значит, ты так и поступила, маленькая сестрица?</p><p class="p1">— Но они же все равно перепутаются, — сказала Арья. — Какая разница, как они сложены?</p><p class="p1">— Кстати, о септе Мордейн, — заметил Джон. — Едва ли ей понравится, что Нимерия помогает тебе. — Волчица безмолвно поглядела на него темно-золотыми глазами. — Но ничего. У меня есть кое-что для тебя. Ты возьмешь это с собой и спрячешь подальше.</p><p class="p1">Лицо Арьи осветилось.</p><p class="p1">— Это подарок?</p><p class="p1">— Можешь называть и так. Закрой дверь.</p><p class="p1">С опаской взволнованная Арья выглянула в коридор.</p><p class="p1">— Нимерия, сюда! Охраняй. — Она посадила волчицу снаружи, чтобы та помешала нежеланному вторжению, и закрыла дверь. К этому времени Джон уже развернул все тряпки, которыми обмотал свой подарок.</p><p class="p1">— Вот.</p><p class="p1">Глаза Арьи расширились… Темные глаза, подобные его собственным.</p><p class="p1">— Меч, — сказала она негромко.</p><p class="p1">Ножны из мягкой серой кожи зашуршали вкрадчиво, словно грех. Джон медленно извлек клинок, так чтобы сестра увидела глубокую синеву стали.</p><p class="p1">— Это не игрушка, — сказал он. — Будь осторожна и не порежься. Лезвием можно даже бриться.</p><p class="p1">— Девочки не бреются, — заметила Арья.</p><p class="p1">— Иногда приходится. Ты когда-нибудь видела ноги септы?</p><p class="p1">Арья хихикнула:</p><p class="p1">— Она такая худая.</p><p class="p1">— Ты тоже, — сказал Джон. — Я велел Миккену сделать это для тебя. В Пентосе и Мире и в других свободных городах такими пользуются бандиты. Голову им не срубить, но дырок можно наделать изрядное количество — если поторопишься.</p><p class="p1">— Я умею двигаться быстро, — сказала Арья.</p><p class="p1">— Тебе придется тренироваться с мечом каждый день. — Джон вложил оружие в ее руки, показал, как держать, и отступил. — Ну, как ты себя чувствуешь? Он тебе по руке?</p><p class="p1">— По-моему, да, — отвечала Арья.</p><p class="p1">— Вот первый урок, — сказал Джон, — протыкай их насквозь. — Он указал на платья, висевшие на стене.</p><p class="p1">Арья шлепнула его плоской стороной меча по руке. Удар оказался болезненным, но Джон обнаружил, что ухмыляется как идиот.</p><p class="p1">— Я знаю, с какого конца им пользуются, — сказала Арья, но тут же сомнение пробежало по ее лицу. — Септа Мордейн отберет его у меня.</p><p class="p1">— Нет — если не будет знать о нем.</p><p class="p1">— А с кем мне практиковаться?</p><p class="p1">— Найдешь кого-нибудь, — пожал плечами Джон. — Королевская Гавань — настоящий город. Он в тысячу раз больше Винтерфелла. Ну а пока не найдешь партнера, наблюдай за тем, как фехтуют при дворе. Бегай, катайся верхом, укрепляй силы. И что бы ты ни делала…</p><p class="p1">Арья знала, что сейчас последует, и они договорили вместе:</p><p class="p1">— …не… говори… Сансе!</p><p class="p1">Джон растрепал ее волосы.</p><p class="p1">— Мне будет не хватать тебя, маленькая сестричка.</p><p class="p1">Арья почувствовала, что собирается плакать.</p><p class="p1">— Жаль, что ты не едешь с нами.</p><p class="p1">— В один и тот же замок нередко ведет множество дорог. Кто знает? — Джон чувствовал себя теперь увереннее. Он не хотел допускать печаль в свое сердце. — Ну а теперь мне пора. Если я заставлю дядю Бена ждать, весь первый год на Стене мне суждено выносить ночные горшки.</p><p class="p1">Арья побежала к нему для последнего объятия.</p><p class="p1">— Сперва положи меч, — предостерег ее со смехом Джон.</p><p class="p1">Застенчивым движением отставив оружие, она покрыла лицо брата поцелуями.</p><p class="p1">Джон повернулся назад к двери, Арья взяла меч, взвешивая его в руке.</p><p class="p1">— Чуть не забыл, — сказал Джон. — У всех хороших мечей есть имена.</p><p class="p1">— Например, Лед. — Она поглядела на клинок в своих руках. — Неужели у него уже есть имя? Ну говори же.</p><p class="p1">— Разве ты не догадываешься? — поддразнил Джон. — Назови свою самую любимую вещь.</p><p class="p1">Арья сперва удивилась, а потом поняла. И они хором произнесли:</p><p class="p1">— Игла!</p><p class="p1">Воспоминание это долго потом согревало его в дороге на север.</p></span>
