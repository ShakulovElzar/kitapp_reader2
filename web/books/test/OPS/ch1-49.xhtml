<p class="p">Дейенерис</p>
</div><p class="p1">Сердце дымилось на вечернем холодке, когда кхал Дрого подал ей кровавую плоть обагренными до локтя руками. Позади кхала стояли кровные всадники — на песке, на коленях возле туши дикого жеребца, с каменными ножами в руках. Кровь жеребца казалась черной в неровном оранжевом свете факелов, на высоких меловых стенах ямы.</p><p class="p1">Дени прикоснулась к своему мягкому округлившемуся животу. Капли пота выступили на ее коже, стекали по лбу. Она ощущала на себе взгляд старух дош кхалина, кремни глаз темнели на морщинистых лицах. «Ты не должна дрогнуть или убояться, ты дочь дракона», — сказала она себе и обеими руками поднесла сердце жеребца ко рту и впилась зубами в жесткое упругое мясо.</p><p class="p1">Теплая кровь наполнила рот Дени, побежала по подбородку. От вкуса ее замутило, однако она заставила себя прожевать и проглотить первый кусок. Дотракийцы полагали, что сердце жеребца сделает ее сына сильным, быстрым и бесстрашным, но только если она сумеет съесть его целиком. Если женщина давилась кровью или исторгала мясо, предзнаменование считалось неблагоприятным; дитя могло оказаться мертворожденным, слабым или уродливым. Или даже родиться девочкой…</p><p class="p1">Служанки помогли Дени подготовиться к церемонии, невзирая на слабость желудка, преследовавшую ее последние два месяца. Дени пообедала чашей полусвернувшейся крови, чтобы привыкнуть к вкусу, а Ирри заставила ее жевать нарезанную полосами вяленую конину, пока челюсти ее не заболели. Перед обрядом она ничего не ела целый день и ночь, чтобы голод помог ее телу удержать в себе сырое мясо.</p><p class="p1">Сердце дикого жеребца состояло из одних только мышц, и Дени приходилось отрывать зубами и долго жевать каждый кусок. Сталь не могла блеснуть внутри священных пределов Вейес Дотрак, под сенью Матери гор, и ей приходилось рвать мясо зубами и ногтями. Желудок ее бурлил и волновался, но Дени ела, испачкав лицо в крови, иногда выплескивавшейся на губы.</p><p class="p1">Она ела, кхал Дрого возвышался над ней с лицом твердым, словно бронзовый щит. Длинная черная коса кхала блестела, умащенная маслом. На усах играли золотые кольца, коса пела золотыми колокольчиками, тяжелый пояс литого золота перехватывал середину его тела, но грудь оставалась нагой. Когда силы оставляли ее, Дени глядела на Дрого, просто глядела и снова жевала и глотала, жевала и глотала, жевала и глотала. Под конец Дени показалось, что она заметила свирепую гордость в его темных миндалевидных глазах, но уверенной она быть не могла: лицо кхала нечасто выдавало его мысли.</p><p class="p1">Наконец все было закончено. Липкими пальцами она поднесла к губам последний кусок и заставила себя проглотить его. И только тогда Дени обернулась к старухам, каргам дош кхалина.</p><p class="p1">— Кхалакка дотрайя мранха! — произнесла она, стараясь точно произносить дотракийские слова. — Принц едет во мне!</p><p class="p1">Фразу эту она заучивала несколько дней с помощью своей служанки Чхику, чтобы не ошибиться в произношении.</p><p class="p1">Самая древняя из старух, согбенная и иссохшая, превратившаяся в палку, возвела к небу единственный черный глаз и руки.</p><p class="p1">— Кхалакка дотрайя! — вскричала она. — Принц едет!</p><p class="p1">— Он едет! — вступили другие женщины. — Ракх! Ракх! Ракх хадж! Мальчик, мальчик, сильный мальчик…</p><p class="p1">Бронзовыми птицами запели колокола, зычно рявкнул хриплый боевой рог. Женщины завели распев. Под раскрашенными кожаными жилетами тряслись иссохшие мешки, поблескивавшие от масла и пота. Евнухи, прислуживавшие старухам, бросали пучки сушеной травы на огромную бронзовую жаровню, и облака благоуханного дыма поднимались к звездам. Дотракийцы видели в звездах сотворенных из огня небесных коней, неисчислимый табун этот каждой ночью проносится по небосклону.</p><p class="p1">Дым поднимался, песнь умолкла, и древняя старуха закрыла единственный глаз, чтобы лучше разглядеть будущее. Вокруг воцарилось полнейшее молчание. Дени слышала только далекий зов ночных птиц, шипение и треск факелов, мягкий блеск воды в озере. Ночные глаза дотракийки не отрывались от нее.</p><p class="p1">Кхал Дрого положил ладонь на руку Дени. Она почувствовала напряженность в его пальцах. Даже такой могущественный кхал, как Дрого, испытывал страх, пока дош кхалин искал в дыму черты грядущего. За спиной Дени трепетали ее служанки.</p><p class="p1">Наконец старуха открыла глаз и подняла руки.</p><p class="p1">— Я видела его лицо и слышала грохот его копыт, — провозгласила она тонким дрожащим голосом.</p><p class="p1">— Грохот его копыт! — хором подтвердили остальные.</p><p class="p1">— Скачет он, быстрый как ветер, а за конем его кхаласар покрывает землю; мужам сим нет числа, и ракхи блестят в их ладонях, подобно лезвиям меч-травы. Свирепый как буря будет этот принц. Враги его будут трепетать перед ним, и жены их возрыдают кровавыми слезами и в скорби раздерут свою плоть. Колокольчики в его волосах будут петь о его приближении, и молочные люди в своих каменных шатрах будут страшиться одного только его имени. — Старуха затрепетала и поглядела на Дени словно бы в испуге. — Принц едет, и он будет тем жеребцом, который покроет весь мир.</p><p class="p1">— Жеребцом, который покроет весь мир! — хором отозвались свидетельницы, и ночь ответила звону их голосов.</p><p class="p1">Одноглазая старуха поглядела на Дени.</p><p class="p1">— А как же будет он зваться, жеребец, который покроет весь мир?</p><p class="p1">Дени встала, чтобы ответить.</p><p class="p1">— Его будут звать Рейего, — проговорила она слова, которым научила ее Чхику. Руки ее невольно легли на живот, защищая ребенка, когда дотракийцы взревели:</p><p class="p1">— Рейего, Рейего, Рейего, Рейего!</p><p class="p1">Имя сына еще звенело в ушах Дени, когда кхал Дрого повел ее прочь из ямы. Кровные всадники следовали за ними. Во главе процессии они вышли на Божий путь, широкую, заросшую травой дорогу, протянувшуюся сквозь самое сердце Вейес Дотрак, от Конских ворот к Матери гор. Первыми, вместе с евнухами и слугами, шли старухи из дош кхалина, некоторые опирались на высокие резные посохи, с трудом передвигая древние трясущиеся ноги по дороге, другие же шествовали горделиво, как любой из владык табунщиков. Некогда каждая из старух была кхалиси. Жену присылали сюда править великим дотракийским народом после смерти благородного мужа, когда новый кхал со своей кхалиси занимал его место перед всадниками. Даже могущественнейшие из кхалов преклонялись перед мудростью и властью дош кхалина. И все же Дени было как-то не по себе от мысли, что однажды и ей суждено будет оказаться среди них, захочет она того или нет.</p><p class="p1">Позади мудрых старух шли остальные: кхал Ого и его сын, кхалакка Фого, кхал Джоммо и его жены, главные из приближенных Дрого, служанки Дени, слуги и рабы кхала и так далее. Колокола и барабаны задавали величественный ритм движению процессии, торжественно шествовавшей по Божьему пути. Украденные герои и боги мертвых народов размышляли во тьме. Вдоль шествия торопливо бежали рабы с факелами в руках, и мерцающие эти огни заставляли великие монументы казаться почти живыми.</p><p class="p1">— А что значит имя Рейего? — спросил ее Дрого на обычном языке Семи Королевств — при возможности Дени старалась научить его нескольким словам. Дрого учился быстро, когда хотел этого, однако акцент его оставался таким невозможным, что ни сир Джорах, ни Визерис не понимали ни слова из того, что говорил кхал.</p><p class="p1">— Мой старший брат Рейегар был свирепым воином, мое солнце и звезды, — отвечала она мужу. — Он умер до моего рождения. Сир Джорах говорит, что он был последним из драконов.</p><p class="p1">Кхал Дрого поглядел на нее сверху вниз. Лицо его казалось медной маской, но ей показалось, что под длинными черными усами, поникшими под весом золотых колец, промелькнула тень улыбки.</p><p class="p1">— Это хорошее имя, Дан Арес, жена, луна моей жизни, — проговорил он.</p><p class="p1">Они приехали к озеру, которое дотракийцы именовали Чревом Мира; окруженные зарослями тростников воды его всегда оставались чистыми и спокойными. Тысячу лет назад, как сказала ей Чхику, первый мужчина выехал из его глубин верхом на первом коне.</p><p class="p1">Процессия остановилась на травянистом берегу, тем временем Дени разделась и сбросила свою грязную одежду на землю. Нагая, она осторожно ступила в воду. Ирри утверждала, что у озера этого нет дна, однако Дени ощущала, как мягкая грязь просачивается между ее пальцами, пока она шла, раздвигая высокий тростник. Луна плавала на спокойных черных водах, разбиваясь на осколки и складываясь вновь, когда волны от ее ног накладывались на отражение. Мурашки пробежали по ее нежной коже, когда холодок поднялся вверх по ее бедрам, поцеловал нижние губы. Кровь жеребца засохла на ее руках и около рта. Зачерпнув обеими ладонями, Дени подняла священную воду над головой, очищая себя и дитя, находящееся внутри ее чрева; кхал и все остальные глядели на нее. Она слышала, как бормотали старухи дош кхалина, и гадала, что они говорят.</p><p class="p1">Когда мокрая и дрожащая Дени выбралась из озера, служанка ее Дореа заторопилась к ней с одеянием из крашеного шелка, но кхал Дрого отослал ее прочь движением руки. Он с одобрением глядел на вздувшееся чрево и налившиеся груди жены, и Дени заметила, как напряглась его мужественность под штанами из конской шкуры, закрытыми под тяжелыми золотыми медальонами пояса.</p><p class="p1">Она подошла к нему и помогла распустить шнурок. Могучий кхал взял ее за бедра и поднял в воздух, словно ребенка. Колокольчики в волосах его запели.</p><p class="p1">Обхватив мужа руками за плечи, Дени спрятала лицо у него на груди. Три быстрых движения — и все было кончено.</p><p class="p1">— Жеребец, который покроет весь мир, — шепнул Дрого. Руки его пахли конской кровью. В миг высшего наслаждения он прикусил кожу на ее шее, а потом снял с себя, и семя его потекло по бедрам Дени. Только потом он позволил ей одеться в надушенный шелк. Ирри надела мягкие шлепанцы на ее ноги.</p><p class="p1">Кхал Дрого завязал штаны, отдал приказ, и на берег вывели коней. Кохолло была предоставлена честь помочь кхалиси подняться на свою Серебрянку. Дрого пришпорил своего жеребца и направился прочь по Божьему пути, под луной и звездами. Дени легко догнала его.</p><p class="p1">Шелковый тент, покрывавший сверху приемный зал кхала Дрого, сегодня был свернут, и луна последовала за ними внутрь дворца. Четырехфутовые языки пламени плясали на трех огромных каменных очагах. В воздухе пахло жареным мясом и перебродившим кобыльим молоком. Полный зал гудел — здесь на подушках сидели те, чей сан и имя не давали права присутствовать при церемонии. Дени въехала в арку, проехала дальше по проходу между сидящими; все глядели на нее. Дотракийцы перекрикивались, превознося ее чрево и грудь, возвеличивая жизнь, растущую внутри нее. Дени не понимала всего, что они говорили, но одна фраза заглушала все остальные.</p><p class="p1">— Жеребец, который покроет весь мир, — звучал тысячеголосый хор.</p><p class="p1">Рокот барабанов и стоны труб разносились в ночи. Полуодетые женщины кружили и плясали на низких столах, среди блюд и подносов с мясом, сливами, финиками и гранатами. Многие мужчины уже перепились перебродившего молока, но Дени знала: сегодня аракхам не звенеть друг о друга; здесь, в священном городе, запрещалось обнажать мечи и лить кровь.</p><p class="p1">Кхал Дрого спешился и занял свое место на высокой скамье. Кхал Джоммо и кхал Ого, уже находившиеся в Вейес Дотрак со своими кхаласарами, были удостоены самых почетных мест — справа и слева от Дрого. Позади троих кхалов сидели кровные всадники, ниже располагались три жены кхала Джоммо.</p><p class="p1">Дени спустилась со своей Серебрянки и отдала поводья рабу. Когда Дореа и Ирри устроили для нее подушки, она поискала взглядом своего брата. Визериса можно было бы заметить даже в противоположном конце людного зала, но ни серебряной головы брата, ни бледного лица, ни городских лохмотьев нигде не было видно. Она обратила взгляд к людным столам возле стен, где мужчины, чьи косы были даже короче их мужского признака, сидели на бахромчатых ковриках и плоских подушках у невысоких столов, но все лица были черноглазы и меднокожи. Она отыскала сира Джораха Мормонта в середине зала возле главного очага. Место это считалось почетным и даже весьма: дотракийцы ценили искусство рыцаря во владении мечом. Дени послала Чхику привести его к своему столу. Мормонт явился немедленно и опустился перед ней на одно колено.</p><p class="p1">— Кхалиси, — проговорил он, — приказывайте, повинуюсь.</p><p class="p1">Она хлопнула по набитой подушке из конской шкуры возле себя.</p><p class="p1">— Садись и поговори со мной.</p><p class="p1">— Вы оказываете мне честь. — Рыцарь уселся на подушку, скрестив ноги. Раб склонился перед ним, предлагая деревянное блюдо, полное спелых фиг. Сир Джорах взял одну и откусил половину.</p><p class="p1">— А где мой брат? — спросила Дени. — Он должен был прийти на пир.</p><p class="p1">— Я видел светлейшего государя этим утром, — сказал ей Мормонт. — Он говорил, что собирается на западный рынок, чтобы найти вина.</p><p class="p1">— Вина? — с явным недовольством в голосе повторила Дени. Визерис не мог переносить вкуса перебродившего молока, которое пили дотракийцы, она знала это; в эти дни брат частенько посещал базары, выпивая с торговцами, приводившими великие караваны с запада и востока. Похоже, он находил их общество более приятным.</p><p class="p1">— Вина, — подтвердил сир Джорах. — Потом он захотел нанять в свое войско кого-нибудь из наемников, охраняющих караваны.</p><p class="p1">Служанка положила перед ним пирог с кровью, и рыцарь обеими руками взял его.</p><p class="p1">— А это разумно? — спросила она. — У него нет золота, чтобы заплатить солдатам. Что, если они предадут его? — Провожатые караванов редко тревожили себя мыслями о чести, узурпатор, засевший в Королевской Гавани, хорошо заплатил бы им за голову брата. — Вам следовало бы пойти с ним, чтобы приглядеть за его безопасностью. Вы же присягнули ему!</p><p class="p1">— Мы находимся в Вейес Дотрак, — напомнил ей рыцарь. — Здесь никто не вправе обнажить клинок и пролить кровь.</p><p class="p1">— Но люди тем не менее умирают, — сказала она. — Так сказал мне Чхого. Некоторые из торговцев привозят с собой рослых евнухов, которые удавливают воров шелковой лентой. При этом кровь не проливается, и боги спокойны.</p><p class="p1">— Тогда будем надеяться, что ваш брат проявит достаточно мудрости и не будет ничего красть. — Сир Джорах стер жир со рта тыльной стороной ладони и пригнулся над столом. — Он намеревался забрать у вас драконьи яйца, но я предупредил, что отсеку ему руку, если он посмеет даже прикоснуться к ним.</p><p class="p1">На мгновение Дени почувствовала такое потрясение, что у нее даже не хватило слов.</p><p class="p1">— Мои яйца… но они же мои… их мне подарил магистр Иллирио, это подарок к свадьбе, но зачем они Визерису… это всего лишь только камни…</p><p class="p1">— Этим же словом можно назвать и рубины, алмазы и огненные опалы, принцесса… но драконьи яйца встречаются куда реже. Торговцы, с которыми он пьет, позволят отрезать свою мужественность даже за один из этих камней, ну а за три Визерис сможет нанять столько наемников, сколько ему потребуется.</p><p class="p1">Дени не знала, даже не подозревала об этом.</p><p class="p1">— Тогда он должен получить их. Ему незачем их красть. Ему нужно только попросить! Он мой брат… и мой истинный король.</p><p class="p1">— Да, он ваш брат, — согласился сир Джорах.</p><p class="p1">— Вы не понимаете, сир, — сказала она. — Мать моя умерла, давая мне жизнь, а отец и мой брат Рейегар погибли еще до того. Я не знала бы даже их имен, если бы их не назвал мне Визерис. Он у меня один. Единственный. Кроме него, у меня никого нет.</p><p class="p1">— Так было прежде, — сказал сир Джорах, — но теперь это не так, кхалиси. Вы теперь стали дотракийкой. В чреве вашем едет жеребец, который покроет весь мир. — Он поднял чашу, и раб наполнил ее перебродившим кобыльим молоком, кислым и полным комков.</p><p class="p1">Дени отмахнулась. Даже от запаха ее затошнило, и она не хотела рисковать, не хотела расставаться с кусками конского сердца, которое с таким трудом заставила себя съесть.</p><p class="p1">— Что это значит? — спросила она. — Что это за жеребец? Все кричат мне эти слова, но я не понимаю их смысла.</p><p class="p1">— Жеребец — это кхал кхалов, предсказанный в древнем пророчестве, дитя. Он объединит дотракийцев в единый кхаласар и приведет их к концам земли, так было обещано. Все люди мира покорятся ему.</p><p class="p1">— Ой, — сказала Дени тоненьким голосом. Рука ее погладила платье над раздувшимся животом. — А я назвала его Рейего…</p><p class="p1">— От этого имени кровь в жилах узурпатора застынет.</p><p class="p1">Вдруг Дореа потянула ее за локоть.</p><p class="p1">— Госпожа моя, — настоятельно шепнула служанка, — ваш брат…</p><p class="p1">Дени поглядела в дальний конец длинного, лишенного крыши зала и заметила брата, который направлялся к ней. Судя по неуверенной походке, нетрудно было понять, что Визерис отыскал свое вино… а с ним и долю того, что он выдавал за отвагу.</p><p class="p1">На Визерисе были алые шелка, грязные и запачканные в дороге. Плащ и перчатки из черного бархата выцвели на солнце. Пересохшие сапоги его скрипели, серебристые волосы спутались, на поясе в кожаных ножнах висел длинный меч. Дотракийцы заметили оружие, когда он проходил, и Дени услышала их проклятия и угрозы, гневный ропот приливом охватывал ее. Умолкла и музыка, и притих нервный, оступающийся рокот барабанов.</p><p class="p1">Жуткое предчувствие охватило ее сердце.</p><p class="p1">— Ступайте к нему, — приказала она сиру Джораху. — Остановите его. Приведите сюда. Скажите ему, что он может получить свои драконьи яйца, если это все, в чем он нуждается.</p><p class="p1">Рыцарь быстро вскочил на ноги.</p><p class="p1">— Где моя сестра? — крикнул Визерис голосом, полным вина. — Я пришел пировать. Как ты смела сесть за трапезу без меня? Никто не смеет приступать к еде прежде, чем начнет есть король. Где она? Эта шлюха не может укрыться от дракона!</p><p class="p1">Он остановился возле самого большого из трех очагов, вглядываясь в лица дотракийцев. В зале собралось тысяч пять человек, но лишь горстка из них знала общий язык. Но даже если слова его оставались непонятными, одного взгляда на Визериса было достаточно, чтобы все понять.</p><p class="p1">Сир Джорах торопливо подошел к нему, что-то шепнул на ухо и взял за руку, но Визерис вырвался.</p><p class="p1">— Убери свои руки! Никто не смеет прикасаться к дракону без его разрешения!</p><p class="p1">Дени тревожно посмотрела вверх на высокую скамью. Кхал Дрого что-то говорил кхалам, сидевшим возле него. Кхал Джоммо ухмылялся, а кхал Ого уже громко хохотал.</p><p class="p1">Смех заставил Визериса поднять глаза.</p><p class="p1">— Кхал Дрого, — сказал он заносчиво, — я прибыл на пир! — Он отшатнулся от сира Джораха, пытаясь подняться к трем кхалам на высокой скамье.</p><p class="p1">Кхал Дрого поднялся, выплюнул дюжину слов на дотракийском быстрее, чем Дени могла понять его, и указал пальцем.</p><p class="p1">— Кхал Дрого говорит, что место твое не на высокой скамье, — перевел сир Джорах ее брату. — Кхал Дрого говорит, что место твое там.</p><p class="p1">Визерис поглядел в сторону, в которую указал кхал. В дальней части длинного зала, в уголке у стены, прячась в тени так, чтобы лучшие люди не видели их, сидели нижайшие из нижайших. Юные, еще не побывавшие в стычках юноши, старики с затуманившимися глазами и одеревеневшими суставами. Слабоумные и раненые. Вдали от мяса и еще дальше от чести.</p><p class="p1">— Это не место для короля, — объявил ее брат.</p><p class="p1">— Место это, — отвечал кхал Дрого на общем языке, которому научила его Дени, — как раз и подобает королю, стершему ноги. — Он хлопнул в ладоши. — Телегу! Подайте телегу кхалу Рхаггату…</p><p class="p1">Пять тысяч дотракийцев разразились смехом и воплями. Сир Джорах стоял возле Визериса и кричал ему на ухо, но в зале поднялся столь громогласный рев, что Дени не слышала его слов. Брат ее отвечал криком, и они схватились; наконец Мормонт бросил Визериса на пол.</p><p class="p1">Брат ее извлек меч.</p><p class="p1">Нагая сталь мелькнула жутким багрянцем, отражая свет очагов.</p><p class="p1">— Убирайся от меня! — прошипел Визерис. Сир Джорах отступил на шаг, и брат ее неуверенно поднялся на ноги. Он махнул над головой чужим клинком, который магистр Иллирио дал Визерису, чтобы тот приобрел более царственный вид. Дотракийцы со всех сторон призывали проклятия на его голову.</p><p class="p1">Дени испустила безмолвный крик ужаса. Она-то знала, что ждет обнажившего меч в Вейес Дотрак, хотя брат не представлял этого.</p><p class="p1">Визерис повернул голову на ее голос и наконец заметил сестру.</p><p class="p1">— А, вот и она! — сказал он с улыбкой. И направился к ней, рассекая воздух, словно освобождая дорогу в стане врагов, хотя никто не пытался остановить его.</p><p class="p1">— Клинок… убери меч, — попросила она его. — Пожалуйста, Визерис. Это запрещено. Опусти меч и садись на подушки. Пей, ешь. Тебе нужны драконьи яйца? Возьми их, только брось меч.</p><p class="p1">— Делай, как она говорит тебе, дурак, — закричал сир Джорах. — Иначе они убьют всех нас.</p><p class="p1">Визерис расхохотался.</p><p class="p1">— Они не посмеют убить нас. Это им запрещено проливать кровь в священном городе… а не мне. — Он приложил острие меча к груди Дейенерис и провел им по ее животу. — Я хочу получить то, за чем прибыл сюда, — сказал он сестре. — Я хочу корону, и он обещал мне ее. Он купил тебя, но не заплатил. Скажи ему, что я хочу получить то, что мне причитается, или я заберу тебя назад… Тебя и драконьи яйца. А он может взять своего паршивого жеребенка. Я вырежу подлеца и подарю ему.</p><p class="p1">Меч пронзил шелка и кольнул пупок. Визерис плакал, Дейенерис видела это, он плакал и хохотал одновременно, этот человек, который прежде был ее братом. Вдали, словно где-то в другом мире, Дени слышала рыдания Чхику; она не смела переводить, в страхе перед кхалом, который мог привязать ее к собственному коню и протащить до самой Матери гор. Дени положила руки на плечи девушки и сказала:</p><p class="p1">— Не бойся, я сама скажу ему.</p><p class="p1">Дени не знала, хватит ли у нее слов, но когда она договорила, кхал Дрого произнес несколько отрывистых предложений на дотракийском, и она увидела, что он понял ее.</p><p class="p1">Солнце ее жизни спустился вниз с высокой скамьи.</p><p class="p1">— Что он сказал? — спросил человек, который был ее братом.</p><p class="p1">В зале стало так тихо, что она слышала колокольчики в волосах кхала Дрого, мягко певшие при каждом его шаге. Кровные всадники следовали за ним, как три медные тени. Дейенерис похолодела.</p><p class="p1">— Он говорит, что ты получишь великолепную золотую корону, от которой затрепещет любой человек…</p><p class="p1">Визерис улыбнулся и опустил свой меч. Это было печальнее всего, эта его улыбка так мучила ее потом.</p><p class="p1">— Только этого я и хотел, он сам обещал мне!</p><p class="p1">Когда муж, солнце ее жизни, подошел к ней, Дени обняла его за плечи. Кхал произнес слово, и кровные всадники бросились вперед. Квото схватил человека, который был ее братом за руки, Хагго раздробил ему руку резким поворотом огромных ладоней. Кохолло вырвал меч из обмякших пальцев. Но даже теперь Визерис еще ничего не понял.</p><p class="p1">— Нет, — закричал он, — вы не смеете прикасаться ко мне, я — дракон, я — дракон, и я получу корону!</p><p class="p1">Кхал Дрого расстегнул пояс, медальоны его были отлиты из чистого золота, массивного и украшенного, каждый был величиной в руку человека. Кхал выкрикнул приказ. Рабы потянули с очага тяжелый кухонный котел, вылили отвар на землю и вернули горшок в огонь. Дрого бросил в него пояс и принялся невозмутимо смотреть на медальоны, покрасневшие и начавшие оплывать. Дени видела, как пламя пляшет в ониксе его глаз. Раб подал кхалу пару толстых перчаток из конского волоса, он натянул их на руки, даже не поглядев на невольника.</p><p class="p1">Визерис завопил отчаянным тонким голосом труса, увидевшего свою смерть. Он брыкался и вырывался, скулил как пес и рыдал как дитя, но дотракийцы крепко держали его. Сир Джорах пробился к боку Дени, положил руку на ее плечо.</p><p class="p1">— Отвернитесь, моя принцесса, умоляю вас.</p><p class="p1">— Нет. — Она сложила свои руки на вздувшемся животе, защищая дитя.</p><p class="p1">Наконец Визерис поглядел на нее.</p><p class="p1">— Сестра, прошу… Дени, скажи им… пусть они… милая сестрица…</p><p class="p1">Когда золото наполовину расплавилось и начало растекаться, Дрого потянулся к пламени и выхватил горшок.</p><p class="p1">— А вот и корона! — взревел он. — Вот и корона для тележного короля! — Кхал перевернул горшок над головой человека, который был ее братом.</p><p class="p1">Вопль, который издал Визерис Таргариен, когда жуткий железный шлем прикрыл его лицо, ничуть не напоминал человеческий. Ноги его выбили отчаянную дробь по утоптанной земле, движения их замедлились, остановились. Капли расплавленного золота стекали на его грудь, воспламеняя алый шелк… но ни капли крови не было пролито.</p><p class="p1">Он не был драконом, подумала Дени, ощутив неожиданное спокойствие. Огонь не может убить дракона.</p></span>
