<span id="id18"><div class="title2">
<p class="p">Бран</p>
</div><p class="p1">Казалось, что он падал годы и годы. Лети, шептал ему голос во сне. Бран летать не умел, поэтому оставалось лишь падать. Мейстер Лювин слепил из глины мальчишку и обжег его, чтобы тело сделалось твердым и хрупким. Одел в одежды Брана и сбросил с крыши. Бран вспомнил, как разбилась фигурка.</p><p class="p1">— Но я никогда не упаду, — сказал он падая.</p><p class="p1">Земля была так далеко, что Бран едва мог разглядеть ее сквозь туман, кружившийся вокруг, но он чувствовал, насколько быстро летит, и знал, что его ждет внизу. Даже во сне нельзя падать вечно. Он проснется за мгновение до того, как ударится о землю. Бран знал это, потому что всегда просыпался за мгновение до того, как ударялся о землю.</p><p class="p1">— А если нет? — прошептал чей-то голос.</p><p class="p1">Земля приближалась, оставаясь еще далеко, — в тысяче миль, но уже ближе, чем раньше. Здесь, во тьме, было холодно. Здесь не было звезд, не было солнца, лишь земля надвигалась, чтобы разбить его тело, и серый туман, и шепчущий голос. Ему захотелось плакать.</p><p class="p1">— Не плачь. Лети.</p><p class="p1">— Я не могу летать, — сказал Бран. — Не могу, не могу…</p><p class="p1">— Откуда ты знаешь? Разве ты пытался?</p><p class="p1">Голос был высоким и тонким. Бран огляделся, чтобы понять, откуда он доносится. Рядом с ним спиралью опускался ворон, но Бран падал и не мог дотянуться до него рукой.</p><p class="p1">— Помоги мне, — сказал Бран.</p><p class="p1">— Я пытаюсь, — отвечал ворон. — Скажи, а зерно принес?</p><p class="p1">Бран полез в карман, а земля кружила голову и вращалась вокруг. Он извлек руку, и золотые зернышки посыпались между пальцами в воздух. Они падали вместе с ним. Ворон уселся на его руку и начал есть.</p><p class="p1">— А ты и в самом деле ворон? — спросил Бран.</p><p class="p1">— А ты и в самом деле падаешь? — ответил тот вопросом на вопрос.</p><p class="p1">— Это просто сон, — сказал Бран.</p><p class="p1">— Разве? — спросил ворон.</p><p class="p1">— Я проснусь, когда ударюсь о землю, — сказал Бран птице.</p><p class="p1">— Ты умрешь, когда ударишься о землю, — поправил его ворон, продолжая клевать зерно.</p><p class="p1">Бран поглядел вниз. Он теперь видел горы, белые снеговые вершины и серебряные нити рек в темных лесах. Он закрыл глаза и заплакал.</p><p class="p1">— А вот это не поможет, — сказал ворон. — Я же объяснил тебе: надо лететь, а не плакать. Ты считаешь, что это трудно? Но ведь я летаю. — Поднявшись в воздух, ворон облетел вокруг руки Брана.</p><p class="p1">— Но у тебя есть крылья, — возразил Бран.</p><p class="p1">— Возможно, они есть и у тебя.</p><p class="p1">Бран потянулся рукой к плечам, надеясь нащупать перья.</p><p class="p1">— Крылья бывают разными, — заметил ворон.</p><p class="p1">Бран поглядел на свои руки, на свои ноги. Он стал настолько худым, ну просто кожа, натянутая на кости. Неужели он всегда был таким? Он попытался вспомнить. Из серого тумана, осветившись, выплыло золотое лицо.</p><p class="p1">— Чего не сделаешь ради любви, — проговорили губы.</p><p class="p1">Бран вскрикнул. Ворон, каркнув, взмыл в воздух.</p><p class="p1">— Только не это! — закричал он. — Забудь об этом, тебе не нужно про это знать, забудь, забудь. — Птица приземлилась на плечо Брана, клюнула его, и золотое сияющее лицо исчезло.</p><p class="p1">Бран падал уже быстрее, чем прежде. Серые туманы выли вокруг, а он несся к земле.</p><p class="p1">— Что ты делаешь со мной? — со слезами в голосе спросил он у ворона.</p><p class="p1">— Учу тебя летать.</p><p class="p1">— Я не могу летать.</p><p class="p1">— Ты уже летишь.</p><p class="p1">— Я падаю.</p><p class="p1">— Каждый полет начинается с падения, — сказал ворон. — Погляди вниз.</p><p class="p1">— Я боюсь…</p><p class="p1">— Погляди вниз!!!</p><p class="p1">Бран поглядел вниз и ощутил, что внутренности его обратились в воду. Теперь земля неслась навстречу ему. Весь мир распростерся под ним, словно ковер, расшитый белой, бурой и зеленой нитями. Он видел все настолько отчетливо, что на мгновение забыл об испуге. Он видел всю страну и каждого в ней.</p><p class="p1">Он увидел Винтерфелл, каким видят замок орлы: высокие башни казались сверху приземистыми огрызками, а стены превратились в линии, прорисованные на земле. Бран увидел мейстера Лювина на балконе, изучающего небо через полированную бронзовую трубку; ученый, хмурясь, делал заметки. Увидел своего брата Робба, подросшего и окрепшего по сравнению с тем, каким он помнил его; брат занимался во дворе фехтованием с настоящей сталью в руке. Он увидел Ходора, простодушного гиганта из конюшни, тот нес наковальню кузнецу Миккену, взвалив ее на плечо, словно простое бревно. В сердце богорощи огромное чардрево размышляло над своим отражением в черной воде, листья его шелестели под холодным ветром. Ощутив, что Бран наблюдает за ним, оно подняло свои глаза от тихих вод и ответило ему понимающим взглядом.</p><p class="p1">Он поглядел на восток и увидел галею, несущуюся по волнам. И мать, одиноко сидевшую в каюте. Она рассматривала окровавленный нож, лежавший перед ней на столе; гребцы налегали на весла, а сир Родрик привалился к поручням, содрогаясь всем телом. Впереди них собрался шторм, ревущую тьму прорезали молнии, но корабельщики почему-то не видели бурю.</p><p class="p1">Он поглядел на юг и увидел огромный сине-зеленый поток Трезубца. Увидел, как отец, лицо которого искажало горе, о чем-то просит короля. Увидел, как плачет Санса и не может никак заснуть. Увидел, как затаилась молчаливая Арья, скрывая свои секреты. Их окружали тени. Одна черная, словно кленовый ствол с жуткой собачьей мордой. Другая была как солнце в золотой и прекрасной броне. Над всеми возвышался гигант в панцире, выкованном из камня, но когда он отвел забрало, под ним ничего не оказалось — лишь тьма и густая черная кровь.</p><p class="p1">Он поднял глаза и увидел мир за Узким морем: Вольные Города, зеленый океан дотракийских трав, а за ним Вейес Дотрак под горой, сказочные острова Яшмового моря и Асшай у Тени, прячущей до рассвета драконов.</p><p class="p1">Потом Бран поглядел на север. Стена сверкала, как синий кристалл, и его незаконнорожденный брат Джон спал возле нее в холодной постели; кожа его бледнела и становилась жесткой, утрачивая даже память о тепле. Он поглядел за Стену, за бесконечный лес, укутанный снегом, мимо замерзшего побережья, за огромные иссиня-белые ледяные реки и мертвые равнины, где ничего не могло расти или жить. Все дальше и дальше на север уходил его взгляд — к завесе света в конце мира, а потом и за эту завесу. Бран заглянул в самое сердце зимы, ужаснулся, испуганно вскрикнул, и щеки его обожгли слезы.</p><p class="p1">— Теперь ты знаешь, — проговорил ворон, опускаясь на его плечо. — Теперь ты знаешь, почему должен жить.</p><p class="p1">— Почему? — сказал Бран, ничего не понимая, но падая, падая, падая.</p><p class="p1">— Потому что зима близка.</p><p class="p1">Бран поглядел на ворона, сидящего на его плече, тот отвечал ему своим немигающим взглядом. У птицы оказалось три глаза, и третий наполняло жуткое знание. Бран поглядел вниз. Там не было ничего, только снег, холод и смерть, холодная пустошь грозила ему сине-белой зубастой ледяной пастью. Клыки ее поднимались как копья. Бран увидел на них кости тысяч других мечтателей, пронзенных остриями. И отчаянно испугался.</p><p class="p1">— Может ли мужчина стать отважным, если он боится? — услыхал он собственный голос, тихий и недалекий.</p><p class="p1">Ответил ему отец:</p><p class="p1">— Только преодолев страх, он и станет храбрым, он и станет мужчиной!</p><p class="p1">— Ну же, Бран, — напомнил ему ворон. — Выбирай. Лети или умирай.</p><p class="p1">Смерть с воплем протянула к нему руку.</p><p class="p1">Бран раскинул свои руки и полетел. Незримые крылья впивали ветер; наполнившись, они подняли его вверх. Жуткие иглы льда удалились вниз. Над головой открылось небо. Бран поднялся вверх. Это было великолепно. Мир под ним сделался маленьким.</p><p class="p1">— Я лечу! — выкрикнул он в восхищении.</p><p class="p1">— Я заметил, — сказал трехглазый ворон, взмывая. Замедляя полет, он замахал крыльями перед лицом Брана, ослепляя его. И застыл в воздухе, ударяя перьями по его щекам. Клюв жестоко впился в лоб Брана, и он ощутил внезапную боль между глазами.</p><p class="p1">— Что ты делаешь? — закричал он.</p><p class="p1">Ворон открыл клюв и каркнул с пронзительным страхом. Задрожав, отлетели окружавшие его туманы, и Бран увидел, что ворон сделался женщиной, служанкой с длинными черными волосами. И вспомнил, что когда-то знал ее в Винтерфелле… да, это было там. Тут только он понял, что лежит в родном замке, на высокой кровати в холодной комнате башни. Черноволосая женщина выронила кувшин, и по полу потекла вода. Служанка побежала вниз по ступеням с криком:</p><p class="p1">— Он очнулся, он очнулся, он очнулся!</p><p class="p1">Бран прикоснулся ко лбу между глазами. Место, куда клюнул его ворон, все еще горело, но там не было ничего — ни крови, ни раны. Почувствовав слабость и головокружение, он попытался выбраться из постели, но даже не двинулся.</p><p class="p1">Однако возле кровати кто-то шевельнулся, и прямо на него опустилось какое-то тело. Бран ничего не почувствовал. Пара желтых глаз, сияющих, словно солнце, заглянула в его глаза. Окно было открыто, в комнате было холодно, однако тепло, которое источал волк, охватило его жаркой волной. Это его щенок, понял Бран… Но щенок ли? Теперь он сделался таким большим… Бран протянул руку, чтобы погладить животное, но ладонь дрожала как лист.</p><p class="p1">Когда брат его Робб ворвался в комнату, запыхавшись после бега по ступеням башни, лютоволк уже лизал лицо Брана. Невозмутимо поглядев вверх, Бран объявил:</p><p class="p1">— Его зовут Лето.</p></span>
