<span id="id23"><div class="title2">
<p class="p">Арья</p>
</div><p class="p1">Отцу на совете опять пришлось туго. Арья поняла это по его лицу, когда лорд Эддард вышел к обеду, вновь опоздав, что теперь случалось нередко. Первое блюдо, густой и сладкий тыквенный суп, уже собрались уносить, когда Старк вошел в Малый зал. Называли его так, чтобы отличить от Великого зала, где король мог пировать с тысячью гостей, но и в этой длинной палате с высоким сводчатым потолком можно было усадить сотни две людей за устроенные на козлах столы.</p><p class="p1">— Милорд, — проговорил Джори, когда отец вошел. Он поднялся на ноги, остальные последовали его примеру. Все люди были в новых плащах из плотной серой шерсти, подбитой белым атласом. Выкованная из серебра рука перехватывала у ворота шерстяные складки плащей, знаменуя их принадлежность к домашней страже королевской десницы. Старк привел с собой лишь полсотни человек, и скамьи в основном пустовали.</p><p class="p1">— Садитесь, — сказал Эддард Старк. — Вижу, вы начали без меня, и рад тому, что в этом городе есть еще люди, сохранившие рассудок. — Он дал знак продолжить трапезу. Слуги начали вносить блюда с ребрами, зажаренными под чесноком и травами.</p><p class="p1">— Во дворе ходят слухи, что у нас будет турнир, милорд, — проговорил Джори, занимая свое место. — Утверждают, что со всех сторон королевства сойдутся люди, чтобы сражением и на пиру почтить ваше назначение десницей короля.</p><p class="p1">Арья видела, что отец не очень рад предстоящему событию.</p><p class="p1">— А не говорят ли во дворе, что мне самому этот турнир совершенно не нужен?</p><p class="p1">Глаза Сансы округлились, словно два блюдца.</p><p class="p1">— Будет турнир, — выдохнула она. Санса села между септой Мордейн и Джейни Пуль, подальше от Арьи, но не настолько, чтобы отец сделал ей замечание. — А нам разрешат посетить его, отец?</p><p class="p1">— Ты знаешь, как я отношусь к таким вещам, Санса. Похоже, мне придется устроить королю Роберту развлечение и изобразить, что оно делается ради меня. Но это не значит, что я должен разрешить своим дочерям смотреть на подобные глупости.</p><p class="p1">— Ну, пожалуйста, — попросила Санса. — Я бы хотела посмотреть.</p><p class="p1">Заговорила септа Мордейн:</p><p class="p1">— Принцесса Мирцелла будет там, милорд, а она младше леди Сансы. Все дамы двора будут присутствовать на таком великом событии. К тому же турнир дается в вашу честь, и будет странно, если ваша семья останется дома.</p><p class="p1">Отец отвечал с болью в голосе:</p><p class="p1">— Должно быть, так. Ну хорошо, я устрою место для тебя, Санса. — Он посмотрел на Арью. — Для вас обеих.</p><p class="p1">— Мне не нужен этот глупый турнир, — скривила лицо Арья. Она знала, что там будет Джоффри, — принца она ненавидела.</p><p class="p1">Санса подняла голову:</p><p class="p1">— Нас ждет великолепное зрелище, а на тебя там никто и не посмотрит.</p><p class="p1">На лице отца вспыхнул гнев.</p><p class="p1">— Довольно, Санса! Хватит, иначе я передумаю! Я смертельно устал от вашей бесконечной войны. Вы сестры и должны вести себя соответствующим образом, понятно?</p><p class="p1">Санса закусила губу и кивнула. Арья угрюмо уставилась в тарелку. Она ощутила, как слезы прихлынули к глазам. И с гневом прогнала их, решив не плакать.</p><p class="p1">Слышен был лишь стук ножей и вилок.</p><p class="p1">— Прошу извинить меня, — объявил отец всем присутствующим. — Сегодня мне что-то не хочется есть. — И он вышел из зала.</p><p class="p1">Когда дверь за ним закрылась, Санса обменялась взволнованным шепотом с Джейни Пуль. В дальней части стола Джори рассмеялся шутке, и Халлен завел речь о лошадях:</p><p class="p1">— Твой-то он боевой, вот он и не лучший для турнира. Не то он, ох, совсем не то.</p><p class="p1">Мужчины уже слышали все это; Десмонд, Джекс и сын Халлена Харвин потребовали, чтобы он замолчал, а Портер попросил вина.</p><p class="p1">С Арьей никто не разговаривал. Ее это не волновало. Если бы ей позволили, она предпочла бы есть в своей опочивальне. Иногда так и случалось, когда отец обедал с королем, или каким-нибудь лордом, или с послами, откуда-нибудь вдруг явившимися. В основном они ели в его солярии — отец, она и Санса. Тогда Арья больше всего тосковала о своих братьях. Ей хотелось бы поддразнить Брана, поиграть с маленьким Риконом и увидеть улыбку Робба. Ей хотелось, чтобы Джон взлохматил ее волосы, назвал сестричкой, хотелось услышать его голос, заканчивающий вместе с ней фразы. Но все они были далеко, и рядом никого, кроме Сансы, сестры, даже не желавшей разговаривать с ней, если этого не требовал отец.</p><p class="p1">У себя в Винтерфелле они ели в большом зале едва ли не через день. Отец говаривал, что тот лорд, который хочет удержать у себя людей, должен обедать вместе с ними.</p><p class="p1">— Надо знать людей, которые следуют за тобой. — Она слыхала, как он говорил эти слова Роббу. — И пусть они знают тебя. Нельзя требовать, чтобы люди отдавали свою жизнь ради незнакомца.</p><p class="p1">В Винтерфелле отец всегда держал лишний стул за своим столом, и каждый день компанию его разделял кто-то из людей. Один вечер это мог быть Вейон Пуль, и разговор шел о медяках, хлебных запасах и слугах; на следующий день его сменял, скажем, Миккен, и отец выслушивал его рассказ о броне и мечах, и о том, каким горячим должен быть металл, и как лучше закаливать сталь. На третий день за столом оказывался Халлен с бесконечными разговорами о лошадях, а потом септон Хейли из библиотеки, а потом Джори, а потом сир Родрик… или даже старая Нэн со своими россказнями.</p><p class="p1">Арья ничего не любила больше, чем сидеть за столом отца, слушать их разговоры. Ей нравились и рассказы людей, сидящих на скамьях: крепких как кожа свободных всадников, учтивых рыцарей, отважных молодых сквайров, седых старых воителей. Она любила швырять в них снежками и таскала им пироги с кухни. Жены их давали Арье ячменные лепешки, она придумывала имена для их младенцев и играла в «чудовище и деву», «спрячь сокровища» и «короля замка» с их старшими детьми. Толстый Том звал ее Арьей Что-Под-Ногами, потому что она всегда оказывалась именно там. Но это было приятнее, чем слышать «Арья-Лошадка».</p><p class="p1">Только все это осталось в Винтерфелле, в мире, вдруг ставшем далеким. Теперь все переменилось. Сегодня они ели со своими людьми впервые с того времени, как прибыли в Королевскую Гавань. Арья ненавидела этот город. И голоса их сделались ей ненавистны, и смех, и рассказы. Люди эти были ее друзьями, она чувствовала себя среди них в безопасности, но теперь вдруг поняла, как они лгут. Это они позволили королеве убить Леди, что само по себе было ужасно. А потом Пес нашел Мику. Джейни Пуль рассказала Арье, что его изрубили в куски и получил мясник сына в мешке; поначалу бедолага решил, что они убили свинью. И никто не возвысил голос, не извлек клинок. Все смолчали… и Харвин, который всегда вел такие смелые речи, и Элин, который намеревался стать рыцарем, и Джори, капитан стражи. И даже отец.</p><p class="p1">— Он был моим другом, — шептала Арья в тарелку негромко, так, чтобы ее не услышали. Нетронутые ребра уже подернулись тонкой пленкой застывшего сала. Арья поглядела на них и почувствовала себя больной. Она отодвинулась от стола.</p><p class="p1">— И куда же вы собираетесь направиться, молодая леди? — осведомилась септа Мордейн.</p><p class="p1">— Я не голодна. — Арья с трудом вспомнила подобающие случаю любезные фразы. — Пожалуйста, разрешите мне выйти из-за стола, — проговорила она напряженным голосом.</p><p class="p1">— Не разрешаю, — сказала септа. — Ты едва прикоснулась к пище. Сядь и очисти тарелку.</p><p class="p1">— Очисти ее сама! — Прежде чем ее успели остановить, Арья бросилась к двери. Люди захохотали, септа Мордейн что-то закричала вслед, голос ее поднимался все выше и выше. Толстый Том находился на своем посту, охраняя дверь в башню Десницы. Он заморгал, увидев бегущую Арью и услыхав крики септы.</p><p class="p1">— Постой, маленькая, задержись, — проговорил он, протянув руку, но Арья скользнула между его ног и бросилась по ступенькам башни. Ноги ее стучали по камню, Толстый Том пыхтел и топал позади нее.</p><p class="p1">Опочивальня была единственным местом, которое Арья любила во всей Королевской Гавани, но больше всего девочке нравилась дверь — массивная плита из темного дуба, обшитая полосами черного железа. Когда она захлопывала дверь и роняла на место тяжелую защелку, никто не мог пройти в ее комнату: ни септа Мордейн, ни Толстый Том, ни Санса, ни Джори. Никто-никто! Так она поступила и сейчас.</p><p class="p1">Когда засов оказался на месте, Арья почувствовала себя в безопасности и разревелась.</p><p class="p1">Она направилась к окну и уселась возле него, хлюпая носом, полная ненависти ко всем, но более всего к себе самой. Это она была виновата в том, что случилось, так утверждали Санса и Джейни.</p><p class="p1">Толстый Том постучал в дверь.</p><p class="p1">— Арья, девочка, что случилось? — позвал он. — Ты там?</p><p class="p1">— Нет! — крикнула она. Стук прекратился. Спустя мгновение она услышала, как он уходит. Толстого Тома всегда легко было одурачить. Арья направилась к сундуку у изножья ее постели. Она склонилась над ним, открыла крышку и обеими руками начала доставать одежду, хватая горстями шелк, атлас, бархат и шерсть и бросая их на пол. Меч лежал на самом дне сундука, там, где она спрятала его. Арья достала оружие почти ласково; она потянула тонкий клинок из ножен.</p><p class="p1">Игла.</p><p class="p1">Она вновь подумала о Мике, и глаза ее наполнились слезами. Виновата, виновата, виновата. Ведь это она попросила его пофехтовать с ней… В дверь застучали громче, чем прежде.</p><p class="p1">— Арья Старк, немедленно открой дверь, слышишь меня?</p><p class="p1">Арья повернулась с Иглой в руке.</p><p class="p1">— А тебе лучше бы вообще не входить сюда! — И она отчаянно рубанула по воздуху.</p><p class="p1">— Десница узнает об этих словах, — рассвирепела септа Мордейн.</p><p class="p1">— Мне все равно! — закричала Арья. — Убирайся.</p><p class="p1">— Вы пожалеете о своем наглом поведении, молодая леди, обещаю вам это.</p><p class="p1">Арья подождала у двери и наконец услышала удаляющиеся шаги септы. С Иглой в руке она подошла к окну и поглядела на двор внизу. Если бы только она умела лазать, как Бран, тогда можно было бы выбраться из окна и спуститься по стене башни, чтобы убежать из этого жуткого места, подальше от Сансы, септы Мордейн, от принца Джоффри, ото всех. Выкрала бы еду на кухне, взяла бы Иглу, надела свои добрые сапоги и теплый плащ. Нимерия нашлась бы в диких лесах возле Трезубца, а потом они вместе вернулись бы в Винтерфелл, чтобы бежать к Джону на Стену. Арья поняла, как жалеет о том, что сводного брата сейчас нет рядом с ней. Тогда ей не было бы столь одиноко.</p><p class="p1">Негромкий стук в дверь отвлек Арью от окна и от мечтаний о бегстве.</p><p class="p1">— Арья, — послышался голос отца. — Открой дверь. Мне надо поговорить с тобой.</p><p class="p1">Арья пересекла комнату и подняла засов. Отец пришел один. Лицо его показалось ей скорее печальным, чем гневным. Это еще более устыдило Арью.</p><p class="p1">— Можно войти?</p><p class="p1">Арья кивнула и со стыдом опустила глаза. Отец закрыл дверь.</p><p class="p1">— Чей это меч?</p><p class="p1">— Мой. — Арья почти забыла, что Игла осталась в ее руках.</p><p class="p1">— Дай-ка.</p><p class="p1">Арья не без колебаний отдала оружие, не зная, получит ли его обратно. Отец повернул меч к свету, осмотрел обе стороны клинка. Попробовал острие пальцем.</p><p class="p1">— Клинок разбойника, — сказал он. — Однако мне кажется, что я знаю метку этого мастера. Работа Миккена.</p><p class="p1">Арья не могла солгать ему и просто потупила глаза. Лорд Эддард Старк вздохнул.</p><p class="p1">— Моя девятилетняя дочь вооружается в моей собственной кузнице, и я ничего не знаю об этом. Десница короля обязан править Семью Королевствами, а я, похоже, даже не способен справиться со своим собственным домом. Откуда у тебя этот меч, Арья? Как ты его получила?</p><p class="p1">Арья прикусила губу и промолчала. Она не могла предать Джона даже в разговоре с отцом.</p><p class="p1">Спустя мгновение отец проговорил:</p><p class="p1">— Впрочем, это ничего не значит. — И серьезно поглядел на меч в своих руках. — Оружие не игрушка для детей, во всяком случае, для девиц. Что сказала бы септа Мордейн, узнав, что ты играешь с мечом.</p><p class="p1">— Я не играю, — настаивала Арья. — Я ненавижу септу Мордейн.</p><p class="p1">— Довольно, — отвечал отец голосом резким и жестким. — Септа просто выполняет свои обязанности, и только боги знают, какими тяжкими ты сделала их для бедной женщины. Мы с твоей матерью обременили ее невозможным заданием, захотев превратить тебя в леди.</p><p class="p1">— А я и не хочу быть леди, — вспыхнула Арья.</p><p class="p1">— Мне следовало бы прямо сейчас сломать эту игрушку о колено, чтобы положить конец всей чепухе.</p><p class="p1">— Игла не сломается, — возмутилась Арья, но голос ее противоречил словам.</p><p class="p1">— Значит, у него есть имя? — Отец вздохнул. — Ах, Арья, Арья. Ты дикарка, моя девочка. Волчья кровь, как говорил мой отец. Она чувствовалась и в Лианне, и в брате моем — в еще большей степени. И обоих она привела к ранней могиле.</p><p class="p1">Арья услыхала скорбь в его голосе, отец нечасто упоминал о своем отце, брате и сестре, погибших еще до ее рождения.</p><p class="p1">— Лианна вполне способна была взять меч, если бы это разрешил ей мой лорд-отец. Иногда ты напоминаешь ее… даже внешне.</p><p class="p1">— Но Лианна ведь была прекрасна… — удивилась Арья. — Так говорили все! — О себе она ничего подобного не слыхала.</p><p class="p1">— Была, — согласился Эддард Старк, — прекрасна, своенравна и умерла прежде своего времени. — Он поднял меч, как бы пробуя его. — Арья, что ты намереваешься делать с этой… Иглой? Кого ты хочешь прошить ею? Свою сестру? Септу Мордейн? Представляешь ли ты, что нужно делать, берясь за меч?</p><p class="p1">Она могла вспомнить лишь тот короткий урок, который дал ей Джон.</p><p class="p1">— Держать его кончиком вперед, — выпалила она.</p><p class="p1">Отец коротко хохотнул.</p><p class="p1">— Ну что ж, наверное, в этом вся суть…</p><p class="p1">Арья отчаянно хотела объясниться, заставить отца понять ее.</p><p class="p1">— Я пыталась учиться, но… — Глаза ее наполнили слезы. — Я попросила Мику поучить меня. — Горе вернулось сразу. Задрожав, она отвернулась. — Это я просила его. Это моя вина. Это я…</p><p class="p1">Руки отца вдруг сомкнулись вокруг нее. Она повернулась, уткнувшись ему с рыданиями в грудь.</p><p class="p1">— Не надо, милая моя, — пробормотал он, — горюй о своем друге, но не вини себя. Не ты убила сына мясника. Кровь его легла на Пса и на жестокую женщину, которой он служит.</p><p class="p1">— Я ненавижу их, — выдавила сквозь рыдания раскрасневшаяся Арья. — И Пса, и королеву, и короля, и принца Джоффри. Я ненавижу их всех. Джоффри солгал: все было не так, как он говорил. Я ненавижу и Сансу; она солгала, чтобы понравиться принцу.</p><p class="p1">— Все мы лжем, — проговорил отец. — И ты действительно думаешь, что я поверю в россказни, что Нимерия убежала?</p><p class="p1">Виноватая Арья раскраснелась.</p><p class="p1">— Джори обещал мне молчать.</p><p class="p1">— Джори сдержал свое слово, — ответил отец улыбнувшись. — Есть вещи, о которых мне не надо рассказывать. Даже слепец видит, что волчица никогда не оставила бы тебя по своей воле.</p><p class="p1">— Нам пришлось бросать камни, — сказала Арья несчастным голосом. — Я велела ей бежать, бежать на свободу; сказала, что больше не хочу ее. Что здесь есть волки, с которыми она сможет играть, — мы слышали их вой. А Джори сказал ей, что леса полны добычи и она добудет себе оленя. Но Нимерия увязалась следом, нам пришлось бросать камни. Я дважды попала. Она визжала и глядела на меня так, что мне сделалось стыдно. Но я ведь поступила правильно, так? Королева бы убила ее.</p><p class="p1">— Ты поступила правильно, — проговорил отец. — И эта ложь не была… бесчестной. — Отложив Иглу в сторону, он подошел к Арье и снова обнял ее. А потом вновь взял клинок, приблизился к окну, задержался там на мгновение, разглядывая двор, и обратил к ней задумчивые глаза. Затем опустился на сиденье возле окна с мечом на коленях. — Арья, садись. Я попытаюсь растолковать тебе кое-что.</p><p class="p1">Она тревожно присела на краешек постели.</p><p class="p1">— Ты еще слишком мала, чтобы возложить на тебя все мои заботы, — сказал он. — Но ты из Старков Винтерфеллских, ты знаешь наш девиз.</p><p class="p1">— Зима близко, — прошептала Арья.</p><p class="p1">— Пришли жестокие, злые времена, — сказал отец. — Мы изведали их и у Трезубца, дитя, и когда упал Бран. Ты родилась долгим летом, моя милая, ты не знала ничего другого, но теперь воистину зима близко. Вспомни герб нашего дома, Арья.</p><p class="p1">— Лютоволк, — сказала она и, вспомнив Нимерию, поджала колени к груди с внезапным испугом.</p><p class="p1">— Позволь мне рассказать тебе кое-что о волках, дитя. Когда выпадет снег и задуют белые ветры, одинокий волк гибнет, но стая живет. Лето — пора раздоров, но зимой мы обязаны защищать друг друга, охранять, делиться силой. Поэтому, если ты кого-то ненавидишь, постарайся обратить свою ненависть на тех, кто вредит нам. Септа Мордейн — добрая женщина, а Санса… Санса — твоя сестра. Вы не похожи, словно луна и солнце, но в ваших сердцах течет одна кровь. Ты нуждаешься в ней, а она в тебе… А я нуждаюсь в вас обеих, помогите мне боги.</p><p class="p1">В голосе его прозвучала такая усталость, что Арья проговорила:</p><p class="p1">— Я не испытываю ненависти к Сансе… настоящей. — Это была лишь половина лжи…</p><p class="p1">— Я не хочу пугать тебя, но и лгать тоже не следует. Мы оказались в мрачном и опасном месте, дитя мое. Это не Винтерфелл. У нас есть враги, которые готовы причинить нам зло. Мы не можем затевать войну между собой. Твое своенравие, побег, сердитые речи, неповиновение — все это уместно дома. Летние игры ребенка. Здесь — в преддверии зимы — они смотрятся по-другому. Пора взрослеть.</p><p class="p1">— Я вырасту, — пообещала Арья. Она никогда не любила отца так сильно, как в это мгновение. — Я умею быть сильной, я могу быть сильной, как Робб.</p><p class="p1">Он протянул ей Иглу рукояткой вперед.</p><p class="p1">— Бери.</p><p class="p1">Арья поглядела на меч с удивлением в глазах. Какое-то мгновение она даже боялась взять его, ей казалось, что, если она потянется к мечу, он исчезнет. Но отец сказал:</p><p class="p1">— Бери, он твой. — И она приняла оружие в руки.</p><p class="p1">— Я могу оставить его себе? — спросила Арья. — В самом деле?</p><p class="p1">— В самом деле. — Отец улыбнулся. — Если я заберу его, то через две недели найду под твоей подушкой метательную звезду. Попытайся не проткнуть им свою сестру, как бы тебе ни хотелось это сделать.</p><p class="p1">— Не проткну. Обещаю тебе. — Арья прижала Иглу к груди, и отец попрощался с ней.</p><p class="p1">На следующее утро, когда они позавтракали, она извинилась перед септой Мордейн и попросила прощения. Септа посмотрела на нее подозрительно, но отец кивнул.</p><p class="p1">Через три дня, в полдень, управляющий отца Вейон Пуль отправил Арью в Малый зал. Столы были разобраны, и вдоль всех стен стояли скамьи. Палата казалась пустой. Незнакомый голос сказал:</p><p class="p1">— Ты опоздал, мальчик. — Худощавый человек с лысеющей головой и огромным, похожим на клюв носом выступил из тени, держа в руках пару тонких деревянных мечей. — Завтра будешь здесь в полдень. — Акцент, интонации говорили о Вольных Городах, быть может, о Браавосе или Мире.</p><p class="p1">— Кто вы? — спросила Арья.</p><p class="p1">— Твой учитель танцев. — Он бросил ей один из деревянных клинков. Арья потянулась к нему, промахнулась, и меч упал на пол.</p><p class="p1">— Завтра ты поймаешь его. А теперь подбери.</p><p class="p1">Это была не палка, а настоящий деревянный меч с рукояткой, гардой и клинком.</p><p class="p1">Арья подобрала меч и, нервно вцепившись обеими руками, выставила его перед собой. Меч показался ей много тяжелее Иглы. Лысый пристукнул зубами.</p><p class="p1">— Так не пойдет, мальчик. Это не длинный меч, который нужно держать двумя руками. Возьми одной рукой.</p><p class="p1">— Он слишком тяжелый, — сказала Арья.</p><p class="p1">— Он достаточно тяжел, чтобы тело твое окрепло. К тому же он хорошо отцентрован. Полый внутри, он залит свинцом. Попробуй взять его одной рукой.</p><p class="p1">Арья сняла правую с рукояти и вытерла вспотевшую ладошку о штаны. Она держала меч в левой руке. Казалось, он одобрял.</p><p class="p1">— В левой держать хорошо. Все наоборот. Твоим врагам будет неловко. Но ты стоишь неправильно. Поверни тело боком, да, вот так. А знаешь, если посмотреть на тебя сбоку, ты кажешься просто копьем. Это тоже хорошо, попасть труднее. А теперь хватка. Позволь я посмотрю. — Он подошел ближе и уставился на ее руку, потом раздвинул пальцы, перекладывая их. — Вот так. Хватка должна быть ловкой и легкой.</p><p class="p1">— А если я выроню его? — спросила Арья.</p><p class="p1">— Сталь должна сделаться частью твоей руки, — сказал ей лысый. — Неужели ты можешь уронить часть руки? Нет, Сирио Форель девять лет был первым мечом морского владыки Браавоса, и он знает такие вещи. Слушай его, мальчик.</p><p class="p1">Мальчиком он назвал ее уже в третий раз.</p><p class="p1">— Я девочка, — возразила Арья.</p><p class="p1">— Мальчик или девочка — не важно, — отвечал Сирио Форель. — Ты фехтовальщик — и это главное. — Он пристукнул зубами. — Вот так и держи. В твоих руках не боевой топор, ты держишь…</p><p class="p1">— …Иглу, — докончила за него Арья свирепым голосом.</p><p class="p1">— Именно так. А теперь мы начнем танец. Помни, дитя, мы учимся не железной пляске Вестероса, пляске рыцаря, рубящего и молотящего. Нет. Это будет танец Браавоса, танец воды, быстрый и внезапный. Все люди созданы из воды, ты это знаешь? Так что, когда ты пронзаешь их, вода вытекает и они умирают. — Он шагнул назад, занося свой собственный деревянный клинок. — А теперь постарайся ударить меня.</p><p class="p1">Арья попыталась нанести ему удар. И пыталась сделать это четыре часа, пока каждая мышца в ее теле не заболела. А Сирио Форель пристукивал зубами и говорил ей, что делать.</p><p class="p1">На следующий день началась уже настоящая работа.</p></span>
