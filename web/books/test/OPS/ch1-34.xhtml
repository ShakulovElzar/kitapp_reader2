<p class="p">Тирион</p>
</div><p class="p1">Стоя на предутреннем холодке перед Чиггеном, свежевавшим его коня, Тирион Ланнистер записал на счет Старков еще один долг. Из внутренностей коня повалил пар, когда приземистый наемник вспорол живот лошади своим охотничьим ножом. Руки его двигались уверенно, не совершая лишних движений; работу следовало сделать быстро, прежде чем запах крови заставит сумеречных котов спуститься с высот.</p><p class="p1">— Сегодня никто из нас не останется голодным, — проговорил Бронн. Он уже напоминал тень: тонкие и жестокие брови, черные глаза, черные волосы и щетинистая борода.</p><p class="p1">— Не говори обо всех, — сказал Тирион. — Я не люблю конину. А в особенности не люблю есть собственных лошадей.</p><p class="p1">— Мясо есть мясо. — Бронн пожал плечами. — Дотракийцы любят конину больше, чем говядину или свинину.</p><p class="p1">— Разве я похож на дотракийца? — кислым голосом спросил Тирион. Дотракийцы и в самом деле ели коней; еще они бросали больных детей свирепым псам, тянувшимся позади кхаласара. Дотракийские обычаи мало привлекали его.</p><p class="p1">Чигген отрезал тонкую полосу окровавленного мяса от туши и поднял перед ним.</p><p class="p1">— Хочешь попробовать, карлик?</p><p class="p1">— Мой брат Джейме подарил мне эту кобылу на двадцать третий день рождения, — проговорил Тирион ровным голосом.</p><p class="p1">— Тогда передай ему благодарность и от нас… если увидишь когда-нибудь. — Чигген ухмыльнулся и, показав желтые зубы, проглотил сырое мясо в два глотка. — Хорошая лошадка.</p><p class="p1">— Все равно лучше поджарить с луком, — вставил Бронн.</p><p class="p1">Не говоря более ни слова, Тирион похромал прочь. Холод глубоко угнездился в его костях, ноги болели так, что он едва мог ходить. Быть может, повезло как раз мертвой кобыле. Его же ожидали долгие часы езды, потом несколько глотков пищи и короткий холодный сон на голой земле. Завтра будет то же самое, и послезавтра, и потом… только боги знают, когда это закончится.</p><p class="p1">— Проклятие, — пробормотал Тирион, с трудом продвигаясь по дороге, чтобы присоединиться к своим похитителям, и прибавил про себя: «Черт бы побрал и ее, и всех Старков!»</p><p class="p1">Воспоминание обжигало горечью. Только что он заказывал ужин, и в мгновение ока оказался перед полным залом вооруженных людей. Джик потянулся за мечом, а жирная хозяйка гостиницы завопила:</p><p class="p1">— Только без мечей, только не здесь, прошу вас, милорды!</p><p class="p1">Тирион поспешно опустил руку Джика, прежде чем соперники получили повод изрубить их в куски.</p><p class="p1">— Ты забыл про учтивость, Джик? Наша добрая хозяйка просит обойтись без мечей. Сделаем, как она хочет…</p><p class="p1">Он изобразил улыбку, понимая, что она окажется неуклюжей.</p><p class="p1">— Вы совершаете прискорбную ошибку, леди Старк. Я не участвовал ни в каких нападениях на вашего сына. Честью своей…</p><p class="p1">— Честью Ланнистера, — только и сказала она, поднимая вверх руки. — Шрамы эти оставил кинжал убийцы, которого ты послал, чтобы перерезать горло моему сыну.</p><p class="p1">Тирион ощутил вокруг себя гнев, густой и дымный, порезы на руках этой женщины прибавили ему силы.</p><p class="p1">— Убей-ка его, — прошипел из угла какой-то грязный оборванец. Новые голоса присоединились к этому предложению много скорее, чем он ожидал. Еще недавно дружелюбные незнакомцы, теперь они требовали его крови, словно несытые псы.</p><p class="p1">Тирион громко проговорил, пытаясь изгнать дрожь из голоса:</p><p class="p1">— Если леди Старк считает, что я должен ответить за какое-то преступление, я поеду с ней и отвечу за него.</p><p class="p1">Иначе поступить было нельзя, попробовать пробиться к выходу силой означало найти себе раннюю могилу. На помощь жене Старка пришла добрая дюжина мечей: человек из Харренхолла, трое Бракенов, пара неприглядного вида наемников, для которых, на взгляд, убить все равно что плюнуть. К ним присоединилось еще несколько дурней-работников, просто не понимавших, что происходит. Чем же мог располагать против них Тирион? Кинжалом у пояса и двоими людьми. Джик великолепно справлялся с мечом, но на Моррека едва ли можно было рассчитывать: отчасти конюх, отчасти повар, отчасти слуга, он не был ни в коей мере воином. Что же касается Йорена, что бы там он ни чувствовал про себя, Черные Братья присягали не принимать участие в раздорах внутри государства. Йорен помогать не станет.</p><p class="p1">И в самом деле, черный брат молчаливо отступил в сторону, когда старый рыцарь, стоявший возле Кейтилин Старк, проговорил:</p><p class="p1">— Возьмите у них оружие, — и наемник Бронн шагнул вперед, чтобы выхватить меч из пальцев Джика и избавить всех троих от кинжалов. — Хорошо, — сказал старик, когда напряженность в гостиной заметно пошла на убыль. — Даже великолепно.</p><p class="p1">Тирион узнал этот ворчливый голос: мастер над оружием из Винтерфелла, обривший себе бакенбарды.</p><p class="p1">Брызгая алой слюной, жирная хозяйка принялась молить Кейтилин Старк:</p><p class="p1">— Только не убивайте его здесь!</p><p class="p1">— Его вообще не надо убивать, — грустно пошутил Тирион.</p><p class="p1">— Отведите его куда-нибудь, но у меня никакой крови, миледи. Я не хочу участвовать в ссорах знатных господ.</p><p class="p1">— Мы вернемся с ним назад в Винтерфелл, — сказала она.</p><p class="p1">Тирион подумал: тогда, быть может… К этому мгновению он уже успел оглядеть комнату и уточнил ситуацию. Увиденное не полностью удовлетворило его. Да, жена Старка действовала с умом, в этом нечего сомневаться. Заставить их сперва публично подтвердить присягу, которую они принесли ее отцу-лорду, а потом попросить оказать помощь слабой женщине… Да, это было мило! Но все же ее успех оказался не столь полон, как она могла бы предположить. В комнате, по грубому счету, было около пятидесяти человек. На просьбу Кейтилин Старк откликнулась едва ли не дюжина; остальные казались смятенными, испуганными или мрачными. Лишь двое из Фреев поднялись, как отметил Тирион. Но и они сразу опустились на свои места, когда капитан остался на месте. Он бы улыбнулся, если бы осмелился.</p><p class="p1">— Мой отец будет гадать, что случилось со мной. — Тирион поглядел на меченосца, предложившего ему свою комнату. — Он заплатит хорошие деньги человеку, который известит его обо всем, что произошло сегодня в этом зале.</p><p class="p1">Лорд Тайвин, конечно, не станет развязывать мошну, но Тирион сам исправит положение, когда добьется свободы.</p><p class="p1">Сир Родрик посмотрел на госпожу вполне понятным в таком положении встревоженным взглядом.</p><p class="p1">— Его люди поедут с нами, — объявил старый рыцарь. — А остальных мы отблагодарим, если они сохранят молчание о том, что видели здесь.</p><p class="p1">Тирион сделал все, чтобы не расхохотаться. Молчание? Старый дурак! Если только не увезти с собой всех собравшихся, весть разлетится во все стороны сразу же после их отъезда. Свободный всадник с золотой монетой в кармане как стрела полетит на Бобровый утес. Если не он, тогда эту весть донесет кто-то другой. Йорен увезет эту весть на юг. Дурак-певец сделает из этого песню. Фреи доложат своему лорду, и только боги знают, что он тогда предпримет. Да, лорд Уолдер Фрей присягнул Риверрану, но этот осторожный человек прожил долгую жизнь, стараясь всякий раз принять сторону победителя. В худшем случае он всего лишь отошлет своих птиц на юг, в Королевскую Гавань, но вполне может осмелиться и на большее.</p><p class="p1">Кейтилин Старк времени не теряла:</p><p class="p1">— Мы выезжаем немедленно. Нам нужны свежие кони и припасы на дорогу. Все вы можете рассчитывать на вечную благодарность дома Старков. Тем из вас, кто захочет помочь нам охранять пленников, чтобы доставить их живыми в Винтерфелл, я обещаю хорошую награду.</p><p class="p1">Больше ничего не потребовалось: дураки рванулись вперед. Тирион поглядел на их лица: они, конечно, получат отличную награду, сказал он себе, но не ту, на которую рассчитывают. И все же, когда пленников выводили наружу, седлали коней под дождем, связывали руки длинной и грубой веревкой, Тирион Ланнистер не испытывал истинного испуга. В Винтерфелле ему не бывать, он мог в этом поклясться. Через день за ним вышлют погоню, птицы поднимутся в воздух, и кто-нибудь из речных лордов захочет заслужить благосклонность его отца и вмешается в дело. Тирион как раз поздравлял себя с тонкостью своих замыслов, когда кто-то надвинул капюшон на его глаза и поднял в седло.</p><p class="p1">Они выехали под дождем и сразу взяли в галоп, и уже вскоре бедра Тириона заныли, а задницу просто дергало от боли. Даже когда они оказались на безопасном расстоянии от гостиницы и Кейтилин Старк замедлила ход до рыси, отягощенное вынужденной слепотой положение его не изменилось. Лошадь везла его по неровной земле, каждый поворот был чреват падением. Капюшон глушил звуки, и Тирион не слышал, что говорят вокруг него; дождь успел пропитать ткань, липнувшую к его лицу, даже дышать было тяжело. Веревка ранила запястья и словно бы затягивалась все туже по мере приближения ночи. «А я намеревался устроиться возле теплого очага с жареной дичью! Зачем только этот проклятый свистун открыл свой поганый рот», — подумал с горечью Тирион. Проклятый певец отправился с ними.</p><p class="p1">— О случившемся могут сочинить великую песню, и это сделаю я, — сказал он Кейтилин Старк, объявляя о своем намерении ехать вместе с ними, чтобы увидеть, чем закончится «великолепное приключение». Тирион весьма сомневался в том, что мальчишка будет считать путешествие великолепным, когда всадники Ланнистеров догонят их.</p><p class="p1">Дождь наконец прекратился, и рассветные лучи сочились сквозь мокрую ткань, закрывавшую его глаза, когда Кейтилин Старк подала команду спешиваться. Грубые руки стянули Тириона с коня, развязали его кисти и стащили капюшон с головы. Увидев узкую каменную дорогу, дикие предгорья и зубчатые снеговые пики на далеком горизонте, он ощутил, что вся надежда разом оставила его.</p><p class="p1">— Это горная дорога, — выдохнул Тирион, глядя на леди Старк обвиняющими глазами. — Восточная дорога, а вы говорили, что мы едем в Винтерфелл!</p><p class="p1">Кейтилин Старк удостоила его легчайшей из улыбок.</p><p class="p1">— Говорила — часто и громко, — согласилась она. — И не сомневаюсь, что ваши друзья направятся на север. От души желаю им поторопиться.</p><p class="p1">Даже теперь, несколько дней спустя, воспоминание наполнило его горькой яростью. Всю свою жизнь Тирион гордился своей хитростью, единственным даром, которым наделили его боги, и все же семижды проклятая волчица Кейтилин Старк перехитрила его на всех поворотах. Факт этот более удручал его, чем само похищение.</p><p class="p1">Они остановились только для того, чтобы поесть и самим покормить коней, а потом вновь тронулись с места. На этот раз Тириона избавили от капюшона. После второй ночи руки его более не связывали, а когда они поднялись выше, то перестали и охранять. Никто, похоже, не опасался, что он убежит. Да и с чего бы вдруг? Здесь, наверху, земля была суровой и дикой, а высокогорная дорога, в сущности, представляла собой всего лишь каменистую тропку. Пусть он и убежит, но как далеко можно добраться в одиночестве и без провизии? Сумеречные коты легко загрызут его, а кланы, гнездящиеся в горных твердынях, разбойники и убийцы склоняются не перед законом, а только перед мечом.</p><p class="p1">И жена Старка безжалостно гнала их вперед. Тирион знал, куда они направляются… знал с того самого мгновения, когда с глаз его сняли капюшон. В этих горах правил дом Арренов. Вдова покойного десницы, урожденная Талли, сестра Кейтилин Старк, не дружила с Ланнистерами. Тирион успел немного познакомиться с леди Лизой за время, проведенное ею в Королевской Гавани, и не стремился возобновить знакомство.</p><p class="p1">Похитители теснились вокруг ручья, невдалеке от горной дороги. Лошади уже напились ледяной воды и теперь общипывали кочки бурой травы, пробивавшейся между камнями. Джик и Моррек держались рядом, угрюмые и несчастные. Над ними, опершись на копье, стоял Мохор, округлая железная шапка на его голове казалась похожей на котелок. Поблизости Мариллон-певец натирал маслом свою деревянную арфу и сетовал на ущерб, который сырость причиняет ее струнам.</p><p class="p1">— Нам надо передохнуть, миледи, — говорил засечный рыцарь сир Уиллис Воде, обращаясь к Кейтилин Старк. Он служил леди Уэнт, человек прямой и крепкий, он первым поднялся в гостинице, чтобы помочь Кейтилин.</p><p class="p1">— Сир Уиллис говорит правду, миледи, — вступил в разговор сир Родрик. — Мы потеряли уже третьего коня…</p><p class="p1">— Если нас догонят Ланнистеры, мы потеряем не только коней, — напомнила им Кейтилин. Обветренное лицо ее исхудало, но не утеряло решимости.</p><p class="p1">— На это шансы невелики, — заметил Тирион.</p><p class="p1">— Леди не спрашивает твоего мнения, карлик, — отрезал Курлекет, рослый и жирный олух с короткими стрижеными волосами и поросячьим лицом. Он был из Бракенов и служил оружием лорду Джонасу. Тирион постарался запомнить все имена, чтобы отблагодарить потом каждого по отдельности за любезное обращение. Ланнистеры всегда расплачивались по своим долгам. Курлекет еще узнает об этом, как и его друзья, Лхарис и Мохор, и добрый сир Уиллис, и наемники Бронн и Чигген. Особенно жестокий урок намечался для Мариллона, обладателя сладкого тенора, старательно рифмовавшего «бес — он», «Тирион» и «в позументы облачен» в своей песне об этом бесчинстве.</p><p class="p1">— Пусть говорит, — приказала леди Старк.</p><p class="p1">Тирион Ланнистер уселся на скалу.</p><p class="p1">— Сейчас преследователи, если погоню выслали, что далеко не обязательно, скорее всего мчатся по Перешейку, рассчитывая, что вы заляжете где-нибудь на Королевском тракте. Безусловно, весть о моем похищении достигла ушей моего отца. Но лорд Тайвин не слишком любит меня, и я совсем не уверен, что он решит побеспокоить себя.</p><p class="p1">Слова эти были ложью только отчасти, лорд Тайвин Ланнистер ценил своего уродливого сына не более чем зеленую фигу, однако он не терпел никаких оскорблений чести дома.</p><p class="p1">— Здесь жестокий край, леди Старк, и вы не найдете помощи, пока не достигнете Долины. Каждый потерянный конь еще более отяготит остальных. Хуже того: вы рискуете потерять меня. Я невелик ростом и не силен, и если я умру, зачем все это? — В этом не было лжи, Тирион не знал, сколько еще сумеет выдержать подобную скорость.</p><p class="p1">— Возможно, в вашей смерти и есть смысл, Ланнистер, — ответила Кейтилин Старк.</p><p class="p1">— А я думаю, нет, — заметил Тирион. — Если бы вы хотели меня убить, нужно было только приказать, и один из ваших надежных друзей охотно наградил бы меня кровавой улыбкой. — Он поглядел на Курлекета, однако тупость мешала тому оценить насмешку.</p><p class="p1">— Старки не убивают людей в постели.</p><p class="p1">— И я тоже, — сказал он. — Еще раз говорю вам, я не принимал участия в покушении на жизнь вашего сына.</p><p class="p1">— Убийца был вооружен вашим кинжалом.</p><p class="p1">Тирион почувствовал прилив внутреннего жара.</p><p class="p1">— Это не мой кинжал, — с нажимом проговорил он. — Сколько же раз я должен клясться в этом? Леди Старк, что бы там ни говорили обо мне, я далеко не глуп, а лишь глупец снабдит наемного убийцу своим собственным клинком.</p><p class="p1">На мгновение ему показалось, что в глазах ее промелькнуло сомнение, но она возразила:</p><p class="p1">— Зачем было Петиру лгать мне?</p><p class="p1">— А зачем медведь гадит в лесу? — вопросил он. — Потому что такова его природа. Для людей, подобных Мизинцу, лгать все равно что дышать. Уж вам-то по крайней мере следовало знать это.</p><p class="p1">Кейтилин шагнула к нему с напряженным лицом.</p><p class="p1">— Как вас понимать, Ланнистер?</p><p class="p1">Тирион склонил голову набок.</p><p class="p1">— Ну что ж, наверное, все при дворе слышали, как он лишал вас невинности.</p><p class="p1">— Это ложь! — воскликнула Кейтилин Старк.</p><p class="p1">— Что за злой бес, — проговорил шокированный Мариллон.</p><p class="p1">Курлекет извлек кинжал, зловещую штуковину из черного железа.</p><p class="p1">— Одно только слово, миледи, и я брошу его лживый язык к вашим ногам. — Поросячьи глазки подернулись влагой от такой перспективы.</p><p class="p1">Кейтилин Старк поглядела на Тириона с таким холодом, какого он еще не видел на ее лице.</p><p class="p1">— Петир Бейлиш некогда любил меня, но он тогда был мальчишкой. Страсть его явилась трагедией для всех нас. Но она была неподдельной и чистой, так что незачем насмехаться над ней. Петир просил моей руки, и это его полностью оправдывает. А вы действительно злой человек, Ланнистер!</p><p class="p1">— Ну а вы действительно дура, леди Старк. Мизинец никогда не любил никого, кроме Мизинца, и клянусь вам, что он хвастал не вашей рукой, но спелыми грудями, страстным ртом, жаром между ваших ног.</p><p class="p1">Курлекет схватил его за волосы и резким движением откинул назад голову, открывая горло. Тирион ощутил шеей холодный поцелуй стали.</p><p class="p1">— Пустить ему кровь, миледи?</p><p class="p1">— Убейте меня, и правда умрет вместе со мной, — выдохнул Тирион.</p><p class="p1">— Пусть говорит, — приказала Кейтилин Старк.</p><p class="p1">Курлекет неуверенно выпустил волосы Тириона.</p><p class="p1">Ланнистер глубоко вздохнул.</p><p class="p1">— А как, по словам Мизинца, попал ко мне этот кинжал? Скажите мне!</p><p class="p1">— Вы проиграли его на пари во время турнира в честь именин принца Джоффри.</p><p class="p1">— Когда рыцарь Цветов сбросил с коня моего брата Джейме, так он сказал, да?</p><p class="p1">— Да, — признала Кейтилин, морщина легла на ее лоб.</p><p class="p1">— Всадники!</p><p class="p1">С источенного ветром карниза над ними донесся крик. Сир Родрик отослал Лхариса наверх следить за дорогой, пока они отдыхают.</p><p class="p1">Мгновение затянулось, никто не шевелился. Кейтилин Старк отреагировала первой.</p><p class="p1">— Сир Родрик, сир Уиллис, по коням! — крикнула она. — Остальные конные позади. Мохор, охраняй пленников…</p><p class="p1">— Дайте нам оружие! — Тирион вскочил на ноги и схватил ее за руку. — Вам потребуется каждый меч.</p><p class="p1">Она понимала, что он прав, Тирион видел это. Кланы горцев не интересовались причинами вражды великих домов. Они с равной готовностью прирежут и Старка, и Ланнистера — точно так, как убивают друг друга. Разве что пощадят Кейтилин: она еще достаточно молода, чтобы рожать сыновей. И все же она медлила.</p><p class="p1">— Я слышу их! — выкрикнул сир Родрик. Прислушиваясь, Тирион повернул голову на топот копыт дюжины лошадей, приближающийся все ближе. И вдруг все разом задвигались, потянулись к оружию, бросились к лошадям. Сверху посыпались камешки; Лхарис, скользя и оступаясь, спустился с гребня. Он приземлился прямо перед Кейтилин Старк, неопрятный мужчина с лохматыми длинными волосами, торчащими из-под конического стального шлема.</p><p class="p1">— Человек двадцать, а может, и двадцать пять, — выдохнул он. — Молочные Змеи или Лунные Братья, точнее не знаю. Должно быть, у них повсюду соглядатаи, они знают, что мы здесь.</p><p class="p1">Сир Родрик Кассель был уже на коне, с длинным мечом в руке. Моррек притаился за скалой, обеими руками сжимая заканчивающееся острым железом копье, зубы стискивали кинжал.</p><p class="p1">— Эй, певец, — окликнул сир Уиллис Воде, — помоги мне с нагрудником. — Мариллон застыл, вцепившись в арфу, лицо его побелело как молоко, и слуга Тириона Моррек торопливо вскочил на ноги, чтобы помочь рыцарю вооружиться.</p><p class="p1">Тирион не отпускал Кейтилин Старк.</p><p class="p1">— У вас нет выбора, — сказал он. — Нас трое, и четвертый будет охранять нас… Четверо человек — они могут отделить нас от смерти.</p><p class="p1">— Дайте мне слово, что вы сложите мечи после того, как закончится схватка.</p><p class="p1">— Мое слово? — Копыта грохотали совсем близко. Тирион криво усмехнулся. — Даю вам его, леди, но моя честь — честь Ланнистера.</p><p class="p1">Одно мгновение казалось, что Кейтилин плюнет на него, но вместо этого она отрезала:</p><p class="p1">— Вооружайтесь! — и отправилась прочь.</p><p class="p1">Сир Родрик перебросил Джику его меч и ножны и развернулся навстречу врагу. Моррек взял лук и колчан и припал на колено возле дороги. Он был гораздо более хорошим стрелком, чем фехтовальщиком. Бронн подъехал, предлагая Тириону двухсторонний топор.</p><p class="p1">— Никогда не сражался топором. — Оружие казалось Тириону незнакомым и неудобным: короткая рукоятка, тяжелое головище с отвратительным острием на конце.</p><p class="p1">— Думай, что колешь дрова, — проговорил Бронн, извлекая длинный меч из заброшенных на спину ножен. Сплюнув, он направился вперед, чтобы стать возле Чиггена и сира Родрика. Сир Уиллис уже поднялся на ноги, чтобы присоединиться к ним, но все еще возился со своим шлемом — металлическим горшком с тонкой прорезью для глаз и длинным плюмажем из черного шелка.</p><p class="p1">— Бревна не кровоточат, — проговорил Тирион, ни к кому, собственно, не обращаясь. Без панциря он ощущал себя нагим. Он огляделся, отыскивая укрытие, и бросился к Мариллону. — Подвинься.</p><p class="p1">— Убирайся! — закричал ему мальчишка. — Я певец и не хочу участвовать в этой свалке.</p><p class="p1">— Что, уже потерял любовь к приключениям? — Тирион пнул молодца, тот подвинулся, и как раз вовремя. Мгновение спустя враги наехали на них.</p><p class="p1">Не было ни герольдов, ни знамен, ни рогов, ни барабанов, только звякнули тетивы Моррека и Лхариса, и из рассветной мглы выехали горцы: худые и смуглые, в вареной коже и резной броне, скрывавшие лица за решетками полушлемов. Руки в перчатках сжимали всякого рода оружие: длинные мечи, пики, заостренные косы, шипастые дубинки, кинжалы и тяжелые железные молоты. Возглавлял отряд рослый человек в плаще из полосатой шкуры сумеречного кота, вооруженный большим двуручным мечом.</p><p class="p1">Сир Родрик закричал:</p><p class="p1">— За Винтерфелл! — и тронул коня.</p><p class="p1">Бронн и Чигген ехали возле него, выкрикивая какой-то бессловесный боевой призыв. Сир Уиллис следовал за ними, размахивая шипастым кистенем вокруг головы.</p><p class="p1">— Харренхолл! Харренхолл! — пел он.</p><p class="p1">Тирион ощутил внезапное желание вскочить, замахнуться топором и выкрикнуть:</p><p class="p1">— Бобровый утес! — Но приступ безумия быстро прошел, и он нагнулся пониже.</p><p class="p1">Раздалось ржание испуганных лошадей, звон металла о металл. Меч Чиггена рассек обнаженное лицо наездника в панцире, а Бронн вихрем рванулся вперед, разя горцев направо и налево. Сир Родрик молотил рослого всадника в плаще из шкуры сумеречного кота, кони их плясали, противники обменивались ударами. Джик вскочил на коня и без седла бросился в схватку. Тирион заметил, как стрела выросла из горла человека в плаще из кошачьей шкуры, тот открыл рот, чтобы закричать, но из него хлынула только кровь. Противник упал, и сир Родрик вступил в схватку с кем-то еще.</p><p class="p1">Вдруг Мариллон завизжал, прикрывая голову арфой, — через их скалу перепрыгнул конь. Всадник обернулся к ним, размахивая шипастой булавой, и Тирион вскочил на ноги. Ухватив топор обеими руками, он коротко взмахнул, и лезвие, чавкая, впилось в горло прыгающей лошади. Топор дернул руку, и Тирион едва не выронил оружие. Когда животное с хрипом упало, он умудрился вырвать топор и неловко уклонился в сторону. Мариллону повезло меньше. Конь и наездник упали как раз на певца. Тирион отпрыгнул назад, и пока нога бандита оставалась под павшим конем, погрузил топор ему в спину, как раз над лопаткой.</p><p class="p1">Стараясь вырвать оружие, он услыхал за собой стон Мариллона.</p><p class="p1">— Кто-нибудь, помогите же мне, — выдохнул певец. — Боги милосердные, у меня кровь идет.</p><p class="p1">— По-моему, это лошадиная кровь, — заметил Тирион. Ладонь певца высунулась из-под мертвого животного, скребясь в грязи, словно пятиногий паук.</p><p class="p1">Тирион наступил каблуком на протянувшиеся пальцы и услышал удовлетворивший его хруст.</p><p class="p1">— Закрой глаза и изобрази, что ты умер, — посоветовал он певцу, а потом поднял топор и повернулся.</p><p class="p1">После этого все сложилось как надо. Тяжелая от запаха крови заря наполнилась криками и воплями, мир преобразился в хаос. Стрелы свистели мимо его уха, звякали по камням. Он видел, что Бронн лишился коня и сражался, держа по мечу в каждой руке. Тирион держался края схватки, он перескакивал со скалы на скалу и выпрыгивал из теней, чтобы подрубить ноги проезжавших коней. Наткнувшись на раненого горца, он избавил его от жизни, а заодно и от полушлема, оказавшегося, пожалуй, тесноватым, но Тирион рад был любой защите. Джика срубили сзади, пока он резал горца впереди себя, а потом Тирион переступил через тело Курлекета; поросячья физиономия была разбита булавой, но Тирион узнал свой кинжал, разжимая руку убитого. Засовывая его за пояс, он услыхал женский крик.</p><p class="p1">Кейтилин Старк жалась к каменной поверхности скалы, ее окружали трое: один на коне и двое пеших. Она неловко держала оружие ранеными руками, но спина ее уже припала к скале, и они обступили ее с трех сторон.</p><p class="p1">Пусть получит, сука, подумал Тирион, однако почему-то шагнул вперед. Он ударил первого под колено, прежде чем они успели заметить его; тяжелая головка топора перерубила плоть и кость, словно гнилое бревно. А бревна все-таки кровоточат, пришла в голову Тириона безумная мысль, когда к нему направился второй противник. Тирион нырнул под меч и ударил вперед топором, горец отшатнулся назад, и Кейтилин Старк сзади вспорола ему горло. Всадник вдруг вспомнил, что у него где-то неподалеку срочное дело, и взял с места в галоп.</p><p class="p1">Тирион огляделся: враги были убиты, ранены или бежали. Пока он был занят боем, схватка каким-то образом закончилась. Вокруг лежали умирающие кони и раненые люди, они стонали или кричали. К невероятному изумлению, он оказался не среди них. Тирион разжал пальцы и выронил топор на землю. Ладони его сделались липкими от крови. Тирион мог бы присягнуть, что они дрались полдня, но солнце даже не успело сойти с места.</p><p class="p1">— Значит, первая битва? — спросил его Бронн; склонившись над телом Джика, наемник стягивал с убитого сапоги. Хорошие сапоги, какие и подобает носить людям лорда Тайвина: толстая и гибкая, натертая маслом кожа, — куда лучше тех, которые истоптал Бронн.</p><p class="p1">Тирион кивнул.</p><p class="p1">— Отец мой будет ужасно горд, — сказал он. Ноги карлика так болели, что он едва мог стоять. Как ни странно, во время схватки он не замечал этой боли.</p><p class="p1">— А теперь тебе нужно бабу, — проговорил Бронн. Черные глаза его блеснули. Наемник затолкал сапоги в переметную суму. — После первой крови нет ничего лучше, поверь мне на слово.</p><p class="p1">Чигген оторвался от грабежа, довольно фыркнул и облизнулся.</p><p class="p1">Тирион посмотрел на леди Старк, занимавшуюся ранами сира Родрика.</p><p class="p1">— Я-то что — она не согласится, — проговорил он.</p><p class="p1">Вольные всадники разразились хохотом, Тирион ухмыльнулся и подумал: это начало. Потом он склонился возле ручья и смыл кровь с лица ледяной водой. Хромая, направился к остальным и вновь поглядел на убитых. Мертвые горцы были худы и оборванны, из-под лохматых шкур невысоких коньков торчали все ребра. Оружие, которое оставили убитым Бронн и Чигген, делало это войско не слишком впечатляющим. Молоты, дубинки, коса… Тирион вспомнил рослого противника сира Родрика, одетого в шкуру сумеречного кота и сражающегося двуручным мечом, но когда он обнаружил его тело на каменистой земле, убитый не показался ему высоким. Тирион отметил, что клинок его был щербатым, дешевую сталь покрывала ржавчина. Нечего удивляться тому, что горцы оставили на земле девять тел.</p><p class="p1">Они потеряли только троих: двоих из людей лорда Бракена, Курлекета и Мохора; погиб его собственный слуга Джик, отважно бросившийся в битву на незаседланном коне. Дураком жил, дураком и погиб, подумал Тирион.</p><p class="p1">— Леди Старк, я настаиваю, чтобы вы всячески поторопились, — проговорил сир Уиллис Воде, внимательно оглядывая гребни холмов сквозь прорезь шлема. — Мы отогнали их, но далеко они не отъедут.</p><p class="p1">— Сначала мы должны похоронить наших мертвецов, сир Уиллис, — ответила она, — они были храбрыми людьми, и я не оставлю их воронам и сумеречным котам.</p><p class="p1">— Почва слишком каменистая, чтобы рыть могилу, — проговорил сир Уиллис.</p><p class="p1">— Тогда мы можем набрать камней для кэрна.<a href="ch2.xhtml#id12" class="a">[11]</a></p><p class="p1">— Собирайте все камни, которые вам нужны, — сказал ей Бронн, — но без меня или Чиггена. У нас есть более важное дело, чем закидывать мертвецов камнями. Например, я хочу дышать. — Он оглядел выживших. — Те из вас, кто надеется пережить сегодняшний вечер, поедут с нами.</p><p class="p1">— Миледи, увы, он говорит правду, — усталым голосом заметил сир Родрик. Старый рыцарь был ранен, на руке его остался глубокий порез, кроме того, копье задело его шею, и голос его теперь звучал по-стариковски. — Если мы задержимся здесь, они снова нападут, и уж второй схватки мы можем не пережить.</p><p class="p1">Тирион видел гнев на лице Кейтилин, но у нее выхода не оставалось.</p><p class="p1">— Тогда пусть боги простят нас. Хорошо, едем немедленно.</p><p class="p1">Теперь недостатка в конях не было. Тирион перенес свое седло на пятнистого мерина Джика, казавшегося достаточно крепким, чтобы протянуть еще три или четыре дня. Он уже собирался подняться в седло, когда Лхарис шагнул вперед и сказал:</p><p class="p1">— А сейчас отдай мне этот кинжал, карлик.</p><p class="p1">— Пусть оружие останется у него, — сказала Кейтилин Старк, поглядев вниз со своего коня. — И кинжал, и топор. Возможно, они понадобятся, если на нас нападут снова.</p><p class="p1">— Благодарю вас, леди, — ответил Тирион, садясь в седло.</p><p class="p1">— Приберегите свои благодарности, сир, — сказала она. — Я доверяю вам не более, чем раньше. — Кейтилин отъехала, прежде чем он успел придумать ответ.</p><p class="p1">Тирион поправил краденый шлем и забрал топор у Бронна. Он вспомнил, как начинал это путешествие, со связанными кулаками и в капюшоне, надвинутом на голову, и счел перемену вполне положительной. Пусть леди Старк не доверяет ему, но теперь у него есть топор, а значит, он может рассчитывать на жизнь в этой игре.</p><p class="p1">Сир Уиллис Воде повел их дальше. Бронн ехал последним, леди Старк в середине, сир Родрик тенью маячил возле нее. Мариллон бросал на Тириона гневные взгляды. У певца оказались сломанными несколько ребер, арфа и все четыре пальца на играющей руке, но все же удача не совсем оставила его; Мариллон каким-то образом разжился плащом из шкуры сумеречного кота и теперь — наконец-то! — молча горбился под густой черной шкурой, прорезанной белыми полосами.</p><p class="p1">Едва отъехав на полмили, они услышали позади басовитое рычание сумеречных котов, а потом яростную грызню зверей над оставленными ими трупами. Мариллон заметно побледнел. Тирион подъехал к нему.</p><p class="p1">— Трусливый юнец, — сказал он, — превосходная рифма к слову «певец»! — Пришпорив коня, он присоединился к сиру Родрику и Кейтилин Старк.</p><p class="p1">Она поглядела на него, плотно сжав губы.</p><p class="p1">— Как я говорил, прежде чем нас столь грубо прервали, — начал Тирион, — в басне Мизинца есть один серьезный порок. Что бы вы ни думали обо мне, леди Старк, клянусь вам в одном: я никогда не держу пари против своих родственников.</p></span>
