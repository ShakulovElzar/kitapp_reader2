<p class="p">Тирион</p>
</div><p class="p1">Они укрылись в осиновой роще, неподалеку от высокогорной дороги. Тирион собирал хворост, пока кони пили из горного ручья. Он нагнулся, чтобы подобрать обломанную ветвь, и критически осмотрел ее.</p><p class="p1">— А эта подойдет? Я не умею разводить огонь. Костром всегда занимался Моррек.</p><p class="p1">— Костром? — спросил Бронн сплевывая. — Неужели ты настолько проголодался, чтобы хотеть себе смерти, карлик? Или здравый смысл распрощался с твоей головой? Дым костра немедленно привлечет сюда горцев со всей округи. А я, Ланнистер, намереваюсь пережить это путешествие.</p><p class="p1">— И как ты надеешься сделать это? — спросил Тирион. Подхватив сухую ветвь рукой, он искал другие среди редкого подлеска. Натруженная в пути спина его ныла; выехали они с рассветом, когда сир Лин Корбрей с каменным лицом выставил их за Кровавые ворота и велел никогда не возвращаться в Долину.</p><p class="p1">— У нас нет и шанса с боем пробиться назад, — сказал Бронн. — Но двое проедут дальше, чем десятеро, и привлекут к себе меньше внимания. Чем меньше дней мы проведем в этих горах, тем более вероятно, что мы сумеем добраться до приречья. Скакать придется быстро и усердно. Будем путешествовать ночью, прятаться днем, избегать дороги, где только можно. Еще придется не шуметь и не зажигать костров.</p><p class="p1">Тирион Ланнистер вздохнул:</p><p class="p1">— Великолепный план, Бронн. Делай как хочешь… однако прости, если я не стану задерживаться, чтобы похоронить тебя.</p><p class="p1">— Ты решил пережить меня, карлик? — Наемник ухмыльнулся. Улыбка его зияла дырой там, где сир Вардис Иген краем щита выбил ему зуб.</p><p class="p1">Тирион пожал плечами:</p><p class="p1">— Если скакать усердно и быстро ночами, можно без особых хлопот свалиться с горы и разбить себе череп. Я лично предпочитаю передвигаться без спешки и ненужных усилий. Я знаю, как тебе нравится конина, Бронн, но если наши лошади падут на этот раз, седлать придется уже сумеречных котов. Потом, горцы все равно заметят нас — что бы мы ни делали. Их глаза и сейчас смотрят в нашу сторону. — Тирион указал одетой в перчатку рукой в сторону высоких, продутых ветром утесов.</p><p class="p1">Бронн скривился:</p><p class="p1">— Раз так, мы уже мертвецы, Ланнистер.</p><p class="p1">— И в таком случае я предпочитаю хотя бы умереть в уюте, — ответил Тирион. — Нам нужен костер. Ночи здесь холодны, и горячая пища согреет наши животы и поднимет дух. Как, по-твоему, может здесь найтись какая-нибудь дичь? Леди Лиза по доброте своей в изобилии снабдила нас соленой говядиной, твердым сыром и черствым хлебом, однако мне не хотелось бы сломать себе зуб в такой дали от ближайшего мейстера.</p><p class="p1">— Я найду мясо. — Темные глаза Бронна с подозрением глянули на Тириона из-под водопада черных волос. — Я могу бросить тебя здесь, у этого дурацкого костра. И забрать твоего коня, чтобы у меня был запасной. Что ты будешь делать тогда, карлик?</p><p class="p1">— Умру скорее всего. — Тирион нагнулся, чтобы подобрать еще одну палку.</p><p class="p1">— И ты не считаешь, что так я и поступлю?</p><p class="p1">— Ты бы сделал это прямо сейчас, если бы знал, что таким образом сохранишь себе жизнь. Вспомни, как ты поторопился избавить от жизни своего друга Чиггена, когда тот получил стрелу в живот. — Запрокинув голову Чиггена назад, Бронн вогнал ему острие кинжала прямо под ухо, а потом объяснил Кейтилин Старк, что спутник его умер от раны.</p><p class="p1">— Он был уже все равно что мертв, — отвечал Бронн. — А стоны его могли бы навести на нас горцев. Чигген сделал бы то же самое со мной… И он не был мне другом, просто нам случилось ехать рядом в одну сторону. Не ошибись, карлик. Я бился за тебя, но не испытываю к тебе любви.</p><p class="p1">— Мне нужен был твой клинок, — ответил Тирион, бросая хворост на землю, — а не любовь.</p><p class="p1">Бронн ухмыльнулся:</p><p class="p1">— Ты отважен, как наш брат наемник, даю слово. А как ты узнал, что я стану на твою сторону?</p><p class="p1">— Узнал? — Тирион неловко опустился на коротких ногах, чтобы развести костер. — Я бросил кости. Там, в гостинице, вы с Чиггеном помогли захватить меня. Почему? Остальные считали, что обязаны совершить подобный поступок, этого требовала честь лордов, которым они служили, но что заставило вас присоединиться к ним? Ведь у вас не было лорда и обязанностей, вы не должны были угождать какой-то там чести. Зачем же связываться?</p><p class="p1">Достав нож, Тирион принялся состругивать тонкие полоски коры с одной из ветвей, чтобы использовать в качестве растопки.</p><p class="p1">— Зачем вообще наемники что-нибудь делают? Ради золота. Вы думали, что леди Кейтилин наградит вас за помощь, быть может, даже возьмет на службу. Этого хватит, надеюсь. У тебя есть кремень?</p><p class="p1">Бронн запустил два пальца в кисет на поясе и достал кремень. Тирион поймал его в воздухе.</p><p class="p1">— Благодарю, — сказал он. — Дело в том, что ты не был знаком со Старками. Лорд Эддард — человек гордый, достопочтенный и честный, а его леди-жена еще хуже. О, вне сомнения, она в конце концов отыскала бы для тебя монету-другую и вложила бы ее тебе в руку — вместе с вежливым словом и презрительным взглядом, но вы надеялись не на это. Старки желают видеть отвагу, верность и честь в тех людях, которых берут на службу. Ну а вы с Чиггеном, откровенно говоря, низменные подонки. — Тирион ударил кремнем о кинжал, пытаясь высечь огонь, но безуспешно.</p><p class="p1">Бронн фыркнул:</p><p class="p1">— У тебя смелый язык, человечек. Однажды кто-нибудь захочет отрезать его и затолкать тебе в глотку.</p><p class="p1">— Это мне все пророчат. — Тирион поглядел на наемника. — Разве я обидел тебя? Прошу прощения… Но ты же подонок, Бронн, ошибки быть не может. Долг, честь, дружба… Что говорят тебе эти слова? Только не затрудняй себя, мы оба знаем ответ. И тем не менее ты не глуп. Когда мы добрались до Долины, леди Старк более не нуждалась в тебе… в отличие от меня… А Ланнистеры никогда не испытывали недостатка в золоте. Когда настал момент бросать кости, я рассчитывал на то, что у тебя хватит ума, чтобы понять, где лежит твоя выгода. К моему счастью, ты это понял. — Он вновь ударил камнем о сталь и снова без результата.</p><p class="p1">— Дай-ка, — сказал Бронн, присаживаясь на корточки. — Я сделаю. — Он забрал кремень из рук Тириона и высек искру с первого удара. Кусок коры задымился.</p><p class="p1">— Отличная работа, — сказал Тирион. — Пусть ты и негодяй, однако человек необычайно полезный, а с мечом в руке почти не уступаешь моему брату Джейме. Чего ты хочешь, Бронн? Золота? Земли? Женщин? Сохрани мою жизнь, и ты получишь все это.</p><p class="p1">Бронн осторожно раздувал огонек, язычки пламени сразу вспрыгнули повыше.</p><p class="p1">— А если ты погибнешь?</p><p class="p1">— Ну, тогда меня хотя бы один человек оплачет от всего сердца, — ухмыльнулся Тирион. — Золото-то кончится вместе со мной!</p><p class="p1">Костер запылал. Бронн поднялся, опуская кремень в кисет, и бросил Тириону кинжал.</p><p class="p1">— Честная сделка, — сказал он. — Мой меч принадлежит тебе… Только не рассчитывай, что я буду преклонять колено и называть тебя милордом всякий раз, когда ты присаживаешься посрать. Я не умею быть чьим-либо прихвостнем.</p><p class="p1">— И другое тоже, — отвечал Тирион. — Я ничуть не сомневаюсь, что ты предашь и меня, словно леди Старк, если усмотришь свою выгоду. Но если настанет день, когда ты почувствуешь желание продать меня, запомни, Бронн: я могу дать столько же, сколько тебе предложат, даже больше. Мне нравится жить. А теперь, как ты думаешь, нельзя ли нам сообразить насчет ужина?</p><p class="p1">— Позаботься о лошадях, — сказал Бронн, извлекая длинный кинжал, который носил на бедре. И направился в лес.</p><p class="p1">Через час кони были вычищены и накормлены, огонь весело потрескивал, и нога молодого козленка висела над костром, капая на уголья шипящим жиром.</p><p class="p1">— Нам не хватает теперь только хорошего вина, чтобы залить нашего козленка, — проговорил Тирион.</p><p class="p1">— А к вину бабы и дюжины спутников, — согласился Бронн.</p><p class="p1">Он сидел, скрестив ноги, возле костра, шлифуя край своего длинного меча точильным камнем. Шелестящий звук вселял в душу Тириона странную уверенность.</p><p class="p1">— Скоро совсем стемнеет, — сказал наемник. — Я подежурю первую стражу… не знаю только, к добру это или нет. Может, будет лучше, если нас прирежут во сне.</p><p class="p1">— Что ты! По-моему, они окажутся здесь задолго до того, как дойдет до сна. — Запах жареного мяса наполнил рот Тириона слюной.</p><p class="p1">Бронн посмотрел на него через костер.</p><p class="p1">— У тебя есть план, — сказал он ровным голосом, сквозь скрип камня по стали.</p><p class="p1">— Назовем его надеждой, — сказал Тирион. — И еще раз бросим кости.</p><p class="p1">— Поставив свои жизни в качестве заклада?</p><p class="p1">Тирион пожал плечами:</p><p class="p1">— А что еще у нас осталось?</p><p class="p1">Склонившись над очагом, он отрезал себе тоненький ломтик мяса.</p><p class="p1">— Ах, — вздохнул он, блаженно жуя. Жир побежал по его подбородку. — Мясо, пожалуй, жестковато, не помешали бы и какие-нибудь приправы, однако мне жаловаться не пристало: если бы мы остались в Орлином Гнезде, я бы плясал на краю обрыва, пытаясь выслужить вареный боб.</p><p class="p1">— И все же ты дал тюремщику кошелек с золотом, — проговорил Бронн.</p><p class="p1">— Ланнистеры всегда платят свои долги.</p><p class="p1">…Морд едва поверил своим глазам, когда Тирион бросил ему кожаную мошну. Глаза тюремщика округлились, как вареные яйца, когда, потянув за веревочку, он увидел внутри блеск золота.</p><p class="p1">— Я приберег его для себя, — сказал Тирион с кривой улыбкой, — но тебе было обещано золото, вот оно.</p><p class="p1">Денег было много больше, чем человек, подобный Морду, мог бы заработать, тираня узников целую жизнь.</p><p class="p1">— Помни мои слова, я дал тебе только попробовать! Если тебе когда-нибудь надоест служить леди Аррен, приезжай на Бобровый утес, и я выплачу тебе остаток долга.</p><p class="p1">Рассыпая золотые драконы, Морд упал на колени и пообещал, что поступит именно так.</p><p class="p1">Бронн извлек свой кинжал и снял мясо с очага. Он принялся срезать с кости толстые обугленные ломти, а тем временем Тирион смастерил из двух горбушек черствого хлеба нечто вроде тарелок.</p><p class="p1">— А что ты сделаешь, если мы доберемся до реки? — спросил наемник, не отрываясь от дела.</p><p class="p1">— О, начну со шлюхи, перины и бутылки вина. — Тирион протянул свою миску, и Бронн наполнил ее мясом. — А потом отправлюсь на Бобровый утес или в Королевскую Гавань. У меня есть некоторые настоятельные вопросы в отношении некоего кинжала, на которые я бы хотел услышать ответ…</p><p class="p1">Наемник пожевал и глотнул.</p><p class="p1">— Значит, ты утверждаешь, что прав и нож не был твоим?</p><p class="p1">Тирион тонко улыбнулся.</p><p class="p1">— Разве я похож на лжеца?</p><p class="p1">К тому времени, когда животы их наполнились, на небе высыпали звезды и полумесяц уже поднялся над горами. Тирион расстелил на земле шкуру сумеречного кота и растянулся, подложив под голову седло.</p><p class="p1">— Наши друзья не спешат.</p><p class="p1">— На их месте я бы опасался засады, — сказал Бронн. — Зачем нам вести себя столь открыто, как не заманивать их в ловушку?</p><p class="p1">Тирион кивнул:</p><p class="p1">— Тогда можно и спеть, может, в ужасе разбегутся! — Он начал насвистывать.</p><p class="p1">— Ты обезумел, карлик, — сказал Бронн, вычищая жир кинжалом из-под ногтей.</p><p class="p1">— Где твоя любовь к музыке, Бронн?</p><p class="p1">— Если тебе нужна музыка, заставил бы певца защищать тебя.</p><p class="p1">Тирион ухмыльнулся:</p><p class="p1">— Вот бы был видок! Хорошо бы посмотреть, как он отмахивался своей арфой от сира Вардиса!</p><p class="p1">Тирион вновь засвистел.</p><p class="p1">— Знаешь эту песню?</p><p class="p1">— То и дело слышу в кабаках и борделях.</p><p class="p1">— Мирийская. «Время моей любви». Сладкая и печальная, если понимаешь слова. Ее все пела девушка, с которой я в первый раз в своей жизни лег в постель, и я так и не смог забыть мелодию. — Тирион поглядел на небо. В чистой ночной прохладе над горами горели звезды, ясные и не знающие жалости, словно сама правда.</p><p class="p1">— Я познакомился с ней похожей ночью, — неожиданно для себя начал рассказывать Тирион. — Мы с Джейме возвращались из Ланниспорта, когда услышали крик: она выбежала на дорогу, а двое мужчин преследовали ее по пятам и выкрикивали угрозы. Мой брат извлек меч и отправился следом за ними. А я остался защищать девицу. Она оказалась молоденькой, не больше чем на год старше меня, темноволосой, тонкой, с личиком, от которого растаяло бы и твое сердце, что уж говорить обо мне. Из простонародья, полуголодная, немытая… но очаровательная. Мужчины эти успели сорвать с нее почти все лохмотья, и пока Джейме гонял их по лесу, я накинул на нее плащ. Когда брат вернулся назад, я уже узнал ее имя и историю. Дочь мелкого землевладельца, она осиротела, когда отец умер от лихорадки по дороге в… да, в общем, в никуда.</p><p class="p1">Джейме лез из шкуры, чтобы догнать этих мужчин. Разбойники нечасто осмеливаются нападать на путников возле Бобрового утеса, и он усмотрел в этом оскорбление. Девушка пережила слишком большой испуг и боялась идти одна, поэтому я предложил отвезти ее на ближайший постоялый двор, накормить и напоить. Брат тем временем отправился на Бобровый утес за помощью.</p><p class="p1">Она оказалась настолько голодной, что я даже не поверил своим глазам. Мы съели двух цыплят, начали третьего и выпили за разговором целую бутылку вина. Мне было тогда только тринадцать, и, увы, вино ударило мне в голову. Дальше я помню только, как разделял с ней ложе. Не знаю, кто был застенчивей, я или она. Не знаю, где я отыскал тогда отвагу. Когда я лишил ее девственности, она заплакала, а потом поцеловала меня и спела эту песенку. И к утру я уже влюбился.</p><p class="p1">— Ты? — В голосе Бронна звучало удивление.</p><p class="p1">— Невероятно, не правда ли? — Тирион снова начал насвистывать. — Более того, я женился на ней, — наконец признался он.</p><p class="p1">— Ланнистер с Бобрового утеса взял в жены дочь мелкого землевладельца? — спросил Бронн. — И как тебе это удалось?</p><p class="p1">— О, ты даже не знаешь, что может соорудить мальчишка с помощью лжи, пятидесяти сребреников и пьяного септона. Я не смел привести свою невесту домой на Бобровый утес и поэтому устроил ее в собственном домике, и две недели мы с ней играли в мужа и жену. Потом септон протрезвел и признался во всем моему лорду-отцу.</p><p class="p1">Тирион удивился той грусти, которую он все еще ощущал даже по прошествии стольких лет. Наверное, он очень устал.</p><p class="p1">— Тут и пришел конец моему браку. — Тирион сел и, моргая, уставился в огонь умирающего костра.</p><p class="p1">— Он прогнал девчонку?</p><p class="p1">— Отец поступил лучше, — отвечал Тирион. — Сперва он заставил моего брата сказать мне правду: видишь ли, девица была шлюхой. Джейме подстроил все приключение, дорогу, нападение разбойников и все прочее. Он решил, что мне пора познать женщину. Он заплатил девушке двойную плату, зная, что она будет у меня первой.</p><p class="p1">— Потом, когда Джейме признался, лорд Тайвин, чтобы закрепить урок, приказал привести мою жену и отдал ее гвардейцам. Они расплатились с ней достаточно честно: по серебряку с человека, — много ли шлюх может потребовать такую плату? А меня заставил сесть в уголке казармы и смотреть; наконец она набрала столько серебряков, что монеты уже сыпались сквозь пальцы и катились по полу… — Дым ел глаза, и, откашлявшись, Тирион отвернулся от огня. — Лорд Тайвин заставил меня пойти последним, — сказал он спокойным голосом. — И дал мне золотую монету, потому что, как Ланнистер, я стоил большего.</p><p class="p1">Некоторое время спустя он вновь услышал привычный шелест стали о камень: Бронн снова взялся за меч.</p><p class="p1">— В тринадцать, или в тридцать, даже в три года я бы убил того человека, который обошелся бы со мной подобным образом.</p><p class="p1">Тирион повернулся к нему лицом.</p><p class="p1">— Однажды тебе, быть может, представится такая возможность. Запомни, что я сказал тебе: Ланнистеры всегда платят долги! Я попытаюсь уснуть. Разбуди меня, если смерть придет к нам. — Тирион зевнул.</p><p class="p1">Он завернулся в шкуру и закрыл глаза. Каменистая почва была неудобным и холодным ложем, однако спустя некоторое время карлик уснул. Ему снилась небесная камера, только на этот раз тюремщиком был он сам и, встав во весь внушительный, как это иногда бывало у него во сне, рост, ремнем бил отца, подталкивая его к пропасти…</p><p class="p1">— Тирион. — Зов Бронна прозвучал негромко и настоятельно.</p><p class="p1">Тирион вскочил в мгновение ока. Костер уже прогорел до углей, и отовсюду на них наползали тени. Бронн припал на колено с мечом в одной руке и кинжалом в другой. Тирион тихо проговорил:</p><p class="p1">— Подходите к очагу, ночь холодна. Увы, у нас нет вина, чтобы предложить вам, но мы будем рады поделиться козлятиной.</p><p class="p1">Движения прекратились. Тирион заметил, как блеснул лунный свет на металле.</p><p class="p1">— Наши горы, — отозвался голос из деревьев, гулкий, жесткий и недружелюбный. — Наша коза.</p><p class="p1">— Ваша коза, — согласился Тирион. — Кто вы?</p><p class="p1">— Когда вы встретитесь со своими богами, — проговорил другой голос, — скажите им, что это Гунтер, сын Гурна, из рода Каменных Ворон отослал вас к ним. — Треснула ветка, и на свет выскочил худой мужчина в рогатом шлеме, вооруженный длинным ножом.</p><p class="p1">— И Шагга, сын Дольфа, — послышался первый голос, глубокий и полный смертельной угрозы. Слева шевельнулся валун, встал и превратился в человека. Могучим, неторопливым и крепким казался он во всех своих шкурах, с дубиной в правой руке и топором в левой. Грохнув ими друг о друга, он шагнул вперед.</p><p class="p1">Остальные голоса выкрикивали свои имена: Конн, Торрек, и Джаггот… Тирион забывал их, едва услышав; нападавших было по крайней мере десятеро. Некоторые держали мечи и ножи, другие были вооружены вилами, косами, деревянными копьями. Дождавшись, когда все назовутся, Тирион дал ответ:</p><p class="p1">— А я Тирион, сын Тайвина, из клана Ланнистеров с Бобрового утеса. Мы охотно заплатим вам за козла, которого съели.</p><p class="p1">— Что ты отдашь нам, Тирион, сын Тайвина? — спросил человек, назвавшийся Гунтером. Он казался их вожаком.</p><p class="p1">— В моем кошельке найдется серебро, — ответил Тирион. — Эта кольчуга велика мне, но она будет впору Конну, и мой боевой топор более подобает для могучей длани Шагги, чем тот топор дровосека, который он сейчас держит.</p><p class="p1">— Полумуж хочет заплатить нам нашей собственной монетой, — сказал Конн.</p><p class="p1">— Конн говорит правду, — сказал Гунтер. — Твое серебро принадлежит нам, твои кони тоже. Твоя кольчуга, твой боевой топор и нож на твоем поясе тоже наши. У вас нет ничего, кроме жизней. Как ты хочешь умереть, Тирион, сын Тайвина?</p><p class="p1">— Лежа в постели, напившись вина, ощущая на моей шишке рот девушки, и в возрасте восьмидесяти лет, — отвечал он.</p><p class="p1">Громадный Шагга расхохотался первым и громче всех. Остальным было не так весело.</p><p class="p1">— Конн, бери их коней, — приказал Гунтер. — Убей второго и забери коротышку. Пусть доит коз и смешит матерей.</p><p class="p1">Бронн вскочил на ноги:</p><p class="p1">— Кто хочет умереть первым?</p><p class="p1">— Нет! — резко сказал Тирион. — Гунтер, сын Гурна, выслушай меня. Мой дом богат и могуществен. И если Каменные Вороны проводят нас через горы, мой лорд-отец осыплет вас золотом.</p><p class="p1">— Золото лорда с Низких земель ничего не стоит, как и обещания коротышки, — отвечал Гунтер.</p><p class="p1">— Быть может, я и не дорос до мужчины, — сказал Тирион, — однако у меня хватает отваги встречаться лицом к лицу с моими врагами. А что делают Каменные Вороны, когда рыцари выезжают из Долины? Прячутся за скалами и дрожат от страха!</p><p class="p1">Шагга гневно взревел и ударил дубиной о топор. Джаггот ткнул едва ли не в лицо Тириона обожженным в костре концом деревянного копья. Ланнистер постарался не вздрогнуть.</p><p class="p1">— Неужели вы не в состоянии украсть оружие получше? — спросил он. — Этим можно разве что бить овец… и то, если овца не будет сопротивляться. Кузнецы моего отца умеют делать самую лучшую сталь.</p><p class="p1">— Вот что, маленький человечишка, — взревел Шагга. — Можешь вволю смеяться над моим топором, когда я отрублю тебе мужские признаки и скормлю их козлу.</p><p class="p1">Но Гунтер поднял руку:</p><p class="p1">— А я выслушаю его слова. Матери голодают, а сталь может насытить больше ртов, чем золото. Что ты отдашь нам за ваши жизни, Тирион, сын Тайвина! Мечи? Пики? Кольчуги?</p><p class="p1">— Все это и даже больше, Гунтер, сын Гурна, — отвечал Тирион Ланнистер с улыбкой. — Я отдам вам Долину Аррен.</p></span>
