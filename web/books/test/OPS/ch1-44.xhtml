<span id="id42"><div class="title2">
<p class="p">Джон</p>
</div><p class="p1">— Вы столь же безнадежны, как и все мальчишки, с которыми мне приходилось иметь дело, — объявил сир Аллисер Торне, собрав их во дворе. — Ваши руки годятся только для навозных лопат, а не для мечей, и если бы это зависело только от меня, все вы пасли бы свиней. Но прошлой ночью мне передали, что Гуерен ведет по Королевскому тракту пятерых новых ребят. Быть может, за одного или двоих можно будет дать горшок мочи. Чтобы освободить для них место, я решил передать восьмерых из вас на усмотрение лорда-командующего.</p><p class="p1">Он назвал прозвища одно за другим:</p><p class="p1">— Жаба, Каменная Голова, Зубр, Дубовник, Прыщ, Обезьяна, сир Лунатик. — Напоследок он поглядел на Джона и объявил: — И Бастард.</p><p class="p1">Пип с восторженным возгласом подбросил меч в воздух. Сир Аллисер припечатал его к месту взглядом рептилии.</p><p class="p1">— В Ночном Дозоре вас будут звать мужчинами, но вы будете еще большими дураками, чем ярмарочная мартышка, если поверите в это. Вы так и остались мальчишками, зелеными, пахнущими летом, и когда придет зима, будете дохнуть как мухи! — С этим сир Аллисер Торне и оставил их.</p><p class="p1">Остальные собрались вокруг названных восьмерых, со смехом, ругательствами и поздравлениями. Халдер хлопнул Жабу по мягкому месту плоской частью меча и воскликнул:</p><p class="p1">— Жаба из Ночного Дозора!</p><p class="p1">Крикнув, что Черному Брату положен конь, Пип вспрыгнул на плечи Гренна; они повалились на землю и принялись бороться. Дарион бросился внутрь арсенала и вернулся с бурдюком кислого красного. Ухмыляясь как дураки, они передавали вино из рук в руки, и тут Джон заметил Сэмвела Тарли, стоявшего в одиночестве под голым мертвым деревом в уголке двора. Джон предложил ему бурдюк.</p><p class="p1">— Глотни вина?</p><p class="p1">Сэм тряхнул головой:</p><p class="p1">— Нет, спасибо тебе, Джон.</p><p class="p1">— С тобой все в порядке?</p><p class="p1">— Очень даже, — солгал толстый парень. — Я так рад за тебя! — Круглое лицо задрожало, и он выдавил улыбку. — Когда-нибудь ты станешь первым разведчиком, каким был твой дядя.</p><p class="p1">— Как мой дядя, — поправил Джон. Он никак не мог смириться со смертью Бенджена Старка. Прежде чем он успел сказать что-то еще, Халдер воскликнул:</p><p class="p1">— Эй, неужели ты собираешься выпить все в одиночку? — Пип выхватил вино и со смехом ускакал в сторону. Гренн схватил его за руку, Пип чуть нажал бурдюк, и тонкая красная струйка брызнула в лицо Джона. Халдер запротестовал против подобной траты доброго напитка. Джон смахнул с лица капли вина. Тем временем Маткар и Джерен взобрались на Стену и принялись забрасывать всех снежками.</p><p class="p1">К тому времени, когда он вырвался на свободу со снегом в волосах и пятнами вина на куртке, Сэмвел Тарли уже исчез.</p><p class="p1">В тот вечер ради праздника Трехпалый Хоб приготовил ребятам особый обед. Когда Джон появился в общем зале, лорд-стюард провел его к скамье возле очага. Старшие хлопали его по руке. Восьмерка будущих братьев пировала сегодня над седлом ягненка, запеченного с чесноком и травами, посыпанного мятой и обложенного плавающей в масле мягкой желтой репкой.</p><p class="p1">— С собственного стола лорда-командующего, — объяснил Боуэн Марш.</p><p class="p1">Еще был салат из шпината, цыплячьего гороха и зеленой турнепки и чаша замороженной черники со сладкими сливками.</p><p class="p1">— Как вы думаете, оставят нас вместе? — принялся гадать Пип, когда они блаженствовали от сытости.</p><p class="p1">Жаба скривился:</p><p class="p1">— Надеюсь, что нет. Меня уже тошнит от вида твоих ушей.</p><p class="p1">— Ого, — проговорил Пип. — Послушайте, ворона обзывает ворона черным! Ты, конечно же, будешь разведчиком, Жаба. Тебя выставят из замка подальше — как только возможно, — и когда явится Манс-налетчик, тебе останется просто поднять забрало; увидев твою рожу, одичалые в страхе убегут.</p><p class="p1">Расхохотались все, кроме Гренна:</p><p class="p1">— Надеюсь, что я уже стал разведчиком!</p><p class="p1">— И ты, и все остальные, — сказал Маткар. Всякий, кто носил черное, поднимался на Стену; всякий обязан был взять сталь, обороняя ее, однако разведчики были истинным сердцем Ночного Дозора. Это они осмелились выезжать за Стену, прочесывать Зачарованный лес и ледяные горные высоты к западу от Сумеречной башни, выискивая одичалых, гигантов и чудовищных снежных медведей.</p><p class="p1">— Не все, — сказал Халдер. — Я хочу в строители. Что будут делать разведчики, если Стена обрушится?</p><p class="p1">Орден строителей поставлял каменщиков и плотников, занимавшихся починкой крепостей и башен, горняков, копавших тоннели и бивших камень для дорог и троп, лесничих, срубавших новую поросль там, где лес слишком близко подступал к Стене. Прежде они, как говорили, вырубали огромные ледяные блоки из замерзших озер в недрах Зачарованного леса и волокли их на санках на юг к Стене, чтобы сделать ее выше. Но те дни закончились не один век назад; теперь Черные Братья могли только проехать по Стене от Восточного Дозора до Сумеречной башни, выискивая трещины и проталины и при необходимости ремонтируя их.</p><p class="p1">— Старый медведь не дурак, — рассудил Дарион. — Ты, конечно, будешь строителем, а Джон разведчиком. Он среди нас лучший фехтовальщик и наездник, а дядя его был первым разведчиком, прежде чем… — Голос его неловко умолк, когда он понял, что собирался сказать.</p><p class="p1">— Бенджен Старк по-прежнему остается первым разведчиком, — ответил ему Джон Сноу, поигрывая чашей черники. Все прочие пусть отказываются от надежд на возвращение его дяди, но он подождет. Джон отодвинул ягоды, почти не прикоснувшись к ним, и поднялся со скамьи.</p><p class="p1">— Ты что, не хочешь их есть? — спросил Жаба.</p><p class="p1">— Они твои. — Джон едва попробовал парадные блюда Хоба. — Ничего в глотку не лезет! — Взяв плащ с крюка возле стены, он направился наружу.</p><p class="p1">Пип увязался за ним.</p><p class="p1">— Джон, что случилось?</p><p class="p1">— Сэм, — признался тот. — Его не было сегодня за столом.</p><p class="p1">— Да, он не из тех, кто пропускает еду, — сказал Пип задумчиво. — Ты думаешь, он заболел?</p><p class="p1">— Он испугался, ведь мы оставляем его. — Джон вспомнил день, когда оставил Винтерфелл, горькую сладость прощания, изувеченного Брана в постели, Робба с припорошенными снегом волосами, Арью, получившую в подарок Иглу и осыпавшую его поцелуями. — Когда мы произнесем слова, у каждого из нас появятся обязанности. Кого-то из нас могут отослать в Восточный Дозор, кого-то в Сумеречную башню. Сэм останется учиться в обществе Раста, Куджера и новых ребят, которые едут по Королевскому тракту. Одни лишь боги знают, что они собой представляют, но можно не сомневаться: сир Аллисер выставит их против Сэма при первой же возможности.</p><p class="p1">Пип скривился.</p><p class="p1">— Ты сделал все, что мог.</p><p class="p1">— Все, что мог, но этого мало, — сказал Джон.</p><p class="p1">Глубокое беспокойство охватило его, когда он возвращался в башню Хардина за Призраком. Лютоволк направился вместе с ним в конюшню. Когда они вошли, кони попугливее начали брыкаться в стойлах и закладывать уши. Джон заседлал свою кобылу, поднялся в седло и выехал из Черного замка на юг — в лунную ночь. Призрак несся впереди него, он словно летел над землей и исчез в мгновение ока. Джон отпустил его: волку нужно охотиться.</p><p class="p1">У него не было никаких особых намерений. Он просто хотел проехаться. Некоторое время Джон следовал вдоль ручья, прислушиваясь к ледяному треньканью воды на камнях, потом взял через поля к Королевскому тракту. Дорога простиралась перед ним — узкая, каменистая, заросшая высокой травой — и ничего, собственно, не сулила, однако вид ее наполнил душу Джона Сноу странным волнением. На другом конце дороги лежал Винтерфелл, а за ним Риверран, Королевская Гавань, Орлиное Гнездо и другие края: Бобровый утес, Остров Ликов, Красные горы Дорна, сотня островов Браавос посреди моря и курящиеся руины древней Валирии. И ничего этого Джон никогда не увидит. Мир остался на одном конце ночной дороги, а он стоял в другом ее конце.</p><p class="p1">Как только он принесет присягу, Стена навсегда сделается его домом — пока он не состарится, не сделается таким, как мейстер Эйемон.</p><p class="p1">— Я еще не присягнул, — пробормотал Джон. Он не был разбойником, обязанным принять черное в качестве расплаты за свои преступления. Он пришел сюда по собственному желанию и пока может по своему же желанию и уехать… Роковые слова еще не произнесены. Достаточно было только поехать вперед, и он мог оставить Стену. Когда луна вновь обретет полноту, он уже окажется в Винтерфелле, около своих братьев.</p><p class="p1">Около своих сводных братьев, напомнил ему внутренний голос. И рядом с леди Старк, которая вовсе не будет рада ему. Для него нет места в Винтерфелле, как нет места и в Королевской Гавани. Даже собственная мать не нашла для него места в своей жизни. Мысль о ней повергла его в скорбь. Он попытался представить, кем она могла быть, на кого похожа и почему отец оставил ее. Наверное, потому, что она была шлюхой или осквернительницей семейного ложа, дурак! Существом темным и бесчестным, иначе почему лорд Эддард стыдился упоминать ее имя?</p><p class="p1">Джон Сноу отвернулся от Королевского тракта и поглядел назад. Огни Черного замка скрывала горка, но Стена оставалась на месте — бледная под луной, огромная и холодная, протянувшаяся от горизонта до горизонта.</p><p class="p1">Он развернул коня и направился домой.</p><p class="p1">Призрак вернулся, как только Джон поднялся на гребень и заметил свет ламп в башне лорда-командующего. С влажной от крови мордой лютоволк пристроился возле его коня. Возвращаясь назад, Джон вновь подумал о Сэмвеле Тарли. И въезжая в конюшню, уже знал, что надо делать.</p><p class="p1">Комнаты мейстера Эйемона располагались в крепком деревянном доме при грачевнике. Достаточно старый и дряхлый мейстер делил свои покои с двумя молодыми слугами, которые помогали ему при исполнении обязанностей. Братья пошучивали, что мейстеру подсунули двух самых больших уродов во всем Ночном Дозоре, поскольку по слепоте он не мог видеть их лиц. Лысый коротышка Клидас был начисто лишен подбородка, маленькие розовые глазки напоминали кротовьи. У Четта на шее выросла шишка величиной с голубиное яйцо, лицо побагровело от свищей и нарывов. Наверное, поэтому он всегда казался сердитым.</p><p class="p1">На стук открыл Четт.</p><p class="p1">— Мне нужно переговорить с мейстером Эйемоном, — заявил Джон.</p><p class="p1">— Мейстер уже в постели, и тебе тоже следует спать. Приходи завтра, быть может, он примет тебя. — Четт начал закрывать дверь.</p><p class="p1">Джон вставил в щель ногу.</p><p class="p1">— Мне нужно переговорить с ним немедленно. Утром будет слишком поздно.</p><p class="p1">Четт нахмурился:</p><p class="p1">— Мейстер не привык, чтобы его будили посреди ночи. Ты знаешь, какой он старый?</p><p class="p1">— Он достаточно стар, чтобы обращаться с гостями более любезно, чем ты, — сказал Джон. — Передай ему мои извинения. Я не стал бы прерывать его отдых, если бы дело не было спешным.</p><p class="p1">— А если я откажусь?</p><p class="p1">Нога Джона надежно перекрывала дверь.</p><p class="p1">— Я буду стоять здесь всю ночь, если придется.</p><p class="p1">Черный Брат с раздраженным бурчанием открыл дверь, впуская его.</p><p class="p1">— Ступай в библиотеку, там есть дрова. Растопи очаг. Я не хочу, чтобы мейстер простудился из-за тебя!</p><p class="p1">Когда Четт ввел мейстера Эйемона, Джон уже развел в очаге трескучий огонь. Старик был в ночной одежде, но горло его перехватывала цепь ордена. Мейстер не снимал ее даже на ночь.</p><p class="p1">— Кресло возле огня — дело приятное, — сказал он, ощущая теплоту на лице. Когда мейстер уселся поудобнее, Четт прикрыл ноги старика мехом и отошел к двери.</p><p class="p1">— Мне очень жаль, что пришлось разбудить вас, мейстер, — сказал Джон Сноу.</p><p class="p1">— Ты не разбудил меня, — ответил мейстер Эйемон. — С возрастом я все меньше нуждаюсь во сне, а я достаточно стар. Нередко мои ночи заполняют собой призраки людей, ушедших пятьдесят лет назад, и я встречаю их, как будто мы и не расставались. Таинственный полуночный гость для меня приятное развлечение. Итак, говори мне, Джон Сноу, почему ты пришел ко мне в столь неподходящий час?</p><p class="p1">— Попросить, чтобы Сэмвела Тарли освободили от учебы и посвятили в братья Ночного Дозора.</p><p class="p1">— Это решает не мейстер Эйемон, — выскочил вперед Четт.</p><p class="p1">— Наш лорд-командующий предоставил право обучать рекрутов сиру Аллисеру Торне, — ответил негромко мейстер. — Только он может сказать, когда парень будет готов к присяге, как ты, конечно, и сам знаешь. Почему же тогда ты обращаешься ко мне?</p><p class="p1">— Лорд-командующий прислушивается к вашим советам, — улыбнулся ему Джон. — А раненые и больные Ночного Дозора находятся в вашем распоряжении.</p><p class="p1">— Разве Сэмвел Тарли ранен или болен?</p><p class="p1">— Будет, — пообещал Джон, — если вы не поможете.</p><p class="p1">Он рассказал ему все, даже то, как спустил Призрака на Раста. Мейстер Эйемон слушал безмолвно, слепые глаза были обращены к огню, но лицо Четта темнело с каждым словом.</p><p class="p1">— Мы теперь не сможем помогать ему, и у Сэма не будет даже шанса, — закончил Джон. — С мечом он безнадежен. Моя сестра Арья смогла бы разрубить его на части, а ей еще нет и десяти. Если сир Аллисер заставит его драться, Сэмвел скоро превратится в калеку или погибнет.</p><p class="p1">Четт не мог более терпеть.</p><p class="p1">— Я видел этого жирного мальчишку в общем зале, — сказал он. — Это свинья и безнадежный трус, если правда все то, что ты говоришь!</p><p class="p1">— Быть может, ты и прав, — сказал мейстер Эйемон. — А скажи мне, Четт, как бы ты поступил с таким мальчишкой?</p><p class="p1">— Предоставил бы его самому себе, — ответил прислужник. — Стена не место для слабых. Пусть учится, пока не будет готов, сколько бы лет на это ни потребовалось. Сир Аллисер или сделает из него мужчину, или убьет — если так захотят боги.</p><p class="p1">— Это глупо, — сказал Джон. Он глубоко вздохнул, собираясь с мыслями. — Помню, как однажды я спрашивал у мейстера Лювина, почему он носит цепь вокруг шеи…</p><p class="p1">Мейстер Эйемон легко прикоснулся к собственной цепи, костлявый морщинистый палец погладил тяжелые металлические кольца.</p><p class="p1">— Продолжай!</p><p class="p1">— Лювин сказал мне, что оплечье мейстера делается в виде цепи, чтобы он не забывал о том, что дал присягу служить, — сказал Джон вспоминая. — Потом я спросил, почему все кольца делаются из разных металлов. Ведь серебряная цепь лучше смотрится с серым одеянием. Мейстер Лювин расхохотался. Мейстер кует свою цепь занятиями, — объяснил он мне. Различные металлы олицетворяют разные науки. Золото — знак знания денег и расчета, серебро — умения исцелять, железо — военного дела. Он сказал, что есть и другие истолкования. Наплечье должно напоминать мейстеру о стране, которой он служит, так ведь? Лорды — это золото, рыцари — сталь, но из двух звеньев цепь не скуешь, нужны серебро и железо, свинец и олово, медь и бронза и все остальные — то есть фермеры, кузнецы, торговцы и прочие люди. В цепи должны быть разные металлы, потому что стране нужны разные люди.</p><p class="p1">Мейстер Эйемон улыбнулся:</p><p class="p1">— И что же?</p><p class="p1">— Ночному Дозору также нужны всякие люди. Зачем существуют разведчики, стюарды и строители? Лорд Рендилл не смог сделать из Сэма воина, и сир Аллисер тоже ничего не добьется. Из олова не выкуешь железный меч, сколько ни стучи молотом, но это не значит, что олово бесполезно. Почему бы Сэму не стать стюардом?</p><p class="p1">Четт не выдержал и опять влез в разговор:</p><p class="p1">— Я стюард. Неужели ты думаешь, что это легкое дело, подходящее для толстяков? Орден стюардов поддерживает жизнь Дозора. Мы охотимся, возделываем землю, ухаживаем за конями, доим коров, возим и колем дрова, готовим еду. Как ты думаешь, кто делает одежду? Кто привозит припасы с юга? Стюарды!</p><p class="p1">Мейстер Эйемон ответил мягче:</p><p class="p1">— Твой друг охотник?</p><p class="p1">— Он ненавидит охоту, — пришлось признать Джону.</p><p class="p1">— Умеет ли он возделывать поле? — спросил мейстер. — Сможет ли он править фургоном или плыть под парусом? Сумеет ли он забить корову?</p><p class="p1">— Нет.</p><p class="p1">Четт нахально захихикал:</p><p class="p1">— Видел я, что случается с изнеженными лорденышами, когда они берутся за дело! Поставь его сбивать масло, так кровавые мозоли набьет. Дай колун, чтобы колоть дрова, так ногу себе отрубит!</p><p class="p1">— Но я знаю, в чем Сэм не уступит никому другому.</p><p class="p1">— Говори, — приказал мейстер Эйемон.</p><p class="p1">Джон с опаской глянул на побагровевшего Четта, стоявшего возле двери с сердитым лицом.</p><p class="p1">— Он может помочь лично вам, — сказал он. — Он умеет считать, читать и писать. Я знаю, что Четт не умеет читать, а у Клидаса слабые глаза. Сэм прочел каждую книгу в библиотеке своего отца. Он ладит с воронами, животные любят его. Призрак сразу привязался к нему. Он умеет многое, если не считать военного дела. Ночному Дозору нужен каждый человек. Зачем же бесцельно убивать его, когда лучше приставить к делу!</p><p class="p1">Мейстер Эйемон закрыл глаза. На короткое мгновение Джон было решил, что он уснул. Но наконец старик произнес:</p><p class="p1">— Мейстер Лювин хорошо выучил тебя, Джон Сноу. Твой ум, похоже, столь же ловок, как твой клинок.</p><p class="p1">— Значит ли это…</p><p class="p1">— Это значит, что я обдумаю твои слова, — твердо сказал ему мейстер. — А теперь, похоже, я сумею уснуть. Четт, проводи нашего юного брата до двери!</p></span>
