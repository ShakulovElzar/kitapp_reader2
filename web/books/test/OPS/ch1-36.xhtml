<span id="id34"><div class="title2">
<p class="p">Эддард</p>
</div><p class="p1">— Роберт, умоляю тебя, — попросил Нед, — пойми, что ты говоришь; ты хочешь убить ребенка.</p><p class="p1">— Эта шлюха беременна! — Королевский кулак с грохотом обрушился на стол. — Я предупреждал тебя об этом, Нед. Еще там, среди курганов, но ты не захотел слушать меня. Значит, слушай сейчас. Я хочу, чтобы все они погибли — и мать, и ребенок, и этот дурак Визерис. Понятно я выражаюсь? Я хочу, чтобы они умерли!</p><p class="p1">Прочие члены совета изо всех сил старались изобразить, что находятся совсем не здесь. Вне сомнения, они вели себя весьма мудро. Эддард Старк редко чувствовал себя в подобном одиночестве.</p><p class="p1">— Ты навсегда опозоришь себя, если такое случится.</p><p class="p1">— Беру грех на душу, только пусть будет сделано. Я не настолько слеп, чтобы не видеть тени топора, подвешенного над моей собственной шеей.</p><p class="p1">— Над тобой нет топора, — возразил Нед королю. — Ты видишь тени; опасность исчезла двадцать лет назад и теперь не существует.</p><p class="p1">— Так ли? — негромко спросил Варис, вытирая напудренные руки. — Милорд, вы обижаете меня. Неужели я вынесу ложь на суд короля и совета?</p><p class="p1">Нед холодно поглядел на евнуха.</p><p class="p1">— Вы принесли нам шепоток предателя, находившегося за полмира отсюда, милорд. Что, если Мормонт ошибается?.. Что, если он лжет?</p><p class="p1">— Сир Джорах не посмеет обмануть меня, — проговорил Варис с лукавой улыбкой. — Не рассчитывайте на это, милорд. Принцесса беременна.</p><p class="p1">— Пусть будет так. Но если вы ошибаетесь, нам нечего опасаться. Если у нее будет выкидыш, нам тоже ничего не грозит, как и если она родит дочь, а не сына. Потом ребенок может умереть в младенчестве…</p><p class="p1">— Ну а если это окажется мальчик? — настоятельно проговорил Роберт. — Если он выживет?</p><p class="p1">— Узкое море все еще разделяет нас. Я начну опасаться дотракийцев в тот самый день, когда узнаю, что они научили своих коней скакать по воде.</p><p class="p1">Глотнув вина, король яростно посмотрел на Неда.</p><p class="p1">— Итак, ты советуешь мне ничего не делать, пока драконий ублюдок не высадит свою армию на моих берегах?</p><p class="p1">— Этот драконий ублюдок еще в чреве матери, — возразил Нед. — Даже Эйегон-завоеватель приступил к завоеваниям не сразу после того, как его отняли от груди.</p><p class="p1">— Боги! Старк, ты упрям, как зубр! — Король оглядел стол совета. — Неужели у остальных отнялись языки? Может ли кто-нибудь вразумить этого недоумка, отморозившего свою унылую физиономию?</p><p class="p1">С елейной улыбкой Варис положил мягкую ладонь на рукав Неда.</p><p class="p1">— Я вполне понимаю терзания вашей совести, лорд Эддард, поверьте, это действительно так. И сам я без какой-либо радости объявил совету эту прискорбную новость. Мы обдумываем ужасное преступление. Но ведь всем, кто берет на себя бремя власти, приходится совершать зло ради государственного блага, сколь бы противны ни были эти поступки нам самим.</p><p class="p1">Лорд Ренли пожал плечами.</p><p class="p1">— Вопрос кажется мне достаточно ясным. Нам следовало убить Визериса и его сестру еще годы назад, но светлейший брат мой допустил ошибку, прислушавшись к Джону Аррену.</p><p class="p1">— Милосердие никогда не бывает ошибкой, лорд Ренли, — ответил Нед. — У Трезубца присутствующий здесь сир Барристан зарубил добрую дюжину моих друзей… моих и Роберта. Когда его доставили к нам, тяжелораненого, на пороге смерти, Русе Болтон предложил перерезать ему глотку, но ваш брат сказал: «Я не убью прекрасного бойца, проявившего верность своему властелину», — и послал своего собственного мейстера перевязать раны сира Барристана. — Он одарил короля долгим холодным взглядом. — Хорошо бы этот человек присутствовал здесь сегодня.</p><p class="p1">У Роберта хватило стыда покраснеть.</p><p class="p1">— Тогда дело обстояло иначе, — попытался он оправдаться. — Сир Барристан был рыцарем Королевской гвардии.</p><p class="p1">— А Дейенерис — всего лишь четырнадцатилетняя девочка. — Нед понимал, что выходит за пределы разумного, однако не мог сохранить молчание. — Роберт, прошу тебя, объясни мне, разве мы поднялись против Эйериса Таргариена не для того, чтобы положить конец детоубийствам?</p><p class="p1">— Чтобы положить конец Таргариенам! — буркнул король.</p><p class="p1">— Светлейший государь, я никогда не предполагал, что вы боитесь Рейегара. — Нед попытался изгнать презрение из голоса, но не сумел этого сделать. — Неужели возраст лишил вас мужества настолько, что вы трепещете перед тенью нерожденного ребенка?</p><p class="p1">Роберт побагровел.</p><p class="p1">— Ни слова больше! — отрезал он. — Ни слова больше, или ты забыл, кто здесь король?</p><p class="p1">— Нет, светлейший государь, — проговорил Нед. — А вы?</p><p class="p1">— Довольно! — взревел король. — Я устал от этого разговора. Давайте наконец кончать с этим, проклятие! Ну, каково ваше мнение?</p><p class="p1">— Ее надо убить, — объявил лорд Ренли.</p><p class="p1">— У нас нет выхода, — пробормотал Варис. — Как ни прискорбно, как ни прискорбно…</p><p class="p1">Сир Барристан Селми оторвал от стола взгляд бледно-голубых глаз и проговорил:</p><p class="p1">— Светлейший государь, честь велит нам встречать врага на поле боя, а не убивать его в чреве матери. Простите меня, но я вынужден поддержать мнение лорда Эддарда.</p><p class="p1">Великий мейстер Пицель прочистил глотку; на процесс этот, казалось, ушли минуты.</p><p class="p1">— Мой орден служит государству, а не правителю. Прежде я давал советы королю Эйерису столь же преданно, как и королю Роберту, а поэтому не испытываю вражды к его дочери. И все же я спрошу вас: неужели снова начнется война… сколько воинов погибнет и сколько городов сгорит? Скольких детей отнимут от матерей, чтобы насадить на копье? — Он погладил свою роскошную белую бороду… бесконечно скорбный, бесконечно усталый. — Разве мудрость и доброта не велят нам, чтобы Дейенерис Таргариен умерла, но тысячи и десятки тысяч остались жить?</p><p class="p1">— Именно доброта, — отозвался Варис. — Хорошо и справедливо сказано, великий мейстер. Как вы правы! Если боги по своей прихоти даруют Дейенерис Таргариен сына, королевство изойдет кровью.</p><p class="p1">Мизинец говорил последним. Когда Нед посмотрел на него, лорд Петир прикрыл ладонью зевок.</p><p class="p1">— Когда судьба приводит тебя в постель к уродливой женщине, лучше всего закрыть глаза и приступить к делу, — объявил он. — От ожидания она не станет красавицей. Делай ее, и все тут.</p><p class="p1">— Как это — делай? — спросил озадаченный сир Барристан.</p><p class="p1">— Сталью, — отвечал Мизинец.</p><p class="p1">Роберт повернул лицо к деснице.</p><p class="p1">— Вот и все, Нед. Вы с Селми остались в одиночестве по этому вопросу. Остается только решить, кто возьмется убить ее?</p><p class="p1">— Мормонт добивается королевского прощения, — напомнил ему лорд Ренли.</p><p class="p1">— Со всем рвением, — отвечал Варис, — но жизнь он любит еще больше. Сейчас принцесса находится возле Вейес Дотрак, где всякий, взявший в руки клинок, погибнет. Если я расскажу вам, как дотракийцы обойдутся с беднягой, который направит свое оружие против кхалиси, никто из присутствующих не сможет уснуть сегодня. — Он погладил напудренную щеку. — Тогда остается яд… слезы Лисс, скажем так. Кхал Дрого даже не догадается, что смерть ее не была естественной.</p><p class="p1">Сонные глаза мейстера Пицеля открылись. Он подозрительно покосился на евнуха.</p><p class="p1">— Но яд — оружие труса, — усомнился король.</p><p class="p1">С Неда было довольно.</p><p class="p1">— Вы посылаете наемников убить четырнадцатилетнюю девчонку и еще разговариваете о чести? — Он отодвинул назад кресло и встал. — Сделай это сам, Роберт. Человек, который выносит приговор, должен сам занести меч. Погляди в ее глаза, прежде чем убьешь. Посмотри на ее слезы, выслушай последние слова. По крайней мере хоть это ты должен сделать.</p><p class="p1">— Боги! — ругнулся король, не имея более сил сдержать свою ярость. — Ты до сих пор настаиваешь! — Потянувшись к бутылке вина, стоявшей возле его локтя, король обнаружил, что она пуста, и отбросил ее к стенке. — У меня кончилось и вино, и терпение. Довольно. Пусть будет сделано!</p><p class="p1">— Я не буду участвовать в убийстве, Роберт. Поступай как хочешь, но не проси, чтобы я приложил к этому собственную печать.</p><p class="p1">Какое-то мгновение Роберт словно не понимал, что говорит Нед. Подобное упорство не относилось к числу блюд, часто подающихся при дворе. Но понимание приходило, и лицо его преображалось. Глаза короля сузились, багрянец выполз на шею из-под бархатного воротника. В гневе он ткнул пальцем в сторону Неда.</p><p class="p1">— Вы — королевская десница, лорд Старк. И вы поступите так, как я прикажу вам, или я найду другого помощника, который исполнит это дело.</p><p class="p1">— Желаю вам успеха. — Нед отстегнул тяжелую застежку, скреплявшую складки его плаща, искусно сделанную серебряную руку, служившую знаком его сана, и положил на стол перед королем, скорбя о том человеке, который возложил на него эту тяжесть… о том, которого он любил. — Я считал тебя лучшим человеком, Роберт. Я думал, что мы выбрали благородного короля.</p><p class="p1">Лицо Роберта побагровело.</p><p class="p1">— Вон! — рявкнул он, задыхаясь от ярости. — Вон, проклятый, или я разделаюсь с тобой. Чего ты ждешь? Ступай, беги в свой Винтерфелл, только потрудись, чтобы я более не видел твоей физиономии, иначе, клянусь, я пристрою твою голову на пику!</p><p class="p1">Нед поклонился и, не ответив ни слова, повернулся, ощущая взгляд Роберта всем своим телом. Выходя из палаты совета, он услышал, как сразу возобновилось обсуждение за его спиной.</p><p class="p1">— На Браавосе существует общество так называемых Безликих Людей, — предложил великий мейстер Пицель.</p><p class="p1">— А вы представляете, во что обойдутся их услуги? — пожаловался Мизинец. — За половину той цены, которую они заломят, можно нанять целое войско обычных наемников, даже если речь будет идти об убийстве того купца. Не знаю уж, сколько они запросят за принцессу.</p><p class="p1">Дверь за спиной закрылась, голоса стихли. Возле палаты в длинном белом плаще и броне Королевской гвардии замер сир Борос Блаунт. Угольком глаза он быстро глянул на Неда, но вопросов задавать не стал.</p><p class="p1">День выдался тяжелый и мрачный; направившись через двор к башне Десницы, Нед ощутил собирающийся в воздухе дождь. Он был бы рад грозе. Дождь позволил бы ему почувствовать себя хоть чуточку более чистым. Добравшись до своего солярия, он призвал Вейона Пуля. Управляющий явился немедленно.</p><p class="p1">— Вы посылали за мной, милорд-десница?</p><p class="p1">— Больше не десница, — ответил Нед. — Мы с королем поссорились. Возвращаемся в Винтерфелл.</p><p class="p1">— Немедленно начинаю приготовления, милорд. Нам потребуется две недели, чтобы подготовиться к путешествию.</p><p class="p1">— У нас нет двух недель, возможно, даже дня. Король посулил надеть мою голову на пику. — Нед нахмурился. Он не верил, что король способен повредить ему… нет, только не Роберт. Сейчас он зол, но Нед исчез с его глаз, и ярость его остынет, как бывало всегда.</p><p class="p1">Всегда ли? И вдруг Нед с тревогой вспомнил о Рейегаре Таргариене, погибшем уже пятнадцать лет назад. А ведь Роберт по-прежнему ненавидит его! Неприятная мысль… потом нельзя забывать о том, что Кейтилин задержала карлика, Йорен известил его об этом прошлой ночью. Все скоро откроется, и это в тот момент, когда король в гневе на него… Конечно, Роберт ценит Тириона Ланнистера не дороже незрелой фиги. Но похищение заденет его гордость, а что предпримет королева — вообще невозможно сказать.</p><p class="p1">— Наверное, будет лучше, если я отправлюсь вперед, — сказал Нед Пулю. — Возьму дочерей и небольшую охрану. Остальные последуют за мной, когда соберутся. Извести Джори, но более никого, и ничего не предпринимай, пока мы с девчонками не уедем. Замок полон глаз и ушей, и я предпочту, чтобы о планах моих не знали.</p><p class="p1">— Как вам угодно, милорд.</p><p class="p1">Когда Пуль вышел, Эддард Старк направился к окну и задумался, сев возле него. Роберт явно не оставил ему никакого выбора. А вообще-то следовало бы поблагодарить короля. Здорово будет возвратиться в Винтерфелл. Жаль, что он приезжал сюда. Сыновья ждут его, быть может, у них с Кейтилин теперь родится еще один сын, ведь они еще достаточно молоды. Кроме того, он успел заметить, что уже тоскует о снеге, о глубокой ночной тишине Волчьего леса.</p><p class="p1">И все же мысль об отъезде сердила его. Сколько он не успел сделать! Теперь Роберт и его совет, полный льстецов и трусов, окончательно разорят королевство… хуже того, продадут его Ланнистерам в уплату за долги. Потом, он до сих пор не узнал правды о смерти Джона Аррена. Конечно, ему удалось отыскать несколько кусков головоломки, которые убедили его в том, что Джон действительно был убит, но все это пока только помет, оставленный хищником на лесной тропе. Нед еще не видел самого зверя, хотя ощущал его присутствие — затаившегося и опасного.</p><p class="p1">Он вдруг внезапно понял, что лучше вернуться в Винтерфелл морем. Нед не был моряком и предпочел бы Королевский тракт, но корабль мог сделать остановку на Драконьем Камне, там он сумеет переговорить со Станнисом Баратеоном. Пицель отослал за воды ворона с вежливым письмом за подписью Неда, предлагавшего лорду Станнису занять свое место в Малом совете. Ответа не было, и молчание лишь усугубило его подозрения. Лорд Станнис явно знает, почему погиб Джон Аррен. Нед в этом не сомневался. Истина, которую он разыскивал, вполне могла ожидать его в древней островной твердыне дома Таргариенов.</p><p class="p1">Ну а когда он узнает этот секрет, что тогда? От некоторых тайн лучше держаться подальше, иные опасно делить даже с теми, кого ты любишь и кому доверяешь. Нед извлек привезенный Кейтилин кинжал из ножен на поясе. Нож Беса? Зачем карлику понадобилась смерть Брана? Конечно, чтобы он молчал. Новый секрет или еще одна нить из той же паутины?</p><p class="p1">Замешан ли Роберт в этой истории? Не хочется верить, но ведь прежде он не думал, что Роберт способен подослать убийцу к беременной женщине. Кейтилин пыталась предостеречь его. Ты знал человека, сказала она, а король тебе не знаком. Чем скорее ему удастся оставить Королевскую Гавань, тем лучше. Если завтра утром какой-нибудь из кораблей отправится на север, следует оказаться на нем.</p><p class="p1">Вызвав Вейона Пуля, Нед послал его к причалам, чтобы все разузнать без шума, но быстро.</p><p class="p1">— Найди мне надежный корабль с искусным капитаном, — велел он управителю. — Меня не интересует ни размер кают, ни качество, ни убранство. Судно должно быть лишь быстроходным и надежным. Я хочу отплыть немедленно.</p><p class="p1">Пуль только что получил распоряжение, но Томард уже объявлял гостя:</p><p class="p1">— Лорд Бейлиш желает видеть вас, милорд.</p><p class="p1">Нед хотел уже отказаться от этой встречи, но передумал. Он еще не освободился и обязан участвовать в их играх.</p><p class="p1">— Проводите его ко мне.</p><p class="p1">Лорд Петир вступил в солярий так, словно бы утром ничего не стряслось… разрезной бархатный дублет серебристо-молочного цвета, серый шелковый плащ подбит мехом черной лисы, на лице обычная насмешливая улыбка.</p><p class="p1">Нед холодно приветствовал его.</p><p class="p1">— Могу ли я узнать причину вашего визита, лорд Бейлиш?</p><p class="p1">— Я не задержу вас: к обеду меня ждет леди Танда. Будет пирог с ягнятиной и жареный молочный поросенок. Достопочтенная леди мечтает женить меня на своей младшей дочери, поэтому стол ее всегда восхитителен. По правде говоря, я скорее женюсь на свинье, но не говорите ей этого. Я обожаю пирог с ягнятиной.</p><p class="p1">— Не смею задерживать вас, милорд, — отвечал Нед с ледяным пренебрежением. — В настоящий момент мне трудно представить себе человека, в чьем обществе я нуждался бы меньше, чем в вашем.</p><p class="p1">— Вы не правы. Хорошенько подумав, вы, бесспорно, найдете еще несколько имен. Скажем, Вариса, или Серсеи, или самого Роберта. Светлейший буквально зашелся в гневе! Он не сразу успокоился и после того, как вы оставили нас сегодня утром. Насколько я помню, слова «наглость» и «неблагодарность» довольно часто встречались в его речи.</p><p class="p1">Нед не почтил его ответом. Он не стал предлагать своему гостю сесть, но Мизинец уселся без приглашения.</p><p class="p1">— После того как вы бурей вылетели из зала, я был вынужден уговорить их не обращаться к услугам Безликих Людей, — промолвил он непринужденно. — Просто Варис распространит слух, что мы сделаем лордом всякого, кто покончит с девчонкой.</p><p class="p1">Нед скривился.</p><p class="p1">— Итак, теперь мы даруем титулы даже убийцам.</p><p class="p1">Мизинец пожал плечами:</p><p class="p1">— Титул — вещь дешевая. Безликие Люди обойдутся дороже. И этим я, по правде говоря, более услужил Дейенерис, чем вы своими речами о чести. Пусть какой-то наемник попытается убить ее, возмечтав о титуле. Скорее всего ему ничего не удастся, и дотракийцы долго еще будут внимательно охранять ее. Если же мы подошлем к ней одного из Безликих Людей, можно заранее заказывать похороны.</p><p class="p1">Нед нахмурился:</p><p class="p1">— Заседая в совете, вы говорили об уродливых женщинах и стальных поцелуях, а теперь пытаетесь убедить меня в том, что попытались защитить девушку? За какого же дурака вы меня принимаете?</p><p class="p1">— Просто за колоссального, — со смехом отвечал Мизинец.</p><p class="p1">— Вас всегда настолько развлекает мысль об убийстве, лорд Бейлиш?</p><p class="p1">— Лорд Старк, меня развлекает не убийство, а вы. Вы правите, как человек, танцующий на подтаявшем льду. Смею сказать, всплеск будет весьма впечатляющим. И первые трещины побежали сегодня утром.</p><p class="p1">— Первые и последние, — резко ответил Нед. — С меня довольно.</p><p class="p1">— Когда вы собираетесь возвратиться в Винтерфелл, милорд?</p><p class="p1">— Как только смогу. А какое вам дело до этого?</p><p class="p1">— Никакого… но если вы не оставите нас до завтрашнего вечера, я охотно отведу вас в тот бордель, который ваш Джори так безуспешно искал, — Мизинец улыбнулся, — и ничего не скажу леди Кейтилин.</p></span>
