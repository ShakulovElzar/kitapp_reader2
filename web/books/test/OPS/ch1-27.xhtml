<p class="p">Бран</p>
</div><p class="p1">Внизу во дворе Рикон бегал с волками.</p><p class="p1">Бран следил за ним от окна. Куда ни поворачивал младший брат, первым там оказывался Серый Ветер, забегавший вперед, преграждая ему дорогу. Тут Рикон замечал его, разражался восторженным визгом и несся в противоположную сторону. Лохматый Песик бегал за ним, кружился и огрызался, только когда другие волки подбегали слишком близко. Шерсть его потемнела, он сделался черным, а в глазах его загорелся зеленый огонь. Бранов Лето стал серебристо-дымчатым, и желто-золотые глаза его замечали все, что было нужно. Лето был ниже ростом, чем Серый Ветер, и вел себя осторожнее. Бран считал его самым смышленым среди всего помета. До него доносилось пыхтение и смех братца Рикона, носившегося по утоптанной земле на неокрепших еще детских ножках.</p><p class="p1">Глаза Брана защипало. Ему хотелось спуститься вниз, смеяться и бегать. Разгневавшись на себя, Бран стер слезы, прежде чем они успели пролиться. Пришел и ушел восьмой день его именин. Теперь он стал большим, почти мужчиной, и плакать больше не собирался.</p><p class="p1">— Это была только ложь, — через силу сказал он, вспоминая ворона из своего сна. — Я не могу летать. Я не смогу даже бегать.</p><p class="p1">— Вороны всегда лгут, — согласилась старая Нэн, сидевшая в кресле со своим вязаньем. — Я знаю сказку о вороне.</p><p class="p1">— Мне не нужны никакие сказки, — возмутился Бран. Прежде он любил старую Нэн и ее истории. Но не сейчас. Сейчас все стало иначе. Она сидела с ним целыми днями, приглядывала за ним и убирала, старалась, чтобы он не чувствовал одиночества, но так было только хуже.</p><p class="p1">— Я ненавижу твои глупые россказни!</p><p class="p1">Старуха улыбнулась ему беззубым ртом.</p><p class="p1">— Мои россказни? Нет, мой маленький лорд, они не мои. Сказки эти существовали до меня, останутся и после моей смерти…</p><p class="p1">Уродливая старуха, презрительно подумал Бран, высохшая, морщинистая, почти слепая, у нее едва хватает сил, чтобы подняться по лестнице. А что за вид: редкие пряди белых волос едва покрывают пятнистый розовый череп! Никто не знал, сколько ей на самом деле лет, но отец утверждал, что Нэн звали старой, когда еще он был мальчишкой. Безусловно, в Винтерфелле не найти человека старше ее. А может быть, и во всех Семи Королевствах. Нэн взяли в замок к Брандону Старку в то время, когда его мать умерла при родах. Взяли к одному из малышей, скорее всего к дяде лорда Рикарда: старая Нэн по-разному рассказывала о себе. Но во всех вариантах ее истории маленький мальчик умер в три года от летней простуды, и старая Нэн осталась в Винтерфелле со своими собственными детьми. Оба ее сына погибли на войне, в которой король Роберт завоевал престол; внук был убит на стенах Пайка во время мятежа Беелона Грейджоя. Дочери давным-давно повыходили замуж, перебрались из замка и умерли от старости. Из потомков Нэн с ней оставался лишь Ходор, простодушный гигант, работавший в конюшне, а старая Нэн жила и жила, шила, вязала и рассказывала сказки.</p><p class="p1">— Мне безразлично, чьи это сказки, — ответил ей Бран. — Я ненавижу их. — Он не нуждался в сказках, как и в старухе Нэн. Он хотел, чтобы рядом с ним были мать и отец. Он хотел бегать вместе со всеми, и чтобы Лето скакал возле него. Ему хотелось залезть на разбитую башню и накормить зерном ворон. Он мечтал сесть на своего пони и проехаться рядом с братьями. Он хотел снова стать таким, как прежде.</p><p class="p1">— Я знаю повесть о мальчике, который ненавидел сказки, — проговорила старуха Нэн с дурацкой улыбочкой. Спицы ее шевелились — цок и цок, цок и цок, — и Бран был готов уже закричать на нее.</p><p class="p1">Он знал, что прежнее не вернется. Ворон просто обманул его, он заманил его летать, но проснулся Бран искалеченным, и мир изменился. Все его бросили, мать и отец, сестры и даже незаконнорожденный брат Джон. Отец обещал, что он поедет на настоящем коне в Королевскую Гавань, но они уехали без него. Мейстер Лювин послал одну птицу с посланием к лорду Эддарду, другую к матери, третью к Джону, но ответов не было.</p><p class="p1">От Винтерфелла до Королевской Гавани много миль, много и ястребов, так что весть могла и не достичь их. И все же Брану казалось, что все они умерли, пока он спал… или же умер он сам, а они забыли его. Джори, сира Родрика и Вейона Пуля тоже не было в замке, как и Халлена, Харвина, Толстого Тома и с ними четверти гвардии.</p><p class="p1">Остались лишь Робб и малыш Рикон, но Робб стал другим.</p><p class="p1">Он превратился в лорда Робба или, во всяком случае, все время пытался сделать это. На боку его висел настоящий меч, брат никогда более не улыбался. Дни его уходили на занятия с войском и тренировки во владении мечом; Робб звенел сталью во дворе, а Бран уныло следил за ним из окна. Вечерами Робб запирался с мейстером Лювином, разговаривал с ним или занимался книгами. Иногда он выезжал с Халлисом Молленом и отсутствовал целыми днями, находясь в поездке по далеким крепостям. Когда его не было больше дня, Рикон начинал плакать и спрашивать Брана, вернется ли наконец Робб. Но когда он возвращался домой в Винтерфелл, у лорда Робба находилось больше времени для Халлиса Моллена и Теона Грейджоя, чем для своих братьев.</p><p class="p1">— Я могу рассказать тебе о Брандоне-Строителе, — сказала старая Нэн. — Ты всегда любил эту повесть.</p><p class="p1">Тысячи и тысячи лет назад Брандон-Строитель соорудил Винтерфелл и — как говорили некоторые — Стену. Бран знал всю повесть, но она никогда не была его любимой. Наверное, ее любил кто-нибудь из других Брандонов. Иногда Нэн говорила с ним так, словно он был тем Брандоном, младенцем, которого она воспитывала столько лет назад, а иногда путала с дядей Брандоном, убитым Безумным королем еще до рождения Брана. Нэн прожила столько лет, сказала ему однажды мать, что все Брандоны Старки смешались в ее голове в одно лицо.</p><p class="p1">— Я не люблю эту повесть, — сказал он. — Я люблю страшные. — Услыхав какое-то движение снаружи, Бран повернулся к окну. Рикон бежал по двору к сторожевой башне, волки следовали за ним. Но окно его смотрело не в ту сторону, и Бран не видел, что происходит внизу. С разочарованием он ударил кулаком по ноге и не ощутил ничего.</p><p class="p1">— О мое сладкое летнее дитя, — негромко проговорила старая Нэн. — Что ты знаешь о страхе? Страх бывает зимой, мой маленький лорд, когда снег заносит стены на сотню футов, а ледяной ветер с воем вырывается с севера. Страшно бывает долгими ночами, когда солнце прячет свой лик на годы и годы, и маленькие дети рождаются, живут и умирают во тьме, а лютоволки тощают и голодают, и Белые Ходоки расхаживают по лесам.</p><p class="p1">— Ты хочешь сказать, Иные? — спросил Бран.</p><p class="p1">— Иные, — согласилась старая Нэн. — Тысячи и тысячи лет назад пришла зима, холодная, жестокая, бесконечная, какой не помнили люди. А потом пришла ночь, затянувшаяся на целое поколение; короли тряслись от холода и умирали в своих замках, как простые свинопасы в хижинах. Женщины душили детей, чтобы не видеть, как они умирают, плакали и ощущали, как слезы замерзают на их щеках. — Голос ее умолк, спицы тоже. Нэн поглядела на Брана выцветшими мутными глазами и спросила: — Итак, дитя, ты хочешь услышать именно такую повесть?</p><p class="p1">— Ну, — нерешительно отвечал Бран. — Да, только…</p><p class="p1">Старая Нэн кивнула, и спицы зацокали.</p><p class="p1">— В этой тьме впервые появились Иные. Холодные мертвые твари, они ненавидели железо, огонь и солнечные лучи… любое создание, в жилах которого течет живая кровь. Они опустошали крепости, города и королевства, убивали героев, за их бледными конями оставались разбитые армии. Мечи мужчин не могли остановить их, даже девы и младенцы не вызывали у них жалости. Они гнали дев по замерзшим лесам и кормили своих мертвых слуг плотью детей человека.</p><p class="p1">Голос Нэн сделался очень тихим, она уже почти шептала, и Бран невольно пригнулся вперед, чтобы слышать.</p><p class="p1">— Это было во дни перед приходом андалов, задолго до бегства женщин через Узкое море из городов Ройна; сотней королевств тех времен правили Первые Люди, отобравшие эти земли у Детей Леса. Но там и здесь в обширных лесах, в деревянных городах и полых холмах жили последние Дети Леса, и лики на деревьях несли стражу. Холод и смерть полнили землю, и последний герой решил отыскать Детей, в надежде на то, что их древняя магия поможет отвоевать то, что потеряли армии мужей. Он отправился в мертвую землю с мечом в руке, взяв с собой пса и дюжину спутников. Он искал много лет и уже начал терять надежду, не умея отыскать Детей в их тайных городах посреди леса. Один за другим умирали его друзья, пал его конь, наконец сдохла даже собака, а меч промерз настолько, что клинок его переломился, когда он попытался воспользоваться им. Тогда Иные почуяли запах его горячей крови и безмолвно отправились в погоню, выслав по его следу стаи бледных пауков ростом с пса.</p><p class="p1">Дверь отворилась, сердце Брана подпрыгнуло в груди от неожиданного испуга, но это был лишь мейстер Лювин, позади него на лестнице маячил Ходор.</p><p class="p1">— Ходор! — пробурчал конюх, как было в его обычае, и широко улыбнулся.</p><p class="p1">Мейстер Лювин не улыбался.</p><p class="p1">— У нас гости, — объявил он. — Бран, твое присутствие необходимо.</p><p class="p1">— А я как раз слушаю повесть, — пожаловался Бран.</p><p class="p1">— Сказки подождут, мой маленький лорд; как только ты вернешься сюда, я продолжу, — сказала старая Нэн. — Гости не столь терпеливы, иногда они прибывают с собственными рассказами.</p><p class="p1">— А кто приехал? — спросил Бран у мейстера Лювина.</p><p class="p1">— Тирион Ланнистер, с ним люди Ночного Дозора со словом от твоего брата Джона. Сейчас с ними Робб. Ходор, поможешь ли ты Брану спуститься в зал?</p><p class="p1">— Ходор! — с радостью согласился конюх. Он пригнул огромную лохматую голову, чтобы пройти в дверь. В Ходоре было почти семь футов роста; трудно было поверить, что в жилах его течет та же самая кровь, что у старухи Нэн. Бран подумал: неужели и этот человек съежится, как и его прапрабабушка, когда станет старым? Впрочем, едва ли… проживи этот великан хоть тысячу лет.</p><p class="p1">Ходор поднял Брана буквально как перышко и прижал мальчика к могучей груди. От него сладко пахло конем, и запах этот казался приятным Брану. Могучие, заросшие коричневым волосом руки бугрились мышцами.</p><p class="p1">— Ходор, — проговорил он снова. Теон Грейджой когда-то сказал, что многого, конечно, Ходор не знает, но в том, что ему известно собственное имя, сомневаться не приходится. Когда Бран рассказал это старой Нэн, она раскудахталась, словно курица, и объяснила, что по-настоящему Ходора зовут Уолдер. Никто не знает, откуда взялся этот самый Ходор, сказала она, но когда Уолдер стал так говорить, все начали звать его этим именем.</p><p class="p1">Они оставили старую Нэн в башне вместе с ее спицами и воспоминаниями. Спускаясь с Браном вниз по ступеням, Ходор фальшиво напевал; мейстер Лювин следовал за ними торопливой походкой, стараясь приноровиться к длинным шагам конюха.</p><p class="p1">Робб сидел на высоком престоле отца в броне, кольчуге и вареной коже, с суровым выражением лица, подобающим Роббу-лорду. Теон Грейджой и Халлес Моллен стояли за ним. Дюжина стражников выстроилась вдоль серых каменных стен под узкими высокими окнами. В центре зала ожидал карлик со своими слугами и четырьмя одетыми в черное незнакомцами из Ночного Дозора. Бран ощутил напряженность, едва Ходор внес его в зал.</p><p class="p1">— Любой, кто служит в Ночном Дозоре, вправе рассчитывать на привет и долгое пребывание в Винтерфелле, — говорил Робб голосом Робба-лорда. Меч его лежал на коленях, нагую сталь мог видеть весь мир. Даже Бран понимал, что значит, когда гостя приветствуют нагой сталью.</p><p class="p1">— Любой, кто служит в Ночном Дозоре, — отвечал карлик, — но только не я, я правильно понял тебя, парень?</p><p class="p1">Робб встал и указал на карлика мечом.</p><p class="p1">— Пока здесь нет отца и матери, правлю я, ты понял, Ланнистер? Я тебе не мальчишка.</p><p class="p1">— Раз ты лорд, научись говорить вежливо, как подобает владыке, — отвечал коротышка, не обращая внимания на оказавшееся перед лицом острие. — Похоже, все манеры твоего отца достались твоему незаконнорожденному брату.</p><p class="p1">— Джон, — выдохнул Бран на руках Ходора.</p><p class="p1">Карлик обернулся к нему:</p><p class="p1">— Значит, мальчик действительно остался в живых, а я не мог в это поверить. Вас, Старков, трудно убить.</p><p class="p1">— Вам, Ланнистерам, следовало бы это запомнить, — проговорил Робб, опуская меч. — Ходор, принеси сюда моего брата.</p><p class="p1">— Ходор, — проговорил Ходор, с улыбкой направляясь вперед. Он опустил Брана на высокий престол Старков, на котором владыки Винтерфелла восседали с тех дней, когда они еще звали себя королями Севера. Холодный камень сиденья был отполирован несчетными прикосновениями, резные головы лютоволков скалились с концов массивных подлокотников. Бран ухватился за них, беспомощные ноги болтались внизу. В огромном сиденье он казался себе ребенком.</p><p class="p1">Робб опустил руку на его плечо.</p><p class="p1">— Ты сказал, что у тебя есть дело к Брану. Вот он перед тобой, Ланнистер.</p><p class="p1">Бран ощутил на себе взгляд Тириона. Черный глаз и зеленый глядели на него, изучая и взвешивая.</p><p class="p1">— Мне сказали, что ты прекрасно лазал, Бран, — произнес наконец человечек. — Скажи, как вышло, что в тот день ты упал?</p><p class="p1">— Я не падал… никогда! — настаивал Бран. Он ведь никогда не падал, никогда, никогда, никогда.</p><p class="p1">— Дитя не помнит ничего, что случилось в день падения; ни как он падал, ни как лез по стене, — мягко проговорил мейстер Лювин.</p><p class="p1">— Интересно, — сказал Тирион Ланнистер.</p><p class="p1">— Мой брат здесь не для того, чтобы отвечать на твои вопросы, Ланнистер, — резко возразил Робб. — Делай свое дело и отправляйся в путь.</p><p class="p1">— У меня для тебя подарок, — улыбнулся карлик Брану. — Хотелось бы тебе ездить на коне, мальчик?</p><p class="p1">Мейстер Лювин шагнул вперед.</p><p class="p1">— Милорд, ребенок не способен пользоваться ногами, он не сможет усидеть на лошади.</p><p class="p1">— Ерунда, — возразил Ланнистер. — На хорошем коне и в хорошем седле усидит даже калека.</p><p class="p1">Слово это ножом пронзило сердце Брана. Он ощутил, как прихлынули к глазам непрошеные слезы.</p><p class="p1">— Я не калека!</p><p class="p1">— Тогда я не карлик, — ответил Тирион, скривив рот. — Мой отец с радостью услышит это. — Грейджой расхохотался.</p><p class="p1">— Какую лошадь и седло ты предлагаешь? — спросил мейстер Лювин.</p><p class="p1">— Просто нужно подыскать умного конька, — отвечал Ланнистер. — Мальчик не может пользоваться ногами, чтобы управлять животным, поэтому следует приспособить лошадь к всаднику, приучить ее повиноваться поводьям и голосу. Я бы начал с необъезженной годовалой лошади, чтобы ее не переучивать. — Тирион достал из-за пояса свиток. — Передайте это вашему седельнику. Он сделает все нужное.</p><p class="p1">Любопытный, как крохотная серая белка, мейстер Лювин взял бумагу из рук карлика. Развернув листок, он пригляделся.</p><p class="p1">— Понимаю. Великолепный рисунок, милорд. Да, это получится. Мне следовало бы самому придумать такое седло.</p><p class="p1">— Мне это было проще сделать, мейстер. Это седло не столь уж отличается от моего собственного.</p><p class="p1">— Значит, я действительно сумею ездить верхом? — спросил Бран. Он хотел поверить, но боялся. Быть может, это еще одна ложь. И ворон обещал, что он сумеет летать.</p><p class="p1">— Сумеешь, — сказал ему карлик. — Клянусь тебе, мальчик, на конской спине ты будешь таким же высоким, как и все они.</p><p class="p1">Робб Старк казался озадаченным.</p><p class="p1">— Это какая-то ловушка, Ланнистер? Зачем тебе Бран? С чего ты вдруг решил помочь ему?</p><p class="p1">— Об этом попросил твой брат, а сердце мое полно нежности к калекам, бастардам и сломанным вещам. — Тирион Ланнистер приложил руку к сердцу и ухмыльнулся.</p><p class="p1">Дверь во двор распахнулась, и солнце ударило в зал. Следуя за запыхавшимся Риконом, вошли лютоволки. Широко раскрыв глаза, мальчик остановился у двери, но волки направились дальше. Они сразу увидели Ланнистера или, быть может, уловили его запах.</p><p class="p1">Первым заворчал Лето, Серый Ветер последовал его примеру и они подошли к человечку, остановившись по обе стороны от него.</p><p class="p1">— Волкам не нравится твой запах, Ланнистер, — прокомментировал Теон Грейджой.</p><p class="p1">— Значит, пора и откланяться, — сказал Тирион. Он отступил на шаг назад… и сзади объявился ощерившийся Лохматый Песик. Ланнистер отступил, и Лето бросился на него с другой стороны. Тот пошатнулся на кривых ногах, но Серый Ветер вцепился в рукав, оторвав от него полоску ткани.</p><p class="p1">— Нельзя! — выкрикнул Бран с высокого престола, когда люди Ланнистера потянулись к стали. — Лето, сюда. Лето, ко мне!</p><p class="p1">Услышав голос, лютоволк посмотрел сначала на Брана, потом на Ланнистера. Зверь отступил от человечка и опустился возле болтающихся ног Брана.</p><p class="p1">Робб затаил дыхание. А потом вздохнул и позвал:</p><p class="p1">— Серый Ветер! — и лютоволк без звука метнулся к хозяину. Теперь лишь Лохматый Песик ворчал на карлика, глаза его светились зеленым огнем.</p><p class="p1">— Рикон, отзови его! — крикнул Бран своему маленькому брату. Опомнившись, тот закричал:</p><p class="p1">— Домой, Лохматик, домой. — Волк последний раз рыкнул на Ланнистера и направился к Рикону, сразу обнявшему его за шею.</p><p class="p1">Тирион Ланнистер развязал шарф, прикоснулся ко лбу и проговорил ровным голосом:</p><p class="p1">— Как интересно…</p><p class="p1">— Все ли в порядке с вами, милорд? — спросил один из его людей с мечом в руке, с опаской поглядев в сторону лютоволков.</p><p class="p1">— Рукав мой порван, и штаны вдруг подмокли, но, если не считать ущерба моему достоинству, все в порядке.</p><p class="p1">Даже Робб казался потрясенным.</p><p class="p1">— Волки… не знаю, почему они так поступили…</p><p class="p1">— Должно быть, приняли меня за обед. — Ланнистер скованно поклонился Брану. — Благодарю вас за то, что вы их отозвали, молодой сир. Уверяю вас, звери, безусловно, сочли бы меня непригодным для еды. Ну а теперь я действительно отправляюсь.</p><p class="p1">— Одно только мгновение, милорд, — проговорил мейстер Лювин. Он подошел к Роббу, и они пригнули головы шепчась. Бран попытался услышать, что они говорят, но голоса были слишком тихи.</p><p class="p1">Робб Старк наконец опустил меч в ножны.</p><p class="p1">— Я… похоже, я… поторопился, — сказал он. — Вы были добры к Брану, и… — Робб с усилием овладел собой. — Словом, Винтерфелл гостеприимно примет вас, если вы хотите этого, Ланнистер.</p><p class="p1">— Избавь меня от этой лживой любезности, мальчик. Ты не любишь меня и не хочешь, чтобы я находился здесь. Я видел гостиницу за вашими стенами, в Зимнем городе. Я найду там постель, и каждый из нас будет спокойнее спать. За несколько медяков я даже сумею отыскать пригожую девку, которая согреет мне простыни. — Он обратился к одному из Черных Братьев, к старику с перепутанной бородой: — Йорен, с рассветом мы едем на юг. Ты найдешь меня на дороге.</p><p class="p1">И Тирион направился к выходу, переваливаясь по залу на коротких ногах, мимо Рикона и всех остальных. За ним последовали его люди.</p><p class="p1">Четверо из Ночного Дозора остались. Робб с неуверенностью повернулся к ним.</p><p class="p1">— Я приготовил вам комнаты, и вы найдете достаточно горячей воды, чтобы смыть дорожную пыль. Надеюсь, вы почтите нас своим присутствием за столом. — Слова звучали неловко, даже Бран это заметил: речь свою брат заучил и говорил не от сердца, но тем не менее Черные Братья поблагодарили его.</p><p class="p1">Лето проводил по ступеням башни Ходора, отнесшего Брана в постель. Старая Нэн спала в своем кресле. Ходор, сказав «Ходор», подхватил свою прапрабабушку и унес ее, негромко похрапывающую, в соседнюю комнату, а Бран остался лежать размышляя. Робб обещал устроить пир вместе с гостями Ночного Дозора в Великом зале.</p><p class="p1">— Лето, — позвал он. Волк прыгнул в постель. Бран крепко обнял его и ощутил горячее дыхание на своей щеке. — Теперь я смогу ездить верхом, — шепнул он своему другу. — И мы с тобой снова поедем в лес на охоту, как раньше. — А потом Бран уснул.</p><p class="p1">Во сне своем он лез, карабкался к вершине древней, лишенной окон башни, пальцы его с трудом находили зацепку между почерневшими кирпичами, ноги пытались найти опору. Все выше и выше он забирался, уходя сквозь облака в ночное небо, но башня все еще поднималась над ним. Он остановился, чтобы поглядеть вниз, но голова его закружилась, и Бран ощутил, как скользят пальцы. Бран закричал и всеми силами попытался уцепиться за камень. Земля была в тысяче миль внизу, а он не мог лететь. Не мог! Бран дождался, пока сердце перестало колотиться, и, отдышавшись, вновь полез вверх. Только назад пути не было. Высоко над ним на фоне огромной бледной луны уже вырисовывались очертания горгулий. Руки его болели и ныли, но Бран не смел передохнуть. Он заставил себя лезть быстрее. Горгульи следили за его подъемом. Глаза их горели красным жарким огнем, словно уголья в жаровне. Возможно, когда-то они были львами, но теперь лики их исказились. Бран слышал, как они перешептываются между собой негромкими, жуткими каменными голосами. Не слушай, сказал он себе. Слушать нельзя, и пока ты не слышишь их, можно не беспокоиться. Но тут горгульи отделились от камня, поползли вниз по стене башни к месту, где повис Бран, и он понял, что о безопасности нечего и думать.</p><p class="p1">— Я не слышал, — плакал он, а они все приближались. — Я не слышал, не слышал.</p><p class="p1">Он проснулся в слезах, затерявшись во тьме, и сразу увидел над собой огромную тень.</p><p class="p1">— Я не слышал, — прошептал Бран, сотрясаясь от страха, но тень произнесла «Ходор» и зажгла свечу возле его постели. Бран вздохнул с облегчением. Ходор отер пот с его лица влажной теплой тканью, переодел ловкими мягкими руками. Потом, когда настало время, он отнес мальчика в Великий зал, где длинный стол был разложен на козлах возле очага. Место лорда во главе стола пустовало, по правую руку сидел Робб, а Бран напротив него. В тот вечер они ели молочного поросенка, пирог с голубями и репу, прожаренную в масле, на сладкое повар обещал соты с медом. Лето хватал объедки из руки, а Серый Ветер и Лохматый Песик ссорились из-за кости в углу. Псы Винтерфелла теперь не смели приближаться к дворцовому залу. Сперва Бран находил подобную застенчивость странной, но теперь уже начал привыкать к ней.</p><p class="p1">Йорен был старшим среди черной братии, поэтому управляющий посадил его между Роббом и мейстером Лювином. От старика пахло кислятиной, похоже, он давно не мылся. Он рвал мясо зубами, разгрызал кости, чтобы высосать мозг. Услыхав имя Джона Сноу, он пожал плечами и буркнул:</p><p class="p1">— Погибель сира Аллисера, — и двое из его спутников зашлись смехом, причин которого Бран не понимал, но когда Робб спросил о дяде Бенджене, черная братия зловеще примолкла.</p><p class="p1">— Что такое? — спросил Бран.</p><p class="p1">Йорен вытер свои пальцы о жилет.</p><p class="p1">— Новости скверные, милорды, и жестоко платить ими за вашу трапезу и кров, но если человек задает вопрос, он должен получить ответ. Старк исчез.</p><p class="p1">Другой из Черных сказал:</p><p class="p1">— Старый Медведь отправил его разыскивать Уэймара Ройса, но он так и не вернулся, милорд.</p><p class="p1">— Старк слишком долго отсутствует, — сказал Йорен. — Он наверняка погиб.</p><p class="p1">— Мой дядя жив, — громко сказал Робб Старк, в его голосе послышался гнев. Он поднялся со скамьи и положил руку на рукоять меча. — Вы слышите меня? Мой дядя жив! — Голос его прозвенел между каменных стен, и Бран неожиданно испугался.</p><p class="p1">Старый, пропахший кислятиной Йорен, не смущаясь, поглядел на Робба.</p><p class="p1">— Как вам угодно, милорд, — проговорил он, обсасывая кусок мяса.</p><p class="p1">Самый молодой из черной братии неуютно поежился на своем месте.</p><p class="p1">— На Стене нет человека, который знал бы Зачарованный лес лучше Бенджена Старка. Он отыщет дорогу назад.</p><p class="p1">— Возможно, — отвечал Йорен. — Возможно, отыщет, а может быть, и нет. В этот лес, случалось, уходили весьма сведущие люди, но не возвращались обратно.</p><p class="p1">Бран вспомнил повесть старой Нэн об Иных и последнем герое, которого гнали сквозь ледяные леса мертвяки и пауки ростом с собаку. На миг он испугался, но наконец вспомнил, чем закончилась история.</p><p class="p1">— Дети помогут ему, — выпалил он. — Дети Леса!</p><p class="p1">Теон Грейджой расхохотался, а мейстер Лювин ответил:</p><p class="p1">— Бран, Дети Леса мертвы, они исчезли тысячелетие назад. От них остались только лики на деревьях.</p><p class="p1">— Здесь внизу<a href="ch2.xhtml#id2" class="a">[8]</a> ваши слова, может, и верны, мейстер, — сказал Йорен. — Но наверху, за Стеной, кто может быть в чем-либо уверен? Наверху человек не всегда может сказать, что живет, а что уже умерло…</p><p class="p1">Той ночью, после того как тарелки были очищены, Робб сам унес Брана в постель. Серый Ветер шел первым, Лето последним. Робб был силен для своих лет, и хотя Бран весил не более чем узел с бельем, но на крутой и темной лестнице Робб успел запыхаться.</p><p class="p1">Он опустил Брана в постель, укрыл его одеялом и погасил свечу. Какое-то время Робб посидел возле него во тьме. Бран хотел заговорить с ним, но не знал, что сказать.</p><p class="p1">— Обещаю, мы подыщем для тебя лошадь, — шепнул наконец Робб.</p><p class="p1">— А они когда-нибудь вернутся? — спросил Бран.</p><p class="p1">— Да, — ответил Робб с такой надеждой в голосе, что Бран понял: это голос его брата, а не лорда Робба. — Мать скоро вернется домой. Быть может, мы сумеем верхом встретить ее. Правда, она удивится, увидев тебя на лошади. — Даже в темной комнате Бран ощущал улыбку брата. — Ну а потом мы сможем съездить на север, поглядеть на Стену. Мы даже не предупредим Джона о нашем приезде, просто нагрянем к нему однажды вдвоем. Вот будет приключение!</p><p class="p1">— Приключение, — повторил Бран с завистью. Он услышал короткое рыдание брата. В комнате было так темно, что он не мог видеть слез на лице Робба, и потому просто протянул руку. Пальцы их соединились.</p></span>
