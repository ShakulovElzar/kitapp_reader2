<p class="p">Эддард</p>
</div><p class="p1">Солома на полу воняла мочой. Окна не было, постели тоже, даже ведра. Он запомнил стены из бледного камня, стены, разукрашенные пятнами селитры, четырехфутовую щербатую серую дверь, окованную железом, он успел разглядеть это, когда его бросили в камеру. А потом дверь захлопнулась и Нед более ничего не видел. Темнота здесь была абсолютной. Он словно ослеп. Или умер, похороненный вместе с его королем.</p><p class="p1">— Ах, Роберт, — пробормотал Нед, ощупывая рукой холодный камень. Нога его пульсировала от каждого движения. Он вспомнил шутку, над которой они с королем посмеялись в подземелье Винтерфелла под холодным каменным взглядом Королей Зимы. «Король ест, — проговорил Роберт, — а десница подтирает задницу». Как он хохотал! Но все это звучит по-другому: когда король умирает, подумал Нед Старк, хоронят и десницу.</p><p class="p1">Темница под Красным замком, в таких глубинах, которых он просто не мог представить. Нед вспомнил старую повесть о Мейегоре Жестоком, казнившем всех каменщиков, трудившихся в замке, чтобы они никогда не открыли его секретов.</p><p class="p1">Он проклял их всех: Мизинца, Яноса Слинта вместе с его золотыми плащами, королеву, Цареубийцу, Пицеля, Вариса, сира Барристана, даже лорда Ренли, родного брата Роберта, убежавшего именно тогда, когда он более всего был ему нужен. И все же — в конце концов — он обратился к себе.</p><p class="p1">— Дурак, — кричал Нед во тьму, — и трижды дурак, проклятый слепец!</p><p class="p1">Лицо Серсеи Ланнистер словно парило перед ним во тьме. Волосы ее лучились солнечным светом, но улыбка была насмешливой.</p><p class="p1">— Тот, кто берется играть в престолы, или погибает, или побеждает, — прошептала она.</p><p class="p1">Нед вступил в игру и проиграл, а люди его заплатили за проявленное им безрассудство своей жизнью. Думая о дочерях, он охотно зарыдал бы, но слезы не шли. Он все равно оставался Старком из Винтерфелла, горе и ярость заледенели в глубине его души.</p><p class="p1">Когда он не шевелился, нога не так уж болела, поэтому Нед старался лежать неподвижно. Сколько минуло времени, сказать он не мог. Ни луна, ни солнце не заглядывали сюда, чтобы он мог отметить на стене дни. Открывал Нед глаза или нет, разницы не было. Он спал, просыпался и засыпал снова. Трудно сказать, что было мучительнее — спать или бодрствовать. Когда он засыпал, приходили сны — мрачные и тревожные, полные крови и вероломства. Ну а когда бодрствовал, то, не имея другого дела, покорялся думам, которые были еще хуже кошмаров. Воспоминания о Кет наполняли солому терновыми иглами. Интересно бы узнать, где она и что делает. Нед не надеялся, что еще раз увидит ее.</p><p class="p1">Часы превращались в дни, так по крайней мере ему казалось. Нед чувствовал тупую боль в раздробленной ноге, чесотку под гипсом. Прикасавшиеся к бедру пальцы ощущали горячую воспаленную плоть. Слыша лишь собственное дыхание, через некоторое время он начал говорить вслух, чтобы просто слышать хоть что-то еще. Надо было попытаться сохранить здравый рассудок, и Нед размышлял и мечтал. Конечно же, братья Роберта остались на свободе, они собрали войско на Драконьем Камне и Штормовом Пределе. Элин и Харвин возвратятся в Королевскую Гавань с остальными его гвардейцами, сразу, как только разделаются с сиром Григором. Узнав о случившемся с ним, Кейтилин поднимет Север, а лорды Реки и Долины присоединятся к ней. Нед понял, что все чаще и чаще вспоминает о Роберте. Покойный король вдруг предстал перед ним в цвете юности: высоким, красивым. В огромном рогатом шлеме на голове и с боевым молотом в руке, он на коне казался богом. Во тьме подземелья Нед услыхал его смех, увидел глаза — синие и чистые, как горные озера.</p><p class="p1">«Видишь, Нед, — сказал Роберт. — До чего мы дошли: ты попал в темницу, а я убит свиньей. А ведь мы вместе завоевали престол!»</p><p class="p1">«Я подвел тебя, Роберт», — подумал Нед. Он не мог произнести эти слова: «Я солгал тебе, скрыл от тебя правду, я позволил им убить тебя».</p><p class="p1">Король услыхал его.</p><p class="p1">«Жестоковыйный дурак, — пробормотал он. — Гордость мешает ему слушать. Насытит ли теперь тебя твоя гордость, Старк! А твоя драгоценная честь способна защитить твоих детей?»</p><p class="p1">Раскрываясь, трещины побежали по его лицу, разрывая плоть. Король протянул руку и сорвал маску. Перед Недом оказался вовсе не Роберт, а Мизинец — с насмешливой ухмылкой на лице. Он открыл рот, чтобы заговорить, и лживые слова его превратились в бледно-серых мотыльков.</p><p class="p1">Нед придремывал, когда послышались шаги в коридоре, и сперва он решил, что они снятся ему. Слишком уж давно он не слышал что-нибудь, кроме звука собственного голоса. Неда лихорадило, нога тупо ныла, губы высохли и растрескались. Тяжелая, окованная металлом дверь, скрипя, отворилась, и внезапный свет больно ударил в его глаза.</p><p class="p1">Тюремщик подал кувшин. Запотевшая глина приятно холодила руку. Нед взял сосуд руками и припал к нему. Струйки стекали по бороде, Нед остановился, только когда понял, что больше вместить не может или его вывернет наизнанку.</p><p class="p1">— Сколько прошло дней? — спросил он, оторвавшись от сосуда.</p><p class="p1">Тюремщик, ходячее пугало с крысиным лицом и редкой бороденкой, был облачен в кольчужную рубаху и короткий кожаный плащ с капюшоном.</p><p class="p1">— Никаких разговоров, — сказал он, отбирая кувшин.</p><p class="p1">— Пожалуйста, — проговорил Нед. — Мои дочери…</p><p class="p1">Дверь со стуком закрылась. Когда свет исчез, он заморгал, опустил голову на грудь и свернулся на соломе. Она более не пахла мочой и дерьмом. Теперь она не пахла совсем.</p><p class="p1">Нед не мог понять, спит он или бодрствует. Из тьмы выползали воспоминания — яркие, словно сон. Это было в год ложной весны; снова восемнадцатилетний, он приехал из Орлиного Гнезда на турнир в Харренхолле. Ему представилась сочная зелень травы, он вновь ощутил запах пыльцы, принесенной ветром. Теплые дни, прохладные ночи, сладкое вино. Нед вспомнил смех Брандона, отчаянную храбрость Роберта в общей схватке, хохот будущего короля, когда по обе стороны от него из седел вылетали люди. Вспомнился и Джейме Ланнистер, золотой юноша в чешуйчатой белой броне. Преклонив колено перед павильоном короля Эйериса, он приносил обет защищать и оборонять своего властелина. Потом сир Освелл Уэнт помог Джейме подняться на ноги, и сам Белый Бык, лорд-командующий сир Герольд Хайтауэр, застегнул на его плечах снежно-белый плащ Королевской гвардии. Все шесть Белых Мечей собрались, чтобы приветствовать нового брата.</p><p class="p1">А потом начались поединки, и день принадлежал Рейегару Таргариену. На кронпринце был панцирь, в котором он встретит смерть: блестящая, черная пластинчатая броня с трехголовым драконом его дома, выложенным рубинами на груди. Плюмаж из алого шелка развевался над его головой, и ни одно копье не могло прикоснуться к нему. Ему уступили и Брандон, и Бронзовый Джон Ройс, и даже великолепный сир Эртур Дейн, Меч Зари.</p><p class="p1">Роберт обменивался шутками с Джоном и старым лордом Хантером, когда принц объезжал поле, выбив из седла сира Барристана в последней схватке за венец победителя. Нед запомнил мгновения, погасившие все улыбки, когда принц Рейегар Таргариен проехал мимо собственной жены, Дорнийской принцессы Элии Мартелл, чтобы возложить венок королевы красоты на колени Лианны. Нед буквально видел этот венец из зимних роз, синих, словно иней.</p><p class="p1">Он протянул руку, чтобы прикоснуться к цветам, но под бледно-синими лепестками укрывались шипы. Острые и жестокие, они впились в его кожу, струйки крови неторопливо побежали между пальцев.</p><p class="p1">«Обещай мне, Нед», — прошептала сестра со своего кровавого ложа. Она любила запах зимних роз.</p><p class="p1">— Боги, спасите меня! — Нед заплакал. — Я схожу с ума.</p><p class="p1">Боги не удостоили его ответом!</p><p class="p1">Каждый раз, когда тюремщик приносил ему воду, Нед говорил себе, что прошел еще один день. Сперва он просил рассказать ему что-нибудь о его дочерях, о том, что происходит снаружи. Но пинки и ворчание были ему единственным ответом. Потом, когда заболел желудок, он стал просить еды. Но напрасно: его не кормили. Быть может, Ланнистеры решили заморить его голодом?</p><p class="p1">— Нет, — сказал он себе. Если бы Серсея хотела его смерти, его могли бы убить в тронном зале. Королеве нужно было, чтобы он жил: в слабости и отчаянии, но жил. Кейтилин захватила брата Серсеи, и королева не смела убить его, не поставив жизнь Беса под угрозу.</p><p class="p1">Снаружи камеры раздалось громыхание железных цепей. Дверь, заскрипев, отворилась, и, опершись рукой на влажную стену, Нед заставил себя повернуться лицом к свету. Свет факела заставил его сощуриться.</p><p class="p1">— Еды, — проскрежетал он.</p><p class="p1">— Вина, — ответил голос. Это был не крысеныш; новый тюремщик казался крепче и ниже, хотя на нем был тот же короткий кожаный плащ и шипастый стальной шлем. — Пейте, лорд Эддард. — Он сунул бурдюк в руки Неда.</p><p class="p1">Голос показался странно знакомым, однако Нед Старк не сразу узнал его.</p><p class="p1">— Варис, — сказал он и словно в тумане прикоснулся к лицу пришедшего. — А вы… не снитесь мне? Вы и в самом деле здесь? — Пухлые щеки евнуха покрывала короткая темная щетина, уколовшая пальцы Неда. Варис преобразился в грязного тюремщика, от него пахло потом и кислым вином. — Как вы сумели… ну какой же вы волшебник!</p><p class="p1">— Утоляющий жажду, — сказал Варис. — Пейте, милорд.</p><p class="p1">Руки Неда приняли мех.</p><p class="p1">— С тем самым ядом, который дали Роберту?</p><p class="p1">— Вы несправедливы ко мне, — печально сказал Варис. — Воистину никто не любит евнухов. Дайте бурдюк.</p><p class="p1">Он отпил, красная струйка побежала от уголка пухлого рта.</p><p class="p1">— Не столь хорошее, как то вино, которым вы угощали меня в ночь турнира, но без всякой отравы. Пейте, — заключил он, вытирая губы.</p><p class="p1">Нед попытался глотнуть.</p><p class="p1">— Помои. — Ему показалось, что желудок его вот-вот извергнет вино.</p><p class="p1">— Всем людям положено заедать сладкое кислым. И занятым лордам, и евнухам. Ваш час пришел, милорд.</p><p class="p1">— Мои дочери…</p><p class="p1">— Младшая девочка бежала от сира Меррина и скрылась, — сказал Варис. — Я не сумел отыскать ее. Ланнистеры тоже. Это хорошо. Наш новый король ее не любит. Ваша старшая дочь все еще обручена с Джоффри, Серсея держит ее при себе. Несколько дней назад она явилась ко двору и попросила о том, чтобы вас пощадили. Жаль, что вас там не было, вы были бы растроганы. — Варис наклонился вперед. — Надеюсь, вы понимаете, что можете считать себя покойником, лорд Эддард?</p><p class="p1">— Королева не станет убивать меня, — сказал Нед. Голова его поплыла. Вино оказалось крепким, а он слишком давно не ел… — Кет… Кет захватила ее брата…</p><p class="p1">— Увы, не того брата, — вздохнул Варис. — Потом, она не сумела им воспользоваться. Она позволила Бесу выскользнуть из ее рук. Думаю, что он уже погиб где-то в Лунных горах.</p><p class="p1">— Если это правда, режьте мне глотку, и довольно. — Голова Неда кружилась от вина, он ощущал усталость и тоску.</p><p class="p1">— Ваша кровь мне нужна в самую последнюю очередь.</p><p class="p1">Нед нахмурился:</p><p class="p1">— Когда гибли мои гвардейцы, вы стояли возле королевы и наблюдали за происходящим, не проговорив ни слова.</p><p class="p1">— И не скажу впредь. Как мне кажется, тогда я был без оружия и панциря — в окружении отряда Ланнистеров. — Евнух с любопытством нагнул голову. — Когда я был мальчишкой — до того, как меня обрезали, — мне довелось поездить с труппой кукольников из Вольных Городов. Актеры научили меня тому, что у каждого человека есть своя роль — в жизни, в спектакле… и при дворе. Королевский палач должен быть страшным, мастер над монетой — скупым, лорд-командующий гвардией — доблестным… а мастер над шептунами — лукавым, подобострастным и бессовестным. Доблестный доносчик столь же бесполезен, как трусливый рыцарь. — Взяв у Неда бурдюк, Варис отпил вина.</p><p class="p1">Нед поглядел на лицо евнуха, пытаясь угадать истину под шрамами кукольника и фальшивой щетиной. И решил еще выпить вина, на этот раз оно прошло легче.</p><p class="p1">— Можете ли вы освободить меня из этой ямы?</p><p class="p1">— Я мог бы… но зачем? Нет, начнут задавать вопросы, а ответы приведут ко мне.</p><p class="p1">Нед не ожидал другого.</p><p class="p1">— Вы откровенны.</p><p class="p1">— У евнуха нет чести, щепетильность — роскошь, недоступная пауку, милорд.</p><p class="p1">— Согласитесь ли вы хотя бы вынести записку?</p><p class="p1">— Это будет зависеть от ее содержания. Если вы хотите, я охотно предоставлю вам перо и бумагу, но когда вы напишете свое послание, я прочту его — а уж доставлю или нет, будет зависеть от его соответствия моим собственным целям.</p><p class="p1">— Вашим собственным целям… и каковы же они, лорд Варис?</p><p class="p1">— Мир, — ответил Варис без малейших колебаний. — Если в Королевской Гавани была хоть одна душа, которая отчаянно стремилась сохранить жизнь Роберту Баратеону, так это я. — Он вздохнул. — Пятнадцать лет я защищал короля от врагов, но не сумел защитить от друзей. Кстати, какой странный припадок безумия заставил вас сообщить королеве, что вы узнали правду о происхождении Джоффри?</p><p class="p1">— Безумство милосердия, — признал Нед.</p><p class="p1">— Так, — проговорил Варис. — Можно было не сомневаться. Вы честный и почтенный человек, лорд Эддард. Иногда я забываю об этом. Слишком уж редко мне встречались люди, подобные вам. — Он оглядел камеру. — И когда я вижу, что принесли вам доблесть и честь, то понимаю причину.</p><p class="p1">Нед Старк припал головой к влажному камню и закрыл глаза. Левая нога его пульсировала.</p><p class="p1">— Насчет королевского вина… Вы допросили Ланселя?</p><p class="p1">— Конечно. Серсея сама дала ему бурдюки и сказала, что это любимое вино Роберта. — Евнух пожал плечами. — Охотнику грозит много опасностей. Если бы кабан не расправился с Робертом, король упал бы с коня, или его укусила бы лесная гадюка, или поразила случайная стрела… лес — это бойня богов. Короля убило не вино… а ваше милосердие.</p><p class="p1">Нед опасался именно этого.</p><p class="p1">— Боги простят меня!</p><p class="p1">— Если боги существуют, — проговорил Варис, — а я в этом не сомневаюсь. Королева в любом случае не стала бы долго ждать. Роберт начал выходить из-под ее контроля, и ей нужно было избавиться от него, чтобы освободить себе руки и разделаться с братьями короля. Вот эта парочка — Станнис и Ренли. Кольчужная и шелковая перчатки. — Он утер рот тыльной стороной ладони. — Вы проявили глупость, милорд. Вам нужно было послушаться Мизинца, когда он просил вас поддержать претензии Джоффри на престол.</p><p class="p1">— Но как… как вы могли узнать об этом?</p><p class="p1">Варис улыбнулся:</p><p class="p1">— Я знаю это, — а откуда, вам знать не надо. Кроме того, я знаю, что сегодня утром королева нанесет вам визит.</p><p class="p1">Нед медленно поднял глаза:</p><p class="p1">— Почему?</p><p class="p1">— Серсея боится вас, милорд… однако у нее есть и другие враги, которых она боится еще больше. Ее возлюбленный Джейме сейчас сражается с речными лордами. Лиза Аррен засела в Орлином Гнезде, окруженная камнем и сталью… и симпатии к королеве она не испытывает. В Дорне Мартеллы не простили Ланнистерам убийство принцессы Элии с ее детьми. А теперь еще ваш сын идет от Перешейка во главе северной рати.</p><p class="p1">— Но Робб почти мальчишка, — удивился Нед.</p><p class="p1">— Мальчишка, но во главе войска, — сказал Варис. — Бесспорно, он еще мальчишка, как вы сами сказали. А поэтому Серсея не спит по ночам из-за братьев короля… в особенности из-за лорда Станниса. Его-то притязания подлинны. Станнис — знаменитый и доблестный полководец; к тому же он полностью лишен милосердия. Нет на земле существа более жуткого, чем истинно справедливый человек. Никто не знает, чем занимался лорд Станнис на Драконьем Камне, однако клянусь, он уже собрал больше мечей, чем ракушек на берегу. Вот что мучит Серсею: пока брат ее и отец расходуют свои силы на сражение со Старком и Талли, лорд Станнис высаживается, объявляет себя королем и сворачивает кудрявую головенку ее сыну, а заодно и ей самой. Хотя я действительно верю, что голова сына ей дороже.</p><p class="p1">— Станнис Баратеон — подлинный наследник Роберта, — сказал Нед. — По праву престол принадлежит именно ему, и я готов приветствовать его восхождение.</p><p class="p1">Варис цыкнул зубом.</p><p class="p1">— Серсея не станет вас слушать, уверяю вас. Станнис, возможно, завоюет престол, однако приветствовать его будет лишь ваша отрубленная голова, если вы не сумеете обуздать свой язык. Санса была так трогательна; стыдитесь зачеркнуть ее труды. Вам даруют жизнь — если вы хотите принять ее. Серсея не дура. Она знает, что ручной волк полезнее мертвого.</p><p class="p1">— Вы хотите, чтобы я стал служить женщине, которая убила моего короля, погубила моих друзей, искалечила моего сына? — В голосе Неда слышалось явное недоверие.</p><p class="p1">— Я хочу, чтобы вы служили стране, — ответил Варис. — Скажите королеве, что вы признаете свою вину, прикажите сыну сложить оружие и признайте Джоффри истинным наследником. Предложите ей объявить Станниса и Ренли бесчестными узурпаторами. Наша зеленоглазая львица знает, что вы — человек чести. И если вы предоставите ей мир, в котором она нуждается, дадите время расправиться со Станнисом и пообещаете унести тайну в могилу, полагаю, королева позволит вам уйти в Черные Братья и провести остаток своих дней на Стене — рядом с братом и вашим незаконнорожденным сыном.</p><p class="p1">Мысль о Джоне наполнила Неда стыдом и печалью, слишком глубокой для слов. Если бы только увидеть мальчика снова, сесть рядом, поговорить. Боль пронзила сломанную ногу под грязно-серым гипсом лубков. Нед вздрогнул, бессильно разжав и снова сжав пальцы.</p><p class="p1">— Это ваш собственный план, — выдохнул он, — или вы в союзе с Мизинцем?</p><p class="p1">Евнух явно удивился.</p><p class="p1">— Скорее я подружусь с Черным Козлом Квохора. Мизинца можно назвать вторым по изобретательности среди всего народа Семи Королевств. О да, я скармливал ему избранные слухи — в достаточном количестве для того, чтобы он мог поверить, что я в его руках… Аналогичным образом я позволяю Серсее считать, что я поддерживаю ее.</p><p class="p1">— Так же, как позволяете мне верить в ваше сочувствие. Скажите же, лорд Варис, кому вы действительно служите?</p><p class="p1">Варис отвечал тонкой улыбкой:</p><p class="p1">— Конечно же, стране, мой добрый лорд, как вы могли в этом усомниться? Клянусь в этом своим потерянным мужским естеством. Я служу государству, а королевство нуждается в мире. — Прикончив вино, он отбросил пустой мех в сторону. — Итак, жду ответа? Дайте мне слово, что скажете королеве именно то, что она хочет услышать, придя сюда!</p><p class="p1">— Если я сделаю это, слово мое сделается столь же пустым, как снятый с плеч доспех. Жизнь не настолько уж дорога мне.</p><p class="p1">— Жаль. — Евнух встал. — А как насчет жизни вашей дочери, милорд? Цените ли вы ее?</p><p class="p1">Мороз пронзил сердце Неда.</p><p class="p1">— Моей дочери…</p><p class="p1">— Конечно же, вы не думали, что я могу забыть о вашей милой невинной девочке, милорд. Королева, безусловно, не забыла о ней.</p><p class="p1">— Нет, — попросил Нед надтреснутым голосом. — Варис, боги да будут к вам милосердны, делайте со мной что угодно, только не вовлекайте мою дочь в свои планы. Санса еще только ребенок!</p><p class="p1">— Рейенис тоже была ребенком. Дочь принца Рейегара. Милая малышка, она была тогда младше ваших девочек. Помнится, у нее был черный котенок, которого она звала Балерионом. Вы не видели его? Меня всегда интересовала его судьба. Рейенис любила играть с ним. Представляла, что он и есть истинный Балерион, Черный Ужас старинных времен, однако Ланнистеры быстро растолковали девочке разницу между котенком и драконом, вломившись в ее опочивальню.</p><p class="p1">Варис протяжно вздохнул с усталостью человека, принявшего весь груз скорбей мира на свои плечи.</p><p class="p1">— Верховный септон некогда говорил мне, что тот, кто грешит, должен и страдать. Если он прав… лорд Эддард, скажите мне тогда, почему, когда вы, знатные лорды, играете в престолы, больше всех страдают невинные? Ожидая королеву, поразмышляйте-ка над этой мыслью, если хотите. И подумайте еще кое над чем: следующий гость может принести вам хлеб, сыр и маковое молоко, чтобы ослабить боль… или положить перед вами голову Сансы. Выбор, мой дорогой лорд-десница, полностью в ваших руках.</p></span>
