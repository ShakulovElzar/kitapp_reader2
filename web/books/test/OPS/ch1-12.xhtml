<p class="p">Тирион</p>
</div><p class="p1">Где-то в каменных лабиринтах Винтерфелла завыл волк. Звук повис над замком траурным флагом. Тирион Ланнистер оторвался от книг и поежился, хотя в библиотеке было тепло и уютно. Что-то в вое этого волка заставило его забыть уютное настоящее и почувствовать себя спасающимся от стаи обнаженным беглецом.</p><p class="p1">Когда лютоволк взвыл снова, Тирион захлопнул тяжелую, переплетенную в кожу обложку столетней давности повествования о смене времен года, написанного давно почившим мейстером, и прикрыл зевок тыльной стороной ладони. Лампа мерцала, масла в ней почти не осталось, и рассвет уже сочился сквозь высокие окна. Он просидел здесь всю ночь, но ничего нового не обнаружил. Тирион Ланнистер был не из тех, кто любил поспать.</p><p class="p1">Онемевшие ноги заныли, когда он поднялся со скамьи. Растерев, Тирион вернул в них какую-то жизнь и тяжело прохромал к столу, где негромко похрапывал септон, опустивший голову на открытую книгу. Тирион поглядел на заглавие: «Жизнь великого мейстера Эйетельмура». Пространное сочинение…</p><p class="p1">— Хейли, — сказал он негромко. Смущенный молодой человек, моргая, поднял голову, хрустальный знак его ордена раскачивался на цепочке. — Я намереваюсь прервать свой поиск. Пригляди, чтобы книги вернулись на полки. И будь аккуратен с валирийскими свитками, пергамент очень хрупок. «Военные машины» Армидиона — очень редкая вещь, а ваш экземпляр единственный, который мне приходилось когда-нибудь видеть. — Хейли глядел на него в полусне, Тирион терпеливо повторил наставления, а потом хлопнул септона по плечу и оставил его выполнять поручение.</p><p class="p1">Оказавшись снаружи, Тирион вдохнул полной грудью холодный утренний воздух и начал старательно спускаться по крутым каменным ступенькам, винтом огибавшим снаружи Библиотечную башню. Предприятие вышло долгим; узкие ступени были слишком высоки для его коротких и кривых ног. Встающее солнце еще не озарило стены Винтерфелла, но люди уже были заняты во дворе внизу. До ушей Тириона донесся скрипучий голос Сандора Клигана:</p><p class="p1">— Мальчик давно умирает. Лучше, чтобы он поторопился.</p><p class="p1">Тирион поглядел вниз и увидел Пса, стоявшего возле окруженного сквайрами молодого Джоффри.</p><p class="p1">— Во всяком случае, он умирает тихо, — отвечал принц. — Воет лишь волк. Я едва мог спать прошлой ночью.</p><p class="p1">Тень Клигана далеко протянулась по утоптанной земле, сквайр надвинул черный шлем на голову.</p><p class="p1">— Могу заткнуть пасть твари, если это порадует тебя, — сказал он сквозь открытое забрало. Паж подал ему длинный меч. Клиган взвесил его, рубанул холодный утренний воздух. Позади него двор отозвался звоном стали о сталь.</p><p class="p1">Предложение как будто бы восхитило принца.</p><p class="p1">— Послать Пса убить пса! Винтерфелл просто кишит волками! Старки не хватятся, если одного из них не станет.</p><p class="p1">Тирион спрыгнул с последней ступени во двор.</p><p class="p1">— Если ты не против, хочу сделать одно уточнение, племянник, — проговорил он. — Старки умеют считать и после шести в отличие от некоторых принцев, не будем их здесь называть…</p><p class="p1">У Джоффри хватило совести покраснеть.</p><p class="p1">— Голос из ниоткуда, — сказал Сандор и огляделся сквозь прорезь забрала. — Дух воздуха!</p><p class="p1">Принц расхохотался, как бывало всегда, когда его телохранитель разыгрывал очередной фарс. Тирион привык к этому.</p><p class="p1">— Ну-ка, посмотри сюда.</p><p class="p1">Сандор поглядел на землю и сделал вид, что заметил его.</p><p class="p1">— Маленький лорд Тирион, — проговорил он. — Прошу прощения, я и не заметил, как вы появились здесь.</p><p class="p1">— Сегодня у меня нет настроения терпеть твою наглость. — Тирион повернулся к племяннику. — Джоффри, ты давно должен был зайти к лорду Эддарду и леди Кейтилин, чтобы предложить им свои утешения.</p><p class="p1">Джоффри возмутился, как может сделать только мальчишка.</p><p class="p1">— Еще не хватало! Зачем им нужны мои утешения?</p><p class="p1">— Им не нужны слова, — отвечал Тирион, — но от тебя ждут соболезнований. Твое отсутствие замечено.</p><p class="p1">— Мальчишка Старков мне безразличен, — проговорил Джоффри. — А я не могу терпеть женских слез.</p><p class="p1">Тирион Ланнистер привстал на носки и сильной рукой ударил племянника по лицу. Щека мальчика покраснела.</p><p class="p1">— Одно только слово, — проговорил Тирион, — и я ударю тебя еще раз.</p><p class="p1">— Я все скажу матери! — воскликнул Джоффри.</p><p class="p1">Тирион ударил снова, теперь покраснели обе щеки.</p><p class="p1">— Рассказывай своей матери, — велел ему Тирион. — Но сперва ты сходишь к лорду и леди Старк, упадешь перед ними на колени и скажешь, насколько тебе жаль мальчика, скажешь, что готов предложить любые услуги, если можно помочь им даже какой-нибудь мелочью в этот жуткий час. И что ты непрестанно молишься за них. Ну, теперь понял? Все понял?</p><p class="p1">Лицо мальчишки скривилось, словно бы он намеревался заплакать. Ответив легким кивком, Джоффри повернулся и бросился вон со двора, держась за щеку. Тирион поглядел ему вслед.</p><p class="p1">Тень упала на лицо Тириона. Он повернулся и обнаружил, что Клиган нависает над ним подобно утесу. Черная как пепел броня, казалось, погасила солнце. Клиган опустил забрало, шлем его изображал морду ощерившегося и страшного черного пса, хотя Тирион всегда находил в нем приятные отличия от изуродованного ожогом лица Клигана.</p><p class="p1">— Принц запомнит оскорбления, маленький лорд, — предостерег его Пес. Шлем превратил его хохоток в гулкий рокот.</p><p class="p1">— Не сомневаюсь, — отвечал Тирион Ланнистер. — А если забудет, будь доброй собакой, напомни ему. — Он оглядел двор. — А не знаешь ли ты, где я могу отыскать своего брата?</p><p class="p1">— Он изволит завтракать с королевой.</p><p class="p1">— Ага, — отвечал Тирион. И, пренебрежительно кивнув Сандору Клигану, направился прочь со всей быстротой, на которую были способны его короткие ноги, насвистывая на ходу. Жаль только рыцаря, который первым обратится сегодня к Псу. У этого типа скверный характер.</p><p class="p1">Холодную неприветливую трапезу подали в утренней комнате гостевого дома. Джейме сидел за столом вместе с Серсеей и детьми, они разговаривали приглушенными голосами.</p><p class="p1">— Роберт все еще спит? — спросил Тирион, без приглашения усаживаясь за стол.</p><p class="p1">Сестра поглядела на него с тем же самым выражением легкого презрения, с которым смотрела на него со дня рождения.</p><p class="p1">— Король не спал вообще, — сказала она ему. — Он рядом с лордом Эддардом. Король принял скорбь друга к самому сердцу.</p><p class="p1">— У нашего Роберта большое сердце, — проговорил Джейме с ленивой улыбкой. Он удостаивал серьезного отношения весьма немногое. Тирион знал за своим братом эту особенность и прощал ее. Во все жуткие и такие долгие годы его детства лишь Джейме иногда выказывал уродцу-брату некоторую симпатию и уважение, и за это Тирион готов был простить ему едва ли не любой поступок.</p><p class="p1">Приблизился слуга.</p><p class="p1">— Хлеба, — сказал ему Тирион, — две маленькие рыбки и кружку доброго темного пива, чтобы утопить их. И немного бекона, поджарь его на углях. — Слуга поклонился и направился прочь. Тирион повернулся к своим родственникам. Разнополые близнецы сегодня казались особенно похожими. Оба предпочли глубокую зелень одежды, подчеркивающую цвет глаз. Длинные светлые кудри были завиты самым модным образом, на обоих золотые украшения — на запястьях, пальцах и шее.</p><p class="p1">Тирион попробовал представить себе, как живется на свете близнецам, и решил, что никогда не поймет этого. Тошно, должно быть, все время видеть себя, как в зеркале. Собственное подобие он не мог даже представить.</p><p class="p1">Принц Томмен спросил:</p><p class="p1">— Дядя, а что слышно о Бране?</p><p class="p1">— Я проходил вчера вечером мимо его комнаты, — ответил Тирион, — но перемен не было. Мейстер видит в этом хороший знак.</p><p class="p1">— Я не хочу, чтобы Бран умер, — проговорил Томмен. Это был ласковый мальчик, непохожий на брата, но ведь и Джейме с Тирионом нельзя считать фасолинами из одного стручка.</p><p class="p1">— У лорда Эддарда был брат по имени Брандон, — заметил Джейме. — Один из заложников, убитых Таргариеном. Несчастливое имя.</p><p class="p1">— По-моему, не столь несчастливое, как тебе кажется, — возразил Тирион. Слуга принес ему блюдо, Тирион откусил от ломтя черного хлеба. Серсея тревожно посмотрела на него.</p><p class="p1">— Тирион, что ты хочешь сказать?</p><p class="p1">Карлик криво улыбнулся ей и приложился к пиву.</p><p class="p1">— Лишь то, что желание Томмена может исполниться. Мейстер надеется, что мальчик выживет.</p><p class="p1">Мирцелла радостно охнула, Томмен нервно улыбнулся, но Тирион следил не за детьми. Джейме и Серсея обменялись коротким, не более чем в секунду взглядом, но карлик не пропустил его. Королева посмотрела на стол.</p><p class="p1">— Где милосердие? Здешние северные боги слишком жестоки, раз позволяют ребенку терпеть такие муки. А что именно говорит мейстер?</p><p class="p1">Обжаренный бекон захрустел под зубами Тириона. Задумчиво пожевав, он ответил:</p><p class="p1">— Мейстер полагает, что, если бы мальчику суждено было умереть, жизнь уже оставила бы его. Однако прошло четыре дня, и никаких перемен нет.</p><p class="p1">— А Бран поправится, дядя? — спросила маленькая Мирцелла, унаследовавшая от матери всю ее красоту, но не вздорный нрав.</p><p class="p1">— Малышка, он сломал спину, — сказал Тирион, — и ноги. Жизнь в нем поддерживают медом и водой, иначе он умер бы от истощения. Если он очнется, то, наверное, сумеет есть настоящую пищу, но никогда снова не научится ходить.</p><p class="p1">— Если он очнется… — повторила Серсея. — А это возможно?</p><p class="p1">— Правду знают только боги, — ответил Тирион. — Сам мейстер всего лишь надеется. — Он снова откусил от ломтя хлеба. — Могу поклясться, что жизнь в мальчике поддерживает только его волк. Зверь день и ночь воет возле большого окна и всякий раз возвращается, когда его прогоняют. Мейстер сказал, что однажды он закрыл окно, чтобы стало потише, и Бран ослабел. А когда совсем открыл его, сердце мальчика забилось сильнее.</p><p class="p1">Королева поежилась и сказала:</p><p class="p1">— Есть что-то противоестественное в этих животных. Они опасны. И я не позволю ни одному из них направиться на юг вместе с нами.</p><p class="p1">Джейме возразил:</p><p class="p1">— Этого будет трудно добиться, сестра. Волки повсюду следуют за девчонками.</p><p class="p1">Тирион приступил к рыбе.</p><p class="p1">— Значит, вы скоро уезжаете?</p><p class="p1">— Не так уж скоро, — опять вступила в разговор Серсея. И нахмурилась. — Что значит — мы? А как насчет тебя? Только ради Бога не говори мне, что намереваешься остаться в Винтерфелле.</p><p class="p1">Карлик пожал плечами:</p><p class="p1">— Бенджен Старк возвращается в Ночной Дозор с бастардом своего брата. Я хочу поехать вместе с ними и увидеть Стену, о которой мы так много слышали.</p><p class="p1">Джейме улыбнулся:</p><p class="p1">— Надеюсь, ты не собрался облачиться в черное, милый брат?</p><p class="p1">Тирион расхохотался:</p><p class="p1">— Разве я выдержу целибат? Тогда разорятся все шлюхи от Дорна до Бобрового утеса. Нет, я только хочу постоять на вершине Стены и пустить струю с края мира.</p><p class="p1">Серсея резко поднялась.</p><p class="p1">— Детям незачем выслушивать всякую грязь. Томмен, Мирцелла, идемте! — Резкими шагами королева вышла из комнаты, свита и дети потянулись за ней.</p><p class="p1">Джейме Ланнистер задумчиво поглядел на брата холодными зелеными глазами.</p><p class="p1">— Старк никогда не согласится оставить Винтерфелл, пока сын его пребывает в смертной тени.</p><p class="p1">— Если прикажет Роберт, он сделает это, — сказал Тирион. — А Роберт прикажет. В любом случае лорд Эддард ничем не сможет помочь своему сыну.</p><p class="p1">— Старк может прекратить его мучения, — сказал Джейме. — Случись это с моим сыном, я поступил бы именно так. И считал бы, что совершил благодеяние.</p><p class="p1">— Не советую обращаться с подобным предложением к лорду Эддарду, милый брат, — усмехнулся Тирион. — Он воспримет его без должной доброты.</p><p class="p1">— Даже если мальчишка выживет, он будет калекой. Хуже чем калекой — уродом. Я предпочитаю добрую чистую смерть.</p><p class="p1">Тирион пожал плечами, что только подчеркнуло их кривизну.</p><p class="p1">— Кстати об уродах, — напомнил он. — Разреши уточнить. Смерть окончательна и подводит жуткий итог, в то время как жизнь полна неисчислимых возможностей.</p><p class="p1">Джейме улыбнулся:</p><p class="p1">— А ты развратный чертенок, вот что!</p><p class="p1">— Конечно, — согласился Тирион. — Надеюсь, что мальчик очнется. Я бы хотел услышать, что он тогда расскажет.</p><p class="p1">Улыбка Джейме свернулась кислым молоком.</p><p class="p1">— Тирион, мой милый братец, — заметил он мрачно, — иногда мне с трудом удается понять, на чьей ты, собственно, стороне.</p><p class="p1">Рот Тириона был полон рыбы и хлеба. Глотнув крепкого черного пива, чтобы протолкнуть съеденное в желудок, он ответил Джейме волчьей ухмылкой:</p><p class="p1">— Зачем же так! О, Джейме, мой милый братец, ты ранишь меня, прекрасно зная, как я люблю свое семейство…</p></span>
