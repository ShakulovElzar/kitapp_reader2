<span id="id7"><div class="title2">
<p class="p">Кейтилин</p>
</div><p class="p1">Палаты Кейтилин были жарче всех помещений великого замка Винтерфелл. Ей редко приходилось зажигать здесь очаг. Замок был возведен на естественных горячих источниках, и обжигающая вода бежала внутри стен его покоев, словно кровь в человеческом теле, прогоняя холод из каменных залов, наполняя стеклянные сады влажным теплом, храня землю от замерзания. В дюжине небольших двориков день и ночь курились открытые пруды. Для лета — немного, для зимы же — грань между жизнью и смертью.</p><p class="p1">Ванна Кейтилин всегда парила, и ладонь ее прикасалась к теплой стене; тепло напоминало ей о Риверране, о днях, проведенных под солнцем с Лизой и Эдмаром. Но Нед не переносил жары. Старки созданы для холода, говаривал он ей; на это она обычно со смехом отвечала, что в таком случае они, безусловно, построили свой замок не на том месте.</p><p class="p1">Нед поцеловал жену и выбрался из постели, как делал уже тысячу раз. Он пересек комнату, отодвинул тяжелые занавеси и по одному открыл высокие узкие окна, впуская в палату ночной воздух. Ветер кружил вокруг него, обратившегося лицом во тьму, — обнаженного и с пустыми руками. Натянув меха до подбородка, Кейтилин следила за ним. Нед казался ей почему-то каким-то ранимым и невысоким — похожим на того юношу, с которым она обвенчалась в септе Риверрана пятнадцать долгих лет назад. Тело ее все еще ныло после его ретивой любви. Добрая боль. Она ощущала в себе его семя. И помолилась, чтобы оно прижилось. Прошло уже три года после рождения Рикона, а она еще не слишком стара и может родить мужу еще одного сына.</p><p class="p1">— Я откажу ему, — проговорил Нед, поворачиваясь. В глазах его была тоска, в голосе сомнение.</p><p class="p1">Кейтилин села на постели.</p><p class="p1">— Ты не можешь этого сделать и не должен.</p><p class="p1">— Мои обязанности здесь, на Севере. Я не хочу быть десницей Роберта.</p><p class="p1">— Он этого не поймет. Теперь он король, а короли не похожи на простых людей. Если ты откажешься служить ему, он станет интересоваться причинами и рано или поздно решит, что ты втайне замышляешь какой-нибудь заговор. Неужели ты не видишь опасности, в которой мы тогда окажемся?</p><p class="p1">Не желая верить, Нед покачал головой:</p><p class="p1">— Роберт никогда не станет вредить мне или моей семье. Мы с ним ближе чем братья. Он любит меня. Если я откажу ему, он будет реветь, ругаться, но через неделю мы вместе посмеемся над ссорой. Я знаю этого человека!</p><p class="p1">— Ты знал человека, — проговорила она. — А король тебе не знаком. — Кейтилин вспомнила мертвую лютоволчицу в снегу, сломанный рог, глубоко застрявший в ее горле. Следует доказать мужу свою правоту. — Гордость — главное для короля, милорд. Роберт проделал весь этот долгий путь, чтобы оказать тебе великую честь, и ты не можешь отказать ему.</p><p class="p1">— Честь? — с горечью рассмеялся Нед.</p><p class="p1">— В его глазах — да, — отвечала она.</p><p class="p1">— А в твоих?</p><p class="p1">— И в моих! — вспылила она. И как это он не понимает? — Король предлагает женить своего сына на нашей дочери, как иначе назвать это предложение? Когда-нибудь Санса сможет стать королевой. И ее сыновья будут править от Стены и до Дорнских гор. Что здесь плохого?</p><p class="p1">— Боже, Кейтилин, Сансе всего лишь одиннадцать, — проговорил Нед. — Джоффри… Джоффри просто…</p><p class="p1">Она договорила за него:</p><p class="p1">— …кронпринц и наследник престола. А мне было всего двенадцать, когда отец обещал меня твоему брату Брандону.</p><p class="p1">Рот Неда с горечью изогнулся.</p><p class="p1">— Брандон. Да. Брандон знал, как поступить. Он всегда знал, что делать. Все это было предназначено для Брандона. И ты, и Винтерфелл, и все на свете. Он-то и был рожден, чтобы стать десницей короля и отцом королевы. Я никогда не просил, чтобы эта чаша досталась мне.</p><p class="p1">— Возможно, — проговорила Кейтилин, — но Брандон мертв, и чаша в твоих руках. Ты должен испить ее, хочешь этого или нет.</p><p class="p1">Нед отвернулся от нее и уставился в окно. Он поглядел во тьму, на луну и на звезды, даже на часовых на стене. Кейтилин успокоилась, она понимала его боль. Как требовал обычай, Эддард Старк женился на ней вместо брата. Но тень мертвого брата по-прежнему разделяла их, как и другая тень, — женщины, имени которой она не знала, женщины, которая родила ему незаконнорожденного сына.</p><p class="p1">Кейтилин уже собиралась направиться к мужу, когда в дверь постучали, громко и неожиданно. Нед повернулся и нахмурился.</p><p class="p1">— Что там еще?</p><p class="p1">За дверью послышался голос Десмонда:</p><p class="p1">— Милорд, здесь мейстер Лювин, он просит срочной аудиенции.</p><p class="p1">— Ты сказал ему, что я велел не тревожить меня?</p><p class="p1">— Да, милорд. Он настаивает.</p><p class="p1">— Хорошо. Пусть войдет.</p><p class="p1">Нед направился к гардеробу и надел тяжелый халат. Кейтилин вдруг поняла, насколько холодно стало вокруг. Она села в постели и натянула меха до подбородка.</p><p class="p1">— Не закрыть ли окна? — предложила она.</p><p class="p1">Нед рассеянно кивнул. В дверях показался мейстер Лювин.</p><p class="p1">Невысокий мейстер воплощал собой геральдический цвет Старков — серый: глаза его были серыми и быстрыми и многое замечали, тот остаток волос, который оставили ему годы, сделался серым от седины. И конечно же, отороченное белым мехом одеяние его было сшито из серой шерсти. В огромных просторных рукавах были устроены карманы. Лювин всегда все заталкивал в эти рукава, а извлекал из них что-нибудь другое: послания, странные вещи, игрушки для детей. Зная об этих запасах, Кейтилин всегда удивлялась, как мейстер вообще мог поднимать руки.</p><p class="p1">Лювин дождался, пока дверь закрылась за ним, и только тогда заговорил:</p><p class="p1">— Милорд, прошу прощения за то, что потревожил вас, но мне передали послание.</p><p class="p1">Нед отвечал не без раздражения:</p><p class="p1">— Передали послание? Кто? Разве приехал гонец? Мне ничего не сказали.</p><p class="p1">— Гонца не было, милорд, но пока я спал, на столе в моей обсерватории кто-то оставил резную деревянную шкатулку. Мои слуги никого не заметили, но вещицу, должно быть, принес кто-то из королевской дружины. У нас нет никаких других гостей с юга.</p><p class="p1">— Деревянная шкатулка, ты говоришь? — переспросила Кейтилин.</p><p class="p1">— Внутри оказалось несколько новых линз для обсерватории, сделанных, судя по всему, в Мире. Тамошние оптики не имеют себе равных.</p><p class="p1">Нед нахмурился. Кейтилин знала, что на подобные вещи у него не хватало терпения.</p><p class="p1">— Линзы, — проговорил он. — Какое отношение они имеют ко мне?</p><p class="p1">— Я задал себе тот же вопрос, — проговорил мейстер Лювин. — И решил, что в этом ларце скрыто нечто большее.</p><p class="p1">Кейтилин поежилась под тяжестью мехов.</p><p class="p1">— Линза — это предмет, помогающий нам видеть.</p><p class="p1">— Воистину это так. — Мейстер теребил пальцами наплечье, подобающее его ордену. Тяжелую цепь он носил под одеждой на шее, каждое колечко ее было выковано из другого металла.</p><p class="p1">Кейтилин вновь ощутила, как ужас зашевелился внутри ее.</p><p class="p1">— Так что же мы должны видеть более ясно?</p><p class="p1">— Об этом я спросил себя самого. — Мейстер Лювин извлек из рукава туго скатанную бумажку. — Истинное послание обнаружилось под дном, когда я разобрал шкатулку, в которой прибыли линзы, но оно предназначено не для моих глаз.</p><p class="p1">Нед протянул руку:</p><p class="p1">— Тогда дай письмо мне.</p><p class="p1">Лювин не пошевелился.</p><p class="p1">— Прошу прощения, милорд. Письмо направлено не мне и не вам. Оно адресовано леди Кейтилин, и только ей одной. Можно ли мне приблизиться?</p><p class="p1">Кейтилин кивнула, не заставив себя заговорить. Мейстер положил бумажку на стол возле постели. Она была запечатана небольшой нашлепкой из синего воска. Лювин поклонился и начал отступать.</p><p class="p1">— Останься, — приказал Нед суровым голосом. Он поглядел на Кейтилин. — Что это такое? Миледи, ты дрожишь.</p><p class="p1">— Я боюсь, — призналась Кейтилин. Протянув руку, она нащупала письмо. Меха упали, но женщина и не вспомнила о своей наготе. На синем воске была оттиснута печать дома Арренов — луна и сокол.</p><p class="p1">— Это от Лизы. — Кейтилин поглядела на мужа. — Письмо не принесет нам радости. Я чувствую в нем горе, Нед. Я ощущаю это.</p><p class="p1">Нед нахмурился, лицо его потемнело.</p><p class="p1">— Распечатывай.</p><p class="p1">Кейтилин сломала печать.</p><p class="p1">Глаза ее пробежали несколько строк. Буквы не складывались в осмысленные слова. А потом она вспомнила:</p><p class="p1">— Лиза не рисковала. Девочками мы придумали свой собственный язык.</p><p class="p1">— А ты можешь прочитать?</p><p class="p1">— Да, — согласилась Кейтилин.</p><p class="p1">— Тогда говори.</p><p class="p1">— Быть может, мне лучше уйти? — сказал мейстер Лювин.</p><p class="p1">— Нет, — отвечала Кейтилин. — Нам потребуется твой совет. — Откинув меха, она выбралась из постели. Ночной воздух холодным могильным прикосновением натянул ее кожу, пока она перебежала по комнате. Мейстер Лювин отвернулся. Даже Неда покоробило.</p><p class="p1">— Что ты делаешь? — возмутился он.</p><p class="p1">— Зажигаю огонь, — ответила ему Кейтилин. Она отыскала халат и, надев его, склонилась над холодным очагом.</p><p class="p1">— Но здесь мейстер Лювин… — начал Нед.</p><p class="p1">— Мейстер Лювин принимал все мои роды, — сказала Кейтилин. — Сейчас не время для ложной скромности. — Она положила бумажку в очаг и придавила сверху поленьями. Нед подошел к ней и поднял на ноги. Лицо его оказалось буквально в дюйме от ее лица.</p><p class="p1">— Миледи, скажи мне, что здесь написано?</p><p class="p1">Кейтилин напряглась.</p><p class="p1">— Предупреждение, — негромко ответила она, — для тех, у кого хватает ума прислушаться.</p><p class="p1">Глаза Неда обратились к ее лицу.</p><p class="p1">— Продолжай.</p><p class="p1">— Лиза сообщает, что Джона Аррена убили.</p><p class="p1">Пальцы мужа напряглись на ее руке.</p><p class="p1">— Кто?</p><p class="p1">— Ланнистеры, — сказала Кейтилин. — Королева.</p><p class="p1">Нед выпустил ее руку. На коже остались темные отметины.</p><p class="p1">— Боги, — пробормотал он хриплым голосом, — твоя сестра обезумела от горя. Она не знает, что говорит.</p><p class="p1">— Она знает, — проговорила Кейтилин. — Лиза порывиста, но это послание было тщательно спланировано и умно спрятано. Она знала, что бумажка эта грозит ей смертью, если письмо попадет не в те руки. Чтобы так рисковать, она должна располагать более чем подозрениями. Теперь у нас действительно нет выхода. Ты должен стать десницей Роберта. Тебе придется отправиться на юг и узнать истину.</p><p class="p1">Кейтилин поглядела на мужа и сразу же поняла, что Нед пришел к противоположному выводу.</p><p class="p1">— Единственная известная мне правда находится здесь. А Юг — это гадючье гнездо, от которого лучше держаться подальше.</p><p class="p1">Лювин поправил цепь, прищемившую кожу на горле, и поклонился:</p><p class="p1">— Десница короля обладает великой властью, милорд. Лорд-десница способен узнать правду о смерти лорда Аррена и предать убийцу королевскому правосудию, способен защитить леди Аррен и ее сына, если верным окажется худшее.</p><p class="p1">Нед беспомощно оглядел опочивальню. Сердце Кейтилин рвалось к нему, но она понимала, что рано еще обнимать мужа. Сперва нужно добиться победы — ради ее детей.</p><p class="p1">— Ты говоришь, что любишь Роберта как брата. Неужели ты можешь оставить своего брата в окружении Ланнистеров?</p><p class="p1">— Чтобы Иные побрали вас обоих, — мрачно буркнул Нед. Он отвернулся от них и подошел к окну. Кейтилин выжидала, молчал и мейстер. А Эддард Старк молча прощался с любимым домом. Он отвернулся от окна, лицо разом сделалось усталым и угрюмым, в уголках глаз поблескивала влага. — Отец мой однажды отправился на юг, отвечая на призыв короля. Но так и не вернулся домой.</p><p class="p1">— Другие времена, — ответил мейстер Лювин, — другой король.</p><p class="p1">— Да, — мрачно отозвался Нед, опускаясь в кресло возле очага. — Кейтилин, тебе придется остаться в Винтерфелле.</p><p class="p1">Слова эти холодным ветром пронзили ее сердце.</p><p class="p1">— Нет, — сказала Кейтилин с внезапным испугом. Неужели таким будет ее наказание? Никогда не увидеть его лица, не ощутить прикосновения к телу его рук.</p><p class="p1">— Да, — отвечал Нед голосом, не допускающим возражений. — Ты будешь править Севером вместо меня, пока я исполняю поручения Роберта. В Винтерфелле всегда должен сидеть Старк. Роббу только четырнадцать. Скоро он вырастет, а меня не окажется рядом. Пусть он участвует в твоих советах. Робб должен быть хорошо подготовлен к правлению, когда придет его время.</p><p class="p1">— Да будет воля богов, чтобы это случилось не слишком скоро, — проговорил мейстер Лювин.</p><p class="p1">— Мейстер Лювин, я доверяю вам как родичу. Помогайте моей жене советом во всех делах, великих и малых. Научите моего сына тому, что он должен знать. Зима близко.</p><p class="p1">Мейстер Лювин серьезно кивнул. Потом наступило молчание, наконец Кейтилин, набравшись отваги, задала вопрос, которого боялась более всего:</p><p class="p1">— А что будет с остальными детьми?</p><p class="p1">Нед поднялся и обнял ее, коснувшись щекой щеки.</p><p class="p1">— Рикон очень мал, — ответил он мягко, — и он останется здесь вместе с тобой и Роббом. Остальных я возьму с собой.</p><p class="p1">— Я не перенесу разлуки, — сказала Кейтилин дрожа.</p><p class="p1">— Придется перенести, — отвечал он. — Санса должна выйти за Джоффри. Теперь это ясно; мы не можем предоставить королю повод для сомнений в нашей преданности. К тому же пора и Арье познакомиться с обычаями южного двора, через несколько лет она тоже войдет в брачный возраст.</p><p class="p1">Санса будет блистать на Юге, подумала про себя Кейтилин, и видят боги, что Арья нуждается в воспитании. Неохотно она отпустила их в своем сердце. Но не Брана. Только не Брана.</p><p class="p1">— Да, — сказала она, — но пожалуйста, ради нашей любви, пусть Бран останется в Винтерфелле, ему только семь.</p><p class="p1">— Мне было семь, когда мой отец послал меня приемышем в Орлиное Гнездо, — сказал Нед. — Сир Родрик говорит, что Робб и принц Джоффри не ладят. Это плохо. Бран может помочь сгладить сложности… Он обаятельный мальчишка, смешливый, легко влюбляющийся. Пусть вырастет вместе с молодыми принцами, подружится с ними, как я с Робертом. Это выгодно нашему дому.</p><p class="p1">Нед прав, Кейтилин это знала. Но боль от этого не становилась меньше. Она потеряет сразу четверых: Неда, обеих дочерей и милого, любящего Брана; только Робб и маленький Рикон останутся с ней. Ей вдруг сделалось одиноко в таком огромном замке.</p><p class="p1">— Тогда держи его подальше от стен, — отважно промолвила она. — Знаешь, как Бран любит лазать.</p><p class="p1">Нед поцелуями снял слезы с ее глаз, прежде чем они успели упасть.</p><p class="p1">— Спасибо тебе, миледи, — отвечал он. — Я знаю, что тебе тяжело решиться на это.</p><p class="p1">— А как насчет Джона Сноу, милорд? — спросил мейстер Лювин.</p><p class="p1">Кейтилин напряглась, услыхав это имя. Нед ощутил в ней гнев и отодвинулся.</p><p class="p1">Бастарды рождались у многих. Кейтилин уже успела привыкнуть к этому. В первые годы их брака она без удивления узнала, что у Неда есть сын от какой-то девушки, случайно встреченной в военном походе. В конце концов он — мужчина, а они проводили тот год в разлуке. Нед воевал на юге, она оставалась в безопасном замке своего отца в Риверране. Тогда она думала больше о Роббе, младенце возле ее груди, чем о муже, которого едва успела узнать. Нед имел право на любую утеху, которую мог отыскать среди битв. А раз семя его укоренилось, она полагала, что он должен приглядеть за ребенком.</p><p class="p1">Но он сделал большее: Старки не были похожи на обычных людей. Нед взял своего бастарда домой и звал его сыном на глазах всего Севера. И когда война наконец окончилась и Кейтилин переехала в Винтерфелл, Джон вместе с его няней уже находился там.</p><p class="p1">Она восприняла это болезненно. Нед не говорил о матери ребенка ни слова, а в замке не было секретов, и Кейтилин услышала, как служанки повторяют рассказы солдат. Они шептали о сире Эртуре Дейне, Мече Зари, самом искусном воине из семи рыцарей королевской стражи Эйериса, и о том, как их молодой лорд сразил его в поединке. Они рассказывали, как потом Нед повез меч сира Эртура к прекрасной и юной сестре сраженного рыцаря, леди Эшаре Дейн, высокой и светловолосой, с очаровательными фиолетовыми глазами, ожидавшей своей судьбы в замке, именуемом Звездопадом, что стоит на берегах Летнего моря.</p><p class="p1">Потребовалось две недели, чтобы она набралась храбрости, но наконец однажды ночью Кейтилин спросила своего мужа о ней, спросила прямо в лицо.</p><p class="p1">В тот единственный раз за все прошедшие годы Нед испугал ее.</p><p class="p1">— Никогда не спрашивай меня о матери Джона, — отвечал он голосом холодным как лед. — Джон от моей крови, и большего тебе знать не нужно. А теперь я хочу выяснить, где моя госпожа узнала это имя.</p><p class="p1">Ей пришлось повиноваться, она все рассказала, и с этого дня все сплетни прекратились, а имя Эшары Дейн никогда более не упоминалось в Винтерфелле.</p><p class="p1">Кем бы ни была мать Джона, Нед, наверное, пылко любил ее, потому что никакие уговоры Кейтилин не могли заставить его отослать мальчика. Лишь этого она не могла простить ему. Кейтилин научилась любить мужа всем сердцем, но так и не сумела заставить себя полюбить Джона. Ради любви к Неду она стерпела бы и дюжину бастардов, если бы только их не было на глазах, но Джон никогда не отлучался из замка, и вырастая, он становился похожим на Неда больше, чем любой из его законных сыновей, что лишь ухудшало положение дел.</p><p class="p1">— Джон должен уехать, — сказала она.</p><p class="p1">— Они с Роббом дружат, — проговорил Нед. — Я надеялся…</p><p class="p1">— Он не может оставаться в Винтерфелле, — обрезала его Кейтилин. — Он твой сын, а не мой. Я не потерплю его здесь. — Жестоко, она понимала это, но ничего изменить не могла. Нед не обрадует парня, оставив его в Винтерфелле.</p><p class="p1">Муж отвечал ей раненым взором.</p><p class="p1">— Ты знаешь, я не могу взять его на юг. Для него нет места при дворе. Мальчишка — бастард… ты знаешь, что будут о нем говорить. Его заклюют.</p><p class="p1">Кейтилин решила не уступать мужу, несмотря на его просящий взгляд.</p><p class="p1">— Говорят, что твой приятель Роберт сам является отцом дюжины бастардов.</p><p class="p1">— И никого из них не видели при дворе! — вспыхнул Нед. — Ланнистерша позаботилась об этом. Как ты можешь быть настолько жестокой, Кейтилин? Это всего лишь мальчишка. И он…</p><p class="p1">Ярость накатила на него. Он сказал бы и худшее, но вмешался мейстер Лювин.</p><p class="p1">— Возможно другое решение, — проговорил он спокойным голосом. — Несколько дней назад ваш брат Бенджен явился ко мне с разговором о Джоне. Похоже, мальчика тянет к Черным Братьям.</p><p class="p1">Нед казался потрясенным.</p><p class="p1">— Он захотел вступить в Ночной Дозор?!</p><p class="p1">Кейтилин отошла к окну. Пусть Нед все обдумает, сейчас ей лучше промолчать. И все же она охотно бы расцеловала мейстера за идеальное решение. Бенджен Старк принес братскую присягу. Джон будет сыном ему, ребенком, которого у него иначе никогда бы не было. Со временем мальчик и сам даст обет. У него не будет сыновей, которые когда-нибудь смогут оспорить право внуков Кейтилин на Винтерфелл.</p><p class="p1">Мейстер Лювин сказал:</p><p class="p1">— Служить на Стене — великая честь, милорд.</p><p class="p1">— И даже бастард может высоко подняться в Ночном Дозоре, — заметил Нед. И все же в голосе его слышалась тревога. — Но Джон так молод. Если бы он попросил об этом в более зрелом возрасте, это было бы другое дело, но в четырнадцать лет…</p><p class="p1">— Суровая жертва, — согласился мейстер Лювин. — Но жестоки и времена, милорд. Его дорога не будет горше пути, что ждет вас и госпожу.</p><p class="p1">Кейтилин подумала о тех детях, которых ей предстоит потерять. Смолчать было нелегко.</p><p class="p1">Нед отвернулся от окна, и лицо его помрачнело. Пройдя несколько шагов, он повернул назад.</p><p class="p1">— Очень хорошо, — обратился он к мейстеру Лювину. — Наверное, так будет лучше. Я переговорю с Беном.</p><p class="p1">— А когда мы скажем Джону? — спросил мейстер.</p><p class="p1">— Когда это потребуется. Пока нужно сделать приготовления. Возможно, пройдет пара недель, прежде чем мы сумеем подготовиться к дороге. Пусть Джон порадуется этим последним дням. Лето скоро закончится, а с ним и его детство. Когда придет зима, я сам скажу ему.</p></span>
