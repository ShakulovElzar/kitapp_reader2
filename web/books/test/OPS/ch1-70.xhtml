<span id="id68"><div class="title2">
<p class="p">Санса</p>
</div><p class="p1">В верхнем помещении башни, в самом сердце крепости Мейегора, Санса провалилась во тьму.</p><p class="p1">Она задвинула занавески вокруг постели; засыпала, просыпалась рыдая, засыпала снова. А когда не могла спать, просто лежала под одеялом, сотрясаясь от горя. Слуги приходили и уходили, приносили еду, но она не могла даже видеть ее. Блюда ставили на стол под окно; там еда только кисла, потом слуги забирали ее.</p><p class="p1">Иногда ее одолевал свинцовый, лишенный видений сон, тогда просыпалась она еще более усталой. И все же это было лучше, чем видеть во сне отца. Бодрствующая или сонная, она видела его; видела, как золотые плащи бросают его на мрамор, видела сира Илина, извлекающего меч из-за плеча, видела тот момент… момент, когда… она хотела отвернуться, хотела! Только ноги вдруг подвели ее, она упала на колени, но почему-то не отвернула головы. Все кричали и визжали вокруг, принц улыбался ей, улыбался! И она почувствовала себя в безопасности, но только на мгновение, пока он не сказал эти слова, и ноги ее отца… это она помнила, его ноги, как они дернулись, когда сир Илин… когда меч…</p><p class="p1">Быть может, я тоже скоро умру, сказала себе Санса, и мысль эта не показалась ей столь уж ужасной. Если она выбросится из окна, то все страдания окончатся, ну а потом певцы сложат песни о ее горе. Тело ее останется на камнях; разбитая и невинная, она посрамит всех, кто предал ее. Санса даже дошла до окна, открыла ставни, но тут отвага оставила ее, и, рыдая, она упала в постель.</p><p class="p1">Приносившие ей пищу служанки пытались завести с ней разговор, но она не отвечала. Однажды явился великий мейстер Пицель со своими бутылочками и флакончиками, чтобы спросить, не заболела ли она. Он потрогал ее лоб, заставил раздеться и осмотрел — всю, — пока служанка придерживала ее. А потом дал настой из трав на медовой воде и велел ей проглатывать по глотку каждый вечер. Она выпила сразу все и провалилась в сон.</p><p class="p1">Ей снились шаги на лестнице башни, зловещее скрежетание кожи о камень, кто-то крался к ее спальне, шаг за шагом. Она могла только сжаться в комок возле двери и замереть, но он подступал все ближе и ближе. Она знала: это сир Илин Пейн идет за ней со Льдом в руках, чтобы снять голову и с нее. Бежать было некуда, прятаться негде, дверь заложить нечем. Наконец шаги смолкли, и она поняла, что он остановился снаружи, разглядывая ее мертвыми глазами на длинном, покрытом рытвинами лице. Заметив свою наготу, она скрючилась, пытаясь прикрыть себя руками, но дверь заскрежетала, распахиваясь, пропуская острие великого меча.</p><p class="p1">Она проснулась со словами:</p><p class="p1">— Пожалуйста, пожалуйста, я буду хорошей, я буду хорошей! Пожалуйста, не надо! — Но слушать было некому.</p><p class="p1">Когда за ней действительно пришли, Санса шагов не услышала. Дверь открыл Джоффри — не сир Илин, а мальчик, который был ее принцем. Свернувшись, она лежала в постели, и за занавеской ей трудно было сказать, день сейчас или полночь. Она вздрогнула, когда хлопнула дверь. Затем шторы вокруг постели отодвинулись, и она прикрыла глаза ладонью, защищаясь от внезапного света, и увидела их, стоявших над ней.</p><p class="p1">— Сегодня днем ты выйдешь ко двору, — проговорил Джоффри. — Умойся и оденься, как подобает моей невесте.</p><p class="p1">Рядом с ним стоял Сандор Клиган в простом коричневом дублете и зеленой мантии, утро сделало его обгорелое лицо особенно жутким. Позади них замерли двое рыцарей Королевской гвардии в длинных белых атласных плащах.</p><p class="p1">Прикрывая себя, Санса натянула одеяло до подбородка.</p><p class="p1">— Нет, — жалобно попросила она. — Пожалуйста, не надо, пожалуйста, оставьте мне жизнь!</p><p class="p1">— Если ты не оденешься сама, мой пес сделает это за тебя, — сказал Джоффри. — Вставай!</p><p class="p1">— Я прошу вас, мой принц…</p><p class="p1">— Я теперь король. Пес, вынь ее из постели. — Сандор Клиган, взяв Сансу за плечи, вытащил ее из перины, невзирая на сопротивление. Одеяло упало на пол. Тонкая ночная рубашка едва прикрывала ее наготу.</p><p class="p1">— Делай, как тебе велят, дитя, — сказал Клиган. — Одевайся. — Он подтолкнул ее к шкафу — едва ли не с добротой.</p><p class="p1">Санса попятилась от них.</p><p class="p1">— Я сделала все, о чем попросила меня королева, я написала письма, написала так, как она мне сказала. Ты обещал мне свою милость. Пожалуйста, отпусти меня домой! Я никого не предам, я буду хорошей, клянусь! Во мне нет крови предателя. Я хочу только домой. — Вспомнив про воспитание, она опустила голову. — Если вы не против, — договорила она слабым голосом.</p><p class="p1">— Я против, — ответил Джоффри. — Мать говорит, что я должен жениться на тебе. Ты останешься здесь и будешь послушной.</p><p class="p1">— Я не хочу выходить за тебя, — простонала Санса. — Ты отрубил голову моему отцу!</p><p class="p1">— Он был предателем, и я никогда не обещал пощадить его, но я обещал ему свою милость и проявил ее. Не будь он твоим отцом, я велел бы разорвать его на части… или четвертовать, или ободрать кожу, но я подарил ему чистую смерть.</p><p class="p1">Санса глядела на Джоффри, словно увидев его впервые. На нем был расшитый львами, отороченный алый дублет и короткий золотой плащ с высоким воротником. Санса удивилась тому, что он мог показаться ей красивым. Мягкие и красные губы, прямо дождевые червяки… глаза тщеславные и жестокие.</p><p class="p1">— Ненавижу тебя, — прошептала она.</p><p class="p1">Лицо короля Джоффри отвердело.</p><p class="p1">— Мать моя утверждает, что королю не подобает бить жену. Сир Меррин!</p><p class="p1">Рыцарь оказался перед ней, прежде чем она успела что-нибудь сообразить; отбросив руку, которой она пыталась защитить лицо, он ударил ее тыльной стороной руки, облаченной в перчатку.</p><p class="p1">Санса не помнила, как упала. Но когда очнулась, обнаружила, что стоит на коленях на тростнике.<a href="ch2.xhtml#id8" class="a">[13]</a> В голове ее звенело. Сир Меррин Трант стоял над ней, кровь обагрила костяшки его белой шелковой перчатки.</p><p class="p1">— Будешь ты повиноваться или ему придется еще раз наказать тебя?</p><p class="p1">Ухо Сансы онемело. Она прикоснулась к нему, ощутив пальцами кровь.</p><p class="p1">— Я… как вам будет угодно, милорд.</p><p class="p1">— Светлейший государь, — поправил ее Джоффри. — Я жду тебя во дворе. — Он повернулся и вышел.</p><p class="p1">Сир Меррин и сир Арис последовали за ним, но Сандор Клиган задержался и грубым рывком поднял ее на ноги.</p><p class="p1">— Избавь себя от хлопот, девица, и дай ему то, что он хочет.</p><p class="p1">— А что… что он хочет? Пожалуйста, скажи мне!</p><p class="p1">— Он хочет, чтобы ты улыбалась, чтобы от тебя сладко пахло и чтобы ты была его дамой, — проскрежетал Пес. — Он хочет услышать те милые словечки, которым тебя научила септа. Он хочет, чтобы ты любила… и боялась его.</p><p class="p1">Когда Пес ушел, Санса опустилась на тростник и глядела на стену до тех пор, пока в опочивальню не заглянули две ее служанки.</p><p class="p1">— Мне нужна горячая вода для ванны, прошу вас, — сказала она, — духи и пудра, чтобы спрятать синяк. — Правая сторона лица ее распухла и уже начинала болеть, но Санса знала, что Джоффри захочет, чтобы она выглядела красиво.</p><p class="p1">Горячая вода заставила ее вспомнить о Винтерфелле и тем принесла силу. Она не мылась с того дня, как умер отец, и удивилась тому, какой грязной сделалась вода. Одна из девушек смыла кровь с ее лица, потерла спину, вымыла волосы и расчесала, пока они не рассыпались густыми осенними завитушками. Санса не разговаривала с ними, только отдавала команды. Они служили Ланнистерам, она их не знала и не доверяла им. Когда настала пора одеваться, Санса выбрала платье зеленого шелка, в котором была на турнире. Она вспомнила всю тогдашнюю любезность Джоффа. Быть может, он тоже вспомнит тот пир и отнесется к ней мягче.</p><p class="p1">Чтобы желудок не волновался, она выпила бокал сливок со сладким печеньем. В середине дня за ней пришел сир Меррин в полном облачении: белой броне из эмалевых чешуек, украшенной золотом, в высоком шлеме с золотым гребнем в виде звезды, поножах, воротнике, перчатках, сапогах из сияющей кожи; тяжелый шерстяной плащ на горле застегивал золотой лев.</p><p class="p1">Забрало он снял, и она теперь отлично видела эту кислую физиономию, мешки под глазами, широкий унылый рот, ржавые волосы, тронутые сединой.</p><p class="p1">— Миледи, — сказал он, отвесив любезный поклон, словно три часа назад ударил ее кто-то другой. — Светлейший государь приказал мне проводить вас в тронный зал.</p><p class="p1">— А приказывал ли он вам еще раз ударить меня, если я откажусь?</p><p class="p1">— Вы отказываетесь идти, миледи? — Сир Меррин поглядел на нее без всякого выражения, даже не обращая внимания на синяк, который оставил на ее лице. «Он не из тех, кто ненавидит меня, — поняла Санса. — Но и не испытывает ко мне симпатии. И вообще никак не относится. Я для него все равно… что вещь».</p><p class="p1">— Нет, — ответила она поднимаясь. Ей хотелось в гневе ударить его, крикнуть, что когда она станет королевой, то прикажет сослать его, если он осмелится ударить ее снова, но, вспомнив слова Пса, Санса сказала: — Я выполню то, что приказывает светлейший государь.</p><p class="p1">— Как и я, — произнес он.</p><p class="p1">— Да… но вы же вовсе не рыцарь, сир Меррин.</p><p class="p1">Тут Сандор Клиган расхохотался бы, Санса знала это. Другой обругал бы ее, велел умолкнуть, наконец, попросил бы прощения. Но сир Меррин Трант не сделал ничего. Он просто не обратил на нее внимания.</p><p class="p1">На балконе не было никого, кроме Сансы; она стояла, склонив голову, пытаясь сдержать слезы, а Джоффри сидел внизу на Железном троне и вершил то, что называл своим правосудием. В девяти случаях из десяти вопросы не были ему интересны, их решения он предоставлял своему совету и только ерзал на престоле, пока лорд Бейлиш, великий мейстер Пицель и королева Серсея разбирали дело. Но когда он выносил решения сам, никто, даже королева-мать, не мог заставить его изменить мнение.</p><p class="p1">Перед Джоффри поставили вора, и он приказал сиру Илину отрубить ему руку, прямо здесь, во дворе. Еще были два рыцаря, поспорившие из-за каких-то земель; Джоффри приказал, чтобы утром они сразились за право владения ими и добавил:</p><p class="p1">— До смерти.</p><p class="p1">Женщина, пав на колени, просила у него голову человека, казненного за измену; она сказала, что любила его и хотела похоронить подобающим образом.</p><p class="p1">— Если ты любила предателя, значит, и ты предательница, — решил Джоффри. Двое золотых плащей увлекли просительницу вниз в темницу.</p><p class="p1">Лягушачья физиономия лорда Слинта маячила в конце стола совета; новоявленный лорд был облачен в черный бархатный дублет, блестящий плащ с капюшоном из золотой парчи и сопровождал одобрительным кивком каждый приговор короля. Санса с ненавистью глядела на уродливую рожу, вспоминая, что именно он бросил отца перед сиром Илином. Ей хотелось самой ударить его, хотелось, чтобы какой-нибудь герой бросил его на пол и отсек голову. Но голос в душе ее шептал: «Это не герои». И она вспомнила, что говорил ей лорд Петир на этом самом месте.</p><p class="p1">— Жизнь — не песня, моя милая, — сказал он тогда. — Однажды ты это узнаешь, к собственной скорби.</p><p class="p1">В жизни побеждают чудовища, напомнила она себе и вновь услышала голос Пса, скрежет металла о камень. Избавь себя от хлопот, девица, дай ему то, что он просит…</p><p class="p1">Последним привели пухлого певца, который в таверне пел песню, осмеивавшую покойного короля Роберта. Джоффри приказал принести арфу и велел певцу спеть. Тот плакал, клялся, что никогда не будет петь эту песню, но король настоял. Действительно забавная песня повествовала о схватке Роберта со свиньей. Свиньей здесь был назван вепрь, который убил короля. Санса знала это, но некоторые куплеты явно намекали на королеву. Когда песня закончилась, Джоффри объявил, что он решил проявить милосердие. Завтра певец останется либо без пальцев, либо без языка. И пусть сам выбирает. Янос Слинт кивнул.</p><p class="p1">Санса с облегчением поняла, что это последнее решение. Однако испытания не закончились. Когда герольд отпустил двор, она торопливо спустилась с балкона, лишь для того, чтобы обнаружить Джоффри у подножия лестницы. Его сопровождали Пес и сир Меррин.</p><p class="p1">Король критически осмотрел ее с ног до головы.</p><p class="p1">— Ты выглядишь намного лучше, чем прежде.</p><p class="p1">— Спасибо, светлейший государь, — ответила Санса. Пустые слова, однако же он кивнул и улыбнулся.</p><p class="p1">— Пойдем со мной, — проговорил Джоффри, предлагая ей руку. И ей не оставалось ничего другого, как принять ее. Когда-то одно прикосновение привело бы ее в восторг, теперь же кожа ее съежилась от отвращения.</p><p class="p1">— Скоро день моих именин, — сказал Джоффри, когда они вышли из тронного зала. — Будет великий пир и подарки. Что ты подаришь мне?</p><p class="p1">— Я… не думала об этом, милорд.</p><p class="p1">— Светлейший государь, — резко напомнил он. — Ты действительно глупая девушка, так? Мать моя утверждает это.</p><p class="p1">— В самом деле? — После всего, что случилось, слова эти не должны были ранить ее, но каким-то образом получилось иначе. Ведь королева всегда была добра к ней.</p><p class="p1">— Ах да. Ее волнует, что наши дети могут оказаться такими же глупыми, как и ты. Но я приказал ей не беспокоиться. — Король повел рукой, и сир Меррин открыл перед ними дверь.</p><p class="p1">— Благодарю вас, светлейший государь, — пробормотала она. Пес был прав, подумала Санса. Я всего лишь крохотная пташка, повторяющая слова, которым меня научили.</p><p class="p1">Солнце опустилось за западную стену, и камни Красного замка загорелись кровью.</p><p class="p1">— Я сделаю тебе ребенка, как только ты созреешь для этого. — Джоффри провожал ее через двор. — Если первый окажется глупым, я отрублю тебе голову и возьму себе жену посмышленей. А когда ты сможешь рожать детей?</p><p class="p1">Санса не могла поглядеть на него, так ей было стыдно…</p><p class="p1">— Септа Мордейн утверждает, что… знатные девушки расцветают в двенадцать или тринадцать лет.</p><p class="p1">Джоффри кивнул:</p><p class="p1">— Да. — Он повел ее в караульный дом, к подножию лестницы, выводящей на стену.</p><p class="p1">Санса отодвинулась от него, затрепетала. Она вдруг поняла, куда они направляются.</p><p class="p1">— Нет, — проговорила она, испуганно охнув. — Пожалуйста, не заставляй меня, прошу тебя.</p><p class="p1">Джоффри поджал губы.</p><p class="p1">— Я хочу показать тебе, что бывает с изменниками.</p><p class="p1">Санса отчаянно затрясла головой:</p><p class="p1">— Не надо. Не надо!</p><p class="p1">— Я велю сиру Меррину отнести тебя наверх, — сказал он. — Тебе это не понравится. Лучше делай то, что я говорю. — Джоффри потянулся к ней, но Санса отодвинулась, наткнувшись на Пса.</p><p class="p1">— Делай, девица, — сказал Сандор Клиган, подталкивая ее к королю. Рот его дернулся на обгорелой стороне лица, и Санса почти что услышала: он все равно велит отнести тебя наверх, так что делай, как он хочет.</p><p class="p1">Санса заставила себя принять руку короля Джоффри. Подъем показался ей мукой, каждую ступеньку она преодолевала с трудом, словно бы ей приходилось вытаскивать ноги, по лодыжку увязавшие в глине. Даже ступеней оказалось много больше, чем ей казалось. Их была тысяча тысяч, и на стене ее ожидал ужас.</p><p class="p1">С высоких укреплений караульного дома перед Сансой открылся весь мир. Она увидела Великую септу Бейелора на холме Висеньи, где умер ее отец. На другой стороне улицы Сестер высились опаленные огнем руины Драконьего Дома. На западе распухшее красное солнце опускалось за Божьи ворота. Соленое море осталось за ее спиной, на юге рыбный рынок и причалы выстроились у бурной реки. А на севере…</p><p class="p1">Она поглядела в ту сторону, но увидела только улицы, переулки, холмы и низины, новые улицы и переулки, камень далеких стен. И все же Санса знала, что за ними начинается открытый простор, фермы, леса и поля, а еще дальше, далеко-далеко на севере высится Винтерфелл.</p><p class="p1">— Куда ты смотришь? — проговорил Джоффри. — Я не это хотел тебе показать.</p><p class="p1">Толстый каменный парапет укреплял внешний край стены, поднимаясь до подбородка Сансы, через каждые пять футов в нем были устроены бойницы для стрелков. Головы выставили между бойницами, насадив на железные пики так, чтобы они были обращены лицом к городу. Санса заметила их в тот самый момент, когда ступила на стену, но река, улицы, полные людей, и заходящее солнце были много прекраснее.</p><p class="p1">Он может заставить меня смотреть на головы, сказала она себе, но он не в силах заставить увидеть их.</p><p class="p1">— Эта вот принадлежит твоему отцу, — сказал Джоффри. — Вот она. Пес, поверни, пусть она увидит ее. — Сандор Клиган взял голову за волосы и повернул. Отрубленная голова была облита смолой — для сохранности. Санса спокойно глядела на нее и не видела. Голова совсем не была похожа на лорда Эддарда Старка, она даже казалась ненастоящей.</p><p class="p1">— Сколько я должна смотреть?</p><p class="p1">Джоффри казался разочарованным.</p><p class="p1">— Может быть, ты хочешь увидеть и остальные? — Головы выстроились в длинный ряд.</p><p class="p1">— Если это угодно светлейшему государю.</p><p class="p1">Джоффри провел ее вдоль стены мимо дюжины голов и двух пустых пик.</p><p class="p1">— Эти я приберегаю для моих дядьев — лордов Станниса и Ренли, — объяснил он.</p><p class="p1">Остальные головы пробыли на стене много дольше, чем голова ее отца. Невзирая на смолу, их уже почти невозможно было узнать. Король показал на одну из них и заметил:</p><p class="p1">— А вот твоя септа.</p><p class="p1">Санса даже не могла понять, что это женщина: челюсть уже отвалилась, птицы выклевали ухо и большую часть щеки.</p><p class="p1">Санса все гадала, что случилось с септой Мордейн, и думала, что давно поняла это.</p><p class="p1">— Почему вы убили ее? — спросила она. — Она присягнула богам…</p><p class="p1">— Она была предательницей. — Джоффри надулся, Санса чем-то вызвала его недовольство. — А ты еще не сказала мне, что хочешь подарить мне на день рождения. Быть может, это мне следует сделать тебе подарок, как тебе это понравится?</p><p class="p1">— Если это угодно вам, милорд, — ответила Санса.</p><p class="p1">Когда он улыбнулся, Санса поняла, что он издевается над ней.</p><p class="p1">— Твой брат тоже предатель, ты это знаешь. — Он повернул голову септы Мордейн назад. — Помню твоего брата по Винтерфеллу. Мой Пес назвал его лордом деревянного меча. Так было, Пес?</p><p class="p1">— В самом деле? — спросил Клиган. — Я не помню.</p><p class="p1">Джоффри воинственно дернул плечами.</p><p class="p1">— Твой брат победил моего дядю Джейме. Мать говорит, что он сделал это предательством и обманом. Она плакала, услыхав об этом. Все женщины слабы, даже мать, хотя она старается изобразить, что это не так. Она утверждает, что нам нужно оставаться в Королевской Гавани и ждать прихода войск Ренли и Станниса, но я не хочу ждать. После пира в честь моих именин я соберу войско и сам убью твоего брата. И тогда сделаю тебе подарок, леди Санса, подарю голову твоего брата.</p><p class="p1">Какое-то подобие безумия охватило Сансу, и она услышала собственный голос:</p><p class="p1">— А что, если это мой брат подарит мне твою голову?</p><p class="p1">Джоффри нахмурился:</p><p class="p1">— Ты не должна говорить со мной так. Верная жена не смеется над своим господином. Сир Меррин, поучи ее!</p><p class="p1">На этот раз рыцарь поднял ее голову за подбородок и ударил, не выпуская, ударил дважды. Сперва по правой, а потом по левой щеке. Он рассек Сансе губу, и кровь побежала по ее щеке, смешиваясь с солеными слезами.</p><p class="p1">— Тебе не следует все время плакать, — сказал ей Джоффри. — Тебе идет, когда ты улыбаешься и смеешься.</p><p class="p1">Санса заставила себя улыбнуться, чтобы он не приказал сиру Меррину снова ударить ее; однако король не был доволен и опять качнул головой.</p><p class="p1">— Сотри кровь, ты вся перепачкалась.</p><p class="p1">Внешний парапет доходил ей до подбородка, но с внутренней стороны верх стены ничто не ограждало; внизу, в семидесяти или восьмидесяти футах, был двор. «Нужно только толкнуть, — сказала она себе, — он стоит как раз там, где надо, улыбаясь этими жирными червяками. Ты можешь сделать это. Ты можешь. Так сделай прямо сейчас. Не важно, даже если ты последуешь за ним. Это ничего не значит!»</p><p class="p1">— Ну-ка, девочка. — Сандор Клиган склонился перед Сансой, встав между ней и Джоффри. С деликатностью, удивительной для такого рослого человека, он промокнул кровь, выступившую на ее разбитой губе.</p><p class="p1">Мгновение было утеряно. Санса закрыла глаза.</p><p class="p1">— Спасибо, — сказала она, когда Клиган закончил. Она была доброй девочкой и всегда помнила про хорошие манеры.</p></span>
